<title id="t">09-production-operation: work products by gate and status</title>
<desc id="d">Work products of 09-production-operation from WP-M-00 §3, by the gates they are needed for: WP-O-01 Installation, provisioning and production control: G5, Draft; WP-O-02 Operation, service (maintenance, repair) and decommissioning: G5, Draft; WP-O-03 User information and safety warnings: G5, Draft; WP-O-04 Field monitoring (safety, SOTIF and AI) and crash reporting: G6, Draft; WP-O-05 Cybersecurity incident response, vulnerability management and software updates: G6, Draft.</desc>
