<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1221" viewBox="0 0 640 1221" role="img" aria-labelledby="t d">
<title id="t">Figure 6-1. Update path today and the target (WP-S-07 §3.6, WP-O-05 §6)</title>
<desc id="d">Figure 6-1: the update path today and the target. Where it comes from: today whatever branch the device is set to follow, from a configurable origin; target a fixed origin and the release channel only (CSR-122 not met). Before anything is staged: today nothing signed by liondriver: tls is the only check; target a release manifest signed with the offline key (ECDSA P-256, SHA-256), checked with a pinned public key (CSR-121 not implemented). The code: today checked out and cleaned exactly as fetched; target the fetched tree checked against the manifest commit and its submodule pins (CSR-121 not implemented). System images: today checked against hashes that came in the same unsigned tree; target every artefact hash checked against the manifest before use (CSR-121 not implemented). An older release: today not refused; target refused unless it is a signed rollback release (CSR-123 not implemented). Until the target exists automatic updates are off and releases are installed by hand with a hash comparison (CSR-124). The manifest lists release ID, git tree commit, with submodule pins, AGNOS version and image hashes, panda image hash, model artefact hashes, minimum version.</desc>
