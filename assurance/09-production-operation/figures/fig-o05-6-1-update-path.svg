<rect class="bg" width="640" height="1221"/>
<text x="24" y="34" class="h">Update path: today and the target</text>
<text x="24" y="56" class="t2">What the device trusts before it stages an update (WP-S-07 §3.6)</text>
<text x="24" y="76" class="t2b">Schematic · no evidence credit · generated by fig_o05_updates.py</text>
<line x1="24" y1="90" x2="616" y2="90" class="hair"/>
<text x="24" y="120" class="tl">Today: inherited updater</text>
<text x="332" y="120" class="tl">Target: signed release</text>
<text x="24" y="140" class="t2">as the code stands</text>
<text x="332" y="140" class="t2">designed, not built</text>
<text x="24" y="172" class="t2b">1  Where it comes from</text>
<rect x="24" y="180" width="284" height="94" rx="8" class="badbox"/>
<text x="36" y="204" class="t">Whatever branch the device is</text>
<text x="36" y="224" class="t">set to follow, from a</text>
<text x="36" y="244" class="t">configurable origin</text>
<rect x="332" y="180" width="284" height="94" rx="8" class="plan"/>
<text x="344" y="204" class="t">A fixed origin and the release</text>
<text x="344" y="224" class="t">channel only</text>
<rect x="344" y="238" width="134.3" height="20" rx="10" class="f-bad"/>
<text x="411.2" y="252" class="chip" text-anchor="middle">CSR-122 · Not met</text>
<text x="24" y="298" class="t2b">2  Before anything is staged</text>
<rect x="24" y="306" width="284" height="134" rx="8" class="badbox"/>
<text x="36" y="330" class="t">Nothing signed by LionDriver:</text>
<text x="36" y="350" class="t">TLS is the only check</text>
<rect x="332" y="306" width="284" height="134" rx="8" class="plan"/>
<text x="344" y="330" class="t">A release manifest signed with</text>
<text x="344" y="350" class="t">the offline key (ECDSA P-256,</text>
<text x="344" y="370" class="t">SHA-256), checked with a pinned</text>
<text x="344" y="390" class="t">public key</text>
<rect x="344" y="404" width="190" height="20" rx="10" class="f-bad"/>
<text x="439" y="418" class="chip" text-anchor="middle">CSR-121 · Not implemented</text>
<text x="24" y="464" class="t2b">3  The code</text>
<rect x="24" y="472" width="284" height="114" rx="8" class="badbox"/>
<text x="36" y="496" class="t">Checked out and cleaned exactly</text>
<text x="36" y="516" class="t">as fetched</text>
<rect x="332" y="472" width="284" height="114" rx="8" class="plan"/>
<text x="344" y="496" class="t">The fetched tree checked against</text>
<text x="344" y="516" class="t">the manifest commit and its</text>
<text x="344" y="536" class="t">submodule pins</text>
<rect x="344" y="550" width="190" height="20" rx="10" class="f-bad"/>
<text x="439" y="564" class="chip" text-anchor="middle">CSR-121 · Not implemented</text>
<text x="24" y="610" class="t2b">4  System images</text>
<rect x="24" y="618" width="284" height="94" rx="8" class="badbox"/>
<text x="36" y="642" class="t">Checked against hashes that came</text>
<text x="36" y="662" class="t">in the same unsigned tree</text>
<rect x="332" y="618" width="284" height="94" rx="8" class="plan"/>
<text x="344" y="642" class="t">Every artefact hash checked</text>
<text x="344" y="662" class="t">against the manifest before use</text>
<rect x="344" y="676" width="190" height="20" rx="10" class="f-bad"/>
<text x="439" y="690" class="chip" text-anchor="middle">CSR-121 · Not implemented</text>
