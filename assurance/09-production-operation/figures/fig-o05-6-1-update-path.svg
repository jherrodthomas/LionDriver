<rect x="24" y="744" width="284" height="94" rx="8" class="badbox"/>
<text x="36" y="768" class="t">Not refused</text>
<rect x="332" y="744" width="284" height="94" rx="8" class="plan"/>
<text x="344" y="768" class="t">Refused unless it is a signed</text>
<text x="344" y="788" class="t">rollback release</text>
<rect x="344" y="802" width="190" height="20" rx="10" class="f-bad"/>
<text x="439" y="816" class="chip" text-anchor="middle">CSR-123 · Not implemented</text>
<rect x="24" y="854" width="592" height="135" rx="8" class="amb"/>
<text x="36" y="878" class="tb">In the reference configuration until then</text>
<text x="36" y="899" class="t">Automatic updates are switched off. The maintainer installs each</text>
<text x="36" y="919" class="t">release by hand and compares its hashes with the release record</text>
<text x="36" y="939" class="t">(WP-O-02 UPD-02).</text>
<rect x="36" y="953" width="197" height="20" rx="10" class="f-unv"/>
<text x="134.5" y="967" class="chip" text-anchor="middle">CSR-124 · Mechanism exists</text>
<rect x="24" y="1003" width="592" height="116" rx="8" class="card"/>
<text x="36" y="1027" class="tb">What the signed manifest will list</text>
<text x="604" y="1027" class="t2" text-anchor="end">WP-S-07 §3.6</text>
<text x="36" y="1059" class="t">· release ID</text>
<text x="36" y="1081" class="t">· git tree commit, with submodule pins</text>
<text x="36" y="1103" class="t">· AGNOS version and image hashes</text>
<text x="326" y="1059" class="t">· panda image hash</text>
<text x="326" y="1081" class="t">· model artefact hashes</text>
<text x="326" y="1103" class="t">· minimum version</text>
<text x="24" y="1145" class="t2">Format, channel and signing pipeline are not defined yet (WP-P-10 OI-4); the</text>
<text x="24" y="1163" class="t2">device-side rollback procedure is open (OI-6). Chips: the WP-S-07 §4.12 status of</text>
<text x="24" y="1181" class="t2">each requirement.</text>
<text x="24" y="1199" class="t2">Update management per WP-O-05 §6; UN R156 informative, not claimed.</text>
