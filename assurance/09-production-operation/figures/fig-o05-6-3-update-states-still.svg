<svg xmlns="http://www.w3.org/2000/svg" width="640" height="986" viewBox="0 0 640 986" role="img" aria-labelledby="t d">
<title id="t">Figure 6-3. An update's states and where a failure goes (WP-O-05 §6.2)</title>
<desc id="d">Figure 6-3: an update's states. Release published: Manifest and panda image signed (U3, U4). Receipt (ISO 24089: receipt): Fetched to staging; nothing that runs changes. Verify gate (a gate, not a step): Manifest signature, the tree, every hash, the version (CSR-121 not implemented, CSR-123 not implemented). Install (ISO 24089: installation): Offroad only, atomic, into a staged copy (CSR-125 partial). Activate (ISO 24089: activation): At the next start, offroad. Confirm: Parameters checked against the release record (U6); installation recorded (U9). Running the new release: . A release refused at the gate is not staged and the installed release keeps running. A failure while installing, starting or confirming falls back to the previous release, which remains bootable, or, as the UN R156 alternative not defined for LionDriver, to a safe state.</desc>
