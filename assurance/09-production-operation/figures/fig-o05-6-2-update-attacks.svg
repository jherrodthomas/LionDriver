<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1310" viewBox="0 0 640 1310" role="img" aria-labelledby="t d">
<title id="t">Figure 6-2. Update threats: entry and gate (WP-S-07 §4.12, WP-O-05 §6)</title>
<desc id="d">Figure 6-2: five update threats on one topology of signing key, release origin, network, device and panda. Forged or altered release at the source (R155 Annex 5 12.1, 12.3): enters at the release origin; gate CSR-121, not implemented, no control yet: gets through. Code LionDriver never signed runs on every device that updates. Device sent to another origin or branch (R155 Annex 5 12.1): enters at the device (soc); gate CSR-122, not met, no control yet: gets through. The device installs from a source nobody released. Older release replayed to downgrade (R155 Annex 5 6.3): enters at the network; gate CSR-123, not implemented, no control yet: gets through. A release with known weaknesses goes back on. Install cut short, by fault or on purpose (UN R156 7.2.2.1.1 (informative)): enters at the device (soc); gate CSR-125, partial, partly built: some gets through. A half-installed release; the previous one is meant to stay bootable. Update-signing key stolen (R155 Annex 5 12.4): enters at the signing key; gate CSR-126, not implemented, no control yet: gets through. Forged releases pass every device check, even once CSR-121 is built.</desc>
