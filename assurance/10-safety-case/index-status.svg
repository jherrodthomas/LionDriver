<title id="t">10-safety-case: work products by gate and status</title>
<desc id="d">Work products of 10-safety-case from WP-M-00 §3, by the gates they are needed for: WP-K-01 Safety case (GSN, integrated FuSa, SOTIF and AI argument): G1→G5 (living), Draft; WP-K-02 SOTIF achievement evaluation and release recommendation: G5, Skeleton; WP-K-03 Cybersecurity case: G5, Draft; WP-K-04 Functional safety assessment report (performed independently, I3): G5, Skeleton; WP-K-05 Cybersecurity assessment report (performed independently): G5, Skeleton; WP-K-06 Release for production / release record: G5, Skeleton.</desc>
