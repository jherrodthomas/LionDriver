<text x="145.0" y="933.5" class="id">G1</text>
<text x="145.0" y="947.0" class="d">Hazards from E/E malfunctions of the</text>
<text x="145.0" y="959.5" class="d">item are reduced to a tolerable level:</text>
<text x="145.0" y="972.0" class="d">every safety goal SG-01…SG-07 is met</text>
<text x="145.0" y="984.5" class="d">with the integrity of its ASIL.</text>
<text x="145.0" y="998.5" class="sh">developed on sheet 2</text>
