<rect width="100%" height="100%" fill="#fff"/>
<text x="30" y="36" class="h">Safety case — argument from G0  (sheet 1 of 6)</text>
<rect x="1625.5" y="70" width="230" height="130.0" class="g"/>
<text x="1740.5" y="89" class="id">G0</text>
<text x="1740.5" y="102.5" class="d">The LionDriver reference</text>
<text x="1740.5" y="115.0" class="d">configuration, operated by an</text>
<text x="1740.5" y="127.5" class="d">attentive driver within its ODD, does</text>
<text x="1740.5" y="140.0" class="d">not pose unreasonable risk to vehicle</text>
<text x="1740.5" y="152.5" class="d">occupants or other road users. The</text>
<text x="1740.5" y="165.0" class="d">residual risk is no worse than manual</text>
<text x="1740.5" y="177.5" class="d">driving of the same vehicle with its</text>
<text x="1740.5" y="190.0" class="d">stock TSS 2.0 driver assistance.</text>
<rect x="1866.5" y="70" width="190" height="79.0" rx="14" class="ctx"/>
<text x="1961.5" y="88" class="cid">C1</text>
<text x="1961.5" y="100.5" class="cs">Item definition: functions</text>
<text x="1961.5" y="113.0" class="cs">F-01…F-09, elements E-01…E-06,</text>
<text x="1961.5" y="125.5" class="cs">interfaces IF-01…IF-09</text>
<text x="1961.5" y="138.0" class="cs">[WP-C-01]</text>
<rect x="1866.5" y="157.0" width="190" height="54.0" rx="14" class="ctx"/>
<text x="1961.5" y="175.0" class="cid">C2</text>
<text x="1961.5" y="187.5" class="cs">ODD and intended functionality</text>
<text x="1961.5" y="200.0" class="cs">[WP-C-02]</text>
<rect x="1866.5" y="219.0" width="190" height="104.0" rx="14" class="ctx"/>
<text x="1961.5" y="237.0" class="cid">C3</text>
<text x="1961.5" y="249.5" class="cs">Reference configuration: 2020</text>
<text x="1961.5" y="262.0" class="cs">Corolla LE ICE TSS2</text>
<text x="1961.5" y="274.5" class="cs">(TOYOTA_COROLLA_TSS2), one</text>
<text x="1961.5" y="287.0" class="cs">recorded device revision +</text>
<text x="1961.5" y="299.5" class="cs">Toyota harness, tagged</text>
<text x="1961.5" y="312.0" class="cs">LionDriver release [WP-M-01…</text>
<rect x="1866.5" y="331.0" width="190" height="91.5" rx="14" class="ctx"/>
<text x="1961.5" y="349.0" class="cid">C4</text>
<text x="1961.5" y="361.5" class="cs">Hazard log: H-01…H-06, H-08;</text>
<text x="1961.5" y="374.0" class="cs">HE-01.1…HE-08.1; SG-01…SG-07</text>
<text x="1961.5" y="386.5" class="cs">[WP-C-03]; SH-01…SH-13</text>
<text x="1961.5" y="399.0" class="cs">[WP-C-05]; TARA damage</text>
<text x="1961.5" y="411.5" class="cs">scenarios [WP-C-09]</text>
<rect x="1866.5" y="430.5" width="190" height="79.0" rx="14" class="ctx"/>
<text x="1961.5" y="448.5" class="cid">C5</text>
<text x="1961.5" y="461.0" class="cs">Safety envelope architecture</text>
<text x="1961.5" y="473.5" class="cs">pattern: QM SoC stack bounded</text>
<text x="1961.5" y="486.0" class="cs">by the opendbc safety mode on</text>
<text x="1961.5" y="498.5" class="cs">the panda MCU [WP-M-01 §4.1]</text>
<rect x="1866.5" y="517.5" width="190" height="54.0" rx="14" class="ctx"/>
<text x="1961.5" y="535.5" class="cid">C6</text>
<text x="1961.5" y="548.0" class="cs">Tailoring T-01…T-13 [WP-M-01</text>
<text x="1961.5" y="560.5" class="cs">§5]</text>
<ellipse cx="1961.5" cy="606.5" rx="95.0" ry="31.0" class="ctx"/>
<text x="2052.5" y="639.5" class="aj">A</text>
<text x="1961.5" y="597.5" class="cid">A1</text>
<text x="1961.5" y="610.0" class="cs">AOU-01…AOU-13 hold [WP-C-01</text>
<text x="1961.5" y="622.5" class="cs">§7] — see §5 for status</text>
<ellipse cx="1961.5" cy="693.5" rx="95.0" ry="56.0" class="ctx"/>
<text x="2052.5" y="751.5" class="aj">J</text>
<text x="1961.5" y="659.5" class="cid">J0</text>
<text x="1961.5" y="672.0" class="cs">"No worse than manual driving</text>
<text x="1961.5" y="684.5" class="cs">with stock TSS 2.0" is the</text>
<text x="1961.5" y="697.0" class="cs">acceptance principle because</text>
<text x="1961.5" y="709.5" class="cs">LD-SDA replaces stock LTA and</text>
<text x="1961.5" y="722.0" class="cs">DRCC; the comparison baseline</text>
<text x="1961.5" y="734.5" class="cs">is what the driver would…</text>
