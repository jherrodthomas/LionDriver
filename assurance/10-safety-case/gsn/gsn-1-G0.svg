<text x="1051.0" y="933.5" class="id">G3</text>
<text x="1051.0" y="947.0" class="d">The ML components (driving model, DM</text>
<text x="1051.0" y="959.5" class="d">model) are adequately specified,</text>
<text x="1051.0" y="972.0" class="d">developed, validated and monitored for</text>
