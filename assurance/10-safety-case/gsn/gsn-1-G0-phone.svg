<svg xmlns="http://www.w3.org/2000/svg" width="640" height="846" viewBox="0 0 640 846" role="img" aria-labelledby="t d">
<title id="t">Safety case (GSN), sheet 1: G0, phone view</title>
<desc id="d">Safety case (GSN), sheet 1 of 6 as an outline: G0, The LionDriver reference configuration, operated by an attentive driver within its ODD, does not pose unreasonable risk to vehicle occupants or other road users. The residual risk is no worse than manual driving of the same vehicle with its stock TSS 2.0 driver assistance. S0 (strategy); G1 (goal, developed on sheet 2); G2 (goal, developed on sheet 4); G3 (goal, defeaters DF-15, developed on sheet 5); G4 (goal, defeaters DF-22 DF-23 DF-19 DF-29 DF-37); Sn-68 (solution, partial); Sn-70 (solution, partial); G5 (goal, developed on sheet 6); Sn-49 (solution, partial); Sn-55 (solution, partial); Sn-56 (solution, partial). 0 of 5 solutions available.</desc>
<style>
