<text x="68" y="172.0" class="pid">S1.1</text>
<text x="132" y="172.0" class="t">Argue over (i) envelope limits keep any command controllable, (ii)</text>
<text x="132" y="190.0" class="t">the limits are enforced by an element of sufficient integrity, (iii)</text>
<text x="132" y="208.0" class="t">faults of the enforcing element are detected and reacted to in FTTI</text>
