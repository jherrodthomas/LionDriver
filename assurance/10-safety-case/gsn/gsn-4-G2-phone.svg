<svg xmlns="http://www.w3.org/2000/svg" width="640" height="839" viewBox="0 0 640 839" role="img" aria-labelledby="t d">
<title id="t">Safety case (GSN), sheet 4: G2, phone view</title>
<desc id="d">Safety case (GSN), sheet 4 of 6 as an outline: G2, Hazards from functional insufficiencies of the intended functionality and from reasonably foreseeable misuse are acceptably low. S2 (strategy); G2.1 (goal, defeaters DF-15 DF-08 DF-07); Sn-40 (solution, partial); Sn-41 (solution, partial); Sn-42 (solution, missing); G2.2 (goal, defeaters DF-16 DF-35 DF-41); Sn-43 (solution, missing); Sn-44 (solution, partial); G2.3 (goal, defeaters DF-17 DF-18); Sn-45 (solution, partial); Sn-46 (solution, partial); Sn-47 (solution, partial); G2.4 (goal, undeveloped); Sn-48 (solution, partial). 0 of 9 solutions available.</desc>
