<svg xmlns="http://www.w3.org/2000/svg" width="640" height="642" viewBox="0 0 640 642" role="img" aria-labelledby="t d">
<title id="t">Cybersecurity case (GSN), sheet 1: CG0, phone view</title>
<desc id="d">Cybersecurity case (GSN), sheet 1 of 7 as an outline: CG0, The cybersecurity risks of LD-SDA in its reference configuration are reduced to an acceptable level for release &lt;ld-vX.Y.Z&gt;. CS1 (strategy); CG1 (goal, developed on sheet 2); CG2 (goal, developed on sheet 3); CG3 (goal, developed on sheet 4); CG4 (goal, developed on sheet 5); CG5 (goal, developed on sheet 6); CG6 (goal, developed on sheet 7). 0 of 0 solutions available.</desc>
