# ISO 21448:2022 (SOTIF) as checkable obligations: the second register of the clause-check pilot (README.md).
#
# Every obligation is written in the project's own words from the structure of the standard; no text, table, note,
# annex or example of the standard is reproduced. `clause` is the clause of ISO 21448:2022 (§4 management of the
# SOTIF activities, §5 specification of the function, §6 hazards and acceptance criteria, §7 functional
# insufficiencies and triggering conditions, §8 functional modifications, §9 verification and validation strategy,
# §10 known scenarios, §11 unknown scenarios, §12 achievement of the SOTIF and release, §13 operation phase). The
# sub-clause is left empty until a holder of the licensed standard verifies the row (README §3). An unverified row is
# a proposal (I0, AI-drafted), not an inventory of the standard.
#
# Keys and check kinds as in iso26262-3-2018.yaml. Where a work product holds only a plan or a results template
# (validation runs, residual-risk estimate, release evaluation), the obligation that the activity was carried out is
# a `manual:` check: a section that exists does not show that it was done.
schema_version: 1
standard: ISO 21448:2022
id_prefix: S
