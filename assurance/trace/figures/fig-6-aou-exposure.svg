<rect x="0" y="0" width="1280" height="530" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 6 · Assumption exposure: what rests on each assumption of use</text>
<text x="40" y="66" font-size="12.5" fill="#475569">If an assumption fails, every rating and requirement that credits it is at stake. Unverified assumptions with the most exposure are the first to verify.</text>
<text x="1240" y="44" font-size="11" fill="#475569" text-anchor="end">WP-T-01 §3.2 · WP-C-01 §7</text>
