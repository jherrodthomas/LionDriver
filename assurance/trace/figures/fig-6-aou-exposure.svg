<title>Figure 6 · Assumption exposure</title>
<desc>For each assumption of use, the hazardous events, safety goals, TSRs and HWSRs that credit it: AOU-01 7 HE, 2 SG, 2 TSR; AOU-03 7 HE, 2 SG, 2 TSR; AOU-05 7 HE, 2 SG, 2 TSR; AOU-02 6 HE, 2 SG, 2 TSR; AOU-10 1 HE, 1 TSR; AOU-08 3 TSR; AOU-09 3 TSR; AOU-04 2 TSR; AOU-06 2 TSR; AOU-07 1 TSR; AOU-13 1 HWSR. Not credited: AOU-11, AOU-12, AOU-14, AOU-15, AOU-16.</desc>
