  protects: [SG-01, SG-02, SG-03, SG-04, SG-05, SG-06, SG-07]
  rationale: "Physical access needed; no RX E2E today (GAP-01). TS-14 (risk 5, local to the safety element) points to CAL 3 under §3"
  parent_text: "TS-01 (4), TS-14 (5)"
