- id: CSG-01
  kind: cybersecurity-goal
  text: "The integrity and authenticity of the panda safety configuration (safety mode and parameter) shall be protected so that no unauthenticated SoC-side command can place the envelope in an unsafe configuration"
  parents: [TS-02]
  cal: "CAL 3"
  protects: [SG-01, SG-02, SG-03, SG-04, SG-05, SG-06, SG-07]
  rationale: "Directly defeats the ASIL-C safety envelope from an always-present local interface (GAP-09); highest risk"
  parent_text: "TS-02 (5)"
  status: proposed
  source: WP-C-10

- id: CSG-02
  kind: cybersecurity-goal
  text: "The integrity and authenticity of the panda firmware and its boot chain shall be protected so that only authorized firmware runs on the safety MCU"
  parents: [TS-03, TS-05]
  cal: "CAL 3"
  protects: [SG-01, SG-02, SG-03, SG-04, SG-05, SG-06, SG-07]
  rationale: "Firmware *is* the envelope; boot-pin + dev-bootstub path and weak signing both reach it (GAP-38/24/25)"
  parent_text: "TS-03 (5), TS-05 (4)"
  status: proposed
  source: WP-C-10

- id: CSG-03
  kind: cybersecurity-goal
  text: "Safety-relevant parameters and inter-process messages shall not alter actuation, model output or driver-monitoring behaviour without integrity and authenticity protection"
  parents: [TS-04, TS-12]
  cal: "CAL 2"
  protects: [SG-01, SG-02, SG-03, SG-04, SG-05, SG-06, SG-07, SG-08]
  rationale: "Local access required, but unauthenticated and directly safety-affecting (GAP-20/23)"
  parent_text: "TS-04 (5), TS-12 (4)"
  status: proposed
  source: WP-C-10

- id: CSG-04
  kind: cybersecurity-goal
  text: "ML model artefacts shall be loaded only after their integrity and authenticity are verified, and loading shall not permit code execution from the artefact"
  parents: [TS-09]
  cal: "CAL 2"
  protects: [SG-02, SG-06]
  rationale: "`pickle` load is code execution; delivery needs another channel (GAP-22)"
  parent_text: "TS-09 (4)"
  status: proposed
  source: WP-C-10

- id: CSG-05
  kind: cybersecurity-goal
  text: "The integrity and authenticity of safety-relevant vehicle-CAN messages (received plausibility inputs and transmitted actuation) shall be protected against injection consistent with the physical-access threat"
  parents: [TS-01, TS-14]
