  source: WP-C-10

- id: CSG-06
  kind: cybersecurity-goal
  text: "Remote access and interactive access to the device shall be minimized and authenticated so that a compromised back end or network cannot reach safety functions or exfiltrate personal data"
  parents: [TS-07, TS-08, TS-13]
