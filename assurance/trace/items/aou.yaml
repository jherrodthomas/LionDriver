# AOU items: assumptions of use from WP-C-01 §7 (item definition).
# Source of truth is WP-C-01; this file is a machine-readable copy checked by tools/check_trace.py (check X2).
# Schema: see ../README.md §4.4. Strings are double-quoted single lines (YAML subset, README §4.1).

- id: AOU-01
  kind: aou
  text: "The Toyota EPS limits the torque applied for LKA requests to a level a normal driver can overpower. It rejects or fades out implausible requests, and it ends LKA torque within a bounded time if LKA messages stop (a code comment suggests ≈1.5–2 s, `carstate.py:15-16`)"
  credited_in: "HARA controllability of H-01/H-05"
  verification_approach: "Bench and vehicle characterization: max LKA torque at the wheel, timeout behaviour, fault states"
  aou_status: "Unverified"
  status: proposed
  source: WP-C-01

- id: AOU-02
  kind: aou
  text: "A normal driver can override full LKA torque with steering force within ISO 11270-type limits (order of ≤ 50 N at the rim; to be specified)"
  credited_in: "HARA C-rating H-01, H-05"
  verification_approach: "Vehicle measurement with a steering force gauge"
  aou_status: "Unverified"
  status: proposed
  source: WP-C-01

- id: AOU-03
  kind: aou
  text: "Driver brake pedal application always produces braking regardless of ACC commands, and the PCM cancels ACC on brake application"
  credited_in: "HARA H-05"
  verification_approach: "Vehicle test"
  aou_status: "Unverified"
  status: proposed
  source: WP-C-01

- id: AOU-04
  kind: aou
  text: "The stock PCS/AEB keeps full function with the harness installed and openpilot longitudinal active"
  credited_in: "HARA H-08"
  verification_approach: "Review of forwarded and blocked messages; PCS target test (e.g. soft target)"
  aou_status: "Unverified"
  status: proposed
