  status: proposed
  source: WP-H-01

- id: HWSR-506
  kind: hwsr
  text: "The intercept relay shall be energised only by an active output from the MCU (de-energise-to-safe): any open circuit, MCU reset or loss of drive shall release it."
  asil: "B‡/B"
  parents: [FSR-07.03, TSR-506]
  parent_text: "FSR-07.03 / TSR-506"
  other_parents: false
  allocated_to: "Relay driver, relay, harness"
  hw_kind: "HW"
  verification: "A (schematic), T-HIL"
  baseline_impl: "Relay outputs are open-drain, active-low (`drivers/harness.h:22-28, 98-101`); \"released\" = output high/open. Device-side driver circuit unknown (AOU-13, UK-06). **Harness box side de-energise-to-safe by design:** an undriven SBU1 is pulled to GND through R2+R3 (240 Ω), selecting pass-through (RR-2026-010 (assurance/04-hardware/reviews/RR-2026-010.md) HB-02); an open R2/R3 defeats it (HWSR-506e)"
  status: proposed
  source: WP-H-01

- id: HWSR-506a
  kind: hwsr
  text: "The actual relay contact state (or the continuity of the camera-to-car path) shall be read back by the MCU independently of the drive signal, and a mismatch between commanded and actual state shall be detected within the SG-01 detection budget (≤ 0.3 s) in both directions (stuck released and stuck intercepting)."
  asil: "B‡/B"
  parents: [FSR-01.11, FSR-07.03, TSR-506]
  parent_text: "FSR-01.11, FSR-07.03 / TSR-506"
  other_parents: false
  allocated_to: "Relay auxiliary contact or bus-sense circuit"
  hw_kind: "ADD"
  verification: "A, T-HIL, FI"
  baseline_impl: "**Not implemented (GAP-12).** Current detection is indirect and one-directional: camera control messages seen on the car side after a 1 s transition timeout (`safety.h:372-380`), checked at 1 Hz in `safety_tick` (so 1–2 s). \"Stuck intercepting while commanded released\" is not detected at all. The harness box v3 has no state feedback line, so readback needs a hardware change (RR-2026-010 (assurance/04-hardware/reviews/RR-2026-010.md) F-06). The lead chose to keep comma's box (DQ-209 option A, 2026-10-16), so no readback hardware is planned: this requirement stays not met and its residual is part of the SG-07 deviation argument (DQ-320, queued)"
  status: proposed
  source: WP-H-01

- id: HWSR-506b
  kind: hwsr
  text: "A detected relay malfunction shall inhibit all actuation TX until the next power cycle, and shall be reported to the SoC."
  asil: "B‡"
  parents: [FSR-01.11, TSR-506]
  parent_text: "FSR-01.11 / TSR-506"
  other_parents: false
  allocated_to: "Firmware"
  hw_kind: "CFG"
  verification: "T-HIL"
  baseline_impl: "**Implemented.** `relay_malfunction` blocks TX (`safety.h:252`) and forwarding (`safety.h:268`); reported as `FAULT_RELAY_MALFUNCTION` (`main.c:122-129`); host immediate-disable (`openpilot/selfdrive/selfdrived/selfdrived.py:377`). Cleared on any safety-mode change (`safety.h:427, 459`), not latched to a power cycle"
  status: proposed
  source: WP-H-01

- id: HWSR-506c
  kind: hwsr
  text: "The relay drive path shall not be operable by debug commands in release builds."
  asil: "B‡"
  parents: [FSR-01.10, TSR-506]
  parent_text: "FSR-01.10 / TSR-506"
  other_parents: false
