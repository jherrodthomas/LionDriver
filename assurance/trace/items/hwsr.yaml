  hw_kind: "HW"
  verification: "A (schematic), T-HIL (pull-down forced open)"
  baseline_impl: "**Not met:** the default rests on R2+R3 in series (RR-2026-010 (assurance/04-hardware/reviews/RR-2026-010.md) F-03). Route set by DQ-209 option A (2026-10-16): keep comma's box and bench-test the open pull-down (VS-HW-23); the result goes into the assumption of use"
  status: proposed
  source: WP-H-01

- id: HWSR-508
  kind: hwsr
  text: "The CAN transceivers on the actuation bus (car side) shall be in a non-transmitting state from reset until the firmware enables them, and the firmware shall be able to disable them as part of the safe state."
  asil: "B‡"
  parents: [FSR-01.09, TSR-508]
  parent_text: "FSR-01.09 / TSR-508"
  other_parents: false
  allocated_to: "Transceiver standby/enable pins"
  hw_kind: "HW + CFG"
  verification: "A, T-HIL"
  baseline_impl: "Enable lines are active-low GPIOs per transceiver (`boards/cuatro.h:9-26`; `boards/tres.h:32-56`); enabled after SILENT is set (`main.c:295-298`). Behaviour of the enable pin at high-Z (MCU reset) depends on board pull-ups — unknown"
  status: proposed
  source: WP-H-01

- id: HWSR-508a
  kind: hwsr
  text: "A transceiver failure that produces a dominant-stuck or babbling bus shall not prevent the stock camera-to-vehicle path from working once the relay is released."
  asil: "B"
  parents: [FSR-07.03, TSR-508, TSR-702]
  parent_text: "FSR-07.03 / TSR-508, TSR-702"
  other_parents: false
  allocated_to: "Transceivers, relay topology"
  hw_kind: "HW"
  verification: "A (schematic)"
  baseline_impl: "Unknown: depends on whether the panda transceivers stay attached to the car-side bus when the relay is released"
  status: proposed
  source: WP-H-01

- id: HWSR-508b
  kind: hwsr
  text: "Bus-off, error-passive and persistent TX failure on the car-side bus while engaged shall be detected and lead to the actuation safe state and a driver warning."
  asil: "B"
  parents: [FSR-01.12, TSR-508]
  parent_text: "FSR-01.12 / TSR-508"
  other_parents: false
  allocated_to: "FDCAN status"
  hw_kind: "CFG"
  verification: "T-HIL, FI"
  baseline_impl: "**Partial.** Bus-off and error counters read into `can_health` (`drivers/fdcan.h:44-63`); on bus-off the core is reset (`drivers/fdcan.h:76-84`, `can_clear_send` rate-limited to 10 Hz, `:23-34`). No safety reaction in firmware; the host raises `canError` (gap assessment GAP-19 for wrong text)"
  status: proposed
  source: WP-H-01

- id: HWSR-508c
  kind: hwsr
  text: "CAN controller interrupt storms shall be detected and lead to the safe state."
  asil: "B"
  parents: [TSR-508]
  parent_text: "TSR-508"
  other_parents: false
  allocated_to: "Interrupt-rate monitor"
  hw_kind: "CFG"
  verification: "FI"
  baseline_impl: "Detected, report-only (`drivers/fdcan.h:257-262`, `drivers/interrupts.h:34-37`) (GAP-08)"
  status: proposed
  source: WP-H-01

- id: HWSR-517
  kind: hwsr
  text: "The MCU shall be able to receive the actuation frames it transmits on the car-side bus as they appear on the bus (for example through a second FDCAN instance or the transceiver's receive line on that bus), so that the read-back of TSR-517 covers FDCAN message RAM, FDCAN core and transceiver and not only the internal TX path."
  asil: "B‡"
  parents: [FSR-01.09, TSR-517]
  parent_text: "FSR-01.09 / TSR-517"
  other_parents: false
  allocated_to: "Car-side FDCAN instance, transceiver RX path"
  hw_kind: "HW/CFG"
  verification: "A, FI"
  baseline_impl: "Unknown: whether own frames can be received from the bus on this board is to be shown in WP-H-02 (the FDCAN TX event FIFO reflects internal state only)"
  status: proposed
  source: WP-H-01

- id: HWSR-510
  kind: hwsr
  text: "The ignition state shall be sensed from the harness ignition line; loss or implausibility of the ignition signal shall not leave the relay driven without a valid heartbeat."
  asil: "B"
  parents: [FSR-07.03, TSR-510]
  parent_text: "FSR-07.03 / TSR-510"
  other_parents: false
  allocated_to: "Harness SBU ignition line, MCU input"
  hw_kind: "HW + CFG"
  verification: "T-HIL"
  baseline_impl: "**Partial.** `harness_check_ignition` reads the SBU line selected by orientation (`drivers/harness.h:35-52`). Toyota has no CAN ignition hook (`opendbc_repo/opendbc/safety/ignition.h:12-63` covers GM, Rivian, Tesla, Mazda, VW MEB only), so the Corolla relies on the line alone. Ignition sets the heartbeat timeout: 5 s with ignition, 2 s without (`main.c:101-103, 193`)"
  status: proposed
  source: WP-H-01

- id: HWSR-510a
  kind: hwsr
  text: "A short or open of the ignition line shall be detected or shown to be safe (an open line reads \"ignition off\" and shortens the heartbeat timeout — safe direction; a short to ground reads \"ignition on\" — longer timeout, analyse)."
  asil: "B"
  parents: [TSR-510]
  parent_text: "TSR-510"
  other_parents: false
  allocated_to: "Analysis"
  hw_kind: "HW"
  verification: "A"
  baseline_impl: "Not analysed (WP-H-03 (assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md) FM-IGN-*)"
  status: proposed
  source: WP-H-01

- id: HWSR-509
  kind: hwsr
  text: "The safety MCU die temperature shall be monitored, and operation outside the MCU's specified junction range shall lead to the safe state."
  asil: "B"
  parents: [TSR-509]
  parent_text: "TSR-509"
  other_parents: false
  allocated_to: "STM32H7 DTS"
  hw_kind: "CFG"
  verification: "T-HIL"
  baseline_impl: "**Partial.** DTS read and reported (`stm32h7/lldts.h`, `main_comms.h:51-52`), no reaction in firmware. The host's thermal policy uses SoC CPU/GPU/memory/PMIC temperatures only, not the panda DTS (`openpilot/system/hardware/hardwared.py:320-329`)"
  status: proposed
  source: WP-H-01

- id: HWSR-509a
  kind: hwsr
  text: "Loss of forced cooling (fan stall) shall be detected."
  asil: "QM (availability) / B if thermal margin requires it"
  parents: [TSR-509]
  parent_text: "TSR-509"
  other_parents: false
  allocated_to: "Fan tachometer"
  hw_kind: "HW + CFG"
  verification: "T-HIL"
  baseline_impl: "Tach measured (`drivers/fan.h:23-43`); host raises a fault when fan < 500 rpm for > 15 s (onboard review, `selfdrived.py:291-294`)"
  status: proposed
  source: WP-H-01

- id: HWSR-401
  kind: hwsr
  text: "The SPI link shall carry an integrity mechanism strong enough for the residual-error target of the TSR (e.g. CRC-16 or stronger plus a sequence counter); the HW part is the SPI peripheral and DMA, which shall report overrun and mode faults."
  asil: "B‡"
  parents: [FSR-01.08]
  parent_text: "FSR-01.08 / TSR-4xx"
  other_parents: true
  allocated_to: "SPI4 + DMA2"
  hw_kind: "CFG"
  verification: "A, FI"
  baseline_impl: "Weak: 8-bit XOR (`drivers/spi.h:97-104`) (GAP-10). Software requirement; listed here for the HSI"
  status: proposed
  source: WP-H-01

- id: HWSR-701
  kind: hwsr
  text: "The harness orientation (normal, flipped, not connected) shall be detected before the relay is driven, and the CAN routing and relay/ignition pin assignment shall follow the detected orientation."
  asil: "B"
  parents: [FSR-07.03, TSR-701]
  parent_text: "FSR-07.03 / TSR-701"
  other_parents: false
  allocated_to: "SBU ADC sense, harness"
  hw_kind: "HW + CFG"
  verification: "T-HIL"
  baseline_impl: "**Implemented.** ADC of SBU1/SBU2 against `avdd_mV/2` (`drivers/harness.h:54-90`); relay/ignition pin swap by orientation (`drivers/harness.h:22-28`); CAN pin mux by orientation (`boards/tres.h:58-98`). A flipped reading also swaps logical CAN buses 0 and 2 (`drivers/can_common.h:130-135`, applied on a change of reading with a CAN and safety-mode re-init, `main.c:191-199`), so the safety model's bus numbers (car side = bus 0, camera side = bus 2) are correct only if the reading is. Detection is skipped while the relay is driven (`drivers/harness.h:59`), so a misread happens before engagement; its effect is analysed in WP-H-03 FM-HAR-02 (panda `bf8102a`)"
  status: proposed
  source: WP-H-01

- id: HWSR-701a
  kind: hwsr
  text: "A change of detected orientation or loss of harness while the relay is driven shall be detected and lead to the safe state."
  asil: "B"
  parents: [TSR-701]
  parent_text: "TSR-701"
  other_parents: false
  allocated_to: "Firmware"
  hw_kind: "CFG"
  verification: "T-HIL, FI"
  baseline_impl: "Partial: orientation change re-inits CAN and the safety mode (`main.c:132-140`), but detection is suspended while the relay is driven, so harness disconnection is seen only through CAN/heartbeat effects"
  status: proposed
  source: WP-H-01

- id: HWSR-702
  kind: hwsr
  text: "In the de-energised relay state the harness shall connect the forward camera to the vehicle CAN without any active component in the path (stock PCS path)."
  asil: "B"
  parents: [FSR-07.03, AOU-13, TSR-702]
  parent_text: "FSR-07.03, AOU-13 / TSR-702"
  other_parents: false
  allocated_to: "Harness relay"
  hw_kind: "HW"
  verification: "A (inspection), T-HIL"
  baseline_impl: "**Not met by design with the comma harness box v3:** the stock path runs through two powered CMOS analog switches (DG419LE) and Schottky clamps (RR-2026-010 (assurance/04-hardware/reviews/RR-2026-010.md) F-01). **Decided** (DQ-209 (assurance/01-management/decisions/register.yaml), option A, 2026-10-16): keep comma's box, bench-test how it fails (VS-HW-02, VS-HW-22…24) and argue the residual risk; record the tested behaviour as an assumption of use (AOU-13 to be reworded by the concept owner). This requirement stays not met by design and is carried as a deviation; an assessor may still challenge an active part in an ASIL B path"
  status: proposed
  source: WP-H-01

- id: HWSR-703
  kind: hwsr
  text: "Harness connectors shall be keyed/latched so that partial insertion is detected (NC status) or cannot occur."
  asil: "B"
  parents: [TSR-703]
  parent_text: "TSR-703"
  other_parents: false
  allocated_to: "Connectors"
  hw_kind: "HW"
  verification: "A, inspection"
  baseline_impl: "Unknown"
  status: proposed
  source: WP-H-01

- id: HWSR-711
  kind: hwsr
  text: "The camera-side FDCAN controller's error state (error-passive, bus-off) and its reception activity shall be observable by the firmware, so that a loss of camera-side forwarding can be detected within the SG-07 FDTI (≤ 0.1 s)."
  asil: "B"
  parents: [FSR-07.01, FSR-07.03, TSR-711]
  parent_text: "FSR-07.01, FSR-07.03 / TSR-711"
  other_parents: false
  allocated_to: "FDCAN (camera-side instance), transceiver"
  hw_kind: "CFG"
  verification: "T-HIL, FI"
  baseline_impl: "Partial: FDCAN error counters and bus-off status are read (`drivers/fdcan.h:76-84`); no supervision acts on them for the camera side"
  status: proposed
  source: WP-H-01

- id: HWSR-711a
  kind: hwsr
  text: "From the moment the relay drive is released, the intercept relay shall restore the stock camera-to-vehicle path within ≤ 20 ms (drop-out time including contact bounce), so that the relay part of the SG-07 FRTI (≤ 0.1 s) holds with margin."
  asil: "B"
  parents: [FSR-07.03, TSR-706, TSR-711]
  parent_text: "FSR-07.03 / TSR-706, TSR-711"
  other_parents: false
  allocated_to: "Intercept switch U1/U2"
  hw_kind: "HW"
  verification: "A (datasheet), T-HIL"
  baseline_impl: "**Met by design while the box is powered** (to confirm from the DG419LE datasheet): an analog switch changes over in microseconds, with no contact bounce (RR-2026-010 (assurance/04-hardware/reviews/RR-2026-010.md) F-04). Not met if the box supply is lost (HWSR-502a)"
  status: proposed
  source: WP-H-01

