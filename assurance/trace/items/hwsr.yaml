  status: proposed
  source: WP-H-01

- id: HWSR-502
  kind: hwsr
  text: "In and after any MCU reset (power-on, brown-out, watchdog, software, external NRST from the SoC), the relay drive outputs shall be in the state that de-energises the intercept relay, and no CAN transceiver shall transmit actuation frames, until the firmware has re-established a valid safety mode."
  asil: "B‡"
  parents: [FSR-01.09, FSR-07.03, TSR-502, TSR-706]
  parent_text: "FSR-01.09, FSR-07.03 / TSR-502 (reset-state outputs), TSR-706 (relay to stock on reset)"
  other_parents: false
  allocated_to: "GPIO reset state, relay driver circuit, transceiver standby pins"
  hw_kind: "HW + CFG"
  verification: "A (schematic), T-HIL, FI"
  baseline_impl: "**Partly observable.** Relay outputs are open-drain and written high (released) in `harness_init` (`drivers/harness.h:96-107`); the firmware starts in SILENT (`main.c:295`). GPIO reset state is analog/high-Z (`stm32h7_config.h:92-97`). Whether high-Z de-energises the relay depends on the driver circuit and pull-ups, which are **unknown without a schematic** (AOU-13, FSC OI-6)"
  status: proposed
  source: WP-H-01

- id: HWSR-502a
  kind: hwsr
  text: "The relay shall be de-energised (stock camera-to-vehicle path) when the device loses power or the harness 12 V supply is interrupted."
  asil: "B"
  parents: [FSR-07.03, TSR-706]
  parent_text: "FSR-07.03 / TSR-706"
  other_parents: false
  allocated_to: "Intercept switch (harness box U1/U2), R2/R3, box supply"
  hw_kind: "HW"
  verification: "A, T-HIL"
  baseline_impl: "**Partly met by design** (harness box v3 drawing, RR-2026-010 (assurance/04-hardware/reviews/RR-2026-010.md) HB-02, HB-03): device power loss leaves SBU1 undriven and R2+R3 select pass-through. A box supply interruption (ignition branch or D1 open, no comma power) leaves U1/U2 unpowered, so pass-through is not guaranteed (F-02, to confirm on the bench). Shipped box against the drawing unverified (VS-HW-02)"
  status: proposed
  source: WP-H-01

- id: HWSR-502b
  kind: hwsr
  text: "Every unhandled exception (HardFault, NMI, MemManage, BusFault, UsageFault, unused vectors) and every fatal assertion shall end in a reset or in a state with relay released and CAN TX disabled; no fault path shall leave the MCU hung with the relay driven."
  asil: "B‡"
  parents: [FSR-01.09, TSR-502]
  parent_text: "FSR-01.09 / TSR-502"
  other_parents: false
  allocated_to: "Exception handlers"
  hw_kind: "CFG"
  verification: "R, FI"
  baseline_impl: "**Partial.** NMI and HardFault set a cookie and reset (`early_init.h:66-80`). MemManage/BusFault/UsageFault are not enabled, so they escalate to HardFault (to confirm). Other vectors use `Default_Handler`, an infinite loop (`stm32h7/startup_stm32h7x5xx.s:111-114, 319-332`). `assert_fatal` hangs in `while(1)` (`libc.h:12-20`) and the clock init hangs on an unknown package or a non-starting HSE (`stm32h7/clock.h:68, 80`). Without an IWDG, a hang keeps the relay in its last state (GAP-07, GAP-08). *2026-10-12: once the relay has been driven, the IWDG (HWSR-501) now ends such a hang in a reset; not verified on hardware*"
  status: proposed
  source: WP-H-01

- id: HWSR-502c
  kind: hwsr
  text: "The SoC's control of the MCU reset (`STM_RST_N`) and boot-mode (`STM_BOOT0`) lines shall not be able to put the MCU into a state where the relay is driven by anything other than the release-signed application firmware."
  asil: "B‡"
  parents: [FSR-01.10, TSR-502, TSR-511]
  parent_text: "FSR-01.10 / TSR-502, TSR-511"
  other_parents: false
  allocated_to: "Boot pins, option bytes (RDP/WRP), relay driver"
  hw_kind: "HW + CFG"
  verification: "A, T-HIL"
  baseline_impl: "**Not met.** The SoC drives `STM_RST_N`/`STM_BOOT0` (`openpilot/common/hardware/comma/hardware.py:401-419`) (GAP-38). In the ROM bootloader the GPIOs are at reset state, so the relay is expected to be released (HWSR-502), which is the safe direction for SG-01/SG-07; the remaining risk is firmware substitution (cybersecurity, GAP-24)"
  status: proposed
  source: WP-H-01

