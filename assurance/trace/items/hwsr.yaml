- id: HWSR-507
  kind: hwsr
  text: "The Cortex-M7 MPU shall be configured so that safety-critical data (safety mode, limits, `controls_allowed`, relay state) and the stack are protected against writes from non-safety code paths (USB/SPI comms handlers), stack overflow is trapped by a guard region, and code regions are non-writable; MemManage faults shall lead to the safe state."
