  status: proposed
  source: WP-H-01

- id: HWSR-506d
  kind: hwsr
  text: "The intercept switch parts (U1/U2, harness box) shall be rated for the box supply over the full vehicle voltage range including transients (absolute maximum, operating range, logic thresholds at the actual VL) and qualified for the mission profile. *Until RR-2026-010 this requirement covered relay contact life and coil, which do not exist in the v3 harness box.*"
  asil: "B"
  parents: [TSR-506]
  parent_text: "TSR-506"
  other_parents: false
  allocated_to: "Intercept switch U1/U2 (DG419LE), D1, D4"
  hw_kind: "HW"
  verification: "A (datasheet), T (bench at 14–16 V)"
  baseline_impl: "**Not shown.** The LE part is Vishay document 76432, which could not be downloaded. Search results, not confirmed, give +3…+16 V single-supply operation and 18 V absolute maximum for V+, VL and IN to V−; VINH/VINL at VL ≈ 14 V not found. Here V+ = VL = VIN ≈ vehicle voltage minus one Schottky drop: steady state inside 16 V with little margin, transients not bounded below 18 V by D4 (SMF16A, 16 V stand-off). DFMEA DFM-010.C4, DFM-011.C2; DFM-ACT-015; VS-HW-24 (RR-2026-010 (assurance/04-hardware/reviews/RR-2026-010.md) §6.1)"
  status: proposed
  source: WP-H-01

