- id: HWSR-503c
  kind: hwsr
  text: "The firmware image in flash shall be checked by a CRC (or hash) over the application region at start-up and periodically at run time, with a period no longer than the latent-fault interval used in WP-H-04 (proposed: once per drive cycle at start-up plus a background check completing at least once per hour of operation). A mismatch shall lead to the safe state."
  asil: "B‡"
  parents: [FSR-01.09, TSR-503]
  parent_text: "FSR-01.09 / TSR-503"
  other_parents: false
  allocated_to: "Firmware + CRC unit"
  hw_kind: "CFG"
  verification: "T-HIL, FI"
  baseline_impl: "**Not implemented.** Only the bootstub signature check at boot (`bootstub.c:47-72`), which uses SHA-1/RSA-1024 and is not repeated at run time (GAP-24)"
  status: proposed
  source: WP-H-01

- id: HWSR-503d
  kind: hwsr
  text: "Critical configuration registers (clock, GPIO, FDCAN, relay pins) shall be checked periodically against their expected values, and divergence shall lead to the safe state rather than only a report."
  asil: "B‡"
  parents: [FSR-01.09, TSR-503]
  parent_text: "FSR-01.09 / TSR-503"
  other_parents: false
  allocated_to: "Firmware register map"
  hw_kind: "CFG"
  verification: "T-HIL, FI"
  baseline_impl: "**Partial.** Register-divergence check runs at 1 Hz (`drivers/registers.h:56-70`, `main.c:229`) but only calls `fault_occurred()`; `PERMANENT_FAULTS` is `0U` (`sys/sys.h:50`) so no reaction (GAP-08)"
  status: proposed
  source: WP-H-01

- id: HWSR-504
  kind: hwsr
  text: "Failure of the external high-speed oscillator (HSE, 25 MHz) shall be detected by the clock security system and lead to the safe state."
  asil: "B‡"
  parents: [FSR-01.09, TSR-504]
  parent_text: "FSR-01.09 / TSR-504"
  other_parents: false
  allocated_to: "RCC CSS on HSE"
  hw_kind: "CFG"
  verification: "FI"
  baseline_impl: "**Implemented (detection).** CSS enabled (`stm32h7/clock.h:119`). On the STM32H7 a CSS event raises NMI (verify against RM0468); the NMI handler resets the MCU (`early_init.h:73-76`). After reset `clock_init` waits forever for `HSERDY` (`clock.h:80`) — a hang with GPIOs at reset state. Acceptable only if HWSR-502 is confirmed"
  status: proposed
  source: WP-H-01

- id: HWSR-504a
  kind: hwsr
  text: "Drift of the CPU/peripheral clock outside a tolerance that would invalidate timing-based checks (RX timeouts, heartbeat timeout, CAN bit timing) shall be detected by a cross-check against an independent clock (e.g. IWDG LSI or HSI vs HSE-derived timer)."
  asil: "B‡"
  parents: [FSR-01.09, TSR-504]
  parent_text: "FSR-01.09 / TSR-504"
  other_parents: false
