- id: HWSR-501
  kind: hwsr
  text: "The safety MCU shall be supervised by a watchdog whose clock source and counter are independent of the CPU core clock tree and of the software it supervises, and whose expiry forces an MCU reset."
  asil: "B‡"
  parents: [FSR-01.09, TSR-501]
  parent_text: "FSR-01.09 / TSR-501"
  other_parents: false
  allocated_to: "STM32H7 IWDG1"
  hw_kind: "CFG"
  verification: "R, T-HIL, FI"
  baseline_impl: "**Implemented, not verified on hardware** (panda `9f60e17`: panda#1 and panda#3; impact record (assurance/07-supporting/impact/change-2026-10-12-panda-hw-watchdog.md)): IWDG1 (`IND_WDG`, `stm32h7/stm32h7_config.h:48`) on the LSI, prescaler /4, RLR 719, nominal timeout 90 ms at 32 kHz (`drivers/hw_watchdog.h`); expiry resets the MCU. The LSI tolerance and so the timeout at both ends are not yet confirmed from the datasheet (impact OI-2); HIL fault injection not run (impact OI-3, D-04). *As found before 2026-10-12: IWDG1 unused; only the software check of `drivers/simple_watchdog.h` from the 8 Hz tick, report-only (GAP-07).*"
  status: proposed
  source: WP-H-01

- id: HWSR-501a
  kind: hwsr
  text: "The watchdog shall be serviced only from a point that proves completion of the safety-relevant periodic processing (tick handler and RX/TX safety checks), not from an ISR that keeps running when the main processing has stalled."
  asil: "B‡"
  parents: [FSR-01.09, TSR-501]
  parent_text: "FSR-01.09 / TSR-501"
  other_parents: false
  allocated_to: "Firmware + IWDG"
  hw_kind: "CFG"
  verification: "R, FI"
  baseline_impl: "**Implemented, not verified on hardware** (panda `9f60e17`): fed only from the 100 Hz safety task (TIM4, `main.c:145`, after `safety_tick()` and the heartbeat check) and only when the main loop has run since the previous feed (`hw_watchdog_main_loop_alive()`, `main.c:124`), so a stall of the task interrupt or of the main loop ends in a reset. TX/RX hooks run in the CAN and host interrupts and are not themselves proven by the feed"
  status: proposed
  source: WP-H-01

- id: HWSR-501b
  kind: hwsr
  text: "The watchdog shall operate in window mode, so that servicing too early (runaway loop) is detected as well as servicing too late. Window and timeout shall be chosen so that detection plus reset completes within the MCU-execution-fault detection budget (≤ 0.1 s, set by the SG-07 FDTI, WP-S-04 §3.6)."
  asil: "B‡"
  parents: [FSR-01.09, TSR-501]
  parent_text: "FSR-01.09 / TSR-501"
  other_parents: false
  allocated_to: "IWDG1 window register"
  hw_kind: "CFG"
  verification: "A, T-HIL"
  baseline_impl: "**Implemented, not verified on hardware** (panda `a35d1c6`, in pin `9f60e17`): WINR 679, so a feed is accepted only ≈ 5 ms or more after the previous one; timeout ≈ 90 ms nominal. The first tick after the start is skipped. ≤ 0.1 s holds only if the LSI is at most about 10 % slow (impact OI-2, open); HIL evidence open (OI-3)"
  status: proposed
  source: WP-H-01

- id: HWSR-501c
  kind: hwsr
  text: "The watchdog shall be started no later than the first time the harness relay is energised after a reset, on every path that energises it (by the application, the bootstub, or option-byte hardware start, if chosen), and shall then stay active in all modes until the next reset; it shall not be stoppable by the SoC. (Amended in v0.3 with TSR-501 v0.4.)"
  asil: "B‡"
  parents: [FSR-01.09, FSR-01.10, TSR-501]
  parent_text: "FSR-01.09, FSR-01.10 / TSR-501"
  other_parents: false
  allocated_to: "IWDG option bytes (IWDG_SW, freeze in stop/standby)"
  hw_kind: "CFG"
  verification: "R, T-HIL"
  baseline_impl: "**Implemented (software start), not verified on hardware:** `hw_watchdog_start()` is called from `set_intercept_relay()` the first time the relay is driven, on every path including `0xc5` (`drivers/harness.h:17-20`); once started it cannot be stopped by software. `enter_stop_mode()` resets the MCU first if the IWDG runs (`sys/power_saving.h:61-63`). Option-byte state (IWDG_SW, freeze in stop/standby) on shipped devices is not known (WP-H-02 (assurance/04-hardware/WP-H-02-hardware-design.md) UK-04, open)"
  status: proposed
  source: WP-H-01

- id: HWSR-501d
  kind: hwsr
  text: "An independent external supervisor (voltage supervisor with watchdog input, on its own clock) that can force the relay to its released state, independent of the MCU, should be added."
  asil: "B‡ (if (a)/(b)); recommendation at B"
  parents: [FSR-01.09, FSR-07.03, TSR-501]
  parent_text: "FSR-01.09, FSR-07.03 / TSR-501"
  other_parents: false
  allocated_to: "External"
  hw_kind: "ADD"
  verification: "A, T-HIL"
  baseline_impl: "Not present on the COTS PCB as far as observable. See WP-H-02 (assurance/04-hardware/WP-H-02-hardware-design.md) §6, DC-01. Needed for an ASIL C claim because IWDG shares supply and silicon with the CPU (GAP-11)"
  status: proposed
  source: WP-H-01

