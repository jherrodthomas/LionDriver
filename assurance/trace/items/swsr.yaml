  applies_to: "CFG-001"
  proposed_by: "ai-assisted (Claude), not reviewed"
  baseline_impl: "Partial: heartbeat loss (SWSR-407) revoking authority that was granted → 3 s siren at once, ≈ 0.56 s after the last heartbeat (0.3 s + 10 ms + 2 × 125 ms speaker tick), all builds (panda `c33343b`, `drivers/heartbeat_siren.h`, host test `tests/heartbeat_siren`, HIL `tests/hitl/test_15_heartbeat_siren.py` not run); 1 Hz path unchanged: 3 s siren after 4–5 s heartbeat loss (`main.c:169-171, 198-201`), the only siren when authority ended within the 5 s before the loss; EPS fault (SWSR-110) persisting 0.7 s (DQ-048, panda `bf8102a`; 1 s before) while authority is granted → siren ≥ 3 s, ≤ 0.96 s after the fault onset (panda `b790fca`, `drivers/eps_fault_siren.h`, host test `tests/eps_fault_siren`; HIL not run); since panda `3ee2796` (register DQ-367) the fault counts once it has been seen while authority was granted, so the siren also sounds when SWSR-408 revokes authority during the fault. Missing command frames (SWSR-408, TSR-516(b), DQ-404 A): since panda `8a69ccf` with opendbc `4d1a056` (reference build) the 3 s heartbeat siren also starts in the safety task in which SWSR-408 revokes granted authority (`safety_tx_arrival_revoked`), so a full SoC stall is no longer silent; a brake press, PCM cancel or RX fault does not set the flag (opendbc `test_tx_arrival_revoked_only_by_arrival_check`, host test `tests/heartbeat_siren`, HIL `test_soc_stall_revokes_on_missing_frames` not run). Heartbeat \"not engaged\" (SWSR-307) and (c): since panda `f4803c5` (reference build) the same 3 s siren starts when SWSR-516b fires, 0.5 s after the first \"not engaged\" heartbeat, that is 0.2 s after the SWSR-307 revocation; a SWSR-307 revocation followed by a PCM cruise drop within that 0.5 s stays silent, so the siren for that (b) trigger is the (c) siren (host test `tests/engaged_mismatch`; plant run: siren 0.63–0.88 s after selfdrived stops; HIL not run). Other (b) triggers not impl"
  status: proposed
  source: WP-W-02

