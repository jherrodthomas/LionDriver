- id: SWSR-629
  kind: swsr
  text: "On the reference platform (`assured_config.ASSURED_PLATFORMS`), `card` shall read the stored DTCs of the EPS and the ABS/VSC ECU once per start of `card`, in `Car.__init__` before it sets `FirmwareQueryDone`: on bus 0, to the EPS and ABS addresses of the platform's firmware-query table (opendbc `FW_VERSIONS`; Corolla TSS2 `0x7a1`, `0x7b0`, responses at the address + 8), it shall send tester present (`0x3E 0x00`) and then UDS ReadDTCInformation, reportDTCByStatusMask with status mask `0xFF` (`0x19 0x02 0xFF`), and shall store the result of each ECU (ok, active or failed, with every code and its status byte) in the param `VehicleDtcStatus` and in the log before it writes `CarParams`. No other ECU and no other service shall be addressed."
  asil: "QM"
  parents: [TSR-629]
  parent_text: "TSR-629"
  other_parents: false
  allocated_to: "`host.card`"
  verification: "UT, VT"
  acceptance: "Mocked ECUs: only `0x7a1` and `0x7b0` on bus 0 receive frames, request bytes as stated; a multi-frame code list is read completely; record written before `CarParams`"
  applies_to: "CFG-001"
  proposed_by: "ai-assisted (Claude), not reviewed"
  baseline_impl: "Impl, not verified on the vehicle (WP-S-09 VS-SQ-20): `selfdrive/car/vehicle_dtc.py` (`read_startup_dtcs`, `query_dtcs`), `selfdrive/car/card.py`; `common/params_keys.h`; unit tests `selfdrive/car/tests/test_vehicle_dtc.py`. Whether the reference car's ECUs answer `0x19` (rather than only the Toyota KWP services the firmware query also uses) is not known"
  status: proposed
  source: WP-W-02

- id: SWSR-629a
  kind: swsr
  text: "The SWSR-629 read shall never run while the vehicle moves or the item can be engaged. `card` shall send its first diagnostic frame only after 20 consecutive `carState` samples parsed from the received CAN (0.2 s at 100 Hz) show valid CAN and standstill, found within 1.0 s; otherwise it shall send no diagnostic frame and record the read as not made. The read shall be called from `Car.__init__` only, before `FirmwareQueryDone`, so that `pandad` still holds the panda in the ELM327 diagnostic mode (no actuation, controls not allowed). In a log replay (`REPLAY`) and in the simulator (`SIMULATION` with `NOBOARD`, no vehicle CAN bus, as `stock_aeb_interlock.is_simulation`) no read is made."
  asil: "QM"
  parents: [TSR-629]
  parent_text: "TSR-629"
  other_parents: false
  allocated_to: "`host.card`"
  verification: "UT, R"
  acceptance: "Moving car, invalid CAN, or a car that starts to move during the check: no frame sent, read not made; a static check of `card.py` finds one call, in `__init__`, before `FirmwareQueryDone`"
  applies_to: "CFG-001"
  proposed_by: "ai-assisted (Claude), not reviewed"
  baseline_impl: "Impl, not verified on the vehicle (WP-S-09 VS-SQ-20): `vehicle_stationary`, `Car.parse_can_for_dtc_read`; `TestOnlyWhileStationary`, `TestCardCallSite`"
  status: proposed
  source: WP-W-02

- id: SWSR-629b
  kind: swsr
  text: "A code shall count as active when its status byte AND the ECU's status availability mask AND `0x8B` is not zero (test failed, test failed this operation cycle, confirmed, warning indicator requested: ISO 14229-1 bits 0, 1, 3, 7) and the code is not in `EXEMPT_DTCS`, which is empty in the first release; adding a code needs an impact analysis. Pending (bit 2) and history bits (4, 5, 6) alone shall not count. Every code shall be logged with its status."
  asil: "QM"
  parents: [TSR-629]
  parent_text: "TSR-629"
  other_parents: false
  allocated_to: "`host.card`"
  verification: "UT"
  acceptance: "Each of bits 0, 1, 3, 7 alone gives active; bits 2, 4, 5, 6 alone give ok and are logged; a bit the ECU does not support is ignored; an exempt code gives ok"
  applies_to: "CFG-001"
  proposed_by: "ai-assisted (Claude), not reviewed"
  baseline_impl: "Impl, not verified on the vehicle (WP-S-09 VS-SQ-20): `ACTIVE_STATUS_MASK`, `EXEMPT_DTCS`, `parse_dtc_response`; `TestDtcRead`"
  status: proposed
  source: WP-W-02

