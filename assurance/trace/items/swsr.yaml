- id: SWSR-634
  kind: swsr
  text: "While the wheel-touch policy is active, `dmonitoringd` shall raise alert *k* (1, 2, 3) no later than T*k* = 5 / 15 / 25 s or D*k* = 150 / 240 / 395 m driven while engaged since the last driver interaction, whichever comes first (WP-C-08 §5.4 (assurance/02-concept/WP-C-08-driver-hmi-misuse-analysis.md)); below the DM alert speed (10 km/h) the distance shall raise no alert, as for the timers. Distance is the integral of `carState.vEgo`. An interaction that resets wheel-touch awareness resets the distance; when wheel-touch awareness recovers (low-speed exemption, or a driver the vision policy sees as attentive), the distance recovers in the same proportion. The time caps, the vision-policy timers, the no-response stage and the lockout are unchanged."
  asil: "A (TSR-634; allocated to the QM SoC, open: WP-C-04 OI-11)"
  parents: [TSR-634]
  parent_text: "TSR-634"
  other_parents: false
  allocated_to: "`host.dm`"
  verification: "UT, IT, VT"
  acceptance: "Constant 30…120 km/h in 10 km/h steps (and 0, 50, 57 km/h) and ±1.5 m/s² ramps between 40 and 100 km/h: each alert within one DM step (50 ms) of the first time T*k* or D*k* is reached, and the distance at each alert ≤ D*k* plus one step; an interaction resets the distance; vision recovery restarts it; no alert below 10 km/h"
  applies_to: "CFG-001"
  proposed_by: "ai-assisted (Claude), not reviewed"
  baseline_impl: "Impl: `selfdrive/monitoring/policy.py:37-41, 179-189, 198-209, 383-384, 400-404, 419-425`; 6 tests in `selfdrive/monitoring/test_monitoring.py`. Not verified in the vehicle (WP-V-02 §4.4)"
  status: proposed
  source: WP-W-02

- id: SWSR-635
  kind: swsr
  text: "While engaged above the DM alert speed (10 km/h), with the driver attentive before the change, the first DM alert (alert level one shown by `ui` and its sound started by `soundd`) shall come no later than 6.0 s after the driver's change of state: for the vision policy, the start of exposure (`timestampSof`) of the first cabin frame in which the eyes are off the road; for the wheel-touch policy, the last driver interaction. The 6.0 s is allocated as: the alert-1 timer of SWSR-608 / SWSR-634, 5.0 s; detection, from that frame's start of exposure until the awareness countdown runs (frame readout, `dmonitoringmodeld` execution and the distraction filter), ≤ 0.5 s; alert output, from the `driverMonitoringState` that first carries alert level one until the alert is shown and its sound starts (`selfdrived`, `ui`, `soundd`), ≤ 0.3 s; margin, 0.2 s. Alert output is shared with SWSR-606, and `soundd` priority with SWSR-627."
  asil: "A (TSR-635; allocated to the QM SoC, open: WP-C-04 OI-11)"
  parents: [TSR-635]
  parent_text: "TSR-635"
  other_parents: false
  allocated_to: "`host.dm`, `host.modeld`, `host.selfdrived`, `host.hmi`"
  verification: "UT, IT, VT, LOG"
  acceptance: "Each budget part met separately: detection ≤ 0.5 s and output ≤ 0.3 s, measured from logs by matching `driverCameraState.timestampSof` to `driverStateV2` on `frameId`, then to `driverMonitoringState`, `selfdriveState` and the audio output (IT on the device, VT in the vehicle); the end-to-end time ≤ 6.0 s for a staged look-away in the vehicle (VT, WP-V-02 VT-08)"
  applies_to: "CFG-001"
  proposed_by: "ai-assisted (Claude), not reviewed"
  baseline_impl: "Partly met, not measured end to end: policy part implemented, the first vision alert 5.30 s after the first distracted model output (5.0 s timer and the distraction filter crossing 0.63 after about 0.30 s, `selfdrive/monitoring/policy.py:84, 409`), 5.05 s with an uncertain pose and 5.0 s with the face lost (SWSR-635b), at any DM frame rate within two frame periods (SWSR-635a). Frame readout and model execution (≤ 0.2 s left in the detection part) and the alert output (≤ 0.3 s) are not measured (WP-S-04 OI-11). Wheel-touch: 5.0 s from the last interaction (or 150 m, SWSR-634)"
  status: proposed
  source: WP-W-02

- id: SWSR-635a
  kind: swsr
  text: "The DM awareness countdown shall advance by the time elapsed between the cabin frames it evaluates (from `timestampSof`, or the receive time where a frame has none), not by a fixed step per evaluated frame, so that frames the DM model skips or drops do not lengthen the SWSR-635 timer in real time."
  asil: "A (TSR-635; allocated to the QM SoC, open: WP-C-04 OI-11)"
  parents: [TSR-635]
  parent_text: "TSR-635"
  other_parents: false
  allocated_to: "`host.dm`"
  verification: "UT, IT"
  acceptance: "With DM output at 20, 10 and 5 Hz (frames skipped), alert 1 within two frame periods of the 20 Hz time in each case (the filter crossing and the countdown each land on a frame)"
  applies_to: "CFG-001"
  proposed_by: "ai-assisted (Claude), not reviewed"
  baseline_impl: "Impl: the countdown step and the distraction filter follow the elapsed time from the cabin frame index, so frames the DM model skipped count; the gap is capped at 2 s, the SWSR-609 window (`selfdrive/monitoring/policy.py:87, 344-351, 357, 384, 508-510`). Unit tests `TestFirstAlertTime` in `selfdrive/monitoring/test_monitoring.py`: at 20, 10 and 5 Hz alert 1 within two frame periods of the 20 Hz time (one each for the filter crossing and the countdown), against 10.6 s and 21.2 s before. Not verified on the device"
  status: proposed
  source: WP-W-02

- id: SWSR-635b
  kind: swsr
  text: "While engaged, a DM output that does not show an attentive driver shall not stop the SWSR-635 timer: when the face is detected but the pose output is uncertain (orientation std ≥ the high-std threshold), the awareness countdown shall keep running as for a distracted driver, and awareness shall recover only on an attentive classification with a certain pose, or on a driver interaction under the wheel-touch policy. The fallback to the wheel-touch policy shall not add time to the first alert."
  asil: "A (TSR-635; allocated to the QM SoC, open: WP-C-04 OI-11)"
  parents: [TSR-635]
  parent_text: "TSR-635"
  other_parents: false
  allocated_to: "`host.dm`"
  verification: "UT"
  acceptance: "A driver who becomes distracted with an uncertain pose gets alert 1 ≤ 5.3 s after the first such output (the SWSR-635 policy part), as for a certain pose; past orange the terminal alert still comes at the vision time when the face is lost or the pose turns uncertain; an attentive driver with a certain pose still recovers"
  applies_to: "CFG-001"
  proposed_by: "ai-assisted (Claude), not reviewed"
  baseline_impl: "Impl: a detected face with an uncertain pose counts as not attentive, so the countdown runs from the first such output (`policy.py:412`); past orange the vision countdown keeps running when the face is lost or the pose turns uncertain, instead of stopping at orange (`policy.py:213-216`). Unit tests: alert 1 at 5.05 s for a distracted driver with an uncertain pose (15.0 s before); terminal alert at the vision time after orange with the face lost or the pose uncertain (none before); an attentive driver with a certain pose still recovers; `test_somehow_indecisive_model` now expects the vision timers 5 / 8 / 13 s. Not verified on the device; the rate of uncertain output while attentive is OI-17"
  status: proposed
  source: WP-W-02

