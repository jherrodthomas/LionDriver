  kind: swsr
  text: "An ECU shall be recorded as failed, not healthy, when it has no address for the platform, gives no complete positive response within 0.5 s per ISO-TP response and 2.0 s per attempt over 2 attempts (the second only to the ECUs that did not answer), gives a negative response, returns a payload that is not one availability byte plus 4 bytes per code, or reports none of bits 0, 1, 3, 7 as supported. An error raised during the read shall record the read as not made and shall not stop `card`."
