  status: proposed
  source: WP-S-02

- id: TSR-108
  kind: tsr
  text: "If the envelope rejects a lateral command frame while lateral authority is granted, it shall revoke lateral authority (SS-L) and keep it revoked until a new valid engagement (TSR-301), and it shall report the event and its cause to the SoC."
  asil: "B‡"
  parents: [FSR-01.12]
  parent_text: "FSR-01.12"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "FR"
  timing: "detect: same frame / react: same frame"
  verification: "T-SIL, FI"
  baseline_impl: "Not implemented: the violating frame is dropped and the rate state reset (`lateral.h:140-148`), `safety_tx_blocked` is counted and reported (`drivers/can_common.h:168-171`, `main_comms.h:27`), but `controls_allowed` is not cleared. Upstream design lets the host recover; the FSC requires latching. Decided 2026-10-14 (DQ-060): latching as written, switch off until the driver re-engages; firmware change open"
  status: proposed
  source: WP-S-02

- id: TSR-109
  kind: tsr
  text: "Whenever the envelope rejects a `0x2E4` frame or revokes lateral authority, the EPS shall receive torque 0 with STEER_REQUEST 0 within ≤ 0.1 s. This shall be achieved by (a) the envelope transmitting, in place of each rejected frame, a `0x2E4` frame with zero torque, STEER_REQUEST 0, a counter continuing the host sequence and a valid checksum; or (b) only if vehicle characterisation shows that the EPS ramps LKA torque to zero within ≤ 0.1 s of a missing `0x2E4` frame, by withholding the frame. Option (a) is the recommended design."
  asil: "C"
  parents: [FSR-01.12, FSR-01.13, FSR-05.01, FSR-02.04]
  parent_text: "FSR-01.12, FSR-01.13, FSR-05.01, FSR-02.04"
  other_parents: false
  allocated_to: "P-SW (a); EXT (b)"
  mechanism: "FR"
  timing: "react ≤ 0.1 s"
  verification: "T-HIL, T-VEH, FI"
  baseline_impl: "**Not implemented / unverified.** Rejecting a frame drops it (`drivers/can_common.h:161-176`); the EPS then sees a message drop-out. The only available description of drop-out handling is a code comment (LKA_STATE 9 → 11 over ≈2 s, then 3; `carstate.py:15-16`), so torque may persist after rejection. NF-02, GAP-05"
  status: proposed
  source: WP-S-02

- id: TSR-110
  kind: tsr
  text: "The envelope shall receive EPS_STATUS (`0x262`) and, while lateral authority is granted, shall revoke lateral authority and report the cause when LKA_STATE indicates an EPS fault or LKA unavailability, or when EPS_STATUS is missing beyond its timeout (TSR-401). The LKA_STATE fault code set shall be confirmed for the reference EPS firmware."
  asil: "C"
  parents: [FSR-02.01]
  parent_text: "FSR-02.01"
  other_parents: false
  allocated_to: "P-SW (detect); SoC (warn, TSR-606)"
  mechanism: "PLB, TMO"
  timing: "detect ≤ 0.3 s / react ≤ 0.1 s"
  verification: "T-SIL, T-VEH"
  baseline_impl: "**Partial** (reference build; not yet verified on the vehicle): `0x262` is an envelope RX check (checksum, 5-period timeout at a nominal 25 Hz, gates engagement via TSR-306; opendbc `98404a4`), and while LKA_STATE is in the host's fault set {0, 3, 9, 11, 17, 21, 25} STEERING_LKA frames with torque or a steer request are refused (opendbc `242d63d`, IA EPS fault (assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-eps-fault.md)). The cause is reported to the host: health flag `HEALTH_FLAG_EPS_FAULT` → `pandaState.epsFault`, logged by `pandad` on each change (panda `877730e`, opendbc `adcb7c2`). **Open:** confirmation of the fault code set for the reference EPS firmware. GAP-03"
  status: proposed
  source: WP-S-02

