- id: TSR-410
  kind: tsr
  text: "Every SPI transfer (header and data) shall be protected by a CRC whose residual error probability over the maximum transfer length meets the target set in WP-S-05 §4 (assurance/03-system/WP-S-05-hsi-specification.md), and every CAN-TX transfer shall carry a sequence counter; the envelope shall discard transfers with a failed CRC or a repeated or out-of-order counter. The per-packet XOR may remain as an additional check."
  asil: "C"
  parents: [FSR-01.08]
  parent_text: "FSR-01.08"
  other_parents: false
  allocated_to: "P-SW, SoC"
  mechanism: "E2E"
  timing: "per transfer"
  verification: "A, T-HIL, FI"
  baseline_impl: "Not met: 8-bit XOR seeded 0xAB on header and data (`drivers/spi.h:97-104, 122, 137`); per-CAN-packet 8-bit XOR (`drivers/can_common.h:144-159`, checked at FDCAN TX `drivers/fdcan.h:100`); no sequence counter (`can_comms.h:8-37`) (GAP-10)"
  status: proposed
  source: WP-S-02

- id: TSR-411
  kind: tsr
  text: "The envelope shall reject actuation frames whose transfer counter shows they are older than 2 control periods relative to the newest accepted transfer (freshness)."
