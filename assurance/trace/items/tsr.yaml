  baseline_impl: "Not verified. Overflow counted (`drivers/can_common.h:165`, `main_comms.h:29`). SH-08 in WP-C-05 (assurance/02-concept/WP-C-05-sotif-hazard-identification.md)"
  status: proposed
  source: WP-S-02

