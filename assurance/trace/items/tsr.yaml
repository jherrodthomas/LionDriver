- id: TSR-710
  kind: tsr
  text: "The envelope shall detect a relay malfunction (any `check_relay` control message seen on the car side after the relay transition window) and inhibit all actuation TX and forwarding."
  asil: "C"
  parents: [FSR-01.11]
  parent_text: "FSR-01.11"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "PLB, FR"
  timing: "detect: first offending frame after ≤ 1–2 s window / same frame"
  verification: "T-SIL, T-HIL"
  baseline_impl: "Implemented: `safety.h:211-220, 252, 268, 372-380`; reported `main.c:122-129`; host immediate disable `selfdrive/selfdrived/selfdrived.py:377-378`. Latching and readback per TSR-506"
  status: proposed
  source: WP-S-02

- id: TSR-711
  kind: tsr
  text: "While the relay intercepts, the envelope shall supervise forwarding from the camera side to the car side and release the relay (TSR-706) when forwarding has stopped: no camera-side frame received or none forwarded for longer than t_fwd while the camera-side bus was active before, camera-side bus-off or error-passive, or forwarding queue overflow. t_fwd shall be set from the measured camera-side message periods so that detection stays within the SG-07 FDTI of ≤ 0.1 s."
  asil: "B"
  parents: [FSR-07.01, FSR-07.03]
  parent_text: "FSR-07.01, FSR-07.03"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "TMO, FR"
  timing: "detect ≤ 0.1 s / release ≤ 0.1 s (SG-07, WP-S-04 §3.6)"
  verification: "T-HIL, FI"
  baseline_impl: "Not implemented: queue overflow is counted only (`drivers/can_common.h:165`); no supervision of camera-side reception releases the relay (WP-A-04 SPF-13, System FMEA SFM-033.C6)"
  status: proposed
  source: WP-S-02

- id: TSR-712
  kind: tsr
  text: "If the harness state readback (TSR-506) shows that the camera path stays intercepted when the release is commanded, the envelope shall inhibit all actuation TX, keep the fault latched until power cycle and report it; the SoC shall then give a warning that stock PCS/AEB is unavailable and prevent engagement until the harness is repaired."
  asil: "B (envelope detection and inhibit); QM (B-sup: TSR-506) for the SoC warning"
  parents: [FSR-07.06]
  parent_text: "FSR-07.06"
  other_parents: false
  allocated_to: "P-SW, SoC"
  mechanism: "PLB, FR, WRN"
  timing: "detect ≤ 0.3 s (TSR-506) / warn ≤ 1 s"
  verification: "T-HIL, FI"
  baseline_impl: "Not implemented: no state readback exists; the harness box is two analog switches with a pull-down default and no feedback (RR-2026-010). Applies once readback exists (harness choice DQ-209, queued); the readback hardware itself is TSR-506 / HWSR-506a. Added v0.21 (DQ-064)"
  status: proposed
  source: WP-S-02

- id: TSR-713
  kind: tsr
  text: "While the stock system reports an AEB event (`stockAeb`), the SoC shall request zero acceleration in ACC_CONTROL `0x343` (no positive acceleration), keep that request for as long as the event is reported, and then return to normal control; the alert of TSR-709 is unchanged. Stock AEB braking keeps its priority in the PCM (TSR-708, AOU-04R), which is still tested. (Decided 2026-10-18, DQ-300 A; SFM-ACT-020.)"
  asil: "QM (no ASIL claim; TSR-708 stays the measure)"
  parents: [FSR-07.07]
  parent_text: "FSR-07.07"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "FR"
  timing: "from the first frame that reports the event"
  verification: "T-SIL, T-VEH"
  baseline_impl: "**Implemented and unit-tested, not verified on the vehicle**: host side in `c045874` (#292): while `stockAeb` is set, `controlsd` caps the longitudinal target and the upper limit at 0 m/s² (`selfdrive/controls/lib/longcontrol.py` `stock_aeb_stand_down`), 4 unit tests (`selfdrive/controls/tests/test_stock_aeb.py`). On `0x343` since opendbc `e233362` (#311): the Toyota car controller applies `min(pcm_accel_cmd, 0)` after its 4.5 m/s³ final-command rate limit, PID and pitch terms (`opendbc/car/toyota/carcontroller.py:259-260`), so the ACCEL_CMD on the bus is ≤ 0 from the first stockAeb frame, a braking request passes unchanged, and after the event the command rises at ≤ 4.5 m/s³; 3 unit tests (`opendbc/car/toyota/tests/test_carcontroller.py` `test_stock_aeb_*`, `test_after_stock_aeb_recovers_at_the_rate_limit`), run locally (CI unit tests blocked by the LFS mirror outage of 2026-10-19). SWSR-713h (WP-W-02). The one-frame drop of a positive command to 0 is not deceleration onset, so TSR-205 (j_down) as worded does not restrict it; an envelope implementation of TSR-205 must keep that reading (WP-W-02 OI-16). Open: the AOU-04R vehicle test and a check that `stockAeb` is reported during a staged PCS event ({REC} OI-3)"
  status: proposed
  source: WP-S-02

