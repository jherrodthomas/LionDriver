- id: TSR-633
  kind: tsr
  text: "When driver awareness has reached zero (terminal DM alert) and the driver has not responded for 5 s, the item shall keep the lane and decelerate in lane to a standstill within a_min and j_down (TSR-202, TSR-205) with the terminal alert sounding, then keep the vehicle stopped and held, and lock out re-engagement and resumption until the driver responds, so that the item cannot drive off again (register DQ-365, A, decided 2026-10-16). It shall not leave lateral and longitudinal control active at the set speed."
  asil: "A (SG-08; allocated to the QM SoC, open: WP-C-04 OI-11)"
  parents: [FSR-02.09]
  parent_text: "FSR-02.09"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "FR, WRN"
  timing: "reaction starts ≤ 5 s after the terminal alert (WP-S-04 §3.8)"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Implemented in software and unit-tested, not verified on the vehicle: `selfdrived` latches the manoeuvre from the first no-response request until the item disengages (`selfdrive/selfdrived/minimum_risk.py`, published as `selfdriveState.minimumRiskManeuver`), and `controlsd` keeps `forceDecel` on while it is set (`controlsd.py:237-239`), so a dropped DM request (restart, awareness reset) no longer sends the planner back to the set speed; the planner keeps the stop request on and the Toyota controller keeps requesting standstill hold and never resumes (`carcontroller.py:184-189`); the terminal alert is re-raised while latched; the lockout of re-engagement runs from the driver's takeover (`policy.py:368-369`). Open: the PCM standstill hold over time (AOU-16, T-VEH), the deceleration against a_min and j_down and the reaction time (T-33) not measured. System FMEA SFM-025.C1, SFM-ACT-005. Added v0.22"
  status: proposed
  source: WP-S-02

- id: TSR-634
  kind: tsr
  text: "When driver monitoring has fallen back to the wheel-touch policy (camera confidence too low), the escalation times of TSR-608 shall shorten as vehicle speed rises, so that the distance driven without driver supervision up to each alert stays within a bound set in WP-C-08 §5.4; at highway speed the time to the strongest alert shall be shorter than the fixed 25 s (register DQ-077, A, decided 2026-10-14). The speed table and the bound are set in WP-C-08 §5.4 (DMP-05) and validated under WP-V-02."
  asil: "A (SG-08; allocated to the QM SoC, open: WP-C-04 OI-11)"
  parents: [FSR-02.06]
  parent_text: "FSR-02.06"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "WRN"
  timing: "alert k at T_k = 5/15/25 s or D_k = 150/240/395 m since the last driver input, whichever comes first (WP-C-08 §5.4)"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Impl (SIL): alert k at T_k or D_k, whichever comes first, `selfdrive/monitoring/policy.py:37-41, 419-425` (SWSR-634); unit tests only, vehicle validation open (WP-V-02 §4.4). WP-A-05 LS-09, OI-6. Added v0.31"
  status: proposed
  source: WP-S-02

- id: TSR-635
  kind: tsr
  text: "The time from the driver's change of state (eyes off the road, or hands off under the wheel-touch policy) to the first driver alert shall be ≤ 6 s end to end, including camera frame time, DM model latency and policy evaluation, so the first-alert timer of TSR-608 and TSR-634 shall leave a stated budget for that latency; the no-response reaction of TSR-611 shall start within the time set in WP-S-04 (assurance/03-system/WP-S-04-timing-ftti-budget.md)."
  asil: "A (SG-08; allocated to the QM SoC, open: WP-C-04 OI-11)"
  parents: [FSR-08.01]
  parent_text: "FSR-08.01"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "WRN"
  timing: "first alert ≤ 6 s end to end"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Not met, not measured: the policy part is implemented (SWSR-635a: the countdown follows elapsed time at any DM frame rate; SWSR-635b: an uncertain DM output no longer stops it, first alert 5.05 s instead of 15.0 s; `selfdrive/monitoring/policy.py`, unit tests, IA (assurance/07-supporting/impact/change-2026-10-20-dm-first-alert-time.md)), but the camera, model and alert-output latency on top of the 5 s timer is not measured (SWSR-635, WP-C-08 OI-2, WP-S-04 OI-11). Refined in WP-W-02 v0.38 (SWSR-635, 635a, 635b). Added v0.45: FSR-08.01 had no TSR"
  status: proposed
  source: WP-S-02

- id: TSR-701
