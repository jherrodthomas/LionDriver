  baseline_impl: "Partial: register divergence check at 1 Hz, report-only (`drivers/registers.h:56-70`, `main.c:228-229`); no ECC handling, no runtime CRC (GAP-08). HWSR-503…503d"
  status: proposed
  source: WP-S-02

