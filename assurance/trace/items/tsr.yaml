  status: proposed
  source: WP-S-02

- id: TSR-501
  kind: tsr
  text: "The safety MCU shall be supervised by an independent hardware watchdog (IWDG1, LSI-clocked) that is started no later than the first time the harness relay is energised after a reset, by any path (safety-mode change or configuration/debug command), and then stays active until the next reset; that cannot be stopped by the SoC; that is serviced only after the periodic safety processing has completed; and that resets the MCU within ≤ 0.1 s of a stall (SG-07 FDTI, WP-S-04 (assurance/03-system/WP-S-04-timing-ftti-budget.md) §3.6; ≤ 0.2 s would meet SG-01 only). Rationale for the start condition (amended in v0.4): until the relay is first energised after a reset, the stock camera-to-vehicle path is intact and no actuation frame reaches the vehicle, so a stall cannot violate SG-01 or SG-07; an idle device keeps its power-save and stop modes."
  asil: "C"
  parents: [FSR-01.09]
  parent_text: "FSR-01.09"
  other_parents: false
  allocated_to: "P-HW (cfg), P-SW"
  mechanism: "WDG"
  timing: "detect ≤ 0.1 s / reset → SS-S"
  verification: "R, T-HIL, FI"
  baseline_impl: "**Implemented, not yet verified on hardware** (panda `3859fa8`): IWDG1 started the first time the relay is energised, on any path (`drivers/harness.h`); fed from the 100 Hz safety task only after main-loop progress (`drivers/hw_watchdog.h`, `main.c`); 90 ms nominal; window mode, about 5 ms minimum feed interval (HWSR-501b). a watchdog reset is reported to the host (`pandaState.watchdogReset`). Decided 2026-10-14 (DQ-114): accepted as closing the SG-07 interim residuals once the independent reviewer has checked it and the LSI tolerance keeps it ≤ 0.1 s. Open: LSI range at both ends, HIL evidence (IA watchdog (assurance/07-supporting/impact/change-2026-10-12-panda-hw-watchdog.md))"
  status: proposed
  source: WP-S-02

- id: TSR-502
  kind: tsr
  text: "Every detected MCU fault (watchdog, interrupt-rate, register divergence, memory ECC, clock, supply, temperature, SPI/DMA, siren, relay) shall lead to SS-S within ≤ 0.1 s of detection. Faults shall be classified as latching until power cycle or as recoverable, by documented rationale. During and after any reset the outputs shall be in SS-S until a valid safety mode is set."
  asil: "C"
  parents: [FSR-01.09, FSR-07.03]
  parent_text: "FSR-01.09, FSR-07.03"
  other_parents: false
  allocated_to: "P-SW, P-HW"
  mechanism: "FR"
  timing: "react ≤ 0.1 s"
  verification: "R, FI"
  baseline_impl: "**Not implemented.** Faults are report-only (`sys/faults.h:8-27`); `PERMANENT_FAULTS 0U` (`sys/sys.h:50`); only relay malfunction blocks TX (GAP-08). Start state SILENT (`main.c:295`). A hang (default handlers, `assert_fatal`, no IWDG) leaves the relay in its last state (GAP-43). HWSR-502…502c"
  status: proposed
  source: WP-S-02

- id: TSR-503
  kind: tsr
  text: "Memory faults that can corrupt actuation decisions shall be detected: RAM ECC with double-error reaction, flash image CRC at start-up and periodically, and periodic check of safety-critical configuration registers, each leading to TSR-502."
  asil: "C"
  parents: [FSR-01.09]
