  source: WP-S-02

- id: TSR-629
  kind: tsr
  text: "At start-up, before the first engagement of each ignition cycle, the SoC shall read the stored diagnostic trouble codes (DTCs) of the EPS and of the brake / stability control (ABS/VSC) ECU, and shall prevent engagement with a no-entry alert naming the system while either ECU reports an active code. (a) The read shall run only while the item cannot be engaged (before the car safety mode is requested) and only after the vehicle has been seen stationary; it shall never run while the vehicle moves or the item is engaged. (b) A code is active when its status shows test failed, test failed this operation cycle, confirmed, or warning indicator requested (ISO 14229-1 status bits 0, 1, 3, 7), counting only the bits the ECU reports as supported. Pending or history bits alone do not count. A code the release record exempts as not affecting lateral or longitudinal control does not count; none is exempt in the first release, and an exemption needs an impact analysis. (c) A read that was not made (vehicle not seen stationary), not answered completely within the read time, answered with a negative response or malformed, or that reports none of the active bits as supported, shall also prevent engagement, with its own no-entry alert, until the next start-up. (d) The result is an entry condition only: it does not disengage an engaged item. The driver's lamp check (WP-O-02 OPS-01) stays as a second barrier."
  asil: "QM (supports TSR-110, TSR-618)"
  parents: [FSR-02.12]
  parent_text: "FSR-02.12"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "PLB, ST"
  timing: "before engagement"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Implemented in host software, not verified on the vehicle (DQ-132 A, 2026-10-25; SWSR-629…629d): UDS ReadDTCInformation 0x19 / 0x02 to the firmware-query addresses (EPS `0x7a1`, ABS/VSC `0x7b0`) in card before `FirmwareQueryDone`; no-entry events `epsFaultCode`, `brakeFaultCode`, `faultCodeReadFailed` on the reference platform. Whether the reference car's ECUs answer this service is not known from the repository; WP-S-09 VS-SQ-20 checks it per ECU. Added v0.21 (DQ-056); refined v0.57 (DQ-132)"
  status: proposed
  source: WP-S-02

- id: TSR-630
  kind: tsr
  text: "While a car safety mode is active and the item is not engaged, the SoC shall check that every panda reports `controlsAllowed` false. A report of true for more than 2 consecutive `pandaStates` samples, and in any case within ≤ 0.3 s, shall prevent engagement with a no-entry alert, be logged as an envelope fault, and request ACC cancel. (The reverse of TSR-621: it makes a latent panda authority fault visible before the host also commands torque.)"
  asil: "QM (C-sup: TSR-105, TSR-301)"
  parents: [FSR-01.05, FSR-02.10]
  parent_text: "FSR-01.05, FSR-02.10"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "PLB"
  timing: "≤ 0.3 s (within the SG-01 0.5 s FTTI)"
  verification: "T-SIL, FI"
  baseline_impl: "Not implemented: `controlsMismatch` checks only the engaged direction (`selfdrive/selfdrived/selfdrived.py`, TSR-621). System FMEA SFM-001.C2, SFM-ACT-013. Added v0.22"
  status: proposed
  source: WP-S-02

