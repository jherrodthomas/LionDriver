  baseline_impl: "Partly met: `latActive` / `longActive` are false while an input is stale (`selfdrive/controls/lib/input_freshness.py`), but after 10 nominal periods, not 2, to avoid nuisance disengagements from model frame drops until logs show the jitter; the event is `selfdrived`'s `commIssue` from the same 10-period check (GAP-16 narrowed; impact record OI-1)"
