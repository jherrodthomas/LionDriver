- id: TSR-511
  kind: tsr
  text: "Only release-signed LionDriver firmware shall execute on the safety MCU: the bootstub shall verify an ECDSA signature over P-256 with SHA-256 (decided 2026-10-19, DQ-191 A; replaces RSA-1024/SHA-1), flash read-out and write protection shall be set, the SoC's control of `STM_BOOT0`/`STM_RST_N` shall not allow non-release code to drive the relay, release builds of `pandad` shall not flash a development bootstub, and softloader entry (`0xd1` param 1) shall be refused in a car safety mode and while the ignition is on (CSR-024)."
  asil: "C (+ CS)"
  parents: [FSR-01.10]
  parent_text: "FSR-01.10"
  other_parents: false
  allocated_to: "P-SW, P-HW (option bytes), SoC"
  mechanism: "CFG"
  timing: "—"
  verification: "R, T-HIL"
  baseline_impl: "**Not met.** RSA-1024/SHA-1 (`crypto/rsa.h:37`, `crypto/sha.h:45`; `bootstub.c:47-72`); only sector 0 protected from erase (`stm32h7/llflash.h:12-20`); SoC drives BOOT0/NRST (`openpilot/common/hardware/comma/hardware.py:400-419`); recovery flashes a development bootstub (`selfdrive/pandad/pandad.py:34-39`); softloader entry allowed in release at any time (`main_comms.h:176-180`) (GAP-24, GAP-38). See WP-S-07 (assurance/03-system/WP-S-07-cybersecurity-requirements-architecture.md)"
  status: proposed
  source: WP-S-02

- id: TSR-512
  kind: tsr
  text: "In release builds for the reference configuration the safety MCU shall accept only the modes SILENT, NOOUTPUT, ELM327 (fingerprinting, relay released) and TOYOTA with the reference safety parameter compiled into the firmware (EPS factor 73, no flags). Once TOYOTA mode is active, it shall accept only a change to NOOUTPUT or SILENT; any other request shall be rejected and reported. The alternative-experience word shall likewise be fixed to the reference value in release builds, so that it cannot be changed in a non-car mode and carried into a later TOYOTA session."
  asil: "C"
  parents: [FSR-01.10]
  parent_text: "FSR-01.10"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "CFG"
  timing: "per request"
  verification: "R, T-HIL"
  baseline_impl: "**Met in the reference build, not yet verified on hardware** (`LIONDRIVER_REFERENCE=1`, panda `3859fa8`): `0xdc` accepts only SILENT, NOOUTPUT, ELM327 and TOYOTA with parameter 73; in TOYOTA only NOOUTPUT or SILENT; `0xdf` refused, alternative experience stays 0 (`board/reference_lock.h`). Refused requests are counted in the health packet and published as `pandaState.requestsRejected`, and `pandad` logs them; no driver-facing alert yet. AOU-14 (IA mode lock (assurance/07-supporting/impact/change-2026-10-12-panda-safety-mode-lock.md))"
  status: proposed
  source: WP-S-02

- id: TSR-513
  kind: tsr
  text: "In release builds, control requests that can change actuation, relay, CAN configuration or comms state shall be rejected while a car safety mode is active: at least `0xc5` (relay drive), `0xe5` (CAN loopback), `0xde`/`0xf9`/`0xfc`/`0xe8` (bit rate and CAN-FD configuration), `0xdb` (OBD multiplexing), `0xe6` (clock source), `0xe7` (power save; in car mode it stops camera-side forwarding with the relay energised, SG-07, WP-A-04 SPF-08), `0xf1` (queue clear), `0xd1` param 1 (softloader entry, see also TSR-511), `0xd8` (MCU reset without fault reporting), `0xdf` (alternative experience, see TSR-512). Also `0xc0` (comms reset), `0xb0`/`0xb1` and `0xf6` (to be confirmed per WP-W-02 OI-5). A refused request is ignored: it shall not change the actuation state, and it does not by itself end actuation authority (decided 2026-10-19, DQ-082 B; the alternative, withdrawing authority and reporting it as RR-2026-009 F-36 and CSR-012 propose, was not chosen, so CSR-012's intent stays an open item of the cybersecurity case, WP-S-07 (assurance/03-system/WP-S-07-cybersecurity-requirements-architecture.md))."
  asil: "C"
  parents: [FSR-01.10]
  parent_text: "FSR-01.10"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "CFG"
  timing: "per request"
  verification: "R, T-HIL"
  baseline_impl: "**Partial, reference build only** (panda `9f60e17`): `0xc5`, `0xd8`, `0xdb`, `0xde`, `0xe5`, `0xe6`, `0xe7`, `0xe8`, `0xf1`, `0xf9`, `0xfc` and `0xd1` param 1 refused in a car mode (`board/reference_lock.h`). `0xc0`, `0xb0`, `0xb1`, `0xf6` still to be confirmed (WP-W-02 OI-5) (IA mode lock (assurance/07-supporting/impact/change-2026-10-12-panda-safety-mode-lock.md))"
  status: proposed
  source: WP-S-02

