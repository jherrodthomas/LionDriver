- id: TSR-301
  kind: tsr
  text: "The envelope shall grant actuation authority only on the rising edge of PCM_CRUISE (`0x1D2`) CRUISE_ACTIVE, and only once the SoC heartbeat reports the item engaged within 1 s of that edge (otherwise not until the next rising edge), and shall revoke it in the same frame in which CRUISE_ACTIVE is received false (cancel, main switch off, PCM-internal drop)."
  asil: "C"
  parents: [FSR-01.05, FSR-05.02]
  parent_text: "FSR-01.05, FSR-05.02"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "GATE"
  timing: "detect ≤ 1 period (30 ms at 33 Hz) / same frame"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Implemented: `safety.h:518-527`; `modes/toyota.h:143-146`. `0x1D2` has a checksum but no counter (GAP-01) → TSR-402…405. 2026-10-14, reference build: the heartbeat condition (WP-A-05 LS-06): the edge opens a 1 s window, the grant is made in the safety task once `heartbeat_engaged` is set; cancelled by cruise off, brake, an RX fault or a mode change (opendbc `9a13f60`, jherrodthomas/opendbc#14 (https://github.com/jherrodthomas/opendbc/pull/14)); unit-tested, not verified on the vehicle"
  status: proposed
  source: WP-S-02

