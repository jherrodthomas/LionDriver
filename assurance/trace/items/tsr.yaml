  parents: [FSR-01.08]
  parent_text: "FSR-01.08"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "E2E"
  timing: "per transfer"
  verification: "T-HIL, FI"
  baseline_impl: "Not implemented (GAP-10). Host-side age check is 1 s (`selfdrive/pandad/pandad.cc:78-79`), see TSR-614"
  status: proposed
  source: WP-S-02

- id: TSR-412
  kind: tsr
  text: "The envelope shall validate every length field received over SPI against its buffer size before starting a DMA transfer or copy, and every control-request parameter used as an array index against the array bounds; a violation shall be NACKed and counted as an SPI error."
  asil: "C"
  parents: [FSR-01.08, FSR-01.10]
  parent_text: "FSR-01.08, FSR-01.10"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "ISO, PLB"
  timing: "per transfer"
  verification: "R, T-HIL, FI"
  baseline_impl: "**Not met (NF-04):** MOSI/MISO lengths are taken from the header (`drivers/spi.h:115-116`) and the data DMA is started with `spi_data_len_mosi + 1` into a 4096-byte buffer (`drivers/spi.h:233`, `drivers/drivers.h:216`) without a bound check; `comms_can_read` fills `spi_buf_tx` up to the requested MISO length (`drivers/spi.h:150`); request `0xe8` indexes `bus_config[param1]` without a bound check (`main_comms.h:262-264`). The nominal host keeps lengths below the buffer size (`selfdrive/pandad/spi.cc:319-320`), but freedom from interference cannot rely on the QM host"
  status: proposed
  source: WP-S-02

