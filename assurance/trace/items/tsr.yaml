- id: TSR-101
  kind: tsr
  text: "The envelope shall reject every STEERING_LKA (`0x2E4`) frame whose STEER_TORQUE_CMD magnitude exceeds the torque bound τ_max(v) of TSR-102. Until TSR-102 is implemented, τ_max is the baseline 1500 raw."
  asil: "B‡"
  parents: [FSR-01.01]
  parent_text: "FSR-01.01"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "LIM"
  timing: "per frame / frame rejected (then TSR-108, TSR-109)"
  verification: "A, T-SIL, T-VEH"
  baseline_impl: "Partial: fixed 1500 raw (`modes/toyota.h:173`, check at `lateral.h:73-74`). No physical rationale (GAP-04)"
  status: proposed
  source: WP-S-02

- id: TSR-102
  kind: tsr
  text: "τ_max(v) shall be a speed-dependent lookup derived on the reference vehicle by (1) characterising the steady-state lateral acceleration and wheel torque produced by raw requests 0…1500 at speeds 10…120 km/h (AOU-01R), (2) choosing per speed the largest request whose worst-case lateral deviation over the driver intervention time stays inside the bound of WP-S-04 §3 (assurance/03-system/WP-S-04-timing-ftti-budget.md), and (3) confirming controllability C1 for that bound with the tests of WP-C-08 (assurance/02-concept/WP-C-08-driver-hmi-misuse-analysis.md) §8. The speed value used shall be the one that yields the smaller torque bound when the speed estimate is uncertain."
  asil: "B‡"
  parents: [FSR-01.01]
  parent_text: "FSR-01.01"
  other_parents: false
  allocated_to: "P-SW (+ calibration data, WP-W-09 (assurance/05-software/WP-W-09-configuration-calibration-data.md))"
  mechanism: "LIM"
  timing: "per frame"
  verification: "A, T-SIL, T-VEH"
  baseline_impl: "Not implemented for Toyota: `dynamic_max_torque` not set (`modes/toyota.h:172-186`). The mechanism exists (`lateral.h:66-71`) but uses `vehicle_speed.min − 1 m/s`, which is conservative only if τ_max increases with speed; the direction must be checked against the derived table (OI-3). Speed input integrity: TSR-405(a). GAP-04"
  status: proposed
  source: WP-S-02

- id: TSR-103
  kind: tsr
  text: "The envelope shall reject a `0x2E4` frame whose torque lies outside [min(r, 0) − Δ, max(r, 0) + Δ], where r is the previous frame's torque and Δ = Δ_up for the frame rate check, or r is the torque at the start of the current real-time window and Δ = Δ_rt for the window check; the window restarts with the first frame more than 250 ms after its start. So a rise in magnitude, or a crossing of zero, by more than Δ (from r or from 0) is rejected, and these two checks accept any change toward zero: a fall toward zero is the safe direction for SG-01, and a bounded ramp of torque withdrawn on a fault is FSR-02.04's. While the command exceeds the measured EPS torque by more than Δ_meas, it shall fall by at least Δ_down per frame (TSR-104). A frame still beyond that bound after a smaller fall toward zero is rejected. After a rejected frame, or while authority is not granted, the reference for these checks is 0. The values shall be derived from the onset rate accepted in the controllability tests; the baseline values are Δ_up 15 and Δ_down 25 raw per frame and Δ_rt 450 raw per 250 ms."
  asil: "B‡"
  parents: [FSR-01.02]
  parent_text: "FSR-01.02"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "LIM"
  timing: "per frame"
  verification: "A, T-SIL"
  baseline_impl: "Implemented without rationale: `modes/toyota.h:174-177`; `lateral.h:49-57, 82-95`; `MAX_RT_INTERVAL` `declarations.h:71`. Host uses the same values (`values.py:45-47`), zero margin (GAP-04)"
  status: proposed
  source: WP-S-02

- id: TSR-104
  kind: tsr
  text: "The envelope shall reject `0x2E4` frames whose torque exceeds the measured EPS motor torque (`0x260` STEER_TORQUE_EPS scaled by the EPS factor of the safety parameter) by more than Δ_meas (measured from 0 when the measured torque is of the opposite sign), using the minimum/maximum of the last 6 samples widened by 1 raw, unless the frame falls toward zero by at least Δ_down from the previous frame (TSR-103). Baseline Δ_meas = 350 raw."
  asil: "B‡"
  parents: [FSR-01.03]
  parent_text: "FSR-01.03"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "LIM, PLB"
  timing: "per frame"
  verification: "T-SIL"
  baseline_impl: "Implemented: `modes/toyota.h:98-111, 176`; `lateral.h:10-23, 82-83`; sample window `declarations.h:68`. Depends on `0x260` integrity (TSR-402…405) and on the EPS factor being locked (TSR-512)"
  status: proposed
  source: WP-S-02

