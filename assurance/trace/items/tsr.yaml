  verification: "T-HIL, FI"
  baseline_impl: "Not implemented (latent-fault handling absent)"
  status: proposed
  source: WP-S-02

- id: TSR-516
  kind: tsr
  text: "The safety MCU shall sound its own acoustic warning within ≤ 0.5 s of detection (except as stated below for (b) on an EPS fault), without depending on SoC software, for at least 3 s or for as long as its condition holds if longer, at a level audible over the cabin noise of the reference vehicle (level set by WP-S-04 M-05), when (a) the SoC heartbeat is lost (TSR-407) while authority is granted; if authority ended within the 5 s before the loss, a warning within ≤ 5 s of the loss is sufficient, because the driver has already been told of the disengagement (decided 2026-10-14, DQ-061 A); (b) the envelope revokes authority while it is granted for any reason other than a driver action that the envelope itself observes (brake press, TSR-302; PCM cruise inactive, TSR-301), that is on missing SoC command frames (TSR-408), an RX fault (TSR-406), an EPS fault state (TSR-110), a rejected command (TSR-108), a car-side TX failure or bus-off (TSR-508) or a platform fault (TSR-502); or (c) PCM cruise is still active 0.5 s (within one 10 ms task period) after the SoC heartbeat first reported \"not engaged\" (a fault-induced disengagement whose ACC cancel, TSR-303, had no effect); or (d) the safety MCU restarts after a watchdog or fault reset (TSR-501, TSR-502) that interrupted granted authority. For (b) on an EPS fault, this clause replaces the ≤ 0.5 s bound: detection is the first fault frame, any persistence filter before the warning shall be ≤ 0.7 s, and the siren shall sound within the SG-02 1 s warning budget from fault onset (decided 2026-10-14, DQ-048). For (d), the item's engaged state shall be kept across the reset in memory that the reset does not clear, and the siren shall sound ≤ 0.5 s after the restart (decided 2026-10-14, DQ-054). A stalled SoC stops both the command frames and the heartbeat; whichever of TSR-408 and TSR-407 revokes first shall sound the siren under (b) or (a), so that a SoC stall is never silent, while a disengagement by the driver stays silent (decided 2026-10-19, DQ-404 A). A revocation on a heartbeat \"not engaged\" (TSR-307(a)) sounds the siren under (c), not (b): only if PCM cruise is still active 0.5 s after the first such heartbeat, so that a disengagement openpilot ends with an ACC cancel stays silent (cancel-lag guard, decided by the lead 2026-10-21; the PCM cancel lag is to be measured, WP-W-02 OI-18)."
  asil: "C"
  parents: [FSR-02.05, FSR-06.05]
  parent_text: "FSR-02.05, FSR-06.05"
  other_parents: false
  allocated_to: "P-SW, P-HW"
  mechanism: "WRN"
  timing: "≤ 0.5 s after detection"
  verification: "T-HIL"
  baseline_impl: "Partial: (a) heartbeat loss: siren for 3 s at once when the 0.3 s heartbeat monitor (TSR-407) revokes authority that was granted, ≤ 0.3 s + 10 ms + 250 ms ≈ 0.56 s after the last heartbeat, in all builds (panda `c33343b`, `drivers/heartbeat_siren.h`, IA fast heartbeat (assurance/07-supporting/impact/change-2026-10-12-panda-fast-heartbeat.md) §5; not verified on hardware); the 1 Hz path (siren for 3 s after 4–5 s heartbeat loss if authority within the last 5 s, `main.c:169-171, 198-201`) unchanged, and alone covers authority that ended within the 5 s before the loss, which meets the ≤ 5 s of the reworded (a) (DQ-061 A); (b) for the EPS fault (TSR-110): siren once the fault has persisted 0.7 s (DQ-048, panda `bf8102a`; 1 s before) while authority is granted (since panda `3ee2796`, register DQ-367: counted from when the fault is first seen with authority granted, also after the TSR-408 arrival check revokes authority during the fault), ≥ 3 s, ≤ 0.26 s after that detection (worst case: the speaker sounds only on every other 8 Hz tick) (panda `b790fca`, `drivers/eps_fault_siren.h`, IA EPS fault (assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-eps-fault.md) §7; detection defined as 1 s persistence by maintainer decision 2026-10-12, to be confirmed against fault durations in reference logs); persistence shortened from 1 s to the ≤ 0.7 s required by DQ-048 at panda `bf8102a` (WP-S-04 T-28, siren ≤ 0.96 s from onset); (b) for missing SoC command frames (TSR-408, DQ-404 A): since panda `8a69ccf` with opendbc `4d1a056` (reference build), the same 3 s siren starts in the safety task in which the command-arrival check revokes granted authority (opendbc `safety_tx_arrival_revoked`, `drivers/heartbeat_siren.h`), so a full SoC stall, where TSR-408 revokes before the heartbeat check (WP-S-04 T-34), sounds it ≤ 0.06 s + 2 × 125 ms ≈ 0.31 s after the last `0x2E4`; a driver brake press or PCM cruise drop and an RX fault do not set the flag; because the arrival check counts only accepted frames, a host that keeps sending refused frames (TSR-108 content, an EPS fault, a switch fallen to pass-through) also gets the siren once its frames have been refused for 50 ms (IA siren on TX-arrival revocation (assurance/07-supporting/impact/change-2026-10-20-panda-tx-arrival-siren.md); host tests and plant runs F-04b: siren 0.25–0.29 s after the stall, the driver corrects at 1.79 s instead of 2.68 s at the ODD curve bound, silent-stall.md (assurance/sim/results/silent-stall.md), synthetic, no evidence credit; not verified on hardware); (c) **implemented in the reference build, not verified on hardware** (panda `f4803c5`, #382): the same 3 s siren starts if PCM cruise is still active 0.5 s after the first heartbeat reporting \"not engaged\" (`board/drivers/engaged_mismatch.h`, SWSR-516b); plant run with selfdrived stopped and the heartbeat going on: siren 0.63–0.88 s after the stop (none before), the driver corrects at 2.13–2.38 s instead of 2.32–3.37 s (engaged-mismatch.md (assurance/sim/results/engaged-mismatch.md), synthetic); the guard keeps an openpilot disengagement silent only if the PCM drops cruise within 0.5 s of the cancel, which is not measured (WP-W-02 OI-18); other (b) triggers (RX fault TSR-406, TX failure TSR-508, platform fault TSR-502) and (d) not implemented ((d): a bench test of the reset behaviour comes first, WP-S-04 M-06; retained memory is a hardware choice, WP-H-01); siren path via codec over I2C on some boards, malfunction reported only (`drivers/fake_siren.h:38-52`); shared speaker with SoC audio to be analysed in DFA (WP-A-03 (assurance/08-analyses/WP-A-03-dependent-failure-analysis.md))"
  status: proposed
  source: WP-S-02

- id: TSR-517
  kind: tsr
  text: "Corruption of an approved actuation frame after the TX hook (copy into FDCAN message RAM, message RAM, FDCAN core, transceiver) shall be detected, e.g. by reading back the safety MCU's own transmitted frames on the car-side bus and comparing them with the approved frame, and a mismatch shall lead to TSR-502."
  asil: "C"
  parents: [FSR-01.09]
  parent_text: "FSR-01.09"
  other_parents: false
  allocated_to: "P-SW, P-HW"
  mechanism: "PLB"
  timing: "≤ 2 frames / react per TSR-502"
  verification: "A, FI"
  baseline_impl: "**Not implemented.** Packet XOR checked before the FDCAN load only (`drivers/fdcan.h:100`); no read-back after load (WP-A-04 SPF-02, System FMEA SFM-029.C7)"
  status: proposed
  source: WP-S-02

- id: TSR-518
  kind: tsr
  text: "The envelope shall supervise the transmit rate of each actuation message ID (`0x2E4`, `0x343`, `0x412`, and any other TX-whitelisted ID) against its nominal period and reject frames sent faster than the nominal rate plus a defined tolerance; persistent excess while authority is granted shall revoke authority and be reported."
  asil: "C"
  parents: [FSR-01.08, FSR-01.12]
  parent_text: "FSR-01.08, FSR-01.12"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "TMO"
  timing: "per frame; revoke ≤ 0.1 s after the first rejected frame (DN-01 (assurance/05-software/design-notes/DN-01-tx-rate-supervision.md) D-6; ≤ 0.2 s from the onset of a flood at 2× the nominal rate)"
  verification: "T-SIL, T-HIL"
  baseline_impl: "**Met in the reference build, not yet verified on hardware** (opendbc `7993399`, panda `8aa8671`, IA TX rate (assurance/07-supporting/impact/change-2026-10-12-tx-rate-supervision.md)): per-ID count over a sliding 250 ms window with budgets for every TX-whitelisted ID; frames beyond the budget rejected before the content checks; 3 rejections in a half-window while authority is granted revoke it, reported as `pandaState.txRateExceeded`. Budgets to be confirmed on reference logs (DN-01 §9). RX rate is TSR-403"
  status: proposed
  source: WP-S-02

- id: TSR-519
  kind: tsr
  text: "The safety MCU shall have a documented interrupt-priority and execution-timing scheme: priorities assigned explicitly for every enabled interrupt; safety hooks, CAN TX and SoC command dispatch either moved out of interrupt context or bounded by measured WCET; and the worst-case latency of the periodic safety processing (timeouts, heartbeat, watchdog service) shown to meet the TSR-401/407/501 budgets under worst-case interrupt load."
  asil: "C"
  parents: [FSR-01.09, FSR-01.07]
  parent_text: "FSR-01.09, FSR-01.07"
  other_parents: false
  allocated_to: "P-SW, P-HW (cfg)"
  mechanism: "ISO"
  timing: "analysis; WCET measured on target"
  verification: "A, T-HIL"
  baseline_impl: "**Partial** (panda `52cad44`): every enabled interrupt has an explicit priority, all at one level until the WP-W-03 §5.4.2 scheme is adopted; R-1 and R-8 races closed, R-2 bounded at 10 ms. **Not implemented:** WCET and latency measurement (WP-W-03 §5.4.5); RX hook in the FDCAN interrupt (`drivers/fdcan.h:221, 245-252`); TX hook and control-request dispatch in the SPI DMA interrupt (`stm32h7/llspi.h:56-60`, `drivers/spi.h:143, 162`, `can_comms.h:97, 118`) (GAP-50)"
  status: proposed
  source: WP-S-02

- id: TSR-601
  kind: tsr
  text: "`selfdrived` shall classify faults as (i) untrusted command or input (loss or staleness of an input to the control law, model failure, CAN error, controls mismatch) → immediate disable, and (ii) trustworthy but degrading (thermal, storage, memory) → soft disable. Actuation on an input that has failed its alive or validity check shall end within ≤ 0.2 s."
  asil: "QM (C-sup: TSR-407, TSR-408)"
  parents: [FSR-02.02, FSR-02.04, FSR-06.02]
  parent_text: "FSR-02.02, FSR-02.04, FSR-06.02"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "FR"
  timing: "≤ 0.2 s"
  verification: "T-SIL, FI"
  baseline_impl: "Not met: `commIssue` is SOFT_DISABLE (`selfdrive/selfdrived/events.py:853-856`), soft disable keeps actuating 3 s (`selfdrive/selfdrived/state.py:7-8`); alive allows 10 periods (`cereal/messaging/__init__.py:265`) (GAP-16). FM-03 in WP-C-07 (assurance/02-concept/WP-C-07-sotif-functional-modifications.md)"
  status: proposed
  source: WP-S-02

