  status: proposed
  source: WP-S-02

- id: TSR-404
  kind: tsr
  text: "For RX signals that vary in normal operation, the envelope shall detect a frozen payload: an identical data field (excluding checksum) for longer than t_frz while the vehicle is moving (`0x260` torque/angle bytes; `0xAA` wheel speeds above a minimum speed; `0xB4` ENCODER). t_frz shall be set from fork-owned drive logs so that no false detection occurs in the reference log set."
  asil: "C"
  parents: [FSR-01.06]
  parent_text: "FSR-01.06"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "PLB"
  timing: "detect ≤ t_frz (target ≤ 0.2 s)"
  verification: "LOG, T-SIL, FI"
  baseline_impl: "Not implemented (GAP-01)"
  status: proposed
  source: WP-S-02

- id: TSR-405
  kind: tsr
  text: "The envelope shall apply these cross-checks and treat a disagreement lasting longer than its tolerance time as an RX fault: (a) wheel-speed mean (`0xAA`) vs SPEED (`0xB4`) within 2 m/s; (b) BRAKE_PRESSED in `0x226` vs PCM_CRUISE_2 (`0x1D3`) BRAKE_PRESSED — on disagreement the envelope shall assume \"brake pressed\" (revoke); (c) CRUISE_ACTIVE = 1 shall imply PCM_CRUISE_2 MAIN_ON = 1; (d) while authority is granted, measured EPS torque shall follow the accepted command within an EPS-response tolerance (detects frozen or replaced `0x260`). Signal availability and tolerances shall be confirmed on reference-vehicle logs."
  asil: "C"
  parents: [FSR-01.06, FSR-05.01]
  parent_text: "FSR-01.06, FSR-05.01"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "PLB (cross-channel)"
  timing: "detect ≤ 0.2 s"
  verification: "LOG, T-SIL, FI"
  baseline_impl: "**Partial** (reference build, opendbc `875e325`, IA cruise/main (assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-cruise-main.md)): (c) CRUISE_ACTIVE with `0x1D3` MAIN_ON = 0 refuses engagement at once and revokes authority after a 150 ms disagreement. **Not implemented:** (a) speed cross-check (`0xB4` not in the RX set, no nominal rate); (b) BRAKE_PRESSED cross-check, pending the meaning of the `0x1D3` bit (driver pedal or any braking, ACC included) from reference logs; (d) EPS-response check (GAP-01). A speed cross-check helper exists but is unused by the Toyota mode (`safety.h:529-537`). Candidate signals: `0xB4` SPEED/ENCODER (`opendbc_repo/opendbc/dbc/generator/toyota/_toyota_2017.dbc:77-80`), `0x1D3` BRAKE_PRESSED (`_toyota_2017.dbc:110-111`)"
  status: proposed
  source: WP-S-02

- id: TSR-406
  kind: tsr
  text: "On any RX fault of TSR-401…405, the envelope shall revoke all actuation authority within ≤ 0.1 s (SS-L via TSR-109, SS-G), report a fault-specific reason code to the SoC, and not grant authority again until all checks pass and a new PCM rising edge occurs."
  asil: "C"
  parents: [FSR-01.06, FSR-01.12]
  parent_text: "FSR-01.06, FSR-01.12"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "FR"
  timing: "react ≤ 0.1 s"
  verification: "T-SIL, FI"
  baseline_impl: "Partial: revocation on checksum/quality (`safety.h:112-121`) and timeout (`safety.h:337-340`); only a single flag is reported (`main_comms.h:23`)"
  status: proposed
  source: WP-S-02

- id: TSR-407
  kind: tsr
  text: "In a car safety mode, the envelope shall detect absence of the SoC heartbeat (`0xf3`) for > 0.3 s and then revoke all actuation authority at once (SS-L, SS-G). It shall enter SS-S (SILENT, relay released) after the longer timeout of TSR-510."
  asil: "C"
  parents: [FSR-01.07]
  parent_text: "FSR-01.07"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "TMO"
  timing: "detect ≤ 0.3 s / react ≤ 0.1 s"
  verification: "T-HIL, FI"
  baseline_impl: "**Partial, not yet verified on hardware** (panda `c2e5d93`): in a car mode the 100 Hz safety task revokes all authority once no heartbeat has arrived for 0.3 s (`drivers/heartbeat_monitor.h`); the host sends it at 10 Hz. SILENT still follows after 5 s (TSR-510). Open: safety-task latency under load (WP-W-03 §5.4), HIL (IA heartbeat (assurance/07-supporting/impact/change-2026-10-12-panda-fast-heartbeat.md))"
  status: proposed
  source: WP-S-02

- id: TSR-408
  kind: tsr
  text: "While lateral authority is granted, the envelope shall monitor the arrival of `0x2E4` frames from the SoC and, if no frame arrives for > 50 ms (5 frames), revoke authority and command SS-L (TSR-109). While longitudinal authority is granted, the same shall apply to `0x343` with a gap > 100 ms."
  asil: "C"
  parents: [FSR-01.07]
  parent_text: "FSR-01.07"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "TMO"
  timing: "detect ≤ 50 / 100 ms / react ≤ 0.1 s"
  verification: "T-HIL, FI"
  baseline_impl: "**Implemented in the reference build, not yet verified on hardware** (opendbc `273f44e`, opendbc#11): while authority is granted, the 100 Hz safety task revokes it when `0x2E4` has not reached the TX hook for > 50 ms or, with openpilot longitudinal, `0x343` for > 100 ms (`safety.h` `tx_arrival_ok`, `modes/toyota.h`). SS-L follows from the revocation (TSR-109). Open: thresholds on reference logs, HIL (IA TX arrival (assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-tx-arrival.md))"
  status: proposed
  source: WP-S-02

- id: TSR-409
  kind: tsr
  text: "The heartbeat shall carry evidence that the control loop is alive (e.g. the latest `carControl` frame counter), and the envelope shall treat a heartbeat whose evidence has not advanced for > 0.3 s as a missing heartbeat."
