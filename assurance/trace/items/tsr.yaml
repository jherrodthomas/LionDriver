  status: proposed
  source: WP-S-02

- id: TSR-626
  kind: tsr
  text: "While engaged, the SoC shall detect that the envelope does not actuate from evidence other than the envelope's own status report: (a) `pandaStates` older than 2 nominal periods (0.2 s) is treated as a controls mismatch (TSR-621); (b) with lateral control active, the EPS-applied torque (STEER_TORQUE_EPS in `0x260`) not following a commanded torque above a threshold for longer than t_blk; (c) with longitudinal control active, the measured acceleration not following the requested acceleration beyond a tolerance for longer than t_blk. (d) with lateral control active, EPS_STATUS (`0x262`) LKA_STATE not reporting LKA active, or with longitudinal control active, the PCM not reporting ACC in control, for longer than t_blk; (e) the transmitted-frame count of TSR-632 not advancing for a commanded actuation ID. Each leads to immediate disable with a take-over request, so that the warning falls within the SG-02/SG-06 1 s budget (SFM-ACT-018). Threshold, tolerance and t_blk (≤ 0.5 s) shall be set from fork-owned drive logs so that no false detection occurs in the reference log set. (b) and (c) target envelope blocking; an EPS or PCM that silently stops acting on the item's requests is covered by AOU-17 instead, verified with forced faults (decided 2026-10-18, DQ-360 A); if that test finds a silent drop, (b) and (c) are extended to it."
  asil: "QM (C-sup: TSR-516)"
  parents: [FSR-02.10]
  parent_text: "FSR-02.10"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "PLB"
  timing: "(a) 0.2 s; (b), (c) ≤ t_blk ≤ 0.5 s"
  verification: "LOG, T-SIL, FI"
  baseline_impl: "Not implemented. (a): `pandaStates` alive limit is 1 s (WP-S-03 §9). The vehicle-side signals come through the panda RX stream, which is separate from the health report but not independent of the MCU (WP-A-03 (assurance/08-analyses/WP-A-03-dependent-failure-analysis.md) DFI-24)"
  status: proposed
  source: WP-S-02

