  status: proposed
  source: WP-S-02

- id: TSR-607
  kind: tsr
  text: "The SoC shall warn the driver when the EPS reports LKA unavailable or faulted (complements TSR-110). (a) Outside the cases of (b) the warning is the take-over request (soft disable, visual and acoustic). (b) When the fault starts within 1.5 s of a driver steering override, or at standstill, the SoC may first give the lighter prompt (small alert with chime); if the fault is still present 1.5 s after it started, the SoC shall escalate to the take-over request of (a). The lighter prompt shall not be held for the duration of the fault. (Decided 2026-10-16, register DQ-342, A; System FMEA SFM-ACT-023.) (c) When the fault starts while the driver is steering and lasts more than 1.5 s while they keep steering, the SoC shall give at least the lighter prompt, so that the driver learns of the lost assistance before releasing the wheel; on release the take-over request of (a) follows at once. (Decided by the lead in chat on 2026-10-17, register DQ-366, A; impact record OI-2.)"
  asil: "QM (C-sup: TSR-110)"
  parents: [FSR-02.01]
  parent_text: "FSR-02.01"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "WRN"
  timing: "(a) ≤ 1 s; (b) prompt ≤ 1 s, take-over request ≤ 1.5 s after fault onset (the driver has hands on the wheel within the window)"
  verification: "T-SIL, T-VEH"
  baseline_impl: "(a), (b) implemented in `7158a9a` (#174): the lighter `steerTempUnavailableSilent` is allowed only for the first 1.5 s of the fault (`STEER_FAULT_SILENT_FRAMES`, `openpilot/selfdrive/car/car_events.py:17, 169-183`), then `steerTempUnavailable` (soft disable); unit-tested (`openpilot/selfdrive/car/tests/test_steer_fault_warning.py`, 6 tests); not verified on the vehicle (impact record (assurance/07-supporting/impact/change-2026-10-17-eps-fault-escalation.md)). (c) implemented in `487d4ef` (#179): the lighter prompt once the fault has lasted 1.5 s while the driver keeps steering, the take-over request on release; unit-tested (`test_released_after_holding`, `test_short_fault_while_holding`); not verified on the vehicle"
  status: proposed
  source: WP-S-02

- id: TSR-608
  kind: tsr
  text: "Driver monitoring shall escalate warnings for an inattentive driver with the timing set in WP-C-08 §5 (baseline vision 5/8/13 s, wheel-touch 5/15/25 s)."
