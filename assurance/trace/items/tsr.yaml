  status: proposed
  source: WP-S-02

- id: TSR-303
  kind: tsr
  text: "On every fault-induced disengagement, with or without openpilot longitudinal, the SoC shall set CANCEL_REQ so that the PCM drops ACC. The PCM cruise state then changes, which changes the cluster cruise indication (TSR-309, AOU-12) and makes the envelope revoke (TSR-301); a cancel without effect is caught by TSR-516(c)."
  asil: "QM (C-sup: TSR-203, TSR-301, TSR-516)"
  parents: [FSR-03.05, FSR-02.03, FSR-06.02]
  parent_text: "FSR-03.05, FSR-02.03, FSR-06.02"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "FR"
  timing: "≤ 0.1 s after disengagement"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Implemented on host: cancel whenever PCM cruise is on and the item is not enabled (`openpilot/selfdrive/controls/controlsd.py:163`), sent in ACC_CONTROL in both longitudinal modes (`opendbc_repo/opendbc/car/toyota/carcontroller.py:253-254, 269-273`). The host replaces the PCM's own fault sound on a forced cancel with its own UI sound (`carcontroller.py:283-287`); whether the PCM sound is an independent cue is part of AOU-12"
  status: proposed
  source: WP-S-02

- id: TSR-304
  kind: tsr
  text: "The envelope shall monitor STEER_TORQUE_DRIVER (`0x260`) on the LKA path and (a) reject `0x2E4` frames that increase torque opposing the driver beyond a driver allowance (driver-limited check in addition to the measured-torque check of TSR-104), and (b) when the driver torque exceeds T_ovr for longer than t_ovr, back off: accept only frames whose torque does not oppose the driver more than the previous frame, so that the commanded torque falls toward zero at no less than the Δ_down rate and stays there while the override lasts, and report the override state to the SoC (TSR-628). Lateral authority is kept, so assistance resumes when the driver releases (decided 2026-10-14, DQ-053: back off on override and show a cue; WP-A-05 LS-01, LS-02). T_ovr, t_ovr and the allowance shall be derived from the override behaviour accepted in WP-C-08 (assurance/02-concept/WP-C-08-driver-hmi-misuse-analysis.md) and from the EPS override threshold (AOU-02R)."
  asil: "B (SG-05); B‡ (SG-01, HE-05.2)"
  parents: [FSR-05.03]
  parent_text: "FSR-05.03"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "PLB, GATE"
  timing: "detect ≤ 2 frames of `0x260` (40 ms) + t_ovr, with t_ovr ≤ 0.1 s / torque decreasing the next frame, so the back-off starts ≤ 0.2 s after the driver's input (SG-05, WP-S-04 §3.7; SFM-ACT-016)"
  verification: "T-SIL, T-VEH"
  baseline_impl: "**Not implemented on the LKA path** (GAP-02). Driver torque is sampled (`modes/toyota.h:113-116`) but used only for LTA (`modes/toyota.h:294-298`). A driver-limited check exists (`lateral.h:26-46`, `TorqueDriverLimited`) but the Toyota mode is motor-limited (`modes/toyota.h:178`). Host-only: `MAX_USER_TORQUE` 500 (`carcontroller.py:33, 83`)"
  status: proposed
  source: WP-S-02

- id: TSR-305
  kind: tsr
  text: "While the accelerator is pressed (PCM_CRUISE GAS_RELEASED = 0), the envelope shall withdraw longitudinal authority (inactive value only, TSR-203). The accelerator shall not revoke lateral authority in the reference configuration unless the HMI decision in WP-C-08 changes `DisengageOnAccelerator`."
  asil: "B"
  parents: [FSR-04.04, FSR-05.04]
  parent_text: "FSR-04.04, FSR-05.04"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "GATE"
  timing: "detect ≤ 1 period / same frame"
  verification: "T-SIL"
  baseline_impl: "Implemented: `modes/toyota.h:146`; `longitudinal.h:3-5`. `DisengageOnAccelerator` default `0` (`common/params_keys.h:35`)"
  status: proposed
  source: WP-S-02

- id: TSR-306
  kind: tsr
  text: "The envelope shall not grant actuation authority while any RX check of TSR-401…405 is failed, including timeouts not yet evaluated by the periodic check."
  asil: "C"
  parents: [FSR-01.05, FSR-01.06]
  parent_text: "FSR-01.05, FSR-01.06"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "GATE"
  timing: "per frame"
  verification: "T-SIL"
  baseline_impl: "**Met for the existing checks** (opendbc `aff4033`): for Toyota, a PCM rising edge grants authority only if every RX check is seen, valid and not lagging at that moment (`rx_checks_allow_engagement()` in `safety.h`). Frozen-value and cross-checks do not exist yet (IA RX timeout (assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-rx-timeout.md) §7)"
  status: proposed
  source: WP-S-02

- id: TSR-307
  kind: tsr
  text: "(a) The envelope shall revoke authority when the SoC heartbeat has reported \"not engaged\" continuously for 0.3 s while authority is granted; an \"engaged\" heartbeat restarts the count. (b) The SoC shall immediately disable when the envelope's reported authority differs from its own engaged state for > 0.3 s."
  asil: "(a) C; (b) QM (C-sup)"
  parents: [FSR-05.06, FSR-01.07]
  parent_text: "FSR-05.06, FSR-01.07"
  other_parents: false
  allocated_to: "P-SW (a); SoC (b)"
  mechanism: "PLB"
  timing: "(a) ≤ 0.3 s / same tick; (b) ≤ 0.3 s"
  verification: "T-HIL, FI"
  baseline_impl: "(a) **Implemented in the reference build, not verified on hardware** (panda `f4803c5`, #382): the 100 Hz safety task revokes authority 0.3 s after the first heartbeat that reports \"not engaged\" while authority is granted (`board/drivers/engaged_mismatch.h`, SWSR-307); other builds keep the 1 Hz check, 3 consecutive ticks ≈ 2–3 s (`main.c:262-268`). Plant run (selfdrived stops, pandad keeps the heartbeat, MCS-02.9): revoked 0.39–0.48 s after the stop (2.25–3.16 s before); the item stops steering at ≈ 0.1 s, so the siren of TSR-516(c) is what shortens the drift (engaged-mismatch.md (assurance/sim/results/engaged-mismatch.md), synthetic, no evidence credit). (b) Partial, not verified on the vehicle: `controlsMismatch` after 2 consecutive mismatched `pandaStates` samples (10 Hz, about 0.1–0.2 s) and at most 0.5 s after the first mismatched frame (`selfdrive/selfdrived/selfdrived.py:361-366, 566-574`, `supervision.py`; TSR-621, LionDriver #51); above the 0.3 s of (b) in the worst case, and samples in the first 0.3 s after engaging are not counted (TSR-301). Before #51: 200 cumulative cycles, about 2 s (GAP-06)"
  status: proposed
  source: WP-S-02

- id: TSR-308
  kind: tsr
  text: "If PCM cruise is active while the item is not engaged, or the item is engaged while PCM cruise is inactive, for longer than 1 s, the SoC shall warn the driver and request ACC cancel."
  asil: "QM (C-sup: TSR-301)"
  parents: [FSR-05.06]
  parent_text: "FSR-05.06"
