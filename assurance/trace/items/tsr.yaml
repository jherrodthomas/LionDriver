  parents: [FSR-01.11, FSR-07.03]
  parent_text: "FSR-01.11, FSR-07.03"
  other_parents: false
  allocated_to: "P-HW, HAR, P-SW"
  mechanism: "PLB, FR"
  timing: "detect ≤ 0.3 s"
  verification: "A, T-HIL, FI"
  baseline_impl: "Partial: open-drain active-low drive, released at init (`drivers/harness.h:8-33, 96-107`); indirect detection only (camera control messages on the car side) after a 1 s transition window counted at 1 Hz (`safety.h:211-220, 372-380`); cleared on every mode change (`safety.h:427, 459`), so a host can clear it with `0xdc`. No readback (GAP-12); relay stuck in intercept not detected at all (GAP-43). HWSR-506…506d"
  status: proposed
  source: WP-S-02

