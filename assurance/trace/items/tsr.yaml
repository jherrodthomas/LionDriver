  kind: tsr
  text: "`controlsd` shall check the age of `modelV2`, `longitudinalPlan` and `carState` before use (≤ 2 nominal periods) and shall set `latActive`/`longActive` false and raise an event when an input is stale."
  asil: "QM (C-sup: TSR-408)"
  parents: [FSR-02.02, FSR-06.01]
  parent_text: "FSR-02.02, FSR-06.01"
  other_parents: false
  allocated_to: "SoC"
  mechanism: "TMO"
