  text: "Only released baselines shall be installed by update; until signed updates exist, automatic updates shall be disabled and updates installed manually, followed by INS-15…INS-23; model-weight changes require SOTIF re-evaluation; envelope changes require the envelope verification evidence; parameters shall be re-checked after each update; a withdrawn release shall be replaced or the item put in dashcam mode."
