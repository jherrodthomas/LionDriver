  status: proposed
  source: WP-S-02

- id: TSR-621
  kind: tsr
  text: "While engaged, `selfdrived` shall raise an immediate disable with a take-over request when any panda in a car safety mode reports `controlsAllowed` false, after at most 2 consecutive mismatched samples to absorb transport skew between the CAN and `pandaStates` sockets, and in any case within ≤ 0.5 s of the first mismatched sample."
