- id: TSR-808
  kind: tsr
  text: "Vehicle service actions that can invalidate an AoU or the calibration (alignment/steering/suspension, EPS or ECM/ABS replacement or reflash, windscreen, camera or radar work, tyre size, brake repair, collision repair, battery disconnection, scan-tool sessions, aftermarket accessories) shall trigger the re-verification defined for that action before the item is engaged again."
