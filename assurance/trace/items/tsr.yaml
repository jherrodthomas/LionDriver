- id: TSR-704
  kind: tsr
  text: "The envelope shall forward every camera-side frame to the car side unchanged, except STEERING_LKA `0x2E4`, STEERING_LTA `0x191`, LKAS_HUD `0x412` and (openpilot longitudinal) ACC_CONTROL `0x343`, and shall forward every car-side frame to the camera side."
  asil: "B"
  parents: [FSR-07.01]
  parent_text: "FSR-07.01"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "DES"
  timing: "continuous"
  verification: "T-SIL, T-HIL"
  baseline_impl: "Implemented: `safety.h:254-290`; `modes/toyota.h:6-36` (static blocking of `check_relay` messages); forwarding before RX validation `drivers/fdcan.h:199-221` (GAP-11)"
  status: proposed
  source: WP-S-02

- id: TSR-705
  kind: tsr
  text: "In the reference configuration the envelope shall not accept from the SoC any frame on the car-side bus that the stock PCS function uses or that only a DSU would send: PRE_COLLISION `0x283`, PRE_COLLISION_2 `0x344`, PCS_HUD `0x411`, and the DSU messages `0x2E6`, `0x2E7`, `0x33E`, `0x365`, `0x366`, `0x4CB` and the bus-1 DSU set; if any is kept for a documented reason, its content shall be restricted to the inactive value."
  asil: "B"
  parents: [FSR-07.02]
  parent_text: "FSR-07.02"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "GATE"
  timing: "per frame"
  verification: "R, T-SIL"
  baseline_impl: "**Met in the reference build** (opendbc `5b5a4ba`): `0x344`, the DSU bus-0 messages and the DSU bus-1 set removed from the Toyota TX whitelist; `0x283` passes with zero payload only (`modes/toyota.h`). `0x411` PCS_HUD refused in the reference build (`LIONDRIVER_REFERENCE`, decision D-1); other builds keep it for radar-ACC alpha longitudinal (IA TX whitelist (assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-tx-whitelist.md))"
  status: proposed
  source: WP-S-02

- id: TSR-706
  kind: tsr
  text: "On SS-S, any MCU fault, MCU reset, loss of device power or harness supply, the relay shall return to the stock camera-to-vehicle connection."
  asil: "B"
  parents: [FSR-07.03]
  parent_text: "FSR-07.03"
  other_parents: false
  allocated_to: "HAR, P-HW, P-SW"
  mechanism: "FR"
  timing: "≤ 0.1 s after fault reaction"
  verification: "A, T-HIL, FI"
  baseline_impl: "Partial: SILENT/NOOUTPUT release the relay (`main.c:44-54`); power-loss behaviour unverified (AOU-13). **Not met for an MCU hang:** without IWDG the relay stays intercepting and forwarding stops, cutting the PCS path (GAP-43; closed by TSR-501 + TSR-502 + TSR-506 readback). HWSR-502, 502a, 506"
  status: proposed
  source: WP-S-02

- id: TSR-707
  kind: tsr
  text: "Forwarded camera-side frames shall be delivered to the car side without loss and with a latency ≤ 1 ms (TBD from the PCS timing analysis) under worst-case bus and SPI load; forwarding queue overflow shall be detected and reported."
