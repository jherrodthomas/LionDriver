- id: TSR-401
  kind: tsr
  text: "For each RX message used for gating or limiting (`0xAA`, `0x260`, `0x1D2`, `0x226`, and `0x262`, `0x1D3`, `0xB4` once added), the envelope shall detect absence longer than 5 nominal periods and shall evaluate this at ≥ 50 Hz, so that worst-case detection is ≤ 0.2 s."
  asil: "C"
  parents: [FSR-01.06]
  parent_text: "FSR-01.06"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "TMO"
  timing: "detect ≤ 0.2 s / react ≤ 0.1 s"
  verification: "T-SIL, T-HIL, FI"
  baseline_impl: "**Met for the four Toyota RX checks, not yet verified on hardware** (opendbc `aff4033`, panda `9f60e17`): lag after 5 nominal periods (`safety_config.rx_timeout_periods`, `modes/toyota.h`), evaluated at 100 Hz in the panda safety task, so detection ≤ 0.162 s. In the reference build `0x262` (25 Hz) and `0x1D3` (33 Hz) are also RX checks (opendbc `98404a4`; nominal rates from openpilot's former CAN parser minimums, to be measured, WP-S-05 OI-7). `0xB4` is not in the RX set: no nominal rate known (IA RX timeout (assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-rx-timeout.md) §8)"
  status: proposed
  source: WP-S-02

- id: TSR-402
  kind: tsr
  text: "The envelope shall verify the Toyota checksum and the message length of every RX message that carries a checksum (`0x260`, `0x1D2`, and `0x262`, `0x1D3`, `0xB4` once added) and treat one failed frame as an RX fault."
  asil: "C"
  parents: [FSR-01.06]
  parent_text: "FSR-01.06"
  other_parents: false
  allocated_to: "P-SW"
  mechanism: "E2E"
  timing: "per frame"
  verification: "T-SIL"
  baseline_impl: "Implemented for `0x260`, `0x1D2`: `safety.h:164-197`; `modes/toyota.h:40-46, 65-77`. Residual weakness: 8-bit additive sum (GAP-01)"
  status: proposed
  source: WP-S-02

- id: TSR-403
  kind: tsr
  text: "The envelope shall detect when an RX message arrives at more than 1.5× its nominal rate over a 100 ms window (indicating duplicated or inserted frames) and treat it as an RX fault."
