  status: proposed
  source: WP-C-04

- id: FSR-02.03
  kind: fsr
  text: "On a detected loss or degradation of lateral control, the item shall give a visual and acoustic take-over request within 1 s of fault detection and before or at the start of torque reduction."
  asil: "C"
