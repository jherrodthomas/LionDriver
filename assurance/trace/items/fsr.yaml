- id: FSR-01.02
  kind: fsr
  text: "The envelope shall limit the rate of change of the commanded LKA torque (rise per frame and over a real-time window) to bounds derived from controllability. A fall toward zero is not limited, as it is the safe direction for SG-01; a bounded ramp of torque withdrawn on a fault is FSR-02.04."
  asil: "C"
  parents: [SG-01]
  allocated_to: "E-03"
  verification: "A, T-SIL"
  baseline_impl: "Implemented without rationale: 15/25 raw per frame, 450 raw per 250 ms (`modes/toyota.h:174-177`, `lateral.h:49-57, 87-95`) (GAP-04)"
  status: proposed
  source: WP-C-04

- id: FSR-01.03
  kind: fsr
  text: "The envelope shall limit the commanded LKA torque to within a bounded difference of the measured EPS motor torque."
  asil: "C"
  parents: [SG-01]
