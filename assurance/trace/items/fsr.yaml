- id: FSR-01.09
  kind: fsr
  text: "The safety MCU shall detect its own execution faults (program-flow hang, clock failure, memory corruption, register corruption) and enter the safe state (no actuation TX, relay released) within the FTTI allocation of §8."
  asil: "C"
  parents: [SG-01, SG-02, SG-03, SG-04, SG-05, SG-06, SG-07]
  allocated_to: "E-03 (HW+SW)"
  verification: "A (FMEDA), FI"
  baseline_impl: "Partial: an independent windowed watchdog (IWDG1, LSI clock) is started when the relay is first driven and fed from the 100 Hz safety task (`panda/board/drivers/hw_watchdog.h`; TSR-501, HWSR-501: implemented, not verified on hardware, DF-01); other execution faults are still report-only, `PERMANENT_FAULTS = 0U` (`panda/board/sys/sys.h:50`) (GAP-07, GAP-08)"
  status: proposed
  source: WP-C-04

- id: FSR-01.10
  kind: fsr
  text: "The safety mode and safety parameter for the reference configuration shall be fixed in the envelope and shall not be changeable by the SoC while a car safety mode is active; debug-only commands shall be unavailable in release builds; and the SoC shall not be able to make the safety MCU run non-release code or drive the relay outside the envelope through its reset and boot lines (GAP-38, refined by TSR-511)."
  asil: "C"
  parents: [SG-01, SG-03, SG-04, SG-05, SG-07]
  allocated_to: "E-03"
  verification: "R, T-HIL"
  baseline_impl: "Not implemented: `0xdc` sets any mode at any time; `0xc5` relay drive not gated (`panda/board/main_comms.h:144-147, 222-225`) (GAP-09, GAP-25)"
  status: proposed
  source: WP-C-04

- id: FSR-01.11
  kind: fsr
  text: "The envelope shall detect a harness relay malfunction (camera control messages seen on the car side) and inhibit all actuation TX."
