  verification: "A, T-VEH"
  baseline_impl: "Implemented by FSR-01.05 design; independence of the cluster indication to be confirmed by test"
  status: proposed
  source: WP-C-04

- id: FSR-05.06
  kind: fsr
  text: "If PCM cruise is active while the item is not engaged (or the reverse) for longer than a bounded time, the item shall warn the driver and request cancel."
  asil: "C"
  parents: [SG-02, SG-05, SG-06]
  allocated_to: "E-01, E-03"
  verification: "T-SIL"
  baseline_impl: "Not met: `cruiseMismatch` raised after 6 s with no reaction (`selfdrive/selfdrived/selfdrived.py:421`, `events.py:458-460`) (GAP-19)"
  status: proposed
  source: WP-C-04

- id: FSR-05.07
  kind: fsr
  text: "Driver brake input shall produce braking regardless of ACC commands. (External measure, AOU-03R)"
  asil: "— (ext.)"
  parents: [SG-05]
  allocated_to: "EXT-PCM"
  verification: "T-VEH"
  baseline_impl: "Unverified"
  status: proposed
  source: WP-C-04

- id: FSR-06.01
  kind: fsr
  text: "The item shall detect loss or staleness of the longitudinal plan, lead information (radar/vision) and model output while engaged."
  asil: "C"
  parents: [SG-06]
  allocated_to: "E-01 (QM), E-03 backstop via FSR-01.07"
  verification: "T-SIL, FI"
  baseline_impl: "Partial: `commIssue`, `radarFault`, `processNotRunning` (`selfdrived.py:352-390`); masking during big-model settling (GAP-17); controlsd no freshness check (GAP-16)"
  status: proposed
  source: WP-C-04

- id: FSR-06.02
  kind: fsr
  text: "On detected loss, the item shall give a take-over request within 1 s and cancel ACC so that control returns to the driver; it shall not hold a stale acceleration command."
  asil: "C"
  parents: [SG-06]
  allocated_to: "E-01, E-03"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Partial: soft disable with force decel (`controlsd.py:203-204`, `selfdrive/controls/lib/longitudinal_planner.py:84-85`); stale inputs used for up to ≈3.5 s (GAP-16)"
  status: proposed
  source: WP-C-04

- id: FSR-06.03
  kind: fsr
  text: "The item shall detect that the PCM does not execute ACC (ACC fault, cruise fault) and warn the driver."
  asil: "C"
  parents: [SG-06]
  allocated_to: "E-01"
  verification: "T-SIL"
  baseline_impl: "Implemented: `accFaulted` IMMEDIATE_DISABLE (`events.py:908`)"
  status: proposed
  source: WP-C-04

- id: FSR-06.04
  kind: fsr
  text: "Non-finite or out-of-range actuator commands shall be treated as faults with a fault reaction, not silently replaced."
  asil: "C"
  parents: [SG-06]
  allocated_to: "E-01, E-03"
  verification: "T-SIL"
  baseline_impl: "Not met: silently clamped to 0 (`controlsd.py:140-147`) (GAP-19)"
  status: proposed
  source: WP-C-04

- id: FSR-06.05
  kind: fsr
  text: "FSR-02.05 (independent acoustic warning on SoC loss) and FSR-02.06…02.09 (DM) also serve SG-06."
  asil: "as ref."
  parents: [SG-06]
  allocated_to: "as ref."
  verification: "as ref."
  baseline_impl: "as ref."
  status: proposed
  source: WP-C-04

- id: FSR-07.01
  kind: fsr
  text: "The item shall forward all camera-side messages to the car side unchanged, except the defined set of intercepted control messages."
  asil: "B"
  parents: [SG-07]
  allocated_to: "E-03"
  verification: "T-SIL, T-HIL"
  baseline_impl: "Implemented: static block list (`safety.h:270-281`)"
  status: proposed
  source: WP-C-04

- id: FSR-07.02
  kind: fsr
  text: "The item shall not originate any message that the stock PCS function uses (e.g. PRE_COLLISION `0x344`, PCS_HUD `0x411`, AEB `0x283` with content) in the reference configuration."
  asil: "B"
  parents: [SG-07]
  allocated_to: "E-03"
  verification: "R, T-SIL"
  baseline_impl: "**Not met:** the openpilot-longitudinal TX whitelist allows the SoC to send `0x344` and `0x411` on bus 0 with no content check; only `0x283` is content-checked (`modes/toyota.h:19-28, 251-257`). The reference configuration host does not send them (`carcontroller.py:294-295` only with `DISABLE_RADAR`), but a QM fault could. (GAP-42)"
  status: proposed
  source: WP-C-04

- id: FSR-07.03
  kind: fsr
  text: "On safety-MCU fault, loss of device power, or harness fault, the relay shall return to the stock camera-to-vehicle connection."
  asil: "B"
  parents: [SG-07]
  allocated_to: "E-05, E-03"
  verification: "A, T-HIL"
  baseline_impl: "Partial: SILENT/NO_OUTPUT release relay (`panda/board/main.c:45-54`); de-energised relay state and power-loss behaviour not confirmed (OI-6)"
  status: proposed
  source: WP-C-04

- id: FSR-07.04
  kind: fsr
  text: "openpilot longitudinal commands shall not prevent PCS braking from taking priority in the PCM. (External measure, AOU-04R)"
  asil: "— (ext.)"
  parents: [SG-07]
  allocated_to: "EXT-PCM"
  verification: "T-VEH"
  baseline_impl: "Unverified"
  status: proposed
  source: WP-C-04

- id: FSR-07.05
  kind: fsr
  text: "The item shall inform the driver when the stock system reports an AEB or FCW event."
  asil: "QM"
  parents: [SG-07]
  allocated_to: "E-01"
  verification: "T-SIL"
  baseline_impl: "Implemented: `stockAeb`, `stockFcw` (`selfdrive/car/car_events.py:120-123`, `events.py:480`)"
  status: proposed
  source: WP-C-04

- id: FSR-07.06
  kind: fsr
  text: "If the harness cannot return to the stock camera-to-vehicle connection (switch or relay stuck in intercept, detected by state readback), the item shall inhibit all actuation, warn the driver that stock PCS/AEB is unavailable, and refuse engagement until the harness is repaired. (Accepted 2026-10-14 as the degraded state, DQ-064; applies once readback exists.)"
  asil: "B"
  parents: [SG-07]
  allocated_to: "E-03 (detection), E-05 (readback), E-01/HMI (warning)"
  verification: "T-HIL, FI"
  baseline_impl: "Not implemented: the harness box has no state feedback (RR-2026-010: two analog switches with a pull-down default); readback depends on the harness choice (DQ-209, queued). New in v0.6"
  status: proposed
  source: WP-C-04

- id: FSR-07.07
  kind: fsr
  text: "While the stock system reports an AEB event, the item shall request zero acceleration from the PCM (no added drive), so that stock AEB braking does not depend on PCM arbitration alone. FSR-07.04 and its AOU-04R test still apply. (Decided 2026-10-18, DQ-300 A; System FMEA SFM-036, SFM-ACT-020; FTA MCS-07.10.)"
  asil: "QM (no ASIL claim; FSR-07.04 stays the measure)"
  parents: [SG-07]
  allocated_to: "E-01"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Not implemented: on `stockAeb` the item only alerts and keeps its longitudinal request. New in v0.12"
  status: proposed
  source: WP-C-04

- id: FSR-08.01
  kind: fsr
  text: "While engaged, the item shall give the first driver alert within 6 s of the loss of attention, measured end to end from the driver's change of state to the alert (including camera frame time, DM model latency and policy timers), and shall reach the no-response reaction of FSR-02.09 within the time set in WP-S-04 (assurance/03-system/WP-S-04-timing-ftti-budget.md)."
  asil: "A"
  parents: [SG-08]
  allocated_to: "E-01/DM, E-01/HMI"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Partial: first vision alert at 5 s of distraction, wheel-touch at 5 s (`selfdrive/monitoring/policy.py:31-36`); latency not counted, end-to-end time not measured (WP-C-08 OI-2). New in v0.8"
  status: proposed
  source: WP-C-04
