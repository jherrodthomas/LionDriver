- id: FSR-02.09
  kind: fsr
  text: "If the driver does not respond to the highest DM warning, the item shall decelerate the vehicle in a controlled way in its lane to a standstill, keep it stopped and held, and prevent the item from driving off again or being re-engaged until the driver responds; after the driver responds, the lockout period applies. This is the SG-08 safe state (WP-C-03 v0.4), decided 2026-10-16, DQ-365 A: steering stays on while the vehicle decelerates in lane to a standstill within the envelope limits with the alert sounding; the vehicle then stays stopped and held, and the item cannot drive off again: re-engagement and resumption are locked out until the driver responds. Lateral and longitudinal control shall not stay active at the set speed."
  asil: "A"
  parents: [SG-02, SG-04, SG-06, SG-08]
  allocated_to: "E-01/DM"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Partial: no-response force decel after 5 s at the terminal alert (`policy.py:44-49, 437`; `selfdrive/controls/controlsd.py:235`), but no disengagement, so the lockout of 1/5/15/30 min acts only after a later disengagement (System FMEA SFM-025.C1; corrected 2026-10-16). Refined by TSR-633; reaction decided (DQ-365, A); standstill hold and the lockout while stopped not implemented"
  status: proposed
  source: WP-C-04

- id: FSR-02.10
  kind: fsr
  text: "The item shall detect that the envelope does not grant actuation authority while the SoC is engaged (envelope blocking, stuck authority, safety-mode mismatch) and give a take-over request within the SG-02/SG-06 warning budget (§8)."
  asil: "C"
  parents: [SG-02, SG-06]
  allocated_to: "E-01 (detection, alert), E-03 (reports authority state)"
  verification: "T-SIL, FI"
  baseline_impl: "Partial: `controlsMismatch` raised after 200 frames ≈ 2 s (`selfdrive/selfdrived/selfdrived.py:338, 508-510`), longer than the ≤ 1 s budget. New in v0.2 (HE-02.4)"
  status: proposed
  source: WP-C-04

- id: FSR-02.11
  kind: fsr
  text: "The item shall detect failure of the HMI path that shows the engagement state and gives take-over requests (display, sound) and treat it as a fault leading to disengagement with the SoC-independent indications (FSR-02.05 buzzer, FSR-05.05 cluster cruise state)."
  asil: "C"
  parents: [SG-02, SG-06]
  allocated_to: "E-01/HMI, E-03"
  verification: "T-SIL, FI"
  baseline_impl: "Partial: a crashed `ui`/`soundd` raises `processNotRunning` (`selfdrive/selfdrived/selfdrived.py:351-357`); a hung but running UI, a frozen indication or muted audio is not detected. New in v0.2 (H-07, HE-07.x)"
  status: proposed
  source: WP-C-04

- id: FSR-02.12
  kind: fsr
  text: "Before granting engagement, and while the item can engage, the item shall read the stored diagnostic trouble codes of the EPS and of the brake and stability control, and shall not allow engagement while a code that affects lateral or longitudinal control is set; the driver shall be told why. (Decided 2026-10-14, DQ-056: replaces reliance on the driver's dashboard lamp check, WP-O-02 OPS-01.)"
  asil: "QM (supports FSR-02.01, FSR-06.03)"
  parents: [SG-02, SG-06]
  allocated_to: "E-01"
  verification: "T-SIL, T-VEH"
  baseline_impl: "Not implemented: no diagnostic read for engagement; the lamp check is a driver procedure (WP-O-02). New in v0.6"
  status: proposed
  source: WP-C-04

