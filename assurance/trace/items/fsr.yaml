  allocated_to: "E-01, E-03"
  verification: "A, T-SIL"
  baseline_impl: "Partial: rate-down limit 25 raw/frame enforced (`modes/toyota.h:175`); no defined fault ramp"
  status: proposed
  source: WP-C-04

- id: FSR-02.05
  kind: fsr
  text: "When granted actuation authority ends for a reason other than a driver action that the safety MCU itself observes, the safety MCU shall give an acoustic warning that does not depend on the SoC. This covers the loss of communication with the SoC or of its commands, a fault the safety MCU detects, a disengagement reported by the SoC whose cruise cancel had no effect, and a reset of the safety MCU (watchdog or fault reset) that interrupts granted authority. The reset case was added 2026-10-14 (DQ-054: the engaged state is kept across the reset; TSR-516(d)); the trigger was widened 2026-10-21 to match TSR-516(b)/(c) (DQ-404 A; cancel-lag guard, lead 2026-10-21)."
  asil: "C"
  parents: [SG-02]
  allocated_to: "E-03 (panda buzzer)"
  verification: "T-HIL"
  baseline_impl: "Partial: siren 3 s after heartbeat loss (`panda/board/main.c:193-205`); depends on 5 s detection (GAP-06). 2026-10-13: siren also at the 0.3 s heartbeat revocation (TSR-407) when authority was granted, ≈ 0.56 s after the last heartbeat, all builds (panda `c33343b`, TSR-516; WP-S-04 T-07a); not verified on hardware. Since opendbc `273f44e` a full SoC stall is revoked first by the command-arrival check (TSR-408, WP-S-04 T-34), which sounded no siren until panda `8a69ccf` / opendbc `4d1a056`: since then that revocation sounds the same 3 s siren, ≤ 0.31 s after the last `0x2E4` (TSR-516(b), DQ-404 A; host-tested, not verified on hardware). Since panda `f4803c5` (#382) a heartbeat reporting \"not engaged\" while PCM cruise stays active also sounds it, 0.5 s after the first such heartbeat (TSR-516(c), cancel-lag guard, lead 2026-10-21); plant: 0.63–0.88 s after selfdrived stops; not verified on hardware"
  status: proposed
  source: WP-C-04

- id: FSR-02.06
  kind: fsr
  text: "Driver monitoring shall detect an inattentive or unresponsive driver while engaged and escalate warnings within the timing set in WP-C-08 (assurance/02-concept/WP-C-08-driver-hmi-misuse-analysis.md) §5."
