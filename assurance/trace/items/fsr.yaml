- id: FSR-01.06
  kind: fsr
  text: "The envelope shall detect loss, corruption, repetition and staleness of each RX signal it uses for gating or limiting (PCM cruise state, brake, gas, driver/EPS torque, wheel speed) and revoke actuation authority within the FTTI allocation of §8."
