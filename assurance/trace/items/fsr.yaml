  baseline_impl: "Partial: violating frames dropped and `controls_allowed` cleared on RX faults (`lateral.h:141-148`, `safety.h:112-121`); a TX violation alone does not revoke authority. 2026-10-14: a rejected command also ends authority until re-engagement (DQ-060, TSR-108); firmware change open"
  status: proposed
  source: WP-C-04

- id: FSR-01.13
  kind: fsr
  text: "The EPS shall limit LKA torque to an overpowerable level and shall end LKA torque within a bounded time after `0x2E4` stops or carries the request bit cleared. (External measure, AOU-01R)"
