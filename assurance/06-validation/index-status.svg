<title id="t">06-validation: work products by gate and status</title>
<desc id="d">Work products of 06-validation from WP-M-00 §3, by the gates they are needed for: WP-V-01 Safety validation plan, specification and report: G5, Draft; WP-V-02 SOTIF verification and validation strategy, validation targets: G2, Draft; WP-V-03 Evaluation of known hazardous scenarios: G4, Draft; WP-V-04 Evaluation of unknown hazardous scenarios: G5, Draft; WP-V-05 Fault injection test specification and report: G4, Draft; WP-V-06 Cybersecurity validation and penetration testing: G5, Draft; WP-V-07 Vehicle test operations and safety-driver procedures: G1, Draft.</desc>
