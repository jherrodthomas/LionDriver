<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="632" viewBox="0 0 1280 632" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 8-1 · Inherited actuation envelope</title>
<desc>Small multiples of the inherited actuation envelope from WP-C-01 §8: steering torque request at most 1500 raw (physical value to be determined, GAP-04); torque rate +15 / −25 raw per 10 ms frame and at most 450 raw per 250 ms; lateral acceleration at most 3.0 m/s² and jerk at most 5 m/s³; acceleration command −3.5 to +2.0 m/s²; engagement from standstill (OI-7) and a warning at about 149 km/h without disengagement. All inherited, none verified.</desc>
