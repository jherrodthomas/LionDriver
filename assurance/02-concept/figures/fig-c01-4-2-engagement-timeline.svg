<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="844" viewBox="0 0 1280 844" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 4-2 · One engagement, three layers in time</title>
<desc>Timing diagram of an illustrative engagement episode with rows for the selfdrived state, panda controls_allowed, panda safety mode, lateral and longitudinal commands, HMI alerts and the DM lockout. Events: cruise set (D3, T1), gas pressed (E2, longitudinal blocked by the panda), released (O2), fault (E1, soft disabling for 3 s with controls_allowed still 1, GAP-16), timer runs out (SD2; the panda clears at T2 after the host cancel, or at latest T6), re-engagement (D3, T1), DM lockout reached, driver brakes (X2, T3), lockout 1 to 30 min during which N1 refuses engagement. Times are made up except the 3 s and the lockout duration.</desc>
