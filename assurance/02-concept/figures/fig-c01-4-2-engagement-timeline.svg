<text x="40" y="758" font-size="11" fill="#475569">Illustrative: the times between events are made up. Code values: the 3 s soft-disable (state.py:7; sm-selfdrived E1 "soft-disable timer = 3 s (300 cycles)") and the 1–30 min lockout (policy.py:42-44).</text>
<text x="40" y="776" font-size="11" fill="#475569">Red band (GAP-16): for up to 3 s the host keeps commanding and the panda keeps allowing it; the envelope has no soft-disable of its own.</text>
<text x="40" y="794" font-size="11" fill="#475569">After SD2 no record transition clears controls_allowed directly: the host requests a PCM cancel (controlsd.py, not in a record), the PCM drops cruise</text>
<text x="40" y="812" font-size="11" fill="#475569">(AOU-05, unverified) and T2 clears; otherwise T6 clears after 3 heartbeat ticks (1 Hz) with engaged = 0. The hatched window marks that interval.</text>
</svg>
