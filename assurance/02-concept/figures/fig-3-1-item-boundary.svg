  <!-- ===== legend ===== -->
  <line x1="40" y1="862" x2="1240" y2="862" stroke="#E2E8F0"/>
  <g transform="translate(40,886)" font-size="10.5">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#C2410C" stroke-width="2.6"/><text x="36" y="4" class="t">Actuation / safety-envelope path</text>
    <line x1="228" y1="0" x2="256" y2="0" stroke="#0F766E" stroke-width="2"/><text x="264" y="4" class="t">Sensing, HMI, forwarded CAN</text>
    <line x1="436" y1="0" x2="464" y2="0" stroke="#475569" stroke-width="1.4"/><text x="472" y="4" class="t">Internal data flow</text>
    <line x1="584" y1="0" x2="612" y2="0" stroke="#A16207" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/><text x="620" y="4" class="t">Power</text>
    <line x1="672" y1="0" x2="700" y2="0" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4"/><text x="708" y="4" class="t">Untrusted network</text>
    <rect x="828" y="-8" width="28" height="16" rx="4" fill="#FFFBEB" stroke="#B45309" stroke-dasharray="5 3"/><text x="864" y="4" class="t">Item boundary</text>
    <rect x="958" y="-8" width="28" height="16" rx="4" fill="#F1F5F9" stroke="#94A3B8"/><text x="994" y="4" class="t">Outside the item</text>
    <text x="1200" y="4" class="m" text-anchor="end">B‡: ASIL B target</text>
