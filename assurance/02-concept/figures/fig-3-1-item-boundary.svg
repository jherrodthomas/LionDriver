    <rect x="1000" y="566" width="46" height="18" rx="9" fill="#0F766E"/><text x="1023" y="579" fill="#fff" text-anchor="middle">IF-03</text>
    <rect x="850" y="672" width="96" height="18" rx="9" fill="#C2410C"/><text x="898" y="685" fill="#fff" text-anchor="middle">IF-01 · IF-02</text>
    <rect x="1008" y="691" width="46" height="18" rx="9" fill="#0F766E"/><text x="1031" y="704" fill="#fff" text-anchor="middle">IF-02</text>
    <rect x="330" y="681" width="46" height="18" rx="9" fill="#A16207"/><text x="353" y="694" fill="#fff" text-anchor="middle">IF-08</text>
  </g>
  <text x="766" y="452" fill="#C2410C" font-size="9.5" font-weight="600" text-anchor="middle">SPI</text>
  <text x="903" y="150" fill="#7C3AED" font-size="9.5" font-weight="600" text-anchor="middle">Wi-Fi / LTE</text>
  <text x="898" y="706" fill="#C2410C" font-size="9.5" font-weight="600" text-anchor="middle">TX actuation · RX status</text>
  <text x="384" y="706" fill="#A16207" font-size="9.5" font-weight="600">12 V, ignition</text>
