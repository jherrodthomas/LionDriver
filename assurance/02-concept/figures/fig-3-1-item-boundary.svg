<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 3-1. LD-SDA item boundary and interfaces (WP-C-01 §3.3)</title>
  <desc id="d">The item LD-SDA contains the comma device hardware (E-04) with the SoC software and ML models (E-01, E-02), the panda safety MCU firmware (E-03), and the harness with intercept relay (E-05). Interfaces IF-01 to IF-09 connect it to the driver, the road environment, the vehicle CAN with EPS, ECM/PCM, ABS/VSC and cluster, the forward radar, the Toyota forward camera, vehicle power and the untrusted comma.ai back end. E-06 external compute is excluded.</desc>
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker>
    <marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A16207"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="2"/></pattern>
    <style>
      .t{fill:#0F172A}.m{fill:#475569}.s{font-size:11px}.xs{font-size:10px}.b{font-weight:700}.sb{font-weight:600}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.2}
      .ext{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.2}
      .chip{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1}
      .ml{fill:#EEF2FF;stroke:#A5B4FC;stroke-width:1}
      .tag{font-size:10px;font-weight:700;letter-spacing:.04em}
    </style>
  </defs>

  <rect width="1280" height="910" fill="#FFFFFF"/>

  <!-- header -->
  <text x="40" y="44" class="t b" font-size="20">Figure 3-1 · Item boundary of LD-SDA</text>
  <text x="40" y="66" class="m" font-size="12.5">Reference configuration: Toyota Corolla, 12th generation (E210), TSS 2.0 · comma device with panda safety MCU</text>
  <text x="1240" y="44" class="m s" text-anchor="end">WP-C-01 §3.3</text>
  <text x="1240" y="62" class="m s" text-anchor="end">elements §3.1–3.2 · interfaces §3.4</text>
  <line x1="40" y1="82" x2="1240" y2="82" stroke="#E2E8F0"/>

  <!-- ===== outside: road environment (top left) ===== -->
  <rect x="40" y="100" width="190" height="56" rx="8" class="ext"/>
  <text x="135" y="122" class="t sb" font-size="13" text-anchor="middle">Road environment</text>
  <text x="135" y="138" class="m xs" text-anchor="middle">road users, lanes, light, weather</text>
  <text x="135" y="150" class="m xs" text-anchor="middle">ODD (WP-C-02)</text>

  <!-- ===== outside: comma back end (top right, untrusted) ===== -->
  <rect x="1050" y="100" width="190" height="72" rx="8" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="1145" y="122" class="t sb" font-size="13" text-anchor="middle">comma.ai back end</text>
  <text x="1145" y="138" class="m xs" text-anchor="middle">athena, connect, update origin</text>
  <text x="1145" y="157" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">UNTRUSTED · AOU-11</text>

  <!-- ===== outside: driver ===== -->
  <rect x="40" y="250" width="150" height="250" rx="10" class="ext"/>
  <g transform="translate(115,284)" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round">
    <circle cx="0" cy="0" r="11"/><path d="M0 11V44M-18 22H18M0 44L-14 66M0 44L14 66"/>
  </g>
  <text x="115" y="376" class="t b" font-size="14" text-anchor="middle">Driver</text>
  <text x="115" y="393" class="m xs" text-anchor="middle">supervises, overrides,</text>
  <text x="115" y="406" class="m xs" text-anchor="middle">responds to warnings</text>
  <text x="115" y="423" class="m xs" text-anchor="middle">AOU-06, AOU-07</text>
  <text x="115" y="474" class="m xs" text-anchor="middle">wheel · pedals · stalk</text>
  <text x="115" y="487" class="m xs" text-anchor="middle">act on the vehicle</text>

  <!-- ===== ITEM BOUNDARY ===== -->
  <rect x="240" y="190" width="770" height="470" rx="16" fill="#FFFBEB" fill-opacity=".5" stroke="#B45309" stroke-width="2" stroke-dasharray="10 5"/>
  <rect x="262" y="178" width="236" height="24" rx="12" fill="#B45309"/>
  <text x="380" y="194" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing=".08em">ITEM BOUNDARY · LD-SDA</text>

  <!-- E-04 device -->
  <rect x="262" y="222" width="726" height="268" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="280" y="245" class="t b" font-size="13">E-04 comma device</text>
  <text x="420" y="245" class="m s">hardware: SoC, panda MCU, cameras, display, speaker</text>

  <!-- peripherals -->
  <rect x="280" y="262" width="150" height="50" rx="8" class="box"/>
  <text x="355" y="283" class="t sb" font-size="12" text-anchor="middle">Road cameras</text>
  <text x="355" y="299" class="m xs" text-anchor="middle">wide + narrow · IMU · GNSS</text>
  <rect x="280" y="330" width="150" height="50" rx="8" class="box"/>
  <text x="355" y="351" class="t sb" font-size="12" text-anchor="middle">Driver camera (IR)</text>
  <text x="355" y="367" class="m xs" text-anchor="middle">driver monitoring input</text>
  <rect x="280" y="410" width="150" height="62" rx="8" class="box"/>
  <text x="355" y="434" class="t sb" font-size="12" text-anchor="middle">Display · speaker</text>
  <text x="355" y="450" class="m xs" text-anchor="middle">ui, soundd · alerts</text>

  <!-- E-01 / E-02 -->
  <rect x="456" y="262" width="300" height="210" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="472" y="283" class="t b" font-size="13">E-01 SoC software</text>
  <text x="740" y="283" class="m s" text-anchor="end">openpilot · QM + SOTIF</text>
  <rect x="472" y="296" width="130" height="52" rx="6" class="ml"/>
  <text x="537" y="317" class="t sb" font-size="11.5" text-anchor="middle">E-02 driving model</text>
  <text x="537" y="333" class="m xs" text-anchor="middle">modeld</text>
  <rect x="612" y="296" width="130" height="52" rx="6" class="chip"/>
  <text x="677" y="317" class="t sb" font-size="11.5" text-anchor="middle">athena · updated</text>
  <text x="677" y="333" class="m xs" text-anchor="middle">network, OTA</text>
  <rect x="472" y="358" width="270" height="44" rx="6" class="chip"/>
  <text x="607" y="377" class="t sb" font-size="11.5" text-anchor="middle">plannerd · controlsd · selfdrived · card</text>
  <text x="607" y="392" class="m xs" text-anchor="middle">planning, control, engagement state</text>
  <rect x="472" y="412" width="130" height="48" rx="6" class="ml"/>
  <text x="537" y="432" class="t sb" font-size="11.5" text-anchor="middle">E-02 DM model</text>
  <text x="537" y="448" class="m xs" text-anchor="middle">dmonitoringmodeld</text>
  <rect x="612" y="412" width="130" height="48" rx="6" class="chip"/>
  <text x="677" y="432" class="t sb" font-size="11.5" text-anchor="middle">pandad</text>
  <text x="677" y="448" class="m xs" text-anchor="middle">CAN streams, heartbeat</text>

  <!-- E-03 panda -->
  <rect x="790" y="262" width="182" height="210" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.8"/>
  <text x="806" y="283" class="t b" font-size="12.5">E-03 panda safety MCU</text>
  <text x="806" y="299" class="m s">STM32H7 · opendbc safety</text>
  <rect x="806" y="309" width="150" height="22" rx="11" fill="#C2410C"/>
  <text x="881" y="324" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing=".05em">SAFETY ENVELOPE · B‡</text>
  <text x="806" y="350" class="t xs">• TX whitelist, limits, rate</text>
  <text x="806" y="365" class="t xs">• RX timeouts, EPS fault</text>
  <text x="806" y="380" class="t xs">• heartbeat · mode lock</text>
  <text x="806" y="395" class="t xs">• IWDG · siren</text>
  <text x="806" y="420" class="m xs">bus 0 car · bus 1 radar</text>
  <text x="806" y="433" class="m xs">bus 2 camera</text>
  <text x="806" y="456" class="m xs">TSR-401 … TSR-519</text>

  <!-- E-05 harness -->
  <rect x="560" y="520" width="428" height="118" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="578" y="543" class="t b" font-size="13">E-05 harness</text>
  <text x="578" y="560" class="m s">Toyota TSS2 harness with</text>
  <text x="578" y="574" class="m s">intercept relay, camera ↔</text>
  <text x="578" y="588" class="m s">vehicle CAN</text>
  <!-- relay -->
  <line x1="840" y1="596" x2="950" y2="596" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="840" y1="596" x2="880" y2="574" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="840" cy="596" r="4.5" fill="#0F172A"/><circle cx="950" cy="596" r="4.5" fill="#0F172A"/>
  <rect x="873" y="603" width="44" height="14" rx="3" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="895" y="613.5" class="m" font-size="8.5" text-anchor="middle">relay</text>
  <text x="832" y="590" class="m xs" text-anchor="end">car side</text>
  <text x="958" y="590" class="m xs">cam</text>
  <text x="578" y="614" class="m xs">relay de-energised =</text>
  <text x="578" y="627" class="m xs">stock camera ↔ vehicle path (AOU-13)</text>

  <!-- ===== outside: E-06 excluded ===== -->
  <rect x="1050" y="300" width="190" height="78" rx="8" fill="url(#hatch)" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <rect x="1060" y="310" width="170" height="58" rx="6" fill="#FFFFFF" fill-opacity=".92"/>
  <text x="1145" y="330" class="t sb" font-size="12" text-anchor="middle">E-06 external compute</text>
  <text x="1145" y="345" class="m xs" text-anchor="middle">"Chestnut" eGPU over USB</text>
  <text x="1145" y="360" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">EXCLUDED · pending OI-4</text>

  <!-- ===== outside: forward camera ===== -->
  <rect x="1050" y="556" width="190" height="80" rx="8" class="ext"/>
  <text x="1145" y="580" class="t sb" font-size="13" text-anchor="middle">Toyota forward camera</text>
  <text x="1145" y="597" class="m xs" text-anchor="middle">LKA / ACC outputs intercepted</text>
  <text x="1145" y="611" class="m xs" text-anchor="middle">PCS outputs forwarded</text>
  <text x="1145" y="625" class="m xs" text-anchor="middle">AOU-04</text>

  <!-- ===== outside: vehicle CAN and ECUs ===== -->
  <line x1="240" y1="730" x2="860" y2="730" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <text x="240" y="716" class="t b" font-size="12">Vehicle CAN · car side</text>
  <line x1="300" y1="730" x2="300" y2="760" stroke="#0F172A" stroke-width="2"/>
  <rect x="240" y="760" width="120" height="58" rx="8" class="ext"/>
  <text x="300" y="784" class="t sb" font-size="13" text-anchor="middle">EPS</text>
  <text x="300" y="800" class="m xs" text-anchor="middle">AOU-01, AOU-02</text>
  <line x1="450" y1="730" x2="450" y2="760" stroke="#0F172A" stroke-width="2"/>
  <rect x="380" y="760" width="140" height="58" rx="8" class="ext"/>
  <text x="450" y="784" class="t sb" font-size="13" text-anchor="middle">ECM / PCM</text>
  <text x="450" y="800" class="m xs" text-anchor="middle">ACC envelope · AOU-05</text>
  <line x1="610" y1="730" x2="610" y2="760" stroke="#0F172A" stroke-width="2"/>
  <rect x="540" y="760" width="140" height="58" rx="8" class="ext"/>
  <text x="610" y="784" class="t sb" font-size="13" text-anchor="middle">ABS / VSC</text>
  <text x="610" y="800" class="m xs" text-anchor="middle">AOU-03, AOU-10</text>
  <line x1="770" y1="730" x2="770" y2="760" stroke="#0F172A" stroke-width="2"/>
  <rect x="700" y="760" width="140" height="58" rx="8" class="ext"/>
  <text x="770" y="784" class="t sb" font-size="13" text-anchor="middle">Cluster · stalk</text>
  <text x="770" y="800" class="m xs" text-anchor="middle">cruise, HUD · AOU-12</text>
  <rect x="880" y="760" width="130" height="58" rx="8" class="ext"/>
  <text x="945" y="784" class="t sb" font-size="13" text-anchor="middle">Forward radar</text>
  <text x="945" y="800" class="m xs" text-anchor="middle">radar CAN · bus 1</text>
  <text x="625" y="842" class="m xs" text-anchor="middle">Existing vehicle elements, outside the item (§3.2)</text>

  <!-- ===== connections ===== -->
  <!-- IF-05 road environment -> road cameras -->
  <path d="M215 156 V287 H280" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
  <!-- IF-06 driver face -> driver camera -->
  <path d="M190 355 H280" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
  <!-- IF-07 display <-> driver -->
  <path d="M280 441 H190" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)" marker-start="url(#aT)"/>
  <!-- internal: road cameras -> driving model -->
  <path d="M430 287 H448 V322 H472" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <!-- internal: driver camera -> DM model -->
  <path d="M430 355 H444 V436 H472" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <!-- internal: SoC -> display -->
  <path d="M520 472 V481 H438 V458 H430" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <!-- IF-04 SPI pandad <-> panda -->
  <path d="M742 436 H790" fill="none" stroke="#C2410C" stroke-width="2.4" marker-end="url(#aR)" marker-start="url(#aR)"/>
  <!-- IF-09 network: athena <-> back end -->
  <path d="M746 322 H772 V140 H1048" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#aP)" marker-end="url(#aP)"/>
  <!-- panda bus 0 -> relay car side -->
  <path d="M840 472 V592" fill="none" stroke="#C2410C" stroke-width="2.4"/>
  <!-- panda bus 2 -> relay camera side -->
  <path d="M950 472 V592" fill="none" stroke="#0F766E" stroke-width="2.4"/>
  <!-- IF-03 relay camera side <-> forward camera -->
  <path d="M954 596 H1050" fill="none" stroke="#0F766E" stroke-width="2.4" marker-end="url(#aT)" marker-start="url(#aT)"/>
  <!-- IF-01 / IF-02 relay car side <-> vehicle CAN -->
  <path d="M840 601 V728" fill="none" stroke="#C2410C" stroke-width="3" marker-end="url(#aR)"/>
  <!-- IF-02 radar bus 1 -> panda -->
  <path d="M945 760 V745 H1000 V440 H972" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
  <!-- IF-08 power: vehicle 12 V via harness -> device -->
  <path d="M600 638 V690 H255 V478 H262" fill="none" stroke="#A16207" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#aY)"/>
  <!-- driver acts on vehicle (outside the item) -->
  <path d="M115 500 V789 H238" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#aS)"/>

  <!-- ===== interface tags ===== -->
  <g class="tag">
    <rect x="192" y="196" width="46" height="18" rx="9" fill="#0F766E"/><text x="215" y="209" fill="#fff" text-anchor="middle">IF-05</text>
    <rect x="198" y="327" width="46" height="18" rx="9" fill="#0F766E"/><text x="221" y="340" fill="#fff" text-anchor="middle">IF-06</text>
    <rect x="198" y="413" width="46" height="18" rx="9" fill="#0F766E"/><text x="221" y="426" fill="#fff" text-anchor="middle">IF-07</text>
    <rect x="743" y="406" width="46" height="18" rx="9" fill="#C2410C"/><text x="766" y="419" fill="#fff" text-anchor="middle">IF-04</text>
