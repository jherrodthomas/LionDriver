<text x="411.73" y="596" font-size="11" fill="#475569">Red reaction: nothing happens. Violet: a functional modification of WP-C-07 that would close it.</text>
<text x="40" y="616" font-size="11" fill="#475569">Required at an exit the item detects (§5.3): a take-over request, never staying engaged indefinitely, and no engagement where it can tell it is outside. First such check: the highway speed floor (DQ-280).</text>
