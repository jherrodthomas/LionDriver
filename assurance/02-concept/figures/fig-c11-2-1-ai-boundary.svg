<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 2-1. AI system boundary (WP-C-11 §2.2)</title>
  <desc id="d">camerad supplies VisionIPC NV12 frames: narrow and wide road frames to the AI-1/AI-2 chain and cabin frames to the AI-3 chain. Inside the AI system boundary, the AI-1/AI-2 chain runs a calibrated perspective warp kernel, the recurrent AI-1/AI-2 network, a parser (mdn, sigmoid, softmax) and action extraction with smoothing, FCW, confidence and the desire helper, publishing modelV2, drivingModelData and cameraOdometry. The AI-3 chain runs the dm warp kernel, the AI-3 network and parse_model_output, publishing driverStateV2. Warp kernels and networks are compiled by tinygrad or shipped pre-compiled. Calibration, desire, traffic convention and action time enter from outside. controlsd, plannerd, radard, locationd, selfdrived and dmonitoringd/policy.py consume the outputs outside the boundary, and ultimately the panda safety envelope. Runtime monitors are QM software around the AI system.</desc>
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .t{fill:#0F172A}.m{fill:#475569}.s{font-size:11px}.xs{font-size:10px}.b{font-weight:700}.sb{font-weight:600}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.2}
      .ext{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.2}
      .chip{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1}
      .ml{fill:#EEF2FF;stroke:#A5B4FC;stroke-width:1.2}
      .code{fill:#64748B;font-size:9.5px;font-family:'JetBrains Mono',Menlo,Consolas,monospace}
      .tag{font-size:10px;font-weight:700;letter-spacing:.04em}
    </style>
  </defs>

  <rect width="1280" height="870" fill="#FFFFFF"/>

  <!-- header -->
  <text x="40" y="44" class="t b" font-size="20">Figure 2-1 · AI system boundary</text>
  <text x="40" y="66" class="m" font-size="12.5">From the camera frame buffers to the published model messages, including the pre- and post-processing LionDriver can inspect</text>
  <text x="1240" y="44" class="m s" text-anchor="end">WP-C-11 §2.2</text>
  <text x="1240" y="62" class="m s" text-anchor="end">inputs §2.3 · outputs §2.4</text>
  <line x1="40" y1="82" x2="1240" y2="82" stroke="#E2E8F0"/>

  <!-- camerad -->
  <rect x="280" y="102" width="680" height="46" rx="8" class="ext"/>
  <text x="620" y="122" class="t sb" font-size="13" text-anchor="middle">camerad</text>
  <text x="620" y="138" class="m xs" text-anchor="middle">VisionIPC NV12 frames</text>

  <!-- ===== AI system boundary ===== -->
  <rect x="254" y="186" width="736" height="480" rx="16" fill="#FFFBEB" fill-opacity=".5" stroke="#B45309" stroke-width="2" stroke-dasharray="10 5"/>
  <rect x="272" y="174" width="168" height="24" rx="12" fill="#B45309"/>
  <text x="356" y="190" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing=".08em">AI SYSTEM</text>

  <!-- column heads -->
  <text x="290" y="212" class="m xs b" letter-spacing=".06em">AI-1 / AI-2 · DRIVING</text>
  <text x="710" y="212" class="m xs b" letter-spacing=".06em">AI-3 · DM MODEL</text>

  <!-- camera branches -->
  <path d="M460 148 V218" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
  <text x="468" y="170" fill="#0F766E" font-size="9.5" font-weight="600">narrow road + wide road</text>
  <path d="M830 148 V218" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
  <text x="838" y="170" fill="#0F766E" font-size="9.5" font-weight="600">cabin</text>

  <!-- row 1: warp -->
  <rect x="280" y="220" width="360" height="56" rx="8" class="box"/>
  <text x="296" y="240" class="t sb" font-size="12">Warp kernel</text>
  <text x="380" y="240" class="m xs">calibrated perspective warp → 512×256</text>
  <text x="296" y="262" class="code">compiled by tinygrad (compile_warp.py)</text>
  <rect x="700" y="220" width="260" height="56" rx="8" class="box"/>
  <text x="716" y="240" class="t sb" font-size="12">dm warp kernel</text>
  <text x="815" y="240" class="m xs">luma warp → 1440×960</text>
  <text x="716" y="262" class="code">compiled by tinygrad (compile_warp.py)</text>

  <!-- row 2: network -->
  <rect x="280" y="304" width="360" height="76" rx="8" class="ml"/>
  <text x="296" y="323" class="t b" font-size="12.5">AI-1 / AI-2 network</text>
  <text x="430" y="323" class="m xs">recurrent state</text>
  <text x="296" y="338" class="m xs">AI-1 supercombo · AI-2 Chestnut: not in the reference</text>
  <text x="296" y="351" class="m xs">configuration (E-06 excluded)</text>
  <text x="296" y="369" class="code">compiled by tinygrad (compile_onnx.py) or pre-compiled</text>
  <rect x="700" y="304" width="260" height="76" rx="8" class="ml"/>
  <text x="716" y="325" class="t b" font-size="12.5">AI-3 network</text>
  <text x="716" y="342" class="m xs">driver monitoring model</text>
  <text x="716" y="366" class="code">compiled by tinygrad (compile_onnx.py)</text>
  <!-- recurrent state loop -->
  <path d="M640 362 H664 V320 H642" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <text x="668" y="345" class="m" font-size="9">next_*</text>

  <!-- row 3: parser -->
  <rect x="280" y="408" width="360" height="56" rx="8" class="box"/>
  <text x="296" y="428" class="t sb" font-size="12">Parser</text>
  <text x="344" y="428" class="m xs">mdn · sigmoid · softmax</text>
  <text x="296" y="450" class="code">parse_model_outputs.py</text>
  <rect x="700" y="408" width="260" height="56" rx="8" class="box"/>
  <text x="716" y="426" class="t sb" font-size="12">parse_model_output</text>
  <text x="716" y="440" class="m xs">safe_exp on std, sigmoid on probs</text>
  <text x="716" y="455" class="code">dmonitoringmodeld.py:73-82</text>

  <!-- row 4: post-processing -->
  <rect x="280" y="492" width="360" height="62" rx="8" class="box"/>
  <text x="296" y="512" class="t sb" font-size="12">Action extraction + smoothing</text>
  <text x="296" y="527" class="m xs">FCW · confidence · desire helper</text>
  <text x="296" y="544" class="code">modeld.py:52-77, fill_model_msg.py</text>

  <!-- outputs -->
  <rect x="280" y="584" width="360" height="62" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="296" y="602" class="m xs b" letter-spacing=".06em">PUBLISHED</text>
  <rect x="294" y="612" width="96" height="24" rx="5" class="chip"/>
  <text x="342" y="628" class="t sb" font-size="11" text-anchor="middle">modelV2</text>
  <rect x="400" y="612" width="120" height="24" rx="5" class="chip"/>
  <text x="460" y="628" class="t sb" font-size="11" text-anchor="middle">drivingModelData</text>
  <rect x="528" y="612" width="106" height="24" rx="5" class="chip"/>
  <text x="581" y="628" class="t sb" font-size="11" text-anchor="middle">cameraOdometry</text>
  <rect x="700" y="584" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="716" y="602" class="m xs b" letter-spacing=".06em">PUBLISHED</text>
  <rect x="716" y="612" width="104" height="24" rx="5" class="chip"/>
  <text x="768" y="628" class="t sb" font-size="11" text-anchor="middle">driverStateV2</text>
  <text x="830" y="628" class="m xs">valid always True</text>

  <!-- internal chain arrows -->
  <path d="M460 276 V302" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <path d="M460 380 V406" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <path d="M460 464 V490" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <path d="M460 554 V582" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <path d="M830 276 V302" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <path d="M830 380 V406" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <path d="M830 464 V582" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>

  <!-- ===== inputs from outside (left: AI-1/AI-2) ===== -->
  <rect x="40" y="220" width="190" height="56" rx="8" class="ext"/>
  <text x="54" y="239" class="t sb" font-size="11.5">Calibration transform</text>
  <text x="54" y="253" class="m xs">rpyCalib + camera intrinsics</text>
  <text x="54" y="266" class="m xs">zero until first calibration</text>
  <path d="M230 248 H278" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
  <rect x="40" y="304" width="190" height="76" rx="8" class="ext"/>
  <text x="54" y="323" class="t sb" font-size="11.5">Other model inputs</text>
  <text x="54" y="339" class="m xs">desire pulse (8) · DesireHelper</text>
  <text x="54" y="353" class="m xs">traffic convention (2) · isRHD</text>
  <text x="54" y="367" class="m xs">action time (2) · actuator delays</text>
  <path d="M230 342 H278" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>

  <!-- runtime monitors note -->
  <rect x="40" y="492" width="190" height="88" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <text x="54" y="512" class="t sb" font-size="11.5">Runtime monitors (§6.4)</text>
  <text x="54" y="528" class="m xs">conventional QM software</text>
  <text x="54" y="541" class="m xs">placed around the AI system,</text>
  <text x="54" y="554" class="m xs">not part of the network</text>

  <!-- ===== input from outside (right: AI-3) ===== -->
  <rect x="1030" y="304" width="210" height="76" rx="8" class="ext"/>
  <text x="1044" y="324" class="t sb" font-size="11.5">Calibration (calib)</text>
  <text x="1044" y="340" class="m xs">extrinsicsCalibration.rpyCalib</text>
  <text x="1044" y="354" class="m xs">zeros until received</text>
  <path d="M1030 342 H962" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>

  <!-- ===== consumers outside the AI system ===== -->
  <path d="M460 646 V694" fill="none" stroke="#475569" stroke-width="1.4"/>
  <line x1="300" y1="694" x2="708" y2="694" stroke="#475569" stroke-width="1.4"/>
  <g fill="none" stroke="#475569" stroke-width="1.4">
    <path d="M300 694 V712" marker-end="url(#aG)"/>
    <path d="M402 694 V712" marker-end="url(#aG)"/>
    <path d="M504 694 V712" marker-end="url(#aG)"/>
    <path d="M606 694 V712" marker-end="url(#aG)"/>
    <path d="M708 694 V712" marker-end="url(#aG)"/>
  </g>
  <rect x="256" y="714" width="88" height="34" rx="6" class="ext"/>
  <text x="300" y="735" class="t sb" font-size="11.5" text-anchor="middle">controlsd</text>
  <rect x="358" y="714" width="88" height="34" rx="6" class="ext"/>
  <text x="402" y="735" class="t sb" font-size="11.5" text-anchor="middle">plannerd</text>
  <rect x="460" y="714" width="88" height="34" rx="6" class="ext"/>
  <text x="504" y="735" class="t sb" font-size="11.5" text-anchor="middle">radard</text>
  <rect x="562" y="714" width="88" height="34" rx="6" class="ext"/>
  <text x="606" y="735" class="t sb" font-size="11.5" text-anchor="middle">locationd</text>
  <rect x="664" y="714" width="88" height="34" rx="6" class="ext"/>
  <text x="708" y="735" class="t sb" font-size="11.5" text-anchor="middle">selfdrived</text>
  <path d="M830 646 V712" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <rect x="770" y="714" width="190" height="34" rx="6" class="ext"/>
  <text x="865" y="735" class="t sb" font-size="11.5" text-anchor="middle">dmonitoringd · policy.py</text>

  <!-- ultimately the envelope -->
  <rect x="1030" y="714" width="210" height="34" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.8"/>
  <text x="1135" y="735" class="t sb" font-size="11.5" text-anchor="middle">panda safety envelope</text>
  <path d="M256 756 V766 H960 V756" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
  <path d="M608 766 V778 H1135 V752" fill="none" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aR)"/>
  <text x="1000" y="772" fill="#C2410C" font-size="9.5" font-weight="600" text-anchor="middle">ultimately</text>
  <text x="40" y="735" class="m s">Outside the AI system,</text>
  <text x="40" y="749" class="m s">consuming its outputs</text>

  <!-- ===== legend ===== -->
  <line x1="40" y1="804" x2="1240" y2="804" stroke="#E2E8F0"/>
  <g transform="translate(40,830)" font-size="10.5">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#0F766E" stroke-width="2"/><text x="36" y="4" class="t">Input from outside the AI system</text>
    <line x1="236" y1="0" x2="264" y2="0" stroke="#475569" stroke-width="1.4"/><text x="272" y="4" class="t">Data flow</text>
    <line x1="352" y1="0" x2="380" y2="0" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="5 3"/><text x="388" y="4" class="t">Toward the safety envelope</text>
    <rect x="566" y="-8" width="28" height="16" rx="4" fill="#FFFBEB" stroke="#B45309" stroke-dasharray="5 3"/><text x="602" y="4" class="t">AI system boundary</text>
    <rect x="726" y="-8" width="28" height="16" rx="4" fill="#EEF2FF" stroke="#A5B4FC"/><text x="762" y="4" class="t">ML network</text>
    <rect x="850" y="-8" width="28" height="16" rx="4" fill="#F1F5F9" stroke="#94A3B8"/><text x="886" y="4" class="t">Outside the AI system</text>
  </g>
</svg>
