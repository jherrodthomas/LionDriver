<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 8-1. Risk value matrix with the threat scenarios placed (WP-C-09 §7–§8)</title>
  <desc id="d">ISO/SAE 21434 risk matrix: impact level 4 Severe to 1 Negligible against attack feasibility High, Medium, Low, Very low, giving risk values 1 to 5 as in §7. The 14 threat scenarios of §8 are placed by their maximum impact and feasibility: TS-02, TS-03, TS-04, TS-11 and TS-14 at impact 4 and feasibility High (risk 5); TS-01, TS-05, TS-06, TS-07, TS-08, TS-09, TS-10 and TS-12 at impact 4 and feasibility Medium (risk 4); TS-13 at impact 3 and feasibility Medium (risk 3). Cells with risk 3 or more are inside the treatment threshold. TS-02 and TS-14 carry a mark: treatment implemented in the reference build, not verified, not re-rated.</desc>
