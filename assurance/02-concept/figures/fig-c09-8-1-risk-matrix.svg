  <text x="1023" y="262" font-size="12" text-anchor="middle" font-weight="700" fill="#B08A4A">2</text>
  <text x="1046" y="261" class="t" font-size="11">retain with rationale</text>
  <rect x="1010" y="276" width="26" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
