  <text x="1046" y="380" class="t" font-size="11">the reference build, not</text>
  <text x="1046" y="394" class="t" font-size="11">verified; not re-rated (OI-5)</text>
  <text x="80" y="610" class="t" font-size="12">14 threat scenarios rated: 5 at risk 5 · 8 at risk 4 · 1 at risk 3 · none at risk 1–2. Every scenario is at or above the treatment threshold; empty cells hold no scenario.</text>
  <text x="80" y="630" class="m" font-size="11.5">Treatment per §8: reduce for all; TS-07 and TS-08 reduce / avoid; TS-13 reduce / retain. Placement uses the shipped baseline 8b8c6ae and credits no item-internal control (§1.2).</text>
  <text x="80" y="648" class="m" font-size="11.5">TS-02 (firmware mode lock) and TS-14 (TSR-705, TSR-518) are marked: controls implemented in the reference build only, not verified. Their position is unchanged until re-rated (OI-5).</text>
  <text x="80" y="666" class="m" font-size="11.5">Ratings are engineering proposals, not approved; they must not be used to argue cybersecurity before the preliminary assessment (WP-M-09 §8).</text>
