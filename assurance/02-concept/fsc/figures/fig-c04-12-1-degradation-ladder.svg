<text x="864.667" y="657.5" font-size="9.5" fill="#475569" font-weight="700" letter-spacing=".04em">ENTERED BY</text>
<text x="864.667" y="671.5" font-size="10.5" fill="#0F172A">Heartbeat loss, MCU fault, unknown mode (panda/board/main.c:33-54,</text>
<text x="864.667" y="685" font-size="10.5" fill="#0F172A">193-213)</text>
<text x="864.667" y="704.5" font-size="9.5" fill="#475569" font-weight="700" letter-spacing=".04em">LEFT BY</text>
<text x="864.667" y="718.5" font-size="10.5" fill="#0F172A">Restart / re-initialisation</text>
<text x="40" y="764" font-size="11" fill="#475569">Every fault-induced move to L2, L3 or L4 gives an acoustic and visual take-over request (§12.2). There is no lateral-only or longitudinal-only mode.</text>
<g class="terms">
<text x="40" y="784" font-size="10.5" fill="#475569">Terms: ACC adaptive cruise control · CAN controller area network: the vehicle's data bus · DM driver monitoring · DQ-nn decision of the project lead (decision register) · FSR-nn functional safety requirement (FSC) ·</text>
<text x="40" y="798.5" font-size="10.5" fill="#475569">HUD head-up display (here the cluster's lane-assist display) · L0–L5 degradation level L0 (full function) to L5 (lockout), FSC §12.1 · LKAS lane keeping assist system · MCU microcontroller: the panda safety</text>
<text x="40" y="813" font-size="10.5" fill="#475569">processor (STM32H7) · PCM powertrain control module (engine and drive) · RX receive · SILENT the panda's safety mode that sends nothing · SoC system on chip: the comma device's main processor, running openpilot (QM)</text>
<text x="40" y="827.5" font-size="10.5" fill="#475569">· SS-nn safe state (FSC §6): SS-L lateral, SS-G longitudinal, SS-S envelope silent · TX transmit · WP-nn work product, e.g. WP-C-04; the letter is its area (M management, C concept, S system, H hardware, W software,</text>
<text x="40" y="842" font-size="10.5" fill="#475569">V validation, P processes, A analyses, O operation, K safety case)</text>
</g>
