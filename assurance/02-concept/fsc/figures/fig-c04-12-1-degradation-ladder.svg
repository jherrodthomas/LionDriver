<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="876" viewBox="0 0 1280 876" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Figure 12-1. Degradation ladder (WP-C-04 §12.1, §6)</title>
<desc id="d">Six degradation levels of WP-C-04 §12.1, one row each: L0 Full function: lateral Active, longitudinal Active; L1 Override: lateral Torque reduced toward zero while the driver steers against it (FSR-05.03, DQ-053), longitudinal Blocked while gas pressed; L2 Take-over request, planned: lateral Active with valid inputs, ramping down ≤ soft-disable time, longitudinal Force decel to cruise 0; L3 Immediate disengagement: lateral SS-L, longitudinal SS-G + cancel; L4 Envelope silent: lateral SS-S, longitudinal SS-S; L5 Lockout: lateral Not available, longitudinal Not available. Safe states from §6: SS-L: 0x2E4 torque 0, steer request cleared; SS-G: 0x343 inactive value; ACC cancel requested; SS-S: SILENT/NO_OUTPUT: no TX, relay released (stock camera path).</desc>
