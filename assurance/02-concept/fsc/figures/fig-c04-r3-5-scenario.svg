ont-size="10.45" fill="#1E3A8A" font-weight="700" text-anchor="middle">3</text><text x="29" y="211.1" font-size="11" fill="#DBEAFE" font-weight="600">Driver corrects at 1.79 s</text></g></g></svg><text x="500" y="137.9" font-size="12" font-weight="700" fill="#0F172A">F-04b SoC stall, curve</text><text x="500" y="159.9" font-size="12" font-weight="400" fill="#475569">siren</text><text x="696" y="159.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">0.29 s</text><text x="500" y="181.9" font-size="12" font-weight="400" fill="#475569">correction</text><text x="696" y="181.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1.79 s</text><text x="500" y="203.9" font-size="12" font-weight="400" fill="#475569">muted</text><text x="696" y="203.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">2.89 s</text><text x="500" y="225.9" font-size="12" font-weight="400" fill="#475569">peak offset</text><text x="696" y="225.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">0.83 m</text><text x="500" y="247.9" font-size="12" font-weight="400" fill="#475569">muted</text><text x="696" y="247.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">3.64 m</text><text x="500" y="269.9" font-size="12" font-weight="700" fill="#0F172A"></text><text x="500" y="291.9" font-size="12" font-weight="700" fill="#0F172A">Engaged mismatch (c)</text><text x="500" y="313.9" font-size="12" font-weight="400" fill="#475569">siren</text><text x="696" y="313.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">0.63–0.88 s</text><text x="500" y="335.9" font-size="12" font-weight="400" fill="#475569">SG-02 budget</text><text x="696" y="335.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1 s</text><rect x="500" y="349.9" width="196" height="22" rx="11" fill="#FEF3C7" stroke="#B45309"/><text x="598" y="364.9" font-size="10.5" font-weight="700" fill="#92400E" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SYNTHETIC · NO CREDIT</text><text x="24" y="403.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WHAT IT GAVE</text><text x="24" y="423.9" font-size="13" font-weight="400" fill="#0F172A">The numbers: with the siren on revocation the driver starts correcting at 1.79 s instead of</text><text x="24" y="441.8" font-size="13" font-weight="400" fill="#0F172A">2.89 s, and the peak offset in the curve falls from 3.64 m to 0.83 m. In the failed-cancel case</text><text x="24" y="459.7" font-size="13" font-weight="400" fill="#0F172A">the siren comes at 0.63–0.88 s, inside SG-02's 1 s.</text><text x="24" y="487.6" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WATCH</text><text x="24" y="507.6" font-size="13" font-weight="400" fill="#475569">Synthetic (DSR-12), no evidence credit: real panda code in the loop, but the driver, EPS and</text><text x="24" y="525.5" font-size="13" font-weight="400" fill="#475569">road are the plant's assumptions. At the ODD bound the car still reaches the lane line.</text><text x="24" y="561.4" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TSR-516(c), ABRIDGED: SLOTS THIS ROUTE PINNED DOWN</text><g opacity="0.32"><rect x="24.0" y="571.4" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="588.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="602.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="613.4" width="107.0" height="106.0" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="631.4" font-size="11.5" font-weight="400" fill="#0F172A">PCM cruise</text><text x="31" y="646.4" font-size="11.5" font-weight="400" fill="#0F172A">still active</text><text x="31" y="661.4" font-size="11.5" font-weight="400" fill="#0F172A">0.5 s after</text><text x="31" y="676.4" font-size="11.5" font-weight="400" fill="#0F172A">the first "not</text><text x="31" y="691.4" font-size="11.5" font-weight="400" fill="#0F172A">engaged"</text><text x="31" y="706.4" font-size="11.5" font-weight="400" fill="#0F172A">heartbeat</text></g><g opacity="0.32"><rect x="137.0" y="571.4" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="588.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="602.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="613.4" width="107.0" height="106.0" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="631.4" font-size="11.5" font-weight="400" fill="#0F172A">The safety MCU</text></g><g opacity="0.32"><rect x="250.0" y="571.4" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="588.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="602.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="613.4" width="107.0" height="106.0" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="631.4" font-size="11.5" font-weight="400" fill="#0F172A">shall</text></g><g opacity="0.32"><rect x="363.0" y="571.4" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="588.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="602.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="613.4" width="107.0" height="106.0" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="631.4" font-size="11.5" font-weight="400" fill="#0F172A">sound</text></g><g opacity="0.32"><rect x="476.0" y="571.4" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="588.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="602.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="613.4" width="107.0" height="106.0" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="631.4" font-size="11.5" font-weight="400" fill="#0F172A">its own siren,</text><text x="483" y="646.4" font-size="11.5" font-weight="400" fill="#0F172A">not via the</text><text x="483" y="661.4" font-size="11.5" font-weight="400" fill="#0F172A">SoC</text></g><g><rect x="589.0" y="571.4" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="588.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="602.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="613.4" width="107.0" height="106.0" rx="6" fill="#ECFCCB" stroke="#4D7C0F" stroke-width="1.2"/><text x="596" y="631.4" font-size="11.5" font-weight="400" fill="#0F172A">≤ 0.5 s; ≥ 3</text><text x="596" y="646.4" font-size="11.5" font-weight="400" fill="#0F172A">s; audible</text><text x="596" y="661.4" font-size="11.5" font-weight="400" fill="#0F172A">(M-05)</text></g></svg>
