<svg xmlns="http://www.w3.org/2000/svg" width="720" height="675.8" viewBox="0 0 720 675.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Six routes, one requirement</title><desc id="d">Six cards, one per analysis route (fault tree, FMEA, STPA, guide words, plant scenario, trace), each with the question it asks and the slots of TSR-516 it fixed, above the TSR-516 box.</desc><rect width="720" height="675.8" fill="#FFFFFF"/><text x="24" y="34" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OVERVIEW · SG-02 → FSR-02.05 → TSR-516</text><text x="24" y="60" font-size="21" font-weight="700" fill="#0F172A">Six routes, one requirement</text><text x="24" y="88" font-size="13" font-weight="400" fill="#475569">Each method starts from SG-02 and reaches the same siren requirement from a different side. The</text><text x="24" y="105.9" font-size="13" font-weight="400" fill="#475569">chips show which slots of TSR-516 each route pinned down.</text><rect x="24.0" y="137.8" width="329.0" height="128" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="46.0" cy="161.8" r="12" fill="#0F172A"/><text x="46" y="166.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="66" y="166.8" font-size="16" font-weight="700" fill="#0F172A">Fault tree</text><text x="341" y="166.8" font-size="11" font-weight="700" fill="#475569" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">FTA</text><text x="38" y="189.8" font-size="12.5" font-weight="400" fill="#475569">Which combinations of faults violate SG-02?</text><rect x="38.0" y="231.8" width="49.5" height="22" rx="11" fill="#0F766E" stroke="#0F766E"/><text x="62.775" y="246.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><rect x="93.5" y="231.8" width="63.0" height="22" rx="11" fill="#B45309" stroke="#B45309"/><text x="125.035" y="246.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><rect x="367.0" y="137.8" width="329.0" height="128" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="389.0" cy="161.8" r="12" fill="#0F172A"/><text x="389" y="166.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="409" y="166.8" font-size="16" font-weight="700" fill="#0F172A">FMEA</text><text x="684" y="166.8" font-size="11" font-weight="700" fill="#475569" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">FMEA</text><text x="381" y="189.8" font-size="12.5" font-weight="400" fill="#475569">How does each element fail, and what control</text><text x="381" y="207" font-size="12.5" font-weight="400" fill="#475569">catches it?</text><rect x="381.0" y="231.8" width="56.3" height="22" rx="11" fill="#1D4ED8" stroke="#1D4ED8"/><text x="409.13" y="246.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><rect x="443.3" y="231.8" width="56.3" height="22" rx="11" fill="#BE185D" stroke="#BE185D"/><text x="471.39" y="246.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><rect x="24.0" y="279.8" width="329.0" height="128" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="46.0" cy="303.8" r="12" fill="#0F172A"/><text x="46" y="308.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="66" y="308.8" font-size="16" font-weight="700" fill="#0F172A">STPA</text><text x="341" y="308.8" font-size="11" font-weight="700" fill="#475569" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">STPA</text><text x="38" y="331.8" font-size="12.5" font-weight="400" fill="#475569">Which control actions are unsafe, and why?</text><rect x="38.0" y="373.8" width="83.1" height="22" rx="11" fill="#4D7C0F" stroke="#4D7C0F"/><text x="79.55" y="388.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><rect x="127.1" y="373.8" width="63.0" height="22" rx="11" fill="#B45309" stroke="#B45309"/><text x="158.585" y="388.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><rect x="367.0" y="279.8" width="329.0" height="128" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="389.0" cy="303.8" r="12" fill="#0F172A"/><text x="389" y="308.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="409" y="308.8" font-size="16" font-weight="700" fill="#0F172A">Guide words</text><text x="684" y="308.8" font-size="11" font-weight="700" fill="#475569" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">HAZOP</text><text x="381" y="331.8" font-size="12.5" font-weight="400" fill="#475569">What if the warning function does NO, LATE,</text><text x="381" y="349" font-size="12.5" font-weight="400" fill="#475569">TOO SHORT …?</text><rect x="381.0" y="373.8" width="49.5" height="22" rx="11" fill="#6D28D9" stroke="#6D28D9"/><text x="405.775" y="388.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><rect x="436.6" y="373.8" width="83.1" height="22" rx="11" fill="#4D7C0F" stroke="#4D7C0F"/><text x="478.1" y="388.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><rect x="24.0" y="421.8" width="329.0" height="128" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="46.0" cy="445.8" r="12" fill="#0F172A"/><text x="46" y="450.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="66" y="450.8" font-size="16" font-weight="700" fill="#0F172A">Scenario</text><text x="341" y="450.8" font-size="11" font-weight="700" fill="#475569" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PLANT</text><text x="38" y="473.8" font-size="12.5" font-weight="400" fill="#475569">What happens on the road, in seconds?</text><rect x="38.0" y="515.8" width="83.1" height="22" rx="11" fill="#4D7C0F" stroke="#4D7C0F"/><text x="79.55" y="530.8" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><rect x="367.0" y="421.8" width="329.0" height="128" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><circle cx="389.0" cy="445.8" r="12" fill="#0F172A"/><text x="389" y="450.3" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="409" y="450.8" font-size="16" font-weight="700" fill="#0F172A">Trace</text><text x="684" y="450.8" font-size="11" font-weight="700" fill="#475569" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRACE</text><text x="381" y="473.8" font-size="12.5" font-weight="400" fill="#475569">Is every link there, with the right ASIL and</text><text x="381" y="491" font-size="12.5" font-weight="400" fill="#475569">a test?</text><rect x="381.0" y="515.8" width="69.7" height="22" rx="11" fill="#FFFFFF" stroke="#94A3B8"/><text x="415.84" y="530.8" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">confirms</text><rect x="24" y="567.8" width="672" height="62" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/><text x="40" y="593.8" font-size="15" font-weight="700" fill="#0F172A">TSR-516 (b)/(c) · ASIL C</text><text x="40" y="614.8" font-size="12.5" font-weight="400" fill="#475569">The safety MCU sounds its own siren when authority ends for a reason the driver did not cause.</text><text x="24" y="659.8" font-size="12.5" font-weight="400" fill="#475569">Cross-checks: FRET found three anatomy defects (FF-04…FF-06); fmdtools, 10 cut sets the siren covers.</text></svg>
