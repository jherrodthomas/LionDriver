<svg xmlns="http://www.w3.org/2000/svg" width="720" height="594.3" viewBox="0 0 720 594.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">The anatomy of a requirement</title><desc id="d">FSR-02.05 split into the six slots TRIGGER, AGENT, MODAL, ACTION, OBJECT and CONSTRAINT, with the FRET field each slot maps to and the requirement's attributes.</desc><rect width="720" height="594.3" fill="#FFFFFF"/><text x="24" y="34" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ANATOMY · FSR-02.05</text><text x="24" y="60" font-size="21" font-weight="700" fill="#0F172A">The anatomy of a requirement</text><text x="24" y="88" font-size="13" font-weight="400" fill="#475569">Six slots, each answering one question. A slot left empty, or filled with words that cannot be</text><text x="24" y="105.9" font-size="13" font-weight="400" fill="#475569">tested, is a defect you can see. The slots are those of FRET's structured English, so a</text><text x="24" y="123.8" font-size="13" font-weight="400" fill="#475569">requirement split this way can also be formalised and checked against the code.</text><text x="24" y="165.7" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">FSR-02.05 (WP-C-04 §5), SPLIT INTO SLOTS</text><g><rect x="24.0" y="175.7" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="192.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="206.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="217.7" width="107.0" height="218.8" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="235.7" font-size="12" font-weight="400" fill="#0F172A">On loss of</text><text x="31" y="251.3" font-size="12" font-weight="400" fill="#0F172A">communication</text><text x="31" y="266.9" font-size="12" font-weight="400" fill="#0F172A">with the SoC</text><text x="31" y="282.5" font-size="12" font-weight="400" fill="#0F172A">while engaged,</text><text x="31" y="298.1" font-size="12" font-weight="400" fill="#0F172A">and on a reset</text><text x="31" y="313.7" font-size="12" font-weight="400" fill="#0F172A">of the safety</text><text x="31" y="329.3" font-size="12" font-weight="400" fill="#0F172A">MCU (watchdog</text><text x="31" y="344.9" font-size="12" font-weight="400" fill="#0F172A">or fault</text><text x="31" y="360.5" font-size="12" font-weight="400" fill="#0F172A">reset) that</text><text x="31" y="376.1" font-size="12" font-weight="400" fill="#0F172A">interrupts</text><text x="31" y="391.7" font-size="12" font-weight="400" fill="#0F172A">granted</text><text x="31" y="407.3" font-size="12" font-weight="400" fill="#0F172A">actuation</text><text x="31" y="422.9" font-size="12" font-weight="400" fill="#0F172A">authority</text></g><g><rect x="137.0" y="175.7" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="192.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="206.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="217.7" width="107.0" height="218.8" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="235.7" font-size="12" font-weight="400" fill="#0F172A">the safety MCU</text></g><g><rect x="250.0" y="175.7" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="192.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="206.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="217.7" width="107.0" height="218.8" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="235.7" font-size="12" font-weight="400" fill="#0F172A">shall</text></g><g><rect x="363.0" y="175.7" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="192.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="206.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="217.7" width="107.0" height="218.8" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="235.7" font-size="12" font-weight="400" fill="#0F172A">give</text></g><g><rect x="476.0" y="175.7" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="192.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="206.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="217.7" width="107.0" height="218.8" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="235.7" font-size="12" font-weight="400" fill="#0F172A">an acoustic</text><text x="483" y="251.3" font-size="12" font-weight="400" fill="#0F172A">warning that</text><text x="483" y="266.9" font-size="12" font-weight="400" fill="#0F172A">does not</text><text x="483" y="282.5" font-size="12" font-weight="400" fill="#0F172A">depend on the</text><text x="483" y="298.1" font-size="12" font-weight="400" fill="#0F172A">SoC</text></g><g><rect x="589.0" y="175.7" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="192.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="206.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="217.7" width="107.0" height="218.8" rx="6" fill="#FFFFFF" stroke="#4D7C0F" stroke-width="1.2" stroke-dasharray="4 3"/><text x="596" y="235.7" font-size="12" font-weight="400" fill="#475569">—</text></g><text x="24" y="452.5" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">FRET FIELD</text><text x="77.5" y="472.5" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">condition</text><text x="190.5" y="472.5" font-size="12.5" font-weight="700" fill="#0F766E" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">component</text><text x="303.5" y="472.5" font-size="12.5" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">shall</text><text x="416.5" y="472.5" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">response</text><text x="529.5" y="472.5" font-size="12.5" font-weight="700" fill="#BE185D" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">response</text><text x="642.5" y="472.5" font-size="12.5" font-weight="700" fill="#4D7C0F" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">timing</text><rect x="24.0" y="494.5" width="61.0" height="24" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><text x="34" y="511" font-size="12" font-weight="600" fill="#475569">ASIL</text><text x="68.2" y="511" font-size="12" font-weight="700" fill="#0F172A">C</text><rect x="93.0" y="494.5" width="102.1" height="24" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><text x="103.04" y="511" font-size="12" font-weight="600" fill="#475569">parent</text><text x="150.92" y="511" font-size="12" font-weight="700" fill="#0F172A">SG-02</text><rect x="203.1" y="494.5" width="156.8" height="24" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><text x="213.12" y="511" font-size="12" font-weight="600" fill="#475569">allocated</text><text x="281.52" y="511" font-size="12" font-weight="700" fill="#0F172A">E-03 panda</text><rect x="367.9" y="494.5" width="136.3" height="24" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><text x="377.92" y="511" font-size="12" font-weight="600" fill="#475569">verified by</text><text x="460" y="511" font-size="12" font-weight="700" fill="#0F172A">T-HIL</text><text x="24" y="548.5" font-size="13" font-weight="400" fill="#475569">CONSTRAINT is empty at FSR level: SG-02 only gives the 1 s budget from fault to warning.</text><text x="24" y="566.4" font-size="13" font-weight="400" fill="#475569">TSR-516 fills it. Attributes ride with the requirement but are not part of its sentence.</text></svg>
