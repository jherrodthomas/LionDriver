<svg xmlns="http://www.w3.org/2000/svg" width="720" height="685.4" viewBox="0 0 720 685.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Route 1: Fault tree</title><desc id="d">How the Fault tree reaches TSR-516, and the slots of its anatomy it fixed: AGENT, TRIGGER.</desc><rect width="720" height="685.4" fill="#FFFFFF"/><text x="24" y="34" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ROUTE 1 OF 6 · FTA</text><text x="24" y="60" font-size="21" font-weight="700" fill="#0F172A">1. Fault tree: Which combinations of faults violate</text><text x="24" y="86" font-size="21" font-weight="700" fill="#0F172A">SG-02?</text><text x="24" y="114" font-size="13" font-weight="400" fill="#475569">WP-A-04 SG-02 tree: MCS-02.5, MCS-02.9, BE-2.14</text><rect x="210" y="147.9" width="300" height="46" rx="7" fill="#FDECEA" stroke="#B42318" stroke-width="1.3"/><text x="360" y="166.9" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">SG-02 violated</text><text x="360" y="182.9" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">steering lost and no warning</text><path d="M360 193.9 V209.9" stroke="#475569" stroke-width="1.4"/><path d="M346 209.9 h28 v10 a14 14 0 0 1 -28 0 Z" fill="#FFFFFF" stroke="#475569" stroke-width="1.4"/><text x="360" y="223.9" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AND</text><path d="M360 233.9 V243.9 M170 243.9 H550 M170 243.9 V255.9 M550 243.9 V255.9" stroke="#475569" fill="none" stroke-width="1.4"/><rect x="40" y="255.9" width="260" height="64" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3"/><text x="170" y="274.9" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">steering lost</text><text x="170" y="290.9" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">SoC stall BE-2.05 · selfdrived</text><text x="170" y="306.9" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">hang BE-2.21 · EPS fault</text><rect x="420" y="255.9" width="260" height="64" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/><text x="550" y="274.9" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">no warning</text><text x="550" y="290.9" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">SoC alert lost with the SoC</text><text x="550" y="306.9" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">AND siren fails BE-2.14</text><path d="M300 287.9 H420" stroke="#B42318" stroke-width="2" stroke-dasharray="5 4"/><text x="360" y="280.9" font-size="11.5" font-weight="700" fill="#B42318" text-anchor="middle">one cause</text><text x="360" y="305.9" font-size="11.5" font-weight="700" fill="#B42318" text-anchor="middle">takes both</text><text x="24" y="353.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WHAT IT GAVE</text><text x="24" y="373.9" font-size="13" font-weight="400" fill="#0F172A">A single SoC fault both removes steering and silences the SoC's own alert (cut sets of order</text><text x="24" y="391.8" font-size="13" font-weight="400" fill="#0F172A">1). The warning must come from an element that survives the SoC: the safety MCU. The cut sets</text><text x="24" y="409.7" font-size="13" font-weight="400" fill="#0F172A">list the causes the trigger must cover.</text><text x="24" y="437.6" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WATCH</text><text x="24" y="457.6" font-size="13" font-weight="400" fill="#475569">Credit is by design only: the order stays 1 until the siren timing is verified on hardware</text><text x="24" y="475.5" font-size="13" font-weight="400" fill="#475569">(OI-11). BE-2.14 still describes the baseline triggers.</text><text x="24" y="511.4" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TSR-516(c), ABRIDGED: SLOTS THIS ROUTE PINNED DOWN</text><g><rect x="24.0" y="521.4" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="538.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="552.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="563.4" width="107.0" height="106.0" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="581.4" font-size="11.5" font-weight="400" fill="#0F172A">PCM cruise</text><text x="31" y="596.4" font-size="11.5" font-weight="400" fill="#0F172A">still active</text><text x="31" y="611.4" font-size="11.5" font-weight="400" fill="#0F172A">0.5 s after</text><text x="31" y="626.4" font-size="11.5" font-weight="400" fill="#0F172A">the first "not</text><text x="31" y="641.4" font-size="11.5" font-weight="400" fill="#0F172A">engaged"</text><text x="31" y="656.4" font-size="11.5" font-weight="400" fill="#0F172A">heartbeat</text></g><g><rect x="137.0" y="521.4" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="538.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="552.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="563.4" width="107.0" height="106.0" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="581.4" font-size="11.5" font-weight="400" fill="#0F172A">The safety MCU</text></g><g opacity="0.32"><rect x="250.0" y="521.4" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="538.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="552.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="563.4" width="107.0" height="106.0" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="581.4" font-size="11.5" font-weight="400" fill="#0F172A">shall</text></g><g opacity="0.32"><rect x="363.0" y="521.4" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="538.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="552.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="563.4" width="107.0" height="106.0" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="581.4" font-size="11.5" font-weight="400" fill="#0F172A">sound</text></g><g opacity="0.32"><rect x="476.0" y="521.4" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="538.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="552.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="563.4" width="107.0" height="106.0" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="581.4" font-size="11.5" font-weight="400" fill="#0F172A">its own siren,</text><text x="483" y="596.4" font-size="11.5" font-weight="400" fill="#0F172A">not via the</text><text x="483" y="611.4" font-size="11.5" font-weight="400" fill="#0F172A">SoC</text></g><g opacity="0.32"><rect x="589.0" y="521.4" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="538.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="552.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="563.4" width="107.0" height="106.0" rx="6" fill="#ECFCCB" stroke="#4D7C0F" stroke-width="1.2"/><text x="596" y="581.4" font-size="11.5" font-weight="400" fill="#0F172A">≤ 0.5 s; ≥ 3</text><text x="596" y="596.4" font-size="11.5" font-weight="400" fill="#0F172A">s; audible</text><text x="596" y="611.4" font-size="11.5" font-weight="400" fill="#0F172A">(M-05)</text></g></svg>
