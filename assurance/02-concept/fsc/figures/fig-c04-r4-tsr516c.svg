<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920.3" viewBox="0 0 720 920.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">TSR-516(c) before and after</title><desc id="d">TSR-516(c) split into six slots for WP-S-02 v0.52 and v0.53, with the FRET findings FF-05 and FF-06 marked on the old text, and the FRETish sentence coloured by slot.</desc><rect width="720" height="920.3" fill="#FFFFFF"/><text x="24" y="34" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TSR-516(c) · WP-S-02 v0.52 → v0.53</text><text x="24" y="60" font-size="21" font-weight="700" fill="#0F172A">TSR-516(c), split into slots: before and after the FRET</text><text x="24" y="86" font-size="21" font-weight="700" fill="#0F172A">pilot</text><text x="24" y="114" font-size="13" font-weight="400" fill="#475569">The FRET pilot restated the text in structured English and checked it against panda f4803c5.</text><text x="24" y="131.9" font-size="13" font-weight="400" fill="#475569">The split shows where the old text was weak: the 0.5 s guard was one tick off, and nothing said</text><text x="24" y="149.8" font-size="13" font-weight="400" fill="#475569">how long or how loud.</text><text x="24" y="191.7" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">v0.52 (SUPERSEDED 2026-10-21)</text><g><rect x="24.0" y="201.7" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="218.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="232.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="243.7" width="107.0" height="170.0" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="261.7" font-size="11.5" font-weight="400" fill="#0F172A">(c) PCM cruise</text><text x="31" y="276.7" font-size="11.5" font-weight="400" fill="#0F172A">is still</text><text x="31" y="291.7" font-size="11.5" font-weight="400" fill="#0F172A">active more</text><text x="31" y="306.7" font-size="11.5" font-weight="400" fill="#0F172A">than 0.5 s</text><text x="31" y="321.7" font-size="11.5" font-weight="400" fill="#0F172A">after the SoC</text><text x="31" y="336.7" font-size="11.5" font-weight="400" fill="#0F172A">heartbeat</text><text x="31" y="351.7" font-size="11.5" font-weight="400" fill="#0F172A">first reported</text><text x="31" y="366.7" font-size="11.5" font-weight="400" fill="#0F172A">"not engaged"</text></g><rect x="25.0" y="244.7" width="105.0" height="168.0" rx="5" fill="none" stroke="#B42318" stroke-width="2.4" stroke-dasharray="6 3"/><text x="31" y="404.7" font-size="10.5" font-weight="700" fill="#B42318">tick off</text><text x="31" y="391.7" font-size="10.5" font-weight="700" fill="#B42318">FF-06 · one</text><g><rect x="137.0" y="201.7" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="218.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="232.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="243.7" width="107.0" height="170.0" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="261.7" font-size="11.5" font-weight="400" fill="#0F172A">The safety MCU</text></g><g><rect x="250.0" y="201.7" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="218.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="232.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="243.7" width="107.0" height="170.0" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="261.7" font-size="11.5" font-weight="400" fill="#0F172A">shall</text></g><g><rect x="363.0" y="201.7" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="218.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="232.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="243.7" width="107.0" height="170.0" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="261.7" font-size="11.5" font-weight="400" fill="#0F172A">sound</text></g><g><rect x="476.0" y="201.7" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="218.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="232.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="243.7" width="107.0" height="170.0" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="261.7" font-size="11.5" font-weight="400" fill="#0F172A">its own</text><text x="483" y="276.7" font-size="11.5" font-weight="400" fill="#0F172A">acoustic</text><text x="483" y="291.7" font-size="11.5" font-weight="400" fill="#0F172A">warning …</text><text x="483" y="306.7" font-size="11.5" font-weight="400" fill="#0F172A">without</text><text x="483" y="321.7" font-size="11.5" font-weight="400" fill="#0F172A">depending on</text><text x="483" y="336.7" font-size="11.5" font-weight="400" fill="#0F172A">SoC software</text></g><g><rect x="589.0" y="201.7" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="218.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="232.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="243.7" width="107.0" height="170.0" rx="6" fill="#ECFCCB" stroke="#4D7C0F" stroke-width="1.2"/><text x="596" y="261.7" font-size="11.5" font-weight="400" fill="#0F172A">within ≤ 0.5 s</text><text x="596" y="276.7" font-size="11.5" font-weight="400" fill="#0F172A">of detection</text></g><rect x="590.0" y="244.7" width="105.0" height="168.0" rx="5" fill="none" stroke="#B42318" stroke-width="2.4" stroke-dasharray="6 3"/><text x="596" y="404.7" font-size="10.5" font-weight="700" fill="#B42318">long? how loud?</text><text x="596" y="391.7" font-size="10.5" font-weight="700" fill="#B42318">FF-05 · how</text><text x="24" y="439.7" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">v0.53 (CURRENT)</text><g><rect x="24.0" y="449.7" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="466.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="480.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="491.7" width="107.0" height="241.0" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="509.7" font-size="11.5" font-weight="400" fill="#0F172A">(c) PCM cruise</text><text x="31" y="524.7" font-size="11.5" font-weight="400" fill="#0F172A">is still</text><text x="31" y="539.7" font-size="11.5" font-weight="400" fill="#0F172A">active 0.5 s</text><text x="31" y="554.7" font-size="11.5" font-weight="400" fill="#0F172A">(within one 10</text><text x="31" y="569.7" font-size="11.5" font-weight="400" fill="#0F172A">ms task</text><text x="31" y="584.7" font-size="11.5" font-weight="400" fill="#0F172A">period) after</text><text x="31" y="599.7" font-size="11.5" font-weight="400" fill="#0F172A">the SoC</text><text x="31" y="614.7" font-size="11.5" font-weight="400" fill="#0F172A">heartbeat</text><text x="31" y="629.7" font-size="11.5" font-weight="400" fill="#0F172A">first reported</text><text x="31" y="644.7" font-size="11.5" font-weight="400" fill="#0F172A">"not engaged"</text></g><g><rect x="137.0" y="449.7" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="466.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="480.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="491.7" width="107.0" height="241.0" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="509.7" font-size="11.5" font-weight="400" fill="#0F172A">The safety MCU</text></g><g><rect x="250.0" y="449.7" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="466.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="480.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="491.7" width="107.0" height="241.0" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="509.7" font-size="11.5" font-weight="400" fill="#0F172A">shall</text></g><g><rect x="363.0" y="449.7" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="466.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="480.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="491.7" width="107.0" height="241.0" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="509.7" font-size="11.5" font-weight="400" fill="#0F172A">sound</text></g><g><rect x="476.0" y="449.7" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="466.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="480.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="491.7" width="107.0" height="241.0" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="509.7" font-size="11.5" font-weight="400" fill="#0F172A">its own</text><text x="483" y="524.7" font-size="11.5" font-weight="400" fill="#0F172A">acoustic</text><text x="483" y="539.7" font-size="11.5" font-weight="400" fill="#0F172A">warning …</text><text x="483" y="554.7" font-size="11.5" font-weight="400" fill="#0F172A">without</text><text x="483" y="569.7" font-size="11.5" font-weight="400" fill="#0F172A">depending on</text><text x="483" y="584.7" font-size="11.5" font-weight="400" fill="#0F172A">SoC software</text></g><g><rect x="589.0" y="449.7" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="466.7" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="480.7" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="491.7" width="107.0" height="241.0" rx="6" fill="#ECFCCB" stroke="#4D7C0F" stroke-width="1.2"/><text x="596" y="509.7" font-size="11.5" font-weight="400" fill="#0F172A">within ≤ 0.5 s</text><text x="596" y="524.7" font-size="11.5" font-weight="400" fill="#0F172A">of detection …</text><text x="596" y="539.7" font-size="11.5" font-weight="400" fill="#0F172A">for at least 3</text><text x="596" y="554.7" font-size="11.5" font-weight="400" fill="#0F172A">s or for as</text><text x="596" y="569.7" font-size="11.5" font-weight="400" fill="#0F172A">long as its</text><text x="596" y="584.7" font-size="11.5" font-weight="400" fill="#0F172A">condition</text><text x="596" y="599.7" font-size="11.5" font-weight="400" fill="#0F172A">holds if</text><text x="596" y="614.7" font-size="11.5" font-weight="400" fill="#0F172A">longer, at a</text><text x="596" y="629.7" font-size="11.5" font-weight="400" fill="#0F172A">level audible</text><text x="596" y="644.7" font-size="11.5" font-weight="400" fill="#0F172A">over the cabin</text><text x="596" y="659.7" font-size="11.5" font-weight="400" fill="#0F172A">noise of the</text><text x="596" y="674.7" font-size="11.5" font-weight="400" fill="#0F172A">reference</text><text x="596" y="689.7" font-size="11.5" font-weight="400" fill="#0F172A">vehicle (level</text><text x="596" y="704.7" font-size="11.5" font-weight="400" fill="#0F172A">set by WP-S-04</text><text x="596" y="719.7" font-size="11.5" font-weight="400" fill="#0F172A">M-05)</text></g><text x="24" y="762.7" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">FRETISH (PILOT, NO EVIDENCE CREDIT)</text><rect x="24.0" y="770.7" width="372.4" height="26" rx="5" fill="#FEF3C7" stroke="#B45309"/><text x="31" y="788.7" font-size="12.5" font-weight="600" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">upon not_engaged_ticks &gt; 50 &amp; pcm_cruise_active</text><rect x="402.4" y="770.7" width="105.5" height="26" rx="5" fill="#CCFBF1" stroke="#0F766E"/><text x="409.375" y="788.7" font-size="12.5" font-weight="600" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">the envelope</text><rect x="513.9" y="770.7" width="52.1" height="26" rx="5" fill="#EDE9FE" stroke="#6D28D9"/><text x="520.875" y="788.7" font-size="12.5" font-weight="600" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">shall</text><rect x="24.0" y="804.7" width="128.4" height="26" rx="5" fill="#ECFCCB" stroke="#4D7C0F"/><text x="31" y="822.7" font-size="12.5" font-weight="600" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">within 50 ticks</text><rect x="158.4" y="804.7" width="136.0" height="26" rx="5" fill="#DBEAFE" stroke="#1D4ED8"/><text x="165.375" y="822.7" font-size="12.5" font-weight="600" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">satisfy siren_on</text><text x="24" y="856.7" font-size="12.5" font-weight="400" fill="#475569">The FRETish has no OBJECT slot of its own: siren_on is both what is done and to what. FF-04, on</text><text x="24" y="873.9" font-size="12.5" font-weight="400" fill="#475569">(b), is in the same row: the EPS-fault persistence clause now replaces the 0.5 s bound instead of</text><text x="24" y="891.1" font-size="12.5" font-weight="400" fill="#475569">contradicting it.</text></svg>
