<svg xmlns="http://www.w3.org/2000/svg" width="720" height="683.4" viewBox="0 0 720 683.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Route 3: STPA</title><desc id="d">How the STPA reaches TSR-516, and the slots of its anatomy it fixed: CONSTRAINT, TRIGGER.</desc><rect width="720" height="683.4" fill="#FFFFFF"/><text x="24" y="34" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ROUTE 3 OF 6 · STPA</text><text x="24" y="60" font-size="21" font-weight="700" fill="#0F172A">3. STPA: Which control actions are unsafe, and why?</text><text x="24" y="88" font-size="13" font-weight="400" fill="#475569">WP-A-05 UCA-17, loss scenario LS-20</text><rect x="40" y="121.9" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="140" y="143.9" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">openpilot + panda</text><text x="140" y="161.9" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">controller C2 / C3</text><rect x="480" y="121.9" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="1.5"/><text x="580" y="143.9" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Driver</text><text x="580" y="161.9" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">controller C1</text><rect x="260" y="239.9" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/><text x="360" y="261.9" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Steering (EPS)</text><text x="360" y="279.9" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">controlled process</text><path d="M140 173.9 V265.9 H260" fill="none" stroke="#C2410C" stroke-width="1.6"/><text x="146" y="219.9" font-size="11.5" font-weight="600" fill="#C2410C">torque</text><path d="M240 143.9 H480" stroke="#B42318" stroke-width="2.4" stroke-dasharray="7 5"/><path d="M352 133.9 l16 20 M368 133.9 l-16 20" stroke="#B42318" stroke-width="2.6"/><text x="360" y="171.9" font-size="12" font-weight="700" fill="#B42318" text-anchor="middle">UCA-17: take-over alert</text><text x="360" y="187.9" font-size="12" font-weight="600" fill="#B42318" text-anchor="middle">not given, or after the driver can react</text><path d="M580 173.9 V265.9 H460" fill="none" stroke="#3B5BA9" stroke-width="1.6"/><text x="574" y="219.9" font-size="11.5" font-weight="600" fill="#3B5BA9" text-anchor="end">takes over</text><text x="24" y="317.9" font-size="12.5" font-weight="400" fill="#475569">LS-20: the request is sent but not perceived, so it counts as not given.</text><text x="24" y="351.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WHAT IT GAVE</text><text x="24" y="371.9" font-size="13" font-weight="400" fill="#0F172A">The unsafe action is 'not given, or given after the driver can react': the constraint is</text><text x="24" y="389.8" font-size="13" font-weight="400" fill="#0F172A">relative to the driver. The loss scenario says why: an alert the driver does not perceive is</text><text x="24" y="407.7" font-size="13" font-weight="400" fill="#0F172A">not given. That is the audible-level clause.</text><text x="24" y="435.6" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WATCH</text><text x="24" y="455.6" font-size="13" font-weight="400" fill="#475569">LS-20 predates DQ-404 and panda f4803c5: it still says the siren covers only heartbeat loss and</text><text x="24" y="473.5" font-size="13" font-weight="400" fill="#475569">an EPS fault. No loss scenario covers the failed-cancel case (c).</text><text x="24" y="509.4" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TSR-516(c), ABRIDGED: SLOTS THIS ROUTE PINNED DOWN</text><g><rect x="24.0" y="519.4" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="536.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="550.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="561.4" width="107.0" height="106.0" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="579.4" font-size="11.5" font-weight="400" fill="#0F172A">PCM cruise</text><text x="31" y="594.4" font-size="11.5" font-weight="400" fill="#0F172A">still active</text><text x="31" y="609.4" font-size="11.5" font-weight="400" fill="#0F172A">0.5 s after</text><text x="31" y="624.4" font-size="11.5" font-weight="400" fill="#0F172A">the first "not</text><text x="31" y="639.4" font-size="11.5" font-weight="400" fill="#0F172A">engaged"</text><text x="31" y="654.4" font-size="11.5" font-weight="400" fill="#0F172A">heartbeat</text></g><g opacity="0.32"><rect x="137.0" y="519.4" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="536.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="550.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="561.4" width="107.0" height="106.0" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="579.4" font-size="11.5" font-weight="400" fill="#0F172A">The safety MCU</text></g><g opacity="0.32"><rect x="250.0" y="519.4" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="536.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="550.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="561.4" width="107.0" height="106.0" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="579.4" font-size="11.5" font-weight="400" fill="#0F172A">shall</text></g><g opacity="0.32"><rect x="363.0" y="519.4" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="536.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="550.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="561.4" width="107.0" height="106.0" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="579.4" font-size="11.5" font-weight="400" fill="#0F172A">sound</text></g><g opacity="0.32"><rect x="476.0" y="519.4" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="536.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="550.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="561.4" width="107.0" height="106.0" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="579.4" font-size="11.5" font-weight="400" fill="#0F172A">its own siren,</text><text x="483" y="594.4" font-size="11.5" font-weight="400" fill="#0F172A">not via the</text><text x="483" y="609.4" font-size="11.5" font-weight="400" fill="#0F172A">SoC</text></g><g><rect x="589.0" y="519.4" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="536.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="550.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="561.4" width="107.0" height="106.0" rx="6" fill="#ECFCCB" stroke="#4D7C0F" stroke-width="1.2"/><text x="596" y="579.4" font-size="11.5" font-weight="400" fill="#0F172A">≤ 0.5 s; ≥ 3</text><text x="596" y="594.4" font-size="11.5" font-weight="400" fill="#0F172A">s; audible</text><text x="596" y="609.4" font-size="11.5" font-weight="400" fill="#0F172A">(M-05)</text></g></svg>
