<svg xmlns="http://www.w3.org/2000/svg" width="720" height="667.4" viewBox="0 0 720 667.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Route 4: Guide words</title><desc id="d">How the Guide words reaches TSR-516, and the slots of its anatomy it fixed: MODAL, CONSTRAINT.</desc><rect width="720" height="667.4" fill="#FFFFFF"/><text x="24" y="34" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ROUTE 4 OF 6 · HAZOP</text><text x="24" y="60" font-size="21" font-weight="700" fill="#0F172A">4. Guide words: What if the warning function does NO,</text><text x="24" y="86" font-size="21" font-weight="700" fill="#0F172A">LATE, TOO SHORT …?</text><text x="24" y="114" font-size="13" font-weight="400" fill="#475569">HARA F-05 'Driver information and warnings': M01 and the guide words rated the same</text><text x="24" y="159.9" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">F-05 DRIVER INFORMATION AND WARNINGS × 14 GUIDE WORDS (HARA)</text><rect x="24.0" y="169.9" width="90.9" height="50" rx="6" fill="#FDECEA" stroke="#B42318" stroke-width="1.6"/><text x="30" y="186.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">NO</text><text x="30" y="200.9" font-size="10" font-weight="400" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M01</text><text x="108.857" y="211.9" font-size="10" font-weight="700" fill="#B42318" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SC</text><rect x="120.9" y="169.9" width="90.9" height="50" rx="6" fill="#FDECEA" stroke="#B42318" stroke-width="1.6"/><text x="126.857" y="186.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">STOPS</text><text x="126.857" y="200.9" font-size="10" font-weight="400" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M02</text><text x="205.714" y="211.9" font-size="10" font-weight="700" fill="#B42318" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SC</text><rect x="217.7" y="169.9" width="90.9" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/><text x="223.714" y="186.9" font-size="11.5" font-weight="700" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">UNASKED</text><text x="223.714" y="200.9" font-size="10" font-weight="400" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M03</text><text x="302.571" y="211.9" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">NSC</text><rect x="314.6" y="169.9" width="90.9" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="320.571" y="186.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">STUCK</text><text x="320.571" y="200.9" font-size="10" font-weight="400" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M04</text><text x="399.429" y="211.9" font-size="10" font-weight="700" fill="#475569" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SC</text><rect x="411.4" y="169.9" width="90.9" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/><text x="417.429" y="186.9" font-size="11.5" font-weight="700" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TOO MUCH</text><text x="417.429" y="200.9" font-size="10" font-weight="400" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M05</text><text x="496.286" y="211.9" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">NA</text><rect x="508.3" y="169.9" width="90.9" height="50" rx="6" fill="#FDECEA" stroke="#B42318" stroke-width="1.6"/><text x="514.286" y="186.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PARTIAL</text><text x="514.286" y="200.9" font-size="10" font-weight="400" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M06</text><text x="593.143" y="211.9" font-size="10" font-weight="700" fill="#B42318" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SC</text><rect x="605.1" y="169.9" width="90.9" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/><text x="611.143" y="186.9" font-size="11.5" font-weight="700" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">EARLY</text><text x="611.143" y="200.9" font-size="10" font-weight="400" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M07</text><text x="690" y="211.9" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">NSC</text><rect x="24.0" y="225.9" width="90.9" height="50" rx="6" fill="#FDECEA" stroke="#B42318" stroke-width="1.6"/><text x="30" y="242.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">LATE</text><text x="30" y="256.9" font-size="10" font-weight="400" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M08</text><text x="108.857" y="267.9" font-size="10" font-weight="700" fill="#B42318" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SC</text><rect x="120.9" y="225.9" width="90.9" height="50" rx="6" fill="#FDECEA" stroke="#B42318" stroke-width="1.6"/><text x="126.857" y="242.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TOO SHORT</text><text x="126.857" y="256.9" font-size="10" font-weight="400" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M09</text><text x="205.714" y="267.9" font-size="10" font-weight="700" fill="#B42318" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SC</text><rect x="217.7" y="225.9" width="90.9" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/><text x="223.714" y="242.9" font-size="11.5" font-weight="700" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TOO LONG</text><text x="223.714" y="256.9" font-size="10" font-weight="400" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M10</text><text x="302.571" y="267.9" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">NSC</text><rect x="314.6" y="225.9" width="90.9" height="50" rx="6" fill="#FDECEA" stroke="#B42318" stroke-width="1.6"/><text x="320.571" y="242.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">DELAYED</text><text x="320.571" y="256.9" font-size="10" font-weight="400" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M11</text><text x="399.429" y="267.9" font-size="10" font-weight="700" fill="#B42318" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SC</text><rect x="411.4" y="225.9" width="90.9" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="417.429" y="242.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">INVERSE</text><text x="417.429" y="256.9" font-size="10" font-weight="400" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M12</text><text x="496.286" y="267.9" font-size="10" font-weight="700" fill="#475569" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">SC</text><rect x="508.3" y="225.9" width="90.9" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/><text x="514.286" y="242.9" font-size="11.5" font-weight="700" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ERRATIC</text><text x="514.286" y="256.9" font-size="10" font-weight="400" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M13</text><text x="593.143" y="267.9" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">NSC</text><rect x="605.1" y="225.9" width="90.9" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/><text x="611.143" y="242.9" font-size="11.5" font-weight="700" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">UNEVEN</text><text x="611.143" y="256.9" font-size="10" font-weight="400" fill="#94A3B8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">M14</text><text x="690" y="267.9" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">NA</text><text x="24" y="301.9" font-size="12" font-weight="400" fill="#475569">Red: no alert (M01) and the guide words the HARA rates the same as it. SC: safety-relevant.</text><text x="24" y="335.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WHAT IT GAVE</text><text x="24" y="355.9" font-size="13" font-weight="400" fill="#0F172A">NO makes the warning mandatory. LATE, DELAYED and TOO SHORT are each rated 'same as missing',</text><text x="24" y="373.8" font-size="13" font-weight="400" fill="#0F172A">so the timing and the duration belong in the requirement, not in a test note. TOO SHORT was in</text><text x="24" y="391.7" font-size="13" font-weight="400" fill="#0F172A">the HARA before TSR-516 said how long.</text><text x="24" y="419.6" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WATCH</text><text x="24" y="439.6" font-size="13" font-weight="400" fill="#475569">Generic: the rows name the take-over alert, not who sounds it, so they reach SG-02 through H-07</text><text x="24" y="457.5" font-size="13" font-weight="400" fill="#475569">and need the other routes to reach the panda.</text><text x="24" y="493.4" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TSR-516(c), ABRIDGED: SLOTS THIS ROUTE PINNED DOWN</text><g opacity="0.32"><rect x="24.0" y="503.4" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="520.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="534.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="545.4" width="107.0" height="106.0" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="563.4" font-size="11.5" font-weight="400" fill="#0F172A">PCM cruise</text><text x="31" y="578.4" font-size="11.5" font-weight="400" fill="#0F172A">still active</text><text x="31" y="593.4" font-size="11.5" font-weight="400" fill="#0F172A">0.5 s after</text><text x="31" y="608.4" font-size="11.5" font-weight="400" fill="#0F172A">the first "not</text><text x="31" y="623.4" font-size="11.5" font-weight="400" fill="#0F172A">engaged"</text><text x="31" y="638.4" font-size="11.5" font-weight="400" fill="#0F172A">heartbeat</text></g><g opacity="0.32"><rect x="137.0" y="503.4" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="520.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="534.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="545.4" width="107.0" height="106.0" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="563.4" font-size="11.5" font-weight="400" fill="#0F172A">The safety MCU</text></g><g><rect x="250.0" y="503.4" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="520.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="534.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="545.4" width="107.0" height="106.0" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="563.4" font-size="11.5" font-weight="400" fill="#0F172A">shall</text></g><g opacity="0.32"><rect x="363.0" y="503.4" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="520.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="534.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="545.4" width="107.0" height="106.0" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="563.4" font-size="11.5" font-weight="400" fill="#0F172A">sound</text></g><g opacity="0.32"><rect x="476.0" y="503.4" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="520.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="534.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="545.4" width="107.0" height="106.0" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="563.4" font-size="11.5" font-weight="400" fill="#0F172A">its own siren,</text><text x="483" y="578.4" font-size="11.5" font-weight="400" fill="#0F172A">not via the</text><text x="483" y="593.4" font-size="11.5" font-weight="400" fill="#0F172A">SoC</text></g><g><rect x="589.0" y="503.4" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="520.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="534.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="545.4" width="107.0" height="106.0" rx="6" fill="#ECFCCB" stroke="#4D7C0F" stroke-width="1.2"/><text x="596" y="563.4" font-size="11.5" font-weight="400" fill="#0F172A">≤ 0.5 s; ≥ 3</text><text x="596" y="578.4" font-size="11.5" font-weight="400" fill="#0F172A">s; audible</text><text x="596" y="593.4" font-size="11.5" font-weight="400" fill="#0F172A">(M-05)</text></g></svg>
