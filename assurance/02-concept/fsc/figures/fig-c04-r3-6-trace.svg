<svg xmlns="http://www.w3.org/2000/svg" width="720" height="613.4" viewBox="0 0 720 613.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Route 6: Trace</title><desc id="d">How the Trace reaches TSR-516, and the slots of its anatomy it fixed: none.</desc><rect width="720" height="613.4" fill="#FFFFFF"/><text x="24" y="34" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ROUTE 6 OF 6 · TRACE</text><text x="24" y="60" font-size="21" font-weight="700" fill="#0F172A">6. Trace: Is every link there, with the right ASIL and a</text><text x="24" y="86" font-size="21" font-weight="700" fill="#0F172A">test?</text><text x="24" y="114" font-size="13" font-weight="400" fill="#475569">SG-02 → FSR-02.05 → TSR-516 → SWSR-516, SWSR-516b → tests</text><rect x="24.0" y="147.9" width="116.8" height="74" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/><text x="82.4" y="169.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">SG-02</text><text x="82.4" y="199.9" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">goal</text><text x="82.4" y="214.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ASIL C</text><rect x="162.8" y="147.9" width="116.8" height="74" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/><text x="221.2" y="169.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">FSR-02.05</text><text x="221.2" y="199.9" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">functional</text><text x="221.2" y="214.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ASIL C</text><path d="M144.8 184.9 h12 m-5 -5 l5 5 l-5 5" fill="none" stroke="#475569" stroke-width="1.6"/><rect x="301.6" y="147.9" width="116.8" height="74" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/><text x="360" y="169.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">TSR-516</text><text x="360" y="199.9" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">technical</text><text x="360" y="214.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ASIL C</text><path d="M283.6 184.9 h12 m-5 -5 l5 5 l-5 5" fill="none" stroke="#475569" stroke-width="1.6"/><rect x="440.4" y="147.9" width="116.8" height="74" rx="8" fill="#FDECEA" stroke="#B42318" stroke-width="1.4"/><text x="498.8" y="169.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">SWSR-516 /</text><text x="498.8" y="184.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">516b</text><text x="498.8" y="199.9" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">software</text><text x="498.8" y="214.9" font-size="11" font-weight="700" fill="#B42318" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ASIL B</text><path d="M422.4 184.9 h12 m-5 -5 l5 5 l-5 5" fill="none" stroke="#475569" stroke-width="1.6"/><rect x="579.2" y="147.9" width="116.8" height="74" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/><text x="637.6" y="169.9" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">tests</text><text x="637.6" y="199.9" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">host · HIL not run</text><path d="M561.2 184.9 h12 m-5 -5 l5 5 l-5 5" fill="none" stroke="#475569" stroke-width="1.6"/><text x="24" y="247.9" font-size="12.5" font-weight="600" fill="#B42318">SWSR-516 and SWSR-516b are ASIL B under an ASIL C TSR, with no decomposition stated.</text><text x="24" y="281.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WHAT IT GAVE</text><text x="24" y="301.9" font-size="13" font-weight="400" fill="#0F172A">Confirms the chain rather than deriving anything. It checks the attributes: TSR-516 is ASIL C</text><text x="24" y="319.8" font-size="13" font-weight="400" fill="#0F172A">like its parent, verification T-HIL. It finds SWSR-516 and SWSR-516b at ASIL B, and no HIL or</text><text x="24" y="337.7" font-size="13" font-weight="400" fill="#0F172A">VS case for (c).</text><text x="24" y="365.6" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WATCH</text><text x="24" y="385.6" font-size="13" font-weight="400" fill="#475569">A complete trace says nothing about whether the text is right: every FRET finding (FF-01…FF-07)</text><text x="24" y="403.5" font-size="13" font-weight="400" fill="#475569">passed the trace.</text><text x="24" y="439.4" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TSR-516(c), ABRIDGED: THIS ROUTE FIXES NO SLOT; IT CHECKS THE ATTRIBUTES</text><g opacity="0.32"><rect x="24.0" y="449.4" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="466.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="480.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="491.4" width="107.0" height="106.0" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="509.4" font-size="11.5" font-weight="400" fill="#0F172A">PCM cruise</text><text x="31" y="524.4" font-size="11.5" font-weight="400" fill="#0F172A">still active</text><text x="31" y="539.4" font-size="11.5" font-weight="400" fill="#0F172A">0.5 s after</text><text x="31" y="554.4" font-size="11.5" font-weight="400" fill="#0F172A">the first "not</text><text x="31" y="569.4" font-size="11.5" font-weight="400" fill="#0F172A">engaged"</text><text x="31" y="584.4" font-size="11.5" font-weight="400" fill="#0F172A">heartbeat</text></g><g opacity="0.32"><rect x="137.0" y="449.4" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="466.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="480.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="491.4" width="107.0" height="106.0" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="509.4" font-size="11.5" font-weight="400" fill="#0F172A">The safety MCU</text></g><g opacity="0.32"><rect x="250.0" y="449.4" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="466.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="480.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="491.4" width="107.0" height="106.0" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="509.4" font-size="11.5" font-weight="400" fill="#0F172A">shall</text></g><g opacity="0.32"><rect x="363.0" y="449.4" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="466.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="480.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="491.4" width="107.0" height="106.0" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="509.4" font-size="11.5" font-weight="400" fill="#0F172A">sound</text></g><g opacity="0.32"><rect x="476.0" y="449.4" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="466.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="480.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="491.4" width="107.0" height="106.0" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="509.4" font-size="11.5" font-weight="400" fill="#0F172A">its own siren,</text><text x="483" y="524.4" font-size="11.5" font-weight="400" fill="#0F172A">not via the</text><text x="483" y="539.4" font-size="11.5" font-weight="400" fill="#0F172A">SoC</text></g><g opacity="0.32"><rect x="589.0" y="449.4" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="466.4" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="480.4" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="491.4" width="107.0" height="106.0" rx="6" fill="#ECFCCB" stroke="#4D7C0F" stroke-width="1.2"/><text x="596" y="509.4" font-size="11.5" font-weight="400" fill="#0F172A">≤ 0.5 s; ≥ 3</text><text x="596" y="524.4" font-size="11.5" font-weight="400" fill="#0F172A">s; audible</text><text x="596" y="539.4" font-size="11.5" font-weight="400" fill="#0F172A">(M-05)</text></g></svg>
