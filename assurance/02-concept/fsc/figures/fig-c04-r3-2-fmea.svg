<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635.5" viewBox="0 0 720 635.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Route 2: FMEA</title><desc id="d">How the FMEA reaches TSR-516, and the slots of its anatomy it fixed: ACTION, OBJECT.</desc><rect width="720" height="635.5" fill="#FFFFFF"/><text x="24" y="34" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ROUTE 2 OF 6 · FMEA</text><text x="24" y="60" font-size="21" font-weight="700" fill="#0F172A">2. FMEA: How does each element fail, and what control</text><text x="24" y="86" font-size="21" font-weight="700" fill="#0F172A">catches it?</text><text x="24" y="114" font-size="13" font-weight="400" fill="#475569">System FMEA SFM-026 (alert not presented), WP-W-04 SWF-39 (siren omission)</text><rect x="24" y="147.9" width="108" height="28" fill="#0F172A"/><text x="32" y="166.9" font-size="12" font-weight="700" fill="#FFFFFF">Item</text><rect x="132" y="147.9" width="176" height="28" fill="#0F172A"/><text x="140" y="166.9" font-size="12" font-weight="700" fill="#FFFFFF">Failure mode</text><rect x="308" y="147.9" width="128" height="28" fill="#0F172A"/><text x="316" y="166.9" font-size="12" font-weight="700" fill="#FFFFFF">Effect</text><rect x="436" y="147.9" width="150" height="28" fill="#0F172A"/><text x="444" y="166.9" font-size="12" font-weight="700" fill="#FFFFFF">Control</text><rect x="586" y="147.9" width="110" height="28" fill="#0F172A"/><text x="594" y="166.9" font-size="12" font-weight="700" fill="#FFFFFF">Trace</text><rect x="24" y="175.9" width="108" height="46" fill="#FFFFFF" stroke="#E2E8F0"/><text x="32" y="194.9" font-size="12" font-weight="400" fill="#0F172A">HMI (ui,</text><text x="32" y="210.9" font-size="12" font-weight="400" fill="#0F172A">soundd)</text><rect x="132" y="175.9" width="176" height="46" fill="#FFFFFF" stroke="#E2E8F0"/><text x="140" y="194.9" font-size="12" font-weight="400" fill="#0F172A">Take-over alert not</text><text x="140" y="210.9" font-size="12" font-weight="400" fill="#0F172A">presented (crash)</text><rect x="308" y="175.9" width="128" height="46" fill="#FFFFFF" stroke="#E2E8F0"/><text x="316" y="194.9" font-size="12" font-weight="400" fill="#0F172A">Unannounced loss</text><rect x="436" y="175.9" width="150" height="46" fill="#DBEAFE" stroke="#E2E8F0"/><text x="444" y="194.9" font-size="12" font-weight="600" fill="#0F172A">panda siren</text><rect x="586" y="175.9" width="110" height="46" fill="#FFFFFF" stroke="#E2E8F0"/><text x="594" y="194.9" font-size="12" font-weight="400" fill="#0F172A">FSR-02.05</text><rect x="24" y="221.9" width="108" height="46" fill="#FFFFFF" stroke="#E2E8F0"/><text x="32" y="240.9" font-size="12" font-weight="400" fill="#0F172A">U-PND-HK siren</text><rect x="132" y="221.9" width="176" height="46" fill="#FDECEA" stroke="#E2E8F0"/><text x="140" y="240.9" font-size="12" font-weight="600" fill="#0F172A">Omission: siren not</text><text x="140" y="256.9" font-size="12" font-weight="600" fill="#0F172A">sounding when SoC lost</text><rect x="308" y="221.9" width="128" height="46" fill="#FFFFFF" stroke="#E2E8F0"/><text x="316" y="240.9" font-size="12" font-weight="400" fill="#0F172A">No warning</text><rect x="436" y="221.9" width="150" height="46" fill="#FFFFFF" stroke="#E2E8F0"/><text x="444" y="240.9" font-size="12" font-weight="400" fill="#0F172A">malfunction reported</text><rect x="586" y="221.9" width="110" height="46" fill="#FFFFFF" stroke="#E2E8F0"/><text x="594" y="240.9" font-size="12" font-weight="400" fill="#0F172A">SWSR-516</text><text x="24" y="287.9" font-size="12" font-weight="400" fill="#475569">SFM-026 (System FMEA) above, SWF-39 (WP-W-04) below: the control of one row is the item of the next.</text><text x="24" y="321.9" font-size="11.5" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WHAT IT GAVE</text><text x="24" y="341.9" font-size="13" font-weight="400" fill="#0F172A">The alert row names the control (the panda siren) and traces it to FSR-02.05. The software row</text><text x="24" y="359.8" font-size="13" font-weight="400" fill="#0F172A">turns the control into an item with its own failure mode, omission, which a test must exclude.</text><text x="24" y="387.7" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">WATCH</text><text x="24" y="407.7" font-size="13" font-weight="400" fill="#475569">Rows age with the code: until PRs #398 and #399, SWF-39 credited only the heartbeat case and</text><text x="24" y="425.6" font-size="13" font-weight="400" fill="#475569">the System FMEA F-04b entries described a silent SoC stall.</text><text x="24" y="461.5" font-size="11.5" font-weight="700" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TSR-516(c), ABRIDGED: SLOTS THIS ROUTE PINNED DOWN</text><g opacity="0.32"><rect x="24.0" y="471.5" width="107.0" height="38" rx="6" fill="#B45309"/><text x="77.5" y="488.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">TRIGGER</text><text x="77.5" y="502.5" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">when?</text><rect x="24.0" y="513.5" width="107.0" height="106.0" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="31" y="531.5" font-size="11.5" font-weight="400" fill="#0F172A">PCM cruise</text><text x="31" y="546.5" font-size="11.5" font-weight="400" fill="#0F172A">still active</text><text x="31" y="561.5" font-size="11.5" font-weight="400" fill="#0F172A">0.5 s after</text><text x="31" y="576.5" font-size="11.5" font-weight="400" fill="#0F172A">the first "not</text><text x="31" y="591.5" font-size="11.5" font-weight="400" fill="#0F172A">engaged"</text><text x="31" y="606.5" font-size="11.5" font-weight="400" fill="#0F172A">heartbeat</text></g><g opacity="0.32"><rect x="137.0" y="471.5" width="107.0" height="38" rx="6" fill="#0F766E"/><text x="190.5" y="488.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">AGENT</text><text x="190.5" y="502.5" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">who?</text><rect x="137.0" y="513.5" width="107.0" height="106.0" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="144" y="531.5" font-size="11.5" font-weight="400" fill="#0F172A">The safety MCU</text></g><g opacity="0.32"><rect x="250.0" y="471.5" width="107.0" height="38" rx="6" fill="#6D28D9"/><text x="303.5" y="488.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">MODAL</text><text x="303.5" y="502.5" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how binding?</text><rect x="250.0" y="513.5" width="107.0" height="106.0" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.2"/><text x="257" y="531.5" font-size="11.5" font-weight="400" fill="#0F172A">shall</text></g><g><rect x="363.0" y="471.5" width="107.0" height="38" rx="6" fill="#1D4ED8"/><text x="416.5" y="488.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">ACTION</text><text x="416.5" y="502.5" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">does what?</text><rect x="363.0" y="513.5" width="107.0" height="106.0" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/><text x="370" y="531.5" font-size="11.5" font-weight="400" fill="#0F172A">sound</text></g><g><rect x="476.0" y="471.5" width="107.0" height="38" rx="6" fill="#BE185D"/><text x="529.5" y="488.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">OBJECT</text><text x="529.5" y="502.5" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">to what?</text><rect x="476.0" y="513.5" width="107.0" height="106.0" rx="6" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.2"/><text x="483" y="531.5" font-size="11.5" font-weight="400" fill="#0F172A">its own siren,</text><text x="483" y="546.5" font-size="11.5" font-weight="400" fill="#0F172A">not via the</text><text x="483" y="561.5" font-size="11.5" font-weight="400" fill="#0F172A">SoC</text></g><g opacity="0.32"><rect x="589.0" y="471.5" width="107.0" height="38" rx="6" fill="#4D7C0F"/><text x="642.5" y="488.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">CONSTRAINT</text><text x="642.5" y="502.5" font-size="10.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">how fast, long, loud?</text><rect x="589.0" y="513.5" width="107.0" height="106.0" rx="6" fill="#ECFCCB" stroke="#4D7C0F" stroke-width="1.2"/><text x="596" y="531.5" font-size="11.5" font-weight="400" fill="#0F172A">≤ 0.5 s; ≥ 3</text><text x="596" y="546.5" font-size="11.5" font-weight="400" fill="#0F172A">s; audible</text><text x="596" y="561.5" font-size="11.5" font-weight="400" fill="#0F172A">(M-05)</text></g></svg>
