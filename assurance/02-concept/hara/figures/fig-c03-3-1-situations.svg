<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="946" viewBox="0 0 1280 946" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Figure 3-1. Operational situations (WP-C-03 §3)</title>
<desc id="d">Operational situations of WP-C-03 §3: OS-01 Limited-access highway, free flow, adjacent traffic 90–110 km/h E4; OS-02 Highway curve near R_ODD with barrier or adjacent traffic 70–110 km/h E3; OS-03 Engaged on an undivided rural or arterial road, oncoming traffic 60–90 km/h E3 (foreseeable misuse); OS-04 Engaged on an urban arterial, pedestrians and cyclists near the lane edge 30–60 km/h E3 (foreseeable misuse); OS-05 Following a lead vehicle at a short gap, dense traffic 30–110 km/h E4; OS-06 Stop-and-go queue or standstill behind a lead; pedestrians may cross 0–30 km/h E3; OS-07 Approaching slower or stationary traffic from highway speed 70–110 km/h E4; OS-08 Close following vehicle behind (gap &lt; 1.5 s) 50–110 km/h E4; OS-09 Imminent collision where the stock PCS/AEB would intervene 0–120 km/h E2; OS-10 Driver override while engaged 0–110 km/h E3; OS-12 Driver-initiated assisted lane change 70–110 km/h E3; OS-13 Manual driving, item powered but not engaged 0–120 km/h E4; OS-14 Engaged outside the ODD (residential street, ramp, tight curve) 15–60 km/h E3 (foreseeable misuse); OS-15 Engaged approaching a signalised or stop-controlled intersection 30–90 km/h E3 (foreseeable misuse); OS-16 Engaged in a rural or arterial curve with oncoming traffic 60–90 km/h E3 (foreseeable misuse); OS-17 Engaged on the highway while the driver is not supervising (eyes off the road or hands off for long periods; responds when alerted) 70–110 km/h E2 (foreseeable misuse); OS-18 Engaged on the highway with an unresponsive driver (asleep, impaired or incapacitated) 70–110 km/h E1 (foreseeable misuse); OS-19 Engaged in a roundabout (rotary), cyclists and pedestrians at the entries 15–40 km/h E2 (foreseeable misuse); OS-20 Engaged through road works 30–90 km/h E2 (foreseeable misuse); OS-21 Engaged on a road without lane markings (rural back road or residential street) 30–90 km/h E3 (foreseeable misuse). Weather: W01 Dry, daylight E4; W02 Wet road or light rain E3; W03 Night, dry, headlights E3; W04 Moderate or heavy rain (outside ODD, foreseeable) E2; W05 Snow or ice (outside ODD, foreseeable) E2; W06 Fog, visibility below the ODD bound (outside ODD, foreseeable) E1.</desc>
