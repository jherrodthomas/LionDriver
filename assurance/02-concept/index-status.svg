<svg xmlns="http://www.w3.org/2000/svg" width="640" height="626" viewBox="0 0 640 626" role="img" aria-labelledby="t d">
<title id="t">02-concept: work products by gate and status</title>
<desc id="d">Work products of 02-concept from WP-M-00 §3, by the gates they are needed for: WP-C-01 Item definition: G1, Draft; WP-C-02 ODD and intended functionality specification: G1, Draft; WP-C-03 Hazard analysis and risk assessment, safety goals: G1, Draft; WP-C-04 Functional safety concept (FSRs, allocation, AoUs): G1, Draft; WP-C-05 SOTIF hazard identification and risk evaluation, acceptance criteria: G1, Draft; WP-C-06 Functional insufficiencies and triggering conditions analysis: G1, Draft; WP-C-07 Functional modifications addressing SOTIF risk: G1, Draft; WP-C-08 Driver interaction, HMI and reasonably foreseeable misuse analysis: G1, Draft; WP-C-09 Threat analysis and risk assessment (TARA): G1, Draft; WP-C-10 Cybersecurity goals, claims and concept: G1, Draft; WP-C-11 AI system definition and AI safety requirements: G1, Draft; WP-C-12 Item and environment models (reference car data, 3D model, scene library; index, no evidence credit): G1, Draft.</desc>
