.hair { stroke:var(--grid); stroke-width:1; }
.lane { fill:var(--card); }
.s-skel { fill:var(--bg); stroke:var(--ink3); stroke-width:1.4; stroke-dasharray:4 3; }
.s-draft { fill:var(--amb); } .s-rev { fill:var(--amb-bg); stroke:var(--amb); stroke-width:1.6; }
