<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1075" viewBox="0 0 1280 1075" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 7-1. Freedom from interference and independence (WP-S-03 §7)</title>
<desc>WP-S-03 §7 claims. FFI-1: QM SoC sends wrong or excessive commands; required SM-01…08 (partly). FFI-2: QM SoC reconfigures the safety element (mode, param, relay, CAN config); required SM-22 (TSR-512, 513) (partly). FFI-3: QM SoC replaces MCU firmware via BOOT0/NRST or softloader; required TSR-511 (not met). FFI-4: QM SoC corrupts MCU memory through malformed SPI transfers; required SM-14 bounds checks, SM-21 MPU (not met). FFI-5: QM SoC timing faults (hang, frozen loop); required SM-12, SM-13 (partly). FFI-6: Comms ISRs on the MCU starve safety processing; required interrupt-rate monitors with reaction, SM-15 with logical checkpoint (partly). DFA-1: Shared power supply of SoC and MCU; required SM-19, de-energise-to-safe relay (AP-4) (not analysed). DFA-2: Shared PCB, enclosure, thermal environment; required SM-15, TSR-509 (partly). DFA-3: Shared speaker/codec between SoC audio and MCU siren; required TSR-516 analysis (not analysed). DFA-4: Driver and envelope both rely on PCM cruise state; required AOU-03R (brake works mechanically), TSR-405(b) (partly). IND-1: (Fallback, FSC §4.3) second limiter independent of E-03; required not present (not present).</desc>
