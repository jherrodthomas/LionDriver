<g class="terms">
<text x="40" y="962" font-size="10.5" fill="#475569">Terms: AOU-nn assumption of use (WP-C-01 §7); an R suffix marks the FSC's refined version · AP-nn attack path (TARA §5); in WP-S-03 and on the TSC page, an architectural principle (WP-S-03 §2) · ASIL Automotive</text>
<text x="40" y="976.5" font-size="10.5" fill="#475569">Safety Integrity Level, A (lowest) to D (highest), from ISO 26262 · CAN controller area network: the vehicle's data bus · DFA dependent failure analysis · E-nn element of the item (WP-C-01 §3.1), E-01…E-06 · FFI</text>
<text x="40" y="991" font-size="10.5" fill="#475569">freedom from interference · FSC functional safety concept · GAP-nn gap found by the gap assessment · IND-nn independence claim (WP-S-03 §7) · ISR interrupt service routine · IWDG independent watchdog of the MCU ·</text>
<text x="40" y="1005.5" font-size="10.5" fill="#475569">MCU microcontroller: the panda safety processor (STM32H7) · MPU memory protection unit · NF-nn finding of the onboard code review · NRST the MCU's reset line (BOOT0 is its boot-mode line) · PCB printed circuit board</text>
<text x="40" y="1020" font-size="10.5" fill="#475569">· PCM powertrain control module (engine and drive) · QM quality managed: no ASIL; ordinary quality processes suffice · SM-nn safety mechanism (TSC §6) · SoC system on chip: the comma device's main processor, running</text>
<text x="40" y="1034.5" font-size="10.5" fill="#475569">openpilot (QM) · SPI serial peripheral interface (the link between SoC and MCU) · TSR-nn technical safety requirement (WP-S-02) · WCET worst-case execution time · WP-nn work product, e.g. WP-C-04; the letter is its</text>
<text x="40" y="1049" font-size="10.5" fill="#475569">area (M management, C concept, S system, H hardware, W software, V validation, P processes, A analyses, O operation, K safety case)</text>
</g>
