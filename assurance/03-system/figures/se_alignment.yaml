# Systems engineering alignment of the system folder (03-system) with the INCOSE Systems Engineering Handbook
# (5th ed., 2023; its technical processes are those of ISO/IEC/IEEE 15288) and the NASA Systems Engineering Handbook
# (NASA/SP-2016-6105 Rev 2; the 17 common technical processes of NPR 7123.1, "the SE engine"). Informative: ISO 26262
# and ASPICE govern LionDriver; the handbooks are guidance, and nothing here claims compliance with either.
#
# fig_s00_se.py draws the Vee (figures/fig-s00-1-se-vee.svg) and the README section (figures/index-section.md) from this file, and checks every
# WP ID against the WP-M-00 register and every path against the files on disk.
#
#   stages      the Vee, left arm top-down, then the bottom, then the right arm bottom-up, then transition
#     side      left, bottom, right or top (transition, after validation)
#     incose    15288 technical processes the stage covers
#     nasa      SE-engine process numbers (1-9 here; 10-17 are technical management below)
#     aspice    the ASPICE level of the trace V (assurance/trace) at the same place
#     wps       LionDriver work products: WP IDs; 'folder:<name>' for a whole folder
#   pairs       left stage, right stage, label: each right stage checks its left counterpart
#   management  NASA processes 10-17 and where LionDriver keeps them
#   incose_management  the 15288 technical management processes and the NASA process that covers the same ground
#   gates       LionDriver gate (WP-M-00 §2) and the nearest NASA life-cycle review (informative)
#   views       system-level views both handbooks expect; status present, partial or missing, with where
schema_version: 1

stages:
  - id: needs
    title: Stakeholder needs and requirements
    side: left
    incose: [Business or mission analysis, Stakeholder needs and requirements definition]
    nasa: [1]
    aspice: SYS.1
    wps: [WP-C-01, WP-C-02, WP-C-03, WP-C-05, WP-C-08, WP-C-09, WP-S-01]
  - id: sysreq
    title: System requirements
    side: left
    incose: [System requirements definition]
    nasa: [2]
    aspice: SYS.2
    wps: [WP-S-01, WP-S-02, WP-S-06, WP-S-07, WP-C-04, WP-C-10]
  - id: arch
    title: Architecture, design and analysis
    side: left
    incose: [System architecture definition, Design definition, System analysis]
    nasa: [3, 4]
    aspice: SYS.3
    wps: [WP-S-03, WP-S-05, WP-S-04, WP-S-07, "folder:08-analyses"]
  - id: impl
    title: Implementation
    side: bottom
    incose: [Implementation]
    nasa: [5]
    aspice: SWE, HWE, MLE
    wps: ["folder:04-hardware", "folder:05-software"]
  - id: integ
    title: Integration
    side: right
    incose: [Integration]
    nasa: [6]
    aspice: SYS.4
    wps: [WP-S-08, WP-V-05]
  - id: verif
    title: Verification
    side: right
    incose: [Verification]
    nasa: [7]
    aspice: SYS.5
    wps: [WP-S-09]
  - id: valid
    title: Validation
    side: right
    incose: [Validation]
    nasa: [8]
    aspice: VAL.1
    wps: [WP-V-01, WP-V-02, WP-V-03, WP-V-04, WP-V-06]
  - id: transition
    title: Transition, operation, maintenance, disposal
    side: top
    incose: [Transition, Operation, Maintenance, Disposal]
    nasa: [9]
    aspice: "—"
    wps: [WP-S-06, WP-K-06, WP-O-01, WP-O-02, WP-O-04, WP-O-05]

pairs:
  - [needs, valid, "validated against"]
  - [sysreq, verif, "verified against (VCRM)"]
  - [arch, integ, "integration verified against"]

management:
  - {nasa: 10, name: Technical planning, wps: [WP-M-01, WP-M-02, WP-M-03]}
  - {nasa: 11, name: Requirements management, wps: [WP-P-06], paths: [trace/README.md]}
  - {nasa: 12, name: Interface management, wps: [WP-S-03, WP-S-05, WP-M-11]}
  - {nasa: 13, name: Technical risk management, wps: [WP-M-07]}
  - {nasa: 14, name: Configuration management, wps: [WP-P-01, WP-P-02]}
  - {nasa: 15, name: Technical data management, wps: [WP-P-04]}
  - {nasa: 16, name: Technical assessment, wps: [WP-P-05, WP-M-06, WP-M-00]}
  - {nasa: 17, name: Decision analysis, paths: [01-management/decisions/README.md]}

incose_management:
  - {name: Project planning, nasa: [10]}
  - {name: Project assessment and control, nasa: [16]}
  - {name: Decision management, nasa: [17]}
  - {name: Risk management, nasa: [13]}
  - {name: Configuration management, nasa: [14]}
  - {name: Information management, nasa: [15]}
  - {name: Measurement, nasa: [16]}
  - {name: Quality assurance, wps: [WP-M-05]}

gates:
  - {gate: G0, review: "—"}
  - {gate: G1, review: "MCR, SRR"}
  - {gate: G2, review: "SDR, PDR"}
  - {gate: G3, review: CDR}
  - {gate: G4, review: "SIR, TRR"}
  - {gate: G5, review: "SAR, ORR"}
  - {gate: G6, review: PLAR}

views:
  - name: Context diagram and operational concept
    status: partial
    where:
      - {path: 02-concept/figures/fig-3-2-item-boundary.svg, label: "item boundary (WP-C-01 §3.3)"}
      - {path: 02-concept/figures/fig-c02-3-1-odd-taxonomy.svg, label: "ODD (WP-C-02 §3.1)"}
      - {path: models/sysml/generated/fig-sysml-v01-item-context.svg, label: "SysML context view"}
    gap: no stand-alone concept of operations; operational situations are listed in WP-C-03 §3
  - name: Stakeholder needs
    status: present
    where:
      - {path: 03-system/WP-S-01-system-requirements.md, label: "stakeholders, needs and use cases (WP-S-01 §1.2–§1.4)"}
      - {path: models/sysml/generated/fig-sysml-v14-needs-use-cases.svg, label: "needs and use cases (SysML V-14)"}
      - {path: 02-concept/WP-C-03-hara.md, label: "safety goals (WP-C-03 §6)"}
    gap: the needs and use cases are AI-drafted and not reviewed; no regulator needs beyond WP-C-01 §5
  - name: System requirements with method, rationale and allocation
    status: partial
    where:
      - {path: 03-system/WP-S-01-system-requirements.md, label: "WP-S-01"}
      - {path: 03-system/WP-S-02-technical-safety-requirements.md, label: "WP-S-02"}
      - {path: 03-system/requirements/README.md, label: "requirements at a glance"}
