<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="735" viewBox="0 0 1280 735" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Figure 2-1. Hardware-software interfaces of the safety MCU (WP-S-05 §2)</title>
<desc id="d">The safety MCU (STM32H7, E-04a hardware running the E-03 firmware, ASIL C) and its 14 hardware-software interfaces from WP-S-05 §2. HSI-01 SoC ↔ MCU SPI link, C, TSR-407…413; HWSR-401. HSI-02 Control requests over SPI endpoint 0, C, TSR-407, 409, 511…513. HSI-03 CAN packet stream over SPI endpoints 1/3, C, TSR-410, 411. HSI-04 FDCAN1–3 and transceivers, C, TSR-401…406, 508, 704, 707; HWSR-508. HSI-05 Harness relay drive, C / B, TSR-506, 706; HWSR-506. HSI-06 Harness orientation sense, B, TSR-701; HWSR-701. HSI-07 Ignition line, B, TSR-510; HWSR-510. HSI-08 Reset / boot pins from SoC, C (+CS), TSR-502, 511; HWSR-502c. HSI-09 Watchdog, C, TSR-501; HWSR-501. HSI-10 Fault / health monitors, C, TSR-502…505, 509. HSI-11 Siren, C, TSR-516. HSI-12 Flash and bootstub, C (+CS), TSR-503, 511, 514. HSI-13 Supply measurement, C, TSR-505; HWSR-505b. HSI-14 MPU, RAM ECC, C, TSR-503, 507.</desc>
