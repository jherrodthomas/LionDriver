<svg xmlns="http://www.w3.org/2000/svg" width="640" height="506" viewBox="0 0 640 506" role="img" aria-labelledby="t d">
<title id="t">03-system: work products by gate and status</title>
<desc id="d">Work products of 03-system from WP-M-00 §3, by the gates they are needed for: WP-S-01 System requirements specification (functional, non-safety): G2, Draft; WP-S-02 Technical safety requirements specification: G2, Draft; WP-S-03 Technical safety concept and system architectural design: G2, Draft; WP-S-04 Timing analysis: FTTI, fault detection and reaction budget: G2, Draft; WP-S-05 Hardware-software interface specification: G2, Draft; WP-S-06 Requirements for production, operation, service and decommissioning: G2, Draft; WP-S-07 Cybersecurity requirements and architectural design: G2, Draft; WP-S-08 System integration and test strategy, specification and report: G4, Draft; WP-S-09 System verification (qualification) specification and report: G4, Draft.</desc>
