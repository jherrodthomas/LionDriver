<title id="t">V-13. System modes · operating modes and actuation authority (SysML v2 view systemModes)</title>
<desc id="d">State machine of the operating modes generated from the SysML v2 model: off, onroad disengaged, the engaged composite state (enabled, overriding, soft disabling), immediate disable and driver lockout, with every transition labelled by the state-machine record transitions it stands for and coloured by who enforces it.</desc>
