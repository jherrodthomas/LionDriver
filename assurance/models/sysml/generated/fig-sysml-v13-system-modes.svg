<text x="54" y="414" font-size="10.5" fill="#334155">pandad puts the panda in</text>
<text x="54" y="428" font-size="10.5" fill="#334155">NO_OUTPUT. A panda found in</text>
<text x="54" y="442" font-size="10.5" fill="#334155">SILENT is also switched to</text>
<text x="54" y="456" font-size="10.5" fill="#334155">NO_OUTPUT</text>
