<text x="40" y="69" font-size="12.5" fill="#64748B">WP-C-01 §4 modes as a SysML v2 state machine; each transition names its record transitions and who enforces it</text>
<text x="1240" y="44" font-size="11" fill="#64748B" text-anchor="end">SysML v2 view LionDriverViews::systemModes</text>
