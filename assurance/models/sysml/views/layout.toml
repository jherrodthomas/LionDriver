# Layout of the SysML views (assurance/models/sysml/model/Views.sysml).
#
# The model decides what a view shows; this file only decides where things go. Every `el`
# must name an element of the model (its short name, alias or path), otherwise rendering
# fails. Boxes are [x, y, width, height] in SVG pixels. A `grid` places the listed elements
# inside a frame in rows. `edge` entries adjust the route of the connection drawn between two
# nodes (`between`); they never add or remove a connection.

# Display names of elements whose declared name does not read well as a title.
[titles]
context = "Vehicle context"
ldsda = "LD-SDA"
socSoftware = "SoC software"
mlModels = "ML models"
safetyFirmware = "Safety MCU firmware"
deviceHardware = "Device hardware"
harness = "Harness"
safetyLayer = "Safety layer"
platformFirmware = "Platform firmware"
roadCameras = "Road cameras"
driverCamera = "Driver camera"
imuGnss = "IMU · GNSS"
soc = "Qualcomm SoC"
dmModel = "DM model"
