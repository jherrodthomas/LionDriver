adc = "ADC"
gpio = "GPIO"
fdcanPeripherals = "FDCAN1–3"
canTransceivers = "CAN transceivers"
memories = "RAM, flash (ECC)"
sirenPath = "DAC, codec siren path"
interceptRelay = "Intercept relay"
safetyMcu = "STM32H7 safety MCU"
restOfDevice = "Rest of the device"
