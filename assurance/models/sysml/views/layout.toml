# ======================================================================= V-01

[views.V-01]
file = "fig-sysml-v01-item-context.svg"
title = "Item context"
subtitle = "LD-SDA, its components E-01 to E-05 and the elements outside the item boundary · interfaces IF-01 to IF-10 at component level"
width = 1440
height = 966
ignore_route = ["ifDevicePower"]
desc = """Context view generated from the SysML v2 model. Inside the item boundary: E-01 SoC software, E-02 ML \
models, E-03 safety MCU firmware, E-04 device hardware and E-05 harness. Outside: the driver and road \
environment (IF-05, IF-06, IF-07), the vehicle CAN with EPS, ECM/PCM, ABS/VSC and cluster (IF-01, IF-02 through \
the harness), the Toyota forward camera (IF-03) and radar, the vehicle supply (IF-08), the untrusted back end \
(IF-09) and the excluded external compute E-06."""

