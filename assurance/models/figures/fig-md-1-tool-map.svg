<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1162" viewBox="0 0 640 1162" role="img" aria-labelledby="t d">
<title id="t">Modelling plan: tools, what they model, and what the output may be used for</title>
<desc id="d">Tool map of the modelling plan. Python → SM-SELFDRIVED record (Exists) → TL-28 TCL2: Envelope design description | Python → Back-to-back test (Exists) → TL-29 TCL1: Envelope verification (no credit) | Python, OpenModelica → HIL plant model (In progress) → TL-30 TCL1 / TCL2: Envelope verification on the bench | Octave → Envelope calculations and plots (Exists) → TL-25 TCL1: None (design support) | SysML v2, Python → Architecture model (Draft) → TL-26 TCL1: None (design description); TL-27 TCL1: None (consistency support and figures) | Python → Fault-propagation model of the SG-02 tree (In progress) → TL-49 TCL1: Analysis support for WP-A-04; no item element | Python → Panda TSRs restated as structured requirements with a temporal meaning; checked against WP-S-02 and the code (In progress) → TL-51 TCL1: Analysis support for WP-S-02; no item element | Python → AUTOSAR description of the existing architecture for OEM/Tier-1 integration (Draft) → TL-61 TCL1: None: a description for OEM/Tier-1 integration; no item element, no evidence. Rule: No model output is verification evidence until the tool that produced it is classified at the confidence level the evidence needs (WP-P-07 §5) and the result has been reviewed.</desc>
