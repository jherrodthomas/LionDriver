# TE-03 pilot: panda TSRs of WP-S-02 restated in FRETish (NASA FRET, Requirement.g4 at FRET cf0f913).
#
# Source of record: assurance/03-system/WP-S-02-technical-safety-requirements.md. Each entry quotes the TSR text
# it restates (`source`, verbatim, checked in CI); a changed TSR fails the build until the FRETish is reviewed.
# Time is in ticks of the panda safety task: 1 tick = 10 ms (100 Hz, SAFETY_TASK_FREQ). Component: envelope.
# The FRETish is AI-drafted and not yet parsed or formalised by FRET (TE-03 OI-1); `check_fretish.py` checks its
# shape against the grammar, the glossary and the source quotes only.

glossary:
  - {name: lka_frame_rx, type: bool, meaning: "a STEERING_LKA (0x2E4) frame from the SoC is in the TX hook this tick", code: "opendbc safety/modes/toyota.h tx hook, 0x2E4 branch"}
  - {name: steer_torque_cmd, type: int, unit: raw, meaning: "STEER_TORQUE_CMD of that frame", code: "desired_torque, toyota.h"}
  - {name: tau_max, type: int, unit: raw, meaning: "torque bound of TSR-102; baseline 1500", code: "TOYOTA_TORQUE_STEERING_LIMITS.max_torque"}
  - {name: lka_frame_rejected, type: bool, meaning: "the envelope does not forward the frame (tx = false)", code: "toyota.h tx hook"}
  - {name: torque_last_accepted, type: int, unit: raw, meaning: "STEER_TORQUE_CMD of the last accepted 0x2E4 frame (TSR-103 wording)", code: "desired_torque_last, safety/lateral.h; reset to 0 after a rejection"}
  - {name: delta_up, type: int, unit: raw, meaning: "TSR-103 increase bound; baseline 15 per frame", code: "max_rate_up"}
  - {name: delta_down, type: int, unit: raw, meaning: "TSR-103 decrease bound; baseline 25 per frame", code: "max_rate_down"}
  - {name: torque_rt_reference, type: int, unit: raw, meaning: "torque at the start of the current 250 ms window", code: "rt_torque_last, lateral.h"}
  - {name: delta_rt, type: int, unit: raw, meaning: "TSR-103 window bound; baseline 450 per 250 ms", code: "max_rt_delta"}
  - {name: lat_authority, type: bool, meaning: "lateral authority granted", code: "controls_allowed"}
  - {name: eps_lka_fault, type: bool, meaning: "LKA_STATE of EPS_STATUS (0x262) is in the fault set", code: "safety_eps_fault, toyota.h"}
  - {name: eps_status_timeout, type: bool, meaning: "0x262 missing beyond its RX timeout (TSR-401)", code: "RX check of 0x262"}
  - {name: cause_reported, type: bool, meaning: "the revocation cause is reported to the SoC", code: "pandaState fields"}
  - {name: car_safety_mode, type: mode, meaning: "the envelope runs a car safety mode (not SILENT, not NO_OUTPUT)", code: "current_safety_mode"}
  - {name: heartbeat_rx, type: bool, meaning: "a SoC heartbeat (0xf3) arrives this tick", code: "heartbeat_monitor.h"}
  - {name: authority_any, type: bool, meaning: "any actuation authority granted (lateral or longitudinal)", code: "controls_allowed"}
  - {name: authority_granted, type: bool, meaning: "actuation authority granted", code: "controls_allowed"}
  - {name: hb_engaged, type: bool, meaning: "the engaged flag of the last SoC heartbeat received", code: "heartbeat_engaged, main.c"}
  - {name: hb_loss_detected, type: bool, meaning: "the TSR-407 heartbeat monitor detects the loss this tick", code: "heartbeat_revoke, main.c"}
  - {name: siren_on, type: bool, meaning: "the panda siren output is driven", code: "current_board->set_siren, main.c"}
  - {name: envelope_revoked, type: bool, meaning: "the envelope ends granted authority this tick", code: "controls_allowed true -> false"}
  - {name: revoke_cause_listed, type: bool, meaning: "the cause is one listed in TSR-516(b): missing command frames, RX fault, EPS fault state, rejected command, TX failure or bus-off, platform fault", code: "safety_tx_arrival_revoked, RX checks, safety_eps_fault, tx violations, bus-off, fault_status"}
  - {name: not_engaged_ticks, type: int, unit: tick, meaning: "ticks since the heartbeat first reported not engaged while authority was granted; 0 when the heartbeat reports engaged", code: "engaged_mismatch_ticks, drivers/engaged_mismatch.h"}
  - {name: pcm_cruise_active, type: bool, meaning: "PCM cruise state reports active", code: "cruise_engaged_prev"}

requirements:
  - id: FR-101
    tsr: TSR-101
    source: "The envelope shall reject every STEERING_LKA (`0x2E4`) frame whose STEER_TORQUE_CMD magnitude exceeds the torque bound τ_max(v) of TSR-102."
    fretish: "whenever lka_frame_rx & absReal(steer_torque_cmd) > tau_max the envelope shall immediately satisfy lka_frame_rejected"
    findings: []
  - id: FR-103a
    tsr: TSR-103
    source: "The envelope shall reject `0x2E4` frames whose torque increases in magnitude by more than Δ_up"
    fretish: "whenever lka_frame_rx & absReal(steer_torque_cmd) - absReal(torque_last_accepted) > delta_up the envelope shall immediately satisfy lka_frame_rejected"
    findings: [FF-01]
  - id: FR-103b
    tsr: TSR-103
    source: "or decreases by more than Δ_down, relative to the last accepted frame"
    fretish: "whenever lka_frame_rx & absReal(torque_last_accepted) - absReal(steer_torque_cmd) > delta_down the envelope shall immediately satisfy lka_frame_rejected"
    findings: [FF-01]
  - id: FR-103c
    tsr: TSR-103
    source: "or that change by more than Δ_rt within any 250 ms window"
    fretish: "whenever lka_frame_rx & absReal(steer_torque_cmd - torque_rt_reference) > delta_rt the envelope shall immediately satisfy lka_frame_rejected"
    findings: [FF-02]
  - id: FR-110
    tsr: TSR-110
    source: "while lateral authority is granted, shall revoke lateral authority and report the cause when LKA_STATE indicates an EPS fault or LKA unavailability, or when EPS_STATUS is missing beyond its timeout (TSR-401)"
    fretish: "whenever lat_authority & (eps_lka_fault | eps_status_timeout) the envelope shall within 10 ticks satisfy !lat_authority & cause_reported"
    findings: []
  - id: FR-307a
    tsr: TSR-307
    source: "(a) The envelope shall revoke authority when the SoC heartbeat reports \"not engaged\" while authority is granted, within ≤ 0.3 s."
    fretish: "upon authority_granted & !hb_engaged the envelope shall within 30 ticks satisfy !authority_granted"
    findings: [FF-03]
  - id: FR-407
    tsr: TSR-407
    source: "In a car safety mode, the envelope shall detect absence of the SoC heartbeat (`0xf3`) for > 0.3 s and then revoke all actuation authority at once (SS-L, SS-G)."
    fretish: "in car_safety_mode mode, whenever persisted(31, !heartbeat_rx) the envelope shall within 10 ticks satisfy !authority_any"
    findings: []
  - id: FR-516a1
    tsr: TSR-516
    source: "(a) the SoC heartbeat is lost (TSR-407) while authority is granted"
    fretish: "upon hb_loss_detected & preBool(false, authority_granted) the envelope shall within 50 ticks satisfy siren_on"
    findings: [FF-05]
  - id: FR-516a2
    tsr: TSR-516
    source: "if authority ended within the 5 s before the loss, a warning within ≤ 5 s of the loss is sufficient"
    fretish: "upon hb_loss_detected & !preBool(false, authority_granted) & occurred(500, authority_granted) the envelope shall within 500 ticks satisfy siren_on"
    findings: [FF-05]
  - id: FR-516b
    tsr: TSR-516
    source: "(b) the envelope revokes authority while it is granted for any reason other than a driver action that the envelope itself observes"
    fretish: "upon envelope_revoked & revoke_cause_listed the envelope shall within 50 ticks satisfy siren_on"
    findings: [FF-04, FF-05]
  - id: FR-516c
    tsr: TSR-516
    source: "(c) PCM cruise is still active more than 0.5 s after the SoC heartbeat first reported \"not engaged\""
    fretish: "upon not_engaged_ticks > 50 & pcm_cruise_active the envelope shall within 50 ticks satisfy siren_on"
    findings: [FF-05, FF-06]

findings:
  - id: FF-01
    tsr: TSR-103
    kind: text differs from code
    summary: >-
      TSR-103 says a frame is rejected when its torque decreases in magnitude by more than Δ_down. The code never
      rejects a move toward zero: the lowest and highest allowed values are SAFETY_MIN(last, 0) - Δ_up and
      SAFETY_MAX(last, 0) + Δ_up, so 500 raw to 0 in one frame passes, and so does a sign change of up to Δ_up past
      zero. Δ_down (25) is instead the least descent the code demands once the command exceeds the measured EPS
      torque by Δ_meas (dist_to_meas_check), which is TSR-104's job. After a rejection the reference is reset to 0,
      not the last accepted frame.
    evidence: "opendbc_repo/opendbc/safety/lateral.h dist_to_meas_check and the reset block (opendbc 4d1a056)"
    route: WP-S-02 owner (reword TSR-103 to the coded rule, or change the code if the text is the intent)
  - id: FF-02
    tsr: TSR-103
    kind: text differs from code
    summary: >-
      "Within any 250 ms window" reads as a sliding window. The code uses windows that restart once more than
      250 ms have passed (MAX_RT_INTERVAL) and measures against the torque at the window start. Not binding at the
      baseline: 15 raw per frame at 100 Hz allows at most 375 raw in 250 ms, below Δ_rt = 450.
    evidence: "lateral.h rt_torque_rate_limit_check and the ts_torque_check_last update"
    route: WP-S-02 owner (state the window rule)
  - id: FF-03
    tsr: TSR-307
    kind: text differs from code
    summary: >-
      TSR-307(a) asks for revocation whenever the heartbeat reports "not engaged" while authority is granted. The
      code revokes only if the report persists: an "engaged" heartbeat before the 0.3 s mark ends the episode
      without a revocation. Either the requirement should say "continuously for 0.3 s" (a debounce) or a single
      not-engaged heartbeat is a gap.
    evidence: "panda/board/drivers/engaged_mismatch.h engaged_mismatch_tick (panda f4803c5)"
    route: WP-S-02 owner
  - id: FF-04
    tsr: TSR-516
    kind: requirement inconsistent with itself
    summary: >-
      TSR-516 demands the siren ≤ 0.5 s after detection, and for (b) on an EPS fault defines detection as the first
      fault frame. Its next sentence allows a persistence filter of up to 0.7 s. Read literally, the EPS-fault siren
      must sound ≤ 0.5 s after the first fault frame, and the reference build (≤ 0.96 s, WP-S-04 T-28) violates it.
      The intent (DQ-048: siren within the SG-02 1 s budget from onset) needs the EPS clause to replace the 0.5 s
      bound, not sit beside it.
    evidence: "WP-S-02 TSR-516 text; WP-S-04 T-28"
    route: WP-S-02 owner (reword; no decision needed, DQ-048 already sets the intent)
  - id: FF-05
    tsr: TSR-516
    kind: not checkable as written
    summary: >-
      TSR-516 says when the siren shall start but not how long it sounds or how loud it is. Formally, a single
      10 ms pulse satisfies "sound within 0.5 s". The code sounds 3 s for a heartbeat loss and holds the other
      triggers while their condition lasts. A minimum duration (or "until the driver acts") makes the requirement
      testable; loudness parallels BE-2.13 (no defined minimum volume).
    evidence: "panda/board/main.c siren_countdown, heartbeat_siren.h, eps_fault_siren.h"
    route: WP-S-02 owner
  - id: FF-06
    tsr: TSR-516
    kind: boundary
    summary: >-
      (c) guards ordinary disengagements by requiring PCM cruise to be active "more than 0.5 s" after the first
      not-engaged heartbeat. The code fires at the 50th tick of the episode, which starts at 1, so 0.49 s after the
      first such heartbeat. The guard is 10 ms shorter than written. It errs toward warning.
    evidence: "engaged_mismatch.h ENGAGED_MISMATCH_SIREN_TICKS"
    route: WP-S-02 owner (minor)
