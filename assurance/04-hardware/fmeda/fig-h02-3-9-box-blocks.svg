<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1232" viewBox="0 0 640 1232" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 3-9. Harness box v3: functional blocks</title>
<desc>Blocks: B1 Box supply and protection: Supply both switches from the ignition line through D1 (or from comma power on J2), and clamp supply transients above the 16 V stand-off of D4; B2 Switch drive: Hold both switch inputs low through 240 Ω, so that the stock path is selected whenever the device does not drive SBU1; B3 Intercept switch: Join the camera bus to the car bus while undriven (pass-through), and separate them while SBU1 is driven high (intercept), on CAN_H (U1) and CAN_L (U2); B4 Termination in intercept: Terminate the separated camera bus with 60 Ω while intercepting (R7, and R8 through the harness loop of pins 13 and 15); R6 serves cars whose plug loops pins 3 and 5, and is unused with Toyota A; B5 Bus clamps: Clamp the CAN0 and CAN2 lines to box VIN and ground; B6 Ignition sense: Pull SBU2 low through 1 kΩ while the ignition line is on, so that the device reads the ignition; B7 Connectors: Carry the car and camera buses, ignition and ground from the harness plug (J1) and the buses, SBU lines and supply to the device cable (J3)</desc>
