<text x="16" y="681" font-size="10" fill="#475569">reference failure rates for electronic components · T-nn code-derived detection or reaction time (WP-S-04 §4); in</text>
<text x="16" y="695" font-size="10" fill="#475569">WP-M-01 and WP-S-06, a tailoring decision T-01…T-08 (WP-M-01 §5) · UK-nn unknown that WP-H-02 must obtain</text>
<text x="16" y="709" font-size="10" fill="#475569">(UK-01…UK-09, WP-H-02 §5) · WP-nn work product, e.g. WP-C-04; the letter is its area (M management, C concept, S</text>
<text x="16" y="723" font-size="10" fill="#475569">system, H hardware, W software, V validation, P processes, A analyses, O operation, K safety case)</text>
