<svg xmlns="http://www.w3.org/2000/svg" width="640" height="426" viewBox="0 0 640 426" role="img" aria-labelledby="t d">
<title id="t">04-hardware: work products by gate and status</title>
<desc id="d">Work products of 04-hardware from WP-M-00 §3, by the gates they are needed for: WP-H-01 Hardware safety requirements specification: G3, Draft; WP-H-02 Hardware architectural and detailed design (device, panda MCU, harness, relay): G3, Draft; WP-H-03 Hardware safety analysis (FMEA/FMEDA): G3, Draft; WP-H-04 Hardware architectural metrics (SPFM, LFM): G3, Draft; WP-H-05 Evaluation of safety goal violations due to random HW failures (PMHF): G3, Draft; WP-H-06 Hardware integration and verification specification and report: G4, Draft; WP-H-07 Qualification of hardware components (comma device, STM32H7, harness): G3, Draft.</desc>
