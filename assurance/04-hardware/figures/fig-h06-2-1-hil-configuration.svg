<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 2-1. Hardware integration test configuration on the HIL bench (WP-H-06 §2.1)</title>
  <desc id="d">A Linux bench PC runs the test runner (pytest), log capture, Corolla log replay (opendbc safety replay) and fault-injection control. It connects by USB to a panda jungle or 3-bus CAN interface (car, camera, OBD), by USB or GPIO to a programmable power supply (0 to 20 V, slew, dropouts) and by USB to the reference comma device (fixed revision, LionDriver panda firmware and openpilot). The supply feeds 12 V to the Toyota TSS2 harness with its relay box, which is instrumented with a contact state probe and a coil current probe. The device plugs into the harness connector. The jungle connects the car-side and camera-side CAN pairs to the harness. An optional real forward camera can sit on the camera-side bus. Additional instruments: oscilloscope or logic analyser on the relay coil, CAN lines, NRST and BOOT0; thermal chamber or heat gun with thermocouple; SWD probe for fault injection in the debug build only.</desc>
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A16207"/></marker>
    <style>
      .t{fill:#0F172A}.m{fill:#475569}.s{font-size:11px}.xs{font-size:10px}.b{font-weight:700}.sb{font-weight:600}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.2}
      .chip{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1}
      .tag{font-size:10px;font-weight:700;letter-spacing:.04em}
      .lbl{font-size:9.5px;font-weight:600}
    </style>
  </defs>

  <rect width="1120" height="730" fill="#FFFFFF"/>

  <!-- header -->
  <text x="40" y="44" class="t b" font-size="20">Figure 2-1 · HW integration test configuration</text>
  <text x="40" y="66" class="m" font-size="12.5">HIL bench (decision D-04) · reference comma device, harness and relay box in a vehicle-representative CAN environment</text>
  <text x="1080" y="44" class="m s" text-anchor="end">WP-H-06 §2.1</text>
  <line x1="40" y1="82" x2="1080" y2="82" stroke="#E2E8F0"/>

  <!-- bench PC -->
  <rect x="440" y="100" width="380" height="88" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <text x="456" y="122" class="t b" font-size="13">Bench PC (Linux)</text>
  <text x="456" y="139" class="m s">test runner (pytest) · log capture</text>
  <text x="456" y="155" class="m s">Corolla log replay (opendbc / safety replay)</text>
  <text x="456" y="171" class="m s">fault-injection control</text>

  <!-- jungle / CAN interface -->
  <rect x="60" y="250" width="280" height="98" rx="10" class="box"/>
  <text x="76" y="272" class="t b" font-size="13">Panda jungle or CAN I/F</text>
  <text x="76" y="289" class="m s">3 buses: car, camera, OBD</text>
  <text x="76" y="305" class="m s">jungle: harness orientation and</text>
  <text x="76" y="320" class="m s">ignition simulation</text>

  <!-- programmable supply -->
  <rect x="420" y="250" width="240" height="72" rx="10" class="box"/>
  <text x="436" y="272" class="t b" font-size="13">Programmable power supply</text>
  <text x="436" y="289" class="m s">0–20 V · slew · dropouts</text>

  <!-- reference comma device (DUT) -->
  <rect x="740" y="250" width="340" height="98" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.8"/>
  <text x="756" y="272" class="t b" font-size="13">Reference comma device</text>
  <rect x="1012" y="259" width="54" height="18" rx="9" fill="#C2410C"/>
  <text x="1039" y="272" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".05em">DUT</text>
  <text x="756" y="289" class="m s">fixed revision (WP-C-01) · spare for destructive tests</text>
  <text x="756" y="305" class="m s">LionDriver panda FW + openpilot</text>
  <text x="756" y="321" class="m s">release build; fault-injection build separate</text>

  <!-- harness + relay box -->
  <rect x="420" y="430" width="660" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="436" y="452" class="t b" font-size="13">Toyota TSS2 harness + relay box</text>
  <text x="436" y="468" class="m s">harness part of the reference configuration · instrumented</text>
  <rect x="640" y="482" width="180" height="42" rx="7" class="chip"/>
  <text x="730" y="500" class="t sb" font-size="11.5" text-anchor="middle">Contact state probe</text>
  <text x="730" y="515" class="m xs" text-anchor="middle">stock / intercept path</text>
  <rect x="836" y="482" width="180" height="42" rx="7" class="chip"/>
  <text x="926" y="500" class="t sb" font-size="11.5" text-anchor="middle">Coil current probe</text>
  <text x="926" y="515" class="m xs" text-anchor="middle">relay coil drive</text>

  <!-- optional forward camera -->
  <rect x="60" y="560" width="250" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="76" y="581" class="t sb" font-size="12">Forward camera (optional)</text>
  <text x="76" y="597" class="m xs">real camera on the camera-side bus</text>

  <!-- additional instruments -->
  <text x="420" y="580" class="t b" font-size="12">Additional instruments</text>
  <rect x="420" y="592" width="212" height="54" rx="8" class="box"/>
  <text x="434" y="611" class="t sb" font-size="11.5">Oscilloscope / logic analyser</text>
  <text x="434" y="626" class="m xs">relay coil · CAN lines</text>
  <text x="434" y="639" class="m xs">NRST · BOOT0</text>
  <rect x="644" y="592" width="212" height="54" rx="8" class="box"/>
  <text x="658" y="611" class="t sb" font-size="11.5">Thermal</text>
  <text x="658" y="626" class="m xs">thermal chamber, or heat gun</text>
  <text x="658" y="639" class="m xs">+ thermocouple</text>
  <rect x="868" y="592" width="212" height="54" rx="8" class="box"/>
  <text x="882" y="611" class="t sb" font-size="11.5">SWD probe</text>
  <text x="882" y="626" class="m xs">debug build only</text>
  <text x="882" y="639" class="m xs">for fault injection</text>

  <!-- ===== connections ===== -->
  <!-- PC -> jungle (USB) -->
  <path d="M470 188 V214 H200 V248" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <text x="208" y="236" class="m lbl">USB</text>
  <!-- PC -> supply (USB/GPIO) -->
  <path d="M540 188 V248" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <text x="548" y="236" class="m lbl">USB / GPIO</text>
  <!-- PC -> device (USB) -->
  <path d="M790 188 V214 H910 V248" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#aG)"/>
  <text x="918" y="236" class="m lbl">USB</text>

  <!-- supply -> harness 12 V -->
  <path d="M540 322 V428" fill="none" stroke="#A16207" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#aY)"/>
  <text x="548" y="380" fill="#A16207" class="lbl">12 V</text>

  <!-- device <-> harness connector -->
  <path d="M910 350 V428" fill="none" stroke="#C2410C" stroke-width="2.4" marker-start="url(#aR)" marker-end="url(#aR)"/>
  <text x="918" y="380" fill="#C2410C" class="lbl">harness connector</text>
  <text x="918" y="393" class="m" font-size="9.5">CAN · SBU · power</text>

  <!-- jungle CAN pairs -> harness -->
  <path d="M230 350 V470 H418" fill="none" stroke="#C2410C" stroke-width="2.4" marker-start="url(#aR)" marker-end="url(#aR)"/>
  <path d="M170 350 V505 H418" fill="none" stroke="#0F766E" stroke-width="2.4" marker-start="url(#aT)" marker-end="url(#aT)"/>
  <text x="246" y="463" fill="#C2410C" class="lbl">CAN pair · car side</text>
  <text x="246" y="498" fill="#0F766E" class="lbl">CAN pair · camera side</text>
  <!-- optional camera on camera-side bus -->
  <circle cx="290" cy="505" r="3.5" fill="#0F766E"/>
  <path d="M290 508 V558" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="5 3"/>

  <!-- ===== legend ===== -->
  <line x1="40" y1="672" x2="1080" y2="672" stroke="#E2E8F0"/>
  <g transform="translate(40,698)" font-size="10.5">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#475569" stroke-width="1.4"/><text x="36" y="4" class="t">USB / control</text>
    <line x1="140" y1="0" x2="168" y2="0" stroke="#C2410C" stroke-width="2.4"/><text x="176" y="4" class="t">Car-side CAN, harness connector</text>
    <line x1="370" y1="0" x2="398" y2="0" stroke="#0F766E" stroke-width="2.4"/><text x="406" y="4" class="t">Camera-side CAN</text>
    <line x1="520" y1="0" x2="548" y2="0" stroke="#A16207" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/><text x="556" y="4" class="t">Power</text>
    <rect x="616" y="-8" width="28" height="16" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.4"/><text x="652" y="4" class="t">Device under test</text>
    <rect x="772" y="-8" width="28" height="16" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="5 3"/><text x="808" y="4" class="t">Optional</text>
  </g>
</svg>
