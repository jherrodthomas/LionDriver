<text x="60" y="826" font-size="12" fill="#475569">Bar: stuck-at faults found by the test. Diamond: single bit flips (one random cycle each) that changed a result.</text>
<rect x="984" y="198" width="476" height="256" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="1004" y="228" font-size="16" fill="#4F46E5" font-weight="700">Whole core</text>
<text x="1004" y="258" font-size="13" fill="#0F172A">stuck-at faults</text>
<text x="1440" y="258" font-size="14" fill="#0F172A" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">17,862</text>
<text x="1018" y="285" font-size="13" fill="#0F172A">found by the self-test</text>
<text x="1440" y="285" font-size="14" fill="#0F172A" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">16,501</text>
<text x="1018" y="312" font-size="13" fill="#0F172A" font-weight="700">diagnostic coverage</text>
<text x="1440" y="312" font-size="14" fill="#0F172A" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">92.4 %</text>
<text x="1018" y="339" font-size="13" fill="#0F172A">without 94 provably safe faults</text>
<text x="1440" y="339" font-size="14" fill="#0F172A" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">92.9 %</text>
<text x="1004" y="366" font-size="13" fill="#0F172A">bit flips</text>
<text x="1440" y="366" font-size="14" fill="#0F172A" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">2,367</text>
<text x="1018" y="393" font-size="13" fill="#0F172A">that changed a result</text>
<text x="1440" y="393" font-size="14" fill="#0F172A" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">19.3 %</text>
<text x="1004" y="420" font-size="13" fill="#0F172A">simulation time, 4 CPUs</text>
<text x="1440" y="420" font-size="14" fill="#0F172A" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">4.4 min</text>
<rect x="984" y="470" width="476" height="368" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/>
<text x="1004" y="498" font-size="15" fill="#C2410C" font-weight="700">Three runs: each fix came from the missed faults</text>
<text x="1004" y="524" font-size="13" fill="#0F172A" font-weight="700">Run 1: 87.9 %</text>
<text x="1018" y="542" font-size="12" fill="#0F172A">first self-test</text>
<text x="1004" y="566" font-size="13" fill="#0F172A" font-weight="700">Run 2: 91.8 %</text>
<text x="1018" y="584" font-size="12" fill="#0F172A">x31 and IRQ-register patterns; code stubs at every 1&lt;&lt;k;</text>
<text x="1018" y="602" font-size="12" fill="#0F172A">every IRQ line, masking, timer values</text>
<text x="1004" y="626" font-size="13" fill="#0F172A" font-weight="700">Run 3: 92.4 %</text>
<text x="1018" y="644" font-size="12" fill="#0F172A">stubs save a link (upper program-counter bits); illegal</text>
<text x="1018" y="662" font-size="12" fill="#0F172A">instruction, ebreak, ecall trapped</text>
<text x="1004" y="686" font-size="12.5" fill="#0F172A" font-weight="700">What is left, and why:</text>
<text x="1004" y="705" font-size="12.5" fill="#0F172A">• x0's storage and unused coprocessor fields can</text>
<text x="1018" y="724" font-size="12.5" fill="#0F172A">never matter: 94 provably safe faults.</text>
<text x="1004" y="743" font-size="12.5" fill="#0F172A">• End-of-interrupt output: software can't see it.</text>
<text x="1004" y="762" font-size="12.5" fill="#0F172A">• Counter high bits: bit 63 needs millennia to</text>
<text x="1018" y="781" font-size="12.5" fill="#0F172A">become 1 (Part 11 in one minute, 1).</text>
<text x="1004" y="800" font-size="12.5" fill="#0F172A">Bit flips: 19 % change a result; the rest are</text>
<text x="1018" y="819" font-size="12.5" fill="#0F172A">overwritten first. Those need ECC or lockstep.</text>
<rect x="40" y="858" width="1420" height="168" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="60" y="886" font-size="15" fill="#0F172A" font-weight="700">How 'detected' is defined, and the limits</text>
<text x="60" y="912" font-size="12.5" fill="#0F172A">• Detected = the faulty core's memory-bus traffic differs from the fault-free core during the test: a wrong stored result, a wrong address,</text>
<text x="74" y="934" font-size="12.5" fill="#0F172A">a missing or extra access, or a trap. The test stores every result, so a compare against known-good results plus a run-time watchdog sees exactly this.</text>
<text x="60" y="956" font-size="12.5" fill="#0F172A">• Faults outside the test's reach count as undetected even if no program would be affected: the coverage is conservative.</text>
<text x="60" y="978" font-size="12.5" fill="#0F172A">• Two-valued logic, flip-flops start at 0, faults on cell outputs only, one random cycle per bit flip. Runs 1 and 2 used earlier versions of the self-test.</text>
<text x="60" y="1000" font-size="12.5" fill="#0F172A">• An open RISC-V core, not the STM32's Cortex-M7: this shows how a self-test is graded. It is a method demonstration, not LionDriver evidence.</text>
<text x="40" y="1050" font-size="11" fill="#94A3B8">Simulation: our bit-parallel gate simulator over the liberty cell functions (flow/gatesim.py); self-test, ISA model and scoring in flow/.</text>
<g class="terms">
<text x="40" y="1074" font-size="10.5" fill="#475569">Terms: ALU arithmetic logic unit: the part of a processor that adds, compares and shifts · CPU central processing unit: a processor core · ECC error-correcting code (memory) · FF flip-flop: a one-bit storage cell clocked by the processor clock · IRQ</text>
<text x="40" y="1088.5" font-size="10.5" fill="#475569">interrupt request · ISA instruction-set architecture; an ISA model runs a program instruction by instruction to give the expected results · ISO International Organization for Standardization · RISC-V an open instruction-set architecture; PicoRV32 is an</text>
<text x="40" y="1103" font-size="10.5" fill="#475569">open-source RISC-V core · WP-nn work product, e.g. WP-C-04; the letter is its area (M management, C concept, S system, H hardware, W software, V validation, P processes, A analyses, O operation, K safety case)</text>
</g>
</svg>
