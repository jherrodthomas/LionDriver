<text x="224.4" y="215" font-size="11" fill="#475569" text-anchor="middle">compare</text>
<rect x="295.2" y="198" width="129.6" height="26" rx="13" fill="#C2410C" stroke="#C2410C" stroke-width="1"/>
<text x="360" y="215" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">catch</text>
<rect x="430.8" y="198" width="129.6" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="495.6" y="215" font-size="11" fill="#475569" text-anchor="middle">blind spot</text>
<rect x="566.4" y="198" width="129.6" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="631.2" y="215" font-size="11" fill="#475569" text-anchor="middle">cost</text>
<rect x="24" y="242" width="672" height="250" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="44" y="270" font-size="14" fill="#0F172A" font-weight="700">a torque limiter running on two cores</text>
<rect x="44" y="334" width="90" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="89" y="356" font-size="12" fill="#0F172A" font-weight="600" text-anchor="middle">sensor</text>
<text x="89" y="372" font-size="12" fill="#0F172A" font-weight="600" text-anchor="middle">inputs</text>
