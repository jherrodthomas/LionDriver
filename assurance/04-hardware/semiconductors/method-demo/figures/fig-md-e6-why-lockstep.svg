<text x="255" y="356" font-size="11" fill="#D2553F" font-weight="700" text-anchor="middle">fault inside</text>
<rect x="180" y="382" width="150" height="80" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
<text x="255" y="414" font-size="15" fill="#4F46E5" font-weight="700" text-anchor="middle">core B</text>
<text x="255" y="434" font-size="12" fill="#475569" text-anchor="middle">PicoRV32</text>
