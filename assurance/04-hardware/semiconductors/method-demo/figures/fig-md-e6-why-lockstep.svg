<rect x="544" y="414" width="128" height="44" rx="8" fill="#FEF2F2" stroke="#D2553F" stroke-width="1"/>
<text x="608" y="441" font-size="12" fill="#D2553F" font-weight="700" text-anchor="middle">stop: mismatch</text>
<text x="44" y="478" font-size="11" fill="#475569">In simulation core B is the fault-free copy; the comparator watches all core outputs.</text>
<text x="132" y="528" font-size="12" fill="#475569" text-anchor="middle">wrong commands caught first</text>
<text x="132" y="572" font-size="40" fill="#2E9E6A" font-weight="800" text-anchor="middle">100 %</text>
<text x="132" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">6,537 of 6,537 faults</text>
<text x="132" y="614" font-size="11" fill="#475569" text-anchor="middle">median 105 cycles before the write</text>
<text x="360" y="528" font-size="12" fill="#475569" text-anchor="middle">a bit flip is caught</text>
<text x="360" y="572" font-size="40" fill="#4F46E5" font-weight="800" text-anchor="middle">7</text>
<text x="360" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">cycles, median</text>
<text x="360" y="614" font-size="11" fill="#475569" text-anchor="middle">after it happens, when seen</text>
<text x="588" y="528" font-size="12" fill="#475569" text-anchor="middle">area cost</text>
<text x="588" y="572" font-size="40" fill="#C2410C" font-weight="800" text-anchor="middle">×2.04</text>
<text x="588" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">of one core</text>
<text x="588" y="614" font-size="11" fill="#475569" text-anchor="middle">two cores + comparator</text>
<text x="24" y="646" font-size="13" fill="#0F172A" font-weight="700">blind spot 1: logic the program never uses stays silent</text>
<text x="24" y="664" font-size="11" fill="#475569">stuck-at faults that reach an output during this application</text>
<text x="180" y="689" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">Load / store</text>
<rect x="190" y="678" width="372.5" height="14" rx="2" fill="#D97706" stroke="none" stroke-width="0"/>
<text x="568.5" y="690" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">81 %</text>
<text x="180" y="713" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">Decoder</text>
<rect x="190" y="702" width="368.1" height="14" rx="2" fill="#D97706" stroke="none" stroke-width="0"/>
<text x="564.1" y="714" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">80 %</text>
<text x="180" y="737" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">ALU + execute</text>
<rect x="190" y="726" width="354.5" height="14" rx="2" fill="#D97706" stroke="none" stroke-width="0"/>
<text x="550.5" y="738" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">77 %</text>
<text x="180" y="761" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">Control</text>
<rect x="190" y="750" width="331.6" height="14" rx="2" fill="#D97706" stroke="none" stroke-width="0"/>
<text x="527.6" y="762" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">72 %</text>
<text x="180" y="785" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">Program counter</text>
<rect x="190" y="774" width="286.9" height="14" rx="2" fill="#D97706" stroke="none" stroke-width="0"/>
<text x="482.9" y="786" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">62 %</text>
<text x="180" y="809" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">Multiplier</text>
<rect x="190" y="798" width="230.3" height="14" rx="2" fill="#D97706" stroke="none" stroke-width="0"/>
<text x="426.3" y="810" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">50 %</text>
<text x="180" y="833" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">Register file</text>
<rect x="190" y="822" width="173.1" height="14" rx="2" fill="#D2553F" stroke="none" stroke-width="0"/>
<text x="369.1" y="834" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">38 %</text>
<text x="180" y="857" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">IRQ + timer</text>
<rect x="190" y="846" width="107.2" height="14" rx="2" fill="#D2553F" stroke="none" stroke-width="0"/>
<text x="303.2" y="858" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">23 %</text>
<text x="180" y="881" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">Divider</text>
<rect x="190" y="870" width="4.6" height="14" rx="2" fill="#D2553F" stroke="none" stroke-width="0"/>
<text x="200.6" y="882" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1 %</text>
<text x="180" y="905" font-size="12" fill="#0F172A" font-weight="600" text-anchor="end">Counters</text>
<rect x="190" y="894" width="4.4" height="14" rx="2" fill="#D2553F" stroke="none" stroke-width="0"/>
<text x="200.4" y="906" font-size="11" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1 %</text>
<text x="24" y="930" font-size="12" fill="#0F172A">The limiter never divides, so a broken divider is invisible until the day it is used.</text>
<text x="24" y="948" font-size="12" fill="#0F172A" font-weight="600">That is why a start-up self-test still runs on a lockstep core.</text>
<rect x="24" y="970" width="672" height="154" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/>
<text x="44" y="996" font-size="14" fill="#C2410C" font-weight="700">blind spot 2: one glitch that hits both cores the same way</text>
<text x="44" y="1020" font-size="12" fill="#0F172A">Same flip-flop flipped in both cores at the same cycle (2,367 glitches,</text>
<text x="44" y="1038" font-size="12" fill="#0F172A" font-weight="700">289 of them sent a wrong command): plain lockstep caught 0.</text>
<text x="44" y="1060" font-size="12" fill="#0F172A">Checker 2 cycles behind (delayed lockstep): caught 373 glitches,</text>
<text x="44" y="1078" font-size="12" fill="#D97706" font-weight="700">including 80 of the 289 wrong commands.</text>
<text x="44" y="1100" font-size="12" fill="#0F172A">A value that doesn't change in those 2 cycles is corrupted the same way in</text>
<text x="44" y="1116" font-size="12" fill="#0F172A">both cores. Real designs add physical separation and diverse clocking too.</text>
<text x="360" y="1158" font-size="16" fill="#0F172A" font-weight="700" text-anchor="middle">Two cores catch what one can't see, except what hits both alike.</text>
<text x="360" y="1184" font-size="11" fill="#94A3B8" text-anchor="middle">PicoRV32; 20,229 faults in one core while a 64-sample torque limiter runs (8,027 cycles).</text>
<text x="360" y="1201" font-size="11" fill="#94A3B8" text-anchor="middle">Lockstep area from synthesising two cores and a comparator (flow/lockstep_top.v).</text>
<g class="terms">
<text x="24" y="1230" font-size="10.5" fill="#475569">Terms: ALU arithmetic logic unit: the part of a processor that adds, compares and shifts · CPU central processing unit:</text>
<text x="24" y="1244.5" font-size="10.5" fill="#475569">a processor core · IRQ interrupt request</text>
</g>
