<title>Part 11 in one minute 6 · lockstep</title>
<desc>Lockstep caught all 6,537 faults that sent a wrong command, a median 105 cycles early; area ×2.04; plain lockstep missed all 289 common-cause wrong commands, delayed lockstep caught 80.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="720" height="1275" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<rect x="24" y="22" width="236" height="30" rx="15" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="142" y="42" font-size="12" fill="#4F46E5" font-weight="700" text-anchor="middle">PART 11 IN ONE MINUTE · 6</text>
<text x="360" y="92" font-size="30" fill="#0F172A" font-weight="800" text-anchor="middle">Why run two CPUs to do</text>
<text x="360" y="130" font-size="30" fill="#0F172A" font-weight="800" text-anchor="middle">the work of one?</text>
<text x="360" y="170" font-size="15" fill="#475569" text-anchor="middle">lockstep: same inputs, compare every output, every cycle</text>
<rect x="24" y="198" width="129.6" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="88.8" y="215" font-size="11" fill="#475569" text-anchor="middle">copy</text>
