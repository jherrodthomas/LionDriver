<text x="440" y="408" font-size="10" fill="#C2410C" text-anchor="middle">every cycle</text>
<line x1="332" y1="326" x2="400.6" y2="372.9" stroke="#475569" stroke-width="1.6"/>
<path d="M408,378 L398,376.6 L403.1,369.2 Z" fill="#475569"/>
