<text x="360" y="354" font-size="12" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">mem[...] =</text>
<text x="360" y="372" font-size="12" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">13</text>
<line x1="418.6" y1="347" x2="421.6" y2="347" stroke="#475569" stroke-width="1.6"/>
<path d="M430.6,347 L421.6,351.5 L421.6,342.5 Z" fill="#475569"/>
<rect x="431.6" y="292" width="115.2" height="110" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
