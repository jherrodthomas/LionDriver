<text x="180" y="861" font-size="13" fill="#0F172A" font-weight="600" text-anchor="end">Decoder</text>
<rect x="190" y="848" width="413" height="9" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
