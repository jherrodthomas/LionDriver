<text x="230.8" y="372" font-size="12" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">13</text>
<line x1="289.4" y1="347" x2="292.4" y2="347" stroke="#475569" stroke-width="1.6"/>
