<rect x="560.8" y="292" width="115.2" height="110" rx="10" fill="#ECFDF5" stroke="#2E9E6A" stroke-width="1.5"/>
<text x="618.4" y="326" font-size="13" fill="#2E9E6A" font-weight="700" text-anchor="middle">caught</text>
<text x="618.4" y="354" font-size="12" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">detected</text>
<text x="44" y="434" font-size="12" fill="#475569">The test stores every result. A fault that changes any result, address</text>
<text x="44" y="454" font-size="12" fill="#475569">or timing is visible; a compare plus a watchdog would catch it.</text>
<text x="44" y="474" font-size="12" fill="#475569">Thousands of faulty copies run side by side in one simulation.</text>
<text x="132" y="528" font-size="12" fill="#475569" text-anchor="middle">faults simulated</text>
<text x="132" y="572" font-size="40" fill="#4F46E5" font-weight="800" text-anchor="middle">20,229</text>
<text x="132" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">one per run</text>
<text x="132" y="614" font-size="11" fill="#475569" text-anchor="middle">cells × 2 + one flip per FF</text>
<text x="360" y="528" font-size="12" fill="#475569" text-anchor="middle">found by the test</text>
<text x="360" y="572" font-size="40" fill="#2E9E6A" font-weight="800" text-anchor="middle">92.4 %</text>
<text x="360" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">of stuck-at faults</text>
<text x="360" y="614" font-size="11" fill="#475569" text-anchor="middle">run 1: 87.9 %</text>
<text x="588" y="528" font-size="12" fill="#475569" text-anchor="middle">campaign time</text>
<text x="588" y="572" font-size="40" fill="#C2410C" font-weight="800" text-anchor="middle">4.4</text>
<text x="588" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">minutes</text>
<text x="588" y="614" font-size="11" fill="#475569" text-anchor="middle">4 CPUs</text>
<text x="24" y="646" font-size="13" fill="#0F172A" font-weight="700">coverage per sub-part: first test (grey) and fixed test (colour)</text>
<line x1="466" y1="660" x2="466" y2="966" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="466" y="982" font-size="11" fill="#475569" text-anchor="middle">60 %</text>
