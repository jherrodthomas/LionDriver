<title>Part 11 in one minute 3 · grading a self-test</title>
<desc>20,229 faults simulated on PicoRV32; the self-test finds 92.4 % of stuck-at faults, up from 87.9 % in the first run.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="720" height="1180" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<rect x="24" y="22" width="236" height="30" rx="15" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="142" y="42" font-size="12" fill="#4F46E5" font-weight="700" text-anchor="middle">PART 11 IN ONE MINUTE · 3</text>
<text x="360" y="92" font-size="30" fill="#0F172A" font-weight="800" text-anchor="middle">How do you check that a</text>
<text x="360" y="130" font-size="30" fill="#0F172A" font-weight="800" text-anchor="middle">CPU self-test really works?</text>
<text x="360" y="170" font-size="15" fill="#475569" text-anchor="middle">break the CPU on purpose, thousands of times</text>
<rect x="24" y="198" width="129.6" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="88.8" y="215" font-size="11" fill="#475569" text-anchor="middle">synthesise</text>
<rect x="159.6" y="198" width="129.6" height="26" rx="13" fill="#C2410C" stroke="#C2410C" stroke-width="1"/>
<text x="224.4" y="215" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">break</text>
<rect x="295.2" y="198" width="129.6" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="360" y="215" font-size="11" fill="#475569" text-anchor="middle">run</text>
<rect x="430.8" y="198" width="129.6" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="495.6" y="215" font-size="11" fill="#475569" text-anchor="middle">compare</text>
<rect x="566.4" y="198" width="129.6" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="631.2" y="215" font-size="11" fill="#475569" text-anchor="middle">score</text>
<rect x="24" y="242" width="672" height="250" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="44" y="270" font-size="14" fill="#0F172A" font-weight="700">one of 20,229 faults, followed through (example values)</text>
<rect x="44" y="292" width="115.2" height="110" rx="10" fill="#FEF2F2" stroke="#D2553F" stroke-width="1.5"/>
<text x="101.6" y="326" font-size="13" fill="#D2553F" font-weight="700" text-anchor="middle">gate output</text>
<text x="101.6" y="354" font-size="12" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">stuck at 1</text>
<line x1="160.2" y1="347" x2="163.2" y2="347" stroke="#475569" stroke-width="1.6"/>
<path d="M172.2,347 L163.2,351.5 L163.2,342.5 Z" fill="#475569"/>
