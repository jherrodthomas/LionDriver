<rect x="190" y="938" width="262.5" height="9" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<rect x="190" y="948" width="266.1" height="11" rx="2" fill="#D2553F" stroke="none" stroke-width="0"/>
<text x="462.1" y="957" font-size="12" fill="#D2553F" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">58 %</text>
<text x="360" y="1020" font-size="16" fill="#0F172A" font-weight="700" text-anchor="middle">A self-test is graded by breaking the CPU, not by reading the code.</text>
<text x="360" y="1046" font-size="11" fill="#94A3B8" text-anchor="middle">PicoRV32 (ISC) synthesised with Yosys to sky130_fd_sc_hd (Apache-2.0); fault-free run checked against an ISA model.</text>
<text x="360" y="1063" font-size="11" fill="#94A3B8" text-anchor="middle">An open RISC-V core, not LionDriver's MCU: this shows the method.</text>
<g class="terms">
<text x="24" y="1092" font-size="10.5" fill="#475569">Terms: ALU arithmetic logic unit: the part of a processor that adds, compares and shifts · CPU central processing unit:</text>
<text x="24" y="1106.5" font-size="10.5" fill="#475569">a processor core · FF flip-flop: a one-bit storage cell clocked by the processor clock · IRQ interrupt request · ISA</text>
<text x="24" y="1121" font-size="10.5" fill="#475569">instruction-set architecture; an ISA model runs a program instruction by instruction to give the expected results · ISC</text>
<text x="24" y="1135.5" font-size="10.5" fill="#475569">ISC licence: a short permissive open-source licence (Internet Systems Consortium) · MCU microcontroller: the panda</text>
<text x="24" y="1150" font-size="10.5" fill="#475569">safety processor (STM32H7) · RISC-V an open instruction-set architecture; PicoRV32 is an open-source RISC-V core</text>
</g>
</svg>
