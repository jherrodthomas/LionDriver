<text x="180" y="801" font-size="13" fill="#0F172A" font-weight="600" text-anchor="end">Control</text>
<rect x="190" y="788" width="434.1" height="9" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<rect x="190" y="798" width="445.6" height="11" rx="2" fill="#2E9E6A" stroke="none" stroke-width="0"/>
<text x="641.6" y="807" font-size="12" fill="#2E9E6A" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">97 %</text>
<text x="180" y="831" font-size="13" fill="#0F172A" font-weight="600" text-anchor="end">IRQ + timer</text>
<rect x="190" y="818" width="279.6" height="9" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
