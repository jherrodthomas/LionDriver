<text x="454.9" y="782" font-size="11" fill="#0F172A" font-weight="700" text-anchor="middle">92 %</text>
<text x="160" y="824" font-size="13" fill="#0F172A" font-weight="600" text-anchor="end">ECC · 2 bits</text>
<text x="160" y="840" font-size="11" fill="#475569" text-anchor="end">600 flips</text>
<rect x="170" y="808" width="398.9" height="30" rx="0" fill="#D97706" stroke="#FFFFFF" stroke-width="1"/>
<text x="369.4" y="828" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">76 %</text>
<rect x="568.9" y="808" width="127.1" height="30" rx="0" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="1"/>
<text x="632.4" y="828" font-size="11" fill="#0F172A" font-weight="700" text-anchor="middle">24 %</text>
<rect x="24" y="856" width="12" height="12" rx="2" fill="#D2553F" stroke="none" stroke-width="0"/>
<text x="41" y="867" font-size="11" fill="#0F172A">wrong result, unnoticed</text>
<rect x="192" y="856" width="12" height="12" rx="2" fill="#D97706" stroke="none" stroke-width="0"/>
<text x="209" y="867" font-size="11" fill="#0F172A">flagged as an error</text>
<rect x="336" y="856" width="12" height="12" rx="2" fill="#2E9E6A" stroke="none" stroke-width="0"/>
<text x="353" y="867" font-size="11" fill="#0F172A">read, and corrected</text>
<rect x="480" y="856" width="12" height="12" rx="2" fill="#CBD5E1" stroke="none" stroke-width="0"/>
<text x="497" y="867" font-size="11" fill="#0F172A">no effect</text>
<rect x="24" y="886" width="672" height="92" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/>
<text x="44" y="914" font-size="15" fill="#C2410C" font-weight="700">In FMEDA terms</text>
<text x="44" y="938" font-size="13" fill="#0F172A">Single flips in the register file move from 'residual' to 'covered'.</text>
<text x="44" y="958" font-size="13" fill="#0F172A">Double flips become 'detected': the error flag must lead to a safe state.</text>
<text x="360" y="1012" font-size="16" fill="#0F172A" font-weight="700" text-anchor="middle">ECC turns silent wrong results into corrections or alarms.</text>
<text x="360" y="1038" font-size="11" fill="#94A3B8" text-anchor="middle">PicoRV32 with our Hamming (39,32) SECDED register file (flow/gen_regs_ecc.py), synthesised with Yosys.</text>
<text x="360" y="1055" font-size="11" fill="#94A3B8" text-anchor="middle">Flips in x1 to x31 and q0 to q3, one random cycle each, during our self-test; 600 random double flips.</text>
<g class="terms">
<text x="24" y="1084" font-size="10.5" fill="#475569">Terms: CPU central processing unit: a processor core · ECC error-correcting code (memory) · FMEDA failure modes, effects</text>
<text x="24" y="1098.5" font-size="10.5" fill="#475569">and diagnostic analysis (hardware metrics) · SECDED single-error-correcting, double-error-detecting code (here Hamming</text>
<text x="24" y="1113" font-size="10.5" fill="#475569">39,32 on each register)</text>
</g>
</svg>
