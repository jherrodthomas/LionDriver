<text x="44" y="408" font-size="12" fill="#0F172A">On every read the check bits give a syndrome:</text>
<text x="44" y="426" font-size="12" fill="#2E9E6A" font-weight="600">• one bit wrong → the syndrome names it → flipped back (corrected)</text>
<text x="44" y="444" font-size="12" fill="#D97706" font-weight="600">• two bits wrong → can't tell which → error flag raised (flagged)</text>
<text x="44" y="470" font-size="11" fill="#475569">No scrubbing: a bad word stays bad until it is written again.</text>
<text x="132" y="528" font-size="12" fill="#475569" text-anchor="middle">single flips → wrong result</text>
<text x="132" y="572" font-size="40" fill="#2E9E6A" font-weight="800" text-anchor="middle">7.9→0</text>
<text x="132" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">percent</text>
<text x="132" y="614" font-size="11" fill="#475569" text-anchor="middle">88 → 0 of the flips</text>
<text x="360" y="528" font-size="12" fill="#475569" text-anchor="middle">double flips flagged</text>
<text x="360" y="572" font-size="40" fill="#D97706" font-weight="800" text-anchor="middle">76 %</text>
<text x="360" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">with ECC</text>
<text x="360" y="614" font-size="11" fill="#475569" text-anchor="middle">without ECC: 0</text>
<text x="588" y="528" font-size="12" fill="#475569" text-anchor="middle">area cost</text>
<text x="588" y="572" font-size="40" fill="#C2410C" font-weight="800" text-anchor="middle">+14.3</text>
<text x="588" y="596" font-size="13" fill="#0F172A" font-weight="600" text-anchor="middle">percent</text>
<text x="588" y="614" font-size="11" fill="#475569" text-anchor="middle">of the whole core</text>
<text x="24" y="646" font-size="13" fill="#0F172A" font-weight="700">what happened to each flip</text>
<text x="160" y="686" font-size="13" fill="#0F172A" font-weight="600" text-anchor="end">no ECC · 1 bit</text>
<text x="160" y="702" font-size="11" fill="#475569" text-anchor="end">1,120 flips</text>
<rect x="170" y="670" width="41.3" height="30" rx="0" fill="#D2553F" stroke="#FFFFFF" stroke-width="1"/>
<text x="190.7" y="690" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">8 %</text>
<rect x="211.3" y="670" width="484.7" height="30" rx="0" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="1"/>
<text x="453.7" y="690" font-size="11" fill="#0F172A" font-weight="700" text-anchor="middle">92 %</text>
<text x="160" y="732" font-size="13" fill="#0F172A" font-weight="600" text-anchor="end">ECC · 1 bit</text>
<text x="160" y="748" font-size="11" fill="#475569" text-anchor="end">1,365 flips</text>
<rect x="170" y="716" width="401.9" height="30" rx="0" fill="#2E9E6A" stroke="#FFFFFF" stroke-width="1"/>
<text x="371" y="736" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">76 %</text>
<rect x="571.9" y="716" width="124.1" height="30" rx="0" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="1"/>
<text x="634" y="736" font-size="11" fill="#0F172A" font-weight="700" text-anchor="middle">24 %</text>
<text x="160" y="778" font-size="13" fill="#0F172A" font-weight="600" text-anchor="end">no ECC · 2 bits</text>
<text x="160" y="794" font-size="11" fill="#475569" text-anchor="end">600 flips</text>
