<text x="960" y="610" font-size="12" fill="#475569">orange = flip-flops (edfxtp has an enable input)</text>
<rect x="960" y="640" width="500" height="120" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/>
<text x="980" y="668" font-size="15" fill="#C2410C" font-weight="700">What this changes in the FMEDA</text>
<text x="980" y="694" font-size="13" fill="#0F172A">The register file is 43 % of the core (1,163 flip-flops), so it carries</text>
<text x="980" y="714" font-size="13" fill="#0F172A">that share of the core's failure rate. A register file built from flip-flops is</text>
<text x="980" y="734" font-size="13" fill="#0F172A">big; a memory macro with ECC would change the split.</text>
<rect x="40" y="790" width="1420" height="110" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="60" y="818" font-size="15" fill="#0F172A" font-weight="700">How the split was made, and its limits</text>
<text x="60" y="844" font-size="12.5" fill="#0F172A">• Flip-flops are grouped by the register they implement; each logic cell goes to the sub-parts whose flip-flops it feeds (shared cells split equally).</text>
<text x="60" y="866" font-size="12.5" fill="#0F172A">• Register-file read multiplexers count in the register file. Cell area at the typical corner: no placement, wiring or clock tree.</text>
<text x="60" y="888" font-size="12.5" fill="#0F172A">• Configuration: RV32I with multiply, divide, interrupts and counters. Sizes only, no failure rate. An open core, not the STM32 in LionDriver: this is a method demonstration, not evidence.</text>
<text x="40" y="926" font-size="11" fill="#94A3B8">PicoRV32 © 2015 Claire Xenia Wolf, ISC licence. sky130_fd_sc_hd cell library, Apache-2.0. Synthesis: Yosys, synth -flatten, dfflibmap and abc to the tt_025C_1v80 liberty (flow/synth.ys).</text>
<g class="terms">
<text x="40" y="950" font-size="10.5" fill="#475569">Terms: ALU arithmetic logic unit: the part of a processor that adds, compares and shifts · ECC error-correcting code (memory) · FF flip-flop: a one-bit storage cell clocked by the processor clock · FMEDA failure modes, effects and diagnostic analysis</text>
<text x="40" y="964.5" font-size="10.5" fill="#475569">(hardware metrics) · IRQ interrupt request · ISC ISC licence: a short permissive open-source licence (Internet Systems Consortium) · ISO International Organization for Standardization · RISC-V an open instruction-set architecture; PicoRV32 is an</text>
<text x="40" y="979" font-size="10.5" fill="#475569">open-source RISC-V core · WP-nn work product, e.g. WP-C-04; the letter is its area (M management, C concept, S system, H hardware, W software, V validation, P processes, A analyses, O operation, K safety case)</text>
</g>
</svg>
