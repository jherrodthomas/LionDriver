# Bench wiring for the harness box tests VS-HW-22...24 (WP-H-06 section 3.1 and bench/VS-HW-22-24-checklist.md).
# The box and the Toyota A harness are tested outside the car: CAN interface channel A acts as the camera,
# channel B as the car ADAS node, a lab supply feeds IGN_12, a low-impedance lab source drives SBU1 directly
# (R2+R3 = 240 ohm load SBU1: a series resistor would divide the drive, 1 kohm gives only 0.97 V).
# Harness pins from e05-toyota-a-harness.yaml; box pins from e05-harness-box.yaml. Bench parts that WP-H-06 does not
# name (mating plugs, USB-C breakout) are marked "to choose": no part numbers are invented here.
# Fault-injection points (FI-*) are the modifications the checklist makes; each names its step.

metadata:
  title: Bench for VS-HW-22...24, harness box tested alone (not yet built)
  drawing: BB

options:
  fontname: arial
  bgcolor: WH

connectors:
  CAN:
    type: CAN interface, 2 channels
    subtype: 500 kbit/s; model recorded on the checklist
    notes: Ch A sends 0x343 every 10 ms, ch B sends 0x1AA every 10 ms; both log error counters.
    pinlabels: [A CAN_H, A CAN_L, A GND, B CAN_H, B CAN_L, B GND]
  TA:
    type: 120 ohm
    subtype: termination, camera side
    pinlabels: [CAN_H, CAN_L]
  TB:
    type: 120 ohm
    subtype: termination, car side
    pinlabels: [CAN_H, CAN_L]
  X1:
    type: Toyota A camera connector X1
    subtype: TE 1318774-1; bench mating plug to choose
    notes: Harness type assumed Toyota A with box v3 (DQ-211 C). X1, X2 and the box are joined by the Toyota A harness as drawn in e05-toyota-a-harness.
    pins: [5, 11, 10]
    pinlabels: [CAN2_H camera, CAN2_L camera, GND]
  X2:
    type: Toyota A car connector X2
    subtype: TE 1565894-1; bench mating plug to choose
    pins: [5, 11, 7, 10]
    pinlabels: [CAN0_H car, CAN0_L car, IGN (box IGN_12), GND]
  PSU:
    type: Lab supply
    subtype: 0-20 V, current limit 0.5 A
    notes: Steps VS-HW-22 (13.5 V, ramp 0-13.5 V) and VS-HW-24 (9-16 V, capped transients).
    pinlabels: [+, -]
  SRC:
    type: Lab source 0-5 V
    subtype: low impedance (10 ohm or less), current limit about 50 mA; no series resistor
    notes: R2+R3 draw about 21 mA at 5 V. Device driver unknown (UK-06).
    pinlabels: [out, 0 V]
  BO:
    type: USB-C breakout
    subtype: on box receptacle J3; bench part to choose
    notes: VS-HW-22 step 4, VS-HW-23 step 3 and VS-HW-24 (e) put the reference device on the OBD-C cable here instead.
    pins: [A8, A1, B8, A4]
    pinlabels: [SBU1 switch drive, GND, SBU2 ignition (observe), VIN (scope ch 2)]
  SCOPE:
    type: Scope, 4 channels
    subtype: differential probe on ch 1
    pinlabels: [ch 1 CAN_H-CAN_L at X2, ch 2 VIN, ch 3 SBU1, ch 4 U1 pins]
  FI1:
    type: "FI-1: IGN_12 open"
    subtype: VS-HW-22 steps 2 and 4
    pinlabels: [PSU + lead]
  FI2:
    type: "FI-2: VIN to GND, 1 ohm"
    subtype: VS-HW-22 step 3 (models a D4 short)
    pinlabels: [VIN]
  FI3:
    type: "FI-3: R2/R3 open (R2 lifted at one end)"
    subtype: VS-HW-23 steps 2-5 (box modified, reversible)
    pinlabels: [SBU1 pull-down R2/R3]
  FI4:
    type: "FI-4: D2/D3 bridged (D2, then D3)"
    subtype: VS-HW-24 (d), CAN0_H then CAN2 to GND (box modified, reversible)
    pinlabels: [clamp diode]
  FI5:
    type: "FI-5: R7/R8 open (R8, R7, then both lifted)"
    subtype: VS-HW-24 (e), camera-side termination in intercept (box modified, reversible)
    pinlabels: [camera-side termination R7/R8]

cables:
  WA:
    type: bench lead, camera side
    wirelabels: [CAN_H, CAN_L, GND]
    wirecount: 3
  WB:
    type: bench lead, car side
    wirelabels: [CAN_H, CAN_L, GND]
    wirecount: 3
  WP:
    type: bench lead, supply
    wirelabels: [IGN_12, GND]
    wirecount: 2
  WS:
    type: bench lead, SBU1 drive
    wirelabels: [SBU1, GND]
    wirecount: 2

connections:
  - - CAN: [1, 2, 3]
    - WA: [1-3]
    - X1: [5, 11, 10]
  - - CAN: [4, 5, 6]
    - WB: [1-3]
    - X2: [5, 11, 10]
  - - TA: [1, 2]
    - --
    - X1: [5, 11]
  - - TB: [1, 2]
    - --
    - X2: [5, 11]
  - - PSU: [1, 2]
    - WP: [1-2]
    - X2: [7, 10]
  - - SRC: [1, 2]
    - WS: [1-2]
    - BO: [A8, A1]
  - - SCOPE: [1]
    - --
    - X2: [5]
  - - SCOPE: [2, 3]
    - --
    - BO: [A4, A8]
  - - FI1: [1]
    - --
    - X2: [7]
  - - FI2: [1]
    - --
    - BO: [A4]
  - - FI3: [1]
    - --
    - BO: [A8]
  - - FI4: [1]
    - --
    - X2: [5]
  - - FI5: [1]
    - --
    - X1: [5]
