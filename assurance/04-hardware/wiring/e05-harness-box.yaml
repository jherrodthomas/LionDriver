# E-05 harness, box part: comma harness box v3 (HE-08 intercept switch, HE-10 ignition sense) between the
# 18-pin harness header and the OBD-C receptacle. Source: comma.ai Harness_Box.pdf "car harness v3"
# (20 Aug 2024) and OBD-C.sch.pdf, commaai/hardware at 530b7da (RR-2026-010 HB-01...HB-07).
# Lines between pins are box PCB nets, not wires. Drawn in the undriven state: SBU1 low through R2+R3, both
# switches on NC, so camera CAN2 joins car CAN0 (stock path). SBU1 = 5 V moves both to NO (intercept).
# Not drawn as nodes (listed in README section 3): clamps D2/D3, TVS D4, terminations R6-R8, VIN and GND fan-out.

metadata:
  title: E-05 harness box v3 (comma drawing, not verified on the reference unit)
  drawing: HB

options:
  fontname: arial
  bgcolor: WH

connectors:
  J1:
    type: Molex 501876-1840
    subtype: box header, mates with Toyota A plug X3
    notes: Lines show the switched and sensed nets only; pins marked 'to J3' are plain PCB nets. A loopback in the plug adds R6 (3-5) or R8 (13-15).
    pinlabels: [GND (to J3 A1), IGN_12 (car), CAN0_H term. select, CAN0_H car, CAN0_H'' to R6, CAN0_L car, CAN1_L radar (to J3 A10), CAN1_H radar (to J3 A11), CAN1_H radar (to J3 A11), VIN (to J3 A4), CAN1_L radar (to J3 A10), VIN (to J3 A4), CAN2_L term. select, IGN_12 (camera; same net as 2), CAN2_L'' to R8, CAN2_H camera, GND (to J3 A1), CAN2_L camera]
  U1:
    type: Vishay DG419LEDY-T1-GE4
    subtype: SPDT analog switch on CAN_H; V+ = VL = VIN
    notes: IN low = COM to NC (stock path). IN high = COM to NO (camera to terminated stub).
    pins: [1, 2, 8, 6, 4, 5, 3, 7]
    pinlabels: [COM = CAN2_H camera, NC = CAN0_H car, NO = CAN2_H' term., IN = SBU1, V+ = VIN, VL = VIN, GND, V- = GND]
  U2:
    type: Vishay DG419LEDY-T1-GE4
    subtype: SPDT analog switch on CAN_L; V+ = VL = VIN
    notes: IN low = COM to NC (stock path). IN high = COM to NO (car to terminated stub).
    pins: [1, 2, 8, 6, 4, 5, 3, 7]
    pinlabels: [COM = CAN0_L car, NC = CAN2_L camera, NO = CAN0_L' term., IN = SBU1, V+ = VIN, VL = VIN, GND, V- = GND]
  R23:
    type: R2 + R3
    subtype: 2 x 120 ohm in series, SBU1 to GND
    notes: Release default and orientation load (HB-02, HB-07). Open = IN floats (F-03).
    pins: [1, 2]
    pinlabels: [SBU1, GND]
  Q6:
    type: Q6 DMN3200U-7 with R1, R4, R5
    subtype: ignition sense HE-10
    notes: IGN_12 on the gate (R4/R5 1 k divider) pulls SBU2 low through R1 1 k (HB-06).
    pins: [G, D]
    pinlabels: [gate = IGN_12, drain = SBU2 via R1]
  D1:
    type: D1 STPS2H100ZFY
    subtype: Schottky, IGN_12 to box VIN
    notes: Box VIN also from comma power J2 pin 4 (HB-03).
    pins: [A, K]
    pinlabels: [anode = IGN_12, cathode = VIN]
  J3:
    type: Hirose DX07S024XJ1R1100
    subtype: OBD-C receptacle (USB-C), box side; CC1 CC2 and D+ D- not connected
    pins: [A1, A2, A3, A4, A8, A10, A11, B2, B3, B8, B10, B11]
    pinlabels: [GND (also A12 B1 B12), CAN0_H car, CAN0_L car, VIN (also A9 B4 B9), SBU1 switch drive, CAN1_L radar, CAN1_H radar, CAN2_H camera, CAN2_L camera, SBU2 ignition, CAN3_L comma power, CAN3_H comma power]
  J2:
    type: Molex 212528-0400
    subtype: comma power (optional accessory; use in the reference configuration not recorded, OI-W-5)
    pinlabels: [CAN3_L (to J3 B10), CAN3_H (to J3 B11), GND (to J3 A1), VIN (to J3 A4)]

connections:
  # stock path through the switches (CAN_H via U1, CAN_L via U2)
  - - J1: [16]
    - --
    - U1: [1]
    - --
    - J3: [B2]
  - - J1: [4]
    - --
    - U1: [2]
    - --
    - J3: [A2]
  - - J1: [6]
    - --
    - U2: [1]
    - --
    - J3: [A3]
  - - J1: [18]
    - --
    - U2: [2]
    - --
    - J3: [B3]
  # switch drive and release default
  - - U1: [6]
    - --
    - J3: [A8]
  - - U2: [6]
    - --
    - J3: [A8]
  - - R23: [1]
    - --
    - J3: [A8]
  # ignition: sense (HE-10) and box supply through D1
  - - J1: [2]
    - --
    - Q6: [G]
  - - Q6: [D]
    - --
    - J3: [B8]
  - - J1: [2]
    - --
    - D1: [A]
  - - D1: [K]
    - --
    - J3: [A4]
  # termination-select pins on the same nets as the switch pins
  - - J1: [3]
    - --
    - U1: [2]
  - - J1: [13]
    - --
    - U2: [2]
  # comma power feeds the same box VIN (HB-03)
  - - J2: [4]
    - --
    - J3: [A4]
