- id: DQ-077
  question: "Should driver-monitoring escalation times depend on speed and road type instead of the fixed 5/15/25 s?"
  context: "When driver-monitoring confidence drops (sunglasses, low light), the system falls back to wheel-touch checks at fixed 5/15/25 s; at motorway speed 25 s is several hundred metres unsupervised (LS-09). Deriving the times from speed and road type changes how quickly the car nags and disengages the driver."
  reversibility: revisit
