  batch: 18
  proceed_after: 2026-11-02
  options:
    - key: A
      recommended: true
      title: "Add the re-check"
      detail: "Closes R-5 at a cost of a few instructions with interrupts masked. Cost: a panda change with a test, kept at each sync."
    - key: B
      title: "Rely on the race analysis"
      detail: "No code change. Cost: the one-frame residual stays and has to be argued in the safety case."
  sources: ["assurance/05-software/WP-W-03-software-architecture.md §5.4, ATC-18", "assurance/05-software/WP-W-02-software-safety-requirements.md SWSR-406"]
  status: open

