  after: [DQ-007, DQ-063]
  options:
    - key: A
      recommended: true
      title: "Harden the envelope to ASIL C now; start the second checker only if the C metrics fail"
      detail: "Keeps one MCU and the current design; the steering tests still go ahead to keep SG-01 from needing more. Cost: ASIL C software process for all envelope code (MC/DC, stricter reviews) and ASIL C hardware metrics (97 % / 80 %) become final targets, not interim ones; a late re-plan if the metrics fail."
    - key: B
      title: "Plan the second independent checker (DEC-01) now for steering, acceleration and the warning path"
