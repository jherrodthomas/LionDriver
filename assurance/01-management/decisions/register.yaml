- id: DQ-094
  question: "Do we lock the panda bootloader with write protection plus readout protection level 1 (WRP+RDP1), or leave ROM DFU open and accept the residual risk?"
  context: "The SoC controls the panda's boot pins, so a compromised SoC could flash unsigned firmware through the ROM bootloader (GAP-38). WRP+RDP1 may close this, but the effect must be verified on a sacrificial unit (it may brick it) and field recovery is lost. Leaving it open is a recorded residual risk (RR-05)."
  reversibility: hard
  blocks: "DR-13, CSR-041/054, RR-05, CS-AD-02/03, WP-K-03 CG2.2"
  options:
    - key: A
      recommended: true
      title: "Adopt DR-13 after test on a sacrificial unit"
      detail: "Buy/sacrifice a unit; hardware-enforced protection if it works; loses field recovery."
    - key: B
      title: "Leave ROM DFU open, accept residual"
      detail: "No hardware risk; firmware substitution by an SoC-root attacker stays as a retained cybersecurity claim."
  sources: ["assurance/08-analyses/fmea/design/panda-config-lock-and-fw-authenticity.md D2", "assurance/04-hardware/WP-H-02-hardware-design.md DC-07", "assurance/10-safety-case/WP-K-03-cybersecurity-case.md OI-2"]
  gate: G3
  asked: 2026-10-14
  status: withdrawn
  note: "Already decided as D-10 (2026-10-10): WRP + RDP1 after verification on a sacrificial unit; recorded in WP-M-07 §5."

