- id: DQ-096
  question: "Approve the numeric SOTIF validation targets VT-01..VT-15 (and their derivations) with the assessor before collecting evidence?"
  context: "ISO 21448 sequencing in WP-M-08 says targets must be fixed and approved before evidence is collected, otherwise the evidence can be accused of being fitted to the targets. The targets set how many km and how many test subjects are needed (e.g. 20 subjects bound P(not controlled) at 0.14, 29 for 0.1); several derivations explicitly leave judgements (e.g. whether a never-braking follower is credible) to the assessor."
  reversibility: hard
  blocks: "All WP-V-03/WP-V-04 campaigns; WP-V-03 (TBC) thresholds; WP-C-11 (TBC) values"
  after: [DQ-009]
  options:
    - key: B
      recommended: true
      title: "Wait for B1 data (OI-2/OI-8) to replace illustrative rates, then submit"
      detail: "Fewer revision rounds, but delays all SOTIF evidence collection."
    - key: A
      title: "Submit the current proposals and §4.2/§4.3 derivations to the assessor now"
      detail: "Starts the approval clock; campaigns can begin as soon as approved; requires an assessor engagement."
  sources: ["assurance/06-validation/WP-V-02-sotif-vv-strategy.md OI-3", "assurance/09-production-operation/WP-O-04-field-monitoring.md OI-5"]
  status: queued

