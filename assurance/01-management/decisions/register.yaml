- id: DQ-416
  question: "Should the ODD ask for more tyre tread than the legal minimum, because worn tyres cannot brake as hard as the item asks on a wet road?"
  context: >-
    The item brakes at up to 3.5 m/s², which needs a tyre-road friction of 0.36. The wet-braking study (a handbook
    table of typical tyres, synthetic, no credit) gives new tyres 5.6 m/s² on a wet road at 110 km/h, but tyres worn to
    the legal minimum (1.6 mm, 2/32 in) only **about 2.0 m/s²**: a stop from 110 km/h in light rain takes about 253 m
    instead of 149 m, and the item asks for more braking than the tyres hold. The ODD's vehicle-state row says only
    "maintained", which legal-minimum tyres meet.
