- id: DQ-419
  question: "Should LionDriver's next vehicles stay on CAN and CAN FD passenger cars, leaving trucks (J1939) and cars with locked or Ethernet-based steering commands out of scope?"
  context: >-
    The panda works by splitting a CAN cable and swapping the car camera's steering messages for its own. That only
    works where the steering and braking commands travel on CAN or CAN FD at a connector the harness can reach,
    without a cryptographic signature the device cannot make. **Trucks use J1939, a different vehicle class with its
    own hazards; newer cars move commands to Ethernet or sign them (SecOC).** Saying so now fixes what the next
    configuration may be and lets the assumption be written (WP-S-05 OI-8). It changes nothing on the Corolla.
  reversibility: revisit
  blocks: "WP-S-05 §12.1 and OI-8 (the network assumption of use); choice of the second configuration (wiki Reference vehicle, 'Adding a second vehicle')"
  gate: G2
  decider: lead
  asked: 2026-10-24
  batch: 16
  options:
    - key: A
      recommended: true
      title: "CAN and ISO CAN FD passenger cars only, unsigned commands"
      detail: "Matches how the device works and what openpilot supports. Cost: Toyota's signed (SecOC) cars and any truck stay out until a new decision."
    - key: B
      title: "Also allow signed (SecOC) cars with a recovered key"
      detail: "openpilot already drives some of them. Cost: key recovery from the owner's car becomes part of the item, a cybersecurity case (WP-C-09) and a support burden."
    - key: C
      title: "Also plan for J1939 trucks"
      detail: "A larger market. Cost: a new item, not a new car: new HARA (mass, stopping distance), new ODD, new actuators, and nothing upstream to build on."
  sources: ["assurance/03-system/WP-S-05-hsi-specification.md §12.1, §12.6, OI-8", "wiki/Reference-vehicle.md 'Adding a second vehicle'", "opendbc_repo/opendbc/safety/modes/toyota.h (toyota_secoc)"]
