  reversibility: easy
  blocks: "TC-05"
  options:
    - key: A
      recommended: true
      title: "Budget a fixed number of sacrificial units (e.g. one or two spares)"
      detail: "Test runs; hardware cost."
    - key: B
      title: "Skip destructive steps, document rationale"
      detail: "No cost; weaker evidence for CSR on boot protection."
  sources: ["assurance/06-validation/WP-V-06-cybersecurity-validation.md OI-3"]
  status: queued

