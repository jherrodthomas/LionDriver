  context: "Today, pressing the gas overrides speed control while steering stays on, and cruise resumes when you lift off. A driver who thinks the system went off can be surprised when it brakes or accelerates again (misuse MC-08). The requirements (SYS-042, TSR-305) are written for today's behaviour. **The default following distance is a separate question.**"
  reversibility: easy
  blocks: "Driver-interaction analysis and user information (WP-C-08, WP-O-03)"
  gate: G1
  asked: 2026-10-14
  batch: 1
  options:
    - key: A
      recommended: true
      title: "Keep today's behaviour: gas pauses speed control only"
      detail: "Matches the written requirements; an on-screen override alert covers the confusion, to be checked in the HMI clinic. Cost: the surprise case stays and needs that evidence."
    - key: B
      title: "Gas switches LionDriver off"
      detail: "A simpler mental model. Cost: changes SYS-042, TSR-305 and the release record; more disengagements in daily use."
  sources: ["assurance/02-concept/WP-C-08-driver-hmi-misuse-analysis.md OI-4", "assurance/09-production-operation/WP-O-03-user-information-safety-warnings.md OI-3", "assurance/07-supporting/impact/change-2026-10-12-panda-safety-mode-lock.md OI-3"]
