- id: DQ-213
  question: "openpilot is widely used in the city, on rural roads and on roads without lane lines. Should LionDriver's ODD change?"
  context: "LionDriver's ODD is highways only (DQ-023). The HARA rates engagement off the highway as foreseeable misuse and assumes it is under 1 % of engaged time (E2), although nothing prevents it yet. Upstream use contradicts that assumption: a video of a CFG-001 Corolla (model year 2020), the reference car, on a 2021 openpilot fork shows back roads at 72 km/h, narrow roads where it crosses the double yellow, intersections and roundabouts (RR-2026-011). The planned 60 km/h speed floor would not stop the 72 km/h back road. **A model run shows that rating it 1–10 % (E3) changes no goal. Bringing rural roads into the ODD makes the steering-loss goal SG-02 ASIL D.** The city would need functions LionDriver does not have: signals, stop signs, VRUs."
  reversibility: revisit
  blocks: "WP-C-02 ODD; WP-C-03 A-ODD exposure (OS-03, OS-04, OS-14, OS-15, OS-16); validation scope"
  gate: G1
  decider: lead
  asked: 2026-10-19
  options:
    - key: A
      recommended: true
      title: "Keep highways only; rate off-highway misuse at 1–10 % (E3)"
      detail: "Matches how the system is really used. No goal ASIL changes. The speed floor still keeps it off city streets once built. Cost: a HARA revision; rural roads above 60 km/h stay unblocked until road-type data exist."
    - key: B
      title: "Add rural and arterial roads to the ODD"
      detail: "More useful. Cost: SG-02 becomes ASIL D for users who drive those roads daily (silent steering loss in a rural curve), head-on traffic and VRUs enter the claimed scope, and validation grows a lot."
    - key: C
      title: "Leave everything as it is"
      detail: "No work now. Cost: the HARA rests on an exposure assumption the evidence contradicts; a reviewer would flag it."
  sources: ["assurance/02-concept/reviews/RR-2026-011.md F-1…F-4", "assurance/02-concept/WP-C-02-odd-and-intended-functionality.md §3.1, OI-9", "assurance/02-concept/WP-C-03-hara.md §3 (A-ODD), §6.1 observation 7"]
  note: "The lead answered in chat (2026-10-19): analyse every environment in the video and keep the ODD claim on highways."
  status: applied
