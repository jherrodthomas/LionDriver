      detail: "Stricter; loses automation for the rest of the drive after any SILENT drop."
  sources: ["assurance/05-software/WP-W-09-configuration-calibration-data.md OI-8"]
  status: queued

- id: DQ-074
  question: "When does the maintainer authorize the ISO 26262-6 software lifecycle (Phase A of WP-M-14)?"
  context: "WP-M-14 is a deferred plan; Part 6 work may only start after D-14, and the recommendation is not to start Phase A until the safety plan, item definition, HARA, FSC and TSC are at least in review, nor Phase B until the full entry baseline is approved. At the last snapshot no entry criterion was met, so this is a gate go/no-go that will recur."
