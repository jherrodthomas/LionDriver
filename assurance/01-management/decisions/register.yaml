- id: DQ-411
  question: "Which solver should the device heat model use?"
  context: >-
    A reversible technical choice, so Claude goes with the recommendation unless you object. FEniCSx (finite elements,
    LGPL-3.0, active) solves the 3D shape and renders through PyVista. **Two independent checks catch a solver or mesh
    error:** FiPy (NIST finite volumes) on a 2D cross-section and a small lumped heat network in numpy. Elmer FEM is the
    fallback if radiation inside the mount turns out to matter. No NASA tool fits: NASA's open heat code (NASTRAN-95)
    is unmaintained.
  reversibility: easy
  blocks: "TE-04 step T2; a new WP-P-07 tool row"
  gate: G1
  decider: claude
  batch: 14
  asked: 2026-10-21
  proceed_after: 2026-10-28
  after: [DQ-410]
  options:
    - key: A
      recommended: true
      title: "FEniCSx, checked by FiPy and a lumped network"
      detail: "Python throughout, pinned by an explicit conda lock like OpenModelica. Cost: three things to keep in agreement."
    - key: B
      title: "Elmer FEM alone"
      detail: "Mature, with radiation built in. Cost: a second language and file format in the repo, and no independent check."
    - key: C
      title: "FiPy alone, 2D only"
      detail: "Simplest install. Cost: a cross-section, not the 3D device, and no independent check."
  sources: ["TE-04 §3", "WP-P-07 §2 (TL-44 pinning pattern)"]
