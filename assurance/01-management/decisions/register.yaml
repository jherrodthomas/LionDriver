- id: DQ-340
  question: "If the driver stays unresponsive at the last driver-monitoring alert, what should the car do?"
  context: "Today, 5 s after the last alert the car starts slowing down but **stays engaged and keeps steering**, and the lockout only applies after a later disengagement (System FMEA SFM-025.C1). You chose to make the unresponsive driver its own hazard with an ASIL A goal (DQ-205); its safe state is this reaction. Requirement TSR-633 waits on the answer."
