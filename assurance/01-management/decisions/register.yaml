  figure: figures/dq-424.svg
  caption: "Speed after the stop starts, from 110 km/h, at each braking rate."
  options:
    - key: A
      recommended: true
      title: "2 m/s², ramped in (about 15 s and 230 m from 110 km/h)"
      detail: "Halves the time at speed and stays at an ordinary braking level for following traffic; the ramp keeps the jerk within its limit. Cost: a planner change for the forced stop, a rate in TSR-633, tests."
    - key: B
      title: "Keep 1.2 m/s² (about 25 s and 390 m)"
      detail: "No change; the gentlest for following traffic. Cost: the longest ride at speed with an unresponsive driver; the DQ-365 description is corrected instead."
    - key: C
      title: "3 m/s², as DQ-365 described (about 10 s and 150 m)"
      detail: "Shortest time at speed. Cost: a firm stop that following drivers may not expect (rear-end risk, HZ-006), and the same planner change."
  sources: ["assurance/08-analyses/fmea/analyses/sw-fmea.yaml SWF-086.C2", "DQ-365", "openpilot/selfdrive/controls/lib/longitudinal_planner.py (A_CRUISE_MIN)", "assurance/03-system/WP-S-02-technical-safety-requirements.md TSR-633"]
  status: open

- id: DQ-425
  question: "Should the reference build on the device ignore the test-only switches (REPLAY, SIMULATION, FINGERPRINT, BLOCK, STARTED and the others)?"
  context: >-
    A reversible technical choice, so Claude goes with the recommendation unless you object. Ten environment switches
    meant for tests and the simulator still work on the car: one makes the item show engaged whenever the panda allows
    control, one skips the panda firmware check, one fakes ignition, one overrides the car identification. Nothing sets
    them, but a shell on the device can. **The fix keeps them on a PC, where the simulator and tests need them, and
    removes them on the device before any process starts.** Same reasoning as your DQ-131 answer for the debug modes.
  reversibility: easy
  blocks: "SW FMEA SWF-028.C2, SWF-030.C2 (AP H -> L), SWF-058.C2, SWF-082.C1; SWF-ACT-028, -031, -057, -070"
  gate: G1
  decider: claude
  asked: 2026-10-27
  proceed_after: 2026-10-30
  after:
    - DQ-131
  options:
    - key: A
      recommended: true
      title: "manager removes them on the device in the reference build, and logs what it removed"
      detail: "One small module, tested and mutation-checked in CI. Cost: a process started by hand from a shell still sees them (a cybersecurity matter, shell access)."
    - key: B
      title: "Compile or code them out of each process in the reference build"
      detail: "Also covers a process started by hand. Cost: changes in pandad, selfdrived, card, the messaging library and opendbc, each a fork difference to carry at upstream syncs."
    - key: C
      title: "Leave them; rely on no shell access"
      detail: "No change. Cost: SWF-028.C2 and SWF-030.C2 stay AP H with nothing that detects them."
  sources: ["assurance/08-analyses/fmea/analyses/sw-fmea.yaml SWF-028, SWF-030, SWF-058, SWF-082", "assurance/07-supporting/impact/change-2026-10-27-reference-test-switches.md", "DQ-131"]
  status: open
- id: DQ-426
  question: "Should the steering controller forget its built-up correction each time steering assist ends?"
  context: >-
    A reversible technical choice, so Claude goes with the recommendation unless you object. The Corolla's steering
    controller builds up a correction (an integrator) while engaged. Upstream openpilot keeps it when assist ends and
    adds it again at the next engagement, even minutes later on a different road, so the first moments of an engagement
    can pull with an old correction. The curvature controller other cars use already clears it. **The fix clears it
    whenever steering assist is off, so every engagement starts from zero.** Upstream master (2026-10-27) still keeps it.
  reversibility: easy
  blocks: "SW FMEA SWF-042.C1 (D 10 -> 4), SWF-ACT-042; System FMEA SFM-002.C1, SFM-007.C1"
  gate: G1
  decider: claude
  asked: 2026-10-29
  proceed_after: 2026-11-01
  options:
    - key: A
      recommended: true
      title: "Clear the correction when steering assist ends (torque and PID controllers)"
      detail: "Two short methods, tested and mutation-checked in CI. Cost: a steady bias such as road crown is re-learned over the first seconds of each engagement, and the code differs from upstream."
    - key: B
      title: "Keep upstream behaviour and record why"
      detail: "No fork difference. Cost: an old correction is applied at engagement; SWF-042.C1 stays AP H with no test."
  sources: ["assurance/08-analyses/fmea/analyses/sw-fmea.yaml SWF-042", "assurance/07-supporting/impact/change-2026-10-29-lateral-integrator-reset.md"]
  status: open
- id: DQ-427
  question: "With the driver-camera view open, should the car refuse to engage, and disengage if the view turns on while engaged?"
  context: >-
    A reversible technical choice, so Claude goes with the recommendation unless you object. Opening the driver-camera
    view puts driver monitoring in demo mode: it stops using the car's real speed and state, and the monitored seat
    can switch. The view can only be opened parked, but it can stay open after you start driving, and nothing stopped
    engagement. **The fix keeps monitoring the real driver whenever the car is on, refuses to engage while the view is
    open ("Close Driver Camera View"), and gives a take-over alert and disengages if it is set while engaged.** This is
    your TSR-610 requirement.
  reversibility: easy
  blocks: "SW FMEA SWF-085.C1, SWF-085.C2 (D 10 -> 4), SWF-ACT-072; System FMEA SFM-022.C4; TSR-610, SWSR-610, CSR-072"
  gate: G1
  decider: claude
  asked: 2026-10-29
  proceed_after: 2026-11-01
  options:
    - key: A
      recommended: true
      title: "Refuse entry while the view is open, soft disable if set while engaged; monitoring ignores demo mode while the car is on"
      detail: "Small changes in selfdrived and dmonitoringd, tested on the real processes and mutation-checked in CI. Cost: a driver who leaves the view open must close it before engaging."
    - key: B
      title: "Refuse entry only, never disengage"
      detail: "No take-over alert if the parameter changes while engaged. Cost: the view covers the road view and its alerts while engaged, until closed."
    - key: C
      title: "Also have the UI clear the parameter when the car turns on"
      detail: "The view closes by itself. Cost: changes in both UIs (comma 3X and comma four) with UI tests; not needed for safety once monitoring ignores it."
  sources: ["assurance/08-analyses/fmea/analyses/sw-fmea.yaml SWF-085", "assurance/07-supporting/impact/change-2026-10-29-driver-view-interlock.md", "assurance/03-system/WP-S-02-technical-safety-requirements.md TSR-610"]
  status: open
- id: DQ-428
  question: "May CI download AUTOSAR's XML schema and validate the AUTOSAR description of LionDriver against it on every change?"
  context: >-
    The new AUTOSAR description (assurance/models/autosar) is checked in CI by a structural check written for the
    project; it was validated once by hand against AUTOSAR's own schema (R22-11) and passed. AUTOSAR publishes that
    schema for "informational purposes only" and needs written permission for any other use; redistribution is
    restricted, so it is not committed. **Validating on every change catches what the in-house check cannot (element
    order, value patterns), but whether that use counts as informational is a licence reading for you.** The file
    itself carries no evidence credit.
  reversibility: easy
  blocks: "assurance/models/autosar README OI-1; schema check in the 'autosar description' CI job"
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Yes: CI downloads the schema from autosar.org at run time, pinned by SHA-256, never stored in the repository"
      detail: "Full schema check on every change; one step in the CI job. Cost: relies on reading CI validation of a no-credit description as informational use; a download from autosar.org in each run."
    - key: B
      title: "No: keep the structural check in CI and validate against the schema by hand at each baseline"
      detail: "No licence question. Cost: an element-order or value-pattern error is found only at the next baseline."
    - key: C
      title: "Ask AUTOSAR for written permission (or use an integration partner's licensed tool) first"
      detail: "Removes the doubt. Cost: time and an external request; B applies meanwhile."
  sources: ["assurance/models/autosar/README.md §4", "AUTOSAR_MMOD_XMLSchema R22-11 _disclaimer.txt"]
  status: queued
