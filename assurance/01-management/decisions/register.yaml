- id: DQ-262
  question: "Should the search for unknown hazardous scenarios stop once at most 1 in 10 hazardous events is expected to be of a kind not yet seen (with at least 30 events counted)?"
  context: "You decided the search stops on a number plus the three-block trend rule (DQ-108 A). The number is a Good–Turing estimate: the share of hazardous events whose kind was seen only once. **The proposal ties it to a 10 % reserve held back from every SOTIF harm budget for unknown scenarios.** Below 30 events the estimate says little, so the rule needs at least 30. It must be fixed before road block B1 starts, so the result cannot be fitted to it."
