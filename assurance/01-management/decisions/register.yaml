  batch: 8
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Add an assumption of use and test it on the car"
      detail: "State that the EPS signals every LKA drop and the PCM every ACC non-execution, and check it with forced faults in the vehicle tests. If a test finds a silent drop, come back to option B. Cost: a few fault-injection runs."
    - key: B
      title: "Add a response check in the item"
      detail: "Compare measured steering and acceleration with the command and warn on a mismatch (TSR-626, WP-A-03 OI-8). Cost: a new safety requirement, tuning against false alarms, and its own verification."
    - key: C
      title: "Do both"
