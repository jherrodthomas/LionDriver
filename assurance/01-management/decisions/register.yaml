- id: DQ-007
  question: "How do we make the steering safety goal (SG-01) achievable?"
  context: "Today SG-01 is ASIL C and the steering path is a single channel on hardware that misses the ASIL C metrics. The concept recommends **lowering steering authority** until any driver can always correct it, which brings SG-01 to ASIL B like every other goal. This decision gates the functional safety concept and every requirement ASIL."
  reversibility: revisit
  blocks: "FSC, requirement ASILs, safety case structure (D-13)"
  gate: G1
  asked: 2026-10-14
  batch: 1
  figure: figures/dq-007.svg
  caption: "Option c is the concept's recommendation; a stays possible later if hardware data turns out better."
  options:
    - key: C
      recommended: true
      title: "Reduce steering authority so SG-01 drops to ASIL B"
      detail: "Limits derived physically per speed, plus ASIL B hardening that is needed anyway. Cost: needs controllability tests, and some tight curves fall outside what the system can steer."
    - key: A
      title: "Keep today's authority and harden to ASIL C"
      detail: "No change in behaviour. Cost: hardware metrics the device misses today; likely extra hardware."
    - key: B
      title: "Split the ASIL with the Toyota EPS"
      detail: "Credit the EPS torque limit as a second channel. Cost: needs EPS safety evidence Toyota doesn't publish; unlikely to pass an independent review."
  sources: ["assurance/01-management/WP-M-01-assurance-strategy.md D-13", "assurance/02-concept/WP-C-04-functional-safety-concept.md OI-1", "assurance/08-analyses/WP-A-01-asil-decomposition.md OI-1"]
  status: applied
  answer: {choice: C, via: inbox, at: 2026-10-14, by: u_DgEswP8TFzpISXlzh3BD1g}
  applied: {ref: ebc9fea, record: "WP-C-04 §4 and OI-1; WP-S-02 §2.1; WP-A-01 §2 (strategic record in WP-M-01 D-13 / WP-M-07 left to the management session)", at: 2026-10-16}

- id: DQ-008
  question: "Until the car is measured, should steering controllability be rated C2 (SG-01 ASIL C) or C3 (ASIL D)?"
  context: "The two HARA drafts disagree. C2 credits the EPS torque limit and the driver's ability to overpower it, neither measured yet; C3 makes SG-01 ASIL D, whose hardware targets (99 % / 90 %) are far above today's 96.9 % / 87.7 %. **The measurement itself needs the test car and a closed course.**"
  reversibility: revisit
  blocks: "HARA confirmation review at G1 (RD-1)"
  gate: G1
  asked: 2026-10-14
  batch: 1
  figure: figures/dq-002.svg
  caption: "Today's steering FMEDA against the ASIL targets: it passes B, misses C narrowly and misses D clearly."
  options:
    - key: A
      recommended: true
      title: "Keep C2, make the measurement a G1 entry condition"
      detail: "SG-01 stays ASIL C; design the panda path to ASIL D measures meanwhile and claim no controllability credit. Cost: vehicle test time before G1."
    - key: B
      title: "Accept C3 now: SG-01 is ASIL D"
      detail: "No argument needed. Cost: ASIL D hardware metrics, which likely need a relay supervisor or monitoring MCU."
    - key: C
      title: "Rate it after the authority reduction is tested"
      detail: "Fold into the steering-strategy decision; the C1 evidence replaces this rating. Cost: the HARA stays unconfirmed until then."
  sources: ["assurance/00-assessment/docs-safety-reconciliation.md OI-1"]
  note: "HARA record applied: C2 kept, measurement a G1 entry condition, no controllability credit in the safety case. Left: the G1 entry condition in the gate plan (management session) and the panda path designed to the ASIL D measures (hardware and FMEDA sessions)."
  status: applied
  applied: {ref: "jherrodthomas/LionDriver#96", record: "WP-C-03 v0.4 HE-01.2, SG-01 notes, OI-1", at: 2026-10-16}
  answer: {choice: A, via: inbox, at: 2026-10-14, by: u_DgEswP8TFzpISXlzh3BD1g}

