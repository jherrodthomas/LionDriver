- id: DQ-073
  question: "Once a car mode is active, may the envelope go back to the Toyota mode after dropping to SILENT/NOOUTPUT, or must it wait for ignition off?"
  context: "Data requirement DVR-02 says mode changes are refused until ignition off; the implemented lock (SWSR-512) allows TOYOTA → SILENT/NOOUTPUT → TOYOTA with parameter 73. Either the requirement is reworded to the implementation, or a stricter requirement is raised that would block recovery within a drive."
  reversibility: easy
