- id: DQ-059
  question: "At the tightest allowed curve, should the HARA controllability rating for silent steering loss be revisited, or the minimum curve radius of the ODD be tightened?"
  context: "WP-S-04 estimates that at the ODD curve bound the car drifts 0.6 m in about 0.7 s after lateral control is lost, shorter than the driver's reaction time. The C rating of HE-02.1 (SG-02, ASIL B) assumes the driver can catch it. Either the hazard rating is reconsidered or the ODD curve bound R_ODD is made larger."
  reversibility: revisit
  blocks: "SG-02 ASIL/FTTI; WP-C-02 §3.2 R_ODD; WP-S-04 budgets"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Tighten R_ODD in WP-C-02"
      detail: "Smaller ODD (fewer tight curves); keeps HARA rating; needs FM-07-style enforcement or user info."
    - key: B
      title: "Re-rate C of HE-02.1 for curves at the bound"
      detail: "Possibly higher ASIL for SG-02 with knock-on TSR and test work."
    - key: C
      title: "Keep both and justify with measured data"
      detail: "Requires vehicle data showing drift is slower than estimated (WP-S-04 OI-1)."
  sources: ["assurance/02-concept/WP-C-03-hara.md OI-7"]
  status: queued

- id: DQ-060
  question: "When the envelope rejects a bad steering frame, should it latch off lateral control until the driver re-engages, or keep upstream's drop-and-continue behaviour?"
  context: "TSR-108 requires revoking lateral authority on any rejected command until a new engagement, and reporting it. Upstream openpilot only drops the frame and keeps control allowed. Latching is the safer reaction but may cause more disengagements; the choice is a vehicle-behaviour decision recorded in WP-C-04."
  reversibility: easy
  blocks: "TSR-108 implementation; FSR-01.12; TSR-516(b) siren trigger"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Latch (implement TSR-108 as written)"
      detail: "Faulty command streams end control; possible extra disengagements; firmware change."
    - key: B
      title: "Keep upstream recovery (drop frame, continue)"
      detail: "No availability loss; TSR-108 must be relaxed and the residual justified."
  sources: ["assurance/03-system/WP-S-02-technical-safety-requirements.md OI-4"]
  status: queued

- id: DQ-061
  question: "When the SoC heartbeat is lost shortly after a disengagement, does the driver need a fast warning within the SG-02 budget?"
  context: "If authority ended within 5 s before heartbeat loss, the firmware keeps the slow 1 Hz siren (4–5 s) instead of the fast siren, while TSR-516(a) asks for ≤ 0.5 s. The driver has already seen the disengagement, so the case may not need it; either the requirement or the firmware must be aligned."
  reversibility: easy
  blocks: "TSR-516(a); SG-02 budget"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "No fast warning needed; align TSR-516(a) text"
      detail: "No firmware change; rationale that the disengagement was already announced."
    - key: B
      title: "Add the fast siren for this case"
      detail: "Firmware change; meets TSR-516(a) as written."
  sources: ["assurance/03-system/WP-S-04-timing-ftti-budget.md OI-9"]
  status: queued

- id: DQ-062
  question: "How much delay in the stock pre-collision braking (PCS) caused by LionDriver is acceptable?"
  context: "When LionDriver forwards the stock PCS messages and forwarding stops, PCS braking starts late until the relay restores the stock path. The preliminary FTTI of 0.2 s loses at most ≈ 4 km/h of speed reduction (assumed 6 m/s² braking); this is engineering judgement that must be agreed in the HARA review after measurement."
  reversibility: revisit
  blocks: "SG-07 FTTI; TSR-501/706/711; PCS latency bound (WP-S-08 OI-4)"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Accept 0.2 s (≈ 4 km/h loss) as the SG-07 FTTI pending measurement"
      detail: "Current budget (FDTI 0.1 s + FRTI 0.1 s) stands, with zero margin."
    - key: B
      title: "Require a tighter bound"
      detail: "Forces shorter watchdog/forwarding supervision (see WP-S-04 OI-7)."
  sources: ["assurance/03-system/WP-S-04-timing-ftti-budget.md OI-4"]
  status: queued

- id: DQ-063
  question: "Should the hardware of safety goal SG-01 (no unwanted steering torque) be designed and measured against ASIL C, or against the ASIL B the project expects?"
  context: "SG-01 is rated ASIL C provisionally; the functional safety concept (option c) expects it to drop to ASIL B once the hazard analysis (HARA) re-rates it on controllability evidence. The hardware metric targets differ a lot (single-point fault metric 97 % vs 90 %, latent fault metric 80 % vs 60 %), and an ASIL C claim would need extra hardware (external supervisor DC-02 or a second channel). Every C-rated HWSR/SWSR carries a placeholder 'B‡' until this is settled."
  reversibility: revisit
  blocks: "G2/G3 metric calculation (WP-H-04, WP-H-05), ASIL attribute of all B‡ HWSRs/SWSRs, need for DC-02"
  gate: G2
  after: [DQ-007]
  options:
    - key: A
      recommended: true
      title: "Keep ASIL C until the HARA re-rates"
      detail: "Follows the documented rule (WP-H-01 §2.1); metrics computed against C, B shown alongside; may force the DC-02 adapter if C stays."
    - key: B
      title: "Work to ASIL B now"
      detail: "Cheaper and matches the FSC recommendation, but rests on controllability evidence not yet collected; rework if the HARA keeps C."
    - key: C
      title: "Compute both and decide at G3"
      detail: "No commitment now; doubles the reporting effort in WP-H-04/05."
  sources: ["assurance/04-hardware/WP-H-04-hardware-metrics.md OI-2"]
  status: queued

- id: DQ-064
  question: "If relay readback finds the relay welded in the intercept position, is a driver warning that stock emergency braking is unavailable an acceptable safe state for SG-07?"
  context: "A welded relay keeps blocking the camera's pre-collision braking (PCS/AEB) messages and cannot be released, so the normal safe state (release the relay) is impossible. The doc's candidate reaction is to warn the driver that stock AEB is unavailable; whether that satisfies SG-07 is a risk-acceptance question. This only becomes actionable if readback (DC-03) exists."
  reversibility: revisit
  blocks: "SG-07 safe-state definition, DC-03 firmware reaction, HMI requirements"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Warn driver and refuse engagement"
      detail: "Driver informed that stock AEB is lost; accepted as the SG-07 degraded state; needs an HMI warning requirement."
    - key: B
      title: "Not acceptable — require a design that makes welding implausible"
      detail: "Pushes to a different relay/adapter design with evidence; more hardware cost and delay."
  sources: ["assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md OI-9"]
  status: queued

- id: DQ-065
  question: "How should the project get the device schematic, BOM and harness data: ask comma.ai first and, if refused, tear down one reference device and harness?"
  context: "Part-level hardware analysis (FMEDA failure rates, relay and supply design, qualification) is blocked without the schematic and bill of materials. comma.ai may decline; the fallback is a teardown of one reference device and harness, which costs hardware and gives weaker evidence (part identification errors, silent board revisions). Contact with comma.ai falls under the supplier-management plan (WP-M-11)."
  reversibility: revisit
  blocks: "UK-01…UK-03; FMEDA §6.1; WP-H-04/05 calculations; WP-H-07 qualification"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Request from comma.ai now; pre-approve teardown as fallback"
      detail: "Fastest path to G2 data; one device and harness may be sacrificed if comma declines."
    - key: B
      title: "Request only; wait"
      detail: "No hardware spend; G2 hardware work products stay blocked until comma replies."
    - key: C
      title: "Teardown immediately"
      detail: "Independent of comma; costs a device and gives the weaker evidence quality listed in WP-H-07 §5."
  sources: ["assurance/04-hardware/WP-H-02-hardware-design.md OI-1"]
  status: queued

- id: DQ-066
  question: "Does the safety manager approve PMHF (overall failure probability) as the main random-hardware-failure method, with a per-cause check of the biggest contributors?"
  context: "ISO 26262-5 §9 allows either one overall probability figure (PMHF, method 1) or a per-fault evaluation (EEC, method 2). The proposal is PMHF plus an EEC-style check of the MCU core, SRAM and the stuck relay, so a good overall number cannot hide one uncovered part. The doc says this needs safety-manager approval before calculation starts."
  reversibility: easy
  blocks: "WP-H-05 calculation; G2 method record"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "PMHF + per-cause check of dominant contributors"
      detail: "One comparable figure plus visibility of the relay/MCU; moderate effort."
    - key: B
      title: "EEC (method 2) only"
      detail: "Per-part visibility, but higher effort and harder to communicate."
    - key: C
      title: "PMHF only"
      detail: "Least effort; a single weak part could be hidden in the total."
  sources: ["assurance/04-hardware/WP-H-05-random-hardware-failures-pmhf.md OI-1"]
  status: queued

- id: DQ-067
  question: "What mission profile (vehicle life, operating hours, temperature, on/off cycles) should all failure-rate calculations assume?"
  context: "Failure rates and latent-fault exposure depend on these assumptions; several are TBD. Proposals are a 15-year vehicle life (used even though an aftermarket item may be fitted for less), one drive cycle as the latent-fault detection interval, and a windscreen/sun-load temperature profile still to be defined. The doc routes approval to the safety manager."
  reversibility: easy
  blocks: "FMEDA stress factors (WP-H-03 §2.4), PMHF exposure times, LFM"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Adopt the proposals; derive TBDs from ODD and user data"
      detail: "Conservative and consistent across WP-H-03/04/05; needs operating-hours data."
    - key: B
      title: "Shorter item life with an end-of-life rule in WP-O-02"
      detail: "Lower PMHF figures, but commits operations to an end-of-life rule."
  sources: ["assurance/04-hardware/WP-H-05-random-hardware-failures-pmhf.md OI-2"]
  status: queued

- id: DQ-068
  question: "Does the safety manager confirm the proposed failure-rate sources (SN 29500 for parts, ST data or an IEC TR 62380-type model for the MCU)?"
  context: "The FMEDA needs one failure-rate handbook per part class. The proposal is SN 29500 with IEC 61709 for conversions, supplier FIT data for the STM32H7 if ST provides it, otherwise a die/package model as referenced in ISO 26262-11 (IEC TR 62380 is no longer maintained — status to verify). The doc asks the safety manager to confirm before numbers are filled in."
  reversibility: easy
  blocks: "FMEDA §6, WP-H-04/05 numbers"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Confirm the proposal in §2.3"
      detail: "Calculation can start with generic data now and part-specific later."
    - key: B
      title: "Choose a different handbook set"
      detail: "Rework of the first estimate (§6.3); may need purchase of another handbook."
  sources: ["assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md OI-2"]
  status: queued

- id: DQ-069
  question: "If ST's FIT data and safety package for the STM32H7 are unavailable or need a licence, does the project pay for them or write its own CPU/RAM self-tests with only 'low' coverage?"
  context: "Without ST's safety package (QE-03), LionDriver must write its own start-up and periodic CPU/RAM tests and may claim only low diagnostic coverage for the CPU, which may make the ASIL B single-point fault metric fail (WP-H-04 §5.1). WP-H-07 §5 says this fallback needs a safety-manager decision; the next step is to ask ST about availability and licence terms."
  reversibility: revisit
  blocks: "WP-H-03 OI-3 / OI-10 part-specific rates; SPFM for SG-01"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Obtain ST package/FIT data (licence if needed)"
      detail: "Best coverage argument; possible licence cost and terms."
    - key: B
      title: "Own self-tests, low CPU coverage"
      detail: "No licence; higher risk of missing the SPFM target."
    - key: C
      title: "Hardware adapter (DC-02) or lower claim"
      detail: "Moves coverage to LionDriver hardware or restricts the ASIL claim."
  sources: ["assurance/04-hardware/WP-H-07-hardware-component-qualification.md OI-2"]
  status: queued

- id: DQ-070
  question: "Should the project confirm with the external assessor that mechanisms on the QM main computer (SoC) get no diagnostic-coverage credit?"
  context: "The hardware metrics rule (§3.3) credits only mechanisms on the safety MCU, because the SoC is developed only to QM. This is conservative, but the assessor should agree it before G2, which presumes an assessor is engaged."
  reversibility: easy
  blocks: "WP-H-04 metric method, G2"
  gate: G2
  after: [DQ-009]
  options:
    - key: A
      recommended: true
      title: "Keep exclusion and get assessor agreement"
      detail: "Conservative; no SoC rework; needs assessor contact."
    - key: B
