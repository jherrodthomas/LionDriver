  note: "AOU-18 is Unverified: each vehicle needs a configuration review and a bus capture at the harness point (WP-C-01 §7). The inbox page also holds B (2026-10-25 00:14 UTC); the lead answered A in chat about two hours later, and the later answer stands."
- id: DQ-420
  question: "When an attacker, not a random fault, sets off a hazard, should the HARA say that the usual exposure rating does not apply?"
  context: >-
    The HARA rates every hazardous event with an exposure (E): how often the driving situation occurs, on the
    assumption that a fault strikes at a random moment. An attacker who controls the main computer can wait for the
    worst moment instead. **The cybersecurity analysis (TARA) already rates safety impact without exposure, so no
    risk value changes; the question is only whether the HARA says so, so that a reviewer does not read an ASIL's E
    as covering attacks.**
  reversibility: easy
  blocks: "Wording in WP-C-03 and the joint HARA/TARA view (hatara/) only; the cyber simulation works with any answer"
  gate: G1
  decider: lead
  asked: 2026-10-25
  batch: 17
  options:
    - key: A
      recommended: true
      title: "Add one note to the HARA and one row to the joint view; no rating changes"
      detail: "The row says an attacker-triggered event takes the worst situation, so E does not apply and the TARA's safety impact governs; WP-C-03 points to it. Cost: two short edits. Easy to undo."
    - key: B
      title: "Rate attacker-triggered events as their own hazardous events at the highest exposure (E4)"
      detail: "Explicit, but duplicates every event the main computer can cause and can raise ASILs for faults that are not random. Cost: the HARA model and both workbooks regenerated; mixes two methods."
    - key: C
      title: "Leave it to the TARA"
      detail: "No change. Cost: the gap stays implicit and an assessor may raise it."
  sources: ["LionDriver-security (private): assurance/sim/cyber/README.md §2.4, §6.1 choice 5 (moved there from PR #454, DQ-421 A)", "assurance/02-concept/WP-C-09-tara.md §3", "assurance/02-concept/hatara/hatara-interactions.md"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-26, by: u_X1u501HWo3YGVNlzcvkvmg}
  applied: {ref: "jherrodthomas/LionDriver#490", record: "WP-C-03 v0.12 §2 note: exposure assumes a random fault, an attacker-triggered event takes the worst situation and the TARA's safety impact governs; joint HARA/TARA view interaction IX-12 (hatara_model.py, table and figures). No rating changes", at: 2026-10-26}

- id: DQ-421
  question: "LionDriver is public. Should the details of security weaknesses that are not fixed yet move to a private repository until they are fixed?"
  context: >-
    WP-O-05 §4.4 already keeps a weakness that someone reports to us private until its fix ships (90-day embargo).
    The weaknesses we found ourselves are not treated that way: WP-C-09, WP-S-07 and the WP-M-09 gap table name many
    of them with the place in the code and what is missing, and the new cyber-simulation mocks (PR #454) show which
    controls on two attack paths are not built yet. **ISO/SAE 21434 and UN R155 expect unfixed-vulnerability details
    to be shared on a need-to-know basis.** The threat model itself (threats, risk values, goals, statuses) is normal
    to publish and the open safety case needs it. What has already been pushed may have been copied; restricting
    only reduces exposure from now on.
  reversibility: hard
  blocks: "PR #454 (cyber-simulation mocks, held as a draft until this is answered); WP-O-05 §4.4 scope; future edits of WP-C-09, WP-S-07 and the WP-M-09 gap table"
  gate: G1
  decider: lead
  asked: 2026-10-25
  batch: 16
  options:
    - key: A
      recommended: true
      title: "Split by sensitivity: threat model public, unfixed-gap details private"
      detail: "Threats, risks, goals and statuses stay public. Code locations and mechanisms of unfixed gaps, and the cyber-simulation mocks and clips, move to a private repository until their controls are verified, then are published. Cost: a one-time sweep of three documents and a rule for later edits."
    - key: B
      title: "Restrict only the new cyber-simulation material"
      detail: "Close PR #454 and keep the mocks private; the existing documents stay as they are. Cost: cheap, but the larger exposure, the gap details already in the public documents, remains."
    - key: C
      title: "Make the whole repository private"
      detail: "Strongest protection. Cost: ends the open-source, transparent-assurance aim of the project and every public link to it."
    - key: D
      title: "Keep everything public"
