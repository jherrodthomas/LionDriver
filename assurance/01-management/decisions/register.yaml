  blocks: "TSR-633 and the H-09 safe state; System FMEA SFM-ACT-005"
  gate: G2
  decider: lead
  after: [DQ-205]
  options:
    - key: A
      recommended: true
      title: "Keep the lane and slow to a stop, then hold and lock out"
      detail: "Steering stays on while the car decelerates in lane within the envelope limits, the alert keeps sounding, and the car holds at standstill before disengaging. Similar to the minimum-risk manoeuvre of automated lane keeping (UN R157). Cost: steering continues without a supervisor for the stop (about 10 s from 30 m/s at 3 m/s²), and standstill hold and hazard lights need work and vehicle tests."
    - key: B
      title: "Slow down for a fixed time, then disengage with the siren"
      detail: "Simpler: no standstill hold. Cost: the car is handed back to a driver who is not responding, while still moving."
    - key: C
      title: "Disengage at once with the siren"
      detail: "No extra development. Cost: an unsupervised car with no steering and no braking from the item; the worst outcome for an unresponsive driver."
