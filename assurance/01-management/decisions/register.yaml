    driver takes over (your DQ-365 answer, TSR-633). Today it brakes at 1.2 m/s², the gentlest rate the planner has:
    about 25 s and 390 m from 110 km/h. DQ-365 was described as about 3 m/s², and no requirement sets the rate. **A
    firmer stop shortens the time an unresponsive driver rides at speed; a gentler one gives following traffic more
    warning.** Found in the software FMEA re-rating at BL-007 (SWF-086.C2).
