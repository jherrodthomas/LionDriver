    - key: B
      title: "Keep fixed times, justify"
      detail: "No code change; record the residual as a SOTIF known gap with rationale."
  sources: ["assurance/08-analyses/WP-A-05-stpa.md OI-6"]
  status: queued

- id: DQ-078
  question: "Does the safety authority accept the residual risks listed for missing supplier evidence (no EMC/environment tests, teardown instead of schematic, handbook failure rates)?"
  context: "comma.ai and ST evidence may never arrive. WP-H-07 §5 proposes accepting most gaps with conditions (incoming inspection per batch, sensitivity margin, relay readback), but EMC and environmental robustness have no LionDriver test and 'must be recorded as residual risk' for the assessor; the relay gap is high risk unless DC-03 is added."
