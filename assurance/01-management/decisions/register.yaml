- id: DQ-096
  question: "Who approves the SOTIF validation targets before evidence is collected, now that there is no assessor?"
  context: "Targets VT-01…VT-15 set how many kilometres and test subjects are needed (for example, 20 subjects with no failures bound the chance of losing control at 0.14). ISO 21448 wants them fixed **before** evidence is collected, or the evidence can look fitted to them. The plan was assessor approval; with none (DQ-009 C), only you can freeze them. Some rates are illustrative until the crash baseline (B1) is chosen."
  reversibility: hard
  blocks: "All WP-V-03/WP-V-04 campaigns; WP-V-03 (TBC) thresholds; WP-C-11 (TBC) values"
  gate: G2
  decider: lead
  asked: 2026-10-19
  batch: 11
  options:
    - key: B
      recommended: true
      title: "You approve them once B1 crash data replaces the illustrative rates"
      detail: "Claude updates the derivations, you freeze the targets in a dated record, and an assessor reviews them later. Cost: SOTIF test campaigns wait for the B1 data; a later assessor may still ask for changes."
    - key: A
      title: "You approve the current proposals now"
      detail: "Campaigns can start at once. Cost: targets built on illustrative rates will likely change, and evidence collected before a change may not count."
    - key: C
      title: "Wait for an assessor to approve them"
      detail: "Strongest independence. Cost: no SOTIF evidence until an assessor is engaged."
  sources: ["assurance/06-validation/WP-V-02-sotif-vv-strategy.md OI-3", "assurance/09-production-operation/WP-O-04-field-monitoring.md OI-5"]
  status: applied
  answer: {choice: B, via: inbox, at: 2026-10-19, by: u_DgEswP8TFzpISXlzh3BD1g}
  applied: {ref: 6e3828c, record: "WP-V-02 v0.11 OI-3, §4; WP-O-04 v0.2 OI-5 (#266)", at: 2026-10-19}

