- id: DQ-162
  question: "How should the driving and monitoring models be loaded safely: check their hash first and keep today's format, or move to a format that cannot run code?"
  context: >-
    The models are loaded with Python's pickle, which can run code, and nothing checks their hash at load (GAP-22).
    AIR-19 requires a check against the signed release manifest before loading, and AIR-20 forbids code-running
    loading of anything that has not passed it. **A hash check meets both with a small change; a new format removes
    the risk entirely but changes upstream runtime code.**
  reversibility: revisit
  blocks: "AIR-19, AIR-20; GAP-22; RM-1; WP-W-10 OI-5; WP-C-11 OI-4; WP-M-10 OI-6"
  gate: G3
  decider: claude
  asked: 2026-10-26
  batch: 18
  options:
    - key: A
      recommended: true
      title: "Check each artefact's hash against the release manifest before loading it"
      detail: "Meets AIR-19 and AIR-20 as written, and engagement is refused on a mismatch. Cost: a signed manifest has to exist (RM-1), and the code-running format stays behind the check."
    - key: B
      title: "Replace pickle with a format that cannot run code"
      detail: "Removes the risk class. Cost: changes to modeld and to how tinygrad's compiled models are stored, carried at every upstream sync."
    - key: C
      title: "Both: the hash check now, the new format later"
      detail: "Meets the requirements now and removes the risk later. Cost: the two changes in sequence."
  sources: ["assurance/05-software/WP-W-10-ml-engineering.md OI-5", "assurance/02-concept/WP-C-11-ai-system-definition-and-safety-requirements.md AIR-19, AIR-20, OI-4", "assurance/01-management/WP-M-10-ai-safety-plan.md OI-6", "assurance/00-assessment/gap-assessment.md GAP-22", "DQ-170 (merged here)", "DQ-188 (merged here)"]
