  question: "Closing on slower traffic is now rated E4, as you chose. That also raises the goal against silently lost braking (SG-06) to ASIL C. Accept it?"
  context: "You chose the frequency reading for closing on a slower car at highway speed, which makes the acceleration goal SG-03 ASIL C. An exposure class belongs to the situation, not to one hazard, so the same E4 applies when braking is silently lost in that situation (HE-06.1) or the display wrongly shows ACC active (HE-07.3). **Both become ASIL C, and SG-06 with them.** Your question only named SG-03."
