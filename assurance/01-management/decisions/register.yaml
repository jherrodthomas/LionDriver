      recommended: true
      title: "Measure queue occupancy on the HIL bench first; add a queue only if needed"
      detail: "Decides on evidence, with the PCS timing measurement of DQ-134. Cost: waits on the bench."
    - key: B
      title: "Add a reserved forwarding queue now"
      detail: "Removes the dependency on host behaviour. Cost: a change in the CAN driver of the safety MCU, with its own analysis and tests."
