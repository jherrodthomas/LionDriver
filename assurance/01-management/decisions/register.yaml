  sources: ["assurance/01-management/WP-M-01-assurance-strategy.md D-14"]
  status: queued

- id: DQ-075
  question: "How will LionDriver deliver software updates: a signed release manifest with a project-held key, or manual-only installation?"
  context: "Today the updater pulls an unsigned git branch (GAP-26). The target in WP-S-07 §3.6 is a release manifest signed with an offline update key and verified on the device (CSR-121); until then updates are disabled and installed manually (CSR-124, TSR-810). WP-S-06 OI-1 also asks the maintainer to define the release channel, key and build pipeline."
  reversibility: revisit
