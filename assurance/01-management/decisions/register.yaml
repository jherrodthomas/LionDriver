  context: "All target-level, fault-injection and on-device verification today runs only on comma's private farm; the fork has none (GAP-30, R-06 High). A plan exists (hil-bench/README.md) and HIL tests test_10...test_14 are written but not run; no parts are bought. The decision is due at G2, the bench at G3, and 4-8 person-weeks of P4 effort are attributed to it."
  reversibility: easy
  blocks: "GAP-30, R-06; WP-W-08, WP-V-05, WP-M-14 Phase E; G4"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Minimal bench per hil-bench plan"
      detail: "Bare panda or comma device, >= 3 CAN interfaces, host PC replay, fault-injection power supply, debug probe; modest cost, unblocks HIL evidence."
    - key: B
      title: "Defer bench"
      detail: "No target evidence; G4 cannot pass and at-risk changes earn no credit."
  sources: ["assurance/01-management/WP-M-01-assurance-strategy.md D-04", "assurance/05-software/hil-bench/README.md A-1"]
  status: queued

- id: DQ-050
  question: "If controllability tests fail to show C1, do we activate the fallback decomposition DEC-01 (an independent second limiter) including for the longitudinal and override goals?"
  context: "DEC-01 is a documented but unbuilt fallback: an independent second element (E-07) that would carry half of a decomposed ASIL. It is only needed if the controllability tests (WP-C-04 OI-2) fail and option (a) is not reachable; failed AoU verification (AOU-03/05) could extend it to SG-03/04/05. Activating it means new hardware, new TSRs and repeating the DFA."
  reversibility: hard
  blocks: "WP-C-01/WP-S-03 element E-07, new TSRs in WP-S-02, WP-A-03 OI-5"
  gate: G2
  after: [DQ-007]
  options:
    - key: A
      recommended: true
      title: "Decide after controllability tests"
      detail: "No hardware spend now; risk that a failed test forces a late re-plan."
    - key: B
      title: "Activate DEC-01 now"
      detail: "Start hardware/architecture work for E-07 early; cost and schedule hit even if C1 is later shown."
  sources: ["assurance/08-analyses/WP-A-01-asil-decomposition.md OI-2", "assurance/03-system/WP-S-03-technical-safety-concept-architecture.md OI-3"]
  status: queued

- id: DQ-051
  question: "Will LionDriver accept a scope change to add an external or independent monitor if the FMEDA/DFA show the single-channel panda cannot meet the assigned ASIL?"
  context: "The panda MCU is single-channel and shares power, clock and board with the QM SoC, and no supplier reliability data exists; R-02 and R-09 are High risks due G2. WP-M-03 lists hardware redesign as out of scope, with an external monitor only as a scope change through change management; the decision is needed early (G2) to avoid late rework."
  reversibility: hard
  blocks: "G2 hardware route (FSA-I2); WP-H-03/H-04/H-05; WP-A-03"
  gate: G2
  after: [DQ-007]
  options:
    - key: A
      recommended: true
      title: "Decide at G2 from FMEDA/DFA results"
      detail: "Run the analyses first; pre-agree that an external monitor is an allowed scope change with a budget envelope."
    - key: B
      title: "Rule out added hardware"
      detail: "Accept a limited ASIL claim and record residual limitations in the safety case."
    - key: C
      title: "Commit to an external monitor now"
      detail: "Start hardware design early; highest cost, may be unnecessary if D-13 lowers SG-01 to ASIL B."
  sources: ["assurance/01-management/WP-M-07-risk-management.md R-02", "assurance/00-assessment/docs-safety-reconciliation.md OI-3", "assurance/04-hardware/WP-H-01-hardware-safety-requirements.md OI-6"]
  status: queued

- id: DQ-052
  question: "How should the ASIL A false-forward-collision-warning requirement (FSR-04.06) be met when the warning runs on the QM SoC?"
  context: "FSR-04.06 (no false FCW causing harmful reaction) carries ASIL A but is allocated to the comma SoC, which is QM. One of three routes must be chosen; two of them change the hazard rating or architecture."
  reversibility: revisit
  blocks: "FSR-04.06 allocation; TSR-625; FSC completeness at G2"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Show by SOTIF validation that the false-warning consequence is not credible (re-rate HE-04.5)"
      detail: "Uses validation data; changes the HARA rating, needs HARA owner and evidence."
    - key: B
      title: "Develop the FCW trigger path to ASIL A"
      detail: "ASIL A process for the SoC-side trigger path; moderate-to-high effort on a QM platform."
    - key: C
      title: "Move the warning to an ASIL-capable element"
      detail: "Architecture change (e.g. into the safety MCU); moderate effort."
  sources: ["assurance/02-concept/WP-C-04-functional-safety-concept.md OI-9", "assurance/05-software/WP-W-02-software-safety-requirements.md SWSR-625"]
  status: queued

- id: DQ-053
  question: "How should the system react when the driver steers against it, including light steering below the 100-raw override threshold?"
  context: "Today a driver steering against LionDriver only freezes an integrator; lateral control stays active and the panda's limits ignore driver torque (LS-01). Light corrections below the threshold are never detected and get no cue (LS-02). The fix is a SoC-side counterpart to TSR-304 (stop or reduce torque during override), a rule for sub-threshold torque (CC-1), and an override indication in the HMI (CC-2)."
  reversibility: revisit
  blocks: "SG-05 override argument, TSR-304, HMI requirements"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Reduce/stop torque on override plus HMI cue"
      detail: "Add SoC requirement mirroring TSR-304, define sub-threshold handling, add override indication; code and HMI changes before G2."
    - key: B
      title: "Override indication only"
      detail: "HMI change only, steering behaviour unchanged; LS-01 stays a known gap."
    - key: C
      title: "Leave as known gap"
      detail: "No change; LS-01/LS-02 remain in the safety case as defeaters."
  sources: ["assurance/08-analyses/WP-A-05-stpa.md OI-2"]
  status: queued

- id: DQ-054
  question: "If a watchdog reset while engaged leaves the SoC-independent siren silent, do we keep an engagement flag across the reset or relax TSR-516?"
  context: "When the panda's watchdog resets the microcontroller during engaged driving, it reboots silent and its own siren cannot sound; only the SoC's alert within about 0.5 s warns the driver (LS-04). First a bench test must confirm the behaviour. Then either the firmware keeps an 'engaged' flag across reset (backup SRAM or reset-cause check) so the siren sounds, or TSR-516 is amended to accept the SoC alert as the only reaction."
  reversibility: revisit
  blocks: "TSR-516, SG-02/SG-06 warning argument"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Keep engagement flag across reset"
      detail: "Firmware change in panda; siren sounds independently of the SoC; restores the independent warning path."
    - key: B
      title: "Amend TSR-516"
      detail: "No firmware change; accept that the warning depends on the QM SoC for this path, which is a risk acceptance against SG-02/SG-06."
  sources: ["assurance/08-analyses/WP-A-05-stpa.md OI-3"]
  status: queued

- id: DQ-055
  question: "Should the envelope (safety limit) values be derived separately from the controller tuning values?"
  context: "The controller and the panda safety envelope use identical constants (e.g. torque 1500, accel -3.5/+2.0) from the same upstream authors with no derivation record (DFI-08). So a wrong value is wrong in both places and the envelope never trips, and normal driving runs exactly at the enforcement boundary. The DFA's measure is a separate, reviewed derivation of envelope limits from controllability evidence, with controller limits set below them."
  reversibility: revisit
  blocks: "DFI-08, IC-03 independence claim, TSR-102/103/201/202/204/205/605"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Separate derivation with margin"
      detail: "Envelope limits from a reviewed controllability record; controller limits set lower (FSR-01.14, TSR-605); tests cite requirement IDs; diverges from upstream values."
    - key: B
      title: "Keep shared values, accept coupling"
      detail: "No divergence from upstream; DFI-08 stays rated N (not adequately controlled) and weakens the independence claim."
  sources: ["assurance/08-analyses/WP-A-03-dependent-failure-analysis.md OI-3"]
  status: queued

- id: DQ-056
  question: "Should LionDriver read selected vehicle fault codes (e.g. EPS, VSC) itself and block engagement, instead of relying on the driver's warning-lamp check?"
  context: "Today the driver is told to check dashboard lamps before engaging (OPS-01). Reading DTCs directly would stop engagement on a faulty steering or stability system without relying on the driver, at the cost of UDS diagnostics work."
  reversibility: revisit
  blocks: "OPS-01, AoU on vehicle health"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Read DTCs and block engagement"
      detail: "Automated protection; firmware/software work on diagnostics."
    - key: B
      title: "Keep driver lamp check"
      detail: "No work; relies on the driver as an assumption of use."
  sources: ["assurance/09-production-operation/WP-O-02-operation-service-decommissioning.md OI-2"]
  status: queued

- id: DQ-057
  question: "What confidence level and statistical method define 'meets the validation targets with stated confidence' for unknown-scenario evaluation (R-08)?"
  context: "R-08 is a SOTIF release criterion. The confidence level determines how much driving or evaluation is needed and how much residual risk is accepted at release."
  reversibility: revisit
  blocks: "R-08, WP-V-02, SOTIF release"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Set in WP-V-02 (e.g. one-sided 95 % bound as used elsewhere)"
      detail: "Consistent with WP-V-02 §3.3 method; fixes data needs."
    - key: B
