      detail: "Evidence for real highway speeds. Cost: a higher-risk test plan and a site that allows it."
    - key: B
      title: "Cap the ODD at 90 km/h"
      detail: "No high-speed testing. Cost: the system must refuse or warn above 90 km/h, which limits it on most highways."
  sources: ["assurance/process/README.md “4. **The SOTIF release argument waits on evidence from other”"]
