- id: DQ-407
  question: "When a fault makes LionDriver hand back control, may the gentle slow-down start together with its alert, or must it wait 1 s after the alert?"
  context: >-
    TSR-624 asks that braking not caused by traffic be announced at least 1 s before it starts (the 1 s is marked
    proposed). The driver-monitoring stop now meets that: the last alert counts down 5 s before the car slows. **A fault
    soft disable does not: the car starts slowing on the same frame as its alert.** That slow-down is gentle, at most
    −1.2 m/s² over the 3 s before control is handed back (about 13 km/h at most), and the alert sounds from its first
    frame. Waiting 1 s means driving on for that second with the fault still active. The failure search over the
    plant model (synthetic, no evidence credit) tried all three orders with a follower as close as 0.5 s and with a
    slower lead ahead: none ended in contact, and the order moved the smallest gap by about 1 m at most to the follower and
    by at most about 7 m to the lead.
  reversibility: revisit
  blocks: "TSR-624, SWSR-624 and FSR-04.05 for the fault soft disable; SW FMEA SWF-050.C1, SWF-ACT-050; WP-A-04 SFMEA-36"
  gate: G3
  decider: lead
  asked: 2026-10-22
  batch: 14
  figure: figures/dq-407.svg
  caption: >-
    What each option does in the 3 to 4 s between the fault and the hand-back. B and C add a second at speed with
    the fault still active; C also keeps the item in control a second longer. In the plant search none of the three
    ended in contact.
  options:
    - key: A
      recommended: true
      title: "Keep it: slow down from the first frame of the alert, and write that exception into TSR-624"
      detail: "No behaviour change. TSR-624, SWSR-624 and FSR-04.05 say the 1 s lead time applies to the driver-monitoring stop, not to a fault soft disable, with this rationale. Cost: a reviewer has to accept a mild slow-down that is announced as it starts rather than before."
    - key: B
      title: "Wait 1 s after the alert, then slow down for the remaining 2 s"
      detail: "Meets TSR-624 as written, and the soft disable still lasts 3 s. Cost: one more second at speed with the fault active, and only 2 s of slowing (about 9 km/h at most) before control is handed back."
    - key: C
      title: "Make the soft disable 4 s: 1 s of alert, then 3 s of slowing"
      detail: "Meets TSR-624 and keeps today's slowing. Cost: the item keeps steering and braking for one more second on a faulty input, against the stale-input finding FM-03 (WP-C-07) and the timing budgets that assume 3 s."
  sources: ["assurance/03-system/WP-S-02-technical-safety-requirements.md TSR-624", "assurance/05-software/WP-W-02-software-safety-requirements.md SWSR-624", "assurance/02-concept/WP-C-04-functional-safety-concept.md FSR-04.05", "assurance/08-analyses/fmea/analyses/sw-fmea.yaml SWF-050.C1, SWF-ACT-050", "assurance/08-analyses/WP-A-04-system-fta-fmea.md SFMEA-36", "openpilot/selfdrive/selfdrived/state.py SOFT_DISABLE_TIME", "openpilot/selfdrive/controls/lib/longitudinal_planner.py A_CRUISE_MIN", "assurance/sim/results/edge-cases.md hand-over rows (handover-follower, handover-slower-lead)", "assurance/sim/results/search-handover-follower.md", "assurance/sim/results/search-handover-slower-lead.md"]
