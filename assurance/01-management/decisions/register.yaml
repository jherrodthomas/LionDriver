  context: >-
    Forwarded camera frames (the stock pre-collision braking, SG-07) and the host's frames share one CAN transmit
    queue. The TX-rate check bounds the host's share but does not reserve room for forwarding (DN-01 §7). **SG-07's
    budget already has no margin (DQ-134), so any extra queueing delay counts.**
