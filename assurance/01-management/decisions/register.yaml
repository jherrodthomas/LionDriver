  context: >-
    A frame can pass the transmit check just before authority is revoked and still be sent (race R-5, WP-W-03 §5.4).
    The race analysis bounds it to one frame. **A re-check of a few instructions closes it outright.** ATC-18 marks it
    optional under the priority scheme and not decided.
  reversibility: easy
