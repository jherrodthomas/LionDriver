- id: DQ-300
  question: "When the car's own emergency braking (stock AEB) fires, should LionDriver stop asking for acceleration, or keep driving as now?"
  context: "Today the car's AEB event only shows a \"BRAKE!\" alert on the comma screen; LionDriver keeps sending its speed-control request. Whether the car's braking wins then depends on the engine computer giving AEB priority, which nobody has checked on the reference car (AOU-04R). The fault tree marks this as a path where that assumption alone protects the driver (SFM-036, FTA BE-7.13)."
  reversibility: easy
  blocks: "SFM-ACT-020; FTA cut set MCS-07.10 (SG-07)"
  decider: lead
  options:
  - key: A
    recommended: true
    title: Stand down during stock AEB
    detail: "While the car reports an AEB event, LionDriver requests zero acceleration (no added drive), and the AOU-04R test still runs. Cost: a software change and its tests; a false AEB report would also cut speed control briefly."
  - key: B
    title: Keep today's behaviour, prove the car's priority by test
    detail: "No software change. Cost: stock AEB rests entirely on the AOU-04R vehicle test passing; until then the path stays open."
  - key: C
    title: Disengage longitudinal control on stock AEB
    detail: "Hands longitudinal control back to the driver with an alert. Cost: an abrupt handback in an emergency, plus the same software work as A."
  sources:
  - assurance/08-analyses/fmea/analyses/system-fmea.yaml SFM-036, SFM-ACT-020
  - assurance/08-analyses/WP-A-04-system-fta-fmea.md MCS-07.10
  - assurance/02-concept/WP-C-04-functional-safety-concept.md AOU-04R
  status: queued

- id: DQ-360
  question: "If the steering (EPS) or the engine controller (PCM) silently stops obeying LionDriver, without sending a fault, do we rely on a tested assumption about the car, or add a check that compares the car's response with the command?"
  context: "The fault trees for loss of steering (SG-02) and loss of braking (SG-06) assume the EPS and PCM report when they stop acting on our requests. If either just ignores them without a fault code, **neither the main computer nor the safety chip notices**, and only the driver can catch it. No assumption of use states that the car always reports this."
  reversibility: revisit
  blocks: "MCS-02.10, MCS-06.11 (WP-A-04 v1.2); AOU set of WP-C-01; TSR-626; WP-A-03 OI-8"
  gate: G2
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Add an assumption of use and test it on the car"
      detail: "State that the EPS signals every LKA drop and the PCM every ACC non-execution, and check it with forced faults in the vehicle tests. If a test finds a silent drop, come back to option B. Cost: a few fault-injection runs."
    - key: B
      title: "Add a response check in the item"
      detail: "Compare measured steering and acceleration with the command and warn on a mismatch (TSR-626, WP-A-03 OI-8). Cost: a new safety requirement, tuning against false alarms, and its own verification."
    - key: C
      title: "Do both"
      detail: "Tested assumption now, response check before release. Cost: the sum of A and B."
  sources: ["assurance/08-analyses/fta-fmea-mapping.md F-32", "assurance/08-analyses/WP-A-04-system-fta-fmea.md MCS-02.10, MCS-06.11"]
  status: queued

- id: DQ-361
  question: "Do the two \"take-over warning\" goals (SG-02 steering, SG-06 braking) also cover the system being too weak by design, such as a curve too tight for the torque limit or a lead car seen too late, or only faults?"
  context: "SG-02 says \"lose or degrade\" lateral control. The fault trees now include **insufficient performance** branches: a curve the steering limit cannot hold, and a lead missed or seen late. In both, the only warning comes from the same main computer that fell short. Keeping them in the goals makes the fault trees and SOTIF analysis carry them together; leaving them out moves them to SOTIF alone."
  reversibility: revisit
  blocks: "G2.8 and MCS-02.12, G6.9 and MCS-06.10 (WP-A-04 v1.2); WP-C-06 SH-06; WP-C-03 OI-7"
