- id: DQ-001
  ref: B-06
  question: "Should a new install start in Chill mode instead of Experimental?"
  context: >-
    You already decided (D-08, 2026-10-10) that the reference car runs in Chill until Experimental
    is validated. The code still defaults to Experimental, so a device that skips the setup steps
    runs outside what we assessed. **This is the code change that enforces your decision.**
  reversibility: easy
  blocks: "Closes risk R-17 and STPA gap LS-31"
  gate: G1
  asked: 2026-10-14
  proceed_after: 2026-10-15
  figure: figures/dq-001.svg
  caption: "What a freshly installed device starts in."
  options:
    - key: A
      recommended: true
      title: "Change the code default to Chill"
      detail: "Every new install starts in Chill. Cost: differs from upstream openpilot; testers who want Experimental switch it on themselves."
    - key: B
      title: "Keep the default; enforce it with release steps and a boot check"
      detail: "No code change to the default. Cost: depends on people following the setup steps; LS-31 stays open until the boot check exists."
    - key: C
      title: "Lock the reference car to Chill and hide the toggle"
      detail: "Strongest guarantee. Cost: removes owner choice and needs UI changes; harder to undo."
  sources: ["WP-M-07 D-08 / R-17", "WP-M-03 B-06", "WP-A-05 LS-31", "openpilot/common/params_keys.h:43"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-14, by: u_DgEswP8TFzpISXlzh3BD1g}
  applied: {ref: 38d3320, record: "WP-M-07 D-08; change record change-2026-10-14-chill-mode-default.md", at: 2026-10-14}

- id: DQ-002
  ref: F-3
  question: "Does the deceleration goal (SG-04) need its own hardware FMEDA?"
  context: >-
    The fault tree for SG-04 includes a hardware fault that changes the CAN frame after the safety
    check. Today only the steering FMEDA (SG-001) rates that fault. Steering and deceleration
    commands go out through **the same transmit hardware**, so its numbers apply to both.
  reversibility: revisit
  blocks: "Last open item of the SG-04 FTA–FMEA review"
  gate: G2
  asked: 2026-10-14
  figure: figures/dq-002.svg
  caption: >-
    The shared hardware passes ASIL B, which SG-04 needs. It misses ASIL C by 0.1 percentage points
    on SPFM (96.9 % against 97 %), which matters only if AOU-05 fails. All rates are generic until
    there is a parts list.
  options:
    - key: A
      recommended: true
      title: "Reuse the SG-001 FMEDA and record why"
      detail: "Add SG-04 to the trace of the shared rows (FMD-002, FMD-010) with a short rationale. Cost: an assessor may still ask for SG-04-specific failure modes."
    - key: B
      title: "Build a separate SG-04 FMEDA now"
      detail: "Own SPFM, LFM and PMHF for the deceleration path. Cost: a full analysis whose numbers would mostly repeat SG-001 until real part data exists."
    - key: C
      title: "Defer until supplier failure rates exist"
      detail: "Do it once at the hardware gate. Cost: F-3 stays open through G1 and G2."
  sources: ["fta-fmea-mapping.md F-3", "fmeda-sg001.yaml FMD-002, FMD-010", "fmea-plan.md §metrics", "WP-C-03 SG-04"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-14, by: u_DgEswP8TFzpISXlzh3BD1g}
  applied: {ref: 38d3320, record: "fta-fmea-mapping.md F-3; fmeda-sg001.yaml FMD-002, FMD-010", at: 2026-10-14}

- id: DQ-003
  ref: OI-1
  question: "Is “the driver stops supervising” a rated HARA hazard, or a misuse hazard under SOTIF?"
  context: >-
    The STPA found this hazard, and the HARA doesn’t rate it. Where it goes decides whether
    **driver monitoring** must meet an ASIL, which the current hardware cannot do.
  reversibility: hard
  blocks: "HARA baseline for G1; tied to FSC OI-3"
  gate: G1
  asked: 2026-10-14
  figure: figures/dq-003.svg
  caption: "Follow each column down to see what the choice commits you to."
  options:
    - key: A
      title: "Add it to the HARA as a rated hazard"
      detail: "The most conservative reading. Cost: driver monitoring gets an ASIL it can’t meet today, so the ODD shrinks (for example hands-on required) or new hardware is needed."
    - key: B
      recommended: true
      title: "Keep it as a SOTIF misuse hazard"
      detail: "Matches the FSC proposal that driver monitoring stays QM. Cost: rests on the assessor accepting it at the I3 review; if not, you redo this as A."
    - key: C
      title: "Ask the assessor first"
      detail: "Bundle it with OI-3 into the I3 confirmation review and decide after. Cost: the HARA baseline waits for that review."
  sources: ["WP-A-05 §2 H-STPA-1, OI-1", "WP-C-04 §7 (driver monitoring not given an ASIL; OI-3)", "WP-C-08 MC-01…MC-03"]
  status: applied
  applied: {ref: "jherrodthomas/LionDriver#96", record: "WP-C-03 v0.4 §1, §3 (OS-17, OS-18), §5 (HE-01.5, HE-02.6, HE-03.6, HE-06.4, HE-07.4); WP-C-08 v0.3 §6.1", at: 2026-10-16}
  answer: {choice: other, via: inbox, at: 2026-10-14, by: u_DgEswP8TFzpISXlzh3BD1g, note: "Both SOTIF and HARA Foreseeable Misuse"}
  note: "Supersedes the first answer (B, SOTIF only), applied in 38d3320. SOTIF side applied in aae16af (WP-C-05 §4; WP-C-08 MC-01…MC-03); HARA side is WP-C-03 v0.4, as foreseeable-misuse situations OS-17 and OS-18."

