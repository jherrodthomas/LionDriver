- id: DQ-139
  question: "May simulation results count as validation evidence, and for which kinds of scenario?"
  context: "LionDriver is adapting the MetaDrive simulator to drive the reference Corolla with the real panda safety code in the loop. Simulation can run thousands of trials where the closed course runs tens, but its images, radar and vehicle response are models. **Credit would cut physical testing; wrong credit would hide a real weakness.** The plan (WP-V-02 §5.3) groups scenarios into seven families and gives credit only per family, after at least 5 matched closed-course trials agree."
  reversibility: revisit
  blocks: "WP-V-03 M4 results; WP-V-04 decomposition; tool classification (WP-P-07)"
  gate: G2
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Credit per family, only after its fidelity case passes"
      detail: "Families like driver override (the panda code is the item's own) can earn credit; weather and lighting cannot. Cost: matched closed-course trials for each family, and the assessor must accept the case."
    - key: B
      title: "Never credit simulation; use it to explore only"
      detail: "Simplest argument. Cost: every scenario-level target is shown on the closed course or road, which takes far more trials."
    - key: C
