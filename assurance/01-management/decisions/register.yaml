      detail: "Better metrics but needs SoC parts developed to the ASIL — major effort."
  sources: ["assurance/04-hardware/WP-H-04-hardware-metrics.md OI-3"]
  status: queued

- id: DQ-071
  question: "Should the project agree with the external assessor to use vehicle-side protections (EPS torque limit, PCM clamp, PCS priority) in the hardware effect analysis?"
  context: "Faults that only stop transmission become 'safe' for SG-01 if the EPS really limits and times out LKA torque. These vehicle measures are outside the item and unverified (AoUs). The doc uses them only in the effect analysis, never as diagnostic coverage, and reports PMHF with and without them."
  reversibility: easy
  blocks: "PMHF calculation; AOU-01R/04R/05R verification (vehicle tests)"
  gate: G2
  after: [DQ-009]
  options:
    - key: A
      recommended: true
      title: "Use in effect analysis only, report both variants"
      detail: "Realistic figures, still conservative; needs assessor agreement and vehicle characterization."
    - key: B
      title: "Do not use them"
      detail: "All such faults count as single-point; worse PMHF and possibly forces DC-02/DC-03."
  sources: ["assurance/04-hardware/WP-H-05-random-hardware-failures-pmhf.md OI-3"]
  status: queued

- id: DQ-072
  question: "During validation, should the reference configuration run with fixed offline values instead of online-learned parameters?"
  context: "The host learns torque, steering ratio, calibration and delay while driving and keeps them across drives, without any release; learned values are not configuration-controlled. Freezing them makes validation reproducible, but then validation does not show the shipped learning behaviour."
  reversibility: revisit
  blocks: "Validation plan reproducibility; DVR-18…DVR-21"
  gate: G2
  options:
    - key: A
      recommended: true
      title: "Freeze for validation runs, separate campaign with learning on"
      detail: "Reproducible results plus some evidence for learning; more drives."
    - key: B
      title: "Validate with learning on, log the learned state"
      detail: "Representative; results harder to reproduce."
    - key: C
      title: "Disable learning in the reference release"
      detail: "Reproducible and representative; changes product behaviour and may degrade control quality."
