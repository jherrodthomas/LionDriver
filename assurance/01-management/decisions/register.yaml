      recommended: true
      title: "Keep performance limits inside SG-02 and SG-06"
      detail: "The trees keep the branches, as SG-04 already keeps false braking; SOTIF evaluates the rates. Cost: two more single points to argue in the safety case."
    - key: B
      title: "Faults only; performance limits go to SOTIF alone"
      detail: "Remove G2.8 and G6.9 and justify the three FMEA modes as SOTIF. Cost: the goals' wording should be narrowed to match, and the SOTIF case carries these hazards without the fault-tree view."
  sources: ["assurance/08-analyses/fta-fmea-mapping.md F-33", "assurance/08-analyses/WP-A-04-system-fta-fmea.md G2.8, G6.9"]
  status: queued

- id: DQ-362
  question: "SG-02, SG-03 and SG-06 are now ASIL C, and the hardware analysis they share misses the ASIL C single-point target by 0.16 points. Do we reuse it and close the gap at the hardware gate, or build a separate analysis for each goal?"
  context: "Their random hardware faults run through the parts already rated for SG-001 (safety chip, CAN transceivers, harness box). For SG-04 (ASIL B) you allowed reuse (DQ-002). Since HARA v0.4 these three goals are ASIL C, and the shared path gives **SPFM 96.84 % against the 97 % ASIL C target** (LFM 88.94 % meets 80 %). The figures use generic failure rates; supplier rates, or the transmit read-back of TSR-517, could close the gap."
