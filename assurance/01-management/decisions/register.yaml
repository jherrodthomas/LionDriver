- id: DQ-220
  question: "When the driver stays unresponsive at the final driver-monitoring alert, should the car keep steering while it slows to a stop, or hand steering back?"
  context: "Today the final alert (\"DISENGAGE IMMEDIATELY\") is a warning only. After 5 s at that level the item slows the car to a stop **while it keeps steering**, and it never disengages by itself. FSR-040 asks for the SG-010 safe state, but nothing records which behaviour that is. This decides what the item does with a driver who may be asleep."
  reversibility: hard
  blocks: FSR-040 safe state, SW FMEA SWF-062 / SWF-ACT-059, SG-010 (ASIL A)
  gate: G3
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Keep steering and slow to a stop in the lane (today's behaviour), and record it as the SG-010 safe state"
      detail: "No code change; the car stays in its lane while it stops. Cost: the safe state relies on lateral control staying correct for the whole stop, which needs a stop-time and lane-keeping argument and a vehicle test."
    - key: B
      title: "Slow to a stop, then disengage with hazard lights at standstill"
      detail: "Ends automation once the car is stopped. Cost: a code change (hazard lights, disengage at standstill) and a vehicle test; behaviour at standstill on a road needs its own hazard check."
    - key: C
      title: "Disengage at the final alert and hand steering back"
      detail: "Simplest to argue for the automation. Cost: an unresponsive driver then has no lateral control at speed; likely worse for the hazard SG-010 covers."
