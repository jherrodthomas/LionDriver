- id: DQ-108
  question: "What discovery-trend criterion and target (R3) must unknown-scenario exploration meet before release?"
  context: "R3 says the rate of finding new hazardous scenario classes must be non-increasing over the last three blocks, with a Good-Turing 'unseen class' probability reported, but the target value is not set. This is effectively the stop criterion for residual-risk acceptance of unknown scenarios and must be agreed with the assessor."
  reversibility: revisit
  blocks: "WP-V-04 residual-risk exit; release"
  options:
    - key: A
      recommended: true
      title: "Propose a numeric Good-Turing threshold plus the 3-block trend rule to the assessor"
      detail: "Gives a clear exit criterion; needs assessor engagement."
    - key: B
      title: "Use the trend rule only, report the probability without a threshold"
      detail: "Easier to meet, weaker argument; assessor may reject."
  sources: ["assurance/06-validation/WP-V-04-sotif-unknown-scenarios.md OI-2"]
  status: queued

- id: DQ-109
