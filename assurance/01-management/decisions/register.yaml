- id: DQ-400
  question: "The closed-loop driving simulation cannot run in real time on GitHub's free 4-core runners. Should it run on your own computer as a self-hosted runner, on a paid larger GitHub runner, or stay off CI for now?"
  context: "The MetaDrive simulation drives the reference Corolla with the full openpilot stack and the panda safety code in the loop (PR #124). On the free runner, the rendered road (MetaDrive's terrain) takes about 160 ms per camera frame. That is about 6 frames per second against the 20 openpilot needs, measured on a 4-core machine like the runner. In CI the driving model then dropped a third of its frames, so camera odometry, calibration and localization were never valid and the test could not engage. Smaller images do not help (126 ms at a quarter of the size); turning the terrain off is fast but removes the road and lane lines. Results get no credit either way (WP-V-02 §5.3); this is about having a working closed-loop check at all."
  reversibility: easy
  blocks: "Closed-loop simulation in CI: the re-enabled simulator_driving job (PR #124), and the later MetaDrive scenario runs (WP-V-02 §5.3, M4)"
  gate: G4
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Self-hosted runner on a computer you already have, ideally with a graphics card"
      detail: "Free if the machine exists; a GPU renders the scene in real time. Cost: the machine must be on for CI, and a self-hosted runner on a public repository should only run trusted branches (the job would be limited to this repository's own PRs)."
    - key: B
      title: "Paid larger GitHub runner (8 or more cores)"
      detail: "No hardware to look after. Cost: billed per minute; still CPU rendering, so real-time speed is not certain until measured."
    - key: C
      title: "Keep the closed-loop job off CI for now"
      detail: "No cost. The plant model and esmini scenario checks keep running; the full-stack loop is run by hand when needed. Cost: no automatic end-to-end check."
  sources: ["openpilot/tools/sim (PR #124, simulator_driving job logs 2026-10-16)", "assurance/06-validation/WP-V-02-sotif-vv-strategy.md §5.3.1", "assurance/sim/README.md §6"]
