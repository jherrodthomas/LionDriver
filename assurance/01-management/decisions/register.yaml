- id: DQ-066
  question: "Which method should be used for the random hardware failure target: one overall probability, a per-fault check, or both?"
  context: "ISO 26262-5 §9 allows one overall failure probability (PMHF, method 1) or a per-fault evaluation (EEC, method 2). The proposal is PMHF plus an EEC-style check of the biggest contributors (MCU core, SRAM, harness switch), so a good total cannot hide one uncovered part. As safety manager, you approve the method before the calculation starts; the ASIL C single-point miss stays open for G2 (DQ-362 A)."
  reversibility: easy
  blocks: "WP-H-05 calculation (OI-1); G2 method record"
  gate: G2
  asked: 2026-10-19
  batch: 10
  options:
    - key: A
      recommended: true
      title: "PMHF plus a per-cause check of the biggest contributors"
      detail: "One figure to compare with the ASIL C target, and no single weak part hidden in it. Cost: moderate effort."
    - key: B
      title: "Per-fault evaluation (EEC) only"
      detail: "Every part seen on its own. Cost: more work and harder to summarise for the safety case."
    - key: C
      title: "PMHF only"
      detail: "Least effort. Cost: one weak part, such as the MCU core, could be hidden in a good total."
  sources: ["assurance/04-hardware/WP-H-05-random-hardware-failures-pmhf.md OI-1, §2"]
  status: applied
