- id: DQ-019
  question: "Should the cybersecurity and machine-learning data processes get a capability target, and should three more processes join the ASPICE scope?"
  context: "The project commits to process capability levels (WP-M-01 T-12): level 2 for the core engineering and support processes, level 1 for machine learning and hardware. Cybersecurity engineering (SEC.1–SEC.4) and machine-learning data management (SUP.11) have **no target**, so QA (QO-5) has nothing to check them against and the cybersecurity case has no process argument. Validation (VAL.1), supplier monitoring (ACQ.4) and measurement (MAN.7) are outside the scope. All levels are self-assessed; a formal assessment is a separate question (DQ-092)."
  reversibility: easy
  blocks: "WP-M-01 T-12; WP-M-05 QO-5; WP-M-13 OI-2"
  gate: G0
  asked: 2026-10-17
  batch: 8
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Level 1 for SEC.1–SEC.4 and SUP.11, and add VAL.1, ACQ.4 and MAN.7 at level 1"
      detail: "QA checks that each process is performed and leaves its outputs. Cost: seven more processes to show evidence for at G1 and G2; the self-assessment (WP-M-13) grows."
    - key: B
      title: "Level 1 for SEC.1–SEC.4 and SUP.11 only; keep the scope as it is"
      detail: "The cybersecurity case gets its process argument. Cost: validation, supplier monitoring and measurement stay unrated."
    - key: C
      title: "Leave them informative"
      detail: "No new commitment. Cost: cybersecurity and machine-learning data have no process target, which an assessor may count as a gap."
  sources: ["assurance/01-management/WP-M-13-aspice-capability-baseline.md §3, OI-2", "assurance/01-management/WP-M-01-assurance-strategy.md T-12", "assurance/01-management/WP-M-05-quality-assurance-plan.md QO-5"]
