  asked: 2026-10-27
  batch: 19
  options:
    - key: A
      recommended: true
      title: "Replace them with typed inline functions"
      detail: "No deviations left; each call states its type. Cost: changes across the safety modes and firmware, re-run tests and mutation tests, and a difference from upstream at every sync."
    - key: B
      title: "Keep them with approved deviations"
