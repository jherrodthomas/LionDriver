    - key: B
      title: "Rate by frequency: E4, SG-03 becomes ASIL C"
      detail: "The more conservative reading. Cost: more envelope work on the longitudinal path."
  sources: ["assurance/00-assessment/docs-safety-reconciliation.md RD-2"]
