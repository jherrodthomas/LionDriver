  reversibility: revisit
  blocks: "Field-monitoring KPIs (WP-O-04); WP-O-03 UI-39/43; R-11"
  gate: G5
  asked: 2026-10-19
  batch: 12
  options:
    - key: A
      recommended: true
      title: "Manual retrieval plus driver reports, for now"
      detail: "No infrastructure, no new privacy exposure. Cost: low data volume, so the KPIs are slow to show trends."
    - key: B
      title: "A LionDriver upload server"
      detail: "Much better monitoring. Cost: hosting money, a TARA and privacy update, consent flow, and running it at 20 h/week."
    - key: C
