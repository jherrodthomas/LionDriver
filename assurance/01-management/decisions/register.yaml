- id: DQ-342
  question: "When the steering assist faults just after the driver has overridden the wheel, should the car keep its gentler alert, or escalate to the full take-over request?"
  context: "If the Toyota EPS faults within 1.5 s of a driver override (or at standstill), the car shows only a small alert with a chime and does not start the take-over sequence, because a hard override often trips the EPS briefly. That gentler alert then **stays for the whole fault**, so a long fault that begins just after an override never escalates. System FMEA SFM-ACT-023 proposes the full take-over request on every EPS fault."
  reversibility: easy
  blocks: "TSR-607; System FMEA SFM-ACT-023; host reaction to panda epsFault (TSR-626(d), TSR-516(b))"
  gate: G2
  decider: lead
  asked: 2026-10-16
  options:
    - key: A
      recommended: true
      title: "Gentle alert for the first 1.5 s only, then escalate"
      detail: "Keeps short override-induced faults quiet; a fault still present after 1.5 s gets the full take-over request. Cost: a small change to the alert logic and a test."
    - key: B
      title: "Always the full take-over request"
      detail: "Simplest rule (SFM-ACT-023 as proposed). Cost: a nuisance take-over request on every hard override that trips the EPS."
    - key: C
      title: "Keep it as it is"
      detail: "No work. Cost: a long EPS fault after an override only ever gets the small alert."
  sources: ["assurance/08-analyses/fmea/analyses/system-fmea.yaml SFM-ACT-023", "openpilot/selfdrive/car/car_events.py:170-175", "openpilot/selfdrive/selfdrived/events.py:516-521", "assurance/03-system/WP-S-02-technical-safety-requirements.md TSR-607"]
  status: applied
  answer: {choice: A, via: chat, at: 2026-10-16}
  applied: {ref: 00ab0c01c, record: "WP-S-02 v0.27 TSR-607 (a)/(b). Open for their owners: the openpilot alert logic change and test (SW), System FMEA SFM-ACT-023", at: 2026-10-16}

