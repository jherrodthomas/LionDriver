- id: DQ-141
  question: "Can the bench PC run the Corolla plant model for closed-loop integration tests on an ordinary operating system, or does it need a real-time one?"
  context: >-
    Closed-loop integration (WP-S-08 step I-3) has a bench PC play the car: it answers the panda's steering and
    acceleration frames with Corolla wheel-speed, torque and brake frames at 100 Hz. On an ordinary Linux kernel the
    10 ms period jitters. The panda's own timeouts start at 50 ms (TSR-408), so small jitter is harmless, but a late
    frame could trip a timeout the real car would not. **Measuring the jitter first avoids buying real-time hardware
    that may not be needed.**
  reversibility: easy
  blocks: "WP-S-08 I-3 closed-loop cases; HIL bench stage B3"
  gate: G3
  decider: claude
  asked: 2026-10-27
  batch: 19
  proceed_after: 2026-11-03
  options:
    - key: A
      recommended: true
      title: "Ordinary OS, accepted only with a measured jitter bound"
      detail: "Measure the period over a long run; accept if 99.9 % of frames arrive within 1 ms of their slot and none is a full period late, and record the bound with the results. Cost: one measurement and a check in the test harness."
    - key: B
      title: "Real-time kernel (PREEMPT_RT) or a dedicated real-time target from the start"
      detail: "Tight timing without measuring first. Cost: a kernel build or extra hardware, and keeping it working."
  sources: ["assurance/models/README.md item 4", "assurance/03-system/WP-S-08-system-integration-test.md I-3", "assurance/05-software/hil-bench/README.md §2 (B3)"]
  status: open

