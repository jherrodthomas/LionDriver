- id: DQ-148
  question: "When the panda refuses a steering frame from the main computer, should it send its own zero-torque frame in its place, or send nothing?"
  context: "This is how the car behaves at the moment the envelope steps in. A substitute frame (TSR-109 option a) keeps the steering rack fed with a valid zero-torque command, so the hand-back is smooth and does not rely on how the EPS reacts to missing frames. Sending nothing (option b) is simpler code, but is allowed only if a vehicle test (WP-S-04 M-02) shows the EPS ramps torque to zero within 0.1 s, which nobody has measured yet."
  reversibility: revisit
  blocks: "SWSR-109/109a; GAP-46; the envelope's reject path in the panda firmware"
  gate: G3
  asked: 2026-10-19
  batch: 12
  options:
    - key: A
      recommended: true
      title: "Send its own zero-torque frame (recommended in TSR-109)"
      detail: "Predictable hand-back that does not depend on the EPS. Cost: the panda must own the frame counter and checksum without clashing with the main computer's frames, plus tests for that."
    - key: B
      title: "Send nothing, once the vehicle test confirms the EPS ramps to zero"
      detail: "Less firmware. Cost: waits for measurement M-02 on the car; if the EPS holds torque or faults, this has to be redone."
    - key: C
      title: "Send nothing now, and measure later"
      detail: "Fastest. Cost: the envelope's safe reaction rests on unmeasured EPS behaviour until M-02 runs; not recommended."
  sources: ["assurance/05-software/WP-W-02-software-safety-requirements.md OI-3"]
  status: answered
  answer: {choice: A, via: chat, at: 2026-10-19, note: "Lead in chat: take all ten (the recommended option of each)"}

