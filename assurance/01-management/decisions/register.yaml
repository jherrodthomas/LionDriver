- id: DQ-143
  question: "How should the CRC that protects commands from the main computer to the panda be chosen?"
  context: >-
    Every steering command crosses the SPI link from the main computer to the panda under an 8-bit XOR, which
    misses two flipped bits in the same position. TSR-410 and TSR-411 ask for a CRC and a sequence counter (WP-S-05
    §4, §12.3: the one hop LionDriver owns at both ends). **The CRC protects against faults on the link, not
    against attacks; picking it from a residual-error target is what an assessor will expect.**
  reversibility: revisit
  blocks: "TSR-410, TSR-411; HSI-01…03; WP-S-02 OI-7 and WP-S-05 OI-2"
  gate: G3
  decider: claude
  asked: 2026-10-25
  batch: 17
  options:
    - key: A
      recommended: true
      title: "Set a residual-error target from the ASIL C budget, then pick the shortest CRC that meets it"
      detail: "Defensible by calculation; the counter comes with it. Cost: an analysis, then a firmware and host change with tests."
    - key: B
      title: "Keep the 8-bit XOR and justify it"
      detail: "No change. Cost: unlikely to meet any ASIL C target, and TSR-410 stays unmet."
  sources: ["assurance/03-system/WP-S-02-technical-safety-requirements.md OI-7, TSR-410, TSR-411", "assurance/03-system/WP-S-05-hsi-specification.md §4.1, §12.3, OI-2"]
  status: answered
  answer: {choice: A, via: inbox, at: 2026-10-26, by: u_X1u501HWo3YGVNlzcvkvmg}
  note: "Method recorded (WP-S-02 v0.59 OI-7, WP-S-05 v0.18 OI-2): residual-error target from the ASIL C budget, then the shortest CRC that meets it, with the TSR-411 counter. Left: the analysis, then the panda and host change with tests (panda fork, outside this repository) (jherrodthomas/LionDriver#490)"

