- id: DQ-161
  question: "Should the min, max, clamp and abs macros in the safety code be replaced with typed inline functions, removing four standing MISRA deviations?"
  context: >-
    The safety helpers in opendbc and the panda firmware use GNU statement-expression macros (`({ … })` with
