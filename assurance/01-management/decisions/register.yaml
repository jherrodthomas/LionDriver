    The state-machine checker (finding S7, WP-W-05 §5.3) found four transitions of selfdrived (X2, E2, O2, P1) with no
    host requirement, and in the pre-enable phase a soft-disable event is not acted on. The panda's envelope
    requirements (SWSR-301, SWSR-302) cover disengagement on its side, so the car stays safe, but the host behaviour
    is untested against a requirement. **Writing them closes the gap the checker reports; arguing them away needs a
    reviewer to accept the envelope as enough.**
  reversibility: easy
  blocks: "WP-W-02 OI-12; WP-W-05 §5.3"
  gate: G3
  decider: claude
  asked: 2026-10-27
  batch: 19
  proceed_after: 2026-11-03
  options:
    - key: A
      recommended: true
      title: "Derive host requirements for the four transitions"
      detail: "Complete host coverage; the pre-enable soft-disable case gets a requirement and a test. Cost: four SWSRs and their QM tests."
    - key: B
      title: "Record why none is needed"
      detail: "Less work. Cost: a written argument that the envelope requirements alone suffice, which the pre-enable case makes harder."
  sources: ["assurance/05-software/WP-W-02-software-safety-requirements.md OI-12", "assurance/05-software/WP-W-05-software-unit-design.md §5.3"]
  status: open

- id: DQ-152
  question: "How should the panda report why it took steering authority away: as a new field in the message the main computer logs, or squeezed into the existing health flags?"
  context: >-
    SWSR-108a asks the panda to record the cause of every revocation (TX violation, RX checksum, timeout, brake,
    heartbeat and others) and report it in its health packet. Today only a blocked-frame count and an RX-invalid flag
    are reported, so a log cannot say why the car stopped steering. The main computer logs the health packet as
    `pandaStates`, which already has a LionDriver field (`requestsRejected`). **A proper field makes every revocation
    explainable in field data; packing bits saves a schema change but runs out of room.**
  reversibility: easy
  blocks: "SWSR-108a; WP-W-02 OI-8; WP-S-05 §4.2"
  gate: G3
  decider: claude
  asked: 2026-10-27
  batch: 19
  proceed_after: 2026-11-03
  options:
    - key: A
      recommended: true
      title: "A reason code and per-cause counters, laid out in WP-S-05 §4.2, with a new pandaStates field"
      detail: "One documented layout for firmware, host and logs. Cost: a health-packet change and a cereal schema field, carried at each sync."
    - key: B
      title: "Pack the cause into spare bits of the existing health flags"
      detail: "No schema change. Cost: few bits, no counters, and the meaning hidden in bit positions."
  sources: ["assurance/05-software/WP-W-02-software-safety-requirements.md SWSR-108a, OI-8", "assurance/03-system/WP-S-05-hsi-specification.md §4.2", "openpilot/cereal/log.capnp (PandaState)"]
  status: open

- id: DQ-153
  question: "Should the panda's safety checks get a higher interrupt priority than its communication, or stay at the same level?"
  context: >-
    Today every interrupt runs at one level, so the 100 Hz safety task can wait behind any host or CAN handler, and
    its timing is bounded only by how long those run. WP-W-03 §5.4.2 proposes ranking the safety task first, then
    CAN, then host traffic. **This is one of the timing measures the coexistence analysis still needs (WP-A-02 OI-9);
    ranking adds preemption, which §5.4.3 has analysed.**
  reversibility: revisit
  blocks: "SWSR-519, ATC-04, WP-W-03 §6.3; WP-A-02 OI-9"
  gate: G3
  decider: claude
  asked: 2026-10-25
  batch: 17
  options:
    - key: A
      recommended: true
      title: "Measure handler times first, then adopt the ranking unless the margin is large"
      detail: "Latency bounded by construction. Cost: a measurement campaign on the target and the race measures of §5.4.4."
    - key: B
      title: "Keep one level and justify it by measurement"
      detail: "No preemption to analyse. Cost: every change to any handler has to be re-measured."
  sources: ["assurance/05-software/WP-W-03-software-architecture.md §5.4, OI-4, ATC-04", "assurance/08-analyses/WP-A-02-coexistence-freedom-from-interference.md OI-9"]
  status: answered
  answer: {choice: A, via: inbox, at: 2026-10-26, by: u_X1u501HWo3YGVNlzcvkvmg}
  note: "Recorded in WP-W-03 v0.21 OI-4 and ATC-04, WP-A-02 OI-9. Left: the §5.4.5 handler-time measurements on the target, then the ranking unless the margin is large (jherrodthomas/LionDriver#490)"

