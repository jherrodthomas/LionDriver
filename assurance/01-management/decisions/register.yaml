- id: DQ-115
  question: "Accept, as an interim deviation, the host stale-input check using 10 nominal periods instead of the 2 required by TSR-602?"
  context: "TSR-602 asks the host to detect stale inputs within 2 nominal periods; the change uses 10 (same bound as commIssue) until reference logs show the real input jitter, and the reaction is a soft disable rather than a new immediate disable. Using 2 periods without data risks nuisance disengagements; using 10 means slower detection than the requirement."
  reversibility: easy
  blocks: "TSR-602 compliance; SWF-ACT-040"
  options:
    - key: A
      recommended: true
      title: "Accept 10 periods as an interim deviation until log jitter is measured, then tighten"
      detail: "No nuisance disengagements now; detection slower than TSR-602 meanwhile."
    - key: B
      title: "Implement 2 periods now"
      detail: "Meets TSR-602; risk of false disengagements before jitter is known."
    - key: C
      title: "Amend TSR-602 to 10 periods"
      detail: "Requirement matches code; weakens the requirement permanently."
  sources: ["assurance/07-supporting/impact/change-2026-10-13-host-supervision.md OI-1"]
  status: queued

