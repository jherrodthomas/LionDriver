- id: DQ-368
  question: "Should you buy a 3D model of the Corolla E210 for the MetaDrive closed loop and the simulation figures, and which one?"
  context: >-
    Simulation layer 3 (MetaDrive, `openpilot/tools/sim`) draws vehicles from glTF meshes, and the bridge runs
    with `render_vehicle: False`: the ego body never appears in the camera images openpilot consumes. A Corolla
    mesh therefore shows only in third-person and top-down renders, so layer-3 videos and WP-V figures show the
    reference car instead of MetaDrive's stock car, and it gives a body shape for camera-height and blind-zone
    drawings. **It changes no physics:
    mass, wheelbase and centre of gravity stay the opendbc CarParams the plant already uses, so no result or
    evidence depends on it.** No free, game-ready mesh of the Corolla E210 (CFG-001) exists; every real one is a paid render model under
    an editorial-use licence (Toyota design), fine for this project and not for a commercial product. The
    comparison is in `assurance/sim/vehicle-3d-model.md`. Note the trim: CFG-001 is the 1.8 L L/LE/XLE with
    16-inch wheels; the "XSE" models carry 18-inch wheels and are visually the wrong trim.
  reversibility: easy
  blocks: "Layer-3 renders and figures showing the reference car (cosmetic); nothing in the safety case"
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Buy the 3d_molier 'Toyota Corolla 2020 Simple Interior' (TurboSquid 1450755, $99)"
      detail: "Ships glTF, FBX, Blender and USD with textures mapped in every format; 214k polygons, doors separate, real scale. Needs a decimation pass to about 50-80k before MetaDrive. Trim not stated; wheel size to check on receipt (returnable)."
    - key: B
