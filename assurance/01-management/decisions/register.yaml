  context: "Tests of remote access and update integrity must not touch comma.ai's real servers, so a local stand-in server is needed."
  reversibility: easy
  blocks: "TC-12, TC-14"
  decider: claude
  options:
    - key: A
      recommended: true
      title: "Local mock servers on an isolated test network"
      detail: "Full control and repeatable; some build effort."
    - key: B
      title: "Redirect to a cloud test instance"
      detail: "Closer to real deployment; more setup and exposure."
  sources: ["assurance/06-validation/WP-V-06-cybersecurity-validation.md OI-4"]
  status: queued

- id: DQ-198
  question: "Is the §8 finding-rating scheme (Critical/High/Medium/Low) the one to present to the assessor?"
  context: "The rating scheme decides which findings block release (Critical always, High unless treated). It is mapped to TARA risk values and problem severities; the assessor needs to agree it."
  reversibility: easy
  blocks: "WP-V-06 report and release blocking rules"
  decider: claude
  options:
    - key: A
      recommended: true
      title: "Present §8 as drafted, mapped to TARA risk and S-1..S-4"
      detail: "Consistent with WP-O-05; assessor review only."
    - key: B
      title: "Adopt CVSS-based scoring instead"
      detail: "Familiar to pen testers but not tied to safety goals."
  sources: ["assurance/06-validation/WP-V-06-cybersecurity-validation.md OI-6"]
  status: queued

- id: DQ-199
  question: "Squash or merge-commit merges, so review records stay linked to commits in the submodule forks?"
  context: "The superproject pins submodule SHAs; squash merges create new SHAs that differ from the reviewed branch, which can break the link between a review record and the pinned commit. Impact records already pin merge commits on the forks' master."
  reversibility: easy
  blocks: "Traceability of reviews to pins"
  decider: claude
  options:
    - key: A
      recommended: true
      title: "Merge commits (no squash) in forks"
      detail: "Reviewed commits remain reachable and pinned; noisier history."
    - key: B
      title: "Squash merges"
      detail: "Cleaner history; reviewed commit SHAs lost from the protected branch."
  sources: ["assurance/07-supporting/WP-P-02-change-management.md OI-6"]
  status: queued

- id: DQ-200
  question: "Where are non-redistributable reference documents (ISO standards, licensed datasheets) stored?"
  context: "The repository is public, so licensed standards and datasheets that forbid redistribution cannot be committed. A non-public store is needed that reviewers and the assessor can still reach."
  reversibility: easy
  blocks: "Licence compliance; assessor access"
  decider: claude
  options:
    - key: A
      recommended: true
      title: "Private storage outside the public repo, referenced by title/edition/URL"
      detail: "Licence compliant; access must be granted to reviewers."
    - key: B
      title: "Private GitHub repository"
      detail: "Version controlled; another repo to manage."
  sources: ["assurance/07-supporting/WP-P-04-documentation-management.md OI-5"]
  status: queued

- id: DQ-201
  question: "How is the large back-filled envelope requirement set reviewed?"
  context: "Envelope requirements are being back-filled from existing safety code (toyota.h, safety.h, panda main.c); reviewing hundreds of requirements one by one is impractical. One inspection per safety-mode file and per panda driver file is proposed."
  reversibility: easy
  blocks: "Review of back-filled SWSRs (T-03); WP-P-06 OI-5"
  decider: claude
  options:
    - key: A
      recommended: true
      title: "One inspection per safety-mode file and per panda driver file"
      detail: "Reviews follow code structure; manageable sessions."
    - key: B
      title: "One inspection per requirement group (by TSR)"
      detail: "Aligns with requirement hierarchy; cuts across files."
  sources: ["assurance/07-supporting/WP-P-05-verification-review-procedure.md OI-4"]
  status: queued

- id: DQ-202
  question: "Add a small 'req' decorator helper for unittest in addition to docstring requirement tags?"
  context: "Tests are linked to requirements through docstring tags; a decorator would make links machine-checkable but needs a helper module in each fork (opendbc, panda)."
  reversibility: easy
  blocks: "Test-to-requirement trace"
  decider: claude
  options:
    - key: A
      recommended: true
      title: "Docstring tags only"
      detail: "No fork changes; parsing relies on convention."
    - key: B
      title: "Add decorator helper in each fork"
      detail: "Stronger checks; extra code in safety forks."
  sources: ["assurance/07-supporting/WP-P-06-requirements-management-traceability.md OI-3"]
  status: queued

- id: DQ-203
  question: "What structural coverage strategy (branch coverage, MC/DC) applies to the envelope code?"
  context: "Envelope tests currently gate on 100% line coverage only; ISO 26262-6 expects branch coverage and, at higher ASIL, MC/DC. A strategy and tool choice are needed."
  reversibility: easy
  blocks: "Unit verification evidence; TL-05"
  decider: claude
  options:
    - key: A
      recommended: true
      title: "Add gcovr branch coverage gate now; MC/DC via a dedicated tool once ASIL is approved"
      detail: "Incremental; MC/DC level tied to WP-C-03."
    - key: B
      title: "Go straight to MC/DC tooling"
      detail: "Highest rigour; tool qualification effort before ASIL is known."
  sources: ["assurance/07-supporting/WP-P-07-tool-classification-qualification.md OI-5"]
  status: queued

- id: DQ-204
  question: "How should the host react to panda fault flags other than relayMalfunction and SPI error bursts (TSR-615)?"
  context: "TSR-615 requires reactions to panda fault flags, but only relay malfunction and SPI error bursts have one (EPS fault is covered through card). Each remaining flag needs a mapped reaction (alert, soft disable or immediate disable)."
  reversibility: easy
  blocks: "TSR-615"
  decider: claude
  options:
    - key: A
      recommended: true
      title: "Map each remaining flag to soft or immediate disable per its hazard link, in a follow-up change"
      detail: "Meets TSR-615; design and test effort."
    - key: B
      title: "Generic soft disable for any unknown fault flag"
      detail: "Quick coverage; may be too weak for some faults."
  sources: ["assurance/07-supporting/impact/change-2026-10-13-host-supervision.md OI-2"]
  status: queued

- id: DQ-205
  question: "Should an unresponsive driver be added to the HARA as its own hazard (H-09) with an ASIL A safety goal?"
  context: "WP-C-03 treats driver monitoring only as a measure that controllability relies on, but the second-set HARA (SG-010, ASIL A), the STPA (H-STPA-1) and the System FMEA (awareness reaching zero has no disable reaction, SFM-025) all point to a vehicle-level hazard. Adding it creates a new safety goal and needs a defined safe state, which ties to the still-open decision on what the item does when driver awareness reaches zero (SFM-ACT-005)."
  reversibility: revisit
  blocks: "WP-C-03 safety goal set; WP-C-04 §7 DM allocation; SFM-ACT-005; OI-5"
  gate: G1
  after: [DQ-003]
  options:
    - key: A
      recommended: true
      title: "Add H-09 with ASIL A goal"
      detail: "New hazard and goal in WP-C-03; define its safe state together with the zero-awareness behaviour decision (SFM-ACT-005)."
    - key: B
      title: "Keep DM as a latent-fault measure only"
      detail: "No new goal; must argue in WP-C-03/WP-C-04 §7 why the STPA and FMEA findings do not create a hazard."
  sources: ["assurance/00-assessment/docs-safety-reconciliation.md RD-3", "assurance/02-concept/WP-C-04-functional-safety-concept.md OI-3", "assurance/01-management/WP-M-10-ai-safety-plan.md OI-3", "assurance/00-assessment/docs-safety-reconciliation.md OI-2"]
  status: queued
