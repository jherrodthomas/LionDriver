      recommended: true
      title: "Accept: SG-06 is ASIL C"
      detail: "One exposure per situation, as the method requires. Cost: the deceleration-loss checks move up from B to C with the acceleration checks."
    - key: B
      title: "Rate OS-07 by frequency for acceleration only"
      detail: "SG-06 stays B. Cost: two exposures for one situation; an assessor is likely to reject it."
  sources: ["assurance/02-concept/WP-C-03-hara.md §6.1 observation 7, OI-9", "assurance/01-management/decisions/register.yaml DQ-036"]
