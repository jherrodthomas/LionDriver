  status: queued

- id: DQ-079
  question: "After the envelope revokes authority for a too-high transmit rate, should re-engagement stay blocked until the rate has been within budget for a full 250 ms window?"
  context: "Today a TX-rate revocation (SWSR-518) is followed by a fresh grant on the next cruise rising edge, even if the host is still flooding. Review finding F-34 proposes amending SWSR-518 so authority is not granted again while the excess persists (implemented as ATC-20). This is a vehicle-behaviour default about when automated steering may resume."
  reversibility: easy
  blocks: "SWSR-518, ATC-20"
  gate: G3
  options:
    - key: A
      recommended: true
      title: "Adopt the F-34 amendment"
      detail: "No re-grant while flooding; clears after one clean 250 ms window; small code change under a CT-1 record."
    - key: B
      title: "Inhibit until the next safety-mode change"
      detail: "Stricter; may cost availability after a transient burst."
    - key: C
      title: "Keep current behaviour"
      detail: "No change; a misbehaving host can be re-granted on the next driver engagement."
  sources: ["assurance/05-software/WP-W-02-software-safety-requirements.md OI-11"]
  status: queued

- id: DQ-080
  question: "After a safety-mode reset while the driver keeps cruise engaged, should steering authority come back automatically, or only after cruise goes off and on again?"
  context: "The back-to-back model run (B2B-06) showed that after a mode set (host request, heartbeat loss, harness change) the held CRUISE_ACTIVE looks like a new engagement, so authority returns within one message period without the driver doing anything. The doc recommends requiring a falling edge first, because a mode set while engaged follows a fault or a host request."
  reversibility: easy
  blocks: "SWSR-301, SWSR-311; reference-build opendbc"
  gate: G3
  options:
    - key: A
      recommended: true
      title: "Require cruise off→on after a mode set"
      detail: "Code change in opendbc reference build; re-engagement stays the driver's choice."
    - key: B
      title: "Keep and reword SWSR-301/311"
      detail: "No code change; automatic re-grant after a fault-driven reset stays allowed."
  sources: ["assurance/05-software/WP-W-02-software-safety-requirements.md OI-14"]
  status: queued

- id: DQ-081
  question: "What numeric values should the envelope use for jerk limits, driver-override torque/time, frozen-signal time, SPI error count and the SWSR-405 plausibility tolerances?"
  context: "Several envelope requirements carry symbols instead of numbers (j_up, j_down, T_ovr, t_ovr, t_frz, N_spi, driver allowance). They decide when the system rejects acceleration commands, when driver steering overrides automation, and when stuck sensor data is a fault, so they define vehicle behaviour and false-trip rate. Values are expected from WP-C-08 and vehicle characterization."
  reversibility: revisit
  blocks: "SWSR-204/206, 304a, 404, 413, 405; GAP-01/02/04"
  gate: G3
  options:
    - key: B
      recommended: true
      title: "Adopt provisional values now, confirm later"
      detail: "Unblocks implementation and tests; values may change after measurement."
    - key: A
      title: "Set from reference-car characterization/logs, then approve"
      detail: "Defensible values; waits on vehicle data."
  sources: ["assurance/05-software/WP-W-02-software-safety-requirements.md OI-4"]
  status: queued

- id: DQ-082
  question: "When the host sends a refused request while steering authority is granted, should the envelope also withdraw authority (treat the host as possibly compromised)?"
  context: "In the reference build a refused host request is ignored. Review finding F-36 proposes that it also clears controls_allowed and is reported, matching cybersecurity requirement CSR-012 ('suspected compromised host → no actuation'). This trades availability (a spurious request disengages) for security."
  reversibility: easy
  blocks: "SWSR-512/513, CSR-012"
  gate: G3
  options:
    - key: A
