- id: DQ-139
  question: "May simulation results count as validation evidence, and for which kinds of scenario?"
  context: "LionDriver is adapting the MetaDrive simulator to drive the reference Corolla with the real panda safety code in the loop. Simulation can run thousands of trials where the closed course runs tens, but its images, radar and vehicle response are models. **Credit would cut physical testing; wrong credit would hide a real weakness.** The plan (WP-V-02 §5.3) groups scenarios into seven families and gives credit only per family, after at least 5 matched closed-course trials agree."
