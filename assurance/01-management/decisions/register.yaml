- id: DQ-191
  question: "Which signature scheme should LionDriver panda firmware be signed with, replacing today's RSA-1024/SHA-1?"
  context: "Every LionDriver device will trust exactly one firmware signing key, burned in with flash protection (D-09, D-10, D-12 already decided). Once devices are in the field, changing the scheme means reflashing the bootstub on each one, so this is hard to undo. CSR-031 needs at least 128-bit security and SHA-256. The update manifest format is written with it. This question also absorbs DQ-168, which asked the same thing."
  reversibility: hard
  blocks: "CSR-031, CSR-121, TSR-511; GAP-24/25; WBS 4.4; R-15; the update manifest (WP-O-05 OI-7)"
  gate: G3
  asked: 2026-10-19
  batch: 12
  options:
    - key: A
      recommended: true
      title: "ECDSA P-256 with SHA-256 in the bootstub"
      detail: "Widely supported, small signatures, fits the MCU's flash and verify time. Cost: new verification code in the bootstub and its tests."
    - key: B
      title: "RSA-3072 with SHA-256"
      detail: "Closest to the current code, so the smallest change. Cost: larger keys and signatures and slower verification at every boot."
    - key: C
      title: "Ed25519"
      detail: "Simple, modern and fast. Cost: less hardware support on the STM32 and fewer qualified libraries, so more own verification work."
  sources: ["assurance/03-system/WP-S-07-cybersecurity-requirements-architecture.md OI-4", "assurance/01-management/WP-M-09-cybersecurity-plan.md OI-1"]
  status: answered
  answer: {choice: A, via: chat, at: 2026-10-19, note: "Lead in chat: take all ten (the recommended option of each)"}

