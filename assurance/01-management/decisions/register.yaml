- id: DQ-081
  question: "Should the safety limits that are still symbols get provisional numbers now, or wait for measurements on the car?"
  context: "Seven envelope requirements carry symbols instead of numbers: how fast a requested acceleration may change (j_up, j_down), how much driver torque for how long means the driver is taking over (T_ovr, t_ovr), how long sensor data may stay frozen (t_frz), how many SPI errors are tolerated (N_spi), and the SWSR-405 plausibility tolerances. **They decide when the safety chip rejects a command and when the driver's steering wins**, so they set both how safe and how twitchy the system feels. None can be coded or tested without a number. Your DQ-055 answer means they are derived on their own, with the controller set below them."
  reversibility: revisit
  blocks: "SWSR-204, 205, 206, 304a, 404, 413, 405; GAP-01, GAP-02, GAP-04"
  gate: G3
