- id: DQ-066
  question: "Which method should be used for the random hardware failure target: one overall probability, a per-fault check, or both?"
  context: "ISO 26262-5 §9 allows one overall failure probability (PMHF, method 1) or a per-fault evaluation (EEC, method 2). The proposal is PMHF plus an EEC-style check of the biggest contributors (MCU core, SRAM, harness switch), so a good total cannot hide one uncovered part. As safety manager, you approve the method before the calculation starts; the ASIL C single-point miss stays open for G2 (DQ-362 A)."
  reversibility: easy
  blocks: "WP-H-05 calculation (OI-1); G2 method record"
  gate: G2
  asked: 2026-10-19
  batch: 10
  options:
    - key: A
      recommended: true
      title: "PMHF plus a per-cause check of the biggest contributors"
      detail: "One figure to compare with the ASIL C target, and no single weak part hidden in it. Cost: moderate effort."
    - key: B
      title: "Per-fault evaluation (EEC) only"
      detail: "Every part seen on its own. Cost: more work and harder to summarise for the safety case."
    - key: C
      title: "PMHF only"
      detail: "Least effort. Cost: one weak part, such as the MCU core, could be hidden in a good total."
  sources: ["assurance/04-hardware/WP-H-05-random-hardware-failures-pmhf.md OI-1, §2"]
  status: applied
  answer: {choice: A, via: inbox, at: 2026-10-19, by: u_DgEswP8TFzpISXlzh3BD1g}
  applied: {ref: 3965a9e, record: "WP-H-05 v0.6 §2, OI-1 (#256)", at: 2026-10-19}

- id: DQ-067
  question: "What lifetime, operating hours and temperatures should the hardware failure calculations assume for the device?"
  context: "Every failure-rate figure in the hardware analysis (FMEDA, PMHF) rests on a mission profile: how long the device is in service, how many hours it runs, and how hot it gets. The analysis uses working values today: 15 years, about 500 driving hours a year (7,500 h in all), and up to +85 °C ambient behind the windscreen in sun. **No one has approved them, so no hardware metric can be final.** An aftermarket device may also be fitted for fewer years than the car lives."
  reversibility: easy
  blocks: "FMEDA stress factors (WP-H-03 §2.4); PMHF exposure times and the latent-fault metric (WP-H-05 §3); hardware metrics at G2"
  gate: G2
  asked: 2026-10-17
  batch: 8
  decider: lead
  options:
    - key: A
      recommended: true
      title: "Approve the working values; replace the hours with logged driving data once there is some"
      detail: "15 years, 500 h a year, +85 °C sun-loaded cabin, one power cycle per drive. Conservative and already in the figures, so nothing is recalculated now. Cost: a 15-year life makes the latent-fault and PMHF targets harder to meet than a shorter one."
    - key: B
      title: "A shorter device life (for example 8 years) with an end-of-life rule"
      detail: "Lower latent-fault figures. Cost: operations must tell owners to replace the device at end of life (WP-O-02), and you have to enforce it."
    - key: C
      title: "Wait for measured cabin temperatures and usage data"
      detail: "The most defensible values. Cost: the hardware metrics stay provisional until a logging campaign is done; G2 slips or passes with a condition."
  sources: ["assurance/04-hardware/WP-H-05-random-hardware-failures-pmhf.md §3, OI-2", "assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md §2.4"]
