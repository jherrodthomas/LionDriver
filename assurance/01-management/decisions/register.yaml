    - key: B
      title: "Keep manual-only updates (DisableUpdates) for the reference configuration"
      detail: "No pipeline effort; users must update manually with re-verification; CSG-07 remains a retained risk."
  sources: ["assurance/02-concept/WP-C-10-cybersecurity-goals-and-concept.md OI-5", "assurance/01-management/WP-M-09-cybersecurity-plan.md OI-3", "assurance/07-supporting/WP-P-10-release-management.md OI-4", "assurance/09-production-operation/WP-O-01-installation-and-provisioning-control.md OI-6"]
  status: queued

