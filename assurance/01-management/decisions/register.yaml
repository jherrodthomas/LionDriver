  context: "The ODD runs to 120 km/h, but controllability evidence above 90 km/h is weak, and closed-course tests stop at 90. With highways only, most driving happens above 90 km/h, so **this decides whether high-speed use can be claimed at all**. Testing at 110 km/h needs its own risk review."
  reversibility: revisit
