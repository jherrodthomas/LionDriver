<svg xmlns="http://www.w3.org/2000/svg" width="640" height="746" viewBox="0 0 640 746" role="img" aria-labelledby="t d">
<title id="t">01-management: work products by gate and status</title>
<desc id="d">Work products of 01-management from WP-M-00 §3, by the gates they are needed for: WP-M-00 Work product register: G0, Draft; WP-M-01 Assurance strategy and lifecycle tailoring: G0, Draft; WP-M-02 Functional safety plan: G0, Draft; WP-M-03 Project plan (scope, WBS, schedule, resources): G0, Draft; WP-M-04 Organization-specific rules, safety culture, competence management: G0, Draft; WP-M-05 Quality management and quality assurance plan: G0, Draft; WP-M-06 Confirmation measures plan (reviews, audit, assessment, independence): G0, Draft; WP-M-07 Project risk management plan and register: G0, Draft; WP-M-08 SOTIF plan: G0, Draft; WP-M-09 Cybersecurity plan: G0, Draft; WP-M-10 AI safety management plan: G0, Draft; WP-M-11 Upstream (comma.ai) and supplier management, development interface agreements: G0, Draft; WP-M-12 Impact analysis of the openpilot-derived baseline (modification of existing item): G0, Draft; WP-M-13 ASPICE capability baseline (self-assessment): G0, Draft; WP-M-14 ISO 26262-6 software lifecycle implementation specification (future work; activation deferred, D-14): G2 (activation), G3–G4 (use), Draft.</desc>
