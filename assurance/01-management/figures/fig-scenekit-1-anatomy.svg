<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="604" viewBox="0 0 1200 604" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure S-1. Anatomy of a top-down scene</title>
<desc>A top-down scene with its twelve elements numbered: 1 Road: grass, verge, asphalt, white edge lines, dashed centre line; one lane is 30 units (about 3.6 m); 2 Direction of travel: faded arrow; traffic drives left to right; 3 The item's car: red; the only red car in a scene; 4 Other traffic: grey; a stopped car is paler and shows its hazard lights; 5 Start: where the item's car began, faded; 6 What should happen: dashed green: the intended path (required, needed); 7 Where it should be: dashed green outline of the car at the same moment; 8 What does happen: solid red: the performed path, drawn in as the car drives; 9 The gap: red shading between intended and performed; 10 Fault starts: amber marker with a bolt: the failure, or the triggering condition; 11 The moment it matters: yellow ring and label: the first harm-relevant event; 12 Status pills: top-left, in order; numbered when they key to marks on the card's chart.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1200" height="604" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure S-1 · Anatomy of a top-down scene</text>
<text x="40" y="66" font-size="12.5" fill="#475569">Every scene figure uses these elements, drawn by scenekit.py (SVG) or scenekit.js (canvas).</text>
<text x="1160" y="44" font-size="11" fill="#475569" text-anchor="end">scenekit.py · fig_scenekit.py</text>
