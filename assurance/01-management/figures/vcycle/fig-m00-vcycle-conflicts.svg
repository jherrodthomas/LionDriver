<text x="1176" y="412" font-size="11" fill="#475569">cites a standard in WP-M-00 that none of</text>
<text x="1176" y="428" font-size="11" fill="#475569">its inputs cite: check where it comes from</text>
<rect x="1160" y="466" width="420" height="92" rx="10" fill="#ECFDF5" stroke="#2E9E6A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="1176" y="492" font-size="14" fill="#166534" font-weight="700">Due before an input it reads</text>
<text x="1564" y="494" font-size="20" fill="#166534" font-weight="700" text-anchor="end">0</text>
<text x="1176" y="516" font-size="11" fill="#475569">due at an earlier gate than a work product</text>
<text x="1176" y="532" font-size="11" fill="#475569">it reads (WP-M-00 gate column)</text>
<text x="1160" y="580" font-size="11.5" fill="#0F172A">A flag means look, not wrong: an older work</text>
<text x="1160" y="598" font-size="11.5" fill="#0F172A">product may still be right after its input</text>
<text x="1160" y="616" font-size="11.5" fill="#0F172A">changed. A new Version entry or a recorded</text>
<text x="1160" y="634" font-size="11.5" fill="#0F172A">review clears a flag; the view never does.</text>
<text x="1160" y="662" font-size="10.5" fill="#475569" font-style="italic">Dates: Version row of each work product, newest 2026-11-13.</text>
<text x="40" y="858" font-size="11.5" fill="#475569" font-style="italic">Worked out from the WP-M-00 register, the WP-M-03 process model and each work product's Version row; nothing is judged wrong by being flagged.</text>
<g class="terms">
<text x="40" y="882" font-size="10.5" fill="#475569">Terms: WP-nn work product, e.g. WP-C-04; the letter is its area (M management, C concept, S system, H hardware, W software, V validation, P processes, A analyses, O operation, K safety case)</text>
