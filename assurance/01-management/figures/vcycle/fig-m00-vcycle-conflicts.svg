<text x="1176" y="204" font-size="11" fill="#475569">a work product dated before the newest change</text>
<text x="1176" y="220" font-size="11" fill="#475569">to a work product it reads (WP-M-03 inputs)</text>
<rect x="1160" y="258" width="420" height="92" rx="10" fill="#FEF2F2" stroke="#C2410C" stroke-width="1.4"/>
