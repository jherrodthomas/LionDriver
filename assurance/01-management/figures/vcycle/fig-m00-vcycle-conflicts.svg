<text x="1176" y="308" font-size="11" fill="#475569">the newest change on a verification box is more</text>
<text x="1176" y="324" font-size="11" fill="#475569">than 7 days older than on the box it checks</text>
<rect x="1160" y="362" width="420" height="92" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
<text x="1176" y="388" font-size="14" fill="#4F46E5" font-weight="700">Cites a standard no input cites</text>
