<line x1="242.9" y1="96" x2="242.9" y2="172" stroke="#E2E8F0" stroke-width="1"/>
<text x="334.3" y="114" font-size="12.5" fill="#0F172A" font-weight="700" text-anchor="middle">Concept</text>
<line x1="425.7" y1="96" x2="425.7" y2="172" stroke="#E2E8F0" stroke-width="1"/>
<text x="517.1" y="114" font-size="12.5" fill="#0F172A" font-weight="700" text-anchor="middle">System design</text>
<line x1="608.6" y1="96" x2="608.6" y2="172" stroke="#E2E8F0" stroke-width="1"/>
<text x="700" y="114" font-size="12.5" fill="#0F172A" font-weight="700" text-anchor="middle">HW/SW development</text>
<line x1="791.4" y1="96" x2="791.4" y2="172" stroke="#E2E8F0" stroke-width="1"/>
<text x="882.9" y="114" font-size="12.5" fill="#0F172A" font-weight="700" text-anchor="middle">Integration and verification</text>
<line x1="974.3" y1="96" x2="974.3" y2="172" stroke="#E2E8F0" stroke-width="1"/>
<text x="1065.7" y="114" font-size="12.5" fill="#0F172A" font-weight="700" text-anchor="middle">Validation and release</text>
<line x1="1157.1" y1="96" x2="1157.1" y2="172" stroke="#E2E8F0" stroke-width="1"/>
<text x="1248.6" y="114" font-size="12.5" fill="#0F172A" font-weight="700" text-anchor="middle">Operation</text>
