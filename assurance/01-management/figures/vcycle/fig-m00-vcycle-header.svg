<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="236" viewBox="0 0 1400 236" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>LionDriver V-cycle: header</title>
<desc>Time axis: Governance phase, G0 Mar 2027–May 2027; Concept phase, G1 Nov 2027–May 2028; System design phase, G2 Jul 2028–May 2029; HW/SW development phase, G3 Nov 2029–May 2031; Integration and verification phase, G4 Sep 2030–Sep 2032; Validation and release phase, G5 Jul 2031–Mar 2034; Operation phase, G6 continuous. Now in the Governance phase.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1400" height="236" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<style>.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media (prefers-reduced-motion: reduce){.pulse{animation:none}}</style>
<text x="40" y="44" font-size="28" fill="#0F172A" font-weight="700">LionDriver V-cycle</text>
<text x="40" y="70" font-size="13.5" fill="#475569">Where each work product sits on the V, which gate needs it, and how far it has matured. Generated from the work-product register (WP-M-00) and the schedule (WP-M-03).</text>
<rect x="60" y="92" width="1280" height="84" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="62" y="94" width="178.9" height="80" rx="6" fill="#FFF7ED" stroke="none" stroke-width="0"/>
