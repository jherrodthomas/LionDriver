<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="t d">
<title id="t">HE-02.2 animated: plant run F-07</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. Looping animation of plant run F-07 for HE-02.2: the Corolla's lateral offset on a straightened road from 1 s before the fault to 3.8 s after it, the offset plot with a moving cursor and the 0.5 s FTTI band, and the events: fault: EPS fault: LKA_STATE 9, assist lost at 0.00 s; panda refuses LKA frames at 0.02 s; panda revokes steering authority at 0.07 s; panda siren (the driver's cue) at 0.30 s; driver starts to correct at 1.80 s.</desc>
