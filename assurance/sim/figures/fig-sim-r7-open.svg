<svg xmlns="http://www.w3.org/2000/svg" width="640" height="742" viewBox="0 0 640 742" role="img" aria-labelledby="t d">
<title id="t">Simulation track open items grouped by what closes them</title>
<desc id="d">Three open items need measurements on the reference Corolla: SIM-OI-1 EPS reaction to lost frames (M-02), SIM-OI-7 column parameters (M-02), SIM-OI-8 torque scales (M-08). SIM-OI-2 needs WP-C-08. SIM-OI-3, 4 and 5 are simulation-track work. SIM-OI-6 waits on an outside licence. SIM-OI-9 is closed.</desc>
