<svg xmlns="http://www.w3.org/2000/svg" width="640" height="443" viewBox="0 0 640 443" role="img" aria-labelledby="t d">
<title id="t">KS-06 animated top view</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. Still top view of KS-06 (Narrow lane with an adjacent truck) from its esmini replay at the parameter defaults, 0.0 to 6.0 s: A truck alongside in the right lane; lanes 3.3 m wide. Events: truck alongside at the ego speed, 1.13 m clear at 0.0 s. Layer 2 fixes the road and the other road users. The ego only holds its start speed here; the item under test drives it in layer 1 and on the bench. Cars: Kenney Racing Pack (CC0).</desc>
<style>
