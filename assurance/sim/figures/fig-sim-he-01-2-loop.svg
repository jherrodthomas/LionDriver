<svg xmlns="http://www.w3.org/2000/svg" width="640" height="974" viewBox="0 0 640 974" role="img" aria-labelledby="t d">
<title id="t">HE-01.2 in the layer-1 loop: plant run F-01b</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. HE-01.2 (ASIL C), Lateral departure into an adjacent vehicle or barrier. The layer-1 loop with plant run F-01b (straight highway): fault hard-over: torque ramped 15 per frame to 1500. SoC: commands a hard-over within the envelope. Host: inside the host torque limits. Panda: passes every frame: the ramp stays inside the envelope; no siren. Switch: intercept: the frames reach the car. EPS: steers with full LKA torque. Vehicle: runs out of lane: body on the 3.7 m lane line at 1.77 s; largest offset 9.04 m at 5.11 s. Driver: cue: 0.2 m drift at 1.14 s; corrects from 2.64 s. Only the driver stops it: correction from 2.64 s.</desc>
<style>
svg { --bg:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --grid:#e3e2de; --card:#f7f7f5;
      --real:#2a78d6; --real-bg:#e9f1fb; --amb:#c98500; --amb-bg:#fdf4dc; --bad:#e34948; --bad-bg:#fdecec;
      --pic:#6250d6; --pic-bg:#efedfb; --flt:#eb6834; --cop:#eb6834; --cop-bg:#fde9df; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8d8c85; --grid:#33322f; --card:#232321;
        --real:#3987e5; --real-bg:#16273c; --amb:#eda100; --amb-bg:#3a2f12; --bad:#e66767; --bad-bg:#3d1e1e;
        --pic:#9085e9; --pic-bg:#26223f; --flt:#d95926; --cop:#d95926; --cop-bg:#3f2417; }
}
.bg { fill:var(--bg); }
.h { font:600 21px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
