<svg xmlns="http://www.w3.org/2000/svg" width="640" height="808" viewBox="0 0 640 808" role="img" aria-labelledby="t d">
<title id="t">Simulation track dependencies by use and licence</title>
<desc id="d">Layer 1 plant: commonroad-vehicle-models, omegaconf, PyYAML, cffi, pycparser, pycapnp, numpy, all permissive. Plant FMU: pythonfmu and fmpy, permissive. L2 column: OpenModelica under its AGPL-3 option and micromamba. Layer 2: scenariogeneration and esmini, MPL-2.0. Layer 4 and the bound: numpy. Not used: Scenic and VerifAI, because rv-ltl is published without a licence.</desc>
