<svg xmlns="http://www.w3.org/2000/svg" width="640" height="730" viewBox="0 0 640 730" role="img" aria-labelledby="t d">
<title id="t">L2 steering column and the driver-override path (SG-05)</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. Driver torque on the steering wheel inertia, a torsion bar whose torque is STEER_TORQUE_DRIVER, the column, motor and rack as one inertia held by a rack stiffness; the motor follows the LKA command through a lag up to a torque limit. The host drops LKA when |STEER_TORQUE_DRIVER| reaches MAX_USER_TORQUE (500); the panda does not act on driver torque (GAP-02). Under the swept assumptions a strong fast driver gets LKA dropped within 0.2 s, a driver below the threshold never does, and the motor torque falls below 5 % about 0.36 s after the drop. The two N·m scales are unknown (M-08).</desc>
