<text x="110" y="476" class="tl">Harness switch</text>
<text x="110" y="494" class="t2b">MODEL</text>
<text x="110" y="516" class="t">nothing to pass</text>
<rect x="434.5" y="462" width="99.5" height="20" rx="10" class="f-model"/>
<text x="484.2" y="476" class="chip" text-anchor="middle">NOT INVOLVED</text>
