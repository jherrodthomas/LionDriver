<text x="110" y="698" class="t2b">MODEL · single-track Corolla</text>
<text x="110" y="720" class="t">stays in lane: largest offset 0.00 m</text>
<rect x="434.5" y="666" width="99.5" height="20" rx="10" class="f-model"/>
<text x="484.2" y="680" class="chip" text-anchor="middle">NOT INVOLVED</text>
<path d="M320.0,728 V754" class="arrd" marker-end="url(#a)"/>
<rect x="96" y="758" width="448" height="72" rx="8" class="plan"/>
<text x="110" y="782" class="tl">Driver</text>
<text x="110" y="800" class="t2b">ASSUMED · reacts 1.5 s after the cue</text>
<text x="110" y="822" class="t">drives manually; nothing to correct</text>
<rect x="434.5" y="768" width="99.5" height="20" rx="10" class="f-model"/>
<text x="484.2" y="782" class="chip" text-anchor="middle">NOT INVOLVED</text>
