<text x="110" y="272" class="tl">Host frames</text>
<text x="110" y="290" class="t2b">REAL CODE · opendbc toyotacan</text>
<text x="110" y="312" class="t">packs the frame</text>
<rect x="434.5" y="258" width="99.5" height="20" rx="10" class="f-bad"/>
<text x="484.2" y="272" class="chip" text-anchor="middle">PASSES IT ON</text>
<path d="M320.0,320 V346" class="arr" marker-end="url(#a)"/>
