<rect x="96" y="146" width="448" height="72" rx="8" class="model"/>
<text x="110" y="170" class="tl">SoC stand-in</text>
<text x="110" y="188" class="t2b">MODEL · not openpilot</text>
<text x="110" y="210" class="t">not engaged, yet sends a torque request</text>
<rect x="434.5" y="156" width="99.5" height="20" rx="10" class="f-flt"/>
<text x="484.2" y="170" class="chip" text-anchor="middle">FAULT ENTERS</text>
