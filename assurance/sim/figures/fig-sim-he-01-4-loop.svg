<rect x="96" y="554" width="448" height="72" rx="8" class="plan"/>
<text x="110" y="578" class="tl">EPS</text>
<text x="110" y="596" class="t2b">ASSUMED · release on lost frames</text>
<text x="110" y="618" class="t">no LKA torque arrives</text>
<rect x="434.5" y="564" width="99.5" height="20" rx="10" class="f-model"/>
<text x="484.2" y="578" class="chip" text-anchor="middle">NOT INVOLVED</text>
