<desc id="d">Synthetic (DSR-12), no evidence credit. Looping animation of plant run F-02 for HE-01.4: the Corolla's lateral offset on a straightened road from 1 s before the fault to 3.0 s after it, the offset plot with a moving cursor and the 0.5 s FTTI band, and the events: fault: torque request while not engaged at 0.00 s; panda refuses LKA frames at 0.00 s.</desc>
