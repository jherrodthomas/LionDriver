<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1014" viewBox="0 0 640 1014" role="img" aria-labelledby="t d">
<title id="t">HE-01.6 in the layer-1 loop: plant run F-03</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. HE-01.6 (ASIL C), The car does not stop in the target lane: it crosses the target lane's far line into the lane beyond, which the driver did not check before the change. The layer-1 loop with plant run F-03 (80 km/h, command frozen 27 % into a lane change to the left (EC-11)): fault command frozen mid lane change: the last frame repeats. SoC: repeats the frame of the moment it froze. Host: packs the repeated frames. Panda: passes every frame: a repeated frame is inside the envelope; no siren. Switch: intercept: the frames reach the car. EPS: keeps the lane-change torque. Vehicle: keeps moving sideways past the target lane: largest offset 16.37 m at 5.44 s. Driver: cue: drift at 0.98 s; corrects from 2.48 s, once past the target lane. Nothing in the item stops it; the driver's correction from 2.48 s comes after the car has left the target lane.</desc>
