.arrb { stroke:var(--bad); stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
.spring { stroke:var(--ink2); stroke-width:1.8; fill:none; stroke-linejoin:round; }
.strike { stroke:var(--bad); stroke-width:1.6; }
