<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1078" viewBox="0 0 640 1078" role="img" aria-labelledby="t d">
<title id="t">What each simulation layer can and cannot show</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. Four cards, one per layer, with its status and what it can and cannot show: layer 1 plant model (built), layer 2 known scenarios (built for 9 of 26), layer 3 MetaDrive closed loop (planned), layer 4 unknown-scenario search (prototype).</desc>
<style>
