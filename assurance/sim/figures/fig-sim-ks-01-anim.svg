<svg xmlns="http://www.w3.org/2000/svg" width="640" height="659" viewBox="0 0 640 659" role="img" aria-labelledby="t d">
<title id="t">KS-01 animated top view</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. Looping top view of KS-01 (Curve at or beyond the lateral capability) from its esmini replay at the parameter defaults, 3.5 to 13.2 s: Left curve R = 300 m at 99 km/h: the speed for 2.5 m/s² lateral acceleration. Plot: lateral acceleration of the ego (m/s²). Events: clothoid starts: curvature ramps up at 5.5 s; arc R = 300 m starts at 9.2 s; steady 2.50 m/s² (v²/R) at 10.2 s; loop ends at 13.2 s. Layer 2 fixes the road and the other road users. The ego only holds its start speed here; the item under test drives it in layer 1 and on the bench. Cars: Kenney Racing Pack (CC0).</desc>
