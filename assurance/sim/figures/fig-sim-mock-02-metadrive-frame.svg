<title id="t">Mock-up 2: a layer-3 MetaDrive clip frame (third-person view, instrumented)</title>
<desc id="d">MOCK-UP: layout and quantities only, illustrative numbers, not a result. What one frame of a MetaDrive closed-loop clip would show: the scenario in plan view with the Corolla and a lead vehicle, and an instrument strip with scenario ID, time, speed, engaged state, lateral error, alert state and the outcome class the WP-V-03 pass criteria use. openpilot never sees the mesh; it is drawn for the viewer.</desc>
