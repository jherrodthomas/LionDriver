<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1004" viewBox="0 0 640 1004" role="img" aria-labelledby="t d">
<title id="t">Layer 1 fault-injection loop with the real panda safety code in the loop</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. A perfect-perception SoC stand-in (model) sends LKA, ACC and heartbeat frames built by the real opendbc host code to the real panda safety code (reference build, TX hook, 100 Hz task, IWDG model). Frames it allows pass the harness switch (model) to the EPS and PCM (assumptions), which move the CommonRoad single-track Corolla (model). Perfect perception feeds back to the SoC, car-bus RX frames back to the panda; the driver (assumption) reacts 1.5 s after a cue. Fault injection points: F-01 to F-04 and L- at the SoC, F-05 panda hang, F-06 switch, F-07 EPS, F-08 RX.</desc>
