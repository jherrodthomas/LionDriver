<svg xmlns="http://www.w3.org/2000/svg" width="640" height="974" viewBox="0 0 640 974" role="img" aria-labelledby="t d">
<title id="t">HE-02.1 in the layer-1 loop: plant run F-07</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. HE-02.1 (ASIL C), Vehicle goes straight in the curve and departs the lane. The layer-1 loop with plant run F-07 (left curve at R_ODD, fault at curve entry): fault EPS fault: LKA_STATE 9, assist lost. SoC: keeps commanding; its frames are refused. Host: packs the frames. Panda: reads LKA_STATE 9: refuses LKA 0.005 s, revokes 0.048 s, siren 0.29 s. Switch: intercept. EPS: fault: steering assist lost. Vehicle: runs out of lane: body on the 3.7 m lane line at 1.97 s; largest offset 1.84 m at 3.00 s. Driver: cue: siren at 0.29 s; corrects from 1.79 s. The panda warns at 0.29 s; the driver stops it from 1.79 s.</desc>
<style>
svg { --bg:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --grid:#e3e2de; --card:#f7f7f5;
      --real:#2a78d6; --real-bg:#e9f1fb; --amb:#c98500; --amb-bg:#fdf4dc; --bad:#e34948; --bad-bg:#fdecec;
      --pic:#6250d6; --pic-bg:#efedfb; --flt:#eb6834; --cop:#eb6834; --cop-bg:#fde9df; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8d8c85; --grid:#33322f; --card:#232321;
        --real:#3987e5; --real-bg:#16273c; --amb:#eda100; --amb-bg:#3a2f12; --bad:#e66767; --bad-bg:#3d1e1e;
        --pic:#9085e9; --pic-bg:#26223f; --flt:#d95926; --cop:#d95926; --cop-bg:#3f2417; }
}
