<text x="110" y="170" class="tl">SoC stand-in</text>
<text x="110" y="188" class="t2b">MODEL · not openpilot</text>
<text x="110" y="210" class="t">keeps commanding; its frames are refused</text>
<rect x="434.5" y="156" width="99.5" height="20" rx="10" class="f-model"/>
