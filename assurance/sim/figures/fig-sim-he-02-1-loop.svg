<rect x="96" y="472" width="448" height="72" rx="8" class="plan"/>
<text x="110" y="496" class="tl">Harness switch</text>
<text x="110" y="514" class="t2b">MODEL</text>
<text x="110" y="536" class="t">intercept</text>
<rect x="434.5" y="482" width="99.5" height="20" rx="10" class="f-model"/>
<text x="484.2" y="496" class="chip" text-anchor="middle">NOT INVOLVED</text>
<path d="M320.0,544 V570" class="arrd" marker-end="url(#a)"/>
<rect x="96" y="574" width="448" height="72" rx="8" class="amb"/>
<text x="110" y="598" class="tl">EPS</text>
<text x="110" y="616" class="t2b">ASSUMED · release on lost frames</text>
<text x="110" y="638" class="t">fault: steering assist lost</text>
<rect x="434.5" y="584" width="99.5" height="20" rx="10" class="f-flt"/>
<text x="484.2" y="598" class="chip" text-anchor="middle">FAULT ENTERS</text>
<path d="M320.0,646 V672" class="arr" marker-end="url(#a)"/>
<rect x="96" y="676" width="448" height="92" rx="8" class="model"/>
<text x="110" y="700" class="tl">Vehicle</text>
<text x="110" y="718" class="t2b">MODEL · single-track Corolla</text>
<text x="110" y="740" class="t">runs out of lane: body on the 3.7 m lane line at</text>
<text x="110" y="760" class="t">1.97 s; largest offset 1.84 m at 3.00 s</text>
<rect x="434.5" y="686" width="99.5" height="20" rx="10" class="f-bad"/>
<text x="484.2" y="700" class="chip" text-anchor="middle">PASSES IT ON</text>
