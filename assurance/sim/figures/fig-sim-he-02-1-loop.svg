<rect x="96" y="798" width="448" height="72" rx="8" class="amb"/>
<text x="110" y="822" class="tl">Driver</text>
<text x="110" y="840" class="t2b">ASSUMED · reacts 1.5 s after the cue</text>
<text x="110" y="862" class="t">cue: siren at 0.29 s; corrects from 1.79 s</text>
<rect x="462.3" y="808" width="71.7" height="20" rx="10" class="f-real"/>
