<text x="110" y="434" class="t">0.048 s, siren 0.29 s</text>
<rect x="483.2" y="360" width="50.8" height="20" rx="10" class="f-real"/>
<text x="508.6" y="374" class="chip" text-anchor="middle">WARNS</text>
