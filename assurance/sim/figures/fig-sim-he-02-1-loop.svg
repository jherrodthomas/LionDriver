<text x="24" y="58" class="t2">Vehicle goes straight in the curve and departs the lane</text>
<text x="24" y="80" class="tbad">Synthetic (DSR-12) · no evidence credit</text>
<text x="24" y="99" class="t2b">Plant run F-07: left curve at R_ODD, fault at curve entry</text>
<line x1="24" y1="110" x2="616" y2="110" class="hair"/>
<text x="24" y="132" class="t2b">FAULT: EPS FAULT: LKA_STATE 9, ASSIST LOST</text>
