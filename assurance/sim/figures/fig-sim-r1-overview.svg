<svg xmlns="http://www.w3.org/2000/svg" width="640" height="856" viewBox="0 0 640 856" role="img" aria-labelledby="t d">
<title id="t">Simulation track at a glance: four layers and the Blender scenes</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. Inputs faults.yaml and WP-V-03 feed layer 1 (plant model with the real panda safety code, built) and layer 2 (known scenarios as OpenSCENARIO, 10 of 27 built). Layer 1 feeds layer 4 (failure search and reachability bound, prototype); layer 2 and the panda code feed layer 3 (MetaDrive closed loop, planned). Plant runs or kinematic motions become scene.json, are rendered in Blender and composed into review dashboards and clips. Results rank risks and guide tests; no evidence until an approved fidelity case.</desc>
