<svg xmlns="http://www.w3.org/2000/svg" width="640" height="622" viewBox="0 0 640 622" role="img" aria-labelledby="t d">
<title id="t">KS-25 animated top view</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. Looping top view of KS-25 (Speed above the ODD bound) from its esmini replay at the parameter defaults, 0.0 to 6.9 s: The ego accelerates through the 110 km/h ODD bound (DQ-260 A). Plot: ego speed (km/h). Events: ego accelerates at 0.5 m/s² (scripted here) at 1.0 s; ego crosses 110 km/h at 3.9 s; loop ends at 6.9 s. Layer 2 fixes the road and the other road users. The ego's acceleration is scripted in the file; in a closed loop the item limits it. Cars: Kenney Racing Pack (CC0).</desc>
