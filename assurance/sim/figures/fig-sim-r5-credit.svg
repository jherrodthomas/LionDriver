<svg xmlns="http://www.w3.org/2000/svg" width="640" height="826" viewBox="0 0 640 826" role="img" aria-labelledby="t d">
<title id="t">When a simulation result counts: evidence gate and hand-back</title>
<desc id="d">Synthetic (DSR-12), no evidence credit. A result from layers 1 to 4 meets the gate: is a WP-V-02 §5.3 fidelity case approved for its scenario family (DQ-139)? It needs the model validated against Corolla logs. No, for every family today: the result ranks risks and guides bench and car tests, labelled synthetic. Yes, for none yet: evidence credit for that family only. Results are handed back: timing to the safety-concept session (WP-S-04), scenario results to the SOTIF session (WP-V-03/04), simulated times to the System FMEA session.</desc>
<style>
svg { --bg:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --grid:#e3e2de; --card:#f7f7f5;
      --real:#2a78d6; --real-bg:#e9f1fb; --amb:#c98500; --amb-bg:#fdf4dc; --bad:#e34948; --bad-bg:#fdecec;
      --pic:#6250d6; --pic-bg:#efedfb; --flt:#eb6834; --cop:#eb6834; --cop-bg:#fde9df; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8d8c85; --grid:#33322f; --card:#232321;
        --real:#3987e5; --real-bg:#16273c; --amb:#eda100; --amb-bg:#3a2f12; --bad:#e66767; --bad-bg:#3d1e1e;
        --pic:#9085e9; --pic-bg:#26223f; --flt:#d95926; --cop:#d95926; --cop-bg:#3f2417; }
}
.bg { fill:var(--bg); }
.h { font:600 21px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.t { font:15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.tb { font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.tl { font:600 17px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.t2 { font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.t2b { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.chip { font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:#ffffff; }
.tbad { font:600 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--bad); }
.hair { stroke:var(--grid); stroke-width:1; }
.card { fill:var(--card); stroke:var(--grid); stroke-width:1.2; }
.real { fill:var(--real-bg); stroke:var(--real); stroke-width:2.4; }
.model { fill:var(--card); stroke:var(--ink3); stroke-width:1.4; }
.amb { fill:var(--amb-bg); stroke:var(--amb); stroke-width:1.6; stroke-dasharray:6 4; }
.plan { fill:var(--bg); stroke:var(--ink3); stroke-width:1.4; stroke-dasharray:6 4; }
.pic { fill:var(--pic-bg); stroke:var(--pic); stroke-width:1.4; }
.picbox { fill:var(--bg); stroke:var(--pic); stroke-width:1.2; }
.badbox { fill:var(--bad-bg); stroke:var(--bad); stroke-width:1.4; }
.copbox { fill:var(--cop-bg); stroke:var(--cop); stroke-width:1.4; }
.f-real { fill:var(--real); } .f-model { fill:var(--ink3); } .f-amb { fill:var(--amb); } .f-bad { fill:var(--bad); }
.f-pic { fill:var(--pic); } .f-flt { fill:var(--flt); } .f-cop { fill:var(--cop); } .f-ink2 { fill:var(--ink2); }
.arr { stroke:var(--ink2); stroke-width:1.6; fill:none; }
.arrd { stroke:var(--ink3); stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
.arrb { stroke:var(--bad); stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
.spring { stroke:var(--ink2); stroke-width:1.8; fill:none; stroke-linejoin:round; }
.strike { stroke:var(--bad); stroke-width:1.6; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink2"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-bad"/></marker></defs>
<rect class="bg" width="640" height="826"/>
<text x="24" y="34" class="h">When a simulation result counts</text>
<text x="24" y="56" class="t2">§4: the evidence gate, and where results are handed back</text>
<text x="24" y="76" class="tbad">Synthetic (DSR-12) · no evidence credit · generated by fig_sim_readme.py</text>
<line x1="24" y1="90" x2="616" y2="90" class="hair"/>
<rect x="150" y="106" width="340" height="50" rx="8" class="card"/>
<text x="320" y="137" class="tb" text-anchor="middle">Result from layers 1–4</text>
<path d="M320.0,156 V178" class="arr" marker-end="url(#a)"/>
<path d="M320.0,182 L520.0,242 L320.0,302 L120.0,242 Z" class="card"/>
<text x="320" y="230" class="tb" text-anchor="middle">Fidelity case approved</text>
<text x="320" y="250" class="tb" text-anchor="middle">for this scenario family?</text>
<text x="320" y="272" class="t2" text-anchor="middle">WP-V-02 §5.3 · DQ-139</text>
<rect x="84" y="318" width="472" height="54" rx="8" class="amb"/>
<text x="98" y="340" class="t2">Needs the model validated against Corolla logs: EPS lag, steer</text>
<text x="98" y="357" class="t2">ratio, tyre stiffness (S7).</text>
<path d="M120.0,242 H60 V392" class="arr" marker-end="url(#a)"/>
<text x="70" y="232" class="tbad">NO · every family today</text>
<path d="M520.0,242 H580 V392" class="arrd" marker-end="url(#a)"/>
<text x="570" y="232" class="t2b" text-anchor="end">YES · none yet</text>
<rect x="24" y="396" width="360" height="132" rx="8" class="badbox"/>
<text x="38" y="420" class="tb">Ranks risks, guides tests</text>
<text x="38" y="444" class="t">Chooses the bench and car tests.</text>
<text x="38" y="464" class="t">Labelled synthetic (DSR-12), kept apart</text>
<text x="38" y="484" class="t">from real data.</text>
<rect x="400" y="396" width="216" height="132" rx="8" class="plan"/>
<text x="414" y="420" class="tb">Evidence credit</text>
<text x="414" y="444" class="t">for that scenario</text>
<text x="414" y="464" class="t">family only</text>
<text x="24" y="566" class="t2b">NOT SELF-CREDITED: HANDED BACK</text>
<rect x="24" y="580" width="592" height="58" rx="8" class="card"/>
<text x="38" y="604" class="tb">Timing</text>
<text x="38" y="624" class="t">→ safety-concept session</text>
<text x="240" y="604" class="t2">decides what enters WP-S-04</text>
<rect x="24" y="646" width="592" height="58" rx="8" class="card"/>
<text x="38" y="670" class="tb">Scenario results</text>
<text x="38" y="690" class="t">→ SOTIF session</text>
<text x="240" y="670" class="t2">WP-V-03 / WP-V-04</text>
<rect x="24" y="712" width="592" height="66" rx="8" class="card"/>
<text x="38" y="736" class="tb">Simulated times</text>
<text x="38" y="756" class="t">→ System FMEA session</text>
<text x="240" y="736" class="t2">rating tables allow measured, code-derived or unknown</text>
<text x="240" y="753" class="t2">only; a new category needs its acceptance</text>
<text x="24" y="804" class="t2">The track does not edit those documents.</text>
</svg>
