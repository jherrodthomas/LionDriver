  # ---------------------------------------------------------------------------------------------- edge cases (search)
  # Worst cases of the failure search (search/families.yaml, results/edge-cases.md), each reproducing its catalogue
  # row exactly. Synthetic (DSR-12), no evidence credit.
  - id: ec-11-lane-change-frozen-overshoot
    he: HE-02.5
    variants: [{conditions: W06, traffic: dense}]
    edge_case: EC-11
    case: F-03
    case_overrides: {road: straight, speed_kph: 80.0, t_fault: 7.069, duration: 8.0, lane_change: 6.0, lane_change_s: 3.96}
    assumptions: {driver_t_r_s: 1.5}
    case_title: "Steering command frozen 27 % into an assisted lane change to the left (F-03), 80 km/h"
    trigger_label: command frozen mid lane change
    window: [-1.5, 6.0]
    environment: highway-free-flow
    road: {lanes_left: 2}
    actors:
      - {name: car two lanes left, kind: car, lane: 2, ds_m: 12, speed_kph: 85, source: illustrative, critical: true, paint: [0.85, 0.86, 0.88]}
    caption: >-
      Catalogue row EC-11, a new-hazard finding (EC-N1): the frozen frame keeps the lateral push of the lane change, so
      the car does not stop in the target lane but runs on toward the lane beyond it, which the driver did not check.
      HE-02.5 rates the opposite effect (the car stops and straddles). The car two lanes over is illustrative.

