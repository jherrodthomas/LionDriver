  - id: sh-13-construction-zone
    sotif: {id: SH-13, title: "Stays engaged outside the ODD", situation: "Construction zone: lane shift, cones (TC-06)", effect: "Raises SH-01 to SH-06: follows the old markings into the cones", s: 3, c: 2}
