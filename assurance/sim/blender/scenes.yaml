    window: [-1.5, 6.0]
    environment: highway-tunnel
    tc: [TC-18]
    caption: >-
      Catalogue row EC-04: the SoC stalls in a curve near the item's limit, just before a tunnel. The panda revokes
      and sounds the siren (DQ-404), but with the EPS releasing at once the car still runs wide before a driver who
      reacts after 1.5 s; if the EPS held its last torque for 2 s (EPS-hold) it would stay in lane. The tunnel and its
      lighting change are drawn, not simulated (the plant has no perception).

