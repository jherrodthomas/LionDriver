  # longitudinal and hand-over rows of the search: the plant's own lead and follower are drawn
  - id: ec-28-lead-brakes-decel-lost
    he: HE-06.3
    variants: [{conditions: W04, traffic: dense}]
    edge_case: EC-28
    case: L-03
    case_overrides: {fault: decel_lost, speed_kph: 104.1, duration: 10.0, acc_follow: true, lead_gap_s: 2.5, lead_brake: 4.95, lead_brake_t: 6.0}
    assumptions: {driver_ttc_cue_s: 2.21}
    case_title: "The lead brakes at 4.95 m/s² and the item's deceleration is silently lost at once, 104 km/h"
    critical: lead
    trigger_label: lead brakes; deceleration silently lost
    window: [-1.5, 8.0]
    environment: highway-free-flow
    traffic: free-flow
    tc: [TC-33]
    ks: [KS-08]
    caption: >-
      Catalogue row EC-28: following at a 2.5 s gap, the lead brakes hard and the item's request stays at zero (a
      stale plan; the panda passes the frames, so there is no siren). The driver notices the missing deceleration and
      brakes after 1.5 s, but only at 3 m/s², and runs into the lead at about 45 km/h. Braking at 8 m/s², which a dry
      road gives, avoids it; the plant has no tyre friction limit, so on a wet road it would not.

