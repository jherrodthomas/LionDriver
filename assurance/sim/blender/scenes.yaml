    window: [-2.5, 5.0]
    environment: highway-exit-split
    tc: [TC-31]
    caption: >-
      Catalogue row EC-12: the SoC stalls 71 % into a 3 s lane change to the left, away from the exit lane. The panda
      revokes and sounds the siren (DQ-404), so the driver catches the car just inside the target lane's far line
      (0.06 m to spare). With the siren muted, as before DQ-404, the car ran over that line (EC-N1); with the EPS
      holding its last torque it would too. The exit split is drawn, not simulated.

  - id: ec-03-frozen-curve-exit
