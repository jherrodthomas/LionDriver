  - id: sh-11-pedestrian-occluded
    sotif: {id: SH-11, title: "No reaction to a vulnerable road user entering the path", situation: "OS-04 urban, pedestrian emerging from behind a parked truck, low sun", effect: "Pedestrian struck", s: 3, c: 2}
