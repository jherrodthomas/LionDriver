    case_title: "Fire engine stopped across the lane at a crash scene, not taken as lead, at night (105 km/h)"
    window: [-1.0, 5.0]
    environment: highway-free-flow
    conditions: W03
    variants: [W01]
    ego:
      speed_kph: 105
      accel:
        - {t: t_r, a: a_driver_full}
    actors:
      - {name: fire engine, kind: truck, lane: 0, ds_m: 3.0 * 105 / 3.6 + (4.63 + 9.5) / 2, yaw_deg: -15, critical: true, beacons: true, body: fire_truck, paint: [0.62, 0.04, 0.03]}
      - {name: crashed car, kind: car, lane: -1, ds_m: 3.0 * 105 / 3.6 + 22, yaw_deg: 35, source: illustrative, paint: [0.3, 0.32, 0.35]}
      - {name: patrol car, kind: car, d: -7.0, ds_m: 3.0 * 105 / 3.6 - 14, source: illustrative, beacons: true, body: police_sedan, paint: [0.92, 0.92, 0.92]}
      - {name: ambulance, kind: van, d: -7.0, ds_m: 3.0 * 105 / 3.6 + 34, source: illustrative, beacons: true, body: ambulance, paint: [0.95, 0.95, 0.93]}
      - {name: tow truck, kind: van, d: -7.0, ds_m: 3.0 * 105 / 3.6 + 50, source: illustrative, body: towtruck, paint: [0.9, 0.75, 0.1]}
      - {name: firefighter, kind: pedestrian, d: -4.6, ds_m: 3.0 * 105 / 3.6 + 16, source: illustrative, figure: male}
      - {name: police officer, kind: pedestrian, d: -6.2, ds_m: 3.0 * 105 / 3.6 - 9, source: illustrative, figure: female}
    props:
      - {kind: cones, points: [[3.0 * 105 / 3.6 - 30, -5.4], [3.0 * 105 / 3.6 - 24, -4.6], [3.0 * 105 / 3.6 - 18, -3.8], [3.0 * 105 / 3.6 - 12, -3.0]]}
    events:
      - {t: t_r, label: driver brakes (6 m/s²)}
    trigger_label: TTC 3 s, no deceleration (KS-05)
    caption: >-
      A fire engine shields a crash scene, stopped at an angle across the ego's lane with its beacons flashing; a
      patrol car, an ambulance and a tow truck stand on the shoulder. The item does not take the stationary engine as its lead: at TTC 3 s, where
      KS-05 expects the first deceleration, nothing happens, and the driver brakes after the reaction time. The
      pattern of the crashes NHTSA's preliminary evaluation PE26007 (2026) reports (stopped vehicles in the travel
      lane, one a first responder's); not a reconstruction of any of them.

  - id: sh-08-pcs-delayed
    sotif: {id: SH-08, title: "Stock PCS performance degraded by the item", situation: "OS-09 imminent collision with the item installed", effect: "H-08 collision less mitigated", s: 3, c: 3}
    ks: [KS-20]
