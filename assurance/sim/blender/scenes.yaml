    window: [-1.5, 7.0]
    environment: highway-curve
    traffic: free-flow
    caption: >-
      Catalogue row EC-03: the command freezes halfway round a short curve. Nothing happens until the road straightens;
      then the frozen curve torque keeps turning the car left, onto the inside lane, about 4.7 s after the fault.
      HE-02.3 (steering bias while the road changes).

  - id: ec-04-stall-curve-tunnel
    he: HE-02.4
    variants: [{conditions: W04, traffic: dense}]
