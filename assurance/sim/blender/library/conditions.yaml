# Weather, surface and lighting conditions of the hazardous-event scenes: the HARA's W-codes (WP-C-03 §3.1,
# 02-concept/hara/hara_model.py WEATHER) and one SOTIF lighting preset (TC-01, WP-C-06). A scene names one with
# `conditions:`; `variants:` re-renders it under others. A condition changes the picture only: the motion is the same
# under every condition (the plant's tyre model is linear, with no friction limit; the kinematic scenes use the stated
# accelerations), and the dashboard says so.
#
#   title       as the HARA writes it
#   exposure    the condition's exposure class (HARA), or null for a SOTIF triggering condition
#   odd         in or outside the ODD (WP-C-02 §3: precipitation none or light rain; visibility >= 200 m)
#   hara        what hara_model.weather_adjust changes for this condition (shown on the dashboard)
#   env         what hazard_scene.py draws:
#                 sky            clear, partly, overcast, night (picks the HDRI slot of library/assets.yaml when present)
#                 sun            behind, ahead (in the driver's eyes), side; sun_elevation in degrees;
#                                sun_offset: degrees from the direction of travel (negative = left), replacing the
#                                preset's direction;
#                                sun_strength: the sun lamp relative to a clear day's (overcast default 0.35);
#                                sky_strength: an overcast sky's brightness relative to the default (below 1: moodier)
#                 night          no sun; headlights on every car, street lights where the environment has them
#                 wet            0..1: darker, glossier asphalt; puddles in its low spots above 0.5; from 0.75 a
#                                water film with streaky reflections along the road
#                 rain           0..1: falling streaks around the ego (1 = heavy)
#                 snow           0..1: snow on the verges and shoulders, slush beside the wheel tracks; snowfall
#                 ice            glossy patches on the road
#                 visibility_m   haze or fog: meteorological visibility (extinction 3 / V per metre)
#                 glare          bloom round the sun, lamps and bright reflections
#                 haze_km        aerial perspective on a clear day: a thin blue haze for this visibility (km), drawn
#                                with an environment's horizon
#                 cloud_shadows  soft cloud shadows drifting over the ground (clear or partly cloudy skies; an
#                                environment may switch them off)
#                 spray          0..1: a plume of spray behind the wheels of every moving car and truck
schema_version: 1
conditions:
  W01:
    title: Dry, daylight
    exposure: E4
    odd: in
    hara: The reference condition of most hazardous events
    env: {sky: clear, sun: behind, sun_elevation: 30, wet: 0.0, haze_km: 22, cloud_shadows: true}

  W02:
    title: Wet road or light rain
    exposure: E3
    odd: in
    hara: "H-04 in a curve (OS-02, OS-14, OS-16): S3, C1 ⚠ (instability under unexpected braking, HE-04.2)"
    env: {sky: overcast, sun: behind, sun_elevation: 30, sun_strength: 0.5, sky_strength: 0.8, wet: 0.75, rain: 0.25, visibility_m: 1500,
          spray: 0.45}

  W03:
    title: Night, dry, headlights
    exposure: E3
    odd: in
    hara: No change to S or C; exposure E3
    env: {sky: night, night: true, wet: 0.0, glare: true}

  W04:
    title: Moderate or heavy rain (outside the ODD, foreseeable)
    exposure: E2
    odd: outside
    hara: "H-04 in a curve: S3, C1 ⚠; H-06 and H-10: C+1 (reduced visibility delays the driver's detection)"
    env: {sky: overcast, sun: behind, sun_elevation: 25, sun_strength: 0.3, sky_strength: 0.7, wet: 1.0, rain: 1.0, visibility_m: 350,
          spray: 1.0}

  W05:
    title: Snow or ice (outside the ODD, foreseeable)
    exposure: E2
    odd: outside
    hara: "H-01, H-02, H-03, H-06, H-07, H-10: C+1 (low friction); H-04: S+1, C+1 (braking can destabilise)"
    env: {sky: overcast, sun: behind, sun_elevation: 20, sun_strength: 0.45, wet: 0.5, snow: 1.0, ice: true,
          visibility_m: 600}

  W06:
    title: Fog, visibility below the ODD bound (outside the ODD, foreseeable)
    exposure: E1
    odd: outside
    hara: "H-06 and H-10: C+1 (reduced visibility delays the driver's detection)"
    env: {sky: overcast, sun: behind, sun_elevation: 30, sun_strength: 0.35, sky_strength: 0.85, wet: 0.3, visibility_m: 120}

  TC-01:
    title: Low sun in the camera field of view (SOTIF triggering condition, WP-C-06)
    exposure: null
    odd: in
    hara: Not a HARA condition; drawn for SOTIF hazards (SH-06, SH-11) whose triggering condition it is
    # The sun of a real corridor case: I-85 southbound (heading 243°) at Greenville SC, 15 Dec 16:40 EST, azimuth
    # 236.0°, elevation 6.3° (NREL SPA via ../weather/sun_glare.py; ../results/sun-glare.md): 7.0° left of the
    # direction of travel, inside the road camera's 40.0 x 25.7° frame.
    env: {sky: clear, sun: ahead, sun_offset: -7.0, sun_elevation: 6.3, wet: 0.0, glare: true, haze_km: 22}

  TC-01-NB:
    title: Low sun in the camera field of view, summer morning northbound (SOTIF triggering condition, WP-C-06)
    exposure: null
    odd: in
    hara: Not a HARA condition; the other glare season of TC-01, drawn as a variant of SH-06 and SH-11
    # I-85 northbound (heading 63°) at Greenville SC, 21 Jun 07:00 EDT: azimuth 66.4°, elevation 7.3° (NREL SPA via
    # ../weather/sun_glare.py; ../results/sun-glare.md), 3.4° right of the direction of travel. Northbound the sun is
    # in the road camera's frame on April-August mornings, southbound (TC-01) on October-March evenings.
    env: {sky: clear, sun: ahead, sun_offset: 3.4, sun_elevation: 7.3, wet: 0.0, glare: true, haze_km: 22}
