# Asset slots of the hazardous-event scenes: sky HDRIs, PBR ground textures and scanned plant models from Poly
# Haven (polyhaven.com, every asset CC0 1.0) and ambientCG (ambientcg.com, every asset CC0 1.0), and CC-BY 4.0 model
# kits (buildings, cars, a trailer) from Sketchfab kept in the private repository LionDriver-assets. fetch_assets.py downloads
# each slot into dest (git-ignored, under assurance/sim/assets/library/) and writes the chosen asset IDs, file names
# and SHA-256 sums to library/assets.lock.json, which is committed. hazard_scene.py uses a slot's files when they are
# present and its procedural look when they are not, so CI and offline runs need none of them.
#
#   kind         hdri (an equirectangular sky), pbr (a tiling ground material), model (a scanned plant or piece of
#                street furniture, glTF; Poly Haven only) or kit (a set of CC-BY models from LionDriver-assets, drawn
#                by scenery_kits.py as street_life.py plans; render-only extras, never read by export_scene.py)
#   use          what it is for
#   size_m       pbr: the real-world size one texture tile covers ([x, y] for a non-square image), as the source publishes it for the first
#                candidate (Poly Haven "dimensions", ambientCG dimensionX); a fallback asset is drawn at the same size
#   strength     hdri: background strength (the sun lamp still lights the scene and casts the shadows)
#   tint         pbr, optional: multiplies the colour map, to bring a scan to the surface's real albedo (fresh
#                asphalt about 0.05, dry gravel shoulder about 0.15, linear)
#   roughness_min  pbr, optional: floor on the roughness map, where a glossy scan would shine at grazing angles
#   role         model: what it stands in for: broadleaf or conifer (the roadside trees), shrub (under the trees of a
#                tree-lined road), verge_short or verge_meadow (grass clumps beside the road; short on the first metre);
#                bin, bench, hydrant or utility_box (urban street furniture, placed by street_layout.py at scanned size)
#   height_m     model, trees and shrubs: [low, high] height of an instance before the scenery's own scale (urban
#                street trees are 0.55 of it); each mesh of the glTF is a variant, scaled to that height
#   scale        model, grass: [low, high] scale of a clump, which keeps its scanned size at 1
#   exclude      model, optional: meshes whose names contain any of these are left out
#   groups       model, optional: each variant as a list of the glTF's mesh names (a bench is a seat, legs and
#                arm rests); without it every mesh is a variant
#   candidates   tried in order: source (polyhaven, ambientcg) and asset ID; the first one that resolves is used.
#                Chosen offline, then checked against the sites' previews and dimensions on 2026-10-18
#   search       when no candidate resolves: the source and what to search for (Poly Haven categories, ambientCG
#                query); the most downloaded match is used
#   maps         pbr: the texture maps wanted (color, normal, roughness, displacement, ao)
#   resolution   1k or 2k (Poly Haven) / 1K-JPG or 2K-JPG (ambientCG); models at 1k
#   licence, title, author, page   kit: the licence and the credit a published render owes (library/README.md §5)
#   file         kit: the model file inside the unpacked zip (.fbx, .blend or .gltf)
#   pieces       kit: {use: [mesh names]}: which meshes stand in for what. city_block (a building on the building
#                line, its facade toward -Y in the file), skyline (towers set back beyond the street), farm and
#                roadside (rural buildings), bins (grain bins), cars (the car pack: each body with its wheels) and
#                trailer (a box trailer, its kingpin end toward -Y); [all] takes every mesh as one piece
#   scale        kit: metres per file unit, where the file is not in metres
#   skip         kit: objects of a .blend left out (its camera, light, own pavement)
#   textures     kit: the folder the model's images are in, where the file points elsewhere
#   width_m      kit: the real width a piece is scaled to (a US box trailer is 2.59 m wide)
schema_version: 1
licence: CC0 1.0 Universal (public domain dedication), no attribution required; kits CC-BY 4.0 (each slot's licence)
dest: assurance/sim/assets/library
slots:
  # ---------------------------------------------------------------------------------------------- skies
  hdri_clear:
    kind: hdri
    use: W01 dry daylight (sky clear or partly cloudy)
    strength: 0.6
    resolution: 2k
    candidates:
      - {source: polyhaven, id: kloofendal_48d_partly_cloudy_puresky}
      - {source: polyhaven, id: kloofendal_43d_clear_puresky}
      - {source: ambientcg, id: DaySkyHDRI019A}
    search: {source: polyhaven, categories: [skies, clear]}

  hdri_overcast:
    kind: hdri
    use: W02, W04, W05, W06 (overcast sky, soft light)
    strength: 0.8
    resolution: 2k
    candidates:
      - {source: polyhaven, id: overcast_soil_puresky}
      - {source: polyhaven, id: kloofendal_overcast_puresky}
      - {source: ambientcg, id: DaySkyHDRI038A}
    search: {source: polyhaven, categories: [skies, overcast]}

  hdri_low_sun:
    kind: hdri
    use: TC-01 low sun ahead (sunrise or sunset)
    strength: 0.6
    resolution: 2k
    candidates:
      - {source: polyhaven, id: spruit_sunrise}
      - {source: polyhaven, id: kloofendal_misty_morning_puresky}
      - {source: ambientcg, id: EveningSkyHDRI015A}
    search: {source: polyhaven, categories: [skies, sunrise-sunset]}

  hdri_night:
    kind: hdri
    use: W03 night (dark sky with some ambient light)
    strength: 0.4
    resolution: 2k
    candidates:
      - {source: polyhaven, id: dikhololo_night}
      - {source: polyhaven, id: moonless_golf}   # floodlights on its horizon: the brightest spot is not a sky
      - {source: ambientcg, id: NightSkyHDRI008}
    search: {source: polyhaven, categories: [skies, night]}

  # ---------------------------------------------------------------------------------------------- ground
  asphalt:
    kind: pbr
    use: Carriageway, parking lane and the highway shoulder
    size_m: 3.0
    tint: 0.5
    resolution: 2k
    maps: [color, normal, roughness]
    candidates:
      - {source: polyhaven, id: asphalt_02}
      - {source: ambientcg, id: Asphalt012}
      - {source: ambientcg, id: Road007}
    search: {source: ambientcg, query: asphalt}

  grass:
    kind: pbr
    use: Verges and fields
    size_m: 1.4
    roughness_min: 0.8
    resolution: 1k
    maps: [color, normal, roughness]
    candidates:                         # aerial_grass_rock (15 m, mostly bare earth) dropped: a mud field, not a verge
      - {source: ambientcg, id: Grass004}
      - {source: ambientcg, id: Grass001}
      - {source: polyhaven, id: leafy_grass}
    search: {source: ambientcg, query: grass}

  gravel:
    kind: pbr
    use: Rural shoulders
    size_m: 2.0
    tint: 0.45
    resolution: 1k
    maps: [color, normal, roughness]
    candidates:
      - {source: polyhaven, id: gravel_floor_02}  # gravelly_sand dropped: orange desert sand, not a road shoulder
      - {source: ambientcg, id: Gravel022}
      - {source: ambientcg, id: Gravel023}
    search: {source: ambientcg, query: gravel}

  concrete:
    kind: pbr
    use: Sidewalks, overpass, kerbs
    size_m: [1.1, 0.55]
    resolution: 1k
    maps: [color, normal, roughness]
    candidates:                         # concrete_floor_02 (a stained indoor floor) moved to the back
      - {source: ambientcg, id: Concrete034}
      - {source: ambientcg, id: PavingStones130}
      - {source: polyhaven, id: concrete_floor_02}
    search: {source: ambientcg, query: concrete}

  snow:
    kind: pbr
    use: Verges and shoulders under W05
    size_m: 2.0
    resolution: 1k
    maps: [color, normal, roughness]
    candidates:
      - {source: polyhaven, id: snow_02}
      - {source: ambientcg, id: Snow006}
      - {source: ambientcg, id: Snow010A}
    search: {source: ambientcg, query: snow}

  # ---------------------------------------------------------------------------------------------- plants
  # Poly Haven's glTFs hold only the full-detail mesh (0.4 to 2 million triangles a tree). Every instance shares it,
  # so memory grows with the number of models, not trees: about +3 GB peak and +12 s a 1280 x 720 still at 16
  # samples on 4 cores (2026-10-18). Chosen for a temperate roadside; checked against the site previews.
  tree_broadleaf_a:
    kind: model
    role: broadleaf
    use: Roadside and field trees (scenery trees, open), urban street trees
    height_m: [6.0, 8.4]
    resolution: 1k
    candidates:
      - {source: polyhaven, id: island_tree_02}
      - {source: polyhaven, id: island_tree_01}
    search: {source: polyhaven, categories: [trees]}

  tree_broadleaf_b:
    kind: model
    role: broadleaf
    use: Roadside and field trees (scenery trees, open), urban street trees
    height_m: [6.0, 8.4]
    resolution: 1k
    candidates:                         # jacaranda_tree dropped: a 200 MB mesh at 1k
      - {source: polyhaven, id: tree_small_02}
      - {source: polyhaven, id: island_tree_03}
    search: {source: polyhaven, categories: [trees]}

  tree_conifer:
    kind: model
    role: conifer
    use: Conifers among the roadside and field trees (more of them under W05)
    height_m: [6.4, 9.0]
    resolution: 1k
    candidates:                         # pine_tree_01 dropped: 17 million triangles
      - {source: polyhaven, id: fir_sapling_medium}
      - {source: polyhaven, id: pine_sapling_medium}
    search: {source: polyhaven, categories: [trees]}

  shrub:
    kind: model
    role: shrub
    use: Shrubs under the trees of a tree-lined road
    height_m: [0.7, 1.3]
    resolution: 1k
    candidates:
      - {source: polyhaven, id: shrub_02}
      - {source: polyhaven, id: shrub_04}
    search: {source: polyhaven, categories: [plants, ground cover]}

  verge_short:
    kind: model
    role: verge_short
    use: Short grass on the first metre beside the road (rural and highway verges, not under snow)
    scale: [0.7, 1.1]
    exclude: [single, dead]             # lone blades and dead stalks: noise at road distance
    resolution: 1k
    candidates:
      - {source: polyhaven, id: grass_bermuda_01}
      - {source: polyhaven, id: grass_medium_01}
    search: {source: polyhaven, categories: [grass]}

  verge_meadow:
    kind: model
    role: verge_meadow
    use: Longer grass from 0.5 m to 6.5 m beside the road, thinning out into the field
    scale: [1.0, 1.8]
    resolution: 1k
    candidates:
      - {source: polyhaven, id: grass_medium_02}
      - {source: polyhaven, id: grass_medium_01}
    search: {source: polyhaven, categories: [grass]}

  # ---------------------------------------------------------------------------------------------- street furniture
  # Urban pavements (street_layout.py). Lamp columns and bus shelters are procedural: Poly Haven has only 3.9 m
  # heritage lamp posts and no shelter.
  bin:
    kind: model
    role: bin
    use: Litter bins by the lamp columns
    resolution: 1k
    groups:                             # a clean and a rusted bin, each with its lid and handles
      - [metal_trash_can, metal_trash_can_handle_left, metal_trash_can_handle_right, metal_trash_can_lid]
      - [metal_trash_can_rust, metal_trash_can_rust_handle_left, metal_trash_can_rust_handle_right,
         metal_trash_can_rust_lid]
    candidates:
      - {source: polyhaven, id: metal_trash_can}
    search: {source: polyhaven, categories: [containers]}

  bench:
    kind: model
    role: bench
    use: Benches facing the carriageway
    resolution: 1k
    groups:                             # the bench with a back, out of the modular set
      - [arm_rest_01, arm_rest_02, back_support_l, back_support_r, crossbar, legs_double, legs_single, seat,
         seat_back, suspended_support_01]
    candidates:
      - {source: polyhaven, id: modular_street_seating}
    search: {source: polyhaven, categories: [seating]}

  hydrant:
    kind: model
    role: hydrant
    use: Fire hydrants at the kerb
    resolution: 1k
    groups:                             # the painted one; fire_hydrant_aged is its weathered twin
      - [fire_hydrant, fire_hydrant_cap_01, fire_hydrant_cap_02, fire_hydrant_cap_03, fire_hydrant_chain]
    candidates:
      - {source: polyhaven, id: fire_hydrant}
    search: {source: polyhaven, categories: [industrial]}

  utility_box:
    kind: model
    role: utility_box
    use: Street cabinets against the buildings
    resolution: 1k
    candidates:
      - {source: polyhaven, id: utility_box_01}
      - {source: polyhaven, id: utility_box_02}
    search: {source: polyhaven, categories: [structures]}

  # ---------------------------------------------------------------------------------------------- CC-BY kits
  # Sketchfab models under CC-BY 4.0, each checked to be its author's own work (portfolio, no game rips), downloaded
  # by the project lead on 2026-10-22 and kept in LionDriver-assets/sketchfab/ with SHA256SUMS (too big for this
  # repository; GitHub caps a file at 100 MB). A render that shows one must credit it (library/README.md §5).
  # Brooklyn Street Row (B0rn2D13) is in that folder but not used: its facades carry graffiti.
  city_brownstones:
    kind: kit
    use: Brownstone rows on both sides of an urban street (city_blocks)
    licence: CC-BY 4.0
    title: Brownstone Building Set - Low poly model
    author: DanielZhabotinsky
    page: https://sketchfab.com/3d-models/b15e6344acd844eabc823e1cc8332574
    file: source/Brownstone_Building_Set.fbx
    pieces:
      city_block: [Brownstone_FlatFacade_1, Brownstone_FlatFacade_2, Brownstone_FlatFacade_3, Brownstone_FlatFacade_5,
                   Brownstone_FlatFacade_6, Brownstone_FlatFacade_7, Brownstone_FlatFacade_9, Brownstone_FlatFacade_12,
                   Brownstone_Commercial_1, Brownstone_Commercial_1_C, Brownstone_Classic_1,
                   Brownstone_ClassicComplex_2, Brownstone_Harlem_1_B]
    candidates:
      - {source: liondriver-assets, id: sketchfab/brownstone-building-set-low-poly-model.zip}

  city_chicago:
    kind: kit
    use: A pair of Chicago commercial buildings (611 N Wells St) among the brownstones (city_blocks)
    licence: CC-BY 4.0
    title: Realistic chicago buildings
    author: 99.Miles
    page: https://sketchfab.com/3d-models/c4a3993ef1e84e6d9d5a15c78da88aae
    file: source/Chicago buildings/Asset/Source/Builds.blend
    textures: source/Chicago buildings/Asset/Textures
    scale: 0.3                          # its own units: five storeys about 21 m at 0.3
    skip: [Camera, Light, Sidewalks]
    pieces: {city_block: [all]}
    candidates:
      - {source: liondriver-assets, id: sketchfab/realistic-chicago-buildings.zip}

  city_downtown:
    kind: kit
    use: Office blocks on the street and towers beyond it (city_blocks)
    licence: CC-BY 4.0
    title: Downtown Buildings Set - Low Poly model
    author: DanielZhabotinsky
    page: https://sketchfab.com/3d-models/7378e7fb9c914c39880d9913a6f4e1d6
    file: source/Downtown_Buildings_Set.fbx
    pieces:
      city_block: [Downtown_BrownstoneOffice_1, Downtown_ClassicOffice_1, Downtown_ModernOffice_3]
      skyline: [Downtown_ModernOffice_5, Downtown_ModernOffice_5_B, Downtown_Flatiron_1, Downtown_ArtDeco_1,
                Downtown_ModernOffice_4, Downtown_ModernOffice_1_B, Downtown_ClassicOffice_1]
    candidates:
      - {source: liondriver-assets, id: sketchfab/downtown-buildings-set-low-poly-model.zip}

  rural_buildings:
    kind: kit
    use: A farmstead and a roadside diner and stores beside rural roads (farmstead)
    licence: CC-BY 4.0
    title: Rural Buildings Set - Low Poly models
    author: DanielZhabotinsky
    page: https://sketchfab.com/3d-models/51ab7e74bac347a89725f1d22b928edf
    file: source/Rural_Building_Set.fbx
    pieces:
      farm: [Rural_HouseOld_1, Rural_WoodenBuilding_1, Rural_WoodenBuilding_2, Rural_WoodenBuilding_4,
             Rural_WoodenBuilding_5, Rural_QuonsetHut_1, Rural_TrailerH_1, Rural_UnmobileHome_1]
      roadside: [Rural_Diner_1, Rural_Diner_2, Rural_StoreSmall_1, Rural_StoreSmall_2, Rural_StoreSmall_4,
                 Rural_StoreSmall_6]
    candidates:
      - {source: liondriver-assets, id: sketchfab/rural-buildings-set-low-poly-models.zip}

  grain_bins:
    kind: kit
    use: A row of grain bins on the farmstead (farmstead)
    licence: CC-BY 4.0
    title: Panola Grain Bins
    author: frankmcmains
    page: https://sketchfab.com/3d-models/342892c5b0ff4519a2327d05316e266c
    file: source/model/model.fbx
    scale: 6.0                          # the scan is normalised to 8.4 units; four bins about 50 m long
    pieces: {bins: [all]}
    candidates:
      - {source: liondriver-assets, id: sketchfab/panola-grain-bins.zip}

  car_pack:
    kind: kit
    use: Traffic cars, parked and passing cars of several shapes (traffic_skins, street_life)
    licence: CC-BY 4.0
    title: Generic passenger car pack
    author: comrade1280
    page: https://sketchfab.com/3d-models/20f9af9b8a404d5cb022ac6fe87f21f5
    file: source/fab.fbx
    pieces: {cars: [Compact, Coupe, Hatchback, minivan, Offroad, Pickup, Sedan, SUV, Wagon]}   # Sport left out
    candidates:
      - {source: liondriver-assets, id: sketchfab/generic-passenger-car-pack.zip}

  box_trailer:
    kind: kit
    use: A 53 ft box trailer behind the traffic trucks (trailers)
    licence: CC-BY 4.0
    title: Truck Trailer FREE
    author: NLM-Group
    page: https://sketchfab.com/3d-models/575958a53e3d4e9f8bcfb1ee2cef67bf
    file: source/Trailer.blend
    width_m: 2.59
    pieces: {trailer: [all]}
    candidates:
      - {source: liondriver-assets, id: sketchfab/truck-trailer-free.zip}

  civil_vehicles:
    kind: kit
    use: Emergency vehicles drawn on a road user with a body (fire engine, patrol car, ambulance, tow truck)
    licence: CC-BY 4.0
    title: Generic civil service vehicles pack
    author: comrade1280
    page: https://sketchfab.com/3d-models/8ff2a13f30914932a70c7950cfa58465
    file: source/scene.fbx
    pieces: {vehicles: [fire_truck, police_sedan, ambulance, towtruck]}
    fronts: {fire_truck: -y, police_sedan: +y, ambulance: -y, towtruck: -y}   # each mesh's front, in its own frame
    lights: {fire_truck: [0.38, -0.47], police_sedan: [-0.05], ambulance: [0.25, -0.47]}   # beacon points (the tow
                                                      # truck's bar is amber: none)
    candidates:
      - {source: liondriver-assets, id: sketchfab/generic-civil-service-vehicles-pack.zip}
