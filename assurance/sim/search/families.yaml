# Search families of the failure search (search.py; WP-V-04 U-4, roadmap S5). A family is data: the fault, the road,
# the case, the plant assumptions, the search box and the robustness measure. search.py samples the box (seeded Monte
# Carlo, then cross-entropy falsification), runs the layer-1 plant with the real panda safety code for every sample,
# writes one results page per family and the edge-case catalogue (../results/edge-cases.md).
#
# Synthetic data (DSR-12): no evidence credit. The plant has no tyre friction limit and no perception: a braking
# driver or lead decelerates as asked on any road, and the ACC sees its lead at once, exactly, at any range.
#
#   id           family ID (results page search-<id>.md unless `page` is given)
#   title        what the family searches
#   about        one paragraph for its results page
#   layout       page writer: legacy-curve (the first family's page and figure, kept byte-identical) or generic
#   seed         RNG seed; mc: Monte Carlo samples; ce: cross-entropy rounds, samples per round, elite share
#   space        the search box: name: [low, high, unit, meaning], or name: {choice: [...], meaning} (a categorical
#                dimension, sampled uniformly over its options)
#   fault, road  the plant fault kind (plant/simulate.py) and road (straight, curve@a_y, rcurve@a_y,
#                arc@a_y:L, rarc@a_y:L, curve-odd-bound, KS-nn)
#   case         other fields of plant/simulate.Case
#   assumptions  plant assumptions and driver-model options for the run (simulate.ASSUMPTIONS, DRIVER_OPTIONS)
#                A value starting with "=" is a Python expression over the sampled parameters (and math); any other
#                value is taken as written.
#   robustness   lateral (rho in m; rho < 0: the body edge crossed a line, a departure):
#                  lane: rho = (lane width - car width) / 2 - max |lateral offset| after the fault;
#                  corridor: the same margin to the outer lines of the ego lane and the lane to its left (an assisted
#                  lane change to the left)
#                longitudinal (rho in m; rho < 0: contact, bumper to bumper):
#                  lead: rho = the smallest bumper gap to the lead after the fault;
#                  follower: the same to the following vehicle;
#                  gaps: the smaller of the two (side says which).
#                A row also gives the time from the fault to the contact and the closing speed at contact
#   bands        Monte Carlo departure tables on its results page: parameter: [edges]
#   catalogue    rows for edge-cases.md: the worst sample of each value of `by` (or the worst `per` samples), at most
#                `max`
#   probes       assumption probes for the catalogue (which assumption decides the outcome), added to probes_default
#                (lateral families) or probes_longitudinal (longitudinal families).
#                The late drift cue stands for low visibility (W04, W06): the plant has no perception, so fog or rain can
#                only act through the driver; 0.4 m (twice the 0.2 m cue) has no source
#   hara         first matching rule maps a catalogue row to a HARA hazardous event (HE-) or SOTIF hazard (SH-);
#                `when` is an expression over the row (its parameters, fault, side, t_line, rho, rho_nofault); a rule
#                with `new` is a finding for the HARA: listed in the catalogue and queued in the decision register
schema_version: 1

probes_default:
  - {label: "driver reacts after 0.75 s", assume: {driver_t_r_s: 0.75}}
  - {label: "drift cue 0.1 m", assume: {driver_lat_cue_m: 0.1}}
  - {label: "drift noticed late, 0.4 m (fog or heavy rain; no source)", assume: {driver_lat_cue_m: 0.4}}
  - {label: "EPS-hold (keeps its last torque 2 s)", case: {eps: hold}}
  - {label: "driver corrects with up to 6 m/s²", assume: {driver_ay_max: 6.0}}
  - {label: "panda siren muted (as before DQ-404)", assume: {whatif_silent_panda: 1.0}}

# longitudinal families. The low-visibility stand-in is a closing on the lead noticed late, at a time to collision of
# 1.5 s (no source): the ACC itself is not affected, the plant having no perception
probes_longitudinal:
  - {label: "driver reacts after 0.75 s", assume: {driver_t_r_s: 0.75}}
  - {label: "driver brakes with 3 m/s² (the plant's default)", assume: {driver_brake: 3.0}}
  - {label: "driver brakes with 8 m/s² (dry road; no friction limit)", assume: {driver_brake: 8.0}}
  - {label: "closing noticed late, TTC 1.5 s (fog or heavy rain; no source)", assume: {driver_ttc_cue_s: 1.5}}
  - {label: "follower reacts after 2 s", assume: {follower_t_r_s: 2.0}}
  - {label: "panda siren muted (as before DQ-404)", assume: {whatif_silent_panda: 1.0}}
  - {label: "change of acceleration not noticed: only the closing (TTC 2 s) cues", assume: {driver_long_cue: 99.0, driver_ttc_cue_s: 2.0}}

families:
  - id: curve-assist-loss
    title: Loss of lateral assistance in a highway curve
    page: search-curve-assist-loss.md
    figure: fig-search-curve-assist-loss.svg
    layout: legacy-curve
    seed: 20261016
    mc: 120
    ce: {rounds: 4, per_round: 30, elite: 0.2}
    space:
      speed_kph: [80.0, 110.0, km/h, "ego speed (ODD-H up to 110 km/h, DQ-260)"]
      a_y: [0.0, 1.8, m/s², "steady lateral acceleration of the curve, from straight to 1.8 m/s²: above LAT_ACCEL_FACTOR (1.99 m/s²) the item cannot hold the curve even without a fault (plant case N-3), so the band to the ODD bound 2.5 m/s² is left out"]
      lane_width: [3.0, 3.9, m, "lane width (ODD-H 3.0–3.9 m)"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue (WP-S-04 §3.2 range)"]
      cue: [0.1, 0.3, m, "drift at which the driver notices (assumption, WP-C-08 to replace)"]
    fault: eps_fault
    road: "=f'curve@{a_y:.6f}' if a_y > 1e-3 else 'straight'"
    case: {t_fault: 7.0, duration: 6.0, speed_kph: =speed_kph, lane_width: =lane_width}
    assumptions: {driver_t_r_s: =t_r, driver_lat_cue_m: =cue}
    robustness: lane
    catalogue: {per: 1}
    hara:
      - {when: "a_y >= 1.0", he: HE-02.1, sh: SH-02, fit: "loss of assist in a highway curve; the HE names a curve near R_ODD, this one is milder"}
      - {when: "True", he: HE-02.4, fit: "gentle curve; HE-02.4 is the silent case, this loss is announced by the siren"}

  # ------------------------------------------------------------------------------------------------ fault timing
  - id: fault-timing-curve
    title: "Fault timing in a curve: injected before, at, in and after a curve with an exit"
    about: >-
      A fault of one of four kinds is injected at a searched point of a left curve that has an exit: on the approach,
      in the entry clothoid, in the arc, in the exit clothoid or on the straight after it, in curves the item can
      hold without a fault. `x_inj` places the onset along the curve: 0 is the start of the
      entry clothoid, 1 the end of the exit clothoid.
    seed: 20261019
    mc: 40
    ce: {rounds: 3, per_round: 16, elite: 0.25}
    space:
      fault: {choice: [hardover, frozen, soc_stall, eps_fault], meaning: "F-01b hard-over, F-03 frozen command, F-04b SoC stall, F-07 EPS fault"}
      a_y: [0.5, 1.8, m/s², "steady lateral acceleration of the arc; above about 1.8 m/s² the car leaves the lane without a fault (LAT_ACCEL_FACTOR 1.99 m/s², plant case N-3), so the band to R_ODD is left to combo-odd-bound"]
      arc_m: [100.0, 400.0, m, "length of the constant-radius arc between the two 100 m clothoids"]
      x_inj: [-0.2, 1.2, "—", "onset along the curve: 0 entry clothoid start, 1 exit clothoid end"]
      speed_kph: [80.0, 110.0, km/h, "ego speed"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
    fault_param: fault
    road: "=f'arc@{a_y:.6f}:{arc_m:.3f}'"
    case: {t_fault: "=(200.0 + x_inj * (200.0 + arc_m)) / (speed_kph / 3.6)", duration: 8.0, speed_kph: =speed_kph}
    assumptions: {driver_t_r_s: =t_r}
    robustness: lane
    bands: {x_inj: [-0.2, 0.0, 0.3, 0.7, 1.0, 1.2]}
    catalogue: {by: fault, max: 4}
    hara:
      - {when: "fault == 'hardover'", he: HE-01.2, fit: "hard-over within the envelope on a highway; in or near a curve"}
      - {when: "fault == 'frozen'", he: HE-02.3, fit: "frozen command while the road changes; at the curve exit the bias steers into the old curve"}
      - {when: "fault == 'soc_stall'", he: HE-02.4, fit: "silent loss; the HE names a straight or gentle curve, this one is in a curve"}
      - {when: "True", he: HE-02.1, sh: SH-02, fit: "announced loss of assist in a curve"}

  - id: fault-timing-refault
    title: "A transient fault that clears, and a second fault of the same kind shortly after"
    about: >-
      The first fault clears after `clear_s` and the same fault returns `gap_s` after that, in a curve inside the
      ODD. The panda latches its authority off after an EPS fault or a SoC stall (it is regained only by a new
      engagement), so for those two kinds the second fault changes nothing; a hard-over or a frozen command is not
      detected, so the item steers again between the two.
    seed: 20261020
    mc: 40
    ce: {rounds: 3, per_round: 16, elite: 0.25}
    space:
      fault: {choice: [hardover, frozen, soc_stall, eps_fault], meaning: "kind of both faults"}
      clear_s: [0.1, 1.5, s, "the first fault clears this long after its onset"]
      gap_s: [0.05, 1.0, s, "the second fault starts this long after the first clears"]
      a_y: [0.0, 2.0, m/s², "steady lateral acceleration of the curve"]
      speed_kph: [80.0, 110.0, km/h, "ego speed"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
    fault_param: fault
    road: "=f'curve@{a_y:.6f}' if a_y > 1e-3 else 'straight'"
    case: {t_fault: "=4.0 + 160.0 / (speed_kph / 3.6)", duration: 8.0, speed_kph: =speed_kph, fault_clear: =clear_s,
           fault2: =fault, fault2_gap: =gap_s}
    assumptions: {driver_t_r_s: =t_r}
    robustness: lane
    bands: {clear_s: [0.1, 0.5, 1.0, 1.5]}
    catalogue: {by: fault, max: 4}
    hara:
      - {when: "fault == 'hardover'", he: HE-01.2, fit: "two hard-overs; the second starts while the car is already off centre"}
      - {when: "fault == 'frozen'", he: HE-02.3, fit: "frozen twice; each freeze holds the command of its moment"}
      - {when: "fault == 'soc_stall'", he: HE-02.4, fit: "authority latched off after the first stall; the second changes nothing"}
      - {when: "True", he: HE-02.1, sh: SH-02, fit: "authority latched off after the first EPS fault; the second changes nothing"}

  - id: fault-timing-lane-change
    title: "A fault during an assisted lane change to the left"
    about: >-
      The SoC starts an assisted lane change to the left at 6 s, following a cosine path over `lc_s`; the fault
      starts at phase `phase` of it (0 start, 1 end). The driver's cue is a drift of 0.2 m from the planned path, and
      the driver completes the change. Robustness is the margin to the outer lines of the two lanes (corridor): the
      right line of the ego lane and the left line of the target lane.
    seed: 20261021
    mc: 40
    ce: {rounds: 3, per_round: 16, elite: 0.25}
    space:
      fault: {choice: [hardover, frozen, soc_stall, eps_fault], meaning: "F-01b hard-over (to the right), F-03, F-04b, F-07"}
      phase: [0.0, 1.0, "—", "fault onset as a share of the lane change"]
      lc_s: [3.0, 6.0, s, "duration of the lane change"]
      a_y: [0.0, 1.0, m/s², "steady lateral acceleration of a gentle left curve (0: straight)"]
      speed_kph: [80.0, 110.0, km/h, "ego speed"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
    fault_param: fault
    road: "=f'curve@{a_y:.6f}' if a_y > 1e-3 else 'straight'"
    case: {lane_change: 6.0, lane_change_s: =lc_s, t_fault: "=6.0 + phase * lc_s", duration: 8.0, speed_kph: =speed_kph}
    assumptions: {driver_t_r_s: =t_r}
    robustness: corridor
    bands: {phase: [0.0, 0.25, 0.5, 0.75, 1.0]}
    catalogue: {by: fault, max: 4}
    hara:
      - {when: "side == 'left'", new: EC-N1, he: HE-01.6,
         fit: "the fault leaves the car moving sideways (a frozen command keeps pushing it; a lost one leaves its lateral speed), so it crosses the target lane's far line into the lane beyond; HE-02.5 has the car stop and straddle the lanes, so the HARA rates this as HE-01.6 since finding EC-N1 (DQ-406 A)"}
      - {when: "fault == 'hardover'", he: HE-01.2, fit: "hard-over during a lane change (OS-12); HE-01.2 names OS-01/OS-02"}
      - {when: "True", he: HE-02.5, fit: "lateral control lost mid-manoeuvre"}

  - id: fault-timing-correction
    title: "The fault clears just after the driver's correction starts"
    about: >-
      The fault starts at curve entry and clears `clear_s` after the driver's correction begins, while the driver,
      who feels the item's torque with a lag `lag_s`, is still compensating for it. A hard-over or a frozen command
      is not detected, so the item steers again when it clears; after an EPS fault the panda keeps its authority off.
    seed: 20261022
    mc: 40
    ce: {rounds: 3, per_round: 16, elite: 0.25}
    space:
      fault: {choice: [hardover, frozen, eps_fault], meaning: "F-01b, F-03, F-07"}
      clear_s: [0.0, 1.0, s, "the fault clears this long after the driver's correction starts"]
      lag_s: [0.0, 0.5, s, "lag with which the driver feels the item's torque change (driver_eps_lag_s)"]
      a_y: [0.3, 2.0, m/s², "steady lateral acceleration of the curve"]
      speed_kph: [80.0, 110.0, km/h, "ego speed"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
    fault_param: fault
    road: "=f'curve@{a_y:.6f}'"
    case: {t_fault: null, duration: 8.0, speed_kph: =speed_kph, clear_after_correction: =clear_s}
    assumptions: {driver_t_r_s: =t_r, driver_eps_lag_s: =lag_s}
    robustness: lane
    bands: {clear_s: [0.0, 0.25, 0.5, 1.0]}
    catalogue: {by: fault, max: 3}
    probes:
      - {label: "driver feels the torque at once", assume: {driver_eps_lag_s: 0.0}}
    hara:
      - {when: "fault == 'hardover'", he: HE-01.2, fit: "hard-over at curve entry, ended during the correction"}
      - {when: "fault == 'frozen'", he: HE-02.3, fit: "frozen command at curve entry"}
      - {when: "True", he: HE-02.1, sh: SH-02, fit: "EPS fault at curve entry; the authority stays off"}

  # ------------------------------------------------------------------------------------------------ driver edge cases
  - id: driver-edge
    title: "Driver edge cases: wrong-direction first correction, over-correction, braking instead of steering"
    about: >-
      The driver-model options of plant/simulate.py (DRIVER_OPTIONS, off in every catalog case) applied to three
      faults in a curve inside the ODD. `k` sets the intensity of the chosen behaviour: a wrong-direction first
      correction of 0.1 to 0.5 s; over-correction as a return-to-centre loop damped at 0.6 down to 0.15 (critically
      damped is 1); braking at -3 m/s² instead of steering. The run lasts 10 s after the fault so an over-correction
      shows its overshoot.
    seed: 20261023
    mc: 40
    ce: {rounds: 3, per_round: 16, elite: 0.25}
    space:
      fault: {choice: [hardover, soc_stall, eps_fault], meaning: "F-01b, F-04b, F-07"}
      behaviour: {choice: [nominal, wrong-direction, over-correction, brakes], meaning: "what the driver does after the reaction time"}
      k: [0.0, 1.0, "—", "intensity of the behaviour (see above)"]
      a_y: [0.0, 2.0, m/s², "steady lateral acceleration of the curve"]
      speed_kph: [80.0, 110.0, km/h, "ego speed"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
    fault_param: fault
    road: "=f'curve@{a_y:.6f}' if a_y > 1e-3 else 'straight'"
    case: {t_fault: 7.0, duration: 10.0, speed_kph: =speed_kph}
    assumptions:
      driver_t_r_s: =t_r
      driver_wrong_s: "=0.1 + 0.4 * k if behaviour == 'wrong-direction' else 0.0"
      driver_zeta: "=0.6 - 0.45 * k if behaviour == 'over-correction' else 1.0"
      driver_brakes_only: "=1.0 if behaviour == 'brakes' else 0.0"
    robustness: lane
    catalogue: {by: behaviour, max: 4}
    probes:
      - {label: "nominal driver", assume: {driver_wrong_s: 0.0, driver_zeta: 1.0, driver_brakes_only: 0.0}}
    hara:
      - {when: "fault == 'hardover'", he: HE-01.2, fit: "hard-over; the HE's C rating assumes a steering correction"}
      - {when: "fault == 'soc_stall'", he: HE-02.4, fit: "silent loss; the HE's C rating assumes a steering correction"}
      - {when: "True", he: HE-02.1, sh: SH-02, fit: "loss of assist in a curve; the HE's C rating assumes a steering correction"}

  # ------------------------------------------------------------------------------------------------ combinations
  - id: combo-odd-bound
    title: "A fault in a curve at R_ODD at a speed near the ODD bound"
    about: >-
      The curve has the radius R_ODD = (110 km/h)² / 2.5 m/s² = 373 m; at 100–110 km/h its lateral acceleration is
      2.07–2.5 m/s², above the 1.99 m/s² the item's full torque gives (plant case N-3), so the car drifts outward even
      without a fault. Five faults, including the hard-over mirrored to the left (toward the inside of the curve), at
      the curve entry, on lanes of 3.0–3.9 m. Each catalogue row is also run without the fault, to separate what the
      fault adds from what the curve does anyway.
    seed: 20261024
    mc: 40
    ce: {rounds: 3, per_round: 16, elite: 0.25}
    space:
      fault: {choice: [hardover, hardover_left, frozen, soc_stall, eps_fault], meaning: "F-01b (outward), F-01b mirrored (inward), F-03, F-04b, F-07"}
      speed_kph: [100.0, 110.0, km/h, "ego speed up to the ODD bound"]
      lane_width: [3.0, 3.9, m, "lane width (ODD-H 3.0–3.9 m)"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
    fault_param: fault
    road: "=f'curve@{2.5 * (speed_kph / 110.0) ** 2:.6f}'"
    case: {t_fault: null, duration: 8.0, speed_kph: =speed_kph, lane_width: =lane_width}
    assumptions: {driver_t_r_s: =t_r}
    robustness: lane
    bands: {lane_width: [3.0, 3.3, 3.6, 3.9]}
    catalogue: {by: fault, max: 5}
    hara:
      - {when: "fault == 'hardover_left'", he: HE-02.1, sh: SH-02, fit: "the inward hard-over asks for the full left torque the item already commands at R_ODD, so it changes nothing: the curve decides (HE-02.1 / SH-02 situation)"}
      - {when: "fault == 'hardover'", he: HE-01.2, sh: SH-02, fit: "outward hard-over in a curve at R_ODD; the curve alone already exceeds the item's authority"}
      - {when: "fault == 'frozen'", he: HE-02.3, sh: SH-02, fit: "frozen at curve entry, before the torque has built up for the curve"}
      - {when: "fault == 'soc_stall'", he: HE-07.1, fit: "silent loss in a curve near R_ODD (the HE-07.1 situation: no take-over alert)"}
      - {when: "True", he: HE-02.1, sh: SH-02, fit: "the HE's own situation"}

  - id: combo-hardover-narrow
    title: "Hard-over in a narrow lane (TC-32), with crosswind or bank (TC-15)"
    about: >-
      A hard-over within the envelope, to the right or mirrored to the left, on lanes of 3.0–3.3 m (TC-32: a narrow
      lane, often beside a truck or a barrier), on a straight or a gentle left curve. In a 3.0 m lane the body edge is
      0.61 m from the line. The adjacent truck or barrier is not modelled; the time to the line says how soon it would
      be reached. A steady crosswind or bank of up to 0.5 m/s² either way (TC-15) is held by the item with a small
      offset before the fault, which eats into the margin on one side.
    seed: 20261025
    mc: 40
    ce: {rounds: 3, per_round: 16, elite: 0.25}
    space:
      fault: {choice: [hardover, hardover_left], meaning: "F-01b to the right (outside of the curve), mirrored to the left (inside)"}
      lane_width: [3.0, 3.3, m, "lane width (TC-32: 3.3 m or less; ODD-H minimum 3.0 m)"]
      a_y: [0.0, 1.5, m/s², "steady lateral acceleration of a left curve (0: straight)"]
      speed_kph: [80.0, 110.0, km/h, "ego speed"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
      cue: [0.1, 0.3, m, "drift at which the driver notices"]
      wind_ay: [-0.5, 0.5, m/s², "steady crosswind or bank (TC-15), + to the left; the item holds it with an offset before the fault"]
    fault_param: fault
    road: "=f'curve@{a_y:.6f}' if a_y > 1e-3 else 'straight'"
    case: {t_fault: 7.0, duration: 8.0, speed_kph: =speed_kph, lane_width: =lane_width, ay_disturbance: =wind_ay}
    assumptions: {driver_t_r_s: =t_r, driver_lat_cue_m: =cue}
    robustness: lane
    bands: {lane_width: [3.0, 3.1, 3.2, 3.3]}
    catalogue: {by: fault, max: 2}
    hara:
      - {when: "True", he: HE-01.2, sh: SH-01, fit: "hard-over toward an adjacent vehicle or barrier; TC-32 (named for SH-01) makes the margin 0.61–0.76 m"}

  # ------------------------------------------------------------------------------------------------ longitudinal
  - id: decel-loss-braking-lead
    title: "Loss of deceleration while the lead brakes"
    about: >-
      The ego follows a lead with its ACC at the gap `gap_s`; at 6 s the lead brakes at `lead_decel` to a stop, and
      `dt_fault` later the item's deceleration is lost: silently (a stale plan holds zero acceleration, F-02 M01; the
      frames go on and the panda passes them) or by a SoC stall (F-04b: the panda revokes and sounds its siren, the PCM
      takes the missing frames as zero). The driver is cued by the missing deceleration (an acceleration 1 m/s² away
      from what a working ACC would give), the siren or the closing (`ttc_cue`), and brakes at `brake` after the
      reaction time, at least as hard as the car already does. A lead braking harder than the envelope's −3.5 m/s²
      can be too much for the ACC alone: the run without the fault says so.
    seed: 20261101
    mc: 32
    ce: {rounds: 3, per_round: 12, elite: 0.25}
    space:
      fault: {choice: [decel_lost, soc_stall], meaning: "deceleration silently held at zero (F-02 M01, HE-06.3), SoC stall (F-04b, announced)"}
      speed_kph: [60.0, 110.0, km/h, "ego and lead speed"]
      gap_s: [1.0, 2.5, s, "time gap the ACC keeps (bumper gap 6 m + gap_s × speed; openpilot's standard is 1.45 s)"]
      lead_decel: [2.0, 5.0, m/s², "the lead's braking, up to the KS-08 default 5 m/s²"]
      dt_fault: [0.0, 3.0, s, "the deceleration is lost this long after the lead starts braking"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
      brake: [3.0, 8.0, m/s², "the driver's braking (8 m/s² needs a dry road; the plant has no friction limit)"]
      ttc_cue: [1.5, 3.0, s, "time to collision at which the driver notices the closing (no source)"]
    fault_param: fault
    road: straight
    case: {longitudinal: true, acc_follow: true, lead_gap_s: =gap_s, lead_brake: =lead_decel, lead_brake_t: 6.0,
           t_fault: "=6.0 + dt_fault", duration: 10.0, speed_kph: =speed_kph}
    assumptions: {driver_t_r_s: =t_r, driver_brake: =brake, driver_ttc_cue_s: =ttc_cue}
    robustness: lead
    bands: {dt_fault: [0.0, 1.0, 2.0, 3.0], lead_decel: [2.0, 3.0, 4.0, 5.0]}
    catalogue: {by: fault, max: 2}
    hara:
      - {when: "fault == 'decel_lost'", he: HE-06.3, fit: "the lead brakes and the deceleration is silently lost: the HE's own situation"}
      - {when: "True", he: HE-06.3, fit: "the HE's situation, but announced: the panda revokes and sounds its siren, so the driver is cued at once; HE-06.3 rates the silent loss"}

  - id: decel-loss-stopped-lead
    title: "Loss of deceleration while approaching a stopped vehicle"
    about: >-
      A stopped vehicle is in the ego lane `ttc0` seconds ahead at t = 0 (6 m + ttc0 × speed); the ACC sees it at once
      and brakes to stop 6 m behind it. At the share `x_fault` of that stop the deceleration is lost, silently (F-02
      M01) or by a SoC stall (F-04b, announced). A gentle stop (a long `ttc0`) brakes at less than the 1 m/s² cue, so
      only the closing (`ttc_cue`) tells the driver about a silent loss. The ACC's perfect perception at any range is
      the plant's, not the item's: a stopped vehicle seen late or not at all (SH-06) is not searched.
    seed: 20261102
    mc: 32
    ce: {rounds: 3, per_round: 12, elite: 0.25}
    space:
      fault: {choice: [decel_lost, soc_stall], meaning: "deceleration silently held at zero (F-02 M01), SoC stall (F-04b, announced)"}
      speed_kph: [40.0, 110.0, km/h, "ego speed (below about 60 km/h: a slow queue, HE-06.2)"]
      ttc0: [6.0, 12.0, s, "time to reach the stopped vehicle at t = 0, at the ego's speed (below about 6 s the ACC's −3.5 m/s² cannot stop the car at 110 km/h)"]
      x_fault: [0.0, 0.8, "—", "onset as a share of the ACC's stop (0: at t = 1 s, 0.8: late in the stop)"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
      brake: [3.0, 8.0, m/s², "the driver's braking (8 m/s² needs a dry road)"]
      ttc_cue: [1.5, 3.0, s, "time to collision at which the driver notices the closing (no source)"]
    fault_param: fault
    road: straight
    case: {longitudinal: true, acc_follow: true, lead_kph: 0.0, lead_gap_s: =ttc0, t_fault: "=1.0 + x_fault * 2.0 * ttc0",
           duration: 14.0, speed_kph: =speed_kph}
    assumptions: {driver_t_r_s: =t_r, driver_brake: =brake, driver_ttc_cue_s: =ttc_cue}
    robustness: lead
    bands: {x_fault: [0.0, 0.2, 0.4, 0.6, 0.8], speed_kph: [40.0, 60.0, 80.0, 110.0]}
    catalogue: {by: fault, max: 2}
    hara:
      - {when: "speed_kph < 60", he: HE-06.2, fit: "deceleration lost in a slow queue (the HE rates it QM)"}
      - {when: "fault == 'decel_lost'", he: HE-06.1, fit: "approaching stationary traffic at highway speed, the deceleration silently lost: the HE's own situation"}
      - {when: "True", he: HE-06.1, fit: "the HE's situation, but announced by the panda siren; HE-06.1 rates the silent loss"}

  - id: accel-toward-slower-lead
    title: "Unintended acceleration while approaching a slower lead"
    about: >-
      A slower lead (`dv_kph` slower) is ahead at the time gap `gap_s` at t = 0 (6 m + gap_s × speed); the ACC brakes
      to follow it at openpilot's 1.45 s gap. At `t_fault` the request is forced to the envelope maximum, +2.0 m/s² (F-02 M04,
      L-01: the panda passes it), or to +4.0 m/s² (L-02: the panda refuses every frame, so the PCM takes zero). The
      driver is cued by the acceleration (`cue` m/s² away from what a working ACC would give) or the closing, and
      brakes after the reaction time.
    seed: 20261103
    mc: 32
    ce: {rounds: 3, per_round: 12, elite: 0.25}
    space:
      fault: {choice: [accel_max, accel_overlimit], meaning: "+2.0 m/s² within the envelope (L-01), +4.0 m/s² above it (L-02)"}
      speed_kph: [70.0, 110.0, km/h, "ego speed"]
      dv_kph: [10.0, 35.0, km/h, "the lead is this much slower"]
      gap_s: [1.5, 4.0, s, "time gap to the lead at t = 0 (closer and faster closing is a cut-in, which the ACC alone cannot always handle: the item engages only at t = 1 s)"]
      t_fault: [1.0, 8.0, s, "fault onset (the item engages at t = 1 s)"]
      t_r: [0.75, 1.5, s, "driver reaction time from the first cue"]
      cue: [0.5, 1.5, m/s², "acceleration change the driver notices (driver_long_cue, no source)"]
      brake: [3.0, 8.0, m/s², "the driver's braking"]
    fault_param: fault
    road: straight
    case: {longitudinal: true, acc_follow: true, lead_kph: "=speed_kph - dv_kph", acc_gap_s: 1.45,
           lead_gap_s: =gap_s, t_fault: =t_fault, duration: 10.0, speed_kph: =speed_kph}
    assumptions: {driver_t_r_s: =t_r, driver_long_cue: =cue, driver_brake: =brake, driver_ttc_cue_s: 2.0}
    robustness: lead
    bands: {dv_kph: [10.0, 20.0, 30.0, 35.0], t_fault: [1.0, 3.0, 5.0, 8.0]}
    catalogue: {by: fault, max: 2}
    hara:
      - {when: "fault == 'accel_overlimit'", he: HE-06.1, fit: "the panda refuses the over-limit request, so the PCM takes zero and the ACC's braking for the slower lead is lost: a loss of deceleration (HE-06.1's effect), not an acceleration"}
      - {when: "dv_kph >= 20", he: HE-03.3, fit: "acceleration toward a slower lead instead of deceleration: the HE's own situation"}
      - {when: "True", he: HE-03.1, fit: "a lead only a little slower, at a following gap: moderate speed difference"}

  - id: step-decel-follower
    title: "Unwanted step deceleration with a close follower"
    about: >-
      The request steps to the envelope minimum, −3.5 m/s² (F-02, L-03: the panda passes it, the onset limit TSR-205
      is not implemented), or to −6.0 m/s² (L-04: refused), with a vehicle following at `follow_gap` seconds. The
      ego driver, cued by the deceleration, overrides with the accelerator after the reaction time; the following
      driver brakes at `f_brake` after `f_t_r` from the ego's brake lights (on above 1 m/s²), until no faster than
      the ego.
    seed: 20261104
    mc: 32
    ce: {rounds: 3, per_round: 12, elite: 0.25}
    space:
      fault: {choice: [decel_min, decel_overlimit], meaning: "−3.5 m/s² step within the envelope (L-03), −6.0 m/s² above it (L-04)"}
      speed_kph: [50.0, 110.0, km/h, "ego and follower speed (HE-04.1: 50–110 km/h)"]
      follow_gap: [0.5, 1.5, s, "time gap of the follower (WP-S-04 §3.4: 1.0 s)"]
      f_t_r: [0.75, 2.0, s, "the following driver's reaction time from the ego's brake lights"]
      f_brake: [3.5, 7.0, m/s², "the following driver's braking"]
      t_r: [0.75, 1.5, s, "ego driver reaction time from the cue"]
      cue: [0.5, 1.5, m/s², "deceleration the ego driver notices (driver_long_cue)"]
    fault_param: fault
    road: straight
    case: {longitudinal: true, follow_gap_s: =follow_gap, t_fault: 6.0, duration: 8.0, speed_kph: =speed_kph}
    assumptions: {driver_t_r_s: =t_r, driver_long_cue: =cue, follower_t_r_s: =f_t_r, follower_brake: =f_brake}
    robustness: follower
    bands: {follow_gap: [0.5, 0.75, 1.0, 1.25, 1.5], f_t_r: [0.75, 1.0, 1.5, 2.0]}
    catalogue: {by: fault, max: 2}
    probes:
      - {label: "follower brakes at 3.5 m/s²", assume: {follower_brake: 3.5}}
    hara:
      - {when: "True", he: HE-04.1, fit: "the HE's own situation: an unwanted deceleration with a close follower"}

  # ------------------------------------------------------------------------------------------------ hand-over (HMI)
  - id: handover-follower
    title: "Hand-over timing with a close follower: the fault soft disable and the driver-monitoring stop"
    about: >-
      A fault soft disable (openpilot's `softDisabling`, SOFT_DISABLE_TIME 3 s) or the driver-monitoring no-response
      stop (`noResponseForceDecel`, after the 5 s "Car Stops in N s" countdown), following a lead at the same speed
      2 s ahead, with a close follower. Both set the cruise target to zero, so the request ramps to A_CRUISE_MIN,
      −1.2 m/s², at the planner's jerk limit; the soft disable then hands control back (the item stops steering and
      braking). `timing` is the order of alert and slow-down: as built (both at once, 3 s; register DQ-407 option A),
      DQ-407 B (alert, 1 s, then 2 s of slowing), DQ-407 C (alert, 1 s, then 3 s), or the DM stop (5 s countdown, then
      slowing to a stop). The driver either takes over at the alert (after the reaction time, with the accelerator) or
      ignores it, as one who takes it for a false alarm would; then only the deceleration itself and the siren cue
      them.
    seed: 20261105
    mc: 32
    ce: {rounds: 3, per_round: 12, elite: 0.25}
    space:
      timing: {choice: [sd-as-built, sd-dq407-b, sd-dq407-c, dm-stop], meaning: "alert and slow-down: together for 3 s (as built), 1 s then 2 s, 1 s then 3 s, 5 s countdown then a stop"}
      respond: {choice: [takes-over, ignores-alert], meaning: "what the driver does with the openpilot alert"}
      speed_kph: [60.0, 110.0, km/h, "ego, lead and follower speed"]
      follow_gap: [0.5, 1.5, s, "time gap of the follower"]
      f_t_r: [0.75, 2.0, s, "the following driver's reaction time from the ego's brake lights"]
      t_r: [0.75, 1.5, s, "ego driver reaction time from the first cue"]
    road: straight
    fault: "='dm_stop' if timing == 'dm-stop' else 'soft_disable'"
    case: {longitudinal: true, acc_follow: true, lead_gap_s: 2.0, follow_gap_s: =follow_gap, t_fault: 5.0, duration: 12.0,
           speed_kph: =speed_kph,
           alert_lead_s: "={'sd-as-built': 0.0, 'sd-dq407-b': 1.0, 'sd-dq407-c': 1.0, 'dm-stop': 5.0}[timing]",
           soft_disable_s: "={'sd-as-built': 3.0, 'sd-dq407-b': 3.0, 'sd-dq407-c': 4.0, 'dm-stop': 3.0}[timing]"}
    assumptions: {driver_t_r_s: =t_r, follower_t_r_s: =f_t_r, driver_ignores_alert: "=1.0 if respond == 'ignores-alert' else 0.0"}
    robustness: follower
    bands: {follow_gap: [0.5, 0.75, 1.0, 1.5], f_t_r: [0.75, 1.0, 1.5, 2.0]}
    catalogue: {by: timing, max: 4}
    probes:
      - {label: "driver takes over at the alert", assume: {driver_ignores_alert: 0.0}}
      - {label: "as built: alert and slow-down together, 3 s", case: {fault: soft_disable, alert_lead_s: 0.0, soft_disable_s: 3.0}}
      - {label: "DQ-407 B: alert, 1 s, 2 s of slowing", case: {fault: soft_disable, alert_lead_s: 1.0, soft_disable_s: 3.0}}
      - {label: "DQ-407 C: alert, 1 s, 3 s of slowing", case: {fault: soft_disable, alert_lead_s: 1.0, soft_disable_s: 4.0}}
      - {label: "follower brakes at 6 m/s²", assume: {follower_brake: 6.0}}
    hara:
      - {when: "timing == 'dm-stop'", he: HE-04.3, fit: "the DM stop with a close follower; HE-04.3 names a DM false positive with an attentive driver"}
      - {when: "True", he: HE-04.1, fit: "the soft-disable slow-down with a close follower; HE-04.1 rates an unwanted deceleration, this one is the item's reaction to a fault"}

  - id: handover-slower-lead
    title: "Hand-over timing while closing on a slower lead: control handed back during the ACC's braking"
    about: >-
      The ego closes on a lead `dv_kph` slower, ahead at the time gap `gap_s` at t = 0, when a fault soft disable or
      the DM stop starts at `t_fault` (alert and slow-down as in handover-follower). The soft disable hands control back
      after 3 s (4 s in DQ-407 C) whatever the ACC was doing, so the braking for the lead ends there; the DM stop keeps
      braking to a stop. A driver who ignores the alert (believing ACC still active, HE-07.3) is cued only by the
      missing deceleration, the siren and the closing (TTC 2 s); one who takes over brakes after the reaction time.
    seed: 20261106
    mc: 32
    ce: {rounds: 3, per_round: 12, elite: 0.25}
    space:
      timing: {choice: [sd-as-built, sd-dq407-b, sd-dq407-c, dm-stop], meaning: "as in handover-follower"}
      respond: {choice: [takes-over, ignores-alert], meaning: "what the driver does with the openpilot alert"}
      speed_kph: [70.0, 110.0, km/h, "ego speed"]
      dv_kph: [10.0, 40.0, km/h, "the lead is this much slower"]
      gap_s: [2.0, 6.0, s, "time gap to the lead at t = 0; the ACC starts braking once the gap is about 6 m + 1.45 s × speed + 6 s × the closing speed, so far enough ahead the hand-back comes first"]
      t_fault: [1.5, 6.0, s, "the alert (the item engages at t = 1 s)"]
      t_r: [0.75, 1.5, s, "ego driver reaction time from the first cue"]
      brake: [3.0, 8.0, m/s², "the driver's braking"]
    road: straight
    fault: "='dm_stop' if timing == 'dm-stop' else 'soft_disable'"
    case: {longitudinal: true, acc_follow: true, lead_kph: "=speed_kph - dv_kph", acc_gap_s: 1.45,
           lead_gap_s: =gap_s, t_fault: =t_fault, duration: 20.0, speed_kph: =speed_kph,
           alert_lead_s: "={'sd-as-built': 0.0, 'sd-dq407-b': 1.0, 'sd-dq407-c': 1.0, 'dm-stop': 5.0}[timing]",
           soft_disable_s: "={'sd-as-built': 3.0, 'sd-dq407-b': 3.0, 'sd-dq407-c': 4.0, 'dm-stop': 3.0}[timing]"}
    assumptions: {driver_t_r_s: =t_r, driver_brake: =brake, driver_ttc_cue_s: 2.0,
                  driver_ignores_alert: "=1.0 if respond == 'ignores-alert' else 0.0"}
    robustness: lead
    bands: {dv_kph: [10.0, 20.0, 30.0, 40.0], gap_s: [2.0, 3.0, 4.0, 6.0]}
    catalogue: {by: timing, max: 4}
    probes:
      - {label: "driver takes over at the alert", assume: {driver_ignores_alert: 0.0}}
      - {label: "as built: alert and slow-down together, 3 s", case: {fault: soft_disable, alert_lead_s: 0.0, soft_disable_s: 3.0}}
      - {label: "DQ-407 B: alert, 1 s, 2 s of slowing", case: {fault: soft_disable, alert_lead_s: 1.0, soft_disable_s: 3.0}}
      - {label: "DQ-407 C: alert, 1 s, 3 s of slowing", case: {fault: soft_disable, alert_lead_s: 1.0, soft_disable_s: 4.0}}
    hara:
      - {when: "respond == 'ignores-alert'", he: HE-07.3, fit: "control handed back while closing on a slower lead; the driver, who took the alert for a false alarm, expects the car to slow"}
      - {when: "True", he: HE-06.3, fit: "the ACC's braking ends at the hand-back while the lead is still slower"}

# Departures that match no HARA hazardous event (rules with `new` above): findings for the HARA, queued for the
# project lead in the decision register (01-management/decisions/register.yaml). The HARA is not edited here. Once the
# lead's answer has added a hazardous event for a finding, `rated_as` names it and the rule's `he` points to it.
findings:
  EC-N1:
    title: an assisted lane change that does not stop at the target lane
    dq: DQ-406
    rated_as: HE-01.6
    text: >-
      HE-02.5 rates a loss of lateral control during an assisted lane change as the car stopping partway and
      straddling the two lanes. The search finds the opposite effect. A frozen command (F-03) is passed by the panda
      and keeps the lateral acceleration of the moment it froze, so the car keeps moving sideways through the target
      lane toward the one beyond it. An EPS fault late in the change (F-07) leaves the car with its lateral speed and
      no assist to stop it at the target lane's centre, so it runs over the far line even with the siren. (A SoC stall
      late in a change, F-04b, did the same before the siren on revocation, DQ-404; it now stays just inside.) Either
      way the departure is into a lane the driver did not check before the change. No hazardous event of the HARA
      names that effect.
