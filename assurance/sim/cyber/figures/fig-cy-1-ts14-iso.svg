<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Inter, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">TS-14 attack path through LionDriver&#x27;s zones, isometric</title>
<desc id="d">Threat scenarios TS-06, TS-08, TS-09, TS-10 (risk 4, 4, 4, 4) give a foothold on the SoC. From there the TS-14 path (risk 5) crosses the SoC host, the panda envelope and the vehicle bus to DS-01 and hazard H-01. Gate CSR-092 and CSR-061 on the boundary after S3: dashed amber: part built; gate CSR-093 on the boundary after S4: dashed amber: part built. Under the credited lens nothing stops it. A pulse runs the path in a 5 s loop; the still shows it at the hazard. What the item sees: nothing on the SoC, a refused frame at the panda in the reference build only, nothing on the bus, and then only the driver.</desc>
