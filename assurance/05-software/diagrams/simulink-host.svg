<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="564" viewBox="0 0 1420 564" role="img" aria-labelledby="t d">
<title id="t">Host engagement data flow</title>
<desc id="d">Host data flow: modeld feeds plannerd, controlsd and selfdrived; card publishes carState and turns carControl into sendcan; selfdrived publishes selfdriveState to controlsd and pandad; pandad talks to the panda over SPI and returns pandaStates to selfdrived.</desc>
