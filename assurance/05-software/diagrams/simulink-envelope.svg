<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="684" viewBox="0 0 1180 684" role="img" aria-labelledby="t d">
<title id="t">Safety envelope block diagram</title>
<desc id="d">Block diagram: CAN RX frames pass the RX checks and the Toyota RX hook; decoded signals, the 100 Hz safety tick, the heartbeat monitor and mode changes drive the authority chart; SoC TX frames pass the whitelist, the rate check and the Toyota TX limits, which also need controls_allowed, before CAN TX.</desc>
