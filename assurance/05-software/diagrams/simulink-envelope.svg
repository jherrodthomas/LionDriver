.t { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:11.5px; fill:var(--ink); }
.t2 { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:11.5px; fill:var(--ink2); }
.tm { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:10.5px; fill:var(--ink2); }
