<rect class="bg" x="0" y="0" width="1290" height="854"/>
<text x="20.0" y="26.0" class="th" text-anchor="start">Panda firmware: components by execution context (panda 8aa8671, opendbc 7993399)</text>
<text x="20.0" y="44.0" class="ts" text-anchor="start">Simulink-style block diagram generated by diagrams/make_diagrams.py from WP-W-03 §3.1, §3.2 and §5.1. Dashed frames: interrupt contexts (all at NVIC level 8, run to completion).</text>
<text x="20.0" y="58.0" class="ts" text-anchor="start">Dashed blocks: reference build only. Thin dashed lines: writes (W) and reads (R) of the shared authority flag controls_allowed (Data Store Memory).</text>
<text x="20.0" y="840.0" class="ts" text-anchor="start">Design description, not verified. All envelope processing runs in interrupt context; the main loop only marks progress for the hardware watchdog (WP-W-03 §5.1).</text>
