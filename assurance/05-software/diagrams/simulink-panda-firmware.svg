<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="854" viewBox="0 0 1290 854" role="img" aria-labelledby="t d">
<title id="t">Panda firmware block diagram</title>
<desc id="d">Panda firmware by execution context: the SPI DMA interrupt handles control requests (mode set, heartbeat, relay) and SoC CAN frames through the TX hook; the FDCAN interrupts forward frames, run the RX hook and transmit; the 100 Hz safety task and the 8 Hz tick supervise; the main loop only marks progress. controls_allowed is shown as a data store with its writers.</desc>
