.s1 { fill:none; stroke:var(--s1); stroke-width:2; }
.s2 { fill:none; stroke:var(--s2); stroke-width:2; stroke-dasharray:6 3; }
.s3 { fill:none; stroke:var(--s3); stroke-width:2; }
.band { fill:var(--f1); }
