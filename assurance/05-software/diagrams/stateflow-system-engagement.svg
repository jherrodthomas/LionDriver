<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="t d">
<title id="t">State machine coupling at engagement</title>
<desc id="d">Coupling of the engagement state machines: selfdrived enabling sends the heartbeat engaged flag, which the panda's engagement window waits for before it grants controls_allowed in the Toyota car mode; the panda reports controlsAllowed back to selfdrived. A timeline below shows the order of events at engagement.</desc>
<style>
svg { --surface:#fcfcfb; --panel:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --grid:#e3e2de;
       --edge:#3d3c39; --shade:#d9d8d3; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --hi:#f4f3ef;
       --c1:#2a78d6; --f1:#dde9f8; --c2:#eb6834; --f2:#fce7df; --c3:#1baf7a; --f3:#dbf2ea; --c4:#eda100; --f4:#fcf0d6; --c6:#008300; --f6:#d6ebd6; --c7:#6250d6; --f7:#e6e3f8; --c8:#e34948; --f8:#fbe2e2; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --panel:#232322; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8d8c85; --grid:#33322f;
         --edge:#c3c2b7; --shade:#0e0e0d; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --hi:#2b2b29;
         --c1:#3987e5; --f1:#2a415c; --c2:#d95926; --f2:#5a3323; --c3:#199e70; --f3:#204839; --c4:#c98500; --f4:#554018; --c6:#008300; --f6:#184018; --c7:#9085e9; --f7:#44405e; --c8:#e66767; --f8:#5e3737; }
}
