.k2 { fill:var(--f2); stroke:var(--c2); stroke-width:1.4; }
.k3 { fill:var(--f3); stroke:var(--c3); stroke-width:1.4; }
.k4 { fill:var(--f4); stroke:var(--c4); stroke-width:1.4; }
.k6 { fill:var(--f6); stroke:var(--c6); stroke-width:1.4; }
.k7 { fill:var(--f7); stroke:var(--c7); stroke-width:1.4; }
.k8 { fill:var(--f8); stroke:var(--c8); stroke-width:1.4; }
.m1 { fill:var(--s1); }
.m2 { fill:var(--s2); }
.m3 { fill:var(--s3); }
