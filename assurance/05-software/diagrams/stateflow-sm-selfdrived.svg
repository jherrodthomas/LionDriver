<text x="70.0" y="799.0" class="t" text-anchor="start">/ {none}</text>
<text x="640.0" y="785.0" class="t2" text-anchor="start">all</text>
<text x="720.0" y="785.0" class="t2" text-anchor="start">Not assessed</text>
