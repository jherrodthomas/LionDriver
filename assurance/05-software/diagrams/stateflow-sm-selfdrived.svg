<text x="70.0" y="731.0" class="t" text-anchor="start">IMMEDIATE_DISABLE or USER_DISABLE] / {none}</text>
<text x="640.0" y="717.0" class="t2" text-anchor="start">all</text>
<text x="720.0" y="717.0" class="t2" text-anchor="start">Not implemented</text>
