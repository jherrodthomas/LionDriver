<text x="70.0" y="629.0" class="t" text-anchor="start">[USER_DISABLE present, no IMMEDIATE_DISABLE] / {USER_DISABLE alert}</text>
<text x="640.0" y="615.0" class="t2" text-anchor="start">all</text>
<text x="720.0" y="615.0" class="t2" text-anchor="start">Not assessed</text>
