<text x="70.0" y="663.0" class="t" text-anchor="start">or USER_DISABLE] / {soft-disable timer = 3 s (300 cycles); SOFT_DISABLE alert}</text>
<text x="640.0" y="649.0" class="t2" text-anchor="start">all</text>
<text x="720.0" y="649.0" class="t2" text-anchor="start">Partial</text>
