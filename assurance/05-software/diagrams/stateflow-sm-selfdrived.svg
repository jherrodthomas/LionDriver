<text x="70.0" y="697.0" class="t" text-anchor="start">present, no disable event] / {override alerts}</text>
<text x="640.0" y="683.0" class="t2" text-anchor="start">all</text>
<text x="720.0" y="683.0" class="t2" text-anchor="start">Not assessed</text>
