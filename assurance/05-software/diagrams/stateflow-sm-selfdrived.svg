<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030" role="img" aria-labelledby="t d">
<title id="t">SM-SELFDRIVED state chart</title>
<desc id="d">Stateflow-style chart of SM-SELFDRIVED with 5 states and 13 transitions, generated from sm-selfdrived.yaml; the table below the chart lists every transition.</desc>
<style>
svg { --surface:#fcfcfb; --panel:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984; --grid:#e3e2de;
       --edge:#3d3c39; --shade:#d9d8d3; --s1:#2a78d6; --s2:#eb6834; --hi:#f4f3ef; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --panel:#232322; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8d8c85; --grid:#33322f;
         --edge:#c3c2b7; --shade:#0e0e0d; --s1:#3987e5; --s2:#d95926; --hi:#2b2b29; }
}
.bg { fill:var(--surface); }
.t { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:11.5px; fill:var(--ink); }
.t2 { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:11.5px; fill:var(--ink2); }
.tm { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:10.5px; fill:var(--ink2); }
.tb { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:12.5px; font-weight:600; fill:var(--ink); }
.th { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:15px; font-weight:600; fill:var(--ink); }
.ts { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:10.5px; fill:var(--ink3); }
.box { fill:var(--panel); stroke:var(--edge); stroke-width:1.2; }
.shadow { fill:var(--shade); }
.hi { fill:var(--hi); }
.edge { fill:none; stroke:var(--edge); stroke-width:1.2; }
.edge.thin { stroke-width:0.8; }
.edge.target { stroke:var(--ink3); stroke-dasharray:5 4; }
.grid { stroke:var(--grid); stroke-width:1; }
.axis { stroke:var(--ink3); stroke-width:1; }
.s1 { fill:none; stroke:var(--s1); stroke-width:2; }
.s2 { fill:none; stroke:var(--s2); stroke-width:2; stroke-dasharray:6 3; }
.m1 { fill:var(--s1); }
.m2 { fill:var(--s2); }
.arrow { fill:var(--edge); }
.arrow.target { fill:var(--ink3); }
.dot { fill:var(--edge); }
.lbl { fill:var(--surface); }
</style>
