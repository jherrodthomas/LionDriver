<svg xmlns="http://www.w3.org/2000/svg" width="640" height="586" viewBox="0 0 640 586" role="img" aria-labelledby="t d">
<title id="t">05-software: work products by gate and status</title>
<desc id="d">Work products of 05-software from WP-M-00 §3, by the gates they are needed for: WP-W-01 SW development environment, languages and coding guidelines: G3, Draft; WP-W-02 Software safety requirements specification: G3, Draft; WP-W-03 Software architectural design: G3, Draft; WP-W-04 Software safety analysis and software-level DFA: G3, Draft; WP-W-05 Software unit design and implementation: G3, Draft; WP-W-06 Software unit verification specification and report (static analysis, MISRA, coverage, mutation): G3, Draft; WP-W-07 Software integration and verification specification and report: G4, Draft; WP-W-08 Testing of the embedded software (SW qualification, HIL): G4, Draft; WP-W-09 Safety-related configuration and calibration data (car params, fingerprints, limits, model weights): G3, Draft; WP-W-10 ML engineering: model requirements, data management, training, testing, deployment: G3, Draft; WP-W-11 Cybersecurity implementation and verification: G3, Draft.</desc>
