<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="633" viewBox="0 0 1280 633" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 5-1 · Panda safety mode state machine (SM-SAFETY-MODE)</title>
<desc>State diagram of SM-SAFETY-MODE (Panda safety mode) with states SILENT, NOOUTPUT, ELM327, TOYOTA, OTHER_CAR; initial state SILENT. Transitions: M1 any to SILENT on reset (partial); M2 any to m on 0xdc (m, p) (implemented, upstream build); M3 any to SILENT on 0xdc (m, p) (implemented, upstream build); M4 SILENT, NOOUTPUT, ELM327 to m on 0xdc (m, p) (implemented, reference build); M5 TOYOTA to m on 0xdc (m, p) (implemented, reference build); M6 any to same on 0xdc (m, p) (implemented, reference build); M7 TOYOTA, OTHER_CAR to SILENT on 1 Hz tick (partial); M8 any to same on harness status change (implemented). Implemented means implemented at the baseline with host tests only; nothing is verified.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="impl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="partial" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="not" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2553F"/></marker><marker id="unknown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
