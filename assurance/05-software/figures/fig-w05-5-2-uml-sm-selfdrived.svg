<text x="100" y="740" font-size="10" fill="#475569" font-weight="700">From → to</text>
<text x="380" y="740" font-size="10" fill="#475569" font-weight="700">Event [guard] / action</text>
<text x="1110" y="740" font-size="10" fill="#475569" font-weight="700">Build</text>
<text x="1180" y="740" font-size="10" fill="#475569" font-weight="700">Status</text>
<text x="40" y="763" font-size="10" fill="#D97706" font-weight="700">X1</text>
<text x="100" y="763" font-size="10" fill="#0F172A">preEnabled, enabled, softDisabling, overriding → disabled</text>
<text x="380" y="763" font-size="10" fill="#0F172A">update (100 Hz) [IMMEDIATE_DISABLE present] / IMMEDIATE_DISABLE alert</text>
<text x="1110" y="763" font-size="10" fill="#475569">all</text>
<text x="1180" y="763" font-size="10" fill="#D97706">partly</text>
<text x="40" y="780" font-size="10" fill="#2E9E6A" font-weight="700">X2</text>
<text x="100" y="780" font-size="10" fill="#0F172A">preEnabled, enabled, softDisabling, overriding → disabled</text>
<text x="380" y="780" font-size="10" fill="#0F172A">update (100 Hz) [USER_DISABLE present, no IMMEDIATE_DISABLE] / USER_DISABLE alert</text>
<text x="1110" y="780" font-size="10" fill="#475569">all</text>
<text x="1180" y="780" font-size="10" fill="#2E9E6A">implemented</text>
<text x="40" y="797" font-size="10" fill="#D97706" font-weight="700">E1</text>
<text x="100" y="797" font-size="10" fill="#0F172A">enabled → softDisabling</text>
<text x="380" y="797" font-size="10" fill="#0F172A">update (100 Hz) [SOFT_DISABLE present, no IMMEDIATE_DISABLE or USER_DISABLE] / soft-disable timer = 3 s (300 cycles) …</text>
<text x="1110" y="797" font-size="10" fill="#475569">all</text>
<text x="1180" y="797" font-size="10" fill="#D97706">partly</text>
<text x="40" y="814" font-size="10" fill="#2E9E6A" font-weight="700">E2</text>
<text x="100" y="814" font-size="10" fill="#0F172A">enabled → overriding</text>
<text x="380" y="814" font-size="10" fill="#0F172A">update (100 Hz) [OVERRIDE_LATERAL or OVERRIDE_LONGITUDINAL present, no disable event] / override alerts</text>
<text x="1110" y="814" font-size="10" fill="#475569">all</text>
<text x="1180" y="814" font-size="10" fill="#2E9E6A">implemented</text>
<text x="40" y="831" font-size="10" fill="#D2553F" font-weight="700">SD1</text>
<text x="100" y="831" font-size="10" fill="#0F172A">softDisabling → enabled</text>
<text x="380" y="831" font-size="10" fill="#0F172A">update (100 Hz) [SOFT_DISABLE no longer present, no IMMEDIATE_DISABLE or USER_DISABLE]</text>
<text x="1110" y="831" font-size="10" fill="#475569">all</text>
<text x="1180" y="831" font-size="10" fill="#D2553F">not implemented</text>
<text x="40" y="848" font-size="10" fill="#D97706" font-weight="700">SD2</text>
<text x="100" y="848" font-size="10" fill="#0F172A">softDisabling → disabled</text>
<text x="380" y="848" font-size="10" fill="#0F172A">update (100 Hz) [SOFT_DISABLE still present and the timer has run out (3 s after E1/O1)]</text>
<text x="1110" y="848" font-size="10" fill="#475569">all</text>
<text x="1180" y="848" font-size="10" fill="#D97706">partly</text>
<text x="40" y="865" font-size="10" fill="#2E9E6A" font-weight="700">P1</text>
<text x="100" y="865" font-size="10" fill="#0F172A">preEnabled → enabled</text>
<text x="380" y="865" font-size="10" fill="#0F172A">update (100 Hz) [PRE_ENABLE no longer present, no disable event]</text>
<text x="1110" y="865" font-size="10" fill="#475569">all</text>
<text x="1180" y="865" font-size="10" fill="#2E9E6A">implemented</text>
<text x="40" y="882" font-size="10" fill="#D97706" font-weight="700">O1</text>
<text x="100" y="882" font-size="10" fill="#0F172A">overriding → softDisabling</text>
<text x="380" y="882" font-size="10" fill="#0F172A">update (100 Hz) [SOFT_DISABLE present, no IMMEDIATE_DISABLE or USER_DISABLE] / soft-disable timer = 3 s; SOFT_DISABLE alert</text>
<text x="1110" y="882" font-size="10" fill="#475569">all</text>
<text x="1180" y="882" font-size="10" fill="#D97706">partly</text>
<text x="40" y="899" font-size="10" fill="#2E9E6A" font-weight="700">O2</text>
<text x="100" y="899" font-size="10" fill="#0F172A">overriding → enabled</text>
<text x="380" y="899" font-size="10" fill="#0F172A">update (100 Hz) [no override event and no SOFT_DISABLE, no disable event]</text>
<text x="1110" y="899" font-size="10" fill="#475569">all</text>
<text x="1180" y="899" font-size="10" fill="#2E9E6A">implemented</text>
<text x="40" y="916" font-size="10" fill="#D2553F" font-weight="700">N1</text>
<text x="100" y="916" font-size="10" fill="#0F172A">disabled → same</text>
<text x="380" y="916" font-size="10" fill="#0F172A">update (100 Hz) [ENABLE and NO_ENTRY present] / NO_ENTRY alert, engagement refused</text>
<text x="1110" y="916" font-size="10" fill="#475569">all</text>
<text x="1180" y="916" font-size="10" fill="#D2553F">not implemented</text>
<text x="40" y="933" font-size="10" fill="#D2553F" font-weight="700">D1</text>
<text x="100" y="933" font-size="10" fill="#0F172A">disabled → preEnabled</text>
<text x="380" y="933" font-size="10" fill="#0F172A">update (100 Hz) [ENABLE and PRE_ENABLE present, no NO_ENTRY] / ENABLE alert</text>
<text x="1110" y="933" font-size="10" fill="#475569">all</text>
<text x="1180" y="933" font-size="10" fill="#D2553F">not implemented</text>
<text x="40" y="950" font-size="10" fill="#D2553F" font-weight="700">D2</text>
<text x="100" y="950" font-size="10" fill="#0F172A">disabled → overriding</text>
<text x="380" y="950" font-size="10" fill="#0F172A">update (100 Hz) [ENABLE and an override event present, no NO_ENTRY or PRE_ENABLE] / ENABLE alert</text>
<text x="1110" y="950" font-size="10" fill="#475569">all</text>
<text x="1180" y="950" font-size="10" fill="#D2553F">not implemented</text>
<text x="40" y="967" font-size="10" fill="#D2553F" font-weight="700">D3</text>
<text x="100" y="967" font-size="10" fill="#0F172A">disabled → enabled</text>
<text x="380" y="967" font-size="10" fill="#0F172A">update (100 Hz) [ENABLE present, no NO_ENTRY, PRE_ENABLE or override event] / ENABLE alert</text>
<text x="1110" y="967" font-size="10" fill="#475569">all</text>
<text x="1180" y="967" font-size="10" fill="#D2553F">not implemented</text>
