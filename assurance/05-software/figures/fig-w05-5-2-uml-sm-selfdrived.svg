<title>Figure 5-2. SM-SELFDRIVED as a UML state machine (WP-W-05)</title>
<desc>UML state machine of SM-SELFDRIVED: X1 preEnabled, enabled, softDisabling, overriding to disabled (partly). X2 preEnabled, enabled, softDisabling, overriding to disabled (implemented). E1 enabled to softDisabling (partly). E2 enabled to overriding (implemented). SD1 softDisabling to enabled (not implemented). SD2 softDisabling to disabled (partly). P1 preEnabled to enabled (implemented). O1 overriding to softDisabling (partly). O2 overriding to enabled (implemented). N1 disabled to same (not implemented). D1 disabled to preEnabled (not implemented). D2 disabled to overriding (not implemented). D3 disabled to enabled (not implemented).</desc>
