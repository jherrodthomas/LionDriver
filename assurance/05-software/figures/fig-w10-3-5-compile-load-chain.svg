<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 3-2. Compile and load chain of the driving model (WP-W-10 §3.5)</title>
  <desc id="d">The driving model source driving_supercombo.onnx (Git LFS) is compiled by scons with tinygrad_repo/examples/openpilot/compile_onnx.py, device flags DEV=QCOM IMAGE=1 FLOAT16=1 NOLOCALS=1 JIT_BATCH_SIZE=0 OPENPILOT_HACKS=1 and --out-of-band --benchmark-runs 1, into driving_tinygrad.pkl, a pickle with JIT-captured kernels, metadata and weights out of band. At runtime load_oob() calls tinygrad load_pickle(out_of_band=True) (helpers.py:15-20) and lower_and_compile() runs on the captured graph (modeld.py:160-162), followed by GPU execution in modeld. For each stage the identity recorded today and the open issue are shown: LFS oid only; tinygrad submodule SHA with branch tracking (GAP-29) and open tool qualification (GAP-34); no compiled pkl hash; pickle load with code execution (GAP-22, AIR-19/20). The big model big_driving_tinygrad.pkl (Git LFS, pre-compiled by comma) has no ONNX source and no compile step and is excluded (AIR-30).</desc>
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="2"/></pattern>
    <style>
      .t{fill:#0F172A}.m{fill:#475569}.s{font-size:11px}.xs{font-size:10px}.b{font-weight:700}.sb{font-weight:600}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.2}
      .chip{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1}
      .ml{fill:#EEF2FF;stroke:#A5B4FC;stroke-width:1.2}
      .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1}
      .code{font-family:'JetBrains Mono',Menlo,Consolas,monospace}
      .red{fill:#D2553F}.green{fill:#2E9E6A}
    </style>
  </defs>

  <rect width="1280" height="690" fill="#FFFFFF"/>

  <!-- header -->
  <text x="40" y="44" class="t b" font-size="20">Figure 3-2 · Compile and load chain</text>
  <text x="40" y="66" class="m" font-size="12.5">From the ONNX source in Git LFS to GPU execution in modeld, with the identity recorded today at each stage</text>
  <text x="1240" y="44" class="m s" text-anchor="end">WP-W-10 §3.5</text>
  <text x="1240" y="62" class="m s" text-anchor="end">stage table §3.5 · acceptance §4</text>
  <line x1="40" y1="82" x2="1240" y2="82" stroke="#E2E8F0"/>

  <!-- ===== column headers ===== -->
  <rect x="200" y="98" width="480" height="24" rx="12" fill="#4F46E5"/>
  <text x="440" y="114" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".04em">AI-1 · DRIVING MODEL</text>
  <text x="712" y="114" class="t b" font-size="11">Identity recorded today · issue</text>
  <rect x="1036" y="98" width="204" height="24" rx="12" fill="#64748B"/>
  <text x="1138" y="114" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".04em">AI-2 · BIG MODEL</text>

  <!-- ===== stage labels ===== -->
  <text x="40" y="162" class="t b" font-size="11.5">Source model</text>
  <text x="40" y="177" class="m xs">ONNX, Git LFS</text>
  <text x="40" y="256" class="t b" font-size="11.5">Compile</text>
  <text x="40" y="271" class="m xs">build time, scons</text>
  <text x="40" y="364" class="t b" font-size="11.5">Compiled artefact</text>
  <text x="40" y="379" class="m xs">pickle</text>
  <text x="40" y="456" class="t b" font-size="11.5">Load</text>
  <text x="40" y="471" class="m xs">runtime, modeld</text>
  <text x="40" y="552" class="t b" font-size="11.5">Execution</text>
  <text x="40" y="567" class="m xs">device GPU</text>

  <!-- ===== driving model chain ===== -->
  <!-- source -->
  <path d="M200 140 H664 L680 156 V192 H200 Z" class="ml"/>
  <path d="M664 140 V156 H680" fill="none" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="440" y="163" class="t sb code" font-size="12" text-anchor="middle">driving_supercombo.onnx</text>
  <text x="440" y="180" class="m xs" text-anchor="middle">Git LFS</text>

  <!-- compile -->
  <rect x="200" y="222" width="480" height="90" rx="8" class="box"/>
  <text x="216" y="242" class="t sb" font-size="11">scons: <tspan class="code" font-size="10.5">tinygrad_repo/examples/openpilot/compile_onnx.py</tspan></text>
  <text x="216" y="262" class="m xs">device flags</text>
  <text x="216" y="277" class="t code" font-size="9.5">DEV=QCOM IMAGE=1 FLOAT16=1 NOLOCALS=1 JIT_BATCH_SIZE=0 OPENPILOT_HACKS=1</text>
  <text x="216" y="298" class="t code" font-size="9.5">--out-of-band --benchmark-runs 1</text>

  <!-- compiled pkl -->
  <path d="M200 342 H664 L680 358 V394 H200 Z" class="ml"/>
  <path d="M664 342 V358 H680" fill="none" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="440" y="365" class="t sb code" font-size="12" text-anchor="middle">driving_tinygrad.pkl</text>
  <text x="440" y="382" class="m xs" text-anchor="middle">pickle: JIT-captured kernels + metadata + weights out of band</text>

  <!-- load -->
  <rect x="200" y="424" width="480" height="76" rx="8" class="box"/>
  <text x="216" y="446" class="t code" font-size="10.5">load_oob() → tinygrad load_pickle(out_of_band=True)</text>
  <text x="664" y="446" class="m xs" text-anchor="end">helpers.py:15-20</text>
  <text x="216" y="476" class="t code" font-size="10.5">lower_and_compile()</text>
  <text x="352" y="476" class="m xs">on the captured graph</text>
  <text x="664" y="476" class="m xs" text-anchor="end">modeld.py:160-162</text>

  <!-- execution -->
  <rect x="200" y="530" width="480" height="44" rx="8" class="chip"/>
  <text x="440" y="557" class="t sb" font-size="12" text-anchor="middle">GPU execution in modeld</text>

  <!-- arrows -->
  <path d="M440 192 V220" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <path d="M440 312 V340" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <path d="M440 394 V422" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <path d="M440 500 V528" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>

  <!-- leaders to cards -->
  <g stroke="#CBD5E1" stroke-dasharray="2 3">
    <line x1="680" y1="172" x2="710" y2="172"/>
    <line x1="680" y1="267" x2="710" y2="267"/>
    <line x1="680" y1="372" x2="710" y2="372"/>
    <line x1="680" y1="462" x2="710" y2="462"/>
  </g>

  <!-- ===== identity / issue cards ===== -->
  <g font-size="10">
    <rect x="712" y="138" width="300" height="72" rx="8" class="card"/>
    <text x="724" y="157" class="t b" font-size="10.5">Source · ONNX via Git LFS (.gitattributes:5)</text>
    <circle cx="728" cy="170" r="3.5" class="green"/><text x="738" y="174" class="t">Recorded: LFS oid in pointer file</text>
    <circle cx="728" cy="186" r="3.5" class="red"/><text x="738" y="190" class="m">Only identity of the source; LFS objects</text>
    <text x="738" y="201" class="m">not present in this checkout</text>

    <rect x="712" y="222" width="300" height="90" rx="8" class="card"/>
    <text x="724" y="239" class="t b" font-size="10.5">Compiler · tinygrad, submodule pin d3f09c9</text>
    <circle cx="728" cy="252" r="3.5" class="green"/><text x="738" y="256" class="t">Recorded: submodule SHA</text>
    <circle cx="728" cy="268" r="3.5" class="red"/><text x="738" y="272" class="m">.gitmodules tracks branch = master (GAP-29)</text>
    <circle cx="728" cy="284" r="3.5" class="red"/><text x="738" y="288" class="m">Tool qualification open (GAP-34, WP-P-07);</text>
    <text x="738" y="301" class="m">output depends on flags and host</text>

    <rect x="712" y="336" width="300" height="72" rx="8" class="card"/>
    <text x="724" y="353" class="t b" font-size="10.5">Build trigger · SConscript:41-49</text>
    <text x="724" y="368" class="m">Rebuilds when any tinygrad file, the ONNX or</text>
    <text x="724" y="381" class="m">the command string changes</text>
    <circle cx="728" cy="394" r="3.5" class="red"/><text x="738" y="398" class="m">Recorded: none · compiled pkl hash not recorded</text>

    <rect x="712" y="424" width="300" height="64" rx="8" class="card"/>
    <text x="724" y="441" class="t b" font-size="10.5">Load · <tspan class="code">pickle</tspan></text>
    <circle cx="728" cy="454" r="3.5" class="red"/><text x="738" y="458" class="m">Recorded: none</text>
    <circle cx="728" cy="470" r="3.5" class="red"/><text x="738" y="474" class="m">Code execution on load: GAP-22; AIR-19/20</text>
  </g>

  <!-- ===== big model lane ===== -->
  <rect x="1036" y="140" width="204" height="74" rx="8" fill="url(#hatch)" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <rect x="1044" y="148" width="188" height="58" rx="6" fill="#FFFFFF" fill-opacity=".94"/>
  <text x="1138" y="167" class="t sb code" font-size="10.5" text-anchor="middle">big_driving_tinygrad.pkl</text>
  <text x="1138" y="182" class="m xs" text-anchor="middle">Git LFS, pre-compiled by comma</text>
  <text x="1138" y="198" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">EXCLUDED · AIR-30</text>
  <g font-size="10">
    <circle cx="1046" cy="238" r="3.5" class="red"/><text x="1056" y="242" class="m">No ONNX source, no compile step:</text>
    <text x="1056" y="255" class="m">VS-ML-01 impossible</text>
    <circle cx="1046" cy="274" r="3.5" class="green"/><text x="1056" y="278" class="t">Recorded: LFS oid</text>
    <text x="1046" y="302" class="m">Included only with</text>
    <text x="1046" y="316" class="t code" font-size="9.5">INCLUDE_BIG_MODEL</text>
    <text x="1046" y="330" class="m">(release_files.py:34,</text>
    <text x="1046" y="343" class="m">build_release.sh:62-65)</text>
  </g>

  <!-- ===== legend ===== -->
  <line x1="40" y1="610" x2="1240" y2="610" stroke="#E2E8F0"/>
  <g transform="translate(40,636)" font-size="10.5">
    <path d="M0 -8 H20 L28 0 V8 H0 Z" fill="#EEF2FF" stroke="#A5B4FC"/><text x="36" y="4" class="t">Model artefact (file)</text>
    <rect x="176" y="-8" width="28" height="16" rx="4" fill="#FFFFFF" stroke="#94A3B8"/><text x="212" y="4" class="t">Tool / code step</text>
    <line x1="330" y1="0" x2="358" y2="0" stroke="#475569" stroke-width="1.6"/><text x="366" y="4" class="t">Build and load order</text>
    <circle cx="502" cy="0" r="3.5" class="green"/><text x="512" y="4" class="t">Identity recorded</text>
    <circle cx="628" cy="0" r="3.5" class="red"/><text x="638" y="4" class="t">Gap or open issue</text>
    <rect x="760" y="-8" width="28" height="16" rx="4" fill="url(#hatch)" stroke="#94A3B8" stroke-dasharray="4 3"/><text x="796" y="4" class="t">Excluded from the reference configuration</text>
  </g>
</svg>
