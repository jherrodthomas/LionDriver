<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 3-1. Data flow of the driving model and the driver-monitoring model as received (WP-W-10 §3.1)</title>
  <desc id="d">Two parallel pipelines. Driving model (AI-1, modeld): VisionIPC NV12 frames from the narrow and wide road cameras, two frames with the calibration warp matrix, go to the GPU warp kernel driving_warp_WxH_tinygrad.pkl, which produces 512×256 YUV input for driving_tinygrad.pkl; the model also takes the recurrent state (next_*), the desire pulse, traffic convention and action_t. Its flat float vector is split by output_slices from the pkl metadata and parsed by the Parser, then get_action_from_model (smoothing) and fill_model_msg publish modelV2, drivingModelData and cameraOdometry. Driver-monitoring model (AI-3, dmonitoringmodeld): VisionIPC NV12 cabin frames with the dm warp matrix (fixed intrinsics) go to dm_warp_WxH_tinygrad.pkl, which produces 1440×960 luma for dmonitoring_model_tinygrad.pkl together with calib (rpy); its flat float vector is split by output_slices and parsed by parse_model_output, and get_driverstate_packet (valid=True) publishes driverStateV2.</desc>
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker>
    <style>
      .t{fill:#0F172A}.m{fill:#475569}.s{font-size:11px}.xs{font-size:10px}.b{font-weight:700}.sb{font-weight:600}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.2}
      .chip{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1}
      .ml{fill:#EEF2FF;stroke:#A5B4FC;stroke-width:1.2}
      .in{fill:#F0FDFA;stroke:#0F766E;stroke-width:1.4}
      .out{fill:#F1F5F9;stroke:#64748B;stroke-width:1.4}
      .code{font-family:'JetBrains Mono',Menlo,Consolas,monospace}
      .el{font-size:10px;font-weight:600;fill:#475569}
    </style>
  </defs>

  <rect width="1080" height="740" fill="#FFFFFF"/>

  <!-- header -->
  <text x="40" y="44" class="t b" font-size="20">Figure 3-1 · ML data flow as received</text>
  <text x="40" y="66" class="m" font-size="12.5">Driving model (AI-1) and driver-monitoring model (AI-3): camera frame to published cereal message</text>
  <text x="1040" y="44" class="m s" text-anchor="end">WP-W-10 §3.1</text>
  <text x="1040" y="62" class="m s" text-anchor="end">I/O §3.2 · pre §3.3 · post §3.4</text>
  <line x1="40" y1="82" x2="1040" y2="82" stroke="#E2E8F0"/>

  <!-- ===== stage bands (left) ===== -->
  <g>
    <text x="40" y="163" class="t b" font-size="11.5">Camera frames</text>
    <text x="40" y="178" class="m xs">VisionIPC NV12</text>

    <text x="40" y="251" class="t b" font-size="11.5">Warp kernel</text>
    <text x="40" y="266" class="m xs">tinygrad-compiled,</text>
    <text x="40" y="279" class="m xs">not ML (§3.3)</text>

    <text x="40" y="347" class="t b" font-size="11.5">Model</text>
    <text x="40" y="362" class="m xs">compiled tinygrad pkl</text>
    <text x="40" y="375" class="m xs">(§3.2, §3.5)</text>

    <text x="40" y="447" class="t b" font-size="11.5">Output parsing</text>
    <text x="40" y="462" class="m xs">slice table from pkl</text>
    <text x="40" y="475" class="m xs">metadata (§3.4)</text>

    <text x="40" y="537" class="t b" font-size="11.5">Post-processing</text>
    <text x="40" y="552" class="m xs">smoothing, message</text>
    <text x="40" y="565" class="m xs">fill (§3.4)</text>

    <text x="40" y="627" class="t b" font-size="11.5">Published</text>
    <text x="40" y="642" class="m xs">cereal services</text>
  </g>
  <g stroke="#E2E8F0">
    <line x1="40" y1="214" x2="176" y2="214"/>
    <line x1="40" y1="304" x2="176" y2="304"/>
    <line x1="40" y1="404" x2="176" y2="404"/>
    <line x1="40" y1="494" x2="176" y2="494"/>
    <line x1="40" y1="584" x2="176" y2="584"/>
  </g>

  <!-- ===== lane headers ===== -->
  <rect x="200" y="98" width="290" height="24" rx="12" fill="#4F46E5"/>
  <text x="345" y="114" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".04em">AI-1 · DRIVING MODEL · modeld</text>
  <rect x="690" y="98" width="270" height="24" rx="12" fill="#4F46E5"/>
  <text x="825" y="114" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".04em">AI-3 · DM MODEL · dmonitoringmodeld</text>

  <!-- ===== driving lane ===== -->
  <rect x="200" y="140" width="290" height="50" rx="8" class="in"/>
  <text x="345" y="162" class="t sb" font-size="12" text-anchor="middle">VisionIPC NV12</text>
  <text x="345" y="178" class="m xs" text-anchor="middle">narrow + wide road cameras</text>

  <rect x="200" y="234" width="290" height="50" rx="8" class="box"/>
  <text x="345" y="256" class="t sb code" font-size="11" text-anchor="middle">driving_warp_&lt;WxH&gt;_tinygrad.pkl</text>
  <text x="345" y="272" class="m xs" text-anchor="middle">GPU</text>

  <rect x="200" y="326" width="290" height="58" rx="8" class="ml"/>
  <text x="345" y="350" class="t sb code" font-size="11.5" text-anchor="middle">driving_tinygrad.pkl</text>
  <text x="345" y="368" class="m xs" text-anchor="middle">driving model</text>

  <rect x="200" y="424" width="290" height="50" rx="8" class="chip"/>
  <text x="345" y="446" class="t sb" font-size="11.5" text-anchor="middle"><tspan class="code">output_slices</tspan> → Parser</text>
  <text x="345" y="462" class="m xs" text-anchor="middle">slices from pkl metadata</text>

  <rect x="200" y="514" width="290" height="50" rx="8" class="chip"/>
  <text x="345" y="536" class="t sb code" font-size="10.5" text-anchor="middle">get_action_from_model</text>
  <text x="345" y="552" class="m xs" text-anchor="middle">(smoothing) / <tspan class="code">fill_model_msg</tspan></text>

  <rect x="200" y="606" width="290" height="44" rx="8" class="out"/>
  <text x="345" y="632" class="t sb code" font-size="10" text-anchor="middle">modelV2 · drivingModelData · cameraOdometry</text>

  <!-- driving side inputs -->
  <rect x="520" y="316" width="140" height="34" rx="8" class="chip"/>
  <text x="590" y="331" class="t sb" font-size="10.5" text-anchor="middle">recurrent state</text>
  <text x="590" y="344" class="m xs code" text-anchor="middle">next_*</text>
  <rect x="520" y="358" width="140" height="52" rx="8" class="chip"/>
  <text x="590" y="375" class="t sb" font-size="10.5" text-anchor="middle">desire pulse,</text>
  <text x="590" y="389" class="m xs" text-anchor="middle">traffic convention,</text>
  <text x="590" y="402" class="m xs code" text-anchor="middle">action_t</text>

  <!-- ===== DM lane ===== -->
  <rect x="690" y="140" width="270" height="50" rx="8" class="in"/>
  <text x="825" y="162" class="t sb" font-size="12" text-anchor="middle">VisionIPC NV12</text>
  <text x="825" y="178" class="m xs" text-anchor="middle">cabin (driver) camera</text>

  <rect x="690" y="234" width="270" height="50" rx="8" class="box"/>
  <text x="825" y="263" class="t sb code" font-size="11" text-anchor="middle">dm_warp_&lt;WxH&gt;_tinygrad.pkl</text>

  <rect x="690" y="326" width="270" height="58" rx="8" class="ml"/>
  <text x="825" y="350" class="t sb code" font-size="11" text-anchor="middle">dmonitoring_model_tinygrad.pkl</text>
  <text x="825" y="368" class="m xs" text-anchor="middle">driver-monitoring model</text>

  <rect x="690" y="424" width="270" height="50" rx="8" class="chip"/>
  <text x="825" y="446" class="t sb" font-size="11.5" text-anchor="middle"><tspan class="code">output_slices</tspan> → <tspan class="code">parse_model_output</tspan></text>
  <text x="825" y="462" class="m xs" text-anchor="middle">slices from pkl metadata</text>

  <rect x="690" y="514" width="270" height="50" rx="8" class="chip"/>
  <text x="825" y="536" class="t sb code" font-size="10.5" text-anchor="middle">get_driverstate_packet</text>
  <text x="825" y="552" class="m xs code" text-anchor="middle">valid=True</text>

  <rect x="690" y="606" width="270" height="44" rx="8" class="out"/>
  <text x="825" y="633" class="t sb code" font-size="11" text-anchor="middle">driverStateV2</text>

  <!-- DM side input -->
  <rect x="974" y="338" width="66" height="34" rx="8" class="chip"/>
  <text x="1007" y="353" class="t sb" font-size="10.5" text-anchor="middle">calib</text>
  <text x="1007" y="366" class="m xs" text-anchor="middle">(rpy)</text>

  <!-- ===== arrows: driving ===== -->
  <path d="M345 190 V232" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
  <text x="353" y="215" class="el">2 frames, calib warp matrix</text>
  <path d="M345 284 V324" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="353" y="308" class="el">512×256 YUV</text>
  <path d="M345 384 V422" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="353" y="407" class="el">flat float vector</text>
  <path d="M345 474 V512" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <path d="M345 564 V604" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <path d="M520 333 H492" fill="none" stroke="#6366F1" stroke-width="1.6" marker-end="url(#aI)"/>
  <path d="M520 377 H492" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>

  <!-- ===== arrows: DM ===== -->
  <path d="M825 190 V232" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
  <text x="833" y="215" class="el">dm warp matrix (fixed intrinsics)</text>
  <path d="M825 284 V324" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="833" y="308" class="el">1440×960 luma</text>
  <path d="M825 384 V422" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="833" y="407" class="el">flat float vector</text>
  <path d="M825 474 V512" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <path d="M825 564 V604" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>
  <path d="M974 355 H962" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#aG)"/>

  <!-- ===== legend ===== -->
  <line x1="40" y1="686" x2="1040" y2="686" stroke="#E2E8F0"/>
  <g transform="translate(40,712)" font-size="10.5">
    <rect x="0" y="-8" width="24" height="16" rx="4" fill="#F0FDFA" stroke="#0F766E"/><text x="30" y="4" class="t">Camera input</text>
    <rect x="108" y="-8" width="24" height="16" rx="4" fill="#FFFFFF" stroke="#94A3B8"/><text x="138" y="4" class="t">Compiled warp kernel</text>
    <rect x="256" y="-8" width="24" height="16" rx="4" fill="#EEF2FF" stroke="#A5B4FC"/><text x="286" y="4" class="t">ML model artefact</text>
    <rect x="386" y="-8" width="24" height="16" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="416" y="4" class="t">Host code / side input</text>
    <rect x="534" y="-8" width="24" height="16" rx="4" fill="#F1F5F9" stroke="#64748B"/><text x="564" y="4" class="t">Published message</text>
    <line x1="674" y1="0" x2="698" y2="0" stroke="#0F766E" stroke-width="2"/><text x="704" y="4" class="t">Frames</text>
    <line x1="758" y1="0" x2="782" y2="0" stroke="#475569" stroke-width="1.6"/><text x="788" y="4" class="t">Data flow</text>
    <line x1="844" y1="0" x2="868" y2="0" stroke="#6366F1" stroke-width="1.6"/><text x="874" y="4" class="t">Recurrent state</text>
  </g>
</svg>
