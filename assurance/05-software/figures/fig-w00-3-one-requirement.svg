<text x="30" y="262" font-size="11.5" fill="#0F172A">It shall enter SS-S (SILENT, relay released) after the longer timeout of …</text>
<text x="30" y="277" font-size="10" fill="#475569">ASIL C · detect ≤ 0.3 s / react ≤ 0.1 s</text>
