  - {id: D1, from: disabled, event: "update (100 Hz)", guard: "ENABLE and PRE_ENABLE present, no NO_ENTRY", action: "ENABLE alert", to: preEnabled, build: all, swsr: [SWSR-514h, SWSR-610, SWSR-619, SWSR-620, SWSR-623], exclusive_with: [N1, D2, D3], code: "openpilot selfdrived/state.py:84-85, 90"}
  - {id: D2, from: disabled, event: "update (100 Hz)", guard: "ENABLE and an override event present, no NO_ENTRY or PRE_ENABLE", action: "ENABLE alert", to: overriding, build: all, swsr: [SWSR-514h, SWSR-610, SWSR-619, SWSR-620, SWSR-623], exclusive_with: [N1, D1, D3], code: "openpilot selfdrived/state.py:86-87, 90"}
  - {id: D3, from: disabled, event: "update (100 Hz)", guard: "ENABLE present, no NO_ENTRY, PRE_ENABLE or override event", action: "ENABLE alert", to: enabled, build: all, swsr: [SWSR-514h, SWSR-610, SWSR-619, SWSR-620, SWSR-623], exclusive_with: [N1, D1, D2], code: "openpilot selfdrived/state.py:88-90"}
