  - {id: SD1, from: softDisabling, event: "update (100 Hz)", guard: "SOFT_DISABLE no longer present, no IMMEDIATE_DISABLE or USER_DISABLE", action: none, to: enabled, build: all, swsr: [SWSR-601], exclusive_with: [X1, X2, SD2], code: "openpilot selfdrived/state.py:49-51"}
  - {id: SD2, from: softDisabling, event: "update (100 Hz)", guard: "SOFT_DISABLE still present and the timer has run out (3 s after E1/O1)", action: none, to: disabled, build: all, swsr: [SWSR-601, SWSR-624], exclusive_with: [X1, X2, SD1], code: "openpilot selfdrived/state.py:20, 53-57"}
