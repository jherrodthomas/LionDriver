  - {id: O1, from: overriding, event: "update (100 Hz)", guard: "SOFT_DISABLE present, no IMMEDIATE_DISABLE or USER_DISABLE", action: "soft-disable timer = 3 s; SOFT_DISABLE alert", to: softDisabling, build: all, swsr: [SWSR-601, SWSR-624], exclusive_with: [X1, X2, O2], code: "openpilot selfdrived/state.py:67-71"}
  - {id: O2, from: overriding, event: "update (100 Hz)", guard: "no override event and no SOFT_DISABLE, no disable event", action: none, to: enabled, build: all, swsr: [], gap: "no host SWSR for driver override while engaged (see E2)", exclusive_with: [X1, X2, O1], code: "openpilot selfdrived/state.py:72-73"}
