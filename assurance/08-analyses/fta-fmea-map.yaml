# FTA <-> FMEA cross-mapping (ISO 26262-9:2018 clause 8, combination of FTA and FMEA).
#
# The fault trees of WP-A-04 are deductive (safety goal violation -> basic events); the FMEAs in fmea/analyses/
# are inductive (element failure modes -> effects). This file links the two:
#   events      every basic (BE) and undeveloped (UE) event reachable in a goal's tree, with the FMEA failure modes
#               that realise it (and FMEDA rows for random hardware)
#   gates       optional: intermediate events realised by a System FMEA failure mode
#   not_in_fta  FMEA failure modes whose effects reach a goal's hazards but that no event of that goal's tree cites,
#               each either justified or recorded as a gap in the tree
#
# Checked by tools/safety/fmea_lint.py for every goal listed in `scope` (a goal enters scope once its tree is
# mapped completely):
#   - every BE/UE reachable in the tree (including events borrowed from other trees) is listed
#   - every FMEA / FMEDA reference exists, and the class is backed by the right analysis
#       systematic_sw: SWF or SFM   systematic_hw: DFM   random_hw: DFM or FMEDA   sotif: SFM
#       installation: PFM          by_design / external: no FMEA, a reason or reference instead
#   - an event with no backing must say so in `gap` (counted, reported as a warning)
#   - every FMEA failure mode whose effects cite a hazard of the goal (hazard -> WP-C-03 hazardous events ->
#     safety goal, through hara-mapping.yaml) is cited by an event or gate of the tree, or listed in not_in_fta
#   - warnings: an FMEA mode cited in a goal's tree whose effects do not cite that goal's hazards; a single-point
#     event (computed from the tree) whose FMEA causes all claim a detection rating <= 4
#
# Status: SG-04 pilot, 2026-10-13; findings F-1..F-10 resolved the same day (WP-A-04 v0.9, SW FMEA rev 0.7, DFMEA rev 0.3,
# System FMEA rev 0.6, PFMEA rev 0.3). Draft, AI-assisted; each link needs review.
