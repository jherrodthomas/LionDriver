      SFM-025 (terminal driver-unresponsive state does not bring the item to a safe state). Its cause SFM-025.C1 says the
      level-3 alerts have no disable reaction, which is true; it does not credit the forced stop (noResponseForceDecel), which
      the tree takes as the no-response reaction. F-38

not_in_fta:
  - fm: SFM-014
    goal: SG-04
    kind: justified
    reason: The SG-04 tree credits only the envelope (panda); host disengagement on faults is QM and not credited, so its failure does not change the cut sets.
  - fm: SFM-030
    goal: SG-04
    kind: justified
    reason: The excessive-actuation monitor is a QM host measure not credited in the tree (as SFM-014).
  - fm: SWF-037
    goal: SG-04
    kind: justified
    reason: As SFM-030 (same monitor, SW unit level).
  - fm: SFM-032
    goal: SG-04
    kind: justified
    reason: With the reference lock the panda enforces the reference model whatever the fingerprint (DFA DM-21); a wrong host configuration acts as a QM planner fault (BE-4.02).
  - fm: SFM-035
    goal: SG-04
    kind: tree_gap
    reason: PCS braking triggered by a frame from the item (0x344, or 0x283 with a non-zero payload) is not an event of the SG-04 tree. The SG-07 tree carries the same path as BE-7.08 with BE-7.07; for the FTA owner to add it under SG-04 or justify leaving it out.
  # ---- SG-01
  - fm: SFM-014
    goal: SG-01
    kind: justified
    reason: As for SG-04. The SG-01 tree credits only the envelope's authority; host disengagement on faults is QM and not credited.
  - fm: SFM-016
    goal: SG-01
    kind: justified
    reason: As SFM-014 (late host disengagement, same QM measure).
  - fm: SFM-030
    goal: SG-01
    kind: justified
    reason: As for SG-04. The excessive-actuation monitor is a QM host measure the tree does not credit.
  - fm: SWF-037
    goal: SG-01
    kind: justified
    reason: As SFM-030 (same monitor, SW unit level).
  - fm: SWF-034
    goal: SG-01
    kind: justified
    reason: The host's panda-mismatch check is a QM monitor the tree does not credit; the envelope's own authority state is what G1.2 analyses.
  - fm: PFM-003
    goal: SG-01
    kind: justified
    reason: A component at another version than verified makes any software event of the tree present in the release; it is a release-process cause, not an event of its own. Controlled by WP-P-10 (pinned submodules, release checks).
  - fm: PFM-004
    goal: SG-01
    kind: justified
    reason: "As PFM-003: a release without the required verification leaves the tree's systematic events unverified, it adds none. Controlled by WP-P-10."
  - fm: PFM-005
    goal: SG-01
    kind: justified
    reason: Software installed from the upstream installer or a development branch is not the analysed item. The trees analyse the released reference configuration; installation is controlled by WP-O-02 and the installation record. The envelope part is BE-1.09/SWF-028.
  - fm: PFM-007
    goal: SG-01
    kind: justified
    reason: A vehicle outside the reference configuration is outside the item definition (WP-C-01) and the AoUs the trees rest on (UE-1.11). Controlled by the installation check (WP-O-02).
  - fm: PFM-016
    goal: SG-01
    kind: justified
    reason: "As PFM-005: an update to an unapproved release replaces the analysed item. Controlled by WP-P-10 and the update policy (DQ-075); the envelope part is BE-1.09."
  - fm: PFM-017
    goal: SG-01
    kind: justified
    reason: "As PFM-005: a rollback outside the evidence replaces the analysed item. Controlled by WP-O-02."
  # ---- SG-07
  - fm: PFM-004
    goal: SG-07
    kind: justified
    reason: "As for SG-01: a release without the required verification adds no event; it leaves the tree's events unverified. Controlled by WP-P-10."
  - fm: PFM-007
    goal: SG-07
    kind: justified
    reason: "As for SG-01: a vehicle outside the reference configuration is outside the item definition and AOU-04R. Controlled by the installation check (WP-O-02)."
  # ---- SG-02
  - fm: PFM-015
    goal: SG-02
    kind: justified
    reason: >-
      Driver briefing is a condition of use (AOU-06), under which the HARA rates controllability for every SG-02 event; a
      driver who is not briefed changes the C rating, not the item's failure paths. Controlled by WP-O-03 (user information,
      INS-30 acknowledgement).
  # ---- SG-06
  - fm: PFM-015
    goal: SG-06
    kind: justified
    reason: >-
      As for SG-02. Driver briefing is a condition of use (AOU-06) under which the HARA rates controllability for every SG-06
      event (HE-06.1, HE-06.3, HE-07.3); an unbriefed driver who expects stops at lights changes the C rating, not the
      item's failure paths. Controlled by WP-O-03 (user information, INS-30 acknowledgement).
  # ---- SG-03
  - fm: SFM-014
    goal: SG-03
    kind: justified
    reason: As for SG-01 and SG-04. The SG-03 tree credits only the envelope's authority and bounds; host disengagement on faults is QM and not credited.
  - fm: SFM-016
    goal: SG-03
    kind: justified
    reason: As SFM-014 (late host disengagement, same QM measure).
  - fm: SFM-030
    goal: SG-03
    kind: justified
    reason: As for SG-01 and SG-04. The excessive-actuation monitor (above 2*ACCEL_MAX, 4 m/s²) is a QM host measure the tree does not credit.
  - fm: SWF-037
    goal: SG-03
    kind: justified
    reason: As SFM-030 (same monitor, SW unit level).
  - fm: PFM-003
    goal: SG-03
    kind: justified
    reason: "As for SG-01: a component at another version than verified makes any software event of the tree present in the release; it adds no event. Controlled by WP-P-10."
  - fm: PFM-004
    goal: SG-03
    kind: justified
    reason: "As for SG-01: a release without the required verification leaves the tree's events unverified, it adds none. Controlled by WP-P-10."
  - fm: PFM-005
    goal: SG-03
    kind: justified
    reason: "As for SG-01: software from the upstream installer or a development branch is not the analysed item. Controlled by WP-O-02; the envelope part is BE-1.09."
  - fm: PFM-016
    goal: SG-03
    kind: justified
    reason: "As for SG-01: an update to an unapproved release replaces the analysed item. Controlled by WP-P-10 and the update policy (DQ-075); the envelope part is BE-1.09."
  # ---- SG-05
  - fm: SWF-031
    goal: SG-05
    kind: justified
    reason: >-
      Host release on brake or cancel (selfdrived pedalPressed, pcmDisable, buttonCancel) is QM and not credited. G5.1
      and G5.2 analyse the envelope's revocation, which acts on the CAN frames independently of carState (the mode's
      own end effect says so). As SFM-014 for SG-01 and SG-04.
