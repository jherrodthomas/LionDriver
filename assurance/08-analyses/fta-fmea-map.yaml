  - fm: SWF-074
    goal: SG-01
    kind: justified
    reason: Realises BE-1.03 (wrong desired curvature from the model) through a model file that is not the release (as PFM-012, SW FMEA rev 1.0). BE-1.03 is class sotif, which admits only System FMEA backing, so the SW row is listed here; the tree does not change.
  - fm: SWF-075
    goal: SG-01
    kind: justified
    reason: Realises BE-1.03 through a calibration that does not match the mount (as SFM-003.C1, SW FMEA rev 1.0). BE-1.03 is class sotif, so the SW row is listed here; the tree does not change.
  - fm: SWF-054
    goal: SG-01
    kind: justified
    reason: Re-grant after a TX-rate revocation needs a driver cruise edge and the heartbeat engaged flag, so the item is engaged by the driver; the host's frames stay under the envelope's TX rate and torque checks (G1.1), so no new path past the envelope arises (SW FMEA rev 0.8, DQ-079).
  - fm: SWF-034
    goal: SG-01
