  - id: UE-2.19
    class: external
    ref: SFM-005.C1 (OEM EPS; no assumption of use states that the EPS signals every LKA drop in 0x262, F-32)
    fmea: [SFM-005]
  - id: BE-2.20
    class: systematic_sw
    fmea: [SWF-015]
    note: SWF-015.C1 (ELM327 or pre-engagement TX hook passes any ISO 15765 frame; next-higher effect "ECU reset or diagnostic session on EPS/ADAS")
  - id: BE-2.21
    class: systematic_sw
    fmea: [SWF-036]
    note: SWF-036.C1 (unhandled exception), SWF-036.C2 (hang or starvation; no process watchdog for selfdrived)
  - id: BE-2.22
    class: random_hw
    fmea: [DFM-017]
    note: DFM-017.C2 (siren path fault stays latent, no self-test; DFM-ACT-011)
  - id: BE-2.23
    class: sotif
    fmea: [SFM-004]
    note: SFM-004.C1 (envelope torque limit below what the curve needs, by design), SFM-004.C3 (tuning or torque model too weak)
  - id: BE-2.24
    class: systematic_sw
    gap: >-
      No FMEA mode for the steerSaturated warning being late or missing (needs saturation and > 1.2x undershoot; no FTTI row
      for the warning path, SFM-ACT-017). F-28
  - id: BE-2.25
    class: systematic_sw
    fmea: [SWF-035, SFM-027]
    note: SWF-035.C1 (SoftDisableAlert Priority.MID masked by speedTooHigh, aeb, driverDistracted3); SFM-027.C2 (priority hides a more urgent alert)

  # ---- SG-06 tree (§7); BE-2.xx events are mapped with SG-02, BE-1.20 and BE-1.22 with SG-01
  - id: BE-6.01
    class: systematic_sw
    fmea: [SWF-043, SFM-012]
    note: >-
      SWF-043.C1 (longitudinalPlan and modelV2 used with no alive, valid or age check, so aTarget is held); SFM-012.C1
      (pipeline latency: CPU overload, thermal throttling, messaging delay; seen only as modeldLagging or selfdrivedLagging,
      SOFT_DISABLE). The radarFault named in the event has no FMEA cause of its own (F-28)
  - id: BE-6.02
    class: systematic_sw
    fmea: [SWF-021, SWF-027, SWF-019, DFM-009]
    note: >-
      As BE-2.02 for ACC_CONTROL: SWF-021.C1/C2 (heartbeat gap, 0.3 s revocation; its effects name ACC requests blocked while
      shown engaged), SWF-027.C1/C2 (pandad hang or restart), SWF-019.C1 (spurious MCU reset, panda back in SILENT);
      DFM-009.C1 (car-side transceiver receives nothing, RX timeout, random HW). DFM-009 cites HZ-004 only (F-26)
  - id: BE-6.03
    class: external
    ref: >-
      PCM ACC or cruise fault (System FMEA element SFM-SE-031, outside the item), signalled to the host as accFaulted
      (events.py:908); AOU-09 (no active powertrain DTCs). The unsignalled case is UE-6.08
  - id: BE-6.04
    class: systematic_sw
    fmea: [SWF-045]
    note: SWF-045.C2 (NaN aTarget makes the LongControl PID integrator NaN; accel sanitised to 0 and only logged)
  - id: BE-6.05
    class: systematic_sw
    fmea: [SWF-043, SWF-023, SWF-040]
    note: >-
      The longitudinal form of BE-1.19 and BE-1.21: SWF-043.C1 (aTarget held from a frozen plan), SWF-040.C1 (controlsd keeps
      longActive on a stale selfdriveState for about 3 s), SWF-023.C1 (1 s sendcan age gate, FIFO replays stale ACC_CONTROL).
      No System FMEA mode for a frozen longitudinal request (SFM-FN-002 M04; SFM-006 is lateral only). SWF-023 and SWF-040
      cite no HZ-007 (F-26, F-28)
  - id: BE-6.06
    class: systematic_sw
    fmea: [SWF-048, SFM-021, SWF-039, SFM-028]
    note: >-
      As BE-2.16: SWF-048.C1 (cancel only when CC.enabled is false, so no ACC cancel while soft-disabling; TSR-303 not met),
      SFM-021.C1/C2 (cancel not sent or not effective), SWF-039.C1 (cruiseMismatch after 6 s with no alert, so an ineffective
      cancel is not reported; TSR-308), SFM-028.C2 (stock HUD state inconsistent with the item; AOU-12)
  - id: UE-6.07
    class: external
    ref: AOU-12 (cluster cruise indicator); PCM reaction to missing ACC_CONTROL not characterised (XM-02)
  - id: UE-6.08
    class: external
    ref: >-
      SFM-011.C1 (OEM PCM ignores ACC requests without a fault signal); no assumption of use states that the PCM signals every
      ACC non-execution (F-32)
    fmea: [SFM-011]
  - id: BE-6.09
    class: sotif
    fmea: [SFM-010, SFM-012, PFM-012]
    note: >-
      SFM-010.C1 (lead missed, radar or vision fusion fault), SFM-012.C2 (lead state filtered too slowly in radard; nothing
      detects it); PFM-012 (model weights not the release) raises the rate, as on BE-1.03. SFM-010.C2 (the -3.5 m/s² bound
      limits braking by design) and SFM-010.C3 (brake system does not reach the request, OEM) are not drawn (F-36)
  - id: BE-6.10
    class: by_design
    reason: >-
      The FCW is raised by the same planner and driving model, from the same lead, as the deceleration (SFM-010 safety
      mechanism); a lead missed or seen late is missed or late for the FCW too. The standing condition under which BE-6.09 acts.

  # ---- SG-03 tree (§3)
  - id: BE-3.01
    class: systematic_sw
    fmea: [SWF-003]
    note: SWF-003.C1 (upper bound +2.0 m/s² equals the SoC limit, RAISED_ACCEL_LIMIT not validated for the Corolla; DFA DFI-08 / DFI-14)
  - id: BE-3.02
    class: sotif
    fmea: [SFM-008, PFM-011]
    note: >-
      SFM-008.C1 (planner targets a higher speed: missed lead, wrong set speed), SFM-008.C2 (longitudinal controller output
      too high), SFM-008.C3 (acceleration request scaled wrongly for the car); PFM-011 (Experimental Mode, e2e longitudinal)
      raises the rate
  - id: BE-3.03
    class: systematic_sw
    fmea: [SWF-004]
    note: >-
      SWF-004.C1 (longitudinal_accel_checks checks the range only, no rate or jerk limit) is direction-neutral, but SWF-004 is
      worded and rated for a step to -3.5 m/s² and cites HZ-006 only (F-20)
  - id: BE-3.04
    class: random_hw
    fmea: [DFM-019]
    fmeda: [fmeda-sg001:FMD-002, fmeda-sg001:FMD-010, fmeda-sg001:FMD-019]
    note: >-
      As BE-1.10 and BE-4.03 (same TX path). DFM-019 (frame altered between the TX check and the bus). The FMEDA rows are those
      of SG-001; DQ-002 accepted them for SG-04 only, not yet for SG-03 (F-34)
  - id: UE-3.05
    class: external
    ref: AOU-05R
  - id: BE-3.06
    class: sotif
    fmea: [SFM-008, PFM-011]
    note: SFM-008.C1 (missed lead, wrong set speed); PFM-011 (Experimental Mode or other parameters not at the reference) raises the rate
  - id: BE-3.07
    class: by_design
    reason: The envelope passes any in-bound request while authority is granted; the hazard is the request (G3.2).
  - id: UE-3.08
    class: external
    ref: AOU-06R (WP-C-03 HE-03.1…03.3 controllability, C2 credits AOU-03/AOU-05)
  - id: BE-3.09
    class: systematic_sw
    fmea: [SWF-005, SWF-006, SWF-008]
    note: >-
      Envelope side of the first condition: SWF-005 (corrupted brake-pressed value accepted, no checksum or counter on 0x226),
      SWF-006 (0x226 lost, detected after about 0.14 s), SWF-008.C1 (ALT_BRAKE selects the wrong brake message), SWF-008.C2
      (brake edge logic defect). The second condition, PCM does not cancel ACC on brake, is AOU-03R (external). All three cite
      HZ-008, not HZ-005 (F-20). A stuck "not pressed" value with valid frames has no FMEA cause (GAP-01, as F-15)
  - id: BE-3.11
    class: systematic_sw
    fmea: [SWF-017, SWF-006]
    note: >-
      SWF-017.C1 (get_longitudinal_allowed or GAS_RELEASED decoding defect, 0x1D2 bit 4); SWF-006 (0x1D2 lost). GAS_RELEASED
      stuck "released" while valid 0x1D2 frames keep arriving has no FMEA cause (no counter, GAP-01; as F-15). SWF-017 cites
      HZ-006 only (F-20); both causes claim D=3 on a single point (F-26)
  - id: UE-3.12
    class: external
    ref: AOU-05R
  - id: BE-3.13
    class: systematic_sw
    fmea: [SFM-008, SWF-052, SWF-040, SFM-013, SWF-030, SFM-017, SWF-031]
    note: >-
      SFM-008 (positive acceleration requested when not engaged, local effect); SWF-052.C1 (CarController takes pcm_accel_cmd
      with no longActive gate; direction-neutral cause, but the mode is worded for negative acceleration and cites HZ-006 only);
      SWF-040.C1 (controlsd acts on a stale selfdriveState.enabled); SFM-013 and SWF-030 (host engaged without a driver
      request, HZ-010); SFM-017 and SWF-031 (host does not disengage on brake, the "after driver brake" half of G3.3, HZ-008)

  # ---- SG-05 tree (§6)
  - id: BE-5.01
    class: systematic_sw
    fmea: [SWF-006, SWF-005, DFM-005]
    note: >-
      As BE-1.16. SWF-006.C1 (loss of 0x226 detected after about 0.14 s, budget not confirmed against the 0.2 s FTTI);
      SWF-005.C1 (0x226 has no checksum or counter, so a corrupted or stuck "not pressed" value is accepted, GAP-01);
      DFM-005.C1 (wrong MCU time base: the RX timeouts stretch, so a lost frame stays fresh past the FTTI)
  - id: BE-5.02
    class: random_hw
    fmea: [DFM-003, DFM-001]
    fmeda: [fmeda-sg001:FMD-009, fmeda-sg001:FMD-001]
    note: >-
      DFM-003.C1/C2 (controls_allowed in SRAM corrupted), DFM-001.C1 (authority check evaluated wrongly). The FMEDA rows are
      from SG-001, where they are rated multiple-point; here they are effective single points (MCS-05.4), F-22. Neither
      mode cites HZ-008 (F-26). The other causes in the BE-1.07 class (DFM-002, -007, -018) are not repeated here
  - id: BE-5.03
    class: systematic_sw
    fmea: [SWF-006]
    note: >-
      As BE-1.17. SWF-006 covers loss of 0x1D2 only. No FMEA mode covers 0x1D2 stuck at "cruise active" while frames with
      a valid checksum keep arriving (no counter, GAP-01). F-15. Single point (MCS-05.2), so the lint warns on
      SWF-006.C1 D=3 (F-25)
  - id: UE-5.04
    class: external
    ref: AOU-03R
  - id: BE-5.05
    class: systematic_sw
    gap: >-
      No SW FMEA mode for the envelope passing LKA torque while the driver overrides the steering (no driver-override
      check on the LKA path, GAP-02, TSR-304 not implemented; SFMEA-14 of WP-A-04 §10 is the only row). F-28
  - id: BE-5.06
    class: systematic_sw
    fmea: [SWF-038, SWF-044, SFM-018]
    note: >-
      SWF-038.C1 (overriding counts as active, so latActive stays true; by design), SWF-044.C1 (CarController cuts torque
      only above 500 units of driver torque), SFM-018.C1/C2 (threshold too high, controller keeps torque during override).
      Present by design below 500 units (F-30)
  - id: UE-5.07
    class: external
    ref: AOU-02R
  - id: BE-5.08
    class: systematic_sw
    fmea: [SWF-017, SFM-020]
    note: >-
      As BE-3.11. SWF-017.C1 (GAS_RELEASED decoding defect gives the envelope the same "released" view); SFM-020.C1 (host
      gasPressed parsed wrong). No FMEA mode covers GAS_RELEASED stuck "released" with a valid 0x1D2 checksum (GAP-01),
      as F-15. Both modes cite HZ-006 only (F-29)
  - id: UE-5.09
    class: external
    ref: AOU-05R
  - id: BE-5.10
    class: systematic_sw
    fmea: [SFM-028, SWF-039, SFM-021, SWF-048]
    note: >-
      SFM-028.C1 (UI renders stale selfdriveState); SWF-039.C1 (cruiseMismatch after 6 s, no reaction; BL-004 rating,
      at BL-005 it alerts after 1 s, TSR-308, F-31); SFM-021 and SWF-048.C1 (cancel not requested or not effective, so
      PCM cruise stays on while the item shows disengaged). Only SWF-048 cites HZ-008 (F-26)
  - id: BE-5.11
    class: systematic_sw
    fmea: [SFM-028]
    note: >-
      SFM-028.C2 (stock HUD state from hudControl inconsistent with the item state: item TX 0x412 affects the cluster,
      DFI-15, DM-11). The vehicle part is AOU-12 (unverified, VS-SQ-07)
  - id: BE-5.12
    class: systematic_sw
    gap: >-
      No SW FMEA mode or cause for the envelope ignoring PCM_CRUISE_2 MAIN_ON (0x1D3) at the baseline. SWF-009.C1 covers
      only a defect in pcm_cruise_check. TSR-405(c) closes it in the reference build, the default build at BL-005; the SW
      FMEA is rated at BL-004. F-28
  - id: UE-5.13
    class: external
    ref: AOU-05R
  # new events from the SG-05 tree change (§4)
  - id: BE-5.14
    class: systematic_sw
    fmea: [SWF-008]
    note: >-
      SWF-008.C2 (defect in the generic_rx_checks brake edge logic, safety.h:354-357); SWF-008.C1 (safety parameter selects
      the wrong brake message, ALT_BRAKE; written by SWF-022.C1, BE-1.08). Single point with UE-5.04; both causes claim
      D<=4 (F-27)
  - id: BE-5.15
    class: systematic_sw
    fmea: [SWF-009]
    note: >-
      SWF-009.C1 (defect in pcm_cruise_check, safety.h:518-527). Single point through G5.2; SWF-009.C1 claims D=3 (F-27)

  # ---- SG-08 tree (§13), new with WP-C-03 v0.4 (H-09, DQ-205); G-HMI events are mapped with SG-02
  - id: BE-8.01
    class: sotif
    fmea: [SFM-022]
    note: SFM-022.C1 (DM model false negative); a confident false negative is not caught by the wheel-touch fallback
  - id: BE-8.02
    class: systematic_sw
    fmea: [SFM-022]
    note: SFM-022.C2 (pose thresholds or calibration wrong for the driver or mount); policy tests use synthetic inputs only
  - id: BE-8.03
    class: random_hw
    gap: >-
      No DFMEA mode or FMEDA row: the DFMEA scope excludes the SoC side and the driver camera. The System FMEA has the cause
      (SFM-022.C3, driver camera or IR illumination degraded, cited on BE-8.01/8.02's mode), and no SW FMEA mode covers
      dmonitoringmodeld stopping. F-37
  - id: BE-8.04
    class: systematic_sw
    gap: >-
      No SW FMEA mode for driverStateV2 published with valid=True at the source whatever the input (dmonitoringmodeld.py:99;
      GAP-21, TSR-609). F-37
  - id: BE-8.05
    class: systematic_sw
    gap: >-
      No SW FMEA mode for the wheel-touch fallback resetting awareness on any steering or gas input (policy.py:334-335;
      GAP-21, TSR-612). F-37
  - id: BE-8.06
    class: systematic_sw
    gap: >-
      No SW FMEA mode for the DM demo mode (IsDriverViewEnabled) active while the item can engage (dmonitoringd.py:26-38;
      GAP-20, TSR-610). F-37
  - id: BE-8.07
    class: systematic_sw
    fmea: [SFM-023]
    note: SFM-023.C1 (policy timers or recovery factor misconfigured), SFM-023.C2 (low-speed or always-on exemption applied wrongly)
  - id: BE-8.08
    class: systematic_sw
    gap: >-
      No SW FMEA mode for the forced stop not being set or not acted on (policy.py:398 noResponseForceDecel, controlsd.py:235
      forceDecel, longitudinal_planner.py:84). F-37
  - id: UE-8.09
    class: external
    ref: AOU-05R

