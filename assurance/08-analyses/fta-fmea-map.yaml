    reason: "As for SG-01: an update to an unapproved release replaces the analysed item. Controlled by WP-P-10 and the update policy (DQ-075); the envelope part is BE-1.09."
  - fm: SWF-054
    goal: SG-03
    kind: justified
    reason: As for SG-01. A re-grant after a TX-rate revocation needs a driver cruise edge and the heartbeat engaged flag, so the driver has engaged the item; the host's frames stay under the envelope's TX-rate and acceleration checks (G3.1), so no path to acceleration while not engaged arises (SW FMEA rev 0.8, DQ-079).
  # ---- SG-05
  - fm: SWF-031
    goal: SG-05
    kind: justified
    reason: >-
      Host release on brake or cancel (selfdrived pedalPressed, pcmDisable, buttonCancel) is QM and not credited. G5.1
      and G5.2 analyse the envelope's revocation, which acts on the CAN frames independently of carState (the mode's
      own end effect says so). As SFM-014 for SG-01 and SG-04.
  - fm: SWF-056
    goal: SG-05
    kind: justified
    reason: >-
      As SWF-031: a carState input frozen or stale on the host delays only the host release, which is QM and not
      credited. G5.1 and G5.2 analyse the envelope's revocation from the CAN frames; frozen or lost 0x226 on the envelope
      side is SWF-005 and SWF-006 (BE-5.01).
  - fm: SWF-059
    goal: SG-03
    kind: justified
    reason: >-
      A packed acceleration other than the one commanded is a request like any other: outside the envelope bound it is
      refused (BE-3.01, SWF-003), inside it is the request hazard the tree takes by design (BE-3.07, G3.2) and realises
      through BE-3.02, class sotif, which admits only System FMEA backing. The cut sets do not change (SW FMEA rev 0.9).
  - fm: SWF-065
    goal: SG-03
    kind: justified
    reason: >-
      A plan too aggressive for the lead realises the planner-output event BE-3.02 (SFM-008.C1/C2), class sotif, which
      admits only System FMEA backing; listed here as SWF-071 is for SG-04. The cut sets do not change (SW FMEA rev 0.9).
  - fm: SWF-065
    goal: SG-06
    kind: justified
    reason: >-
      As for SG-03: a deceleration too low for the lead realises BE-6.09 (SFM-010, SFM-012), class sotif, which admits only
      System FMEA backing. The cut sets do not change (SW FMEA rev 0.9).
  - fm: SWF-070
    goal: SG-06
    kind: justified
    reason: >-
      Realises BE-6.09 (lead missed or late) through the radard lead logic. BE-6.09 is class sotif, which admits only
      System FMEA backing (SFM-010, SFM-012); listed here as SWF-071 is for SG-04 (SW FMEA rev 0.9).
  - fm: SWF-069
    goal: SG-06
    kind: justified
    reason: >-
      BE-6.10 is by design: the FCW comes from the same planner and lead as the deceleration. An FCW missing on its own
      (SWF-069.C1, radar-only lead) leaves the deceleration acting; the cases where both fail come from the lead or the MPC
      (BE-6.09, SWF-065.C2), which the tree already has.
  - fm: SWF-067
    goal: SG-06
    kind: tree_gap
    reason: >-
      The SG-06 tree analyses the assured configuration. The driver can change the following distance or Experimental
      Mode while driving (SWF-067.C1), and the item only logs it. Whether to refuse engagement outside the assured settings
      is queued for the lead (DQ-221); until it is decided, the tree has no event for planning in another configuration.
  - fm: SWF-091
    goal: SG-02
    kind: justified
    reason: >-
      The start-up fault-code read (TSR-629, BL-007) is a barrier against engaging on a car with a stored EPS fault; the
      SG-02 tree starts from an EPS fault while engaged (BE-2.01, external), which the read neither causes nor detects, and
      does not credit the read. A failed read removes an uncredited barrier; the driver's lamp check (TSR-811) remains.
  - fm: SWF-091
    goal: SG-06
    kind: justified
    reason: >-
      As for SG-02: the read is an uncredited start-up barrier against a stored ABS/VSC fault; the SG-06 tree starts from a
      loss of longitudinal control while engaged and does not credit the read.
