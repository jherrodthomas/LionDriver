    fmea: [DFM-019]
    fmeda: [fmeda-sg001:FMD-002, fmeda-sg001:FMD-010, fmeda-sg001:FMD-019]
    note: >-
      DFM-019 (frame altered between the TX check and the bus). The FMEDA rows are those of SG-001: the same TX path carries
      0x2E4 and 0x343, so their rates apply; SG-04 has no FMEDA of its own and no SG-04 metrics yet.
  - id: BE-4.05
    class: systematic_sw
    fmea: [SWF-004]
  - id: BE-4.06
    class: sotif
    fmea: [SFM-009, PFM-011]
    note: PFM-011 (Experimental Mode or other parameters not at the reference) raises the phantom-braking rate
  - id: BE-4.07
    class: by_design
    reason: The envelope passes any in-bound request while authority is granted; the hazard is the request (G4.3.1).
  - id: BE-4.09
    class: by_design
    reason: Intended driver-monitoring or fault soft-disable deceleration (HE-04.3); hazardous only unannounced (G4.4.1).
  - id: BE-4.10
    class: systematic_sw
    fmea: [SWF-050, SFM-026]
    note: SWF-050 (deceleration starts with the soft-disable alert, no lead time); SFM-026 (alert not presented at all)
  - id: BE-4.11
    class: sotif
    fmea: [SFM-009, SWF-051]
    note: SFM-009.C1 (false lead raises a valid FCW, SOTIF); SWF-051 (FCW from stale or invalid input, systematic)
  - id: BE-4.13
    class: systematic_sw
    fmea: [SWF-052]
  - id: BE-4.14
    class: systematic_sw
    fmea: [SWF-053]
  - id: BE-4.16
    class: systematic_sw
    fmea: [SWF-003, SWF-016]
    note: SWF-003.C2 (implementation defect in longitudinal_accel_checks); SWF-016 (host TX that skips safety_tx_hook, F-14)
  - id: BE-4.17
    class: systematic_sw
    fmea: [SWF-046, SWF-066]
    note: SWF-046.C1 (jerk limit applied before pitch compensation and the PID); SWF-066 (no rate limit on the planner's final aTarget, SW FMEA rev 0.9)
  - id: BE-4.18
    class: systematic_sw
    fmea: [SWF-023, SWF-043]
  - id: BE-4.19
    class: random_hw
    fmea: [DFM-011, SFM-034]
    fmeda: [fmeda-sg001:FMD-020, fmeda-sg001:FMD-023]
    note: Also in SG-01 G1.4 (stock LKA, F-12). FMEDA rows from SG-001, where the stuck pass-through is rated
  - id: BE-4.20
    class: systematic_sw
    fmea: [SWF-010]
  - id: BE-4.21
    class: systematic_sw
    fmea: [SWF-012]
    note: SWF-012 (relay malfunction not detected); the 1-2 s detection time is the design property that lets the commands combine
  - id: BE-4.22
    class: systematic_sw
    fmea: [SFM-020]
  - id: BE-4.23
    class: systematic_sw
    fmea: [SWF-017]
  - id: UE-4.04
    class: external
    ref: AOU-05R
  - id: UE-4.08
    class: external
    ref: WP-C-03 HE-04.1 exposure (following traffic)
  - id: UE-4.12
    class: external
    ref: WP-C-03 HE-04.5 (driver reflex braking)
  - id: UE-4.15
    class: external
    ref: AOU-05R
  # ---- SG-01 events (§2), also borrowed by SG-04 (G-LENV, G4.6.1); SG-04 events borrowed by SG-01 G1.4 are above
  - id: BE-1.07
    class: random_hw
    fmea: [DFM-001, DFM-002, DFM-003, DFM-005, DFM-007, DFM-018]
    fmeda: [fmeda-sg001:FMD-001, fmeda-sg001:FMD-006, fmeda-sg001:FMD-009, fmeda-sg001:FMD-013, fmeda-sg001:FMD-015]
    note: >-
      DFM-001 (CPU), DFM-002 (flash constants), DFM-003 (SRAM state); DFM-005 (time base: every rate window and timeout
      scales), DFM-007 (brown-out) and DFM-018 (over-temperature) are causes of the same erroneous execution (SG-01 map, F-14).
  - id: BE-1.08
    class: systematic_sw
    fmea: [SWF-013, SWF-022]
  - id: BE-1.09
    class: systematic_sw
    fmea: [SWF-028, PFM-001, DFM-016, PFM-002, SWF-084]
    note: >-
      DFM-016 (SoC drives BOOT0/reset, no RDP/WRP) is the hardware path and PFM-002 (debug signing key) the key that lets
      any image load (SG-01 map, F-14).
  - id: BE-1.12
    class: systematic_sw
    fmea: [SWF-007]
  - id: BE-1.13
    class: systematic_sw
    fmea: [SWF-006]
  - id: BE-1.14
    class: random_hw
    fmea: [DFM-003]
    fmeda: [fmeda-sg001:FMD-009]
  - id: BE-1.01
    class: systematic_sw
    fmea: [SWF-001, SFM-002]
    note: SWF-001.C1 (torque limits are the controller's constants, not derived); SFM-002.C3 (limits wrong for the vehicle)
  - id: BE-1.02
    class: systematic_sw
    fmea: [SFM-002, SFM-003, SWF-042, SWF-059, SWF-076, SWF-077, SWF-079]
    note: SFM-002.C1 (lateral controller output too high), SFM-003.C2 (sign convention), SWF-042 (torque biased or overshooting within the limits), SWF-059 (frame packed with another value than commanded, SW FMEA rev 0.9); SWF-076 (implausible learned vehicle parameters), SWF-077 and SWF-079 (wrong pose for roll compensation; IMU), SW FMEA rev 1.0
  - id: BE-1.03
    class: sotif
    fmea: [SFM-002, SFM-003, PFM-009, PFM-012]
    note: >-
      SFM-002.C2 and SFM-003.C3 (model curvature excessive or wrong sign), SFM-003.C1/C4 (calibration, mount moved);
      PFM-009 (mount outside tolerance) and PFM-012 (model weights not the release) raise the rate
  - id: BE-1.04
    class: systematic_sw
    fmea: [SWF-049]
    note: SWF-049 (curvature taken from the developer lateral-maneuver plan); the process_config path of GAP-20 has no SW FMEA cause of its own
  - id: BE-1.05
    class: systematic_sw
    fmea: [SFM-032, PFM-013, SWF-058]
    note: SWF-058 (fuzzy fingerprint or overridden identification, SW FMEA rev 0.9) is the SW unit view of SFM-032
  - id: BE-1.06
    class: systematic_sw
    fmea: [SWF-001, SWF-016]
    note: SWF-001.C2/C3 (defect in steer_torque_cmd_checks, wrong EPS factor widens the measured-torque check); SWF-016 (host TX that skips safety_tx_hook)
  - id: BE-1.10
    class: random_hw
    fmea: [DFM-019]
    fmeda: [fmeda-sg001:FMD-002, fmeda-sg001:FMD-010, fmeda-sg001:FMD-019]
    note: As BE-4.03 (same TX path)
  - id: UE-1.11
    class: external
    ref: AOU-01R
  - id: BE-1.15
    class: systematic_sw
    fmea: [SFM-001, SWF-041, SFM-013, SWF-030, SWF-057]
    note: >-
      SFM-001.C1/C3 and SWF-041 (torque or request bit while lateral control is not active); SFM-013 and SWF-030 (host
      engaged without a driver request): the host then commands torque, and the envelope's authority is the barrier.
      SWF-057 (carState field decoded wrong, e.g. a spurious cruise enable, SW FMEA rev 0.9) feeds the host's engagement
      state from the same frames (CCF, DFI-10)
  - id: BE-1.16
    class: systematic_sw
    fmea: [SWF-006, SWF-005]
    note: >-
      SWF-006 (brake frame lost, detected after about 0.14 s); SWF-005 (corrupted brake-pressed value accepted). A
      stuck "not pressed" value with valid frames has no counter to catch it (GAP-01). SWF-005 cites HZ-008 only (F-14)
  - id: BE-1.17
    class: systematic_sw
    fmea: [SWF-006]
    note: >-
      SWF-006 covers loss of 0x1D2; no FMEA mode covers 0x1D2 stuck at "cruise active" while frames keep arriving with a
      valid checksum (no counter, GAP-01). F-15
  - id: BE-1.18
    class: installation
    fmea: [PFM-001]
    note: PFM-001 (released as a DEBUG build); SWF-013.C2 is the SW FMEA view of the same release fault (BE-1.08)
  - id: BE-1.19
    class: systematic_sw
    fmea: [SFM-006, SWF-040, SWF-043, SWF-033, SWF-072, SWF-078, SWF-080, SWF-081]
    note: >-
      SFM-006 (lateral command frozen), SWF-040 (stale engagement state), SWF-043.C1 (stale model and plan),
      SWF-033 (stale inputs handled as soft disable, so actuation continues up to 3 s). SW FMEA rev 1.0: SWF-072
      (modelV2 valid while stale or non-finite), SWF-078 (camera frames dropped or unsynchronised), SWF-080 (messages
      lost silently) and SWF-081 (SubMaster alive for 10 periods) are the sources of the stale input
  - id: BE-1.20
    class: systematic_sw
    fmea: [SWF-043]
    note: SWF-043.C2 (commIssue suppressed while the big model loads)
  - id: BE-1.21
    class: systematic_sw
    fmea: [SWF-023]
  - id: BE-1.22
    class: systematic_sw
    fmea: [SWF-014, SWF-020, SWF-018, DFM-014]
    note: >-
      SWF-014.C2 and SWF-020 (heartbeat shows pandad liveness, not command freshness); SWF-018 (the supervision itself
      stops while the relay is driven); DFM-014 (ignition sense stuck on: heartbeat timeout uses the 5 s value)
  - id: BE-1.23
    class: by_design
    reason: The rate and real-time checks bound change, not age; a constant in-limit value passes them (G1.3.2).
  - id: BE-1.24
    class: random_hw
    fmea: [DFM-015, SWF-026]
    note: DFM-015 (bit errors on the SPI link pass the 8-bit XOR); SWF-026 (both checks XOR the same bytes). F-13
  - id: BE-1.25
    class: systematic_sw
    fmea: [SWF-002, SWF-055]
    note: SWF-002.C1 (defect in the not-allowed torque check, lateral.h:111-114, or controls_allowed bookkeeping). F-11. SWF-055 (SW FMEA rev 0.8, DQ-080) is a bookkeeping property of the pinned code, not a defect; the edge state reset on a mode change grants authority again without a new driver engagement
  - id: BE-1.26
    class: systematic_sw
    fmea: [SWF-010]
    note: SWF-010.C1 (check_relay flag missing for 0x2E4, or forwarding hook defect). F-12
  - id: BE-2.12
    class: systematic_sw
    fmea: [SFM-026]
    note: SFM-026.C1 (UI process hung)
  - id: BE-2.13
    class: systematic_sw
    fmea: [SFM-026]
    note: SFM-026.C2 (volume too low for cabin noise)
  - id: BE-3.10
    class: systematic_sw
    fmea: [SWF-013]

