    note: >-
      SFM-025 (terminal driver-unresponsive state does not bring the item to a safe state). The safe state is decided (DQ-365 A):
      its cause SFM-025.C1 (no disable reaction at level 3) is now BE-8.10; SFM-025 does not yet credit the forced stop, which
      reaches the standstill part of the safe state (BE-8.08 when it fails). F-38

