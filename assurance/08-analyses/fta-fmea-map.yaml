    note: >-
      Car-side bus-off: DFM-008 (transceiver holds bus 0 dominant), DFM-021 (clamp diode short); MCU hang or not running:
      DFM-004, DFM-016 (bootloader, SFM-015.C4), DFM-018 (over-temperature); CAN path lost at the harness: DFM-012.C1, PFM-008,
      PFM-006; host side: SWF-024.C1/C2 and SFM-005.C2 (sendcan dropped in pandad), SWF-047.C1/C2 (controlsd exits or overruns,
      card stops). The configuration commands 0xe5/0xde/0xf1 (FFI-CM-09) have no SW FMEA mode (as BE-7.03, F-17). DFM-004 and
      DFM-016 cite no HZ-004 (F-26).
      SFM-011.C2 (TX path to the vehicle lost silently) is the longitudinal form of SFM-005.C2 for SG-06. The event is shared, so
      each goal warns on the other's mode (SFM-005 under SG-06, SFM-011 under SG-02); not_in_fta cannot take a cited mode
  - id: BE-2.07
    class: random_hw
    fmea: [DFM-012, DFM-020, PFM-008]
    fmeda: [fmeda-sg001:FMD-014, fmeda-sg009:FMD-030]
    note: >-
      DFM-012.C1 (harness disconnected: device power lost), DFM-020 (harness box supply lost, the device with it), PFM-008
      (connector not latched). SFM-015.C3 is the System FMEA view (gate G2.2 cites SFM-015)
  - id: BE-2.08
    class: systematic_sw
    fmea: [SFM-038, SWF-088]
    note: >-
      SFM-038.C1 (EPS-fault prompt latched at low priority after an override in the last 1.5 s, never escalated; car_events.py; GAP-03) and SFM-038.C2 (the
      panda's epsFault published but read by no SoC process, SWF-025 notes); System FMEA rev 0.23. F-28. SW FMEA rev 1.3: SWF-088.C1
      (latched prompt, TSR-607 (b)) and SWF-088.C2 (no prompt while the driver keeps steering, TSR-607 (c)); fixed after BL-005 by SWF-ACT-077 (#174, #179)
  - id: BE-2.09
    class: systematic_sw
    fmea: [SWF-034, SWF-032]
    note: >-
      SWF-034.C1 (controlsMismatch after 200 cycles), SWF-034.C3 (stale pandaStates reused with controlsAllowed true);
      SWF-032.C1 (heartbeatLost, safetyTxBlocked, txRateExceeded not read by selfdrived, so a block without revocation is never
      reported). SWF-034 is justified outside the SG-01 tree; here the tree analyses the QM SoC warning explicitly
  - id: BE-2.10
    class: systematic_sw
    fmea: [SWF-033]
    note: SWF-033.C1 (input loss handled as SOFT_DISABLE, 3 s), SWF-033.C2 (loop-count timers stretch). SWF-033 cites no HZ-004 (F-26)
  - id: BE-2.11
    class: systematic_sw
    fmea: [SWF-045]
    note: SWF-045 (no event, alert or disable for the latched NaN; TSR-604 not met)
  - id: BE-2.14
    class: systematic_sw
    fmea: [SWF-092]
    note: >-
      SWF-092 (SW FMEA rev 1.9, BL-007) rates the trigger logic of the implemented triggers: heartbeat loss (c33343b),
      command-arrival revocation (8a69ccf, opendbc 0ff85e6) and engaged mismatch with PCM cruise still active (TSR-516(c),
      f4803c5); the EPS-fault trigger (≤ 0.96 s, bf8102a) is SWF-088's mechanism and DFM-017's path. Not implemented, so
      still latent by design: the TSR-516(b) triggers on an RX fault, a rejected command, a TX failure or bus-off and a
      platform fault. DFM-017 covers the siren path, not its trigger logic. F-28
  - id: BE-2.15
    class: random_hw
    fmea: [DFM-017]
    note: DFM-017.C1 (siren shares the codec, amplifier or speaker with the SoC audio; DFI-23)
  - id: BE-2.16
    class: systematic_sw
    fmea: [SFM-021, SWF-048, SWF-039, SFM-028]
    note: >-
      SFM-021.C1/C2 and SWF-048.C1 (ACC cancel not sent or not effective, so the cluster cruise state does not change);
      SWF-039.C1 (cruiseMismatch after 6 s with no alert: an ineffective cancel is not reported); SFM-028.C2 (stock HUD state from
      hudControl inconsistent with the item; AOU-12 allows 0x412 to influence the cluster)
  - id: BE-2.17
    class: systematic_sw
    fmea: [SWF-020, SWF-024, SWF-060]
    note: >-
      SWF-020.C1 (heartbeat shows engaged while no fresh command reaches the panda); SWF-024.C1 (sendcan dropped with only a
      LOGE); SWF-060 (card stops while engaged, so no new sendcan; SW FMEA rev 0.9). BL-005 TSR-408/TSR-621 (SFM-005.C2) is not credited at BL-004
  - id: UE-2.18
    class: external
    ref: AOU-01R, AOU-12
  - id: UE-2.19
    class: external
    ref: SFM-005.C1 (OEM EPS; no assumption of use states that the EPS signals every LKA drop in 0x262, F-32)
    fmea: [SFM-005]
  - id: BE-2.20
    class: systematic_sw
    fmea: [SWF-015]
    note: SWF-015.C1 (ELM327 or pre-engagement TX hook passes any ISO 15765 frame; next-higher effect "ECU reset or diagnostic session on EPS/ADAS")
  - id: BE-2.21
    class: systematic_sw
    fmea: [SWF-036]
    note: SWF-036.C1 (unhandled exception), SWF-036.C2 (hang or starvation; no process watchdog for selfdrived)
  - id: BE-2.22
    class: random_hw
    fmea: [DFM-017]
    note: DFM-017.C2 (siren path fault stays latent, no self-test; DFM-ACT-011)
  - id: BE-2.23
    class: sotif
    fmea: [SFM-004]
    note: SFM-004.C1 (envelope torque limit below what the curve needs, by design), SFM-004.C3 (tuning or torque model too weak)
  - id: BE-2.24
    class: systematic_sw
    fmea: [SFM-038]
    note: SFM-038.C3 (steerSaturated conditions; late for a gradual deficit, WP-S-04 §3.8.1); System FMEA rev 0.23. F-28
  - id: BE-2.25
    class: systematic_sw
    fmea: [SWF-035, SFM-027]
    note: SWF-035.C1 (SoftDisableAlert Priority.MID masked by speedTooHigh, aeb, driverDistracted3); SFM-027.C2 (priority hides a more urgent alert)

  # ---- SG-06 tree (§7); BE-2.xx events are mapped with SG-02, BE-1.20 and BE-1.22 with SG-01
  - id: BE-6.01
    class: systematic_sw
    fmea: [SWF-043, SFM-012, SWF-068]
    note: >-
      SWF-043.C1 (longitudinalPlan and modelV2 used with no alive, valid or age check, so aTarget is held), and its source
      SWF-068 (plannerd stops or runs late while engaged; SW FMEA rev 0.9); SFM-012.C1
      (pipeline latency: CPU overload, thermal throttling, messaging delay; seen only as modeldLagging or selfdrivedLagging,
      SOFT_DISABLE). The radarFault named in the event has no FMEA cause of its own (F-28)
  - id: BE-6.02
    class: systematic_sw
    fmea: [SWF-021, SWF-027, SWF-019, DFM-009]
    fmeda: [fmeda-sg001:FMD-018]
    note: >-
      As BE-2.02 for ACC_CONTROL: SWF-021.C1/C2 (heartbeat gap, 0.3 s revocation; its effects name ACC requests blocked while
      shown engaged), SWF-027.C1/C2 (pandad hang or restart), SWF-019.C1 (spurious MCU reset, panda back in SILENT);
      DFM-009.C1 (car-side transceiver receives nothing, RX timeout, random HW). DFM-009 cites HZ-004 only (F-26)
  - id: BE-6.03
    class: external
    ref: >-
      PCM ACC or cruise fault (System FMEA element SFM-SE-031, outside the item), signalled to the host as accFaulted
      (events.py:908); AOU-09 (no active powertrain DTCs). The unsignalled case is UE-6.08
  - id: BE-6.04
    class: systematic_sw
    fmea: [SWF-045]
    note: SWF-045.C2 (NaN aTarget makes the LongControl PID integrator NaN; accel sanitised to 0 and only logged)
  - id: BE-6.05
    class: systematic_sw
    fmea: [SFM-037, SWF-043, SWF-023, SWF-040, SWF-072]
    note: >-
      The longitudinal form of BE-1.19 and BE-1.21: SWF-072 (modelV2 published as valid with wrong leads or content, SW FMEA
      rev 1.0, as under BE-1.19), SWF-043.C1 (aTarget held from a frozen plan), SWF-040.C1 (controlsd keeps
      longActive on a stale selfdriveState for about 3 s), SWF-023.C1 (1 s sendcan age gate, FIFO replays stale ACC_CONTROL).
      SFM-037 (longitudinal command frozen at last value, System FMEA rev 0.22) is the System FMEA mode; its causes are
      SWF-047.C1, SWF-068.C1 and stale data with fresh timestamps. SWF-023 and SWF-040 cite no HZ-007 (F-26, F-28)
  - id: BE-6.06
    class: systematic_sw
    fmea: [SWF-048, SFM-021, SWF-039, SFM-028]
    note: >-
      As BE-2.16: SWF-048.C1 (cancel only when CC.enabled is false, so no ACC cancel while soft-disabling; TSR-303 not met),
      SFM-021.C1/C2 (cancel not sent or not effective), SWF-039.C1 (cruiseMismatch after 6 s with no alert, so an ineffective
      cancel is not reported; TSR-308), SFM-028.C2 (stock HUD state inconsistent with the item; AOU-12)
  - id: UE-6.07
    class: external
    ref: AOU-12 (cluster cruise indicator); PCM reaction to missing ACC_CONTROL not characterised (XM-02)
  - id: UE-6.08
    class: external
    ref: >-
      SFM-011.C1 (OEM PCM ignores ACC requests without a fault signal); no assumption of use states that the PCM signals every
      ACC non-execution (F-32)
    fmea: [SFM-011]
  - id: BE-6.09
    class: sotif
    fmea: [SFM-010, SFM-012, PFM-012]
    note: >-
      SFM-010.C1 (lead missed, radar or vision fusion fault), SFM-012.C2 (lead state filtered too slowly in radard; nothing
      detects it); PFM-012 (model weights not the release) raises the rate, as on BE-1.03. SFM-010.C2 (the -3.5 m/s² bound
      limits braking by design) and SFM-010.C3 (brake system does not reach the request, OEM) are not drawn (F-36)
  - id: BE-6.10
    class: by_design
    reason: >-
      The FCW is raised by the same planner and driving model, from the same lead, as the deceleration (SFM-010 safety
      mechanism); a lead missed or seen late is missed or late for the FCW too. The standing condition under which BE-6.09 acts.

  # ---- SG-03 tree (§3)
  - id: BE-3.01
    class: systematic_sw
    fmea: [SWF-003]
    note: SWF-003.C1 (upper bound +2.0 m/s² equals the SoC limit, RAISED_ACCEL_LIMIT not validated for the Corolla; DFA DFI-08 / DFI-14)
  - id: BE-3.02
    class: sotif
    fmea: [SFM-008, PFM-011]
    note: >-
      SFM-008.C1 (planner targets a higher speed: missed lead, wrong set speed), SFM-008.C2 (longitudinal controller output
      too high), SFM-008.C3 (acceleration request scaled wrongly for the car); PFM-011 (Experimental Mode, e2e longitudinal)
      raises the rate
  - id: BE-3.03
    class: systematic_sw
    fmea: [SWF-004]
    note: >-
      SWF-004.C1 (longitudinal_accel_checks checks the range only, no rate or jerk limit) is direction-neutral, but SWF-004 is
      worded and rated for a step to -3.5 m/s² and cites HZ-006 only (F-20)
  - id: BE-3.04
    class: random_hw
    fmea: [DFM-019]
    fmeda: [fmeda-sg001:FMD-002, fmeda-sg001:FMD-010, fmeda-sg001:FMD-019]
    note: >-
      As BE-1.10 and BE-4.03 (same TX path). DFM-019 (frame altered between the TX check and the bus). The FMEDA rows are those
      of SG-001, reused for SG-03 since DQ-362 A (2026-10-18; DQ-002 for SG-04). F-22
  - id: UE-3.05
    class: external
    ref: AOU-05R
  - id: BE-3.06
    class: sotif
    fmea: [SFM-008, PFM-011]
    note: SFM-008.C1 (missed lead, wrong set speed); PFM-011 (Experimental Mode or other parameters not at the reference) raises the rate
  - id: BE-3.07
    class: by_design
    reason: The envelope passes any in-bound request while authority is granted; the hazard is the request (G3.2).
  - id: UE-3.08
    class: external
    ref: AOU-06R (WP-C-03 HE-03.1…03.3 controllability, C2 credits AOU-03/AOU-05)
  - id: BE-3.09
    class: systematic_sw
    fmea: [SWF-005, SWF-006, SWF-008]
    note: >-
      Envelope side of the first condition: SWF-005 (corrupted brake-pressed value accepted, no checksum or counter on 0x226),
      SWF-006 (0x226 lost, detected after about 0.14 s), SWF-008.C1 (ALT_BRAKE selects the wrong brake message), SWF-008.C2
      (brake edge logic defect). The second condition, PCM does not cancel ACC on brake, is AOU-03R (external). All three cite
      HZ-008, not HZ-005 (F-20). A stuck "not pressed" value with valid frames has no FMEA cause (GAP-01, as F-15)
  - id: BE-3.11
    class: systematic_sw
    fmea: [SWF-017, SWF-006]
    note: >-
      SWF-017.C1 (get_longitudinal_allowed or GAS_RELEASED decoding defect, 0x1D2 bit 4); SWF-006 (0x1D2 lost). GAS_RELEASED
      stuck "released" while valid 0x1D2 frames keep arriving has no FMEA cause (no counter, GAP-01; as F-15). SWF-017 cites
      HZ-006 only (F-20); both causes claim D=3 on a single point (F-26)
  - id: UE-3.12
    class: external
    ref: AOU-05R
  - id: BE-3.13
    class: systematic_sw
    fmea: [SFM-008, SWF-052, SWF-040, SFM-013, SWF-030, SFM-017, SWF-031, SWF-057]
    note: >-
      SFM-008 (positive acceleration requested when not engaged, local effect); SWF-052.C1 (CarController takes pcm_accel_cmd
      with no longActive gate; direction-neutral cause, but the mode is worded for negative acceleration and cites HZ-006 only);
      SWF-040.C1 (controlsd acts on a stale selfdriveState.enabled); SFM-013 and SWF-030 (host engaged without a driver
      request, HZ-010); SFM-017 and SWF-031 (host does not disengage on brake, the "after driver brake" half of G3.3, HZ-008);
      SWF-057.C1 (a carState field decoded wrong, e.g. a spurious cruise enable, feeds the host engagement state, as in
      SG-01 BE-1.15; added in WP-A-04 v1.12 for HE-03.7, DQ-364 A)

  # ---- SG-05 tree (§6)
  - id: BE-5.01
    class: systematic_sw
    fmea: [SWF-006, SWF-005, DFM-005]
    note: >-
      As BE-1.16. SWF-006.C1 (loss of 0x226 detected after about 0.14 s, budget not confirmed against the 0.2 s FTTI);
      SWF-005.C1 (0x226 has no checksum or counter, so a corrupted or stuck "not pressed" value is accepted, GAP-01);
      DFM-005.C1 (wrong MCU time base: the RX timeouts stretch, so a lost frame stays fresh past the FTTI)
  - id: BE-5.02
    class: random_hw
    fmea: [DFM-003, DFM-001]
    fmeda: [fmeda-sg001:FMD-009, fmeda-sg001:FMD-001]
    note: >-
      DFM-003.C1/C2 (controls_allowed in SRAM corrupted), DFM-001.C1 (authority check evaluated wrongly). The FMEDA rows are
      from SG-001, where they are rated multiple-point; here they are effective single points (MCS-05.4), F-22. Neither
      mode cites HZ-008 (F-26). The other causes in the BE-1.07 class (DFM-002, -007, -018) are not repeated here
  - id: BE-5.03
    class: systematic_sw
    fmea: [SWF-006]
    note: >-
      As BE-1.17. SWF-006 covers loss of 0x1D2 only. No FMEA mode covers 0x1D2 stuck at "cruise active" while frames with
      a valid checksum keep arriving (no counter, GAP-01). F-15. Single point (MCS-05.2), so the lint warns on
      SWF-006.C1 D=3 (F-25)
  - id: UE-5.04
    class: external
    ref: AOU-03R
  - id: BE-5.05
    class: systematic_sw
    fmea: [SWF-087, SFM-018]
    note: >-
      SWF-087.C1 (no driver-override check on the LKA path in toyota.h, GAP-02; TSR-304 not implemented, SWF-ACT-074). The
      host side is BE-5.06 (SWF-038, SWF-044). SW FMEA rev 1.2 closes this part of F-28. SFM-018.C3 (System FMEA rev 0.26)
      is the system-level view, linked to SWF-087
  - id: BE-5.06
    class: systematic_sw
    fmea: [SWF-038, SWF-044, SFM-018, SWF-057]
    note: >-
      SWF-038.C1 (overriding counts as active, so latActive stays true; by design), SWF-044.C1 (CarController cuts torque
      only above 500 units of driver torque), SFM-018.C1/C2 (threshold too high, controller keeps torque during override).
      Present by design below 500 units (F-30). SWF-057.C1 (steeringTorque sign or scale decoded wrong in carstate.py, so the host
      misjudges the driver's torque; cited here since DQ-363 A moved its gas-bit cause to SG-04 BE-4.24)
  - id: UE-5.07
    class: external
    ref: AOU-02R
  - id: BE-5.10
    class: systematic_sw
    fmea: [SFM-028, SWF-039, SFM-021, SWF-048]
    note: >-
      SFM-028.C1 (UI renders stale selfdriveState); SWF-039.C1 (cruiseMismatch after 6 s, no reaction; BL-004 rating,
      at BL-005 it alerts after 1 s, TSR-308, F-31); SFM-021 and SWF-048.C1 (cancel not requested or not effective, so
      PCM cruise stays on while the item shows disengaged). Only SWF-048 cites HZ-008 (F-26)
  - id: BE-5.11
    class: systematic_sw
    fmea: [SFM-028]
    note: >-
      SFM-028.C2 (stock HUD state from hudControl inconsistent with the item state: item TX 0x412 affects the cluster,
      DFI-15, DM-11). The vehicle part is AOU-12 (unverified, VS-SQ-07)
  - id: BE-5.12
    class: systematic_sw
    gap: >-
      No SW FMEA mode or cause for the envelope ignoring PCM_CRUISE_2 MAIN_ON (0x1D3) at the baseline. SWF-009.C1 covers
      only a defect in pcm_cruise_check. TSR-405(c) closes it in the reference build, the default build at BL-005; the SW
      FMEA is rated at BL-004. F-28
  - id: UE-5.13
    class: external
    ref: AOU-05R
  # new events from the SG-05 tree change (§4)
  - id: BE-5.14
    class: systematic_sw
    fmea: [SWF-008]
    note: >-
      SWF-008.C2 (defect in the generic_rx_checks brake edge logic, safety.h:354-357); SWF-008.C1 (safety parameter selects
      the wrong brake message, ALT_BRAKE; written by SWF-022.C1, BE-1.08). Single point with UE-5.04; both causes claim
      D<=4 (F-27)
  - id: BE-5.15
    class: systematic_sw
    fmea: [SWF-009]
    note: >-
      SWF-009.C1 (defect in pcm_cruise_check, safety.h:518-527). Single point through G5.2; SWF-009.C1 claims D=3 (F-27)

  # ---- SG-08 tree (§13), new with WP-C-03 v0.4 (H-09, DQ-205); G-HMI events are mapped with SG-02
  - id: BE-8.01
    class: sotif
    fmea: [SFM-022]
    note: SFM-022.C1 (DM model false negative); a confident false negative is not caught by the wheel-touch fallback
  - id: BE-8.02
    class: systematic_sw
    fmea: [SFM-022]
    note: SFM-022.C2 (pose thresholds or calibration wrong for the driver or mount); policy tests use synthetic inputs only
  - id: BE-8.03
    class: random_hw
    gap: >-
      No DFMEA mode or FMEDA row: the DFMEA scope excludes the SoC side and the driver camera. The System FMEA has the cause
      (SFM-022.C3, driver camera or IR illumination degraded, cited on BE-8.01/8.02's mode), and no SW FMEA mode covers
      dmonitoringmodeld stopping. F-37
  - id: BE-8.04
    class: systematic_sw
    fmea: [SWF-063]
    note: >-
      SWF-063.C1 (driverStateV2 always published valid, no finiteness check; dmonitoringmodeld.py:99; GAP-21, TSR-609) and
      SWF-063.C2 (empty face arrays keep the last pose). Added in SW FMEA rev 0.9, which closes this part of F-37
  - id: BE-8.05
    class: systematic_sw
    fmea: [SWF-061]
    note: >-
      SWF-061.C3 (under the wheel-touch policy any steering or gas input resets awareness; policy.py:376, 389; GAP-21,
      TSR-612). Added in SW FMEA rev 0.9, which closes this part of F-37
  - id: BE-8.06
    class: systematic_sw
    fmea: [SWF-085]
    note: >-
      SWF-085.C1 (cabin camera dialog open across the onroad transition), SWF-085.C2 (no engagement interlock; GAP-20,
      TSR-610). SW FMEA rev 1.1 closes this part of F-37. By code reading demo mode does not switch the alerts off: it
      decouples the policy from the real vehicle state and removes the lock on the monitored seat (SWF-085 notes), as
      MCS-08.4 states since WP-A-04 v1.5 (F-39)
  - id: BE-8.07
    class: systematic_sw
    fmea: [SFM-023, SWF-061]
    note: >-
      SFM-023.C1 (policy timers or recovery factor misconfigured), SFM-023.C2 (low-speed or always-on exemption applied wrongly);
      at SW unit level SWF-061.C1 (timers count frames, not time) and SWF-061.C2 (awareness arithmetic or thresholds)
  - id: BE-8.08
    class: systematic_sw
    fmea: [SWF-086]
    note: >-
      SWF-086.C1 (no freshness check on the flag across policy, controlsd and plannerd), SWF-086.C2 (stop only at -1.2 m/s²,
      no stop-time requirement; TSR-633, DQ-365). SW FMEA rev 1.1 closes the SW part of F-37
  - id: UE-8.09
    class: external
    ref: AOU-05R
  - id: BE-8.10
    class: systematic_sw
    fmea: [SWF-062, SFM-025]
    note: >-
      SWF-062.C1 (terminal state reached without the safe state: the DM events are PERMANENT alerts only, the item stays
      engaged after the forced stop) and SFM-025.C1 (no disable reaction at level 3). The safe state is decided (DQ-365 A,
      FSR-02.09, TSR-633): stopped, held, re-engagement locked out until the driver responds. Neither the hold nor the
      lockout while stopped is implemented, so the event is present by design (F-38)
  - id: UE-8.11
    class: external
    ref: >-
      AOU-16 (WP-C-01): the PCM keeps the vehicle stopped and held under ACC after the no-response stop. Not yet
      characterised on the reference Corolla; verified by the DQ-365 A vehicle test (level ground and a 6 % grade)

