  <text x="894" y="162" font-size="10.5" fill="#0F172A">No MPU; QM paths share the address space; SPI</text>
  <text x="894" y="176" font-size="10.5" fill="#0F172A">length unbounded (bank separation unconfirmed)</text>
  <text x="894" y="192" class="m xs">§7: TSR-507 · TSR-503 · TSR-412 · TSR-511 · TSR-514</text>
  <rect x="876" y="224" width="364" height="94" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="876" y="224" width="6" height="94" rx="3" fill="#A16207"/>
