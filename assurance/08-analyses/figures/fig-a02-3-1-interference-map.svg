  <rect x="456" y="356" width="364" height="164" rx="9" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.8"/>
  <rect x="468" y="366" width="170" height="18" rx="9" fill="#C2410C"/>
  <text x="553" y="379" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">ASIL C (B after re-rating)</text>
