<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 3-1. Coexistence and interference map: QM SoC, panda firmware partitions, interference channels and FFI verdicts (WP-A-02 §2–§8)</title>
  <desc id="d">Generated from WP-A-02 v0.13. The comma device (L-DEV) holds the QM SoC software and the panda STM32H7 firmware (L-MCU), one image without MPU partitioning: SoC-facing code (SPI/USB transport, command dispatcher, bootstub and softloader) is ASIL C where it touches safety state and FFI otherwise; the envelope core, tick handler, CAN driver, relay drivers, mode setting and fault handling are the ASIL partition; housekeeping is developed to ASIL C too. Interference channels: SP-01…05 spatial, TM-01…07 temporal, CM-01…19 communication. Verdicts of §8: L-MCU spatial not shown; L-MCU temporal partially shown; L-DEV communication (data) partially shown; L-DEV communication (commands) partial (ref); L-DEV boot control not shown.</desc>
