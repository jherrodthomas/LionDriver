<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 3-1. Coexistence and interference map: QM SoC, panda firmware partitions, interference channels and FFI verdicts (WP-A-02 §2–§8)</title>
  <desc id="d">The comma device (L-DEV) holds the QM SoC software and the panda STM32H7 firmware (L-MCU). The firmware is one image without MPU partitioning: SoC-facing code (SPI/USB transport, command dispatcher, bootstub and softloader) is ASIL C where it touches safety state and FFI otherwise; the envelope core, tick handler, CAN driver, relay drivers, mode setting and fault handling are ASIL C (B after re-rating); housekeeping is QM with FFI. Communication channels from the SoC are data frames (FFI-CM-01 to -05), configuration commands (FFI-CM-06 to -11, -13, -14), and boot and reset lines (FFI-CM-12); SoC timing faults are FFI-TM-06 and -07. Inside the MCU, spatial interference FFI-SP-01 to -05 and temporal interference FFI-TM-01 to -05 reach the ASIL partition. Vehicle CAN faults are FFI-CM-15 and -16. The verdicts of §8: L-MCU spatial not shown; L-MCU temporal partially shown since 2026-10-12; device data communication partially shown; device commands partially shown in the reference build; boot control not shown. Nothing is verified on hardware.</desc>
