  <rect x="644" y="434" width="164" height="36" rx="7" class="asilc"/>
  <text x="726" y="450" class="t sb" font-size="11" text-anchor="middle">fault handling</text>
  <text x="726" y="463" class="m" font-size="9.5" text-anchor="middle">exceptions, early init</text>
  <rect x="468" y="476" width="164" height="36" rx="7" class="asilc"/>
