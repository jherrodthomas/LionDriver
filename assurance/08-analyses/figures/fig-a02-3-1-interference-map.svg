  <text x="550" y="505" class="m" font-size="9.5" text-anchor="middle">FDCAN ISR, queues</text>
  <rect x="644" y="476" width="164" height="36" rx="7" class="asilc"/>
  <text x="726" y="492" class="t sb" font-size="11" text-anchor="middle">relay · harness drivers</text>
  <text x="726" y="505" class="m" font-size="9.5" text-anchor="middle">ASIL C/B · safe-state actuation</text>

