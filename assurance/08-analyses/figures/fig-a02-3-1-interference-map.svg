  <path d="M540 326V354" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#aP)"/>
  <rect x="548" y="332" width="74" height="16" rx="8" fill="#7C3AED"/><text x="585" y="344" class="tag" text-anchor="middle">SP-01…05</text>
