  <text x="70" y="158" class="t b" font-size="12.5">E-01 · E-02 SoC</text>
  <rect x="234" y="146" width="44" height="18" rx="9" fill="#64748B"/><text x="256" y="159" class="tag" text-anchor="middle">QM</text>

  <rect x="70" y="222" width="206" height="54" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="173" y="243" class="t sb" font-size="11.5" text-anchor="middle">pandad · card · controlsd</text>
