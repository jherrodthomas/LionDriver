  <!-- ===== verdict panel ===== -->
  <text x="876" y="112" class="m b" font-size="10" letter-spacing=".06em">FFI VERDICT (§8) · KEY MEASURES (§7)</text>

  <!-- 1 spatial -->
  <rect x="876" y="122" width="364" height="96" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="876" y="122" width="6" height="96" rx="3" fill="#7C3AED"/>
  <text x="894" y="142" class="t b" font-size="12">L-MCU spatial</text>
  <rect x="1132" y="130" width="96" height="18" rx="9" fill="#D2553F"/><text x="1180" y="143" class="tag" text-anchor="middle">NOT SHOWN</text>
  <text x="894" y="162" class="t" font-size="10.5">No MPU; QM paths share the address space; SPI</text>
  <text x="894" y="176" class="t" font-size="10.5">length unbounded (bank separation unconfirmed)</text>
  <text x="894" y="196" class="m xs">MPU and stack guard TSR-507 · RAM/flash ECC TSR-503</text>
  <text x="894" y="209" class="m xs">SPI length bounds TSR-412 (NF-04, OI-3)</text>

  <!-- 2 temporal -->
  <rect x="876" y="226" width="364" height="96" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="876" y="226" width="6" height="96" rx="3" fill="#A16207"/>
  <text x="894" y="246" class="t b" font-size="12">L-MCU temporal</text>
  <rect x="1012" y="234" width="72" height="18" rx="9" fill="#FFFFFF" stroke="#D2553F"/><text x="1048" y="247" font-size="9" font-weight="700" fill="#D2553F" text-anchor="middle">8b8c6ae: NOT</text>
  <text x="1092" y="247" class="m" font-size="11" text-anchor="middle">→</text>
  <rect x="1100" y="234" width="128" height="18" rx="9" fill="#D97706"/><text x="1164" y="247" class="tag" text-anchor="middle">PARTIALLY SHOWN</text>
  <text x="894" y="266" class="t" font-size="10.5">IWDG (≈ 90 ms) and 100 Hz safety task implemented,</text>
  <text x="894" y="280" class="t" font-size="10.5">priorities explicit; no WCET; rate faults report-only</text>
  <text x="894" y="300" class="m xs">IWDG TSR-501 · fault reaction TSR-502 · scheme TSR-519</text>
  <text x="894" y="313" class="m xs">not verified on hardware</text>

  <!-- 3 data -->
  <rect x="876" y="330" width="364" height="96" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="876" y="330" width="6" height="96" rx="3" fill="#0F766E"/>
  <text x="894" y="350" class="t b" font-size="12">L-DEV communication · data</text>
  <rect x="1100" y="338" width="128" height="18" rx="9" fill="#D97706"/><text x="1164" y="351" class="tag" text-anchor="middle">PARTIALLY SHOWN</text>
  <text x="894" y="370" class="t" font-size="10.5">TX hook limits every frame; no freshness or</text>
  <text x="894" y="384" class="t" font-size="10.5">sequence counter; weak 8-bit XOR checksum</text>
  <text x="894" y="404" class="m xs">CRC, sequence, freshness TSR-409…411 · TSR-614</text>
  <text x="894" y="417" class="m xs">TX rate supervision TSR-518 (reference build)</text>

  <!-- 4 commands -->
  <rect x="876" y="434" width="364" height="96" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="876" y="434" width="6" height="96" rx="3" fill="#0F766E"/>
  <text x="894" y="454" class="t b" font-size="12">L-DEV communication · cmds</text>
  <rect x="1124" y="442" width="104" height="18" rx="9" fill="#D97706"/><text x="1176" y="455" class="tag" text-anchor="middle">PARTIAL (REF)</text>
  <text x="894" y="474" class="t" font-size="10.5">Not shown at 8b8c6ae. Reference build: mode lock and</text>
  <text x="894" y="488" class="t" font-size="10.5">car-mode request gating; other builds unchanged</text>
  <text x="894" y="508" class="m xs">mode/param lock TSR-512 · command refusal TSR-513</text>
  <text x="894" y="521" class="m xs">not verified on hardware</text>

  <!-- 5 boot -->
  <rect x="876" y="538" width="364" height="94" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="876" y="538" width="6" height="94" rx="3" fill="#0F766E"/>
  <text x="894" y="558" class="t b" font-size="12">L-DEV boot control</text>
  <rect x="1132" y="546" width="96" height="18" rx="9" fill="#D2553F"/><text x="1180" y="559" class="tag" text-anchor="middle">NOT SHOWN</text>
  <text x="894" y="578" class="t" font-size="10.5">SoC drives BOOT0/RST; no RDP/WRP; development</text>
  <text x="894" y="592" class="t" font-size="10.5">bootstub in the recovery path (GAP-38, GAP-24)</text>
  <text x="894" y="612" class="m xs">RDP/WRP, modern signature TSR-511, TSR-514</text>
  <text x="894" y="625" class="m xs">FFI must be shown before G2</text>

