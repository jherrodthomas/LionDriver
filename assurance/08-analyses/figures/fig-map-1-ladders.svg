<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="706" viewBox="0 0 1344 706" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Figure 1. How the fault trees and the FMEAs meet</title>
<desc id="d">Figure 1. The fault tree and the FMEA as two ladders on shared levels. Worked chain: TE-04 (Uncontrollable deceleration) of SG-04, gate G4.1.1 (0x343 accel below the controllable bound on bus 0), basic event BE-4.03 (Frame corrupted after the TX hook (as BE-1.10; TSR-517)), a single point; FMEA DFM-019 (Approved CAN frame altered between the TX check and the bus), next-higher effect: Out-of-envelope steering or acceleration frame reaches the vehicle with a valid CAN CRC; end effect on HZ-006: Contributes to HZ-006 (deceleration below the bound); worst cause DFM-019.C1 (Soft error or permanent fault in the copy into FDCAN message RAM, the message RAM or the FDCAN core. The packet XOR is checked at the FDCAN load (fdcan.h:100) and covers only the software queue; the CAN CRC is computed after the fault; O 3, D 10, AP H). Pairing: Top event: End effect: its hazard maps to the goal's hazardous events (hara-mapping.yaml); Gate: System FMEA failure mode, optional (gates in the map); Basic event: software / SOTIF: SW FMEA or System FMEA failure mode; Basic event: hardware: DFMEA failure mode or FMEDA row; Basic event: installation: PFMEA failure mode; Undeveloped event, by design: No FMEA: an assumption of use or a reason.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1344" height="706" fill="#FFFFFF"/>
<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">How the fault trees and the FMEAs meet</text>
<text x="40" y="66" font-size="12.5" fill="#475569">The tree climbs down from the goal, the FMEA climbs up from the cause. The rungs are where fmea_lint.py checks that they agree.</text>
<text x="1304" y="44" font-size="11" fill="#475569" text-anchor="end">fta-fmea-map.yaml · ISO 26262-9 §8</text>
<text x="1304" y="62" font-size="11" fill="#475569" text-anchor="end">Figure 1</text>
