<g><animate attributeName="opacity" values="0.2;0.2;1;1" keyTimes="0;0.56;0.62;1" dur="6s" repeatCount="indefinite"/><rect x="900" y="470" width="320" height="70" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.4"/><text x="910" y="488" font-size="11" fill="#C2410C" font-weight="700">DFM-019.C1 · O 3 · D 10 · AP H</text><text x="910" y="503" font-size="10" fill="#0F172A">Soft error or permanent fault in the copy into FDCAN message</text><text x="910" y="515.5" font-size="10" fill="#0F172A">RAM, the message RAM or the FDCAN core. The packet XOR is …</text></g>
