  <text x="576" y="248" class="lr">accelerator</text>
  <text x="576" y="261" class="lr">override</text>

  <text x="274" y="334" class="lt" text-anchor="end">cluster: cruise,</text>
  <text x="274" y="347" class="lt" text-anchor="end">LKA / LTA, PCS</text>
  <text x="274" y="360" class="lt" text-anchor="end">warnings (C5 / C6)</text>
  <text x="649" y="334" class="lt" text-anchor="end">siren</text>
