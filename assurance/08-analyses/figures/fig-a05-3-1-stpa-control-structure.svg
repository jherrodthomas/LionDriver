  <text x="1184" y="456" class="lt" text-anchor="end">vehicle</text>
  <text x="1184" y="469" class="lt" text-anchor="end">CAN state</text>

  <text x="766" y="634" class="lr">block TX /</text>
  <text x="766" y="647" class="lr">controls off</text>
  <text x="876" y="634" class="lr">lateral torque</text>
  <text x="876" y="647" class="lr">0x2E4</text>
  <text x="1060" y="597" class="lr">intercept drive (SBU1)</text>

  <text x="209" y="634" class="lr" text-anchor="end">PCS brake,</text>
  <text x="209" y="647" class="lr" text-anchor="end">warnings;</text>
  <text x="209" y="660" class="lr" text-anchor="end">via harness box</text>
  <text x="209" y="673" class="lr" text-anchor="end">or forwarded by C3</text>

  <text x="476" y="816" class="lr">accel / brake</text>
  <text x="836" y="816" class="lr">rack torque</text>
  <text x="106" y="796" class="lt">vehicle motion,</text>
  <text x="106" y="809" class="lt">steering feel</text>

  <!-- ===== legend ===== -->
  <line x1="40" y1="926" x2="1240" y2="926" stroke="#E2E8F0"/>
  <g transform="translate(40,952)" font-size="10.5">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#C2410C" stroke-width="2"/><text x="36" y="4" class="t">Control action</text>
    <line x1="136" y1="0" x2="164" y2="0" stroke="#C2410C" stroke-width="2" stroke-dasharray="6 4"/><text x="172" y="4" class="t">Control action by withholding (frames not sent)</text>
    <line x1="430" y1="0" x2="458" y2="0" stroke="#0F766E" stroke-width="1.8"/><text x="466" y="4" class="t">Feedback</text>
    <rect x="546" y="-8" width="28" height="16" rx="4" fill="#FFFFFF" stroke="#64748B"/><text x="582" y="4" class="t">Controller in the item</text>
    <rect x="722" y="-8" width="28" height="16" rx="4" fill="#FFF7ED" stroke="#C2410C"/><text x="758" y="4" class="t">Safety envelope</text>
    <rect x="868" y="-8" width="28" height="16" rx="4" fill="#F1F5F9" stroke="#94A3B8"/><text x="904" y="4" class="t">External controller (UCAs as assumptions, §4.4)</text>
  </g>
  <text x="40" y="984" class="m xs">CA-07 is a control action of C2 on the driver and therefore points up. CA-11 and CA-12 come from the text version; the table in §3.3 lists CA-01…CA-10 and CA-13.</text>
</svg>
