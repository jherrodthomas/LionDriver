<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Figure 3-1. STPA control structure of the reference configuration (WP-A-05 §3.1)</title>
<desc id="d">Controllers from top to bottom by authority: C1 driver; C2 openpilot on the SoC; C3 panda safety model on the MCU and C6 stock ADAS camera; C5 PCM/ACC/brake ECU, C4 EPS ECU and the harness box with its two intercept switches; the controlled process is the vehicle lateral and longitudinal motion. Control actions CA-01 to CA-13 point down (CA-07, alerts to the driver, points up); feedback FB-01 to FB-07 points up. The harness box reports no switch position.</desc>
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker><marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker><style>
