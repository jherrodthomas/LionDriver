<text x="40" y="66" class="m" font-size="12.5">Reference configuration while driving · controllers top to bottom by authority · control actions down, feedback up</text>
<text x="1240" y="44" class="m s" text-anchor="end">WP-A-05 §3.1</text>
<text x="1240" y="62" class="m s" text-anchor="end">controllers §3.2 · CA / FB §3.3</text>
