  <text x="966" y="266" class="lt">driver camera,</text>
  <text x="966" y="279" class="lt">wheel touch</text>

  <text x="716" y="436" class="lr">torque 0x2E4,</text>
  <text x="716" y="449" class="lr">accel 0x343</text>
  <text x="826" y="436" class="lr">safety mode 0xdc,</text>
  <text x="826" y="449" class="lr">heartbeat 0xf3</text>
