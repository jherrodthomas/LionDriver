  <text x="746" y="248" class="lt">engagement</text>
  <text x="746" y="261" class="lt">state, alerts</text>
  <text x="746" y="274" class="lt">(UI, sounds)</text>
  <text x="856" y="248" class="lr">alerts, take-over</text>
