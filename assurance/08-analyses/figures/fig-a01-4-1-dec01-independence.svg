<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 4-1. Fallback decomposition DEC-01: envelope E-03 and independent actuation monitor E-07 with independence requirements IR-01 to IR-10 (WP-A-01 §4.2, §4.3)</title>
  <desc id="d">Left, the comma device E-04 holds the QM SoC software E-01 and the envelope E-03 on the panda STM32H7, which carries the B(C) half; both share the 12 V input stage, the clock tree, the PCB and the enclosure. Right, the concept element E-07 carries the A(C) half with its own supply, its own clock, its own receive-only CAN transceiver on bus 0, and limits fixed in firmware. Between them, the independence requirements IR-01 to IR-08 and IR-10 list what E-07 must not share. E-03 drives the coil of the harness intercept relay E-05 through a series switch that E-07 opens (IR-07); the relay remains a shared element covered by readback and a start-up test (IR-09). Neither the SoC nor E-03 can configure, reset or reflash E-07 (IR-06). DEC-01 is proposed, not applied, and no hardware exists.</desc>
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .t{fill:#0F172A}.m{fill:#475569}.s{font-size:11px}.xs{font-size:10.5px}.b{font-weight:700}.sb{font-weight:600}
      .asil{fill:#FFF7ED;stroke:#C2410C;stroke-width:1.6}
      .concept{fill:#FFFFFF;stroke:#C2410C;stroke-width:1.6;stroke-dasharray:6 4}
      .chip{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1}
      .shared{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.2}
      .own{fill:#FFFFFF;stroke:#C2410C;stroke-width:1;stroke-dasharray:4 3}
      .ext{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.2}
      .ir{fill:#334155}
    </style>
  </defs>
  <rect width="1280" height="800" fill="#FFFFFF"/>

  <!-- header -->
  <text x="40" y="44" class="t b" font-size="20">Figure 4-1 · DEC-01 fallback: what E-07 must not share with E-03</text>
  <text x="40" y="66" class="m" font-size="12.5">C(C) = B(C) on the envelope E-03 + A(C) on a new independent actuation monitor E-07 · concept only, proposed, not applied</text>
  <text x="1240" y="44" class="m s" text-anchor="end">WP-A-01 §4.2, §4.3</text>
  <text x="1240" y="62" class="m s" text-anchor="end">DFA: WP-A-03 IC-07 (repeat on activation)</text>
  <line x1="40" y1="82" x2="1240" y2="82" stroke="#E2E8F0"/>

  <!-- IR-06 blocked path (top) -->
  <path d="M340 128V112H818" stroke="#D2553F" stroke-width="1.8" stroke-dasharray="6 4" fill="none"/>
  <g stroke="#D2553F" stroke-width="2.6" stroke-linecap="round"><path d="M632 104L648 120M648 104L632 120"/></g>
  <text x="660" y="104" fill="#D2553F" font-size="10.5" font-weight="700">no configure, reset, reflash or boot path from SoC or E-03 (IR-06)</text>

  <!-- ===== left: comma device ===== -->
  <rect x="40" y="128" width="410" height="352" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="56" y="150" class="t b" font-size="13">E-04 comma device</text>
  <text x="190" y="150" class="m s">one PCB, one enclosure</text>

  <rect x="60" y="164" width="150" height="96" rx="8" class="chip"/>
  <text x="135" y="186" class="t sb" font-size="12" text-anchor="middle">E-01 SoC software</text>
  <text x="135" y="202" class="m" font-size="10" text-anchor="middle">QM · openpilot, pandad</text>
  <text x="135" y="222" class="m" font-size="10" text-anchor="middle">produces the command</text>
  <text x="135" y="236" class="m" font-size="10" text-anchor="middle">that both halves check</text>

  <rect x="250" y="164" width="190" height="168" rx="10" class="asil"/>
  <text x="264" y="186" class="t b" font-size="12.5">E-03 envelope</text>
  <rect x="362" y="174" width="66" height="18" rx="9" fill="#C2410C"/>
  <text x="395" y="187" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">B(C)</text>
  <text x="264" y="204" class="m" font-size="10">panda STM32H7 · opendbc safety</text>
  <text x="264" y="226" class="t" font-size="10.5">• torque magnitude, rate</text>
  <text x="264" y="242" class="t" font-size="10.5">• measured tracking</text>
  <text x="264" y="258" class="t" font-size="10.5">• engagement gating</text>
  <text x="264" y="274" class="t" font-size="10.5">• drives the relay coil</text>
  <text x="264" y="300" class="m" font-size="10">TSR-101…110, -301…311,</text>
  <text x="264" y="314" class="m" font-size="10">-401…413, -501…516</text>

  <path d="M210 212H248" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#aG)"/>
  <text x="229" y="206" class="m" font-size="9.5" font-weight="600" text-anchor="middle">SPI</text>

  <rect x="60" y="348" width="182" height="54" rx="8" class="shared"/>
  <text x="151" y="370" class="t sb" font-size="11.5" text-anchor="middle">12 V input stage</text>
  <text x="151" y="386" class="m" font-size="10" text-anchor="middle">and regulators · DFI-01</text>
  <rect x="254" y="348" width="186" height="54" rx="8" class="shared"/>
  <text x="347" y="370" class="t sb" font-size="11.5" text-anchor="middle">Clock tree (HSE)</text>
  <text x="347" y="386" class="m" font-size="10" text-anchor="middle">DFI-02</text>
  <rect x="60" y="414" width="380" height="50" rx="8" class="shared"/>
  <text x="250" y="435" class="t sb" font-size="11.5" text-anchor="middle">PCB · enclosure · windscreen thermal</text>
  <text x="250" y="451" class="m" font-size="10" text-anchor="middle">DFI-03, DFI-04 · plus common source and toolchain DFI-16, DFI-17</text>

  <!-- ===== middle: independence requirements ===== -->
  <text x="490" y="146" class="t b" font-size="12.5">Independence requirements (§4.3)</text>
  <text x="490" y="162" class="m" font-size="10">to be met and shown by the DFA before DEC-01 is credited</text>
  <g font-size="10.5">
    <rect x="490" y="176" width="48" height="18" rx="9" class="ir"/><text x="514" y="189" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-01</text>
    <text x="548" y="189" class="t">own power path, or relay off on own supply loss</text>
    <text x="548" y="202" class="m" font-size="10">shared power · DFI-01</text>
    <rect x="490" y="210" width="48" height="18" rx="9" class="ir"/><text x="514" y="223" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-02</text>
    <text x="548" y="223" class="t">own clock source</text>
    <text x="548" y="236" class="m" font-size="10">shared clock · DFI-02</text>
    <rect x="490" y="244" width="48" height="18" rx="9" class="ir"/><text x="514" y="257" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-03</text>
    <text x="548" y="257" class="t">own CAN transceiver and controller</text>
    <text x="548" y="270" class="m" font-size="10">no panda forwarding or panda data</text>
    <rect x="490" y="278" width="48" height="18" rx="9" class="ir"/><text x="514" y="291" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-04</text>
    <text x="548" y="291" class="t">no shared code, libraries, limit tables</text>
    <text x="548" y="304" class="m" font-size="10">DFI-08, DFI-16, DFI-17</text>
    <rect x="490" y="312" width="48" height="18" rx="9" class="ir"/><text x="514" y="325" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-05</text>
    <text x="548" y="325" class="t">different toolchain, or qualified argument</text>
    <text x="548" y="338" class="m" font-size="10">common compiler fault · WP-P-07</text>
    <rect x="490" y="346" width="48" height="18" rx="9" class="ir"/><text x="514" y="359" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-06</text>
    <text x="548" y="359" class="t">no command interface in release builds</text>
    <text x="548" y="372" class="m" font-size="10">GAP-09 / GAP-38 pattern · path drawn above</text>
    <rect x="490" y="380" width="48" height="18" rx="9" class="ir"/><text x="514" y="393" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-07</text>
    <text x="548" y="393" class="t">de-energise-to-safe switch, not overridable</text>
    <text x="548" y="406" class="m" font-size="10">common actuation path · see relay below</text>
    <rect x="490" y="414" width="48" height="18" rx="9" class="ir"/><text x="514" y="427" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-08</text>
    <text x="548" y="427" class="t">separate housing or board in the harness box</text>
    <text x="548" y="440" class="m" font-size="10">shared PCB, thermal, mechanical · DFI-03, DFI-04</text>
    <rect x="490" y="448" width="48" height="18" rx="9" class="ir"/><text x="514" y="461" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-10</text>
    <text x="548" y="461" class="t">limits set from controllability evidence</text>
    <text x="548" y="474" class="m" font-size="10">independent of E-01 and E-03 limits · DFI-08</text>
  </g>

  <!-- ===== right: E-07 concept ===== -->
  <rect x="820" y="128" width="420" height="352" rx="12" class="concept"/>
  <text x="836" y="150" class="t b" font-size="13">E-07 independent actuation monitor</text>
  <rect x="1104" y="138" width="122" height="18" rx="9" fill="#C2410C"/>
  <text x="1165" y="151" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">A(C) · concept</text>
  <text x="836" y="168" class="m" font-size="10.5">second MCU on the harness side · no design exists</text>
  <rect x="836" y="176" width="190" height="18" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
  <text x="931" y="189" fill="#D97706" font-size="10" font-weight="700" text-anchor="middle">PROPOSED · NOT APPLIED</text>

  <rect x="836" y="204" width="388" height="96" rx="8" class="chip"/>
  <text x="850" y="222" class="t sb" font-size="11.5">Checks (A(C) subset)</text>
  <text x="850" y="239" class="t" font-size="10.5">(1) 0x2E4 torque ≤ speed-dependent bound</text>
  <text x="850" y="254" class="t" font-size="10.5">(2) 0x2E4 torque or steer request only while PCM cruise active</text>
  <text x="850" y="269" class="t" font-size="10.5">(3) commanded torque within bound of measured EPS torque</text>
  <text x="850" y="284" class="t" font-size="10.5">(4) 0x343 accel bound / inactive value (if extended to SG-03/04)</text>

  <rect x="836" y="310" width="388" height="38" rx="8" class="own"/>
  <text x="850" y="327" class="t sb" font-size="11.5">Limits fixed in E-07 firmware</text>
  <text x="850" y="341" class="m" font-size="10">no configuration path from the SoC or from E-03</text>

  <rect x="836" y="356" width="188" height="48" rx="8" class="own"/>
  <text x="930" y="377" class="t sb" font-size="11.5" text-anchor="middle">Own supply path</text>
  <text x="930" y="393" class="m" font-size="10" text-anchor="middle">IR-01</text>
  <rect x="1036" y="356" width="188" height="48" rx="8" class="own"/>
  <text x="1130" y="377" class="t sb" font-size="11.5" text-anchor="middle">Own clock</text>
  <text x="1130" y="393" class="m" font-size="10" text-anchor="middle">IR-02</text>
  <rect x="836" y="414" width="388" height="50" rx="8" class="own"/>
  <text x="1030" y="435" class="t sb" font-size="11.5" text-anchor="middle">Own CAN transceiver + controller · RX only (IR-03)</text>
  <text x="1030" y="451" class="m" font-size="10" text-anchor="middle">0x2E4, 0x260, 0x1D2, 0x226, 0xAA, 0x343</text>

  <!-- ===== relay E-05 (shared) ===== -->
  <rect x="500" y="500" width="300" height="78" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="514" y="519" class="t b" font-size="12">E-05 harness intercept relay</text>
  <text x="786" y="519" class="m" font-size="10" text-anchor="end">shared element</text>
  <rect x="514" y="528" width="112" height="40" rx="6" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.2"/>
  <text x="570" y="545" class="t sb" font-size="10.5" text-anchor="middle">series switch</text>
  <text x="570" y="559" class="m" font-size="10" text-anchor="middle">opened by E-07</text>
  <text x="640" y="542" class="t" font-size="10">coil · de-energised = stock</text>
  <text x="640" y="555" class="t" font-size="10">camera ↔ vehicle (AOU-13)</text>
  <rect x="862" y="510" width="48" height="18" rx="9" class="ir"/><text x="886" y="523" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-09</text>
  <text x="918" y="523" class="t" font-size="10.5">relay and connector stay shared: contact readback</text>
  <text x="918" y="538" class="t" font-size="10.5">seen by E-03 and E-07, latent-fault test at start-up</text>
  <text x="918" y="553" class="m" font-size="10">DFI-05 · FMEDA WP-H-03</text>

  <!-- ===== vehicle CAN ===== -->
  <line x1="40" y1="640" x2="1240" y2="640" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <text x="40" y="628" class="t b" font-size="12">Vehicle CAN · bus 0 (car side)</text>
  <line x1="300" y1="640" x2="300" y2="660" stroke="#0F172A" stroke-width="2"/>
  <rect x="240" y="660" width="120" height="46" rx="8" class="ext"/>
  <text x="300" y="681" class="t sb" font-size="12" text-anchor="middle">EPS</text>
  <text x="300" y="696" class="m" font-size="10" text-anchor="middle">0x260 status</text>
  <line x1="450" y1="640" x2="450" y2="660" stroke="#0F172A" stroke-width="2"/>
  <rect x="380" y="660" width="140" height="46" rx="8" class="ext"/>
  <text x="450" y="681" class="t sb" font-size="12" text-anchor="middle">ECM / PCM · ABS</text>
  <text x="450" y="696" class="m" font-size="10" text-anchor="middle">0x1D2, 0x226, 0xAA</text>

  <!-- ===== connections ===== -->
  <!-- E-03 coil drive -> series switch -->
  <path d="M440 296H472V548H512" stroke="#C2410C" stroke-width="2.2" fill="none" marker-end="url(#aR)"/>
  <!-- E-03 TX/RX bus 0 -->
  <path d="M440 318H458V638" stroke="#C2410C" stroke-width="2.4" fill="none" marker-end="url(#aR)" marker-start="url(#aR)"/>
  <text x="466" y="628" fill="#C2410C" font-size="10" font-weight="600">E-03 TX/RX</text>
  <!-- E-07 opens series switch -->
  <path d="M846 480V600H570V570" stroke="#C2410C" stroke-width="2" fill="none" marker-end="url(#aR)"/>
  <rect x="666" y="591" width="48" height="18" rx="9" class="ir"/><text x="690" y="604" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">IR-07</text>
  <!-- relay contacts -> bus 0 (stock path) -->
  <path d="M760 578V638" stroke="#0F766E" stroke-width="2.2" fill="none" marker-end="url(#aT)" marker-start="url(#aT)"/>
  <text x="768" y="626" fill="#0F766E" font-size="10" font-weight="600">camera ↔ car side</text>
  <!-- bus 0 -> E-07 RX only -->
  <path d="M1214 640V466" stroke="#0F766E" stroke-width="2.2" fill="none" marker-end="url(#aT)"/>
  <text x="1206" y="628" fill="#0F766E" font-size="10" font-weight="600" text-anchor="end">RX only</text>

  <!-- ===== legend ===== -->
  <line x1="40" y1="726" x2="1240" y2="726" stroke="#E2E8F0"/>
  <g transform="translate(40,750)" font-size="10.5">
    <rect x="0" y="-8" width="28" height="16" rx="4" class="asil"/><text x="36" y="4" class="t">ASIL element</text>
    <rect x="130" y="-8" width="28" height="16" rx="4" class="concept"/><text x="166" y="4" class="t">Concept, does not exist</text>
    <rect x="326" y="-8" width="28" height="16" rx="4" class="shared"/><text x="362" y="4" class="t">Shared resource</text>
    <rect x="482" y="-8" width="28" height="16" rx="4" class="own"/><text x="518" y="4" class="t">Required own resource</text>
    <line x1="676" y1="0" x2="704" y2="0" stroke="#C2410C" stroke-width="2.4"/><text x="712" y="4" class="t">Actuation / relay drive</text>
    <line x1="866" y1="0" x2="894" y2="0" stroke="#0F766E" stroke-width="2.2"/><text x="902" y="4" class="t">Vehicle signals</text>
    <line x1="1014" y1="0" x2="1042" y2="0" stroke="#D2553F" stroke-width="1.8" stroke-dasharray="6 4"/><text x="1050" y="4" class="t">Path that must not exist</text>
  </g>
  <text x="40" y="782" class="m" font-size="10">DFI-xx: WP-A-03 initiators each requirement addresses. If DEC-01 is activated, E-07 is added to WP-C-01 and WP-S-03 with new TSRs (§4.4, OI-2) and the DFA is repeated for IC-07 (WP-A-03 OI-5).</text>
</svg>
