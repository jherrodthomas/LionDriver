# STPA loss scenarios <-> fault trees, FMEA and TSRs (WP-A-05 step 4 cross-check).
#
# Each loss scenario of WP-A-05 §5 is linked to the fault-tree events (WP-A-04), FMEA failure modes and technical safety
# requirements (WP-S-02) that cover it. Checked by tools/safety/fmea_lint.py:
#   - every UCA of WP-A-05 has a loss scenario here, or is an external UCA with the assumption it rests on
#   - the scenario set matches WP-A-05; every cited event, failure mode and TSR exists
#   - a cited fault-tree event lies in the tree of a safety goal of the scenario's hazards (warning otherwise)
#   - status covered / known_gap needs at least one event or failure mode; status new needs a finding
# Status: draft, AI-assisted, 2026-10-13; v0.4 re-baseline and harness box (RR-2026-010) 2026-10-16; each link needs review.
#
# v0.5: optional keys, not checked by fmea_lint (checked against the FMEA files and the decision register when written):
#   actions       FMEA actions (SFM-/SWF-/DFM-/PFM-ACT-) that address the scenario
#   decisions     decision-register entries (DQ-) that decide or wait on it
#   open_because  for a known gap: why it stays open (WP-A-05 §5.6)
