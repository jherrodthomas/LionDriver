# Every AND gate of the WP-A-04 fault trees, classified for the dependent failure analysis (WP-A-03).
#
# An AND gate claims that its inputs do not fail together. dfa_gates.py lists the AND gates of the trees and checks
# that each one is here, with one `inputs` entry per input of the gate as the tree has it (event or gate ID; an
# implicit "Any of …" input by that text), giving the elements the input lies in (shared-resources.yaml).
#
#   kind: independence   the inputs lie in different elements; `claim` names the WP-A-03 independence claim (IC-xx)
#                        that covers them (a list when different pairs of inputs need different claims), or is
#                        null with a `note` saying what is missing
#         same_element   all inputs lie in one element: a common cause is the element's own (WP-A-02, WP-W-04 or
#                        the on-die analysis of WP-H-03), not a cross-element DFI
#         common_cause   the gate already draws one cause and what it removes together: the dependence is in the
#                        tree, nothing to add
#         condition      an item fault AND a driving situation (traffic): exposure, not independence
#
# dfa_gates.py derives the shared resources of each independence gate from the map and writes dfa-gates.md.
# Draft, AI-assisted; each classification needs review.
schema_version: 1

gates:
  # ---- SG-01
  G1.1:
    kind: independence
    claim: IC-02
    inputs: {G1.1.1: [E-01, E-03], UE-1.11: [EXT-EPS]}
  G1.1.1.a:
    kind: independence
    claim: IC-01
    inputs: {G-SoC: [E-01, E-02], G-ENV: [E-03]}
  G1.2.1:
    kind: independence
    claim: IC-01
    inputs: {G1.2.1.a: [E-03], BE-1.15: [E-01]}
  G1.2.2:
    kind: independence
    claim: IC-01
    inputs: {G1.2.2.a: [E-03], BE-1.15: [E-01]}
  G1.3:
