    claim: IC-01
    inputs: {G1.3.1: [E-01], G1.3.2: [E-03]}
  G1.3.2:
    kind: same_element
    inputs: {BE-1.22: [E-03], BE-1.23: [E-03]}
    note: two envelope design gaps (BE-1.23 by design)
  G1.4:
