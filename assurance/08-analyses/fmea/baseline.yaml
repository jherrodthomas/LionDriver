  - id: BL-007
    status: frozen
    description: >-
      BL-006 plus liondriver-dev up to 9fe3eb2 (#486, 2026-10-26). Host, reference platform: no engagement outside the assured
      settings or below 60 km/h (#287, DQ-221 A, DQ-280 A); a setting changed while engaged is held until disengagement
      (#342, DQ-403 A); no drive request while the car reports a stock AEB event (DQ-300 A, stock_aeb_interlock.py); wheel-touch
      reminders also bounded by distance (TSR-634, #221); the DM countdown runs in elapsed time and an uncertain DM output no
      longer stops it (SWSR-635a/b, #366); the minimum-risk manoeuvre is latched until the driver takes over (TSR-633, #372,
      minimum_risk.py) and announced with a countdown before it starts (TSR-624, #374); start-up EPS and ABS/VSC fault-code
      read with an entry check (TSR-629, DQ-132 A, vehicle_dtc.py); joystick and maneuver processes excluded from the
      reference build (DQ-131 A) and the uploader and athena never started (DQ-121 A). opendbc 62b89a3 -> 4d1a056: only
      accepted command frames keep TX-arrival authority (SWSR-408); final ACCEL_CMD rate-limited and no positive request
      during stock AEB (TSR-713, SWSR-713h); a TX-arrival revocation is reported for the siren. panda 0a7da85 -> 3a8b7c2,
      reference build: EPS-fault siren persistence 0.7 s and still sounding after a revocation (DQ-048 A, DQ-367); siren on a
      TX-arrival revocation (DQ-404 A, TSR-516(b)); a not-engaged heartbeat revokes within 0.3 s, with the siren at 0.5 s
      while PCM cruise stays on (TSR-307(a), TSR-516(c), engaged_mismatch.h); HIL test for it (bench only). Not in BL-007:
      TSR-409 command-value freshness, TSR-204 envelope jerk limit, TSR-304 driver-override check, SFM-ACT-005, the host use of
      the panda epsFault and requestsRejected fields (SFM-ACT-024). Nothing in BL-007 is verified on the vehicle.
