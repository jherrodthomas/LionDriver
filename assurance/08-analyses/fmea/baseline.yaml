    status: proposed
    description: >-
      BL-003 plus liondriver-dev #33-#43: explicit IRQ priorities (panda#10) and a HIL test of the watchdog-reset report (panda#9);
      in the reference build only, 0x262 and 0x1D3 supervised (opendbc#6), LKA actuation refused on an EPS fault (opendbc#7,
      reported to openpilot as pandaState.epsFault through opendbc#8 and panda#11),
