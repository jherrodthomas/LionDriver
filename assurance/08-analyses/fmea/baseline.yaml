# Configurations that safety analyses are performed against. Schema: schema/baseline.schema.json
# A baseline is "proposed" until Phase 1 of fmea-plan.md starts, then "frozen".
# Changing any field of a frozen baseline requires a new BL id and an impact analysis.
# BL-007 is the first frozen baseline (project lead, 2026-10-26: freeze the next baseline and re-rate every FMEA against it).
# BL-001..BL-006 stay as recorded: they are the configurations of the earlier ratings and no longer change.
