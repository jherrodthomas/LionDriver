  - id: BL-006
    status: proposed
    description: >-
      BL-005 plus liondriver-dev up to #186 (2026-10-17). Host: a temporary EPS fault after a recent override or at standstill
      gets the lighter prompt for at most 1.5 s, then the take-over request (TSR-607 (b), DQ-342 A, #174), and while the
      driver keeps steering through a fault the lighter prompt follows after 1.5 s (TSR-607 (c), DQ-366 A, f350f5b);
      test_steer_fault_warning.py collected by the CI test runner. opendbc 9a13f60 -> 62b89a3: no re-engagement while a
      TX-rate excess persists (ATC-20) and no authority after a safety-mode change without a new engagement
      (#15, DQ-079, DQ-080); safety tests for angle-initializing frames and TX-rate rejection saturation (#16); a cruise
      edge refused for MAIN_ON = 0 also closes the engagement window (#17, SM-F1); in the reference build a wrong-length
      frame of an RX-checked message is an RX fault that clears controls_allowed at once (#18, ATC-25, SWSR-402, B2B-01).
      panda a55bdfc -> 0a7da85: in the reference build a relay malfunction is latched for the ignition cycle and TOYOTA is
      refused until ignition off (panda#17, DFA DM-25). Not in BL-006: TSR-630..633, SFM-ACT-005, the host use of the
      panda epsFault and requestsRejected fields (SFM-ACT-024) and the panda driver-override check (TSR-304).
