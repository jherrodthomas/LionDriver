  - id: BL-005
    status: proposed
    description: >-
      BL-004 plus liondriver-dev #36-#86. The reference build is now the default: openpilot's SConstruct builds the panda
      firmware and pandad with LIONDRIVER_REFERENCE=1 unless it is set empty (#36, #41), pandad refuses a car safety mode on
      a panda without HEALTH_FLAG_REFERENCE_BUILD (TSR-619, panda#12) and the release script selects the reference variant
      (#80, CI job panda_reference_release_build). Firmware: siren on a persistent EPS fault and on heartbeat-loss
      revocation (panda#14, #15), ELM327 refused after the car mode until ignition off (panda#16), assist-active LKAS_HUD
      refused without authority (opendbc#13), TX arrival supervision (opendbc#11, TSR-408), PCM-edge grant gated on the
      heartbeat's engaged flag (opendbc#14). Host: selfdrived reacts to the panda's TX-rate, heartbeat-loss and TX-blocked
      flags and to a controlsAllowed mismatch within 0.5 s, cruiseMismatch alert after 1 s, controlsd input freshness and
      non-finite guards (#51, TSR-615, TSR-621, TSR-602, TSR-308), pandaStates fault mapping (#48), Chill mode by default
      (#74), assured-configuration logging (CA-008) and the stock AEB interlock (CA-001). Not included: opendbc#15 (no
      re-grant while a TX-rate excess persists, DQ-079; no authority after a mode change without a new engagement, DQ-080)
      and opendbc#16, merged in the fork but not pinned.
