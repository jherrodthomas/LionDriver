  wire_ends: [HB.R2/R3.1-J3.A8]
  rate_kind: generic
  stress_converted: false
  part: 'SBU1 pull-down: 2 × 120 Ω thick-film resistor in series'
  dfmea_element: DFM-SE-006
  failure_rate_fit: 0.4
  failure_rate_source: 'Generic estimate (SMD thick-film chip resistor, 2 × about 0.2 FIT). Part class known from the harness box v3 drawing (RR-2026-010 HB-02); maps to the SN 29500 passive-component class, but no reference value could be obtained (standard not reachable, 2026-10-16). Stays generic until the source is confirmed (WP-H-03 OI-2); shipped parts unconfirmed (VS-HW-02)'
