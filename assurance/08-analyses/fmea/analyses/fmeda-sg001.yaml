# yaml-language-server: $schema=../schema/fmeda.schema.json
# FMEDA for SG-001 (lateral) at BL-002 with GENERIC failure rates (no BOM, no supplier data). The metrics show where the
# architecture falls short; they are not evidence of compliance. Classification per rating-tables §6.1; DC per §6.2.
# Rev 0.3 (2026-10-15, RR-2026-010): FMD-C-007 re-based from a relay to the harness box analog switches U1/U2, and FMD-C-008 added
# for the SBU1 pull-down R2/R3. Rates are generic for the part class.
# Rev 0.4 (2026-10-16): FMD-C-007 (U1/U2) takes the SN 29500-2 reference value for CMOS analog ICs, 2 × 25 FIT, quoted from TI
# functional-safety reports (standard not read, no stress conversion); was 2 × 5 FIT generic. The box discretes and resistors keep generic rates
# with their SN 29500 class named; no reference value was reachable. Mission profile: the harness box sits behind the camera in the same
# sun-loaded windscreen zone and takes the same profile.
# Rev 0.5 (2026-10-18, decision DQ-362 option A): this analysis and the SG-009 FMEDA also stand for assurance SG-02, SG-03 and SG-06
# (ASIL C since HARA v0.4) and for SG-05 (ASIL B): their random hardware faults run through the same panda, transceiver and harness
# box rows. One analysis, a note per goal (WP-H-03 §6.4); no rate, classification or metric changes. The rows are classified for SG-001.
# The SG-001 figures (SPFM 96.84 %, LFM 88.94 %) are carried for the shared path and miss the ASIL C SPFM target (97 %) by 0.16
# points: an open hardware item for G2 (WP-H-04 OI-6), closed with supplier rates or the TSR-517 transmit read-back, or back to the
# lead. Rows the FTA cites for those goals carry a note naming the goal.
# Rev 0.6 (2026-10-20): harness-box and harness components carry the wire-end IDs of the WireViz drawings (wire ends in assurance/04-hardware/wiring/wire-ends.tsv, transcribed from
# comma's v3 drawing, not measured; wiring OI-W-1) in ref_des. No rate, classification or metric changes.
# Rev 0.7 (2026-10-20, FMEDA format review): the goals and ASIL targets of WP-H-04 §4 are data (analysis.targets): SG-01 at C with B
# alongside (DQ-063), SG-02/03/06 at C and SG-04/05 at B on the shared rows (DQ-002, DQ-362). LD-HARA-001's ASIL D for SG-001 stays as
# asil_target for reference only. FMD-001 and FMD-009 carry their SG-05 classification (single-point, FTA BE-5.02) as per_goal entries,
# so SG-05 gets its own estimate. Rate kind, handbook reference and wire ends are separate fields; history is data. SG-01 rates and
# classifications are unchanged.
schema_version: 1
analysis:
  id: FMD
  type: fmeda
  title: FMEDA — SG-001 lateral (panda safety path), generic failure rates
  revision: '0.7'
  status: draft
  baseline: BL-002
  rating_tables: RT-1
  scope: Random hardware faults of the panda section that can let an out-of-envelope or unauthorised steering request reach the EPS (LD-HARA-001 SG-001, ASIL D; assurance
    WP-C-03 SG-01, ASIL C pending OI-1). Reference device at BL-002. By decision DQ-362 (2026-10-18) the rows also stand for assurance SG-02, SG-03, SG-06
    (ASIL C) and SG-05 (ASIL B), classified for SG-001; per-goal notes in WP-H-03 §6.4
  safety_goal: SG-001
  asil_target: D
  targets:
  - goal: SG-01
    asil: C
    also_show: [B]
    basis: 'WP-C-03 SG-01 at ASIL C until the HARA re-rates it, with the ASIL B result shown alongside (DQ-063). LD-HARA-001 SG-001 is rated D'
  - goal: SG-02
    asil: C
    basis: 'WP-C-03 v0.4; the shared rows are reused with the SG-01 classification (DQ-362 option A, WP-H-03 §6.4)'
  - goal: SG-03
    asil: C
    basis: 'WP-C-03 v0.4; 0x343 leaves through the same TX path, rows reused with the SG-01 classification (DQ-362 option A)'
  - goal: SG-04
    asil: B
    basis: 'WP-C-03 v0.4; rows reused with the SG-01 classification (DQ-002)'
  - goal: SG-05
    asil: B
    basis: 'WP-C-03 v0.4; rows reused (DQ-362 option A), with FMD-001 and FMD-009 single-point for this goal (FTA BE-5.02)'
  - goal: SG-06
    asil: C
    basis: 'WP-C-03 v0.4; the shared rows are reused with the SG-01 classification (DQ-362 option A, WP-H-03 §6.4)'
  mission_profile: 'Passenger car, windscreen-mounted device: ambient up to +85 °C in the sun-loaded enclosure, Tj up to about +105 °C; about 500 operating h/year
    for 15 years (7,500 h). Failure rates in FIT (1e-9/h); transient (soft-error) rates included where noted. PMHF here is only λSPF + λRF; the dual-point term is
    not computed (rating-tables §6.3)'
  out_of_scope:
  - SoC and its software (QM; their faults are the first fault of a dual-point pair)
  - 'Vehicle ECUs (EPS, PCM, stock camera): external measures'
  - 'Relay stuck intercepting and watchdog: no effect on SG-001 (no torque without a valid frame); see the SG-009 FMEDA'
  references:
  - assurance/04-hardware/WP-H-02-hardware-design.md
  - assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md
  - assurance/08-analyses/fmea/analyses/dfmea.yaml
  - assurance/08-analyses/fmea/rating-tables.md
  - ISO 26262-5:2018 §8-9 and Annex D; ISO 26262-11:2018 §4.6 (semiconductors)
  updated: '2026-10-20'
  history:
  - revision: '0.1'
    date: '2026-10-10'
    change: 'Stub without components'
  - revision: '0.2'
    date: '2026-10-12'
    change: 'First quantitative FMEDA at BL-002 with generic failure rates'
  - revision: '0.3'
    date: '2026-10-15'
    change: 'Relay re-based to the harness box v3 analog switches U1/U2 and its pull-down, supply and clamps (RR-2026-010)'
  - revision: '0.4'
    date: '2026-10-16'
    change: 'U1/U2 at the SN 29500-2 reference value, 2 × 25 FIT (secondary quote); box discretes keep generic rates with their SN 29500 class named'
  - revision: '0.5'
    date: '2026-10-18'
    change: 'Rows reused for SG-02, SG-03, SG-05 and SG-06 (DQ-362 A), a note per goal; no rate, classification or metric change'
  - revision: '0.6'
    date: '2026-10-20'
    change: 'Wire-end IDs of the WireViz drawings added; no rate, classification or metric change'
  - revision: '0.7'
    date: '2026-10-20'
    change: 'Format review: targets per goal (C with B alongside for SG-01), SG-05 classification of FMD-001 and FMD-009, rate kind and wire ends as fields; SG-01 metrics unchanged'
safety_mechanisms:
- id: FMD-SM-001
  description: Flash ECC (single-error correction in silicon; corrected reads are transparent)
  dc_basis: 'ISO 26262-5 Annex D, Table D.6 (memory): ECC, high for single-bit faults'
  implementation: STM32H7 flash ECC (RM0468); always on
- id: FMD-SM-002
  description: SRAM ECC (single-error correction in silicon); double errors flagged but not handled at BL-002
  dc_basis: 'ISO 26262-5 Annex D, Table D.6: ECC, high for single-bit faults; double errors not credited'
  implementation: STM32H7 RAM ECC (RM0468); RAMECC monitors not configured
  requirement: TSR-503
- id: FMD-SM-003
  description: Bootstub signature check of the application image at every power-up
  dc_basis: 'Annex D, Table D.6: memory signature at start-up; credited for latent permanent faults only (once per drive cycle)'
  implementation: panda/board/bootstub.c
- id: FMD-SM-004
  description: 8-bit XOR over the TX packet checked before loading into the FDCAN FIFO
  dc_basis: 'Annex D, Table D.7 (communication): checksum, low; covers the software TX queue only'
  implementation: panda/board/drivers/fdcan.h:100
  requirement: TSR-517
- id: FMD-SM-005
  description: 'Clock security system on HSE loss: NMI and reset'
  dc_basis: 'Annex D, Table D.9 (clock): CSS for clock loss, high for stop; does not detect drift'
  implementation: panda/board/stm32h7/clock.h
  requirement: TSR-504
- id: FMD-SM-006
  description: 'Relay malfunction detection: a stock camera control message seen on the car side blocks all TX (1 s grace after a mode change)'
  dc_basis: 'Analysis: detects relay-not-intercepting before or within about 1-2 s of engagement; medium'
  implementation: opendbc_repo/opendbc/safety/safety.h
  requirement: TSR-710
- id: FMD-SM-008
  description: CAN protocol CRC and per-message RX timeout (5 periods) on vehicle messages
  dc_basis: 'Annex D, Table D.7: CRC, high for transmission errors; RX timeout for loss'
  implementation: opendbc_repo/opendbc/safety/safety.h
  requirement: TSR-401
components:
- id: FMD-C-001
  part: STM32H725 CPU core, bus matrix, interrupt controller and peripherals (digital logic, permanent and transient)
  dfmea_element: DFM-SE-002
  failure_rate_fit: 50
  failure_rate_source: Generic estimate, order of magnitude of handbook values (SN 29500 / IEC TR 62380 class) for this part type at the mission profile below; not
    looked up for the actual part. No BOM or supplier data available (WP-H-02 UK-02)
  safety_related: true
  failure_modes:
  - id: FMD-001
    mode: Wrong result of a limit or authority check (permanent or transient)
    distribution: 0.25
    violates_sg_directly: false
    mpf_potential: true
    dfmea_ref: DFM-001
    notes: 'Needs a SoC command outside the envelope as second fault. No CPU self-test, so fully latent. Also stands for SG-05 (FTA BE-5.02,
      DQ-362): a wrong authority check that keeps authority after the brake or cancel needs no second fault there, so for SG-05 it is
      effectively single-point; the classification here is for SG-001 only'
    per_goal:
    - goal: SG-05
      violates_sg_directly: true
      reason: 'Authority wrongly kept after the brake or cancel needs no second fault (FTA BE-5.02, WP-H-03 §6.4)'
  - id: FMD-002
    mode: Frame content altered after the TX check (data-path fault)
    distribution: 0.05
    violates_sg_directly: true
    mpf_potential: false
    dfmea_ref: DFM-019
    safety_mechanism_spf: FMD-SM-004
    dc_spf: 0.6
    notes: 'Only the software-queue part is covered by the XOR; the FDCAN copy and message RAM are not (TSR-517). Also covers SG-04 (deceleration): 0x343 leaves through the same TX path as 0x2E4, so this row and its rates stand for FTA event BE-4.03 too (decision register DQ-002, 2026-10-14), and for SG-03 (unintended
      acceleration, FTA BE-3.04) by DQ-362 (2026-10-18)'
  - id: FMD-003
    mode: Hang or unexpected exception (no TX)
    distribution: 0.4
    violates_sg_directly: false
    mpf_potential: false
    dfmea_ref: DFM-004
    notes: 'Safe for SG-001: no LKA frames, the EPS times out (AOU-01). Relevant to SG-009. Not safe for SG-02/SG-06 (DQ-362): actuation
      stops, and the goal is violated if no warning follows; the warning comes from the host (controlsMismatch, TSR-621), not from the
      hung panda'
  - id: FMD-004
    mode: Other faults without effect on the safety path
    distribution: 0.3
    violates_sg_directly: false
    mpf_potential: false
  ref_des: U (STM32H725)
  rate_kind: generic
  stress_converted: false
- id: FMD-C-002
  rate_kind: generic
  stress_converted: false
  part: Embedded flash 1 MB (code and limit constants)
  dfmea_element: DFM-SE-002
  failure_rate_fit: 20
  failure_rate_source: Generic estimate, order of magnitude of handbook values (SN 29500 / IEC TR 62380 class) for this part type at the mission profile below; not
    looked up for the actual part. No BOM or supplier data available (WP-H-02 UK-02)
  safety_related: true
  failure_modes:
  - id: FMD-005
    mode: Single-bit error
    distribution: 0.8
    violates_sg_directly: false
    mpf_potential: true
    dfmea_ref: DFM-002
    safety_mechanism_lf: FMD-SM-001
    dc_lf: 0.99
    notes: Corrected by ECC; counted as multiple-point detected
  - id: FMD-006
    mode: Multi-bit error in limit constants or check code
    distribution: 0.1
    violates_sg_directly: false
    mpf_potential: true
    dfmea_ref: DFM-002
    safety_mechanism_lf: FMD-SM-003
    dc_lf: 0.9
    notes: Needs a SoC command outside the wrong limit; boot signature finds permanent faults at the next power-up
  - id: FMD-007
    mode: Multi-bit error elsewhere (crash, hang)
    distribution: 0.1
    violates_sg_directly: false
    mpf_potential: false
    dfmea_ref: DFM-002
- id: FMD-C-003
  rate_kind: generic
  stress_converted: false
  part: SRAM regions holding safety state, limits copy and CAN queues (about 64 KB of 564 KB; soft errors dominate)
  dfmea_element: DFM-SE-002
  failure_rate_fit: 100
  failure_rate_source: Generic estimate, order of magnitude of handbook values (SN 29500 / IEC TR 62380 class) for this part type at the mission profile below; not
    looked up for the actual part. No BOM or supplier data available (WP-H-02 UK-02)
  safety_related: true
  failure_modes:
  - id: FMD-008
    mode: Single-bit upset
    distribution: 0.9
    violates_sg_directly: false
    mpf_potential: true
    dfmea_ref: DFM-003
    safety_mechanism_lf: FMD-SM-002
    dc_lf: 0.99
    notes: Corrected by ECC
  - id: FMD-009
    mode: Multi-bit upset in authority or limit variables
    distribution: 0.04
    violates_sg_directly: false
    mpf_potential: true
    dfmea_ref: DFM-003
    notes: 'Needs a SoC command outside the envelope or while not engaged; double-error flag not handled (latent). Also stands for
      SG-05 (FTA BE-5.02, DQ-362): a corrupted controls_allowed that stays true after the brake is effectively single-point there;
      the classification here is for SG-001 only'
    per_goal:
    - goal: SG-05
      violates_sg_directly: true
      reason: 'A corrupted controls_allowed that stays true after the brake needs no second fault (FTA BE-5.02, WP-H-03 §6.4)'
  - id: FMD-010
    mode: Multi-bit upset in the TX queue after the check
    distribution: 0.02
    violates_sg_directly: true
    mpf_potential: false
    dfmea_ref: DFM-019
    safety_mechanism_spf: FMD-SM-004
    dc_spf: 0.6
    notes: Also covers SG-04 (deceleration), as FMD-002 (decision register DQ-002, 2026-10-14), and SG-03 (FTA BE-3.04, DQ-362)
  - id: FMD-011
    mode: 'Multi-bit upset elsewhere (stack, buffers: crash or dropped frame)'
    distribution: 0.04
    violates_sg_directly: false
    mpf_potential: false
    dfmea_ref: DFM-003
- id: FMD-C-004
  rate_kind: generic
  stress_converted: false
  part: 'Clock: 25 MHz HSE crystal and PLL'
  dfmea_element: DFM-SE-003
  failure_rate_fit: 10
  failure_rate_source: Generic estimate, order of magnitude of handbook values (SN 29500 / IEC TR 62380 class) for this part type at the mission profile below; not
    looked up for the actual part. No BOM or supplier data available (WP-H-02 UK-02)
  safety_related: true
  failure_modes:
  - id: FMD-012
    mode: Oscillation stops
    distribution: 0.5
    violates_sg_directly: false
    mpf_potential: true
    dfmea_ref: DFM-005
    safety_mechanism_lf: FMD-SM-005
    dc_lf: 0.99
    notes: CSS reset; no frames
  - id: FMD-013
    mode: Frequency drift (all timeouts and rate windows scale)
    distribution: 0.5
    violates_sg_directly: false
    mpf_potential: true
    dfmea_ref: DFM-005
    notes: Rate limits are per frame and the EPS has its own limits; violation needs a second fault. No cross-check (TSR-504)
- id: FMD-C-005
  rate_kind: generic
  stress_converted: false
  part: 'MCU supply: board regulator and STM32H7 internal SMPS/LDO'
  dfmea_element: DFM-SE-004
  failure_rate_fit: 15
  failure_rate_source: Generic estimate, order of magnitude of handbook values (SN 29500 / IEC TR 62380 class) for this part type at the mission profile below; not
    looked up for the actual part. No BOM or supplier data available (WP-H-02 UK-02)
  safety_related: true
  failure_modes:
  - id: FMD-014
    mode: Loss of supply
    distribution: 0.5
    violates_sg_directly: false
    mpf_potential: false
    dfmea_ref: DFM-007
    notes: 'MCU off, relay released. For SG-02/SG-06 (DQ-362) the loss itself is the hazard unless the host warns (FTA BE-2.07)'
  - id: FMD-015
    mode: Under-voltage in the brown-out zone or over-voltage (erratic logic)
    distribution: 0.3
    violates_sg_directly: true
    mpf_potential: false
    dfmea_ref: DFM-007
    notes: Undefined behaviour while running; BOR level not set and PVD not enabled at BL-002 (TSR-505)
  - id: FMD-016
    mode: Ripple or noise
    distribution: 0.2
    violates_sg_directly: false
    mpf_potential: true
    dfmea_ref: DFM-007
- id: FMD-C-006
  rate_kind: generic
  stress_converted: false
  part: Car-side CAN transceiver XCVR1
  dfmea_element: DFM-SE-005
  failure_rate_fit: 10
  failure_rate_source: Generic estimate, order of magnitude of handbook values (SN 29500 / IEC TR 62380 class) for this part type at the mission profile below; not
    looked up for the actual part. No BOM or supplier data available (WP-H-02 UK-02)
  safety_related: true
  failure_modes:
  - id: FMD-017
    mode: TX stuck dominant
    distribution: 0.3
    violates_sg_directly: false
    mpf_potential: false
    dfmea_ref: DFM-008
    notes: 'Bus blocked: no LKA torque; SG-003 effect, not SG-001. For SG-02/SG-06 (DQ-362): actuation lost, warning from the host (FTA BE-2.06)'
  - id: FMD-018
    mode: RX open or stuck recessive
    distribution: 0.3
    violates_sg_directly: false
    mpf_potential: false
    dfmea_ref: DFM-009
    notes: 'RX timeout withdraws authority. For SG-02/SG-06 (DQ-362): actuation lost, warning from the host (FTA BE-6.02)'
  - id: FMD-019
    mode: Bit errors on the line
    distribution: 0.4
    violates_sg_directly: false
    mpf_potential: true
    safety_mechanism_lf: FMD-SM-008
    dc_lf: 0.99
