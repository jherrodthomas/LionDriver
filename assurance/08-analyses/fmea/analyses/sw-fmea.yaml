      test: openpilot/selfdrive/selfdrived/tests/test_vehicle_dtc_entry.py
    occurrence: 5
    detection: 4
    ap: H
    actions:
    - SWF-ACT-080
  safety_mechanisms:
  - description: The driver's warning-lamp check before driving (TSR-811, OPS-01, AOU-09, AOU-10), the only check for engine, camera and radar codes
  - description: Live fault signals while driving (EPS status 0x262 and the steering-fault events, TSR-110 envelope refusal; espDisabled, accFaulted)
    ref: openpilot/selfdrive/car/car_events.py
  notes: 'New at BL-007 (rev 1.9; change record startup-fault-code-read OI-3). A read sent while moving is not a failure mode here: the read runs only in the
    firmware-query window, where pandad holds the panda in ELM327 (no actuation), after 20 standstill samples, and the Toyota safety mode does not pass 0x7a1 or
