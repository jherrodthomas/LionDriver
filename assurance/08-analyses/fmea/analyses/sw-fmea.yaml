actions:
- id: SWF-ACT-001
  kind: detection
  description: Run the opendbc safety suite and the mutation tests as a blocking gate in LionDriver CI for every change and submodule bump
  owner: Jherrod Thomas
  status: completed
  evidence: '.github/workflows/safety.yaml (CR-CI-05, merged from liondriver-dev): safety tests with 100% line coverage, MISRA and mutation jobs on push and pull
    request. Branch protection making them blocking is not verified here'
  revised:
    severity: 10
    occurrence: 5
    detection: 3
    ap: H
- id: SWF-ACT-002
  kind: prevention
  description: Requirements-based tests for the panda safety model, traced to the draft TSRs and SWSRs (assurance WP-S-02, WP-W-02); the requirements exist as drafts,
    the tests do not
  owner: Jherrod Thomas
  status: open
  revised:
    severity: 10
    occurrence: 3
    detection: 3
    ap: L
- id: SWF-ACT-003
  kind: design_change
  description: Derive steering and acceleration envelopes from vehicle measurements (FSC FOI-001, DFA DM-10) and set panda limits from them, independently of the
    SoC limits
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-004
  kind: design_change
  description: Implement the panda configuration lock (LD-DES-001 DR-01..DR-07, DR-05 for ELM327)
  owner: Jherrod Thomas
  status: in_progress
  evidence: 'Implemented for the reference build in panda#4 (9f60e17); D-12 decided. The reference build is the default since #36/#41 (SWF-ACT-009 completed). DR-05
    (ELM327 refused after the car mode until ignition off) in panda#16 (a55bdfc). Open: the remaining LD-DES-001 requirements (firmware authenticity), HIL test
    test_11_reference_lock not run (D-04)'
- id: SWF-ACT-005
  kind: design_change
  description: Add an acceleration-rate (jerk) check to the panda longitudinal checks, or justify the absence with characterized powertrain rate limits (OI-002)
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-006
  kind: detection
  description: Verify on the vehicle that the PCM cancels cruise on brake (FSC FOI-006) so PCM_CRUISE can be credited as the diverse brake path; add a safety test
    for brake-without-cruise-cancel
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-007
  kind: design_change
  description: Derive RX-lag and heartbeat timeouts from the FTTI and check them at 8 Hz or faster while controls are allowed (LD-DES-001 DR-20)
  owner: Jherrod Thomas
  status: in_progress
  evidence: 'RX lag: 5 periods at 100 Hz (opendbc#1, panda#3). Heartbeat loss: 0.3 s at 100 Hz (panda#7, BL-003). BL-005: actuation frames supervised for arrival,
    50 ms STEERING_LKA and 100 ms ACC_CONTROL (TSR-408, opendbc#11, reference build by default), which bounds a control-loop stall behind a live heartbeat
    (SWF-014.C2 AP L). BL-007: the engaged mismatch revokes 0.3 s after the first not-engaged heartbeat in the reference build (panda f4803c5, TSR-307(a),
    SWF-014.C3). FTTI derivation and confirmation of the timeouts on reference logs open'
