structure:
- id: SWF-SE-001
  name: Panda safety model (opendbc safety + panda firmware integration)
  kind: sw_element
  parent: null
  sotif:
    boundary: functional_safety
  paths:
  - opendbc_repo/opendbc/safety
  - panda/board
  description: FSC element EL-07 software; System FMEA SFM-SE-003
- id: SWF-SE-002
  name: RX validation and RX timing checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: rx_msg_safety_check, is_msg_valid, safety_tick (safety.h:112-228, 321-344)
- id: SWF-SE-003
  name: TX whitelist and dispatch
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: safety_tx_hook, tx_msg_safety_check (safety.h:230-253)
- id: SWF-SE-004
  name: Forwarding hook
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: safety_fwd_hook, get_fwd_bus (safety.h:255-289)
- id: SWF-SE-005
  name: Controls-allowed logic
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: generic_rx_checks, pcm_cruise_check (safety.h:350-370, 518-527)
- id: SWF-SE-006
  name: Steering torque checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/lateral.h
  description: steer_torque_cmd_checks, dist_to_meas_check, rt_torque_rate_limit_check (lateral.h:10-150)
- id: SWF-SE-007
  name: Longitudinal checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/longitudinal.h
  description: get_longitudinal_allowed, longitudinal_accel_checks (longitudinal.h:3-12)
- id: SWF-SE-008
  name: Toyota safety mode
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/modes/toyota.h
  description: toyota_rx_hook, toyota_tx_hook, toyota_init, TX/RX check tables (toyota.h)
- id: SWF-SE-009
  name: Relay malfunction detection
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: stock_ecu_check, relay_malfunction (safety.h:346, 372-385)
- id: SWF-SE-010
  name: Safety mode registry and initialization
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: set_safety_hooks (safety.h:391-484)
- id: SWF-SE-011
  name: 'Panda main loop: safety mode and heartbeat'
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/main.c
  - panda/board/drivers/engaged_mismatch.h
  - panda/board/drivers/heartbeat_siren.h
  description: set_safety_mode, tick_handler heartbeat and mismatch logic (main.c:31-76, 101-230); since BL-007 the 0.3 s engaged-mismatch check
    (engaged_mismatch.h) and the siren starts (heartbeat_siren.h), reference build
- id: SWF-SE-012
  name: Panda host command handler
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/main_comms.h
  description: 0xdc set safety mode, 0xdf alternative experience, 0xd1 bootloader, 0xf3 heartbeat (main_comms.h)
- id: SWF-SE-013
  name: Panda CAN send path
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/drivers/can_common.h
  - panda/board/can_comms.h
  description: can_send with skip_tx_hook (can_common.h:161-176); host TX entry (can_comms.h:97,118)
- id: SWF-SE-014
  name: Panda hardware watchdog and 100 Hz safety task
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/drivers/hw_watchdog.h
  - panda/board/main.c
  description: 'IWDG start on first relay drive, window-mode feed from the safety task only after main-loop progress (hw_watchdog.h; main.c safety_task_handler);
    added in BL-002 (panda#1, #3)'
- id: SWF-SE-020
  name: pandad (panda daemon and SoC-panda link)
  kind: sw_element
  parent: null
  sotif:
    boundary: functional_safety
  paths:
  - openpilot/selfdrive/pandad
  description: FSC element EL-06 (QM); System FMEA SFM-SE-017. C++ daemon pandad (main.cc, pandad.cc, panda_safety.cc, panda.cc, spi.cc) started by the Python
    launcher and firmware flasher pandad.py. One internal panda over SPI only (pandad.py:96, pandad.cc:463-469).
- id: SWF-SE-021
  name: Main loop and heartbeat
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/pandad.cc
  - openpilot/selfdrive/pandad/main.cc
  description: 'pandad_run 100 Hz loop (pandad.cc:397-459). engaged = selfdriveState alive, valid and enabled, evaluated at 10 Hz (pandad.cc:421-430). The heartbeat
    0xf3 is sent at the end of process_panda_state (pandad.cc:298-314, panda.cc:137-139). On exit the panda is set to NO_OUTPUT only if onroad and not engaged (pandad.cc:451-456).
    RT priority 54 on core 3 (main.cc:107-113)'
- id: SWF-SE-022
  name: Safety mode setter
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/panda_safety.cc
  - openpilot/selfdrive/pandad/pandad.cc
  description: 'PandaSafety::configureSafetyMode (panda_safety.cc:5-70). Onroad: ELM327 param 1, then the OBD multiplexing toggle, then (after FirmwareQueryDone and
    ControlsReady) alternative experience 0xdf and safety_configs[0] model/param 0xdc, once per onroad session. NO_OUTPUT when the panda is in SILENT or when
    offroad or ignition is off (pandad.cc:229-243)'
- id: SWF-SE-023
  name: sendcan forwarding thread
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/pandad.cc
  - openpilot/selfdrive/pandad/panda.cc
  - openpilot/selfdrive/pandad/pandad_api_impl.py
  description: 'can_send_thread (pandad.cc:59-87): FIFO subscriber on sendcan (non-conflated, MEDIUM queue). Frames are dropped if logMonoTime is 1 s or more old. Then
    pack_can_buffer/can_send (panda.cc:168-214). The sendcan timestamp is set by can_list_to_can_capnp (pandad_api_impl.py:42)'
- id: SWF-SE-024
  name: CAN RX and panda state publishing
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/pandad.cc
  - openpilot/selfdrive/pandad/panda.cc
  description: 'can_recv (pandad.cc:89-106) and can_receive/unpack_can_buffer (panda.cc:216-282) publish can at 100 Hz, with no per-frame RX time. send_panda_states
    (pandad.cc:170-272) and fill_panda_state (pandad.cc:108-140) publish pandaStates at 10 Hz: mode, param, controlsAllowed, safetyRxChecksInvalid, faults, heartbeatLost,
    watchdogReset, epsFault, txRateExceeded'
- id: SWF-SE-025
  name: SPI transport
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/spi.cc
  - openpilot/selfdrive/pandad/panda_comms.h
  description: 'PandaSpiHandle: header/data/ACK protocol with 8-bit XOR checksums (spi.cc:189-202, 313-408) and a retry loop (spi.cc:205-239). Control transfers use
    TIMEOUT 0 (panda_comms.h:10). connected and comms_healthy flags (panda_comms.h:17-18)'
- id: SWF-SE-026
  name: Launcher and firmware check
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/pandad.py
  - openpilot/selfdrive/pandad/panda.cc
  description: 'pandad.py main loop: resets or DFU-recovers the internal panda before each start, flashes when the signature differs from panda/board/obj, then runs ./pandad
    (pandad.py:54-111). The C++ up_to_date check in connect() (panda.cc:116-127, pandad.cc:52-54)'
- id: SWF-SE-030
  name: selfdrived (engagement supervision)
  kind: sw_element
  parent: null
  sotif:
    boundary: functional_safety
  paths:
  - openpilot/selfdrive/selfdrived
  description: FSC element EL-04 supervision (capability QM); System FMEA SFM-SE-014. Driver monitoring (dmonitoringd, SFM-SE-015) out of scope except the events selfdrived raises from driverMonitoringState
- id: SWF-SE-031
  name: Engagement state machine
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/state.py
  description: StateMachine.update (state.py:17-97); SOFT_DISABLE_TIME 3 s, ACTIVE_STATES / ENABLED_STATES (state.py:7-9)
- id: SWF-SE-032
  name: Input sampling and event generation
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/selfdrived.py
  description: 'data_sample (selfdrived.py:476-541: carState socket, SubMaster update, initialization, panda mismatch counter); update_events (selfdrived.py:158-474:
    car events, panda checks, process/message supervision, cruise mismatch)'
- id: SWF-SE-033
  name: Event catalogue and reaction mapping
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/events.py
  description: EVENTS dict mapping each event to ET reaction types and alerts (events.py:387-1021); Events container (events.py:52-108); alert classes (events.py:111-209)
- id: SWF-SE-034
  name: Alert manager
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/alertmanager.py
  - openpilot/selfdrive/selfdrived/selfdrived.py
  description: AlertManager.add_many / process_alerts, priority then start-frame selection (alertmanager.py:43-67); update_alerts (selfdrived.py:543-554)
- id: SWF-SE-035
  name: Excessive actuation check
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/helpers.py
  - openpilot/selfdrive/selfdrived/selfdrived.py
  description: ExcessiveActuationCheck.update (helpers.py:26-55); latch via Offroad_ExcessiveActuation and excessiveActuation event (selfdrived.py:302-316)
- id: SWF-SE-036
  name: selfdriveState publication and main loop
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/selfdrived.py
  description: 'publish_selfdriveState (selfdrived.py:556-584), step and run loop (selfdrived.py:586-616). Consumers: controlsd latActive/longActive (controlsd.py:96-102),
    pandad heartbeat engaged (pandad.cc:424), ui and soundd alerts'
- id: SWF-SE-040
  name: Control (controlsd, lateral/longitudinal controllers, Toyota CarController hand-off)
  kind: sw_element
  parent: null
  sotif:
    boundary: split
    sotif_part: 'Whether lateral and longitudinal control perform well enough for the road, e.g. curves beyond the lateral limit (EPS authority, curvature limits)'
    ref: WP-C-05 SH-02
  paths:
  - openpilot/selfdrive/controls/controlsd.py
  - openpilot/selfdrive/controls/lib
  - openpilot/selfdrive/car/card.py
  - opendbc_repo/opendbc/car/toyota/carcontroller.py
  description: FSC element EL-03 driving software (control part); System FMEA SFM-SE-013. QM, upstream openpilot code
- id: SWF-SE-041
  name: controlsd main loop, input handling and actuator gating
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - openpilot/selfdrive/controls/controlsd.py
  description: 'SubMaster polled on selfdriveState (41-43, 66); latActive/longActive (99-102); curvature source selection (123-127); non-finite
    sanitiser (139-147); cruise cancel/resume (161-163); steer_limited_by_safety (179-185); carControl publish (221-225); 100 Hz loop (227-233)'
- id: SWF-SE-042
  name: Lateral torque controller
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - openpilot/selfdrive/controls/lib/latcontrol_torque.py
  - openpilot/selfdrive/controls/lib/latcontrol.py
  - openpilot/common/pid.py
  description: LatControlTorque.update (88-137), torque parameter update (78-86), base reset/saturation (latcontrol.py:19-29), PID with
    anti-windup (pid.py:42-59)
- id: SWF-SE-043
  name: Longitudinal controller
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - openpilot/selfdrive/controls/lib/longcontrol.py
  description: long_control_state_trans (13-36), LongControl.update (49-74). Toyota has kp=0 and ki=0 (interfaces.py:212-214), so the
    output is longitudinalPlan.aTarget clipped to [-3.5, +2.0] m/s² (toyota/interface.py:21-22)
- id: SWF-SE-044
  name: Curvature limiter
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - openpilot/selfdrive/controls/lib/drive_helpers.py
  description: clip_curvature (28-42) with 5 m/s³ lateral jerk, 3.0 m/s² + roll lateral acceleration and 0.2 1/m (9-14)
- id: SWF-SE-045
  name: Toyota CarController
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - opendbc_repo/opendbc/car/toyota/carcontroller.py
  - opendbc_repo/opendbc/car/lateral.py
  description: 'Torque limits (carcontroller.py:105-113; lateral.py:93-118, 174-195), ACC_CONTROL with its own PID and pitch compensation
    (carcontroller.py:174-265), cancel (253). Limits: STEER_MAX 1500, error 350, up 15 / down 25 per frame, accel [-3.5, 2.0] (values.py:20-47)'
- id: SWF-SE-046
  name: card actuation hand-off
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - openpilot/selfdrive/car/card.py
  description: controls_update sends CarController output on every CAN cycle while carControl is alive (card.py:224-240)
- id: SWF-SE-050
  name: Car interface (card and the opendbc Toyota port, CAN parse and pack)
  kind: sw_element
  parent: null
  sotif:
    boundary: functional_safety
  paths:
  - openpilot/selfdrive/car/card.py
  - opendbc_repo/opendbc/car/toyota
  - opendbc_repo/opendbc/can
  description: FSC element EL-03 (car interface) and EL-01 interface; System FMEA SFM-SE-016. P2, rated at BL-005. Upstream openpilot/opendbc code; LionDriver
    added only the stock AEB interlock (CA-001). The CarController hand-off is rated under SWF-SE-045/046
- id: SWF-SE-051
  name: CAN parser and Toyota carState
  kind: sw_unit
  parent: SWF-SE-050
  paths:
  - opendbc_repo/opendbc/can/parser.py
  - opendbc_repo/opendbc/car/toyota/carstate.py
  description: 'Lazy message registration and learned timeouts (parser.py:77-81, 102-110, 141-173); canValid debounce (184-199); Toyota signal map
    (carstate.py:59-167); canValid/canTimeout (car/interfaces.py:239-240)'
- id: SWF-SE-052
  name: Fingerprinting and CarParams
  kind: sw_unit
  parent: SWF-SE-050
  paths:
  - opendbc_repo/opendbc/car/car_helpers.py
  - opendbc_repo/opendbc/car/fw_versions.py
  - opendbc_repo/opendbc/car/toyota/interface.py
  - opendbc_repo/opendbc/car/toyota/values.py
  description: FW-only Toyota fingerprint, exact then fuzzy match (fw_versions.py:146-170, values.py:449-480); CarParams for TOYOTA_COROLLA_TSS2 (interface.py:28-118)
- id: SWF-SE-053
  name: CAN packer and Toyota message construction
  kind: sw_unit
  parent: SWF-SE-050
  paths:
  - opendbc_repo/opendbc/can/packer.py
  - opendbc_repo/opendbc/car/toyota/toyotacan.py
  description: Signal scaling and masking (packer.py:24-40, 62); STEERING_LKA, ACC_CONTROL, LKAS_HUD construction (toyotacan.py:52, 113, 158-166)
- id: SWF-SE-054
  name: card main loop and stock AEB interlock
  kind: sw_unit
  parent: SWF-SE-050
  paths:
  - openpilot/selfdrive/car/card.py
  - openpilot/selfdrive/car/stock_aeb_interlock.py
  - openpilot/selfdrive/car/car_events.py
  - openpilot/selfdrive/car/vehicle_dtc.py
  description: CAN-paced 100 Hz loop (card.py:169-189, 274-288); carState publication (205-233); interlock (stock_aeb_interlock.py:23-53, card.py:86-124); car events
    from carState, including the EPS-fault warnings (car_events.py:162-177 at BL-005); since BL-007 the start-up fault-code read (vehicle_dtc.py,
    card.py Car.__init__)
- id: SWF-SE-060
  name: Driver monitoring (dmonitoringmodeld, dmonitoringd)
  kind: sw_element
  parent: null
  sotif:
    boundary: split
    sotif_part: 'Detection performance of the driver-monitoring model (sunglasses, glare, face out of view) and whether the policy thresholds suit the driver'
    ref: WP-C-05 SH-12
  paths:
  - openpilot/selfdrive/monitoring
  - openpilot/selfdrive/modeld/dmonitoringmodeld.py
  description: FSC element EL-04 (driver monitoring, FSR-039/040); System FMEA SFM-SE-015. P2, rated at BL-005. Upstream code, no LionDriver change. The model's
    detection performance is a SOTIF / ISO PAS 8800 topic and is not rated here
- id: SWF-SE-061
  name: Driver-monitoring model process
  kind: sw_unit
  parent: SWF-SE-060
  paths:
  - openpilot/selfdrive/modeld/dmonitoringmodeld.py
  description: Loads the tinygrad DM model (22-48), runs it on the cabin camera stream (115-150), publishes driverStateV2 with valid=True (99)
- id: SWF-SE-062
  name: Monitoring policy and dmonitoringd
  kind: sw_unit
  parent: SWF-SE-060
  paths:
  - openpilot/selfdrive/monitoring/policy.py
  - openpilot/selfdrive/monitoring/dmonitoringd.py
  description: Awareness timers, distraction decision, wheel-touch fallback, terminal and lockout (policy.py:29-52, 226-456); loop gated on driverStateV2 (dmonitoringd.py:13-44)
- id: SWF-SE-070
  name: Longitudinal planning (plannerd)
  kind: sw_element
  parent: null
  sotif:
    boundary: split
    sotif_part: 'Whether the plan is adequate for the scene: following distance, deceleration limit, cut-ins, traffic control in Experimental mode'
    ref: WP-C-05 SH-03, SH-06, SH-09
  paths:
  - openpilot/selfdrive/controls/plannerd.py
  - openpilot/selfdrive/controls/lib/longitudinal_planner.py
  - openpilot/selfdrive/controls/lib/longitudinal_mpc_lib
  description: FSC element EL-03 (planning, FSR-020/023/026); System FMEA SFM-SE-012. P2, rated at BL-005. Upstream code; LionDriver changed only the defaults
    (ExperimentalMode off, DQ-001; relaxed personality, CA-011). Planning adequacy (gaps, comfort) is a SOTIF topic
- id: SWF-SE-071
  name: Longitudinal planner and MPC
  kind: sw_unit
  parent: SWF-SE-070
  paths:
  - openpilot/selfdrive/controls/lib/longitudinal_planner.py
  - openpilot/selfdrive/controls/lib/longitudinal_mpc_lib/long_mpc.py
  description: Candidates and final clip (longitudinal_planner.py:90-161); MPC bounds, costs, failure reset (long_mpc.py:60-79, 203, 221-242, 294-369)
- id: SWF-SE-072
  name: Forward collision warning decision
  kind: sw_unit
  parent: SWF-SE-070
  paths:
  - openpilot/selfdrive/controls/lib/longitudinal_planner.py
  - openpilot/selfdrive/controls/lib/longitudinal_mpc_lib/long_mpc.py
  description: crash_cnt (long_mpc.py:338-342) and fcw (longitudinal_planner.py:121); fcw event in selfdrived (selfdrived.py:489-493)
- id: SWF-SE-080
  name: Lead estimation (radard and the Toyota radar interface)
  kind: sw_element
  parent: null
  sotif:
    boundary: split
    sotif_part: 'Radar and vision perception performance: false targets, stationary objects, lead association'
    ref: WP-C-05 SH-03, SH-04, SH-06
  paths:
  - openpilot/selfdrive/controls/radard.py
  - opendbc_repo/opendbc/car/toyota/radar_interface.py
  description: FSC element EL-03 (lead state, FSR-020/026); System FMEA SFM-SE-012. P2, rated at BL-005. The Corolla TSS2 provides radar tracks (radarUnavailable
    false, toyota/interface.py:91), fused with model leads. Upstream code. Perception performance (ghost targets, missed objects) is a SOTIF topic
- id: SWF-SE-081
  name: Lead selection and radar/vision fusion
  kind: sw_unit
  parent: SWF-SE-080
  paths:
  - openpilot/selfdrive/controls/radard.py
  description: Track matching and sanity checks (radard.py:113-157), vision-only lead (136-150), low-speed override (98-101, 167-174), Kalman filter (33), radarState validity (222-248)
- id: SWF-SE-090
  name: Driving model process (modeld)
  kind: sw_element
  parent: null
  sotif:
    boundary: split
    sotif_part: 'Whether the path, curvature and leads are right for correct inputs (driving-model performance)'
    ref: WP-C-05 SH-01, SH-03, SH-04, SH-06; WP-C-11
  paths:
  - openpilot/selfdrive/modeld
  description: FSC element EL-03 (perception); System FMEA SFM-SE-010. P3, rated at BL-005 as a software element only (crash, stale or non-finite output, frame
    handling, model file). Model performance limitations are SOTIF / ISO PAS 8800 and are not rated here (fmea-plan §7.3). Upstream code, no LionDriver change
- id: SWF-SE-091
  name: Model execution, output parsing and validity
