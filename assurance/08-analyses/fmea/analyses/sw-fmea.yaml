    ref: opendbc_repo/opendbc/safety/safety.h
- id: SWF-011
  element: SWF-SE-004
  function: SWF-FN-007
  failure_mode: Stock pre-collision (AEB) messages blocked
  guideword: omission
  effects:
  - level: local
    description: PRE_COLLISION 0x283 / 0x344 from the stock camera do not reach the vehicle
  - level: next_higher
    description: Stock AEB cannot act
  - level: end
    description: Loss of stock AEB
    hazard: HZ-011
    severity: 10
  severity: 10
  causes:
  - id: SWF-011.C1
    description: TX table change marks 0x283/0x344 check_relay, or a forwarding defect; at BL-001 both are check_relay=false and forwarded (toyota.h:22-23)
    element: SWF-SE-004
    prevention_controls: *id001
    detection_controls: *id002
    occurrence: 5
    detection: 3
    ap: H
    actions:
    - SWF-ACT-002
  notes: 'Partial answer to HARA OI-003: the panda does not block stock pre-collision messages from the camera. BL-002 removes 0x344 and the DSU messages from the
    TX whitelist (TSR-705, opendbc#2), so the SoC can no longer send them; 0x283 is allowed with a zero payload only. Forwarding is unchanged. In-vehicle confirmation
    of stock AEB is still needed.'
  safety_mechanisms:
  - description: Only messages the item replaces are blocked; 0x283/0x344 are forwarded
    ref: opendbc_repo/opendbc/safety/safety.h
- id: SWF-012
  element: SWF-SE-009
  function: SWF-FN-008
  failure_mode: Relay malfunction not detected
  guideword: omission
  effects:
  - level: local
    description: Stock camera stays on the bus while the item transmits
  - level: next_higher
    description: Conflicting steering commands
  - level: end
    description: Erratic or excessive steering
    hazard: HZ-002
    severity: 10
  severity: 10
  causes:
  - id: SWF-012.C1
    description: Defect in stock_ecu_check, or a replaced message without check_relay; detection starts 1 s after a mode change (safety.h:372-380)
    element: SWF-SE-009
    prevention_controls: *id001
    detection_controls: *id002
    occurrence: 5
    detection: 3
    ap: H
    actions:
    - SWF-ACT-002
  safety_mechanisms:
  - description: Relay malfunction detection blocks all TX after a stock message appears on the car side
    ref: opendbc_repo/opendbc/safety/safety.h
- id: SWF-013
  element: SWF-SE-012
  function: SWF-FN-011
  failure_mode: Wrong or permissive safety mode accepted from the host
  guideword: wrong_mode
  effects:
  - level: local
    description: Panda enforces a different model or none (ALLOUTPUT)
  - level: next_higher
    description: Item messages unchecked or checked against wrong limits
  - level: end
    description: Any actuation hazard
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-005
    hazard: HZ-005
    severity: 10
  - level: end
    description: Contributes to HZ-006
    hazard: HZ-006
    severity: 10
  severity: 10
  causes:
  - id: SWF-013.C1
    description: Defect in the reference-build allow-list for 0xdc/0xdf and the car-mode request gate
    element: SWF-SE-012
    prevention_controls:
    - description: 'Reference-build lock: 0xdc accepts TOYOTA only with parameter 73 (no flags) and, once TOYOTA is active, only NOOUTPUT or SILENT; 0xdf refused
        (reference_lock.h, panda#4, TSR-512/513). Effective only in a LIONDRIVER_REFERENCE build, see SWF-013.C2'
      ref: panda/board/reference_lock.h
    detection_controls: *id003
    occurrence: 3
    detection: 4
    ap: L
    actions:
    - SWF-ACT-004
  - id: SWF-013.C2
    description: 'Firmware built without LIONDRIVER_REFERENCE: no build path sets it (openpilot panda build, release procedure), so set_safety_mode accepts any mode
      and parameter and debug builds include SAFETY_ALLOUTPUT'
    element: SWF-SE-012
    prevention_controls:
    - description: Lock is opt-in at build time (panda/SConscript:21-26); release procedure not yet defined (IA mode lock OI-2)
      ref: panda/SConscript
    detection_controls:
    - description: No test targets this cause
    occurrence: 8
    detection: 9
    ap: H
    actions:
    - SWF-ACT-009
  safety_mechanisms:
  - description: Reference-build mode and parameter lock (panda#4); SoC cross-checks the panda mode after 10 s (QM)
    ref: panda/board/reference_lock.h
- id: SWF-014
  element: SWF-SE-011
  function: SWF-FN-010
  failure_mode: Controls withdrawn later than the FTTI after host loss
  guideword: late
  effects:
  - level: local
    description: controls_allowed persists several seconds without a valid heartbeat
  - level: next_higher
    description: Last SoC messages can keep passing if still sent
  - level: end
    description: Continued actuation without a supervising SoC
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-005
    hazard: HZ-005
    severity: 10
  severity: 10
  causes:
  - id: SWF-014.C1
    description: 'Heartbeat from pandad missing (pandad, SPI or SoC down): authority revoked after 0.3 s, checked at 100 Hz (TSR-407, panda#7)'
    element: SWF-SE-011
    prevention_controls:
    - description: 'heartbeat_monitor: no 0xf3 for > 0.3 s in a car mode clears controls_allowed (panda c2e5d93); SILENT after 5 s unchanged (TSR-510)'
      ref: panda/board/drivers/heartbeat_monitor.h
    detection_controls:
    - description: Host unit test of the heartbeat monitor in panda CI (test.sh); HITL RX/heartbeat test not run (no bench, D-04)
      test: panda/tests/heartbeat_monitor/test_heartbeat_monitor.py
    occurrence: 3
    detection: 4
    ap: L
    actions:
    - SWF-ACT-007
  - id: SWF-014.C2
    description: 'controlsd or selfdrived stalls while pandad keeps sending heartbeats with engaged=1: the heartbeat shows pandad liveness only; authority is withdrawn
      only by the engaged-mismatch counter after 3 ticks at 1 Hz (about 3 s), and only if engaged drops'
    element: SWF-SE-011
    prevention_controls:
    - description: Heartbeat carries no freshness of the control loop (TSR-307a asks for 0.3 s on mismatch; TSR-408/409 for command freshness)
      ref: panda/board/main.c
    detection_controls:
    - description: Panda HITL health and safety tests (hardware needed; not run here)
      test: panda/tests/hitl/test_2_health.py
    occurrence: 8
    detection: 8
    ap: H
    actions:
    - SWF-ACT-007
  safety_mechanisms:
  - description: 'Heartbeat loss: authority revoked after 0.3 s (TSR-407); SILENT after 5 s; engaged mismatch after about 3 s; siren for 3 s if engaged'
    ref: panda/board/main.c
- id: SWF-015
  element: SWF-SE-012
  function: SWF-FN-011
  failure_mode: Diagnostic (ELM327) mode accepted while driving
  guideword: wrong_mode
  effects:
  - level: local
    description: Diagnostic frames allowed to vehicle ECUs
  - level: next_higher
    description: ECU reset or diagnostic session on EPS/ADAS
  - level: end
    description: Loss of assist or stock function while driving
    hazard: HZ-004
    severity: 10
  - level: end
    description: Contributes to HZ-011
    hazard: HZ-011
    severity: 10
  severity: 10
  causes:
  - id: SWF-015.C1
    description: ELM327 TX hook allows any ISO 15765 diagnostic frame with no service, ignition or motion condition. In a reference build ELM327 can no longer be
      selected while TOYOTA is active, but before engagement (fingerprinting, radar disable) the content is unrestricted
    element: SWF-SE-008
    prevention_controls:
    - description: No vehicle-state or service condition (elm327.h:6-35); reference lock limits the phase only
      ref: opendbc_repo/opendbc/safety/modes/elm327.h
    detection_controls:
    - description: No test targets this cause
    occurrence: 5
    detection: 9
    ap: H
    actions:
    - SWF-ACT-010
  safety_mechanisms:
  - description: None for frame content; the reference lock only blocks ELM327 while TOYOTA is active
    ref: panda/board/reference_lock.h
- id: SWF-016
  element: SWF-SE-013
  function: SWF-FN-012
  failure_mode: Host transmission bypasses the safety check
  guideword: omission
  effects:
  - level: local
    description: Host message sent without safety_tx_hook
  - level: next_higher
    description: Unchecked message on the bus
  - level: end
    description: Any actuation hazard
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-005
    hazard: HZ-005
    severity: 10
  severity: 10
  causes:
  - id: SWF-016.C1
    description: A host TX path calls can_send with skip_tx_hook=true
    element: SWF-SE-013
    prevention_controls:
    - description: Both host TX entries pass skip_tx_hook=false (can_comms.h:97,118); only forwarding and the body use skip=true
      ref: panda/board/can_comms.h
    - description: MISRA C checks on panda firmware
      ref: panda/tests/misra
    - description: Upstream code review; no coverage gate on panda board code
    detection_controls:
    - description: Panda HITL safety tests (hardware needed; not run here)
      test: panda/tests/hitl/test_6_safety.py
    occurrence: 3
    detection: 8
    ap: H
    actions:
    - SWF-ACT-008
  safety_mechanisms:
  - description: None at run time; correctness of the two host TX entries by inspection
    ref: panda/board/can_comms.h
- id: SWF-017
  element: SWF-SE-007
  function: SWF-FN-003
  failure_mode: Item deceleration passed while the driver presses the accelerator
  guideword: commission
  effects:
  - level: local
    description: Braking request passes during accelerator override
  - level: next_higher
    description: Item brakes against the driver
  - level: end
    description: Braking against driver input
    hazard: HZ-006
    severity: 10
  severity: 10
  causes:
  - id: SWF-017.C1
    description: Defect in get_longitudinal_allowed (controls_allowed && !gas_pressed_prev) or GAS_RELEASED decoding (0x1D2 bit 4)
    element: SWF-SE-007
    prevention_controls: *id001
    detection_controls: *id002
    occurrence: 5
    detection: 3
    ap: H
    actions:
    - SWF-ACT-002
  notes: 'FSC FSR-024 is verified in code at BL-001: only the inactive acceleration passes while the accelerator is pressed.'
  safety_mechanisms:
  - description: Non-inactive acceleration refused while the accelerator is pressed (get_longitudinal_allowed)
    ref: opendbc_repo/opendbc/safety/longitudinal.h
- id: SWF-018
  element: SWF-SE-014
  function: SWF-FN-013
  failure_mode: Safety checks stop running while the relay is driven
  guideword: omission
  effects:
  - level: local
    description: RX timeout, heartbeat and TX checks no longer evaluated; relay held energised
  - level: next_higher
    description: Stale authority kept; stock camera path stays cut
  - level: end
    description: Continued actuation without supervision; stock AEB unavailable
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-011
    hazard: HZ-011
    severity: 10
  severity: 10
  causes:
  - id: SWF-018.C1
    description: Main loop or safety task hangs or is starved (defect, interrupt storm, peripheral lock-up) after the relay has been driven
    element: SWF-SE-014
    prevention_controls:
    - description: 'IWDG from LSI, 90 ms nominal timeout, window mode (5 ms closed), fed only from the 100 Hz safety task after main-loop progress; started on every
        path that drives the relay (TSR-501/502, HWSR-501b, panda#1, #3). A reset floats the relay GPIO'
      ref: panda/board/drivers/hw_watchdog.h
    detection_controls:
    - *id004
    - &id005
      description: HIL test of the watchdog with injected hangs (FAULT_INJECTION debug build); not run, no HIL bench yet (D-04)
      test: panda/tests/hitl/test_10_hw_watchdog.py
    occurrence: 4
    detection: 7
    ap: H
    actions:
    - SWF-ACT-011
  notes: New in BL-002. Before BL-002 a hang left the relay driven with no reset (assurance GAP-43).
  safety_mechanisms:
  - description: IWDG window watchdog resets the MCU within about 90 ms; reset releases the relay
    ref: panda/board/drivers/hw_watchdog.h
- id: SWF-019
  element: SWF-SE-014
  function: SWF-FN-013
  failure_mode: Spurious MCU reset while engaged
  guideword: commission
  effects:
  - level: local
    description: Panda resets and restarts in SILENT; relay drops
  - level: next_higher
    description: Item steering and ACC end abruptly; stock camera path returns
  - level: end
    description: Loss of lateral and longitudinal control without the item's own handback warning
    hazard: HZ-004
    severity: 10
  - level: end
    description: Contributes to HZ-012
    hazard: HZ-012
    severity: 10
  severity: 10
  causes:
  - id: SWF-019.C1
    description: LSI frequency outside the range assumed for the 5 ms closed window and the 90 ms timeout, or safety-task jitter, makes a normal feed early or late
    element: SWF-SE-014
    prevention_controls:
    - description: Timing chosen with margin at nominal f_LSI = 32 kHz; the LSI range is still to be confirmed from the STM32H725 datasheet (IA watchdog open item)
      ref: panda/board/drivers/hw_watchdog.h
    detection_controls:
    - *id004
    - *id005
    occurrence: 5
    detection: 8
    ap: H
    actions:
    - SWF-ACT-011
  notes: New failure mode introduced by the watchdog (WP-W-04 OI-3). The SoC's own disengagement alert depends on it noticing the panda reset.
  safety_mechanisms:
  - description: None in the panda; the SoC raises an alert when it loses the panda (QM)
actions:
- id: SWF-ACT-001
  kind: detection
  description: Run the opendbc safety suite and the mutation tests as a blocking gate in LionDriver CI for every change and submodule bump
  owner: Jherrod Thomas
  status: completed
  evidence: '.github/workflows/safety.yaml (CR-CI-05, merged from liondriver-dev): safety tests with 100% line coverage, MISRA and mutation jobs on push and pull
    request. Branch protection making them blocking is not verified here'
  revised:
    severity: 10
    occurrence: 5
    detection: 3
    ap: H
- id: SWF-ACT-002
  kind: prevention
  description: Requirements-based tests for the panda safety model, traced to the draft TSRs and SWSRs (assurance WP-S-02, WP-W-02); the requirements exist as drafts,
    the tests do not
  owner: Jherrod Thomas
  status: open
  revised:
    severity: 10
    occurrence: 3
    detection: 3
    ap: L
- id: SWF-ACT-003
  kind: design_change
  description: Derive steering and acceleration envelopes from vehicle measurements (FSC FOI-001, DFA DM-10) and set panda limits from them, independently of the
    SoC limits
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-004
  kind: design_change
  description: Implement the panda configuration lock (LD-DES-001 DR-01..DR-07, DR-05 for ELM327)
  owner: Jherrod Thomas
  status: in_progress
  evidence: Implemented for the reference build in panda#4 (9f60e17); D-12 decided. Build flag and release procedure open (SWF-ACT-009)
- id: SWF-ACT-005
  kind: design_change
  description: Add an acceleration-rate (jerk) check to the panda longitudinal checks, or justify the absence with characterized powertrain rate limits (OI-002)
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-006
  kind: detection
  description: Verify on the vehicle that the PCM cancels cruise on brake (FSC FOI-006) so PCM_CRUISE can be credited as the diverse brake path; add a safety test
    for brake-without-cruise-cancel
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-007
  kind: design_change
  description: Derive RX-lag and heartbeat timeouts from the FTTI and check them at 8 Hz or faster while controls are allowed (LD-DES-001 DR-20)
  owner: Jherrod Thomas
  status: in_progress
  evidence: 'RX lag: 5 periods at 100 Hz (opendbc#1, panda#3). Heartbeat loss: 0.3 s at 100 Hz (panda#7, BL-003). Engaged mismatch still about 3 s at 1 Hz; FTTI derivation
    open'
- id: SWF-ACT-008
  kind: detection
  description: Add a unit or static check that every host TX path calls can_send with skip_tx_hook=false
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-009
  kind: design_change
  description: 'Make LIONDRIVER_REFERENCE=1 (with RELEASE=1) the only firmware build used for the reference configuration: set it in openpilot''s panda build and
    the release procedure, and have the host check it (e.g. a version or health flag) before engaging'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-010
  kind: design_change
  description: Restrict ELM327 TX to the UDS services fingerprinting and radar disable need, and refuse it above standstill (WP-W-04 OI-6)
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-011
  kind: detection
  description: Confirm the LSI range from the STM32H725 datasheet and run the watchdog HIL test (test_10_hw_watchdog) on the bench, including a long soak for spurious
    resets (D-04)
  owner: Jherrod Thomas
  status: open
