    description: Item resists the driver's steering within the panda torque bound
    hazard: HZ-009
    severity: 10
  severity: 10
  causes:
  - id: SWF-087.C1
    description: 'By design the envelope has no driver-override check on the LKA path (GAP-02): TSR-304 (driver allowance, and back-off while the driver torque exceeds
      T_ovr; decided as DQ-053, 2026-10-14) is not implemented in toyota.h, in either build'
    element: SWF-SE-006
    prevention_controls:
    - description: Upstream design (a bounded torque the driver can overpower); requirement TSR-304 not implemented, so O 8 (RT-2 §2), as the other by-design gaps
      ref: opendbc_repo/opendbc/safety/modes/toyota.h
    detection_controls:
    - description: test_toyota.py tests the measured-torque limit (MotorTorqueSteeringSafetyTest, MAX_TORQUE_ERROR 350); no test of torque opposing the driver on the
        LKA path
    occurrence: 8
    detection: 10
    ap: H
    actions:
    - SWF-ACT-074
  safety_mechanisms:
  - description: Panda torque magnitude (1500), rate (up 15, down 25) and measured-torque-error (350) limits bound what can oppose the driver (SWF-001, FSR-032)
    ref: opendbc_repo/opendbc/safety/modes/toyota.h:298-310
  - description: Host lateral cut-off at 500 units of driver torque (carcontroller.py:83; QM)
    ref: opendbc_repo/opendbc/car/toyota/carcontroller.py
  notes: Realises BE-5.05 (WP-A-04 G5.3, SPF-12) on the envelope side; the host side is SWF-038 and SWF-044. Whether the bounded torque is hazardous depends on the
    measured override force (FSR-031 vehicle test, not done).
- id: SWF-088
  element: SWF-SE-054
  function: SWF-FN-055
