  - description: Relay malfunction detection blocks all TX after a stock message appears on the car side (SWF-012)
    ref: opendbc_repo/opendbc/safety/safety.h
  notes: Found by the DFA (WP-A-03 DM-25) after BL-005; not rated at BL-005. Upstream build unaffected by the fix.
- id: SWF-091
  element: SWF-SE-054
  function: SWF-FN-056
  failure_mode: Engagement allowed while the EPS or ABS/VSC reports an active fault code at start-up
  guideword: omission
