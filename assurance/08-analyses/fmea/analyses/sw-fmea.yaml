    detection_controls:
    - description: 'Proven by mutation in CI (after BL-007): the tests fail on each hand-written mutant of this cause (DT-6..DT-11: dtc_entry_events,
        the start-up read of the record in selfdrived, a missing record, the REPLAY and simulator exemption), tools/ci/host_mutation.py in the
        tests.yaml unit_tests job; so D 4 (RT-2), from D 8 (rev 1.12)'
      ref: tools/ci/host_mutants.toml
    - description: test_vehicle_dtc_entry.py (each outcome raises its no-entry event on the reference platform; other platforms unchanged), run by the CI
