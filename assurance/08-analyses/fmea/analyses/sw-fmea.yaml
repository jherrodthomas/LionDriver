  description: 'Torque limits (carcontroller.py:105-113; lateral.py:93-118, 174-195), ACC_CONTROL with its own PID and pitch compensation
    (carcontroller.py:174-265), cancel (253). Limits: STEER_MAX 1500, error 350, up 15 / down 25 per frame, accel [-3.5, 2.0] (values.py:20-47)'
- id: SWF-SE-046
  name: card actuation hand-off
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - openpilot/selfdrive/car/card.py
  description: controls_update sends CarController output on every CAN cycle while carControl is alive (card.py:224-240)
functions:
- id: SWF-FN-001
  element: SWF-SE-003
  description: Transmit only whitelisted messages, each passed through the mode-specific check
  requirements:
  - FSR-002
  - FSR-019
  - FSR-022
- id: SWF-FN-002
  element: SWF-SE-006
  description: Block steering requests outside torque magnitude, rate and measured-torque-error limits, and any torque while controls are not allowed
  requirements:
  - FSR-002
  - FSR-005
  - FSR-032
- id: SWF-FN-003
  element: SWF-SE-007
  description: Block acceleration outside the range, and any non-inactive acceleration while controls are not allowed or the accelerator is pressed
  requirements:
  - FSR-019
  - FSR-022
  - FSR-024
- id: SWF-FN-004
  element: SWF-SE-005
  description: Allow controls on rising edge of PCM cruise; withdraw on cruise off, brake press, invalid or lagging safety messages
  requirements:
  - FSR-005
  - FSR-029
  - FSR-035
- id: SWF-FN-005
  element: SWF-SE-002
  description: Validate safety-relevant RX messages (checksum, counter, quality flag, timing)
  requirements:
  - FSR-005
  - FSR-029
- id: SWF-FN-006
  element: SWF-SE-008
  description: 'Decode Toyota vehicle state: EPS torque, cruise state, brake, accelerator, wheel speeds'
  requirements:
  - FSR-002
  - FSR-029
- id: SWF-FN-007
  element: SWF-SE-004
  description: Block stock-camera messages the item replaces; forward all others, including stock pre-collision messages
  requirements:
  - FSR-037
  - FSR-038
- id: SWF-FN-008
  element: SWF-SE-009
  description: Detect a relay malfunction and block all item transmission
  requirements:
  - FSR-008
- id: SWF-FN-009
  element: SWF-SE-010
  description: Install only the safety model and parameter intended for the vehicle
  requirements:
  - FSR-010
- id: SWF-FN-010
  element: SWF-SE-011
  description: Withdraw controls when the host heartbeat is lost or reports not engaged
  requirements:
  - FSR-007
- id: SWF-FN-011
  element: SWF-SE-012
  description: Accept host configuration commands only when they cannot widen what is transmitted
  requirements:
  - FSR-010
- id: SWF-FN-012
  element: SWF-SE-013
  description: Route every host transmission through the safety check
  requirements:
  - FSR-002
- id: SWF-FN-013
  element: SWF-SE-014
  description: Reset the MCU, which releases the relay, within 0.1 s when the safety task or main loop stops; never reset while both run normally
  requirements:
  - FSR-002
  - FSR-038
- id: SWF-FN-020
