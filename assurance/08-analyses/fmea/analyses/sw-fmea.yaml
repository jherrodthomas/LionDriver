  notes: 'Re-rated at BL-007 (rev 1.9): C1 and C2 stay O3 D4 AP L (their mechanisms did not change; the engaged-mismatch path is now 0.3 s in
    the reference build, which shortens the residual of C2 but does not change its rating). The new check itself is C3, O3 D4 AP L. The 2026-10-21
    open note is closed.'
