      (soft disable), or no EPS event at all while the driver keeps steering
  - level: next_higher
    description: The item stays engaged with lateral assist lost; the envelope refuses lateral frames (EPS-fault refusal, reference build) and the panda siren sounds
      after about 1 s of a persistent fault while authority is granted (0.7 s since panda bf8102a, DQ-048)
  - level: end
    description: Driver not prompted to take over while lateral control is lost; lane departure (counterpart of SFM-038.C1)
    hazard: HZ-004
    severity: 10
  severity: 10
  causes:
  - id: SWF-088.C1
    description: 'Defect in the EPS-fault escalation: after a steering override in the last 1.5 s or at standstill, steerTempUnavailableSilent is allowed only
      while steer_fault_frames <= STEER_FAULT_SILENT_FRAMES (1.5 s), then steerTempUnavailable (car_events.py:17, 169-187; TSR-607 (b), DQ-342 A, #174). At
      BL-005 the silent warning stayed latched for the whole fault (GAP-03)'
    element: SWF-SE-054
    prevention_controls:
    - description: LionDriver change to upstream code with a requirement (TSR-607 (b)) and targeted unit tests; reviewed in the PR, not independently; O 5 as the
