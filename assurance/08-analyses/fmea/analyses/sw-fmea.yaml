    description: Defect in the reference-build allow-list for 0xdc/0xdf and the car-mode request gate
    element: SWF-SE-012
    prevention_controls:
    - description: 'Reference-build lock: 0xdc accepts TOYOTA only with parameter 73 (no flags) and, once TOYOTA is active, only NOOUTPUT or SILENT; 0xdf refused
        (reference_lock.h, panda#4, TSR-512/513). BL-005: the default build since #36 (SConstruct:272-283), so the lock is in the firmware pandad flashes (SWF-013.C2)'
      ref: panda/board/reference_lock.h
    detection_controls: *id003
    occurrence: 3
    detection: 4
    ap: L
    actions:
    - SWF-ACT-004
  - id: SWF-013.C2
    description: 'Firmware built without LIONDRIVER_REFERENCE, so set_safety_mode accepts any mode and parameter and debug builds include SAFETY_ALLOUTPUT. Since
      BL-005 this needs a deliberate opt-out: LIONDRIVER_REFERENCE set empty for the openpilot build, or RELEASE_VARIANT=upstream for the release script'
    element: SWF-SE-012
