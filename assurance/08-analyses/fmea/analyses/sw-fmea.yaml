  - level: local
    description: VehicleDtcStatus records the car as healthy, or no fault-code no-entry event is raised, although an ECU reports an active code
  - level: next_higher
    description: The item engages on a car whose steering or stability control already has a stored fault; only the driver's lamp check (TSR-811, OPS-01) and
      the live fault signals (EPS status 0x262, espDisabled, accFaulted) remain
  - level: end
    description: Steering assist lost or degraded while engaged on a faulted EPS
    hazard: HZ-004
    severity: 10
  - level: end
    description: Braking or stability control degraded while the item controls longitudinal motion
    hazard: HZ-007
    severity: 10
  severity: 10
  causes:
  - id: SWF-091.C1
    description: 'Defect in the read (vehicle_dtc.py, BL-007): status bits parsed wrongly (active = status AND availability AND 0x8B), a wrong ECU address taken
      from the firmware-query table, an exempt code that should count, or a failed read reported as healthy instead of failed (SWSR-629b, 629c)'
    element: SWF-SE-054
    prevention_controls:
    - description: 'LionDriver change with requirements (TSR-629, SWSR-629..629d; DQ-132 A) and targeted unit tests; reviewed in the PR, not independently. A read
        that is silent, negative, malformed, reports no supported active bits or has no address counts as failed and refuses engagement (fail closed). O 5 as
        the other new host code with targeted tests'
      ref: assurance/07-supporting/impact/change-2026-10-25-startup-fault-code-read.md
    detection_controls:
    - description: 'Proven by mutation in CI (after BL-007): the tests fail on each hand-written mutant of this cause (DT-1..DT-5),
