    severity: 10
  - level: end
    description: Contributes to HZ-005
    hazard: HZ-005
    severity: 10
  severity: 10
  causes:
  - id: SWF-014.C1
    description: 'Heartbeat from pandad missing (pandad, SPI or SoC down): authority revoked after 0.3 s, checked at 100 Hz (TSR-407, panda#7)'
    element: SWF-SE-011
    prevention_controls:
    - description: 'heartbeat_monitor: no 0xf3 for > 0.3 s in a car mode clears controls_allowed (panda c2e5d93); SILENT after 5 s unchanged (TSR-510)'
      ref: panda/board/drivers/heartbeat_monitor.h
    detection_controls:
    - description: Host unit test of the heartbeat monitor in panda CI (test.sh); HITL RX/heartbeat test not run (no bench, D-04)
      test: panda/tests/heartbeat_monitor/test_heartbeat_monitor.py
    occurrence: 3
    detection: 4
    ap: L
    actions:
    - SWF-ACT-007
  - id: SWF-014.C2
    description: 'controlsd, card or the pandad send thread stalls while pandad keeps sending heartbeats with engaged=1: the heartbeat shows pandad liveness only.
      At BL-004 authority was withdrawn only by the engaged-mismatch counter after about 3 s. BL-005: card stops sending once carControl is older than 0.1 s
      (card.py:247), and the reference build (now the default) revokes authority when STEERING_LKA has not arrived for 50 ms or, with openpilot longitudinal,
      ACC_CONTROL for 100 ms (TSR-408, opendbc#11, toyota.h:599-606). Residual: a loop that keeps sending fresh frames with a frozen value (SWF-020, SWF-043),
      and the 0.1 s card window before frames stop'
    element: SWF-SE-011
    prevention_controls:
    - description: 'TX arrival supervision in the 100 Hz safety task, started at the grant (safety.h tx_arrival_checks, toyota.h:599-606); timeouts from TSR-408,
        not yet confirmed on reference drive logs (IA tx-arrival OI-1). The engaged-mismatch path (about 3 s at BL-006) revokes 0.3 s after the
        first not-engaged heartbeat since panda f4803c5, reference build, after BL-006 (TSR-307(a))'
      ref: opendbc_repo/opendbc/safety/modes/toyota.h
    detection_controls:
    - description: 'Reference-variant safety tests test_tx_arrival_supervision (at the timeout allowed, 1 us later revoked), test_tx_arrival_starts_at_grant and
        test_tx_arrival_acc_control_only_with_openpilot_longitudinal, run with 100 % line coverage and the reference-variant mutation job in CI (safety.yaml,
        green at 20569e9). Host-compiled; the HIL check of stopping card while engaged is not run (IA tx-arrival OI-4, D-04)'
      test: opendbc_repo/opendbc/safety/tests/test_toyota.py
      ref: opendbc_repo/opendbc/safety/tests/mutation.py; .github/workflows/safety.yaml
    occurrence: 3
    detection: 4
    ap: L
    actions:
    - SWF-ACT-007
  - id: SWF-014.C3
    description: 'Defect in the engaged-mismatch check of the reference build (engaged_mismatch.h, panda f4803c5/895dc44, BL-007; TSR-307(a)): authority kept
      longer than 0.3 s after the first not-engaged heartbeat while granted, or the episode not started or ended early, so a host that drops engagement but
      keeps the heartbeat alive keeps authority up to the 1 Hz count (about 3 s)'
    element: SWF-SE-011
    prevention_controls:
    - description: 'engaged_mismatch_tick in the 100 Hz safety task, reference build only (the default build since BL-005); LionDriver change with a requirement
        (TSR-307(a)); MISRA clean in both builds; reviewed in the PR, not independently. O 3 as the other reference-build panda mechanisms with host tests'
      ref: panda/board/drivers/engaged_mismatch.h
    detection_controls:
    - description: 'tests/engaged_mismatch (10 host tests: revoke at 0.3 s in a stall, silent on a cancel at 0.1 s and 0.4 s, no episode without authority or
        with the heartbeat engaged again), run by the safety.yaml panda host tests job on every change. Mutants of the revoke time, the siren time and the
        episode end were checked by hand, not in CI. HIL test_16 is bench-only and not run (no rating credit)'
      test: panda/tests/engaged_mismatch/test_engaged_mismatch.py
      ref: .github/workflows/safety.yaml
    occurrence: 3
    detection: 4
    ap: L
    actions:
    - SWF-ACT-007
  safety_mechanisms:
  - description: 'Heartbeat loss: authority revoked after 0.3 s (TSR-407); SILENT after 5 s; engaged mismatch after about 3 s; siren for 3 s when the 0.3 s
      revocation removes granted authority (panda c33343b, all builds, BL-005); TX arrival revocation in 50/100 ms (TSR-408, reference build).
      After BL-006, reference build: the siren also sounds when the TX arrival check revokes (panda 8a69ccf, DQ-404 A, TSR-516(b)), and the
      engaged mismatch revokes 0.3 s after the first not-engaged heartbeat, with the siren 0.5 s after that heartbeat while PCM cruise
      stays on (panda f4803c5, TSR-307(a), TSR-516(c)); plant model 0.39-0.48 s revocation and 0.63-0.88 s siren after selfdrived stops
      (assurance/sim/results/engaged-mismatch.md, synthetic, no rating credit)'
