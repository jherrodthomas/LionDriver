- id: SWF-090
  element: SWF-SE-009
  function: SWF-FN-008
  failure_mode: Relay-malfunction reaction cleared by a safety-mode change before the malfunction is detected again
  guideword: omission
  effects:
  - level: local
    description: set_safety_hooks clears relay_malfunction, and stock_ecu_check looks again only after the new mode has run for more than 1 s
  - level: next_higher
    description: A mode cycle (host request or heartbeat-loss recovery) followed by a quick re-engagement grants authority with the harness relay still faulty
  - level: end
    description: Item and stock camera commands combine on the bus until the malfunction is detected again
