#   SWF-043.C2 O7 -> O5; SWF-045.C1/C2 O6 -> O5. All stay AP H: new code with targeted tests that are not proven (D 8-10), and S10.
# - New SWF-054, SWF-055: answered decisions DQ-079 and DQ-080 (no re-grant while a TX-rate excess persists; no authority after a mode change
#   without a new engagement) are implemented in jherrodthomas/opendbc#15, which is not in the BL-005 pin. Rated as present by design (O8).
# - Rows whose cause is in an element that did not change keep their O and D; the new mechanisms of other elements are listed as safety mechanisms.
# rev 0.9 at BL-005: P2 elements added (fmea-plan §3.3): card and the Toyota port (SWF-SE-050..054, SWF-056..060), driver monitoring
