- id: SWF-005
  element: SWF-SE-002
  function: SWF-FN-005
  failure_mode: Corrupted brake-pressed value accepted
  guideword: corrupted
  effects:
  - level: local
    description: Brake press read as released
  - level: next_higher
    description: Controls not withdrawn on driver braking
  - level: end
    description: Automation not released on brake
    hazard: HZ-008
    severity: 10
  severity: 10
  causes:
  - id: SWF-005.C1
    description: BRAKE_MODULE (0x226) has no checksum or counter in the vehicle DBC; the RX check ignores checksum, counter and quality and checks timing only
    element: SWF-SE-008
    prevention_controls:
    - description: CAN CRC protects the transport; the vehicle message itself has no end-to-end protection (toyota_nodsu_pt.dbc:18-21; toyota.h:46)
      ref: opendbc_repo/opendbc/dbc/generator/toyota/toyota_nodsu_pt.dbc
    detection_controls:
    - description: No test targets this cause
    occurrence: 3
    detection: 9
    ap: H
    actions:
    - SWF-ACT-006
  notes: 'Diverse path: the PCM cancels cruise on its own brake input and the panda follows PCM_CRUISE (checksum-checked). That credit needs FSC FOI-006.'
  safety_mechanisms:
