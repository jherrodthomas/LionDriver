      valid check (controlsd.py:49-51, 236), and plannerd reads controlsState.forceDecel the same way (longitudinal_planner.py:84); its own valid flag is not read by
      controlsd (SWF-065.C1). A stopped dmonitoringd leaves the last value in place until selfdrived soft-disables (SWF-064). BL-007: once the first request arrives, selfdrived latches it (TSR-633, minimum_risk.py) and controlsd
      keeps forceDecel on from selfdriveState, so a later dmonitoringd stop or reset no longer drops the stop (SWF-062.C1); a request that never arrives, and the
