- id: SWF-020
  element: SWF-SE-021
  function: SWF-FN-020
  failure_mode: Heartbeat reports engaged while no fresh command reaches the panda
  guideword: value_stale
  effects:
  - level: local
    description: 0xf3 carries engaged=1 while card/controlsd have stalled or sendcan is not forwarded
  - level: next_higher
    description: Panda keeps controls_allowed. The engaged-mismatch counter never runs. Queued frames up to 1 s old can still pass (SWF-023), or none arrive
  - level: end
    description: Actuation authority held without a supervising control loop; stale in-limit command replayed
    hazard: HZ-002
    severity: 10
  - level: end
    description: Steering or ACC commands stop while the device and panda still show engaged
    hazard: HZ-004
    severity: 10
  severity: 10
  safety_mechanisms:
  - description: Panda torque, rate and real-time delta limits (max_rt_delta 450 per 250 ms) and the acceleration range bound the magnitude of a replayed command. They
      do not detect an in-limit stale value (WP-A-04 SPF-14)
    ref: opendbc_repo/opendbc/safety/modes/toyota.h:270-274
  - description: selfdrived commIssue/processNotRunning (SOFT_DISABLE, QM) drops enabled. pandad then sends engaged=0, and the panda withdraws authority after 3 mismatches
      at 1 Hz, about 3 s (SWF-014.C2)
    ref: panda/board/main.c:226-233
  causes:
  - id: SWF-020.C1
    description: 'engaged is derived only from selfdriveState alive (<0.1 s), valid and enabled (pandad.cc:424). Neither carControl/sendcan freshness nor the
      forwarding thread''s progress goes into the heartbeat, which is sent from the main thread (pandad.cc:313), so the heartbeat shows pandad and selfdrived liveness
      only (host side of SWF-014.C2; TSR-409 / TSR-602 not implemented)'
    element: SWF-SE-021
    linked_failure_mode: SWF-014
    prevention_controls:
    - description: Upstream design, reviewed; no requirement binds the heartbeat to command freshness at BL-004 (WP-A-04 BE-1.22, GAP-10)
      ref: openpilot/selfdrive/pandad/pandad.cc:421-430
    detection_controls:
    - description: No test targets this cause
    occurrence: 8
    detection: 10
    ap: H
    actions:
    - SWF-ACT-020
    - SWF-ACT-029
  notes: card stops sending once carControl is older than 0.1 s (card.py:234), so after a controlsd stall frames usually stop rather than freeze. The stale-replay path
    needs a stall of pandad or card shorter than 1 s (SWF-023). Within that window the panda cannot tell a dead control loop from a live one.
- id: SWF-021
  element: SWF-SE-021
  function: SWF-FN-020
  failure_mode: Heartbeat gap longer than the 0.3 s panda budget while engaged
  guideword: late
  effects:
  - level: local
    description: Three or more 10 Hz heartbeats missing
  - level: next_higher
    description: Panda revokes controls_allowed (TSR-407) and blocks item frames, while selfdrived still shows engaged and controlsd keeps commanding
  - level: end
    description: Loss of lateral and longitudinal control. The SoC alert follows only after the controlsAllowed mismatch counter reaches 200 frames (about 2 s)
    hazard: HZ-004
    severity: 10
  - level: end
    description: Contributes to HZ-007 (ACC requests blocked while shown engaged)
    hazard: HZ-007
    severity: 10
  severity: 10
  safety_mechanisms:
  - description: 'selfdrived controlsMismatch (IMMEDIATE_DISABLE, QM) once mismatch_counter >= 200. The counter increments at 100 Hz while any pandaState shows
      !controlsAllowed, so the delay is about 2 s, not "two samples" as the code comment says'
    ref: openpilot/selfdrive/selfdrived/selfdrived.py:338, 507-514
  - description: 'Panda siren for 3 s only after the 1 Hz heartbeat counter times out (SILENT), not at the 0.3 s revocation. 2026-10-13 (panda c33343b, all builds,
      not credited in the ratings): the siren also sounds at the 0.3 s revocation when authority was granted, about 0.56 s after the last heartbeat (WP-S-04 T-07a)'
    ref: panda/board/main.c:236-256; panda/board/drivers/heartbeat_siren.h
  causes:
  - id: SWF-021.C1
    description: 'The heartbeat is skipped whenever the health read fails: process_panda_state returns before send_heartbeat (pandad.cc:299-303, 313). A control
      transfer that cannot complete retries without bound (SWF-027.C1), so the main loop stops sending heartbeats while it waits'
    element: SWF-SE-021
    prevention_controls:
    - description: Upstream code, reviewed, -Werror. The 0.3 s panda budget is new in panda#7 (changed operating condition). pandad heartbeat jitter under SPI
        errors has not been characterised against it
      ref: panda/board/drivers/heartbeat_monitor.h
    detection_controls:
    - description: 'Hardware test with SPI error injection (SPI_ERR_PROB=0.001). It checks that pandaStates intervals stay below 8 periods (0.8 s), which does not
        cover the 0.3 s budget. It is not designed for this cause and was not run for BL-004'
      test: openpilot/selfdrive/pandad/tests/test_pandad_spi.py
    occurrence: 7
    detection: 9
    ap: H
    actions:
    - SWF-ACT-021
    - SWF-ACT-029
  - id: SWF-021.C2
    description: 'The heartbeat shares the 100 Hz loop with CAN RX, three get_can_state reads, fan/IR writes and serial_read, which loops until the panda log
      is empty (pandad.cc:414-448, panda.cc:47-60). A loop overrun delays the heartbeat'
    element: SWF-SE-021
    prevention_controls:
    - description: Real-time priority 54 on isolated core 3 (main.cc:107-113); RateKeeper; upstream review
      ref: openpilot/selfdrive/pandad/main.cc
    detection_controls:
    - description: As SWF-021.C1 (timing report in the hardware SPI test, not designed for the 0.3 s budget, not run)
      test: openpilot/selfdrive/pandad/tests/test_pandad_spi.py
    occurrence: 6
    detection: 9
    ap: H
    actions:
    - SWF-ACT-021
    - SWF-ACT-029
  notes: 'Revocation is the safe direction for authority. The hazard is the silent gap: the panda blocks frames while the SoC shows engaged, for about 2 s. The
    mismatch timing belongs to EL-04 (selfdrived), and SWF-ACT-021 asks for it to be shortened as well.'
- id: SWF-022
  element: SWF-SE-022
  function: SWF-FN-021
  failure_mode: Wrong safety model, parameter or alternative experience written to the panda
  guideword: wrong_mode
  effects:
  - level: local
    description: Panda enforces a model or parameter other than the reference (TOYOTA, 73, alternative experience 0), or stays in ELM327
  - level: next_higher
    description: Item frames checked against wrong limits, wrong brake message or no car model
  - level: end
    description: Any actuation hazard within the wrongly configured envelope
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-008 (wrong brake source via the ALT_BRAKE flag, SWF-008.C1)
    hazard: HZ-008
    severity: 10
  severity: 10
  safety_mechanisms:
  - description: 'selfdrived controlsMismatch after 10 s compares pandaStates mode, param and alternative experience against CarParams (QM). Both come from the same
      CarParams, so it detects a lost or altered write but not a wrong CarParams'
    ref: openpilot/selfdrive/selfdrived/selfdrived.py:328-339
  - description: Panda reference-build lock (TOYOTA with parameter 73 only). Not active at BL-004 (SWF-013.C2)
    ref: panda/board/reference_lock.h
  causes:
  - id: SWF-022.C1
    description: 'setSafetyMode writes safety_configs[0] model and param and alternative_experience exactly as found in CarParams (panda_safety.cc:56-70). There is no
      allow-list for the reference configuration. A fingerprinting or CarParams error, such as a wrong EPS factor or flags, reaches the panda, which accepts any
      mode at BL-004'
    element: SWF-SE-022
    linked_failure_mode: SWF-013
    prevention_controls:
    - description: Upstream code, reviewed. FirmwareQueryDone and ControlsReady are cleared on every onroad transition (common/params_keys.h:28, 44), so a previous
        drive's CarParams is not reused. No documented requirement for the host check
      ref: openpilot/selfdrive/pandad/panda_safety.cc
    detection_controls:
    - description: No test targets this cause; test_pandad.py (hardware) checks only that pandad starts
    occurrence: 7
    detection: 10
    ap: H
    actions:
    - SWF-ACT-022
    - SWF-ACT-028
  - id: SWF-022.C2
    description: 'set_safety_model, set_alternative_experience and the OBD multiplexing switch ignore the control_write result and never read the mode back
      (panda.cc:39-45, panda_safety.cc:33-36, 68-69). safety_configured_ is set true unconditionally (panda_safety.cc:12-13), so a write the panda drops or refuses
      is not retried during the drive. ObdMultiplexingChanged is acknowledged before the panda has confirmed the mode'
    element: SWF-SE-022
    prevention_controls:
    - description: 'Upstream code, reviewed. A failed SPI write retries without bound (TIMEOUT 0), so a lost write shows up as a hang (SWF-027), not a silent loss.
      A refusal by the panda (reference lock, or 0xdf in a car mode, main_comms.h:262-267) is silent'
      ref: openpilot/selfdrive/pandad/spi.cc:205-239
    detection_controls:
    - description: No test targets this cause
    occurrence: 4
    detection: 10
    ap: H
    actions:
    - SWF-ACT-022
  notes: 'The setting order is correct: ELM327 first (a non-car mode, so 0xdf is accepted), then alternative experience, then the car mode. In the safe direction
    (mode never set), the item stays unavailable with a controlsMismatch alert. In the unsafe direction (wrong car mode or param accepted), the panda is the
    only barrier, and it is not locked at BL-004.'
- id: SWF-023
  element: SWF-SE-023
  function: SWF-FN-022
  failure_mode: Stale or burst-replayed sendcan frames forwarded to the panda
  guideword: value_stale
  effects:
  - level: local
    description: Frames up to 1 s old forwarded, or a backlog sent back-to-back after a pandad or SPI stall
  - level: next_higher
    description: Panda receives commands that no longer match the vehicle state, compressed in time
  - level: end
    description: Stale in-limit steering command applied after the situation changed
    hazard: HZ-003
    severity: 10
  - level: end
    description: Contributes to HZ-002 (torque change compressed in time, bounded by the panda real-time delta)
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-005 (stale positive acceleration request)
    hazard: HZ-005
    severity: 10
  - level: end
    description: Contributes to HZ-006 (stale deceleration request)
    hazard: HZ-006
    severity: 10
  severity: 10
  safety_mechanisms:
  - description: 'Panda per-frame torque rate (up 15 / down 25) and real-time delta (450 per 250 ms) checks limit how fast a burst can change torque. The acceleration
      range check applies. The per-ID TX rate supervision (TSR-518) is compiled only in the reference build and is not credited'
    ref: opendbc_repo/opendbc/safety/modes/toyota.h:270-274
  - description: Heartbeat revocation after 0.3 s bounds replay after a pandad stall of more than 0.3 s, because the main loop stalls with the same SPI lock
    ref: panda/board/drivers/heartbeat_monitor.h
  causes:
  - id: SWF-023.C1
    description: 'The age gate is 1 s (pandad.cc:78-79). That exceeds the 0.9 s preliminary SG-001 FTTI and is 100 control periods long. The sendcan subscriber is
      a non-conflated FIFO (pandad.cc:64; services.py sendcan MEDIUM queue), so a backlog of up to 1 s is forwarded in order but back-to-back. No newest-only
      policy applies per address (WP-W-04 SWF-47, SWSR-411)'
    element: SWF-SE-023
    prevention_controls:
    - description: Upstream design, reviewed; no derived freshness requirement at BL-004
      ref: openpilot/selfdrive/pandad/pandad.cc:59-87
    detection_controls:
    - description: No test targets this cause
    occurrence: 8
    detection: 10
    ap: H
    actions:
    - SWF-ACT-023
    - SWF-ACT-024
  notes: pandad also ignores the sendcan valid flag (card sets valid=CS.canValid, card.py:238), so frames built on invalid CAN input are forwarded. The window is short
    because selfdrived disables on canError, but the flag is not used as a barrier.
- id: SWF-024
  element: SWF-SE-023
  function: SWF-FN-022
  failure_mode: sendcan frames silently not forwarded while engaged
  guideword: omission
  effects:
  - level: local
    description: Frames dropped in pandad with only a log line (pandad.cc:83-85) or a failed bulk write
  - level: next_higher
    description: No steering or ACC messages on the bus while selfdrived, controlsd and the panda all show engaged
  - level: end
    description: Loss of lateral control without a timely item alert (System FMEA SFM-005.C2)
    hazard: HZ-004
    severity: 10
  - level: end
    description: Loss of ACC deceleration without a timely item alert (System FMEA SFM-011.C2)
    hazard: HZ-007
    severity: 10
  severity: 10
  safety_mechanisms:
  - description: 'For SPI write failures only: comms_healthy latches false (spi.cc:166). can is then published invalid (pandad.cc:93-97), card reports canValid false,
      and selfdrived raises canError (IMMEDIATE_DISABLE, QM)'
    ref: openpilot/selfdrive/selfdrived/selfdrived.py:380-381
  - description: EPS/PCM fault signals on missing messages (steerTempUnavailable, accFaulted); stock behaviour on missing LKA/ACC frames not characterised (XM-02)
    ref: openpilot/selfdrive/car/car_events.py
  causes:
  - id: SWF-024.C1
    description: 'Clock-domain mismatch. card stamps sendcan logMonoTime with Python time.monotonic(), which is CLOCK_MONOTONIC (pandad_api_impl.py:42, card.py:236-238).
      pandad compares it with nanos_since_boot(), which is CLOCK_BOOTTIME (common/timing.h:10-14). The two differ by the time spent suspended since boot. If that
      exceeds 1 s, every frame is dropped and only a LOGE is written. The check can only become stricter, never more permissive'
    element: SWF-SE-023
    prevention_controls:
    - description: None specific. Whether the comma 3X ever suspends after boot while openpilot runs (offset > 0) is not established
    detection_controls:
    - description: No test targets this cause; no test exercises the age gate
    occurrence: 5
    detection: 10
    ap: H
    actions:
    - SWF-ACT-023
    - SWF-ACT-026
    - SWF-ACT-024
  - id: SWF-024.C2
    description: 'A bulk write that fails after its retries (5 ms timeout, clamped to 20 ms per ACK wait) drops the rest of the batch. can_send ignores the result
      (spi.cc:149-177, panda.cc:210-214)'
    element: SWF-SE-025
    prevention_controls:
    - description: Upstream code, reviewed; the failure latches comms_healthy, which leads to canError (in-field mechanism above)
      ref: openpilot/selfdrive/pandad/spi.cc:164-167
    detection_controls:
    - description: Hardware SPI corruption test (SPI_ERR_PROB). It checks received frames, not dropped TX, and was not run for BL-004
      test: openpilot/selfdrive/pandad/tests/test_pandad_spi.py
    occurrence: 6
    detection: 9
    ap: H
    actions:
    - SWF-ACT-026
    - SWF-ACT-029
  notes: FAKESEND (pandad.cc:400) also drops every frame. It is a test hook that no launch path sets (SWF-028.C2).
- id: SWF-025
  element: SWF-SE-024
  function: SWF-FN-023
  failure_mode: pandaStates.faults reports a relay malfunction that did not occur
  guideword: corrupted
  effects:
  - level: local
    description: faults list sized from all set bits, with an unfilled entry left at enum value 0 (relayMalfunction)
  - level: next_higher
    description: selfdrived relayMalfunction (IMMEDIATE_DISABLE, permanent NO_ENTRY)
  - level: end
    description: Immediate disengagement while engaged, with a take-control alert; item unavailable for the drive
    severity: 8
  severity: 8
  safety_mechanisms:
  - description: None; the alert itself is correct in form, only its cause is false
  causes:
  - id: SWF-025.C1
    description: 'initFaults(fault_bits.count()) counts every set bit of faults_pkt, but the fill loop maps only bits 0..26 (relayMalfunction..heartbeatLoopWatchdog,
      pandad.cc:257-268). The panda defines bit 27 FAULT_INTERRUPT_RATE_SOUND_DMA (panda/board/sys/sys.h:47, used in stm32h7/sound.h:162-163), and cereal FaultType has
      no entry for it (log.capnp:596-625). When bit 27 is set, the last list entry stays 0 = relayMalfunction'
    element: SWF-SE-024
    prevention_controls:
    - description: Upstream code, reviewed. A comment in log.capnp asks to update pandad when faults are added, and that was not done for bit 27
      ref: openpilot/cereal/log.capnp:624
    detection_controls:
    - description: No test targets this cause
    occurrence: 8
    detection: 10
    ap: H
    actions:
    - SWF-ACT-025
    - SWF-ACT-024
  notes: 'Found by code inspection. How often the sound DMA interrupt-rate fault fires on the 3X is unknown; the defect is certain. Related observation: pandad
    publishes the LionDriver fields epsFault, txRateExceeded and requestsRejected (pandad.cc:136-139), but no SoC process reads them (grep over openpilot/*.py),
    so an EPS-fault refusal by the panda reaches the driver only through the stock EPS fault path. That is for EL-04 to decide.'
- id: SWF-026
  element: SWF-SE-025
  function: SWF-FN-024
  failure_mode: Corrupted command or vehicle data accepted across the SPI link
  guideword: corrupted
  effects:
  - level: local
    description: A frame or health packet with bit errors passes both link checks
  - level: next_higher
    description: The panda checks a corrupted command, or the SoC uses corrupted vehicle state or panda state
  - level: end
    description: Wrong in-limit steering or acceleration command reaches the vehicle if its Toyota checksum also passes
    hazard: HZ-003
    severity: 10
  severity: 10
  safety_mechanisms:
  - description: Panda safety checks (limits, controls_allowed, TX whitelist) apply to the frame as received
    ref: opendbc_repo/opendbc/safety/safety.h
  - description: 'Toyota message checksum, computed on the SoC before SPI and verified by the EPS/PCM. Diverse from XOR, but credited only if XM-02 is confirmed'
    ref: opendbc_repo/opendbc/car/toyota/toyotacan.py
  - description: Panda RX checks on its own CAN view are independent of the SoC's RX path
    ref: opendbc_repo/opendbc/safety/safety.h
  causes:
  - id: SWF-026.C1
    description: 'Both integrity checks are 8-bit XOR over the same bytes: the SPI frame checksum (spi.cc:189-202) and the CAN header checksum (panda.cc:284-290).
      Any even number of bit errors in the same bit position passes both, so they are not independent'
    element: SWF-SE-025
    prevention_controls:
    - description: Upstream protocol with two XOR checks; the SPI layer re-syncs on error (spi.cc:394-404); spi_error_count is reported in pandaStates
      ref: openpilot/selfdrive/pandad/spi.cc
    detection_controls:
    - description: 'Hardware test injects random TX/RX corruption (SPI_ERR_PROB) and checks that received CAN frames were sent. It does not measure the residual
      undetected-error rate. Not run for BL-004'
      test: openpilot/selfdrive/pandad/tests/test_pandad_spi.py
    occurrence: 4
    detection: 9
    ap: H
    actions:
    - SWF-ACT-027
  notes: The hardware corruption rate on the 3X SPI bus is a DFMEA/FMEDA input. Here the cause is the weak software detection.
- id: SWF-027
  element: SWF-SE-025
  function: SWF-FN-024
  failure_mode: pandad hangs or restarts while engaged
  guideword: hang
  effects:
  - level: local
    description: No heartbeat, no can and no pandaStates. On restart, pandad.py resets or DFU-recovers the panda
  - level: next_higher
    description: Panda revokes authority after 0.3 s or is reset and releases the relay; steering and ACC end abruptly
  - level: end
    description: Loss of lateral and longitudinal control. The SoC alert depends on selfdrived noticing missing pandaStates or CAN
    hazard: HZ-004
    severity: 10
  - level: end
    description: Contributes to HZ-012 (driver misinformed while the device still shows engaged)
    hazard: HZ-012
    severity: 10
  severity: 10
  safety_mechanisms:
  - description: 'Panda heartbeat monitor revokes authority after 0.3 s (TSR-407). SILENT and a 3 s siren follow after the 1 Hz heartbeat timeout. 2026-10-13
      (panda c33343b, all builds, not credited in the ratings): the siren also sounds at the revocation when authority was granted, about 0.56 s after the last heartbeat'
    ref: panda/board/drivers/heartbeat_monitor.h
  - description: selfdrived commIssue (SOFT_DISABLE) and canError (IMMEDIATE_DISABLE) when pandaStates or can stop (QM). manager does not flag a hung pandad, because
      the process is still running
    ref: openpilot/selfdrive/selfdrived/selfdrived.py
  causes:
  - id: SWF-027.C1
    description: 'Unbounded SPI blocking. Control transfers use TIMEOUT 0, so spi_transfer_retry never times out (spi.cc:205-232). The loop also ends when connected
      becomes false, but no code ever clears connected (panda_comms.h:17). The fail-recovery loop waits for three NACKs without a limit (spi.cc:394-404). A panda
      that stops answering therefore blocks pandad, with the SPI lock held for both threads'
    element: SWF-SE-025
    prevention_controls:
    - description: Upstream code, reviewed, -Werror; no requirement for bounded link-failure detection
      ref: openpilot/selfdrive/pandad/spi.cc
    detection_controls:
    - description: Hardware tests start pandad with the panda in reset, DFU or bootstub (startup recovery only, not a loss during a drive). Not run for BL-004
      test: openpilot/selfdrive/pandad/tests/test_pandad.py
    occurrence: 7
    detection: 9
    ap: H
    actions:
    - SWF-ACT-021
    - SWF-ACT-029
  - id: SWF-027.C2
    description: 'pandad crashes: asserts on a sendcan frame longer than 64 bytes or with a non-DLC length (panda.cc:181-182), asserts in spi_transfer (spi.cc:319-320),
      or the uncaught runtime_error from connect() when the firmware is out of date (pandad.cc:52-54). pandad.py then resets or DFU-recovers the internal panda on
      every restart (pandad.py:79-91). The new pandad briefly sets ELM327 param 1 while driving before it restores the car mode (panda_safety.cc:24-27)'
    element: SWF-SE-026
    prevention_controls:
    - description: Upstream code, reviewed, ruff/ty on pandad.py; sendcan contents come from opendbc packers (fixed DLCs)
      ref: openpilot/selfdrive/pandad/pandad.py
    detection_controls:
    - description: Startup-recovery hardware tests only (not a crash while driving); not run for BL-004
      test: openpilot/selfdrive/pandad/tests/test_pandad.py
    occurrence: 6
    detection: 9
    ap: H
    actions:
    - SWF-ACT-021
    - SWF-ACT-029
  notes: 'pandad.py also exits the setup loop with an AssertionError if more than one panda is listed (pandad.py:96), for example an external USB panda. The item
    is then unavailable but not hazardous. pandad leaves the panda in NO_OUTPUT on exit only when onroad and not engaged (pandad.cc:451-456). When engaged, it
    relies on the panda heartbeat timeout.'
- id: SWF-028
  element: SWF-SE-026
  function: SWF-FN-025
  failure_mode: pandad runs against panda firmware that is not the assured reference build
  guideword: commission
  effects:
  - level: local
    description: Panda runs firmware without the reference mode lock, the Toyota TX rate checks or the reference TX whitelist
  - level: next_higher
    description: A wrong mode or param from the host (SWF-022) is accepted. TX rate and whitelist restrictions are absent
  - level: end
    description: Any actuation hazard within an unlocked envelope
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-005
    hazard: HZ-005
    severity: 10
  severity: 10
  safety_mechanisms:
  - description: The signature check confirms only that the panda matches the firmware in panda/board/obj, not that it is a reference build
    ref: openpilot/selfdrive/pandad/pandad.py:16-49
  causes:
  - id: SWF-028.C1
    description: 'pandad.py and up_to_date() compare the panda signature with the panda_h7.bin.signed built from the checkout (pandad.py:16-18, 29-49; panda.cc:116-127).
      At BL-004 that build is not LIONDRIVER_REFERENCE, so the check passes a non-reference firmware. The host does not check a reference-build flag'
    element: SWF-SE-026
    linked_failure_mode: SWF-013
    prevention_controls:
    - description: No build path sets LIONDRIVER_REFERENCE (SWF-013.C2); the release procedure is not defined
      ref: panda/SConscript
    detection_controls:
    - description: No test targets this cause
    occurrence: 8
    detection: 10
    ap: H
    actions:
    - SWF-ACT-028
  - id: SWF-028.C2
    description: 'Test hooks are read from the environment in the production binary. BOARDD_SKIP_FW_CHECK skips the firmware check (pandad.cc:52), STARTED spoofs
      ignition so the car mode is kept with ignition off (pandad.cc:223-225), FAKESEND drops TX, and SPI_ERR_PROB corrupts transfers (spi.cc:280)'
    element: SWF-SE-026
    prevention_controls:
    - description: No launch path sets these variables (grep over launch scripts, manager and tests; only tests set SPI_ERR_PROB and BOARDD_LOOPBACK). Setting them
        needs a shell on the device, which is a cybersecurity and PFMEA concern
      ref: openpilot/system/manager/process_config.py
    detection_controls:
    - description: No test targets this cause
    occurrence: 2
    detection: 10
    ap: H
    actions:
    - SWF-ACT-028
    rationale: The occurrence is credited to process (no launch path sets the hooks). Removing them from release builds (SWF-ACT-028) is the planned treatment, and
      the residual risk is carried by the TARA and the PFMEA.
