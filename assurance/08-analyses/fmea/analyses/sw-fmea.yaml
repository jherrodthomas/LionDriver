        (safety run 91, 20569e9). Checks the configuration and build, not the signed release image'
      test: .github/workflows/safety.yaml
      ref: tools/release/release_variant.sh
    - description: panda host test test_reference_build_reported_in_health_flags (the flag pandad reads is set only in the reference build)
