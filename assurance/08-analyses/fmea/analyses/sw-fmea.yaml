      ref: tools/ci/host_mutants.toml
    - description: 'test_vehicle_dtc.py (each active bit alone, unsupported bit ignored, exempt code, silent, 0x7F 0x19 0x11, malformed, availability 0x30, no
        address, raised error, retry count), run by the CI unit_tests job with mocked UDS responses; not proven by mutation (D 8). Whether the reference car''s
        EPS and ABS/VSC answer 0x19 is open (VS-SQ-20, change record OI-1)'
      test: openpilot/selfdrive/car/tests/test_vehicle_dtc.py
    occurrence: 5
    detection: 4
    ap: H
    actions:
