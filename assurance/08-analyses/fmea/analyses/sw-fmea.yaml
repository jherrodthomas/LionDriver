        (tools/release/release_variant.sh, #80)'
      ref: SConstruct
    - description: 'pandad (reference build) configures a car safety mode only on a panda whose health packet carries HEALTH_FLAG_REFERENCE_BUILD; otherwise the
        panda stays in NOOUTPUT and selfdrived raises controlsMismatch and pandaNotReferenceBuild (panda_safety.cc:73-83, selfdrived.py:380-384; TSR-619, TSR-514).
