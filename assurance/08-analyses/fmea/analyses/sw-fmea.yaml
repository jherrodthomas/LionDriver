  causes:
  - id: SWF-025.C1
    description: 'initFaults(fault_bits.count()) counts every set bit of faults_pkt, but the fill loop maps only bits 0..26 (relayMalfunction..heartbeatLoopWatchdog,
      pandad.cc:257-268). The panda defines bit 27 FAULT_INTERRUPT_RATE_SOUND_DMA (panda/board/sys/sys.h:47, used in stm32h7/sound.h:162-163), and cereal FaultType has
      no entry for it (log.capnp:596-625). When bit 27 is set, the last list entry stays 0 = relayMalfunction'
    element: SWF-SE-024
    prevention_controls:
    - description: 'Fixed in #48 (3534bc2): fill_panda_faults sizes the list from the bits that have a FaultType (mask up to PANDA_FAULT_TYPE_MAX) and
        returns the rest, which are logged, so no entry is left at the default; interruptRateSoundDma @27 added. New C++ with a unit test, -Werror build,
        merged by the owner; no independent review, no C++ static analysis, no documented pandad requirements'
      ref: openpilot/selfdrive/pandad/pandad.cc
    detection_controls:
    - description: 'tests/test_pandad_faults (bit 27 alone and with unknown bits 28/31, only unknown bits, every bit but bit 0, a real relay fault; PANDA_FAULT_TYPE_MAX
        equals the last FaultType in the schema). Built with extras and run by test_native.py in CI unit_tests on every PR. Proven: fails with the old sizing
        (mutation in the impact record). Pass-fail'
      test: openpilot/selfdrive/pandad/tests/test_pandad_faults.cc
      ref: assurance/07-supporting/impact/change-2026-10-13-pandad-fault-mapping.md
    occurrence: 5
    detection: 4
    ap: M
    actions:
    - SWF-ACT-025
    - SWF-ACT-024
  notes: 'Found by code inspection. How often the sound DMA interrupt-rate fault fires on the 3X is unknown; the defect is certain. Related observation: pandad
    publishes the LionDriver fields epsFault, txRateExceeded and requestsRejected (pandad.cc:136-139), but no SoC process reads them (grep over openpilot/*.py),
    so an EPS-fault refusal by the panda reaches the driver only through the stock EPS fault path. That is for EL-04 to decide.'
