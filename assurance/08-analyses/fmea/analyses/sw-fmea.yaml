#   safety setter, the sendcan age gate or the fault mapping, so D=9 where a hardware test exists and D=10 otherwise. No D<=8 is claimed.
# - Severity: hazard-linked effects are 10. SWF-025 and SWF-029 end in a disengagement with an alert (S=8, not linked to a hazard).
# The panda (EL-07, SWF-001..019) bounds most host failures (limits, controls_allowed, 0.3 s heartbeat revocation). It cannot see
