    detection_controls:
    - description: 'Proven by mutation in CI (after BL-007): the tests fail on each hand-written mutant of this cause (CE-1, CE-2),
        tools/ci/host_mutation.py in the tests.yaml unit_tests job; so D 4 (RT-2), from D 8'
      ref: tools/ci/host_mutants.toml
    - description: test_steer_fault_warning.py (7 unittest tests, collected by the unit_tests job); targeted at the escalation, not proven by mutation (D 8 at
        best, RT-2), not on the vehicle
      test: openpilot/selfdrive/car/tests/test_steer_fault_warning.py
    occurrence: 5
    detection: 4
    ap: H
    actions:
    - SWF-ACT-077
    - SWF-ACT-078
  - id: SWF-088.C2
    description: 'Defect in the EPS-fault prompt while the driver keeps steering: after 1.5 s of a fault that started while steering, steerTempUnavailableSilent
      is raised until release, then the take-over request (car_events.py:169-176; TSR-607 (c), DQ-366 A, f350f5b). At BL-005 no event was raised while steering'
    element: SWF-SE-054
    prevention_controls:
    - description: LionDriver change to upstream code with a requirement (TSR-607 (c)) and a targeted unit test; reviewed in the PR, not independently; O 5
      ref: openpilot/selfdrive/car/car_events.py
    detection_controls:
    - description: 'Proven by mutation in CI (after BL-007): the tests fail on each hand-written mutant of this cause (CE-3),
        tools/ci/host_mutation.py in the tests.yaml unit_tests job; so D 4 (RT-2), from D 8'
      ref: tools/ci/host_mutants.toml
    - description: test_steer_fault_warning.py (the steering-held case), collected by the unit_tests job; not proven by mutation, not on the vehicle
      test: openpilot/selfdrive/car/tests/test_steer_fault_warning.py
    occurrence: 5
    detection: 4
    ap: H
    actions:
    - SWF-ACT-077
    - SWF-ACT-078
  safety_mechanisms:
  - description: Panda EPS-fault siren after the EPS reports a fault for 1 s while authority is granted (TSR-516(b), at BL-006 up to 1.26 s from onset); independent
      of the SoC alerts. Since panda bf8102a (after BL-006) the persistence is 0.7 s, at most 0.96 s from onset within the SG-02 1 s budget (DQ-048 A, WP-S-04 OI-8
      closed), and a fault seen while engaged still sounds after authority is revoked (DQ-367, panda#18)
    ref: panda/board/drivers/eps_fault_siren.h
  - description: Envelope refuses lateral actuation from the first EPS-fault frame (TSR-110, reference build), so the item does not steer on a faulted EPS
    ref: opendbc_repo/opendbc/safety/modes/toyota.h
  notes: Realises BE-2.08 with SFM-038 (F-28); System FMEA SFM-038.C1 inherits this occurrence. The panda's epsFault field is still not read by any SoC process
    (SWF-025 notes, SFM-ACT-024). Re-rated at BL-006; D can drop to 4 once SWF-ACT-078 proves the tests.
- id: SWF-089
  element: SWF-SE-005
