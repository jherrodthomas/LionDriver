    - description: No SoC requirement to reduce torque on override (STPA LS-01, OI-2; TSR-304 envelope counterpart not implemented, GAP-02)
      ref: assurance/08-analyses/WP-A-05-stpa.md
    detection_controls:
    - description: No test
    occurrence: 7
    detection: 10
    ap: H
    actions:
    - SWF-ACT-046
  safety_mechanisms:
  - description: Panda torque limit 1500 and rate limits; driver can overpower the EPS (AOU-02, unverified on the Corolla)
  - description: CarController drops lat_active above 500 units of driver torque
    ref: opendbc_repo/opendbc/car/toyota/carcontroller.py
  notes: STPA cites latcontrol_torque.py:92 for the integrator freeze; at BL-004 the line is 121.
- id: SWF-045
  element: SWF-SE-041
  function: SWF-FN-041
  failure_mode: A non-finite input latches the controller state and silently zeroes lateral (or longitudinal) output while engaged
  guideword: corrupted
  effects:
  - level: local
    description: self.desired_curvature and the torque PID integrator become NaN and stay NaN; the sanitiser replaces the outputs with 0
      and only logs (controlsd.py:139-147)
  - level: next_higher
    description: Zero torque (and, for aTarget, zero acceleration) commanded with latActive/longActive true and no event; the HMI and cluster
      still show the item engaged
  - level: end
    description: Loss of lateral control while engaged without a driver warning, for the rest of the drive
    hazard: HZ-004
    severity: 10
  - level: end
    description: No deceleration for a lead while ACC is shown engaged
    hazard: HZ-007
    severity: 10
  - level: end
    description: Driver misinformed about automation state
    hazard: HZ-012
    severity: 10
  severity: 10
  causes:
  - id: SWF-045.C1
    description: 'A NaN desired curvature (modelV2 or lateralManeuverPlan) or roll passes clip_curvature (np.clip propagates NaN, drive_helpers.py:32-41)
      into self.desired_curvature, which is the clip reference for every later frame (controlsd.py:127), so it never recovers, even while
      disengaged; the PID integrator also becomes NaN (pid.py:48-55) and is never reset (SWF-042.C1). Reproduced with the BL-004 clip_curvature
      and PIDController in isolation (scratch probe, not a repo test)'
    element: SWF-SE-041
    prevention_controls:
    - description: Upstream sanitiser replaces non-finite actuators by 0 and logs; TSR-604 (non-finite = fault, immediate disable) not met
        (GAP-19); modeld checks finiteness only for the big model (modeld.py:210)
      ref: assurance/03-system/WP-S-02-technical-safety-requirements.md (TSR-604)
    detection_controls:
    - description: controlsd and card are excluded from the process fuzz test because NaN/inf break them (test_fuzzy.py:10-13); no NaN injection test
      ref: openpilot/selfdrive/test/process_replay/test_fuzzy.py
    occurrence: 6
    detection: 10
    ap: H
    actions:
    - SWF-ACT-041
    - SWF-ACT-044
  - id: SWF-045.C2
    description: A NaN aTarget makes the LongControl PID integrator NaN even with ki=0 (0·NaN), so accel stays NaN, sanitised to 0, until the
      state machine leaves pid (longcontrol.py:56-71)
    element: SWF-SE-043
    prevention_controls:
    - description: Planner clips aTarget (longitudinal_planner.py:149) but np.clip keeps NaN; no finiteness check
    detection_controls:
    - description: test_longcontrol.py covers state transitions only
      ref: openpilot/selfdrive/controls/tests/test_longcontrol.py
    occurrence: 6
    detection: 10
    ap: H
    actions:
    - SWF-ACT-041
    - SWF-ACT-044
  safety_mechanisms:
  - description: None that detects the latch; steerSaturated cannot fire (abs(NaN) comparisons are false); FCW from the planner remains
  notes: Occurrence of a NaN at the inputs is not evidenced; the rating reflects the absence of any guard rather than an observed rate.
- id: SWF-046
  element: SWF-SE-045
  function: SWF-FN-045
  failure_mode: ACC acceleration command differs from controlsd's request (higher, lower or faster changing) within the panda range
  guideword: value_high
  effects:
  - level: local
    description: ACCEL_CMD = request + up to ±1.5 m/s² pitch compensation + CarController PID, clipped to [-3.5, +2.0]
  - level: next_higher
    description: Acceleration or braking stronger than planned, with the jerk limit bypassed by the terms added after it
  - level: end
    description: Unintended acceleration
    hazard: HZ-005
    severity: 10
  - level: end
    description: Unintended or excessive deceleration
    hazard: HZ-006
    severity: 10
  severity: 10
  causes:
  - id: SWF-046.C1
    description: The 4 m/s³ windup/winddown limit is applied before the pitch compensation and the PID (carcontroller.py:197-238), so the sent
      command has no rate limit; pitch comes from CC.orientationNED, which controlsd fills from deviceMotion with no validity check
      (controlsd.py:69-71, 157-159)
    element: SWF-SE-045
    prevention_controls:
    - description: Pitch compensation clipped to ±1.5 m/s² and high-pass filtered; final clip to the panda range (carcontroller.py:231-232, 250).
        No margin below the envelope (TSR-605 partial)
      ref: opendbc_repo/opendbc/car/toyota/carcontroller.py
    detection_controls:
    - description: process_replay covers card on the Corolla segment; not designed for implausible pitch or step requests
      ref: openpilot/selfdrive/test/process_replay/test_processes.py
    occurrence: 6
    detection: 9
    ap: H
    actions:
    - SWF-ACT-045
  - id: SWF-046.C2
    description: controlsd passes aTarget through unchanged up to the panda limits (LongControl is feed-forward for Toyota, ki=kp=0,
      interfaces.py:212-214; limits = ACCEL_MIN/MAX, toyota/interface.py:21-22), so the host adds no margin or jerk bound of its own
    element: SWF-SE-043
    prevention_controls:
    - description: Planner jerk and accel limits only; TSR-605 margin not implemented
      ref: openpilot/selfdrive/controls/lib/longitudinal_planner.py
    detection_controls:
    - description: test_longcontrol.py covers state transitions, not limits
      ref: openpilot/selfdrive/controls/tests/test_longcontrol.py
    occurrence: 7
    detection: 10
    ap: H
    actions:
    - SWF-ACT-045
  safety_mechanisms:
  - description: Panda acceleration range check [-3.5, +2.0] (SWF-003); no jerk check in the panda (SWF-004)
  - description: PCM limits requested acceleration (AOU-05, unverified); selfdrived ExcessiveActuationCheck soft-disable
- id: SWF-047
  element: SWF-SE-046
  function: SWF-FN-047
  failure_mode: Control step late, repeated or missing, or item frames dropped, while engaged
  guideword: late
  effects:
  - level: local
    description: card reuses the last carControl for up to 0.1 s, then sends no item frames; or the panda blocks frames the host believes sent
  - level: next_higher
    description: Stale torque target applied for up to 10 frames, then STEERING_LKA/ACC_CONTROL stop and the EPS/PCM time out
  - level: end
    description: Abrupt loss of steering assist in a curve; the soft-disable alert comes at the same time, not before
    hazard: HZ-004
    severity: 10
  severity: 10
  causes:
  - id: SWF-047.C1
    description: controlsd raises on input it does not guard, e.g. int(NaN) when lateralDelay is not finite (latcontrol_torque.py:100), and
      exits; the 100 Hz loop has no exception handling (controlsd.py:227-233)
    element: SWF-SE-041
    prevention_controls:
    - description: Upstream review, ruff, ty; excluded from fuzzing (test_fuzzy.py:13)
    detection_controls:
    - description: No test injects non-finite lateralDelay
    occurrence: 6
    detection: 10
    ap: H
    actions:
    - SWF-ACT-041
    - SWF-ACT-044
  - id: SWF-047.C2
    description: Loop overrun or scheduling delay (Python, CTRL_HIGH on core 4, controlsd.py:237); Ratekeeper only monitors (228-233) and the loop
      is paced by selfdriveState; card actuates the latest carControl each CAN cycle as long as it is alive within 10 periods (card.py:234;
      cereal/messaging/__init__.py:265)
    element: SWF-SE-046
    prevention_controls:
    - description: Real-time priority and core pinning; upstream CPU budget (test_onroad.py:46, 16 % for controlsd)
      ref: openpilot/selfdrive/test/test_onroad.py
    detection_controls:
    - description: test_onroad test_timings checks carControl/controlsState period (max/min and RSD); targeted at this cause but needs device
        hardware (Jenkinsfile:265) and is not run by LionDriver CI
      test: openpilot/selfdrive/test/test_onroad.py
    occurrence: 6
    detection: 8
    ap: H
    actions:
    - SWF-ACT-048
  - id: SWF-047.C3
    description: CarController torque limits equal the panda limits (values.py:20-21, 46-47 vs safety/modes/toyota.h:269-274), so any rounding or future
      change of one side (SWF-ACT-003) makes the panda block frames; the host never reads pandaState.safetyTxBlocked (published at pandad.cc:112,
      no consumer), so blocked frames show only as EPS LKA time-outs
    element: SWF-SE-045
    prevention_controls:
    - description: Constants copied from the same source; no consistency check between host and panda limits
      ref: opendbc_repo/opendbc/car/toyota/values.py
    detection_controls:
    - description: opendbc test_models::test_panda_safety_tx_cases sends only inactive, cancel and resume CarControl through the panda model and
        is not run in LionDriver CI
      ref: opendbc_repo/opendbc/car/tests/test_models.py
    occurrence: 5
    detection: 10
    ap: H
    actions:
    - SWF-ACT-043
    - SWF-ACT-044
  safety_mechanisms:
  - description: card stops actuating 0.1 s after carControl stops (card.py:234); selfdrived commIssue/processNotRunning soft-disable alert;
      EPS LKA message time-out (vehicle)
    ref: openpilot/selfdrive/car/card.py
  - description: Per-ID TX rate supervision exists only in the reference build (opendbc#10, panda#13) and is not credited at BL-004
- id: SWF-048
  element: SWF-SE-041
  function: SWF-FN-046
  failure_mode: PCM cruise cancel not requested, or not effective, when the item is not enabled
  guideword: omission
  effects:
  - level: local
    description: CANCEL_REQ not set while CS.cruiseState.enabled and the item is disengaged
  - level: next_higher
    description: PCM cruise stays engaged; the panda keeps controls allowed until the heartbeat-mismatch revoke (about 3 s)
  - level: end
    description: Stock/PCM cruise active while the driver believes the item is off
    hazard: HZ-012
    severity: 10
  - level: end
    description: Control not released when the driver cancels through the device
    hazard: HZ-008
    severity: 10
  severity: 10
  causes:
  - id: SWF-048.C1
    description: 'cancel = CS.cruiseState.enabled and not CC.enabled (controlsd.py:162), where CC.enabled is the unchecked selfdriveState
      (SWF-040.C1), and it is sent only inside the 33 Hz ACC_CONTROL frame (carcontroller.py:187, 253) while card is actuating. The
      selfdrived backstop does nothing: cruiseMismatch fires after 6 s (selfdrived.py:423-426) but has no alert or disable type
      (events.py:458-460, commented out)'
    element: SWF-SE-041
    prevention_controls:
    - description: Upstream review and lint
    detection_controls:
    - description: opendbc test_models checks that a cancel frame passes the panda model, not that cancel is requested on each disengagement
        path; not run in LionDriver CI
      ref: opendbc_repo/opendbc/car/tests/test_models.py
    occurrence: 6
    detection: 9
    ap: H
    actions:
    - SWF-ACT-040
    - SWF-ACT-049
  safety_mechanisms:
  - description: PCM cancels on brake (XM-03, external); panda withdraws controls on brake and PCM cruise off, and on heartbeat mismatch
      after about 3 s
- id: SWF-049
  element: SWF-SE-041
  function: SWF-FN-041
  failure_mode: Desired curvature taken from the developer lateral-maneuver plan instead of the driving model
  guideword: wrong_mode
  effects:
  - level: local
    description: Scripted curvature steps and sine/jitter maneuvers (±0.5 m/s² and more) are commanded; a stopped publisher leaves its last
      curvature in use
  - level: next_higher
    description: Lateral control no longer follows the lane
  - level: end
    description: Vehicle steered off the lane path at normal magnitude
    hazard: HZ-003
    severity: 10
  severity: 10
  causes:
  - id: SWF-049.C1
    description: 'controlsd uses lateralManeuverPlan whenever its last message was valid (controlsd.py:123-124), with no alive check (SubMaster
      valid changes only on receipt, cereal/messaging/__init__.py:261) and no check of the mode; selfdrived ignores lateralManeuverPlan in its
      alive/valid checks (selfdrived.py:85). The path is enabled by the LateralManeuverMode developer toggle (process_config.py:43-44, 109;
      developer.py:134, offroad only; cleared at manager start and offroad, params_keys.h:87)'
    element: SWF-SE-041
    prevention_controls:
    - description: Operational rule only (WP-V-07 bans developer modes; INS-19 reference parameters); TSR-613 (path absent from reference
        builds) not met (GAP-20). Permanent "Lateral Maneuver Mode" banner when active (selfdrived.py:184-186)
      ref: assurance/03-system/WP-S-02-technical-safety-requirements.md (TSR-613)
    detection_controls:
    - description: No test checks that the path is absent or inactive in the shipped configuration
    occurrence: 7
    detection: 10
    ap: H
    actions:
    - SWF-ACT-047
  safety_mechanisms:
  - description: lateral_maneuversd aborts on steering or gas press; processNotRunning soft-disable if it crashes while the toggle is set;
      panda torque limits
  notes: Occurrence rated on the prevention controls (none technical), not on how often a user enables developer mode.
actions:
- id: SWF-ACT-001
  kind: detection
  description: Run the opendbc safety suite and the mutation tests as a blocking gate in LionDriver CI for every change and submodule bump
  owner: Jherrod Thomas
  status: completed
  evidence: '.github/workflows/safety.yaml (CR-CI-05, merged from liondriver-dev): safety tests with 100% line coverage, MISRA and mutation jobs on push and pull
    request. Branch protection making them blocking is not verified here'
  revised:
    severity: 10
    occurrence: 5
    detection: 3
    ap: H
- id: SWF-ACT-002
  kind: prevention
  description: Requirements-based tests for the panda safety model, traced to the draft TSRs and SWSRs (assurance WP-S-02, WP-W-02); the requirements exist as drafts,
    the tests do not
  owner: Jherrod Thomas
  status: open
  revised:
    severity: 10
    occurrence: 3
    detection: 3
    ap: L
- id: SWF-ACT-003
  kind: design_change
  description: Derive steering and acceleration envelopes from vehicle measurements (FSC FOI-001, DFA DM-10) and set panda limits from them, independently of the
    SoC limits
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-004
  kind: design_change
  description: Implement the panda configuration lock (LD-DES-001 DR-01..DR-07, DR-05 for ELM327)
  owner: Jherrod Thomas
  status: in_progress
  evidence: Implemented for the reference build in panda#4 (9f60e17); D-12 decided. Build flag and release procedure open (SWF-ACT-009)
- id: SWF-ACT-005
  kind: design_change
  description: Add an acceleration-rate (jerk) check to the panda longitudinal checks, or justify the absence with characterized powertrain rate limits (OI-002)
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-006
  kind: detection
  description: Verify on the vehicle that the PCM cancels cruise on brake (FSC FOI-006) so PCM_CRUISE can be credited as the diverse brake path; add a safety test
    for brake-without-cruise-cancel
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-007
  kind: design_change
  description: Derive RX-lag and heartbeat timeouts from the FTTI and check them at 8 Hz or faster while controls are allowed (LD-DES-001 DR-20)
  owner: Jherrod Thomas
  status: in_progress
  evidence: 'RX lag: 5 periods at 100 Hz (opendbc#1, panda#3). Heartbeat loss: 0.3 s at 100 Hz (panda#7, BL-003). Engaged mismatch still about 3 s at 1 Hz; FTTI derivation
    open'
- id: SWF-ACT-008
  kind: detection
  description: Add a unit or static check that every host TX path calls can_send with skip_tx_hook=false
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-009
  kind: design_change
  description: 'Make LIONDRIVER_REFERENCE=1 (with RELEASE=1) the only firmware build used for the reference configuration: set it in openpilot''s panda build and
    the release procedure, and have the host check it (e.g. a version or health flag) before engaging'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-010
  kind: design_change
  description: Restrict ELM327 TX to the UDS services fingerprinting and radar disable need, and refuse it above standstill (WP-W-04 OI-6)
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-011
  kind: detection
  description: Confirm the LSI range from the STM32H725 datasheet and run the watchdog HIL test (test_10_hw_watchdog) on the bench, including a long soak for spurious
    resets (D-04)
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-020
  kind: design_change
  description: 'Bind the heartbeat to the command path. Send engaged=1 only while selfdriveState is enabled and the forwarding thread has sent a sendcan batch less
    than 0.1 s ago, or add a sequence or age field the panda checks (TSR-409, TSR-602). Coordinate with SWF-ACT-007 (panda engaged-mismatch at 0.3 s)'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-021
  kind: design_change
  description: 'Make link failure bounded and visible. Send the heartbeat independently of the health read. Give control transfers a finite timeout and bound the
    fail-recovery loop. Clear connected and exit on a persistent failure. Do not reset or DFU-recover the internal panda from pandad.py while onroad unless needed.
    In selfdrived (EL-04), raise the controlsAllowed-mismatch alert within 0.1-0.2 s instead of 200 frames'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-022
  kind: design_change
  description: 'Host allow-list for the reference configuration (TOYOTA, param 73, alternative experience 0) before 0xdc/0xdf. Read back the mode, param and
    alternative experience from health, and set safety_configured_ only on a match. Retry or refuse ControlsReady on a mismatch'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-023
  kind: design_change
  description: 'Derive the sendcan maximum age from the FTTI and the control period (e.g. 0.1 s). Compare it in one clock domain (stamp with CLOCK_BOOTTIME, or compare
    with CLOCK_MONOTONIC). After a stall, keep only the newest frame per address instead of replaying the backlog. Decide whether events with valid=false are
    forwarded'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-024
  kind: detection
  description: 'Add host unit tests for the pandad logic, run in CI (unit_tests via test_native.py): the sendcan age gate including the clock domain, the heartbeat
    engaged derivation, the fault-bit mapping, and the safety setter sequence and readback, using a fake Panda. Show they fail on mutated gates so D can be rated as proven'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-025
  kind: design_change
  description: 'Fix the faults mapping. Size the list from the mapped bits only, log unknown bits, and add the panda bit 27 (interruptRateSoundDma) to cereal FaultType
    (log.capnp, pandad.cc:257-268)'
  owner: Jherrod Thomas
  status: in_progress
  evidence: 'Implemented in jherrodthomas/LionDriver#48 (fill_panda_faults, interruptRateSoundDma @27, tests/test_pandad_faults run by test_native.py; fails
    with the old sizing). Impact record assurance/07-supporting/impact/change-2026-10-13-pandad-fault-mapping.md. Completed on merge'
  revised:
    severity: 8
    occurrence: 2
    detection: 8
    ap: M
- id: SWF-ACT-026
  kind: design_change
  description: 'Report frames that pandad drops (age gate, failed bulk write) in pandaStates or a pandad event, and have selfdrived disable with an alert while
    engaged (closes System FMEA SFM-005.C2 and SFM-011.C2 on the host side)'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-027
  kind: design_change
  description: 'Replace the XOR checksums on the SPI link with a CRC (host spi.cc and panda firmware), or justify XOR with a residual-error analysis that uses
    the measured SPI error rate (spi_error_count) and the Toyota message checksum as a diverse check'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-028
  kind: design_change
  description: 'Build and flash only the LIONDRIVER_REFERENCE firmware for the reference configuration, and have pandad check a reference-build flag or version
    before setting a car mode (with SWF-ACT-009). Compile out BOARDD_SKIP_FW_CHECK, STARTED, FAKESEND, SPI_ERR_PROB and BOARDD_LOOPBACK in release builds'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-029
  kind: detection
  description: 'Run the pandad hardware tests (test_pandad.py, test_pandad_spi.py, test_pandad_loopback.py) on a comma 3X before release. While engaged on a bench,
    inject: stopping selfdrived, controlsd and card; killing or hanging pandad; SPI errors; and a panda reset. Measure the time to no output and to the SoC alert
    (FSR-007 verification, D-04)'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-030
  kind: prevention
  description: 'Requirements-based tests for selfdrived traced to FSR-030/033/034/036 and TSR-601/606/617/621: state machine, data_sample/update_events with
    synthetic carState, pandaStates and SubMaster faults (brake, cancel, stale or missing services, panda mismatch), helpers.py and alert priority; prove them
    with a mutation run on state.py, selfdrived.py and helpers.py'
  owner: Jherrod Thomas
  status: open
  revised:
    severity: 10
    occurrence: 5
    detection: 4
    ap: H
- id: SWF-ACT-031
  kind: design_change
  description: 'Reference-configuration guard: refuse engagement (permanent NO_ENTRY) when REPLAY, SIMULATION or TESTING_CLOSET is set or the big-model (chestnut)
    path is active, and exclude that path from reference builds (TSR-603, TSR-613)'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-032
  kind: design_change
  description: Supervise carState freshness in selfdrived (age of the last message, at most 2 periods) and raise an immediate disable when it is stale, instead of
    reusing the previous carState
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-033
  kind: design_change
  description: 'Panda status supervision per TSR-615, TSR-621 and TSR-626a: controlsMismatch within 2 samples and 0.5 s (time-based); safety model/parameter
    mismatch as NO_ENTRY from start instead of a 10 s grace; pandaStates older than 0.2 s treated as mismatch; immediate disable on heartbeatLost, rising
    safetyTxBlocked, txRateExceeded and any panda fault flag'
  owner: Jherrod Thomas
  status: in_progress
  evidence: "controlsMismatch within 2 consecutive samples and 0.5 s done (selfdrived/supervision.py, unit tests; impact record change-2026-10-13-host-supervision.md). Open: safety-model mismatch as NO_ENTRY from start, pandaStates age"
- id: SWF-ACT-034
  kind: design_change
  description: Give cruiseMismatch a warning and an ACC cancel retry within 1 s (TSR-308, GAP-19)
  owner: Jherrod Thomas
  status: completed
  evidence: "cruiseMismatch after 1 s with a repeating prompt; controlsd keeps requesting the cancel (change-2026-10-13-host-supervision.md). Vehicle check under SWF-ACT-049"
- id: SWF-ACT-035
  kind: design_change
  description: 'Classify reactions per TSR-601 (immediate disable for loss or staleness of a control-law input) and justify each remaining SOFT_DISABLE against
    the FTTI (SFM-016, GAP-16); make soft-disable and mismatch timers time-based (monotonic clock); move blocking Params writes out of the 100 Hz loop'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-036
  kind: design_change
  description: Rank soft and immediate disable takeover alerts above every WARNING and PERMANENT alert except FCW, keep the takeover sound when an AEB alert is shown,
    name the fault class in the text (canError, TSR-606), and add a test of the ordering
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-037
  kind: design_change
  description: 'selfdrived liveness: ui and soundd raise the critical takeover alert within 0.5 s of missing selfdriveState while engaged (EL-05 change, TSR-622);
    add a process watchdog for selfdrived; remove selfdrived from the fuzz NOT_TESTED list'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-038
  kind: design_change
  description: 'Revisit TSR-617: set excessive-actuation thresholds from the vehicle envelope and fork drive logs, bound the device_motion_valid reset, check
    longitudinal response during override, and add unit tests for helpers.py'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-039
  kind: design_change
  description: 'Resolve FSR-033 against the implementation: either revise FSR-033 to the actual yield strategy (integrator freeze, panda bound, override force
    verified by the FSR-031 vehicle test) or ramp the torque request down while steeringPressed'
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-040
