failure_modes:
- id: SWF-001
  element: SWF-SE-006
  function: SWF-FN-002
  failure_mode: Steering request above the torque or torque-rate limit for the vehicle is passed
  guideword: value_high
  effects:
  - level: local
    description: Out-of-envelope torque request reaches the EPS
  - level: next_higher
    description: Lateral deviation faster than the driver can correct
  - level: end
    description: Uncontrollable steering intervention
    hazard: HZ-002
    severity: 10
  severity: 10
  causes:
  - id: SWF-001.C1
    description: Panda torque limits (max 1500, rate up 15 / down 25, error 350) are the same constants as the SoC controller's and are not derived from a vehicle
      envelope
    element: SWF-SE-008
    prevention_controls:
    - description: Limits copied from upstream vehicle tuning; no independent envelope (FSC FOI-001, DFA DFI-08)
      ref: opendbc_repo/opendbc/safety/modes/toyota.h:172-177; opendbc_repo/opendbc/car/toyota/values.py:20-50
    detection_controls:
    - description: No test targets this cause
    occurrence: 6
    detection: 9
    ap: H
    actions:
    - SWF-ACT-003
  - id: SWF-001.C2
    description: Implementation defect in steer_torque_cmd_checks or dist_to_meas_check
    element: SWF-SE-006
    prevention_controls: &id001
    - description: MISRA C:2012 checks on the safety code
      ref: opendbc_repo/opendbc/safety/tests/misra
    - description: 100% line coverage enforced by the safety test runner
      ref: opendbc_repo/opendbc/safety/tests/test.sh
    - description: Upstream code review; no documented safety requirements for the safety model (tests derived from implementation)
    detection_controls: &id002
    - description: opendbc safety suite with 100% line coverage and mutation tests, run by fork CI on every change (.github/workflows/safety.yaml, CR-CI-05). At BL-002
        the Toyota tests pass locally (287, 34 skipped); mutation was last run locally at BL-001 (2705/2705 killed). Tests are derived from the implementation, not
        from requirements
      test: opendbc_repo/opendbc/safety/tests/test_toyota.py
      ref: opendbc_repo/opendbc/safety/tests/mutation.py; .github/workflows/safety.yaml
    occurrence: 5
    detection: 3
    ap: H
    actions:
    - SWF-ACT-002
  - id: SWF-001.C3
    description: Wrong EPS torque factor in the host-supplied safety parameter scales measured torque, widening the measured-torque-error check
    element: SWF-SE-012
    prevention_controls:
    - description: 'Reference-build lock: 0xdc accepts TOYOTA only with parameter 73 (no flags) and, once TOYOTA is active, only NOOUTPUT or SILENT; 0xdf refused
        (reference_lock.h, panda#4, TSR-512/513). BL-005: the default build since #36 (SConstruct:272-283), so the lock is in the firmware pandad flashes (SWF-013.C2)'
      ref: panda/board/reference_lock.h
    detection_controls: &id003
    - &id004
      description: 'Host unit tests compiled against the real firmware headers, run by panda CI (test.sh): reference_lock and hw_watchdog, 14 tests, pass at BL-002
        locally. Not on target hardware'
      test: panda/tests/reference_lock/test_reference_lock.py
      ref: panda/tests/hw_watchdog/test_hw_watchdog.py
    occurrence: 3
    detection: 4
    ap: L
    actions:
    - SWF-ACT-009
  safety_mechanisms:
  - description: Panda torque magnitude, rate and measured-torque-error checks block the frame
    ref: opendbc_repo/opendbc/safety/lateral.h
  - description: EPS limits LKA torque itself (external measure, AOU-01, unverified)
- id: SWF-002
  element: SWF-SE-006
  function: SWF-FN-002
  failure_mode: Steering torque passed while controls are not allowed
  guideword: commission
  effects:
  - level: local
    description: Torque request reaches the EPS outside an engagement
  - level: next_higher
    description: Unexpected steering input
  - level: end
    description: Unintended steering while not engaged
    hazard: HZ-001
    severity: 10
  severity: 10
  causes:
  - id: SWF-002.C1
    description: Defect in the not-allowed torque check (lateral.h:111-114) or in controls_allowed bookkeeping
    element: SWF-SE-006
    prevention_controls: *id001
    detection_controls: *id002
    occurrence: 5
    detection: 3
    ap: H
    actions:
    - SWF-ACT-002
  notes: Depends on controls_allowed being correct; see SWF-007..SWF-009. Steering only, so its effects cite HZ-001 and not HZ-006 or HZ-010
    (lint warnings from FTA BE-1.25, which also cites it in the SG-03 and SG-04 trees). The controls_allowed bookkeeping part of SWF-002.C1
    reaches longitudinal authority and engagement only through SWF-007..SWF-009, which carry HZ-010 and HZ-006.
  safety_mechanisms:
  - description: Panda blocks non-zero torque and the steer-request bit while controls are not allowed
    ref: opendbc_repo/opendbc/safety/lateral.h
- id: SWF-003
  element: SWF-SE-007
  function: SWF-FN-003
  failure_mode: Acceleration request outside the intended envelope is passed
  guideword: value_high
  effects:
  - level: local
    description: Acceleration request beyond the item design reaches the powertrain
  - level: next_higher
    description: Vehicle accelerates or brakes harder than designed
  - level: end
    description: Unintended acceleration or excessive deceleration
    hazard: HZ-005
    severity: 10
  - level: end
    description: Contributes to HZ-006
    hazard: HZ-006
    severity: 10
  severity: 10
  causes:
  - id: SWF-003.C1
    description: Panda upper bound +2.0 m/s² equals the SoC limit (RAISED_ACCEL_LIMIT is set for every TSS2 car, values.py:39-43) and is not derived from a validated
      Corolla envelope; no margin between controller and envelope
