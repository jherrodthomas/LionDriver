# yaml-language-server: $schema=../schema/fmea.schema.json
# Panda safety model rows (SWF-001..019): ratings per RT-1, against BL-003 (panda c2e5d93, opendbc 5b5a4ba).
# - Implementation defects in the opendbc safety core: O=5 (MISRA, 100% line coverage, review, no documented requirements),
#   D=3 (the suite, coverage gate and mutation tests run in fork CI on every change: proven, early, test-to-fail).
# - LionDriver reference-build lock (panda#4): O=3, D=4 (host unit tests in panda CI, not on target). The lock is compiled
#   only with LIONDRIVER_REFERENCE=1, which no build path sets yet (SWF-013.C2, O=8 D=9).
# - Design gaps with no targeted test: O=6-8, D=9. New watchdog failure modes SWF-018/019: HIL test not run (D=7-8).
# Severity is 10 for every row (hazard-linked effects, RT-1 §1.1). Four causes are AP L (S10 O3 D4): wrong mode, wrong
# parameter and wrong brake flag, which the reference lock prevents only in a reference build (the build itself is
# SWF-013.C2, AP H), and heartbeat loss, revoked after 0.3 s since panda#7.
# History: rev 0.2 first rating at BL-001; rev 0.3 SWF-003.C1 corrected and moved under assurance/; rev 0.4 re-rated at
# BL-002; rev 0.5 at BL-003: SWF-014 split into heartbeat loss (0.3 s, panda#7) and control-loop stall. The narrative analysis of record is assurance/05-software/WP-W-04.
# rev 0.6 at BL-004: host elements added (pandad SWF-020..029, selfdrived SWF-030..039, controlsd and the Toyota CarController
# hand-off SWF-040..049), all AP H: upstream code without requirements or proven tests (O 5-8, D 8-10); no field-exposure credit.
# The panda rows SWF-001..019 keep their BL-003 ratings: every BL-004 firmware change except the IRQ priorities (panda#10) is
# compiled only into the LIONDRIVER_REFERENCE build, which no build path sets at BL-004 (SWF-013.C2).
#
# SW FMEA element pandad (FSC EL-06, System FMEA SFM-SE-017). Ratings per RT-1, against BL-004 (liondriver-dev 682f184,
# panda 8aa8671, opendbc 7993399). The LIONDRIVER_REFERENCE firmware build is not enabled by any build path at BL-004, so the
# reference lock, the Toyota TX rate checks (toyota.h:545-558) and the reference TX whitelist are not credited.
# - pandad is upstream openpilot C++/Python. LionDriver changed only the health logging and four pandaState fields
#   (pandad.cc:183-212, 136-139). Prevention: upstream review, -Werror build (SConstruct:133-140), ruff/ty on pandad.py. No C++
#   static analysis, no documented pandad requirements, no field-exposure evidence for this configuration. Defects: O=6-7.
#   Design gaps present in the code: O=8.
# - Detection: CI runs only test_pandad_canprotocol (pack/unpack, test_native.py). test_pandad.py, test_pandad_spi.py and
#   test_pandad_loopback.py are COMMA_HARDWARE_TEST (skipped on PC, not run for BL-004). Nothing tests the heartbeat, the
#   safety setter, the sendcan age gate or the fault mapping, so D=9 where a hardware test exists and D=10 otherwise. No D<=8 is claimed.
# - Severity: hazard-linked effects are 10. SWF-025 and SWF-029 end in a disengagement with an alert (S=8, not linked to a hazard).
# The panda (EL-07, SWF-001..019) bounds most host failures (limits, controls_allowed, 0.3 s heartbeat revocation). It cannot see
# stale in-limit commands or a wrong mode the host asks for, so most causes stay AP H.
#
# SW FMEA element: selfdrived (FSC EL-04 supervision, System FMEA SFM-SE-014). Ratings per RT-1, against BL-004
# (liondriver-dev 682f184, panda 8aa8671, opendbc 7993399). Code is upstream openpilot; the only LionDriver change in the
# element is the pandaWatchdogReset event (#30). No field-exposure credit (RT-1 §2.2): no evidence for this configuration.
# - Implementation defects: O=6 where unit tests exist (state.py: test_state_machine; alertmanager.py), O=7 where none do
#   (selfdrived.py event generation, helpers.py); prevention is upstream review + ruff + ty (scripts/lint/lint.sh, CI
#   static_analysis). No software requirements for selfdrived; tests are derived from the implementation.
# - Causes present by design (the code does what it was written to do, and an FSC/TSR requirement is not met) are O=8,
#   as SWF-004.C1 and SWF-013.C2. Configuration-dependent causes are O=2-4.
# - Detection: the selfdrived unit tests run in fork CI (tests.yaml unit_tests, tools/test_runner.py) but none is proven
#   by mutation or fault injection, so D=8 at best; process_replay (tests.yaml) is a generic regression check (D=9);
#   no test exercises helpers.py, data_sample() or the input supervision in update_events() (D=10).
# Severity is 10 for every row (hazard-linked end effects). The panda (EL-07, SWF-001..019) bounds most host failures; it
# is listed as a safety mechanism and does not lower RT-1 severity. pandaNotReferenceBuild does not exist at BL-004.
#
# SW FMEA host element: controlsd, lateral/longitudinal controllers and the carControl -> Toyota CarController hand-off.
# FSC element EL-03 (QM), System FMEA SFM-SE-013. Ratings per RT-1, against BL-004 (liondriver-dev 682f184, panda 8aa8671,
# opendbc 7993399). Corolla TSS2 uses LatControlTorque (no ANGLE_CONTROL flag; toyota/interface.py:45-50) and openpilot longitudinal.
# - Occurrence: upstream openpilot/opendbc host code, not changed by LionDriver; review, ruff + ty in CI (scripts/lint/lint.sh),
#   unit tests exist but are not requirements-based; no field-exposure credit (RT-1 §2.2). O=6 for implementation/handling causes,
#   O=7 for design gaps (TSR-602/604/605/613, TSR-304 recorded as not met); O=5 for SWF-047.C3 (limits identical today).
# - Detection: no host test is proven on an injected instance. D=9 where a CI test exercises the code but is not designed for the
#   cause (process_replay on the TOYOTA3 Corolla TSS2 segment, tests.yaml:114-130, compares against refs made from the same code, so it
#   cannot find a defect already present at the baseline); D=10 where nothing exercises the cause (stale inputs, NaN, loop stalls:
#   controlsd and card are excluded from the fuzz test, test_fuzzy.py:13). D=8 only for test_onroad timing (targeted, device-only, not run).
# - Severity 10 for every row (hazard-linked end effects, RT-1 §1.1). The panda (EL-07, SWF-001..019) bounds torque magnitude/rate and
#   the acceleration range but not lane-keeping quality, jerk or input freshness, so it lowers what these failures can do without
#   removing the hazardous event. Reference-build features (TX rate supervision, EPS-fault refusal) not credited. All 17 causes AP H.
schema_version: 1
analysis:
  id: SWF
  type: sw_fmea
  title: "SW FMEA — safety-relevant software elements"
  revision: "0.6"
  status: draft
  baseline: BL-004
  rating_tables: RT-1
  scope: "P1 elements for AC-001 at BL-004 (liondriver-dev 682f184, panda 8aa8671, opendbc 7993399): panda safety model (opendbc safety core, Toyota mode, panda firmware integration incl. hardware watchdog; rated at BL-003, unchanged at BL-004 outside the reference build), pandad (SWF-020..029), selfdrived (SWF-030..039), controlsd with the Toyota CarController hand-off (SWF-040..049)."
  team:
    - {name: Jherrod Thomas, role: "Project maintainer, safety lead (reviewer/approver)"}
    - {name: Claude (AI assistant), role: "Drafting assistance; ratings require human review"}
  references:
    - assurance/08-analyses/fmea/fmea-plan.md
    - assurance/08-analyses/fmea/rating-tables.md
    - assurance/08-analyses/fmea/analyses/fsc.yaml
    - assurance/08-analyses/fmea/design/panda-config-lock-and-fw-authenticity.md
    - assurance/05-software/WP-W-04-software-safety-analysis.md
    - assurance/07-supporting/impact/change-2026-10-12-panda-hw-watchdog.md
    - assurance/07-supporting/impact/change-2026-10-12-panda-safety-mode-lock.md
    - assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-rx-timeout.md
    - assurance/07-supporting/impact/change-2026-10-12-opendbc-toyota-tx-whitelist.md
  updated: 2026-10-13
structure:
- id: SWF-SE-001
  name: Panda safety model (opendbc safety + panda firmware integration)
  kind: sw_element
  parent: null
  paths:
  - opendbc_repo/opendbc/safety
  - panda/board
  description: FSC element EL-07 software; System FMEA SFM-SE-003
- id: SWF-SE-002
  name: RX validation and RX timing checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: rx_msg_safety_check, is_msg_valid, safety_tick (safety.h:112-228, 321-344)
- id: SWF-SE-003
  name: TX whitelist and dispatch
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: safety_tx_hook, tx_msg_safety_check (safety.h:230-253)
- id: SWF-SE-004
  name: Forwarding hook
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: safety_fwd_hook, get_fwd_bus (safety.h:255-289)
- id: SWF-SE-005
  name: Controls-allowed logic
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: generic_rx_checks, pcm_cruise_check (safety.h:350-370, 518-527)
- id: SWF-SE-006
  name: Steering torque checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/lateral.h
  description: steer_torque_cmd_checks, dist_to_meas_check, rt_torque_rate_limit_check (lateral.h:10-150)
- id: SWF-SE-007
  name: Longitudinal checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/longitudinal.h
  description: get_longitudinal_allowed, longitudinal_accel_checks (longitudinal.h:3-12)
- id: SWF-SE-008
  name: Toyota safety mode
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/modes/toyota.h
  description: toyota_rx_hook, toyota_tx_hook, toyota_init, TX/RX check tables (toyota.h)
- id: SWF-SE-009
  name: Relay malfunction detection
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: stock_ecu_check, relay_malfunction (safety.h:346, 372-385)
- id: SWF-SE-010
  name: Safety mode registry and initialization
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: set_safety_hooks (safety.h:391-484)
- id: SWF-SE-011
  name: 'Panda main loop: safety mode and heartbeat'
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/main.c
  description: set_safety_mode, tick_handler heartbeat and mismatch logic (main.c:31-76, 101-230)
- id: SWF-SE-012
  name: Panda host command handler
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/main_comms.h
  description: 0xdc set safety mode, 0xdf alternative experience, 0xd1 bootloader, 0xf3 heartbeat (main_comms.h)
- id: SWF-SE-013
  name: Panda CAN send path
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/drivers/can_common.h
  - panda/board/can_comms.h
  description: can_send with skip_tx_hook (can_common.h:161-176); host TX entry (can_comms.h:97,118)
- id: SWF-SE-014
  name: Panda hardware watchdog and 100 Hz safety task
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/drivers/hw_watchdog.h
  - panda/board/main.c
  description: 'IWDG start on first relay drive, window-mode feed from the safety task only after main-loop progress (hw_watchdog.h; main.c safety_task_handler);
    added in BL-002 (panda#1, #3)'
- id: SWF-SE-020
  name: pandad (panda daemon and SoC-panda link)
  kind: sw_element
  parent: null
  paths:
  - openpilot/selfdrive/pandad
  description: FSC element EL-06 (QM); System FMEA SFM-SE-017. C++ daemon pandad (main.cc, pandad.cc, panda_safety.cc, panda.cc, spi.cc) started by the Python
    launcher and firmware flasher pandad.py. One internal panda over SPI only (pandad.py:96, pandad.cc:463-469).
- id: SWF-SE-021
  name: Main loop and heartbeat
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/pandad.cc
  - openpilot/selfdrive/pandad/main.cc
  description: 'pandad_run 100 Hz loop (pandad.cc:397-459). engaged = selfdriveState alive, valid and enabled, evaluated at 10 Hz (pandad.cc:421-430). The heartbeat
    0xf3 is sent at the end of process_panda_state (pandad.cc:298-314, panda.cc:137-139). On exit the panda is set to NO_OUTPUT only if onroad and not engaged (pandad.cc:451-456).
    RT priority 54 on core 3 (main.cc:107-113)'
- id: SWF-SE-022
  name: Safety mode setter
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/panda_safety.cc
  - openpilot/selfdrive/pandad/pandad.cc
  description: 'PandaSafety::configureSafetyMode (panda_safety.cc:5-70). Onroad: ELM327 param 1, then the OBD multiplexing toggle, then (after FirmwareQueryDone and
    ControlsReady) alternative experience 0xdf and safety_configs[0] model/param 0xdc, once per onroad session. NO_OUTPUT when the panda is in SILENT or when
    offroad or ignition is off (pandad.cc:229-243)'
- id: SWF-SE-023
  name: sendcan forwarding thread
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/pandad.cc
  - openpilot/selfdrive/pandad/panda.cc
  - openpilot/selfdrive/pandad/pandad_api_impl.py
  description: 'can_send_thread (pandad.cc:59-87): FIFO subscriber on sendcan (non-conflated, MEDIUM queue). Frames are dropped if logMonoTime is 1 s or more old. Then
    pack_can_buffer/can_send (panda.cc:168-214). The sendcan timestamp is set by can_list_to_can_capnp (pandad_api_impl.py:42)'
- id: SWF-SE-024
  name: CAN RX and panda state publishing
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/pandad.cc
  - openpilot/selfdrive/pandad/panda.cc
  description: 'can_recv (pandad.cc:89-106) and can_receive/unpack_can_buffer (panda.cc:216-282) publish can at 100 Hz, with no per-frame RX time. send_panda_states
    (pandad.cc:170-272) and fill_panda_state (pandad.cc:108-140) publish pandaStates at 10 Hz: mode, param, controlsAllowed, safetyRxChecksInvalid, faults, heartbeatLost,
    watchdogReset, epsFault, txRateExceeded'
- id: SWF-SE-025
  name: SPI transport
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/spi.cc
  - openpilot/selfdrive/pandad/panda_comms.h
  description: 'PandaSpiHandle: header/data/ACK protocol with 8-bit XOR checksums (spi.cc:189-202, 313-408) and a retry loop (spi.cc:205-239). Control transfers use
    TIMEOUT 0 (panda_comms.h:10). connected and comms_healthy flags (panda_comms.h:17-18)'
- id: SWF-SE-026
  name: Launcher and firmware check
  kind: sw_unit
  parent: SWF-SE-020
  paths:
  - openpilot/selfdrive/pandad/pandad.py
  - openpilot/selfdrive/pandad/panda.cc
  description: 'pandad.py main loop: resets or DFU-recovers the internal panda before each start, flashes when the signature differs from panda/board/obj, then runs ./pandad
    (pandad.py:54-111). The C++ up_to_date check in connect() (panda.cc:116-127, pandad.cc:52-54)'
- id: SWF-SE-030
  name: selfdrived (engagement supervision)
  kind: sw_element
  parent: null
  paths:
  - openpilot/selfdrive/selfdrived
  description: FSC element EL-04 supervision (capability QM); System FMEA SFM-SE-014. Driver monitoring (dmonitoringd, SFM-SE-015) out of scope except the events selfdrived raises from driverMonitoringState
- id: SWF-SE-031
  name: Engagement state machine
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/state.py
  description: StateMachine.update (state.py:17-97); SOFT_DISABLE_TIME 3 s, ACTIVE_STATES / ENABLED_STATES (state.py:7-9)
- id: SWF-SE-032
  name: Input sampling and event generation
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/selfdrived.py
  description: 'data_sample (selfdrived.py:471-516: carState socket, SubMaster update, initialization, panda mismatch counter); update_events (selfdrived.py:153-469:
    car events, panda checks, process/message supervision, cruise mismatch)'
- id: SWF-SE-033
  name: Event catalogue and reaction mapping
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/events.py
  description: EVENTS dict mapping each event to ET reaction types and alerts (events.py:387-1021); Events container (events.py:52-108); alert classes (events.py:111-209)
- id: SWF-SE-034
  name: Alert manager
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/alertmanager.py
  - openpilot/selfdrive/selfdrived/selfdrived.py
  description: AlertManager.add_many / process_alerts, priority then start-frame selection (alertmanager.py:43-67); update_alerts (selfdrived.py:518-529)
- id: SWF-SE-035
  name: Excessive actuation check
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/helpers.py
  - openpilot/selfdrive/selfdrived/selfdrived.py
  description: ExcessiveActuationCheck.update (helpers.py:26-55); latch via Offroad_ExcessiveActuation and excessiveActuation event (selfdrived.py:297-311)
- id: SWF-SE-036
  name: selfdriveState publication and main loop
  kind: sw_unit
  parent: SWF-SE-030
  paths:
  - openpilot/selfdrive/selfdrived/selfdrived.py
  description: 'publish_selfdriveState (selfdrived.py:531-559), step and run loop (selfdrived.py:561-591). Consumers: controlsd latActive/longActive (controlsd.py:96-102),
    pandad heartbeat engaged (pandad.cc:424), ui and soundd alerts'
- id: SWF-SE-040
  name: Control (controlsd, lateral/longitudinal controllers, Toyota CarController hand-off)
  kind: sw_element
  parent: null
  paths:
  - openpilot/selfdrive/controls/controlsd.py
  - openpilot/selfdrive/controls/lib
  - openpilot/selfdrive/car/card.py
  - opendbc_repo/opendbc/car/toyota/carcontroller.py
  description: FSC element EL-03 driving software (control part); System FMEA SFM-SE-013. QM, upstream openpilot code
- id: SWF-SE-041
  name: controlsd main loop, input handling and actuator gating
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - openpilot/selfdrive/controls/controlsd.py
  description: 'SubMaster polled on selfdriveState (41-43, 66); latActive/longActive (99-102); curvature source selection (123-127); non-finite
    sanitiser (139-147); cruise cancel/resume (161-163); steer_limited_by_safety (179-185); carControl publish (221-225); 100 Hz loop (227-233)'
- id: SWF-SE-042
  name: Lateral torque controller
  kind: sw_unit
  parent: SWF-SE-040
  paths:
  - openpilot/selfdrive/controls/lib/latcontrol_torque.py
  - openpilot/selfdrive/controls/lib/latcontrol.py
  - openpilot/common/pid.py
  description: LatControlTorque.update (88-137), torque parameter update (78-86), base reset/saturation (latcontrol.py:19-29), PID with
