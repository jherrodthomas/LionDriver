  - id: SWF-062.C1
    description: 'Defect in the minimum-risk latch (TSR-633, DQ-365 A, #372, BL-007): selfdrived latches the manoeuvre from the first no-response request until
      the item disengages (minimum_risk.py, selfdriveState.minimumRiskManeuver), controlsd keeps forceDecel on while it is set, the terminal alert is re-raised
      while latched and the DM lockout runs from the takeover. A latch that clears while engaged, a forceDecel not held, or a lockout that starts at the stop lets
