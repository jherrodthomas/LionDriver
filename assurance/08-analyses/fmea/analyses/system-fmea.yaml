      - {id: SFM-014.C3, element: SFM-SE-014, description: "Catch-all commIssue suppressed by the no_system_errors logic while another event is active", prevention_controls: [], detection_controls: [], occurrence: null, detection: null, ap: null}
    notes: "HARA input: continued actuation after fault detection."

