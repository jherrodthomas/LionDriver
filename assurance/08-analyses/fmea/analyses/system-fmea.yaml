          system_response: Over-limit frame refused; torque stays inside the envelope. BL-005, while engaged, the refusal also gives
            pandaTxBlocked, an immediate disable with a take-over alert at the next pandaStates sample (TSR-615)
          effect_after_response: Torque bounded by the panda envelope. Repeated refusals interrupt LKA frames and assist may drop
            without a LionDriver alert at BL-004; since BL-005 the first refusal while engaged disengages with an alert (pandaTxBlocked).
