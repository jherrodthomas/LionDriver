# yaml-language-server: $schema=../schema/fmea.schema.json
#
# System FMEA — AIAG-VDA steps 1-5 (scope, structure, function, failure analysis, risk analysis).
# Severity is set from the HARA (rev 0.1): hazard-linked effects are 10 per RT-1 section 1.1.
# Step 5 (rev 0.5): every cause rated against BL-004 per RT-1 (occurrence table 2.1, detection table 3). Basis:
# - Causes linked to a SW FMEA or DFMEA row (linked_failure_mode) inherit that row's controls and ratings; the action is there.
# - Upstream openpilot / opendbc host code: O 6 (review, lint, non-requirements-based tests; no field-exposure credit for this
#   configuration). Neural-network elements: O 7 (no development evidence available). Toyota ECU internals: O 3 under the
#   OEM assumption of use. Design gaps present in the code: O 8.
# - Detection: only the opendbc safety suite is proven (mutation tests in CI, D 3). Host unit tests are targeted but not proven
#   (D 8), process_replay is a generic regression check (D 9), and no vehicle, HIL or system test has been executed (D 10).
# - Result: 79 causes AP H, 1 AP M (SFM-024.C1, nuisance alerts). Actions SFM-ACT-001..011 (no 004).
# `safety_mechanisms` lists the in-field mechanisms in the code; they are design facts and are not credited as detection.
# Rev 0.7 (2026-10-14, RT-2): FMEA-MSR pilot (msr-plan.md M1) on the SG-01 lateral chain, SFM-001/002/003/006/029/034, at
# BL-004: 17 causes rated, 3 hardware causes rated in the DFMEA. F = the cause's O. Best monitoring is M 5: the panda
# per-frame steering checks, mutation-tested, on code-derived timing. Actions SFM-ACT-012..015 (kind monitoring).
# Host supervision added after BL-004 (TSR-615, TSR-621) is not credited; it is re-rated with the next baseline.
# Rev 0.8 (2026-10-14, RT-2): FMEA-MSR complete (msr-plan.md M2): 60 causes rated, 4 hardware causes rated in the DFMEA.
# Monitoring: M 5 on 12 causes (panda per-frame checks, driver brake/gas/cancel revocation), M 7-8 on 16 (warning only, no
# FTTI row, or too slow), M 9-10 on 32 (no monitor). Actions SFM-ACT-016..018 (kind monitoring).
# Rev 0.9 (2026-10-16): baseline BL-005 (liondriver-dev 1033d98, panda a55bdfc, opendbc 9a13f60). The reference build is the
# default at BL-005, so its panda checks are credited. Each claim below was checked against the code at these pins. S, O and
# AP are unchanged. D changes on one cause: SFM-015.C2 10 -> 8 (host unit test test_supervision.py). Rows inherited from the
# SW FMEA and DFMEA keep the ratings of those files (BL-004 / BL-002) until they are re-rated there. MSR re-rated:
# - TSR-621: controlsMismatch after 2 consecutive pandaStates samples, at most 0.5 s after the first mismatched frame
#   (selfdrived.py, supervision.py), replacing 200 cumulative cycles (about 2 s). SFM-015.C2 goes from M 8 to M 6.
# - TSR-408 with TSR-621: the panda revokes authority when STEERING_LKA stops for 50 ms (ACC_CONTROL 100 ms), and the
#   host alerts through controlsMismatch. SFM-005.C2 and SFM-011.C2 go to M 6. SFM-006.C1 stays M 8: the warning is
#   now in time, but the torque decays only when the EPS drops LKA (about 2 s, no active zero frame).
# - TSR-615: a rising safetyTxBlocked while engaged gives pandaTxBlocked (immediate disable), so a refused over-limit frame
#   now also disengages with an alert. The ratings of those rows stay at M 5 (the envelope itself is not yet validated).
#   pandaHeartbeatLost and pandaTxRateExceeded are the primary monitor of no System FMEA cause; they are listed as
#   mechanisms where they apply.
# - TSR-308: cruiseMismatch alerts after 1 s; SFM-021 goes from M 9 to M 7 (warning, no WP-S-04 FTTI row).
# - Reference lock and the reference-build check in pandad: a platform whose Toyota safety parameter is not 73 cannot
#   engage; SFM-032.C1 goes from M 9 to M 8 (a similar platform with parameter 73 is still not detected).
# Result: monitoring M 5-6 on 15 causes (was 12), M 7-8 on 16 (16), M 9-10 on 29 (32). Every MSR AP is still H (provisional table).
#
# `notes` starting with "HARA input:" are candidate hazards for the HARA.
# `notes` starting with "Observation:" are code findings to confirm in the SW FMEA.
schema_version: 1
analysis:
  id: SFM
  type: system_fmea
  title: "System FMEA — LionDriver L2 ACC/ALC item"
  revision: "0.9"
  status: draft
  baseline: BL-005
  rating_tables: RT-2
  msr: complete
  scope: >-
    LionDriver as installed on the reference configuration CFG-001 (Corolla E210 · ZRE212 · US, US sedan MY2020-2022) with comma 3X and integrated panda,
    software BL-005 (structure and failure analysis written at BL-001, risk analysis at BL-004, MSR re-rated at BL-005), while the vehicle is driven on public roads by a licensed driver.
    Functions F1-F7 per fmea-plan.md section 3.1, plus F8 (stock vehicle safety functions are
    preserved), added because the harness intercepts the stock ADAS camera.
  out_of_scope:
    - Internal failures of Toyota ECUs (EPS, ADAS camera, powertrain, brakes); analyzed only at their interface
    - Performance limitations of the driving model under nominal hardware/software (SOTIF analysis)
    - Malicious manipulation (TARA, ISO/SAE 21434)
    - Offroad features (logging upload, navigation, settings, updates); updates are covered by the PFMEA
  team:
    - name: Jherrod Thomas
      role: Project maintainer, safety lead (reviewer/approver)
    - name: Claude (AI assistant)
      role: Drafting assistance; content requires human review
  references:
    - assurance/08-analyses/fmea/fmea-plan.md
    - assurance/08-analyses/fmea/rating-tables.md
    - docs/SAFETY.md
  updated: 2026-10-16

# ---------------------------------------------------------------------------
# Step 2 — Structure
# ---------------------------------------------------------------------------
structure:
  - id: SFM-SE-001
    name: LionDriver item (L2 ACC + ALC + driver monitoring)
    kind: item
    parent: null
  - id: SFM-SE-002
    name: comma 3X device
    kind: system
    parent: SFM-SE-001
    description: SoC compute, road/wide/driver cameras, IMU, GNSS, display, speaker, power and thermal management
    paths: [openpilot/system/hardware]
  - id: SFM-SE-003
    name: Integrated panda (CAN interface and safety model)
    kind: subsystem
    parent: SFM-SE-002
    description: >-
      MCU between the device and vehicle CAN. Forwards CAN, enforces the vehicle safety model on
      transmitted messages, controls the harness relay. Firmware and safety model are in submodules.
    paths: [openpilot/selfdrive/pandad, panda, opendbc_repo]
  - id: SFM-SE-004
    name: Harness (Toyota A connector, harness box, comma power v3)
    kind: component
    parent: SFM-SE-001
    description: Intercepts the stock ADAS camera CAN at the windshield camera connector; supplies 12 V to the device
  # Software subsystems running on the device (black boxes at this level; decomposed in the SW FMEA)
  - id: SFM-SE-010
    name: Perception (camerad, modeld)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/system/camerad, openpilot/selfdrive/modeld/modeld.py]
  - id: SFM-SE-011
    name: Localization and calibration (locationd, calibrationd, paramsd, torqued)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/selfdrive/locationd]
  - id: SFM-SE-012
    name: Planning (plannerd, radard)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/selfdrive/controls/plannerd.py, openpilot/selfdrive/controls/radard.py]
  - id: SFM-SE-013
    name: Control (controlsd, lateral/longitudinal controllers)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/selfdrive/controls/controlsd.py, openpilot/selfdrive/controls/lib]
  - id: SFM-SE-014
    name: Supervision (selfdrived state machine, events, alert manager)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/selfdrive/selfdrived]
  - id: SFM-SE-015
    name: Driver monitoring (dmonitoringmodeld, dmonitoringd)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/selfdrive/modeld/dmonitoringmodeld.py, openpilot/selfdrive/monitoring]
  - id: SFM-SE-016
    name: Car interface (card, car_events, opendbc Toyota port)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/selfdrive/car, opendbc_repo]
  - id: SFM-SE-017
    name: Panda daemon (pandad)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/selfdrive/pandad]
  - id: SFM-SE-018
    name: HMI (ui, soundd)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/selfdrive/ui/ui.py, openpilot/selfdrive/ui/soundd.py]
  - id: SFM-SE-019
    name: Platform (manager, messaging, hardwared, OS)
    kind: sw_element
    parent: SFM-SE-002
    paths: [openpilot/system/manager, openpilot/cereal, openpilot/system/hardware/hardwared.py]
  # External elements at the item boundary
  - id: SFM-SE-030
    name: Toyota EPS
    kind: external
    parent: null
  - id: SFM-SE-031
    name: Toyota powertrain and brake control (receives ACC acceleration requests)
    kind: external
    parent: null
  - id: SFM-SE-032
    name: Toyota stock ADAS camera (TSS2)
    kind: external
    parent: null
  - id: SFM-SE-033
    name: Vehicle CAN buses and 12 V supply
    kind: external
    parent: null
  - id: SFM-SE-034
    name: Driver
    kind: external
    parent: null

# ---------------------------------------------------------------------------
# Step 3 — Functions
# ---------------------------------------------------------------------------
functions:
  - id: SFM-FN-001
    element: SFM-SE-001
    description: "F1 Lateral control: request steering torque from the EPS to keep the vehicle in its lane while engaged"
  - id: SFM-FN-002
    element: SFM-SE-001
    description: "F2 Longitudinal control: request acceleration/deceleration to hold set speed and follow leads while engaged"
  - id: SFM-FN-003
    element: SFM-SE-001
    description: "F3 Engagement management: engage only on driver request with entry conditions met; disengage per fault reaction (soft/immediate)"
  - id: SFM-FN-004
    element: SFM-SE-001
    description: "F4 Driver override: release control on brake or cancel; yield lateral to steering input and longitudinal to accelerator"
  - id: SFM-FN-005
    element: SFM-SE-001
    description: "F5 Driver monitoring: detect inattention and escalate alerts; lock out engagement after repeated non-response"
  - id: SFM-FN-006
    element: SFM-SE-001
    description: "F6 Alerting: inform the driver of engagement state, takeover requests and faults (visual and audible)"
  - id: SFM-FN-007
    element: SFM-SE-001
    description: "F7 Actuation limiting: bound actuator commands in magnitude and rate; detect excessive actuation"
  - id: SFM-FN-008
    element: SFM-SE-001
    description: "F8 Stock function preservation: keep stock vehicle safety functions not replaced by the item available"

# ---------------------------------------------------------------------------
# Step 4 — Failure analysis
# ---------------------------------------------------------------------------
failure_modes:

  # ----- F1 Lateral control -----
  - id: SFM-001
    element: SFM-SE-001
    function: SFM-FN-001
    failure_mode: Steering torque applied when not engaged
    guideword: unintended
    effects:
      - {level: local, description: "Torque request sent to EPS outside an active state"}
      - {level: next_higher, description: "Unexpected steering wheel motion and lateral deviation"}
      - {level: end, description: "Driver surprised during manual driving; possible lane departure", hazard: HZ-001, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: controlsd only sets latActive when selfdriveState is active and no EPS fault
        ref: openpilot/selfdrive/controls/controlsd.py
      - description: Panda safety model blocks steering messages unless controls are allowed (heartbeat carries engaged state from selfdriveState)
        ref: openpilot/selfdrive/pandad/pandad.cc
    causes:
      - id: SFM-001.C1
        element: SFM-SE-014
        linked_failure_mode: SWF-030
        description: State machine reports active while disabled
        prevention_controls:
        - description: Upstream code with review; ruff and ty run in fork CI static_analysis; unit tests derived from the implementation; no software requirements
          ref: scripts/lint/lint.sh:45,55; .github/workflows/tests.yaml
        detection_controls:
        - description: test_no_entry and test_no_entry_pre_enable (ENABLE with NO_ENTRY stays disabled), run by tests.yaml unit_tests on every push and PR; not
            proven by mutation
          test: openpilot/selfdrive/selfdrived/tests/test_state_machine.py
        occurrence: 6
        detection: 8
        ap: H
        rationale: Rated, and actioned, in the SW FMEA (SWF-030.C1, SWF-ACT-030); this row inherits that rating
        msr:
          mechanisms:
          - 2
          diagnostic: 'Panda Toyota safety model checks every STEERING_LKA frame: a torque request while controls_allowed is false
            is refused. controls_allowed needs PCM cruise engaged on the car bus and the heartbeat engaged state, so a wrong host
            state alone does not grant it'
          system_response: Frame not sent; no torque request reaches the EPS
          effect_after_response: No assist torque while not engaged; manual steering unaffected. Whether refused frames set an EPS
            LKA fault indication is to be confirmed on the reference car (SFM-ACT-012)
          severity_after: 4
          frequency: 6
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 continuous limits
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota steering checks (torque with controls not allowed, magnitude and rate limits) tested on every PR and
              mutation-tested in CI (safety.yaml mutation job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          actions:
          - SFM-ACT-012
      - id: SFM-001.C2
        element: SFM-SE-003
        linked_failure_mode: SWF-002
        description: Panda allows steering TX without valid engagement (controls_allowed set incorrectly)
        prevention_controls:
        - description: 'Panda safety code: MISRA C:2012, 100% line coverage, review; rated in the SW FMEA'
          ref: assurance/08-analyses/fmea/analyses/sw-fmea.yaml
        detection_controls:
        - description: opendbc safety suite with 100% line coverage and mutation tests, run by CI on every change (proven, early, test-to-fail)
          test: opendbc_repo/opendbc/safety/tests/test_toyota.py
          ref: .github/workflows/safety.yaml
        occurrence: 5
        detection: 3
        ap: H
        rationale: Rated, and actioned where needed, in the SW FMEA (SWF-002.C1, SWF-ACT-002); this row inherits that rating
        msr:
          mechanisms:
          - 1
          diagnostic: None for this cause. controlsd sends torque only while latActive, so the host channel masks the panda fault
            but nothing detects it; the TSR-621 mismatch check (BL-005) still covers only the opposite direction (enabled, panda not allowed)
          system_response: None; the fault stays latent until the host also commands torque
          effect_after_response: 'Unchanged: torque while not engaged once the host also fails (dual-point, DFA/FTA)'
          severity_after: 10
          frequency: 5
          monitoring: 10
          ap: H
          timing:
            basis: unknown
          actions:
          - SFM-ACT-013
      - id: SFM-001.C3
        element: SFM-SE-016
        description: Steering message packed with non-zero torque/request bit while latActive is false
        prevention_controls:
        - description: Upstream opendbc Toyota port (DBC, carstate, carcontroller) with upstream review and route-based car tests; no LionDriver requirements;
            no field-exposure evidence for this configuration is credited
          ref: opendbc_repo/opendbc/car/toyota
        detection_controls:
        - description: process_replay over the CI route corpus compares outputs with the reference commit (CI 'process replay'); a regression check, not designed
            or proven for this cause
          test: openpilot/selfdrive/test/process_replay/test_processes.py
        occurrence: 6
        detection: 9
        ap: H
        rationale: The panda refuses steering torque while controls are not allowed (SWF-002, D 3), so this cause leads to the end effect only together with SFM-001.C2;
          no separate action
        msr:
          mechanisms:
          - 2
          diagnostic: Panda refuses a STEERING_LKA frame carrying torque or the request bit while controls_allowed is false (checked
            on every frame)
          system_response: Frame not sent; no torque request reaches the EPS
          effect_after_response: No assist torque while not engaged; manual steering unaffected (EPS reaction to refused frames to
            confirm, SFM-ACT-012)
          severity_after: 4
          frequency: 6
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 continuous limits
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota steering checks (torque with controls not allowed, magnitude and rate limits) tested on every PR and
              mutation-tested in CI (safety.yaml mutation job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          actions:
          - SFM-ACT-012
    notes: "HARA input: unintended steering intervention during manual driving."

  - id: SFM-002
    element: SFM-SE-001
    function: SFM-FN-001
    failure_mode: Steering torque or torque rate above limits
    guideword: excessive
    effects:
      - {level: local, description: "Torque request exceeds the limits in SAFETY.md / ISO 11270"}
      - {level: next_higher, description: "Lateral deviation faster than a driver can correct (> 1 m in 0.9 s)"}
      - {level: end, description: "Lane departure or collision with adjacent traffic or roadside", hazard: HZ-002, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: Panda/opendbc Toyota safety model limits steering torque magnitude and rate on TX
        ref: opendbc_repo
      - description: Excessive lateral acceleration check (> 2x ISO lateral accel for 0.25 s) raises excessiveActuation (SOFT_DISABLE)
        ref: openpilot/selfdrive/selfdrived/helpers.py
      - description: 'BL-005: selfdrived raises pandaTxBlocked (IMMEDIATE_DISABLE) when a panda''s safetyTxBlocked count rises between two
          pandaStates samples while engaged, i.e. when the panda refused a frame the SoC sent (TSR-615)'
        ref: openpilot/selfdrive/selfdrived/supervision.py
        test: openpilot/selfdrive/selfdrived/tests/test_supervision.py
    causes:
      - id: SFM-002.C1
        element: SFM-SE-013
        linked_failure_mode: SWF-042
        description: Lateral controller output too high (gain, torque model, saturation logic)
        prevention_controls:
        - description: Upstream review and lint; LatControlCurvature does reset its PID (latcontrol_curvature.py:28-31), so the omission may be an oversight or
            deliberate upstream; no requirement states either
          ref: openpilot/selfdrive/controls/lib/latcontrol_curvature.py
        detection_controls:
        - description: test_latcontrol.py covers saturation only; test_latcontrol_torque_buffer.py covers the request buffer only; nothing checks controller state
            across disengagement
        occurrence: 7
        detection: 10
        ap: H
        actions:
        - SFM-ACT-001
        rationale: Rated, and actioned, in the SW FMEA (SWF-042.C1, SWF-ACT-042, SWF-ACT-043); this row inherits that rating
        msr:
          mechanisms:
          - 1
          - 3
          diagnostic: Panda checks torque magnitude and rate of every STEERING_LKA frame against the Toyota limits
          system_response: Over-limit frame refused; torque stays inside the envelope. BL-005, while engaged, the refusal also gives
            pandaTxBlocked, an immediate disable with a take-over alert at the next pandaStates sample (TSR-615)
          effect_after_response: Torque bounded by the panda envelope. Repeated refusals interrupt LKA frames and assist may drop
            without a LionDriver alert at BL-004; since BL-005 the first refusal while engaged disengages with an alert (pandaTxBlocked).
            The envelope itself is not yet derived from vehicle measurements (SFM-ACT-001), so S after the response stays 10
          severity_after: 10
          frequency: 7
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 continuous limits
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota steering checks (torque with controls not allowed, magnitude and rate limits) tested on every PR and
              mutation-tested in CI (safety.yaml mutation job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          actions:
          - SFM-ACT-012
      - id: SFM-002.C2
        element: SFM-SE-010
        description: Model outputs excessive desired curvature
        prevention_controls:
        - description: Upstream neural network trained and validated by comma.ai; no development or validation evidence is available to LionDriver (SOTIF / ISO
            PAS 8800 scope, WP-C-06)
          ref: openpilot/selfdrive/modeld
        detection_controls:
        - description: No pre-release test targets this cause
        occurrence: 7
        detection: 10
        ap: H
        actions:
        - SFM-ACT-001
        - SFM-ACT-009
        msr:
          mechanisms:
          - 1
          - 3
          diagnostic: Panda checks torque magnitude and rate of every STEERING_LKA frame; an excessive curvature request is bounded
            where it becomes torque
          system_response: Over-limit frame refused; torque stays inside the envelope. BL-005, while engaged, the refusal also gives
            pandaTxBlocked, an immediate disable with a take-over alert at the next pandaStates sample (TSR-615)
          effect_after_response: Torque bounded by the panda envelope; an in-envelope wrong curvature still steers (SOTIF, SFM-ACT-009)
          severity_after: 10
          frequency: 7
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 continuous limits
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota steering checks (torque with controls not allowed, magnitude and rate limits) tested on every PR and
              mutation-tested in CI (safety.yaml mutation job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          actions:
          - SFM-ACT-012
      - id: SFM-002.C3
        element: SFM-SE-003
        linked_failure_mode: SWF-001
        description: Safety model torque/rate limits wrong for this vehicle or not enforced
        prevention_controls:
        - description: Panda limits are copied from upstream vehicle tuning (same constants as the SoC side); no independent envelope derived from vehicle measurements
            (FSC FOI-001)
          ref: opendbc_repo/opendbc/safety/modes/toyota.h
        - description: 'Panda safety code: MISRA C:2012, 100% line coverage, review; rated in the SW FMEA'
          ref: assurance/08-analyses/fmea/analyses/sw-fmea.yaml
        detection_controls:
        - description: opendbc safety suite with 100% line coverage and mutation tests, run by CI on every change (proven, early, test-to-fail)
          test: opendbc_repo/opendbc/safety/tests/test_toyota.py
          ref: .github/workflows/safety.yaml
        occurrence: 6
        detection: 9
        ap: H
        actions:
        - SFM-ACT-001
        rationale: Rated, and actioned where needed, in the SW FMEA (SWF-001.C1 O6 D9 and SWF-001.C2 O5 D3; the worse is used); this row inherits that rating
        msr:
          mechanisms:
          - 2
          diagnostic: 'With the panda limits themselves wrong, only the host excessive-actuation check remains: lateral acceleration
            above 2x the ISO 11270 limit for 0.25 s (WP-S-04 T-21)'
          system_response: 'SOFT_DISABLE: actuation continues for up to 3 s while the alert counts down (T-16); 3.25 s exceeds the
            0.5 s SG-01 FTTI'
          effect_after_response: Excessive torque continues for up to 3.25 s before disengagement
          severity_after: 10
          frequency: 6
          monitoring: 8
          ap: H
          timing:
            fdti_ms: 250
            frti_ms: 3000
            basis: code_derived
          actions:
          - SFM-ACT-010
      - id: SFM-002.C4
        element: SFM-SE-011
        description: Wrong vehicle parameters (steer ratio, lateral accel factor, torque offsets) from online learners
        prevention_controls:
        - description: Upstream openpilot code with upstream review; ruff and type checks in CI (static analysis job); unit tests are not requirements-based;
            no field-exposure evidence for this configuration, so none is credited (RT-1 §2.2)
          ref: scripts/lint/lint.sh
        - description: paramsd bounds the learned steer ratio to 0.5-2x CarParams and rate-limits offsets; torqued accepts estimates only within sanity bounds
            of the CarParams values
          ref: openpilot/selfdrive/locationd/paramsd.py:47
        detection_controls:
        - description: paramsd and torqued unit tests (estimate bounds and convergence); targeted, not proven by fault injection
          test: openpilot/selfdrive/locationd/test/test_paramsd.py
        occurrence: 6
        detection: 8
        ap: H
        actions:
        - SFM-ACT-001
        - SFM-ACT-002
        msr:
          mechanisms:
          - 1
          - 3
          diagnostic: Panda torque magnitude and rate limits are opendbc constants, independent of the learned vehicle parameters,
            and are checked on every frame
          system_response: Over-limit frame refused; torque stays inside the envelope. BL-005, while engaged, the refusal also gives
            pandaTxBlocked, an immediate disable with a take-over alert at the next pandaStates sample (TSR-615)
          effect_after_response: Torque bounded by the panda envelope; in-envelope tracking error remains (SFM-004)
          severity_after: 10
          frequency: 6
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 continuous limits
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota steering checks (torque with controls not allowed, magnitude and rate limits) tested on every PR and
