          rationale: 'M 7: the diagnostic targets the cause and the detection time is known (about 0.21 s), but the response ends in an
            unmeasured PCM behaviour, so the reaction cannot be compared with the 1 s FTTI'
          actions:
          - SFM-ACT-015
      - id: SFM-037.C2
        element: SFM-SE-012
        linked_failure_mode: SWF-068
        description: plannerd stops or runs late while engaged, so controlsd keeps using the last longitudinalPlan
        prevention_controls:
        - description: Upstream openpilot code with upstream review; rated in the SW FMEA
          ref: assurance/08-analyses/fmea/analyses/sw-fmea.yaml
        detection_controls:
        - description: 'As rated in the SW FMEA (SWF-068.C1, D 9 at BL-005): no test targets an exception in the planner loop'
        occurrence: 4
        detection: 9
        ap: H
        actions:
        - SFM-ACT-002
        rationale: Rated in the SW FMEA (SWF-068.C1, O 4 D 9 at BL-005); this row inherits that rating
        msr:
          mechanisms:
          - 1
          diagnostic: selfdrived liveness check on longitudinalPlan (10 missed periods at 20 Hz, 0.5 s, T-14)
          system_response: commIssue SOFT_DISABLE; actuation continues for the 3 s countdown (T-16) on the last plan
          effect_after_response: Frozen request held up to about 3.5 s before the item disengages
          severity_after: 10
          frequency: 4
          monitoring: 8
          ap: H
          timing:
            ftti_ref: SG-03/04
            ftti_ms: 1000
            fdti_ms: 500
            frti_ms: 3000
            basis: code_derived
          rationale: 'M 8: the diagnostic targets the cause, but 0.5 s detection plus the 3 s soft disable exceeds the 1 s FTTI'
          actions:
          - SFM-ACT-015
      - id: SFM-037.C3
        element: SFM-SE-019
        description: Messaging delivers a stale longitudinal plan or command with fresh timestamps
        prevention_controls:
        - description: msgq/cereal stamp logMonoTime at publication; SubMaster tracks arrival time and frequency
          ref: openpilot/cereal/messaging/__init__.py
        detection_controls:
        - description: No pre-release test targets this cause
        occurrence: 5
        detection: 10
        ap: H
        actions:
        - SFM-ACT-002
        msr:
          mechanisms:
          - 1
          diagnostic: Liveness checks use arrival and timestamps, so stale data with fresh timestamps passes them
          system_response: None until another check trips
          effect_after_response: 'Unchanged: longitudinal control acts on stale data'
          severity_after: 10
          frequency: 5
          monitoring: 9
          ap: H
          timing:
            basis: unknown
          actions:
          - SFM-ACT-015
    notes: "HARA input: constant longitudinal request not following the lead or set speed. Counterpart of SFM-006 (lateral). Not cited by the fault trees yet (not_in_fta, tree_gap for SG-03 and SG-06)."

  # ----- F6 Alerting: warnings for a lateral-control loss or limit (FTA SG-02 BE-2.08, BE-2.24) -----
  - id: SFM-038
    element: SFM-SE-001
    function: SFM-FN-006
    failure_mode: Warning of a lateral-control fault or limit late, not escalated or missing
    guideword: late
    effects:
      - {level: local, description: "steerTempUnavailable not escalated to a take-over request, steerSaturated raised late or not at all, or the panda's EPS-fault flag not acted on"}
      - {level: next_higher, description: "Driver not prompted to take over while lateral control is lost or limited"}
      - {level: end, description: "Driver unaware of the loss or limit; lane departure", hazard: HZ-004, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: EPS-fault siren from the panda when LKA_STATE reports a fault for 0.7 s while authority is granted (TSR-516(b), T-28; 1 s up to BL-006, 0.7 s since panda bf8102a, DQ-048 A, at most 0.96 s from onset), still sounding after a revocation (DQ-367); independent of the host alerts
        ref: panda/board/drivers/eps_fault_siren.h
      - description: Lane departure warning as the car nears the line
        ref: openpilot/selfdrive/controls/lib/ldw.py
    causes:
      - id: SFM-038.C1
        element: SFM-SE-016
        linked_failure_mode: SWF-088
        description: 'The lighter EPS-fault prompt (steerTempUnavailableSilent, a LOW-priority WARNING with a chime and no soft
          disable, events.py:516-521) after a recent override, at standstill or while the driver steers is not limited to 1.5 s, so a
          long fault does not escalate to the take-over request (car_events.py:167-185, STEER_FAULT_SILENT_FRAMES; T-25, GAP-03).
          Until BL-005 the prompt was latched for the whole fault by design; from BL-006 the cause is a defect of the TSR-607 (b)/(c)
          frame counter'
        prevention_controls:
        - description: 'TSR-607 (b)/(c) implemented in car_events.py (#174, f350f5b; DQ-342 A, DQ-366 A): the lighter prompt is
            allowed for the first 150 frames of the fault only; ruff and ty in fork CI; impact record change-2026-10-17-eps-fault-escalation.md.
            Not reviewed independently'
          ref: openpilot/selfdrive/car/car_events.py
        detection_controls:
        - description: 'Proven by mutation in CI after BL-007 (CE-1..CE-3, tools/ci/host_mutation.py), as SWF-088.C1/C2; D 8 -> 4 (System FMEA rev 0.36)'
          ref: tools/ci/host_mutants.toml
        - description: 'test_steer_fault_warning.py (7 tests: silent window, no recent override, escalation after an override, at
            standstill, after releasing the wheel, a returning fault, a short fault while holding), run by the CI test runner; 4 of
            the #174 tests fail on the BL-005 code. Targeted but not proven by mutation, so D 8 (RT-2); not verified on the vehicle
            (impact record OI-1)'
          test: openpilot/selfdrive/car/tests/test_steer_fault_warning.py
        occurrence: 5
        detection: 4
        ap: H
        previous:
          baseline: BL-005
          occurrence: 8
          detection: 10
          ap: H
          change: 'TSR-607 (b)/(c) implemented and unit-tested (#174, f350f5b; SFM-ACT-023)'
        rationale: 'Linked to SW FMEA SWF-088 (C1 TSR-607 (b), C2 TSR-607 (c); #187). The SW FMEA rates SWF-088.C1/C2
          O 5 D 8 since BL-006, as this row; unchanged at BL-007 (car_events.py and its tests did not change)'
        actions:
        - SFM-ACT-023
        msr_exempt: 'The cause is a defect of the warning path itself; its effect on detecting the lateral loss is rated in the MSR rows
          of SFM-004.C2 and SFM-005 (msr-plan §3)'
      - id: SFM-038.C2
        element: SFM-SE-017
        description: 'pandad publishes the panda fields epsFault and requestsRejected (pandad.cc:137-138), but no SoC process reads
          them (txRateExceeded is read, TSR-615), so a panda-side EPS-fault refusal reaches the driver only through the panda siren and the stock EPS
          path (SW FMEA SWF-025 notes)'
        prevention_controls:
        - description: None; the fields were added for the panda siren and logging
          ref: openpilot/selfdrive/pandad/pandad.cc
        detection_controls:
        - description: No test targets this cause
        occurrence: 8
        detection: 10
        ap: H
        actions:
        - SFM-ACT-024
        msr_exempt: 'The cause is a defect of the warning path itself; the panda siren that remains is rated on SFM-005 and in the DFMEA
          (msr-plan §3)'
      - id: SFM-038.C3
        element: SFM-SE-014
        description: 'steerSaturated needs the controller saturated, a desired lateral acceleration above 1.0 m/s², an undershoot above
          1.2x and no steering input for 2 s (selfdrived.py:470-484), and the controller reports saturation only after 0.4 s
          (latcontrol.py, T-30); a gradual deficit therefore warns late or not at all (WP-S-04 §3.8.1)'
        prevention_controls:
        - description: Upstream openpilot code with upstream review; ruff and type checks in CI (static analysis job)
          ref: scripts/lint/lint.sh
        detection_controls:
        - description: Lateral controller unit tests (saturation detection); targeted at nominal behaviour, not proven
          test: openpilot/selfdrive/controls/tests/test_latcontrol.py
        occurrence: 8
        detection: 8
        ap: H
        actions:
        - SFM-ACT-021
        msr_exempt: 'The cause is the timing of the warning itself; it is rated as M 8 in the MSR rows of SFM-004.C1-C3 (rev 0.15,
          WP-S-04 §3.8.1)'
    notes: "HARA input: missing or late warning of a lateral loss or limit. Backs FTA SG-02 BE-2.08 (C1, C2) and BE-2.24 (C3)."

actions:
  - id: SFM-ACT-001
    kind: design_change
    description: Derive steering and acceleration envelopes from measurements on the reference vehicle and set the panda limits from them, independently of
      the SoC limits (same as SWF-ACT-003, FSC FOI-001)
    owner: Jherrod Thomas
    status: open
  - id: SFM-ACT-002
    kind: detection
    description: Requirements-based tests for the host safety-relevant functions (selfdrived, controlsd, pandad, car interface, locationd bounds, monitoring
      policy), proven by mutation or fault injection and run as a CI gate (see SWF host actions)
    owner: Jherrod Thomas
    status: open
  - id: SFM-ACT-003
    kind: detection
    description: 'Execute system integration and vehicle verification on the reference car (WP-S-08, WP-S-09) and the HIL bench (D-04): steering sign and
      torque response, EPS and powertrain interface behaviour (lockouts, ignored requests), brake, accelerator and cancel paths, intercept-switch and harness faults,
      12 V interruptions, alert latency and audibility, CPU-load soak'
    owner: Jherrod Thomas
    status: open
  - id: SFM-ACT-005
    kind: design_change
    description: Implement the reaction when driver awareness reaches zero (driverUnresponsive3 / driverDistracted3 have no disable reaction
      at BL-004 or BL-005), the safe state of SG-010 (WP-C-03 SG-08, ASIL A; DQ-205). Decided by the lead (DQ-365, option A, 2026-10-16) and
      specified in TSR-633 (WP-S-02 v0.26) with TSR-611; keep the lane and decelerate in lane to a standstill with the terminal alert
      sounding, hold the vehicle stopped, and lock out re-engagement and resumption until the driver responds. WP-S-04 v0.12 §3.8.4 gives a
      preliminary time to the reaction (18 s vision, 30 s wheel-touch from loss of attention; OI-11); SFM-025.C1 is re-rated once TSR-633
      is implemented and that time is confirmed
    owner: Jherrod Thomas
    status: in_progress
    evidence: 'Code done in BL-007: the manoeuvre is latched until the driver takes over, held at standstill and the alert re-raised (#372,
      dacd8f7, minimum_risk.py, test_minimum_risk.py), the lockout runs from the takeover (test_monitoring.py), a longitudinal maneuver stays
      stopped under forced deceleration (test_longitudinal.py), and the stop is announced by a countdown (#374, 59e22e0, TSR-624); all in the
      CI unit_tests job. SFM-025.C1 re-rated at BL-007 to a defect of that code (O 5 D 8). Open: the PCM standstill hold over time (AOU-16
      vehicle test), the measured deceleration and stop time, and the time to the reaction (WP-S-04 OI-11)'
  - id: SFM-ACT-006
    kind: detection
    description: Establish on the reference car which stock TSS2 functions (PCS/AEB, FCW) remain available with LionDriver installed and longitudinal control
      enabled, and verify the stock pre-collision path after installation (PFMEA PFM-014)
    owner: Jherrod Thomas
    status: open
  - id: SFM-ACT-007
    kind: design_change
    description: 'Supervise the alert channels: treat loss of ui or soundd liveness, or a stale displayed state, as a fault that escalates (audible fallback,
      disengagement) instead of continuing silently'
    owner: Jherrod Thomas
    status: open
  - id: SFM-ACT-008
    kind: design_change
    description: Allow engagement only when the fingerprint, CarParams and panda safety parameter match the reference configuration AC-001 (refuse fuzzy matches
      in the reference build); see PFMEA PFM-013
    owner: Jherrod Thomas
    status: in_progress
    evidence: "BL-005: the reference build is the default (LionDriver #36), the panda accepts only TOYOTA parameter 73 (reference_lock.h) and pandad configures a car mode only on a reference panda (#41). Fuzzy fingerprint matches are still accepted on the host (SFM-032.C1)"
  - id: SFM-ACT-009
    kind: prevention
    description: Produce SOTIF / ISO PAS 8800 evidence for the neural-network elements (driving model, lead detection, driver monitoring model) per WP-V-02..04,
      including fault-induced inputs (corrupted or stale frames)
    owner: Jherrod Thomas
    status: open
  - id: SFM-ACT-010
    kind: design_change
    description: Justify every SOFT_DISABLE reaction and debounce against the FTTI (WP-S-04) and alert at once when the panda withdraws authority while engaged
      (controlsMismatch debounce)
    owner: Jherrod Thomas
    status: in_progress
    evidence: "controlsMismatch debounce cut from 200 cumulative samples (~2 s) to 2 consecutive samples, at most 0.5 s (change-2026-10-13-host-supervision.md); credited at BL-005 (SFM-015.C2 M 6). FTTI justification of SOFT_DISABLE reactions open"
  - id: SFM-ACT-011
    kind: design_change
    description: Alert the driver when stock cruise stays engaged while the item is disengaged (cruiseMismatch has no alert at BL-004)
    owner: Jherrod Thomas
    status: completed
    evidence: "cruiseMismatch now alerts after 1 s (change-2026-10-13-host-supervision.md); see SWF-ACT-034"
  - id: SFM-ACT-012
    kind: monitoring
    status: open
    description: Measure on the HIL bench and the reference car (WP-V-05) how the panda reacts to over-limit and not-engaged
      steering and acceleration frames and to driver brake, gas and cancel inputs, and what the EPS and PCM do when frames are
      refused; re-rate the MSR rows from code-derived to measured timing
  - id: SFM-ACT-013
    kind: monitoring
    status: open
    description: Check on the host, within the SG-01 FTTI, that the panda reports controls_allowed false while the item is disengaged
      (the reverse of the controlsMismatch check, which at BL-005 still covers only engaged with authority withdrawn), with a disable
      and an alert. The requirement is TSR-630, within 0.3 s (WP-S-02 §12.3a; WP-S-04 T-32, not implemented)
  - id: SFM-ACT-014
    kind: monitoring
    status: open
    description: Specify in the TSC a steering-direction plausibility monitor (commanded torque sign against measured yaw rate
      and lane-relative lateral motion), or justify its absence against HZ-003
  - id: SFM-ACT-015
    kind: monitoring
    status: in_progress
    description: 'Detect stale commands and inputs within the SG-01 FTTI: command-frame freshness in the MCU with an active
      zero frame (TSR-408, TSR-109) and frozen-content and age checks on model outputs in controlsd (TSR-602, TSR-631, AIR-17)'
    evidence: 'BL-005: command-frame arrival in the MCU (TSR-408, 50 ms STEERING_LKA, reference build by default) and input age
      checks in controlsd (TSR-602) are in. Open: the active zero frame (TSR-109), a frozen-content check on model outputs, and
      stale data with fresh timestamps (SFM-006.C1 to C3). The frozen-content check is TSR-631, with the age taken from the
      source timestamp (WP-S-02 §12.3a)'
  - id: SFM-ACT-016
    kind: monitoring
    status: open
    description: 'Supervise driver override in the panda: driver steering torque above the override threshold limits or revokes
      lateral authority within the SG-05 0.2 s budget (TSR-304). Behaviour decided by the lead (DQ-053, option A): back off on
      override and show a cue. Requirements: TSR-304 (timing tied to the SG-05 budget) and TSR-628 (WP-S-02 §12.3a)'
  - id: SFM-ACT-017
    kind: monitoring
    status: completed
    description: Add WP-S-04 FTTI rows for the warning paths without one (insufficient lateral control, late or insufficient
      braking warnings, SG-008 unintended engagement, driver monitoring), so these mechanisms can be compared with a time budget
    evidence: 'WP-S-04 v0.7 §3.7 (four rows) and §3.8, with T-30 to T-33. Rev 0.15 compares SFM-004, SFM-010.C2/C3, SFM-012.C1
      and SFM-013.C1/C2 with them. Driver monitoring (SFM-022.C3, SFM-025.C1) waits for the H-09 FTTI (§3.8.4); follow-up is
      SFM-ACT-005. Late warnings found: SFM-ACT-021 (lateral) and SFM-ACT-022 (braking)'
  - id: SFM-ACT-018
    kind: monitoring
    status: in_progress
    description: 'Detect silent loss of the actuation path: report forwarded and refused TX frames from the panda, and compare
      EPS and PCM acceptance (LKA_STATE, ACC status) with the commands, warning within the SG-02/06 1 s budget'
    evidence: 'BL-005: frames that stop reaching the panda are detected (TSR-408) and alerted within 0.5 s (TSR-621), credited on
      SFM-005.C2 and SFM-011.C2. Open: frames that reach the panda but are not accepted by the EPS or PCM (SFM-005.C1, SFM-011.C1).
      Requirements: TSR-632 (per-ID transmitted and refused counts), TSR-626(d)/(e) (EPS and PCM acceptance status) and TSR-615,
      warning within 1 s (WP-S-02 §12.3a)'
  - id: SFM-ACT-019
    kind: design_change
    status: open
    description: 'Revoke lateral authority in the panda when it rejects a steering frame while authority is granted, and keep
      it revoked until a new valid engagement (TSR-108; lead decision DQ-060, option A). At BL-005 the frame is dropped and
      only the host disengages (pandaTxBlocked)'
  - id: SFM-ACT-020
    kind: design_change
    status: completed
    description: 'Stand down during stock AEB: while the car reports a stock PCS/AEB event (stockAeb), LionDriver requests zero
      acceleration, so stock AEB does not depend on PCM arbitration alone (AOU-04R). Lead decision DQ-300, option A (2026-10-18); the
      AOU-04R vehicle test still runs. SFM-036.C1; FTA BE-7.13'
    evidence: 'Merged in jherrodthomas/LionDriver#292 (c045874): stock_aeb_stand_down in longcontrol.py, called from controlsd.py,
      caps the acceleration target and the upper PID limit at 0 m/s² while stockAeb is set and keeps any braking request;
      selfdrive/controls/tests/test_stock_aeb.py, 4 tests. CI: tests run 39296172878 on liondriver-dev 6126485 (2026-10-19), unit tests
      job 1578 passed, 42 skipped, 3 xfailed, no failures or collection errors; process replay passed. The runner collects every
      openpilot/**/test_*.py and prints no test names, so the four tests are shown to have run by collection, not by name; the file
      has no skip. Second layer, opendbc e233362 (#311, SWSR-713h): the Toyota controller caps the 0x343 command at 0 from the first
      frame of the event, after its rate limit, PID and pitch compensation (impact OI-2 done); its 6 test_carcontroller.py cases ran
      locally (pin record). The openpilot runner does not run opendbc_repo tests; tests.yml in the opendbc fork triggers on pull requests, but
      a CI run on jherrodthomas/opendbc#20 is not confirmed here (the pin record says none). Impact records
      assurance/07-supporting/impact/change-2026-10-19-stock-aeb-stand-down.md and change-2026-10-19-pin-e233362.md. TSR-713 and
      FSR-07.07 implemented (#313). Not verified on the vehicle (OI-3, the AOU-04R test, also checks that stockAeb is reported
      during a PCS event) and not reviewed independently. In BL-007, where SFM-036.C1 is re-rated O 8 D 10 -> O 5 D 8 as
      predicted below (targeted tests, not mutation-proven: rating tables D 8)'
    revised:
      severity: 10
      occurrence: 5
      detection: 8
      ap: H
  - id: SFM-ACT-021
    kind: monitoring
    status: open
    description: 'Make the insufficient-lateral-control warning timely (WP-S-04 §3.8.1): warn before the deficit has lasted 0.4 s,
      for example from the planned curvature against the envelope, or keep the deficit at or below about 0.5 m/s² through
      the steering limits and the ODD curve bound (WP-S-04 OI-2). A change to the ODD bound is a lead decision'
  - id: SFM-ACT-022
    kind: monitoring
    status: open
    description: 'Measure the FCW onset after a lead brakes hard (WP-S-04 T-31, M-12) and compare it with the §3.8.2 budget
      (about 0.6 s at a 1.0 s gap). For pipeline lag (SFM-012.C1), detect it within that budget or show that the FCW path
      does not depend on the lagging process'
  - id: SFM-ACT-023
    kind: design_change
    status: completed
    description: 'Escalate a temporary EPS fault that lasts while engaged to the take-over request (steerTempUnavailable, SOFT_DISABLE)
      instead of keeping the low-priority steerTempUnavailableSilent prompt latched after a recent override or at standstill
      (car_events.py; lead decision DQ-342, option A: the lighter prompt for at most 1.5 s, then the take-over request; TSR-607 (b)).
      SFM-038.C1; FTA BE-2.08'
    evidence: 'Merged in jherrodthomas/LionDriver#174 (7158a9a): STEER_FAULT_SILENT_FRAMES in car_events.py limits the lighter prompt to
      the first 1.5 s of the fault; selfdrive/car/tests/test_steer_fault_warning.py, 6 tests run in CI, 4 of them fail on the old code.
      Impact record assurance/07-supporting/impact/change-2026-10-17-eps-fault-escalation.md. Unit-tested only: not verified on the
      vehicle (impact OI-1) and not reviewed independently. Credited at BL-006 (System FMEA rev 0.27): SFM-038.C1 O 8 -> 5,
      D 10 -> 8, AP stays H (S 10): the tests are targeted but not proven by mutation, so D 8 rather than the D 4 predicted below
      (rating tables D 8; a car_events.py mutation run, planned with SWF-ACT-077, would support D 4); f350f5b adds TSR-607 (c) for a
      fault while the driver steers'
    revised:
      severity: 10
      occurrence: 5
      detection: 8
      ap: H
  - id: SFM-ACT-024
    kind: monitoring
    status: open
    description: 'Act on the panda fields epsFault and requestsRejected on the host (TSR-626(d), TSR-516(b)): raise the take-over request
      when the panda reports an EPS fault or refused steering frames while lateral control is engaged, within the SG-02 1 s budget,
      instead of relying on the panda siren alone. Split from SFM-ACT-023 (rev 0.25). SFM-038.C2; FTA BE-2.08'
