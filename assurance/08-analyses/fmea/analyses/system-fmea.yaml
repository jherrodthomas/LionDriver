# ---------------------------------------------------------------------------
# Step 3 — Functions
# ---------------------------------------------------------------------------
functions:
  - id: SFM-FN-001
    element: SFM-SE-001
    description: "F1 Lateral control: request steering torque from the EPS to keep the vehicle in its lane while engaged"
  - id: SFM-FN-002
    element: SFM-SE-001
    description: "F2 Longitudinal control: request acceleration/deceleration to hold set speed and follow leads while engaged"
  - id: SFM-FN-003
    element: SFM-SE-001
    description: "F3 Engagement management: engage only on driver request with entry conditions met; disengage per fault reaction (soft/immediate)"
  - id: SFM-FN-004
    element: SFM-SE-001
    description: "F4 Driver override: release control on brake or cancel; yield lateral to steering input and longitudinal to accelerator"
  - id: SFM-FN-005
    element: SFM-SE-001
    description: "F5 Driver monitoring: detect inattention and escalate alerts; lock out engagement after repeated non-response"
  - id: SFM-FN-006
    element: SFM-SE-001
    description: "F6 Alerting: inform the driver of engagement state, takeover requests and faults (visual and audible)"
  - id: SFM-FN-007
    element: SFM-SE-001
    description: "F7 Actuation limiting: bound actuator commands in magnitude and rate; detect excessive actuation"
  - id: SFM-FN-008
    element: SFM-SE-001
    description: "F8 Stock function preservation: keep stock vehicle safety functions not replaced by the item available"

# ---------------------------------------------------------------------------
# Step 4 — Failure analysis
# ---------------------------------------------------------------------------
failure_modes:

  # ----- F1 Lateral control -----
  - id: SFM-001
    element: SFM-SE-001
    function: SFM-FN-001
    failure_mode: Steering torque applied when not engaged
    guideword: unintended
    effects:
      - {level: local, description: "Torque request sent to EPS outside an active state"}
      - {level: next_higher, description: "Unexpected steering wheel motion and lateral deviation"}
      - {level: end, description: "Driver surprised during manual driving; possible lane departure", hazard: HZ-001, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: controlsd only sets latActive when selfdriveState is active and no EPS fault
        ref: openpilot/selfdrive/controls/controlsd.py
      - description: Panda safety model blocks steering messages unless controls are allowed (heartbeat carries engaged state from selfdriveState)
        ref: openpilot/selfdrive/pandad/pandad.cc
    causes:
      - id: SFM-001.C1
        element: SFM-SE-014
        linked_failure_mode: SWF-030
        description: State machine reports active while disabled
        prevention_controls:
        - description: Upstream code with review; ruff and ty run in fork CI static_analysis; unit tests derived from the implementation; no software requirements
          ref: scripts/lint/lint.sh:45,55; .github/workflows/tests.yaml
        detection_controls:
        - description: test_no_entry and test_no_entry_pre_enable (ENABLE with NO_ENTRY stays disabled), run by tests.yaml unit_tests on every push and PR; not
            proven by mutation
          test: openpilot/selfdrive/selfdrived/tests/test_state_machine.py
        occurrence: 6
        detection: 8
        ap: H
        rationale: Rated, and actioned, in the SW FMEA (SWF-030.C1, SWF-ACT-030); this row inherits that rating
        msr:
          mechanisms:
          - 2
          diagnostic: 'Panda Toyota safety model checks every STEERING_LKA frame: a torque request while controls_allowed is false
            is refused. controls_allowed needs PCM cruise engaged on the car bus and the heartbeat engaged state, so a wrong host
            state alone does not grant it'
          system_response: Frame not sent; no torque request reaches the EPS
          effect_after_response: No assist torque while not engaged; manual steering unaffected. Whether refused frames set an EPS
            LKA fault indication is to be confirmed on the reference car (SFM-ACT-012)
          severity_after: 4
          frequency: 6
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 continuous limits
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota steering checks (torque with controls not allowed, magnitude and rate limits) tested on every PR and
              mutation-tested in CI (safety.yaml mutation job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          - description: 'Plant model F-02: torque request while not engaged refused by the real panda code from the first frame (0.000 s). Simulation cross-check, no rating credit (msr-plan §4.2); EPS and PCM behaviour are model assumptions'
            ref: assurance/sim/results/plant-results.md F-02 (plant 776239d)
          actions:
          - SFM-ACT-012
      - id: SFM-001.C2
        element: SFM-SE-003
        linked_failure_mode: SWF-002
        description: Panda allows steering TX without valid engagement (controls_allowed set incorrectly)
        prevention_controls:
        - description: 'Panda safety code: MISRA C:2012, 100% line coverage, review; rated in the SW FMEA'
          ref: assurance/08-analyses/fmea/analyses/sw-fmea.yaml
        detection_controls:
        - description: opendbc safety suite with 100% line coverage and mutation tests, run by CI on every change (proven, early, test-to-fail)
          test: opendbc_repo/opendbc/safety/tests/test_toyota.py
          ref: .github/workflows/safety.yaml
        occurrence: 5
        detection: 3
        ap: H
        rationale: Rated, and actioned where needed, in the SW FMEA (SWF-002.C1, SWF-ACT-002); this row inherits that rating
        msr:
          mechanisms:
          - 1
          diagnostic: None for this cause. controlsd sends torque only while latActive, so the host channel masks the panda fault
            but nothing detects it; the TSR-621 mismatch check (BL-005) still covers only the opposite direction (enabled, panda not allowed)
          system_response: None; the fault stays latent until the host also commands torque
          effect_after_response: 'Unchanged: torque while not engaged once the host also fails (dual-point, DFA/FTA)'
          severity_after: 10
          frequency: 5
          monitoring: 10
          ap: H
          timing:
            basis: unknown
          actions:
          - SFM-ACT-013
      - id: SFM-001.C3
        element: SFM-SE-016
        linked_failure_mode: SWF-059
        description: Steering message packed with non-zero torque/request bit while latActive is false
        prevention_controls:
        - description: Upstream opendbc Toyota port (DBC, carstate, carcontroller) with upstream review and route-based car tests; no LionDriver requirements;
            no field-exposure evidence for this configuration is credited
          ref: opendbc_repo/opendbc/car/toyota
        detection_controls:
        - description: 'As rated in the SW FMEA (SWF-059.C1, D 9 at BL-005): process_replay (CI) replays the TOYOTA3 Corolla TSS2 segment and compares with reference logs made from the same code, so it cannot find a defect already present at the baseline; not designed for this cause; it compares sendcan'
          test: openpilot/selfdrive/test/process_replay/test_processes.py
        - description: process_replay over the CI route corpus compares outputs with the reference commit (CI 'process replay'); a regression check, not designed
            or proven for this cause
          test: openpilot/selfdrive/test/process_replay/test_processes.py
        occurrence: 4
        detection: 9
        ap: H
        rationale: Rated in the SW FMEA (SWF-059.C1, O 4 D 9 at BL-005); this row inherits that rating. The panda refuses steering torque while controls
          are not allowed (SWF-002, D 3), so this cause leads to the end effect only together with SFM-001.C2; no separate action
        msr:
          mechanisms:
          - 2
          diagnostic: Panda refuses a STEERING_LKA frame carrying torque or the request bit while controls_allowed is false (checked
            on every frame)
          system_response: Frame not sent; no torque request reaches the EPS
          effect_after_response: No assist torque while not engaged; manual steering unaffected (EPS reaction to refused frames to
            confirm, SFM-ACT-012)
          severity_after: 4
          frequency: 4
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 continuous limits
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota steering checks (torque with controls not allowed, magnitude and rate limits) tested on every PR and
              mutation-tested in CI (safety.yaml mutation job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          - description: 'Plant model F-02: torque request while not engaged refused by the real panda code from the first frame (0.000 s). Simulation cross-check, no rating credit (msr-plan §4.2); EPS and PCM behaviour are model assumptions'
            ref: assurance/sim/results/plant-results.md F-02 (plant 776239d)
          actions:
          - SFM-ACT-012
    notes: "HARA input: unintended steering intervention during manual driving."

  - id: SFM-002
    element: SFM-SE-001
    function: SFM-FN-001
