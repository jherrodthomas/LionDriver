# Scope: the ODD speed bound of 110 km/h (DQ-260). Every other inherited row matches its source.
# Rev 0.17 (2026-10-16): 17 host-software causes now link to the SW FMEA P2/P3 rows that rate the same fault at BL-005 (#111, #112)
# and inherit their O and D: SFM-001.C3, 008.C3 (SWF-059, packer); 002.C4 (SWF-076, learned parameters); 003.C1 (SWF-075, calibration);
# 003.C2, 009.C3, 017.C1, 018.C1, 019.C1, 020.C1 (SWF-057, carState decoding); 006.C2 (SWF-072, frozen modelV2); 008.C1 (SWF-065,
# planner); 010.C1 (SWF-070, missed lead); 022.C2, 023.C1, 023.C2 (SWF-061, DM escalation); 032.C1 (SWF-058, fingerprint).
# O falls on 6 causes (SW FMEA has the narrower cause), rises on SFM-008.C1 (6 -> 7); D 8 -> 9 on 11 causes (the SW FMEA credits
# their tests less, e.g. the opendbc car tests are not run by LionDriver CI). MSR F follows O. Every AP stays H. Partial matches are not linked; SFM-025.C1 (O 8) and SWF-062.C1
# (O 6) rate the same design gap differently, raised with the SW FMEA owner.
# Rev 0.18 (2026-10-16): SFM-025.C1 links to SWF-062.C1, now O 8 in the SW FMEA (#144): D 10 -> 9 (test_longitudinal and
# test_monitoring run the forced deceleration and alert levels in CI, not designed for FSR-040). O 8 and AP H unchanged.
# Rev 0.19 (2026-10-16): simulation evidence (no rating credit, msr-plan §4.2) from WP-S-04 v0.11 §3.9 (#145): the steering-override
# run on SFM-018.C1/C2 (host drops LKA within 0.2 s in 18 of 36 runs, never in 8) and N-3 on SFM-004.C1-C3 (saturation at the ODD
# curve bound). No rating changes.
# Rev 0.20 (2026-10-16): SFM-026 (alert not presented) and SFM-027 (alert late) also end in HZ-013: the driver-monitoring escalation
# goes through the same HMI path (FTA F-37; SW FMEA SWF-035, SWF-082, #146). Severity stays 10; no rating changes.
# Rev 0.21 (2026-10-16): end effects the fault trees already rely on (fta-fmea-map warnings): HZ-005 on SFM-013 (unintended
