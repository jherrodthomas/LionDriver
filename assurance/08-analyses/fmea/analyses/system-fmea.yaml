      - {level: next_higher, description: "Item starts actuating"}
      - {level: end, description: "Unexpected steering/acceleration; driver surprised", hazard: HZ-010, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: NO_ENTRY events block engagement (state.py)
        ref: openpilot/selfdrive/selfdrived/state.py
      - description: Toyota uses PCM cruise; engagement follows stock cruise main/set (cruise state in carState)
        ref: openpilot/selfdrive/car/card.py
    causes:
      - id: SFM-013.C1
        element: SFM-SE-014
        linked_failure_mode: SWF-030
        description: State machine transition error
        prevention_controls:
        - description: Upstream code with review; ruff and ty run in fork CI static_analysis; unit tests derived from the implementation; no software requirements
          ref: scripts/lint/lint.sh:45,55; .github/workflows/tests.yaml
        detection_controls:
        - description: test_no_entry and test_no_entry_pre_enable (ENABLE with NO_ENTRY stays disabled), run by tests.yaml unit_tests on every push and PR; not
            proven by mutation
          test: openpilot/selfdrive/selfdrived/tests/test_state_machine.py
        occurrence: 6
        detection: 8
        ap: H
        rationale: Rated, and actioned, in the SW FMEA (SWF-030.C1, SWF-ACT-030); this row inherits that rating
        msr:
          mechanisms:
          - 2
          diagnostic: Panda grants control only on the PCM cruise engage edge read from the car bus, so a wrong host state alone does
            not grant actuation; frames are refused on every cycle. WP-S-04 has no FTTI row for SG-008, so the timing is not compared
          system_response: Frames refused; no actuation
          effect_after_response: No actuation without PCM cruise
