        ref: openpilot/selfdrive/controls/controlsd.py
    causes:
      - {id: SFM-021.C1, element: SFM-SE-016, description: "Cancel message not packed/sent for this car", prevention_controls: [], detection_controls: [], occurrence: null, detection: null, ap: null}
      - {id: SFM-021.C2, element: SFM-SE-031, description: "PCM ignores cancel request", prevention_controls: [], detection_controls: [], occurrence: null, detection: null, ap: null}
    notes: >-
