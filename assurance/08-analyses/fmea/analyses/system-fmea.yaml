# yaml-language-server: $schema=../schema/fmea.schema.json
#
# System FMEA — AIAG-VDA steps 1-5 (scope, structure, function, failure analysis, risk analysis).
# Severity is set from the HARA (rev 0.1): hazard-linked effects are 10 per RT-1 section 1.1.
# Step 5 (rev 0.5): every cause rated against BL-004 per RT-1 (occurrence table 2.1, detection table 3). Basis:
# - Causes linked to a SW FMEA or DFMEA row (linked_failure_mode) inherit that row's controls and ratings; the action is there.
# - Upstream openpilot / opendbc host code: O 6 (review, lint, non-requirements-based tests; no field-exposure credit for this
#   configuration). Neural-network elements: O 7 (no development evidence available). Toyota ECU internals: O 3 under the
#   OEM assumption of use. Design gaps present in the code: O 8.
# - Detection: only the opendbc safety suite is proven (mutation tests in CI, D 3). Host unit tests are targeted but not proven
#   (D 8), process_replay is a generic regression check (D 9), and no vehicle, HIL or system test has been executed (D 10).
# - Result: 79 causes AP H, 1 AP M (SFM-024.C1, nuisance alerts). Actions SFM-ACT-001..011 (no 004).
# `safety_mechanisms` lists the in-field mechanisms in the code; they are design facts and are not credited as detection.
# Rev 0.7 (2026-10-14, RT-2): FMEA-MSR pilot (msr-plan.md M1) on the SG-01 lateral chain, SFM-001/002/003/006/029/034, at
# BL-004: 17 causes rated, 3 hardware causes rated in the DFMEA. F = the cause's O. Best monitoring is M 5: the panda
# per-frame steering checks, mutation-tested, on code-derived timing. Actions SFM-ACT-012..015 (kind monitoring).
# Host supervision added after BL-004 (TSR-615, TSR-621) is not credited; it is re-rated with the next baseline.
# Rev 0.8 (2026-10-14, RT-2): FMEA-MSR complete (msr-plan.md M2): 60 causes rated, 4 hardware causes rated in the DFMEA.
# Monitoring: M 5 on 12 causes (panda per-frame checks, driver brake/gas/cancel revocation), M 7-8 on 16 (warning only, no
# FTTI row, or too slow), M 9-10 on 32 (no monitor). Actions SFM-ACT-016..018 (kind monitoring).
# Rev 0.9 (2026-10-16): baseline BL-005 (liondriver-dev 1033d98, panda a55bdfc, opendbc 9a13f60). The reference build is the
# default at BL-005, so its panda checks are credited. Each claim below was checked against the code at these pins. S, O and
# AP are unchanged. D changes on one cause: SFM-015.C2 10 -> 8 (host unit test test_supervision.py). Rows inherited from the
# SW FMEA and DFMEA keep the ratings of those files (BL-004 / BL-002) until they are re-rated there. MSR re-rated:
# - TSR-621: controlsMismatch after 2 consecutive pandaStates samples, at most 0.5 s after the first mismatched frame
#   (selfdrived.py, supervision.py), replacing 200 cumulative cycles (about 2 s). SFM-015.C2 goes from M 8 to M 6.
# - TSR-408 with TSR-621: the panda revokes authority when STEERING_LKA stops for 50 ms (ACC_CONTROL 100 ms), and the
#   host alerts through controlsMismatch. SFM-005.C2 and SFM-011.C2 go to M 6. SFM-006.C1 stays M 8: the warning is
#   now in time, but the torque decays only when the EPS drops LKA (about 2 s, no active zero frame).
# - TSR-615: a rising safetyTxBlocked while engaged gives pandaTxBlocked (immediate disable), so a refused over-limit frame
#   now also disengages with an alert. The ratings of those rows stay at M 5 (the envelope itself is not yet validated).
#   pandaHeartbeatLost and pandaTxRateExceeded are the primary monitor of no System FMEA cause; they are listed as
#   mechanisms where they apply.
# - TSR-308: cruiseMismatch alerts after 1 s; SFM-021 goes from M 9 to M 7 (warning, no WP-S-04 FTTI row).
# - Reference lock and the reference-build check in pandad: a platform whose Toyota safety parameter is not 73 cannot
#   engage; SFM-032.C1 goes from M 9 to M 8 (a similar platform with parameter 73 is still not detected).
# Result: monitoring M 5-6 on 15 causes (was 12), M 7-8 on 16 (16), M 9-10 on 29 (32). Every MSR AP is still H (provisional table).
# Rev 0.10 (2026-10-16): the lead's answers that set System FMEA effects or actions recorded; no rating changes (the decided
# behaviour is not implemented at BL-005). DQ-060 -> new action SFM-ACT-019 on SFM-002; DQ-053 -> SFM-ACT-016 behaviour
# fixed; DQ-022 -> SFM-020 note; DQ-205 -> SFM-025 note and SFM-ACT-005.
# Rev 0.11 (2026-10-16): the closed-loop plant model (assurance/sim, plant 776239d, real panda safety code in the loop) cited as
# evidence on 13 MSR rows (SFM-001/002/005/006/008/009), per msr-plan §4.2: a cross-check of the code-derived times, no rating
# change, no credit for EPS, PCM or driver behaviour (model assumptions). It confirms the TSR-408 revoke at 43 ms (F-04b) and
# that frozen in-envelope commands get no panda reaction (F-03, L-01, L-03).
# Rev 0.12 (2026-10-16): taken in from the DFMEA at BL-005 (hardware session, RR-2026-010): the harness-box "relay" is two
# DG419LE analog intercept switches with a pull-down default to pass-through, no state feedback, powered from the box supply.
# SFM-033, SFM-034 and SFM-SE-003/004 reworded. SFM-034.C1 O 3 -> 4 (DFM-010.C4, supply transients); SFM-034.C2 D 10 -> 9
# (DFM-011 D 9); AP unchanged (H). New SFM-033.C3: the harness box loses its supply or a switch channel opens, so the stock
# camera is cut off from the car (DFM-020, DFM-013).
# Rev 0.13 (2026-10-16): new SFM-035 (item sends a frame that alters the stock pre-collision function), the System FMEA backing
# for FTA BE-7.08 (WP-A-04 SG-07, F-17). C1: host QM fault, M 5 on the panda per-frame gate. C3: the gate itself lets the frame
# through, M 10 (dual point with C1).
# Also rev 0.13: new SFM-036 (item keeps requesting acceleration while stock PCS brakes), backing FTA BE-7.13; action SFM-ACT-020
# waits on the lead (DQ-300, queued).
# Rev 0.14 (2026-10-16): taken in from WP-C-03 v0.4 (HARA session, #96): scope is the highway-only ODD (DQ-023); H-09 and SG-08
# cited on SFM-025 and SFM-ACT-005 (the hara-mapping already maps HZ-013 -> H-09, SG-010 -> SG-08); SFM-013 notes that
# engagement outside the ODD is misuse, not a fault cause. No rating changes.
# Rev 0.15 (2026-10-16): taken in from WP-S-02 v0.22 §12.3a and WP-S-04 v0.7 §3.7/§3.8 (safety-concept session, #105). Actions
# SFM-ACT-005/013/015/016/018 cite their TSRs (630-633 new); SFM-ACT-017 is completed. S, O, D and AP unchanged. MSR compared
# with the new warning-path rows:
# - SFM-004.C1-C3: M 7 -> 8. steerSaturated (0.4 s) is late for a credible 0.5-1.0 m/s² deficit (§3.8.1). SFM-ACT-021.
# - SFM-012.C1: M 7 -> 8. Lag detection (1 s) plus soft disable (3 s) exceeds the 1.6 s FCW budget (§3.8.2). SFM-ACT-022.
# - SFM-010.C2/C3: M 7 kept, FTTI row cited; the FCW onset is not derived (T-31). SFM-ACT-022.
# - SFM-013.C1/C2: M 7 -> 5. The panda's per-frame engage-edge gate is within the 0.5 s budget (§3.8.3), mutation-tested;
#   its latent fault is SFM-001.C2 (SFM-ACT-013, TSR-630).
# - SFM-022.C3: M 7 kept; no FTTI until the H-09 goal has one (§3.8.4). Follow-up moves to SFM-ACT-005.
# The TSRs are not implemented at BL-005 and are not credited.
# Rev 0.16 (2026-10-16): two rows inherited from the SW FMEA now follow its BL-005 ratings (rev 0.8-1.0, #95, #111, #112):
# - SFM-016.C2 (late disengagement, SWF-034.C1): O 8 -> 5, D 10 -> 8; the BL-005 controlsMismatch supervision (TSR-621). AP H.
# - SFM-029.C1 (wrong safety model or parameter, SWF-013.C2): O 8 -> 3, D 9 -> 4; the reference build is the default and checked
