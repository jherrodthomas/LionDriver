    causes:
      - id: SFM-006.C1
        element: SFM-SE-013
        linked_failure_mode: SWF-047
        description: controlsd hangs while card keeps sending the last carControl
        prevention_controls:
        - description: Upstream review, ruff, ty; excluded from fuzzing (test_fuzzy.py:13)
        detection_controls:
        - description: No test injects non-finite lateralDelay
        occurrence: 6
        detection: 10
        ap: H
        rationale: Rated, and actioned, in the SW FMEA (SWF-047.C1, SWF-ACT-041, SWF-ACT-044); this row inherits that rating
        msr:
          mechanisms:
          - 1
          - 3
          diagnostic: 'selfdrived liveness check on controlsState (10 missed periods at 100 Hz, T-14); card stops sending once carControl
            is 0.1 s old (T-13). BL-005: 50 ms after the last STEERING_LKA frame the panda clears controls_allowed (TSR-408), and
