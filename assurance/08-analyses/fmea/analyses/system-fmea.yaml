          effect_after_response: Last torque command held about 0.1 s, then LKA frames stop and assist decays over about 2 s. The driver
            is now warned within about 0.66 s, but the actuation reaction is still beyond the 0.5 s FTTI
          severity_after: 10
          frequency: 6
          monitoring: 8
          ap: H
          timing:
