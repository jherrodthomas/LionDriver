  - id: SFM-013
    element: SFM-SE-001
    function: SFM-FN-003
    failure_mode: Engagement without driver request or with entry conditions not met
    guideword: unintended
    effects:
      - {level: local, description: "State machine enters enabled without ENABLE or despite NO_ENTRY"}
      - {level: next_higher, description: "Item starts actuating"}
      - {level: end, description: "Unexpected steering/acceleration; driver surprised", hazard: HZ-010, severity: 10}
      - {level: end, description: "Contributes to HZ-005: positive acceleration requested after an engagement the driver did not ask for", hazard: HZ-005, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: NO_ENTRY events block engagement (state.py)
        ref: openpilot/selfdrive/selfdrived/state.py
      - description: Toyota uses PCM cruise; engagement follows stock cruise main/set (cruise state in carState)
        ref: openpilot/selfdrive/car/card.py
    causes:
      - id: SFM-013.C1
        element: SFM-SE-014
        linked_failure_mode: SWF-030
        description: State machine transition error
        prevention_controls:
        - description: Upstream code with review; ruff and ty run in fork CI static_analysis; unit tests derived from the implementation; no software requirements
          ref: scripts/lint/lint.sh:45,55; .github/workflows/tests.yaml
        detection_controls:
        - description: test_no_entry and test_no_entry_pre_enable (ENABLE with NO_ENTRY stays disabled), run by tests.yaml unit_tests on every push and PR; not
            proven by mutation
          test: openpilot/selfdrive/selfdrived/tests/test_state_machine.py
        occurrence: 6
        detection: 8
        ap: H
        rationale: Rated, and actioned, in the SW FMEA (SWF-030.C1, SWF-ACT-030); this row inherits that rating
        msr:
          mechanisms:
          - 2
          diagnostic: Panda grants control only on the PCM cruise engage edge read from the car bus, so a wrong host state alone does
            not grant actuation; frames are refused on every cycle; within the 0.5 s unintended-engagement budget (WP-S-04 §3.8.3)
          system_response: Frames refused; no actuation
          effect_after_response: No actuation without PCM cruise
          severity_after: 4
          frequency: 6
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 / SG-03 unintended engagement (System FMEA SG-008, §3.8.3)
            ftti_ms: 500
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota controls_allowed only on the PCM cruise engage edge (test_enable_control_allowed_from_cruise,
              test_cruise_engaged_prev in the common car safety tests) and no steering or acceleration frame without it, tested
              on every PR and mutation-tested in CI (safety.yaml mutation job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          - description: 'BL-006: the engagement edge is narrowed further. A cruise edge refused for MAIN_ON = 0 closes the engagement
              window (opendbc#17, SM-F1; test_main_off_closes_engagement_window), no authority after a safety-mode change without a
              new engagement (DQ-080; test_no_grant_after_mode_set_without_new_engagement) and no re-engagement while a TX-rate excess
              persists (DQ-079; test_tx_rate_no_reengagement_while_excess_persists), opendbc#15. Evidence only: no rating change'
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
          actions:
          - SFM-ACT-013
      - id: SFM-013.C2
        element: SFM-SE-016
        description: Cruise state or button parsed incorrectly (spurious enable)
        prevention_controls:
        - description: Upstream opendbc Toyota port (DBC, carstate, carcontroller) with upstream review and route-based car tests; no LionDriver requirements;
            no field-exposure evidence for this configuration is credited
          ref: opendbc_repo/opendbc/car/toyota
        detection_controls:
        - description: opendbc car tests check carState against the panda safety model on recorded routes (test_models); targeted at parse and pack consistency,
            not proven by fault injection, and run only where the route corpus is available
          test: opendbc_repo/opendbc/car/tests/test_models.py
        occurrence: 6
        detection: 8
        ap: H
        actions:
        - SFM-ACT-003
        rationale: The panda independently requires a rising edge of PCM_CRUISE CRUISE_ACTIVE before it allows controls (SWF-007, D 3)
        msr:
          mechanisms:
          - 2
          diagnostic: Panda parses the PCM cruise state itself and grants control only on its engage edge; a host parsing error does
            not grant actuation; within the 0.5 s unintended-engagement budget (WP-S-04 §3.8.3)
          system_response: Frames refused; no actuation
          effect_after_response: No actuation without PCM cruise
          severity_after: 4
          frequency: 6
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-01 / SG-03 unintended engagement (System FMEA SG-008, §3.8.3)
            ftti_ms: 500
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: Toyota controls_allowed only on the PCM cruise engage edge (test_enable_control_allowed_from_cruise,
              test_cruise_engaged_prev in the common car safety tests) and no steering or acceleration frame without it, tested
              on every PR and mutation-tested in CI (safety.yaml mutation job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          - description: 'BL-006: the engagement edge is narrowed further. A cruise edge refused for MAIN_ON = 0 closes the engagement
              window (opendbc#17, SM-F1; test_main_off_closes_engagement_window), no authority after a safety-mode change without a
              new engagement (DQ-080; test_no_grant_after_mode_set_without_new_engagement) and no re-engagement while a TX-rate excess
              persists (DQ-079; test_tx_rate_no_reengagement_while_excess_persists), opendbc#15. Evidence only: no rating change'
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
          actions:
          - SFM-ACT-013
    notes: >-
      HARA input: unintended engagement. Engagement outside the ODD (off the highway, WP-C-03 v0.4 OS-03/04/15/16) is not
      prevented by the item; it is foreseeable misuse rated in the HARA and WP-C-08, not a fault cause of this failure mode.

