        ref: openpilot/selfdrive/selfdrived/selfdrived.py
      - description: 'BL-005 (reference build by default): the panda accepts only TOYOTA with parameter 73, SILENT, NOOUTPUT and ELM327, and
          once TOYOTA is active only NOOUTPUT or SILENT (reference_lock.h, TSR-512/513); pandad configures a car mode only on a panda
          that reports a reference build, and selfdrived names a non-reference panda (pandaNotReferenceBuild, TSR-514/619)'
        ref: panda/board/reference_lock.h
    causes:
      - id: SFM-029.C1
        element: SFM-SE-003
        linked_failure_mode: SWF-013
        description: Wrong safety model or parameter set for this car
        prevention_controls:
        - description: 'Panda safety code: MISRA C:2012, 100% line coverage, review; rated in the SW FMEA'
          ref: assurance/08-analyses/fmea/analyses/sw-fmea.yaml
        detection_controls:
        - description: 'As rated in the SW FMEA: no test covers the build configuration'
          ref: assurance/08-analyses/fmea/analyses/sw-fmea.yaml
        occurrence: 8
        detection: 9
        ap: H
        rationale: Rated, and actioned where needed, in the SW FMEA (SWF-013.C2 O8 D9, SWF-ACT-009; open LionDriver#36/#41 set and check the reference build);
          this row inherits that rating
        msr:
          mechanisms:
          - 1
          - 2
          diagnostic: 'controlsMismatch compares the panda safety model and parameter with CarParams, only from 10 s after start (T-18).
            BL-005: the panda refuses any car mode other than TOYOTA parameter 73, so a wrong request leaves it out of the car mode and the
            mismatch blocks engagement; a non-reference panda is named (pandaNotReferenceBuild). Not compared with an FTTI: the fault
            is present from power-up'
          system_response: IMMEDIATE_DISABLE with alert; engagement refused while the mismatch persists
          effect_after_response: Item disengaged with an alert
          severity_after: 8
          frequency: 8
          monitoring: 7
          ap: H
          timing:
            fdti_ms: 10000
            frti_ms: 10
            basis: code_derived
          actions:
