      - {level: end, description: "Driver cannot retake control as expected (SAFETY.md requirement 1 violated)", hazard: HZ-008, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: selfdrived raises pedalPressed (USER_DISABLE) on brake press
        ref: openpilot/selfdrive/selfdrived/selfdrived.py
      - description: Panda safety model independently drops controls_allowed on brake press (firmware, to verify)
        ref: opendbc_repo
    causes:
      - {id: SFM-017.C1, element: SFM-SE-016, description: "brakePressed parsed wrong or CAN signal missing", prevention_controls: [], detection_controls: [], occurrence: null, detection: null, ap: null}
      - {id: SFM-017.C2, element: SFM-SE-014, description: "Car events ignored when canValid is false", prevention_controls: [], detection_controls: [], occurrence: null, detection: null, ap: null}
    notes: "HARA input: driver brake does not cancel automation. Directly tied to SAFETY.md requirement 1."

  - id: SFM-018
