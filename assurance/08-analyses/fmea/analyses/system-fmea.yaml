        ap: H
        rationale: Rated in the SW FMEA (SWF-072.C2, O 4 D 10 at BL-005); this row inherits that rating
        actions:
        - SFM-ACT-002
        msr:
          mechanisms:
          - 1
          diagnostic: 'Liveness and frequency checks pass: the frozen model output is still published on time and marked valid. No
            frozen-content or age check on model outputs. BL-005: controlsd drops lateral control when modelV2 is more than 0.5 s older than selfdriveState
            (TSR-602), which a frozen output published on time passes'
          system_response: None until another check trips
          effect_after_response: 'Unchanged: steering follows a frozen path'
          severity_after: 10
          frequency: 4
          monitoring: 9
          ap: H
          timing:
            basis: unknown
          evidence:
          - description: 'Plant model F-03: command frozen at curve entry with the heartbeat alive: no panda reaction; only the drift cue to the driver at 1.4 s, which supports M 9. Simulation cross-check, no rating credit (msr-plan §4.2); EPS and PCM behaviour are model assumptions'
            ref: assurance/sim/results/plant-results.md F-03 (plant 776239d)
          actions:
          - SFM-ACT-015
      - id: SFM-006.C3
        element: SFM-SE-019
