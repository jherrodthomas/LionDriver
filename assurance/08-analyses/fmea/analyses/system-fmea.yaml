  - id: SFM-035
    element: SFM-SE-001
    function: SFM-FN-008
    failure_mode: Item sends a frame that alters the stock pre-collision function
    guideword: unintended
    effects:
      - {level: local, description: "A PCS-relevant frame from the SoC (0x344 PRE_COLLISION_2, 0x411 PCS_HUD, a DSU-only ID, or 0x283 PRE_COLLISION with a non-zero payload) reaches the car bus"}
      - {level: next_higher, description: "Stock PCS warning or braking suppressed, altered or triggered by the item"}
      - {level: end, description: "Stock AEB/FCW degraded while the driver relies on it", hazard: HZ-011, severity: 10}
      - {level: end, description: "Contributes to HZ-006: PCS braking triggered by a frame from the item", hazard: HZ-006, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: >-
          Panda TX whitelist and content check: 0x344 and the DSU IDs are refused in every build, 0x411 in the reference build
          (the default since BL-005), and 0x283 passes only with a zero payload (TSR-705)
        ref: opendbc_repo/opendbc/safety/modes/toyota.h
        test: opendbc_repo/opendbc/safety/tests/test_toyota.py
      - description: 'BL-005: a refused frame while engaged raises pandaTxBlocked (IMMEDIATE_DISABLE) at the next pandaStates sample (TSR-615)'
        ref: openpilot/selfdrive/selfdrived/supervision.py
        test: openpilot/selfdrive/selfdrived/tests/test_supervision.py
    causes:
      - id: SFM-035.C1
        element: SFM-SE-016
        description: Host code (car interface, pandad) emits a PCS-relevant ID or a non-zero PRE_COLLISION payload (QM fault)
        prevention_controls:
        - description: Upstream opendbc Toyota port; no carcontroller path builds 0x344, 0x411 or the DSU IDs for the reference car, and 0x283 is sent
            with a zero payload only; no LionDriver requirements, no field-exposure credit
          ref: opendbc_repo/opendbc/car/toyota
        detection_controls:
        - description: process_replay over the CI route corpus compares sendcan with the reference commit; a regression check, not designed or proven
            for this cause
          test: openpilot/selfdrive/test/process_replay/test_processes.py
        occurrence: 6
        detection: 9
        ap: H
        rationale: The panda refuses these frames on every frame (SFM-035.C3 is the case where that check fails); no separate action. A compromised
          SoC sending them on purpose is a TARA topic, out of scope here
        msr:
          mechanisms:
          - 1
          - 2
          diagnostic: The panda checks every frame from the SoC against the TX whitelist and the 0x283 zero-payload rule before it is sent
          system_response: Frame refused, the stock PCS path is untouched; while engaged the refusal also gives pandaTxBlocked, an immediate
            disable with a take-over alert
          effect_after_response: Stock PCS unaffected. While engaged the item disengages with an alert (controlled handback, S 8), the worst
            effect left after the response
          severity_after: 8
          frequency: 6
          monitoring: 5
          ap: H
          timing:
            ftti_ref: SG-07 content (TX gate, block list)
            fdti_ms: 0
            frti_ms: 10
            basis: code_derived
          evidence:
          - description: test_pcs_and_dsu_messages_blocked, test_pcs_hud and the PRE_COLLISION payload test, run on every PR and mutation-tested
              in both the standard and the reference variant (safety.yaml mutation and mutation_reference jobs)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          rationale: M 5 on the per-frame gate, mutation-tested, code-derived. Not measured on the reference car (SFM-ACT-012 covers the
            HIL and vehicle check of refused frames)
      - id: SFM-035.C3
        element: SFM-SE-003
        description: The TX whitelist or the PRE_COLLISION content check lets a PCS-relevant frame through (table change, or a build that
          is not the reference build, where 0x411 is allowed by design)
        prevention_controls:
        - description: 'Panda safety code: MISRA C:2012, 100% line coverage, review; reduced whitelist (TSR-705); reference build the default
            since BL-005 (pandad requires it, TSR-514/619)'
          ref: opendbc_repo/opendbc/safety/modes/toyota.h
        detection_controls:
        - description: opendbc safety suite with 100% line coverage and mutation tests in both variants, run by CI on every change (proven, early,
            test-to-fail)
          test: opendbc_repo/opendbc/safety/tests/test_toyota.py
          ref: .github/workflows/safety.yaml
        occurrence: 5
        detection: 3
        ap: H
        rationale: The whitelist is a static table pinned by mutation-proven tests in both variants; the non-reference variant keeps 0x411 by
          design and cannot configure a car mode with pandad at BL-005. No SW FMEA mode covers the table yet (FTA BE-7.07, for the SW FMEA)
        msr:
          mechanisms:
          - 1
          diagnostic: 'None: the gate is itself the monitor that has failed; pandaTxBlocked counts only refused frames'
          system_response: None
          effect_after_response: 'Unchanged: the frame reaches the car while the SoC sends it'
          severity_after: 10
          frequency: 5
          monitoring: 10
          ap: H
          timing:
            basis: unknown
          rationale: No in-field monitor can see a defect in the gate itself; the CI mutation tests are the barrier. Kept as a known gap with
            the dual-point condition of FTA MCS-07.7 (the SoC must also send the frame, SFM-035.C1)
    notes: >-
      Backs FTA BE-7.08 (WP-A-04 SG-07, F-17): the SoC sends a PCS-relevant frame. The retired WP-A-04 §10 table had the same mode (DQ-127).

  - id: SFM-036
    element: SFM-SE-001
    function: SFM-FN-008
    failure_mode: Item keeps requesting acceleration while stock PCS brakes
    guideword: unintended
    effects:
      - {level: local, description: "ACC_CONTROL keeps carrying the planner's acceleration request while the stock camera reports a PCS braking event"}
      - {level: next_higher, description: "PCS braking depends on the PCM giving it priority over the item's request (AOU-04R, unverified)"}
      - {level: end, description: "Stock AEB deceleration reduced or delayed if the PCM arbitrates otherwise", hazard: HZ-011, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: 'stockAeb (PRE_COLLISION PRECOLLISION_ACTIVE with negative FORCE) raises a PERMANENT "BRAKE!" alert and blocks engagement (NO_ENTRY);
          it has no disable reaction and does not change the longitudinal request'
        ref: openpilot/selfdrive/selfdrived/events.py
      - description: Driver brake press revokes longitudinal authority in the panda (T-04)
        ref: opendbc_repo/opendbc/safety/safety.h
        test: opendbc_repo/opendbc/safety/tests/test_toyota.py
      - description: 'BL-007 (#292, DQ-300 A, TSR-713): while stockAeb is set, controlsd caps the acceleration target and the upper PID limit at
          0 m/s² and keeps any braking request (stock_aeb_stand_down, longcontrol.py); second layer, opendbc e233362: the Toyota controller caps
          the 0x343 command at 0 from the first frame of the event, after its rate limit (SWSR-713h)'
        ref: openpilot/selfdrive/controls/lib/longcontrol.py
        test: openpilot/selfdrive/controls/tests/test_stock_aeb.py
    causes:
      - id: SFM-036.C1
        element: SFM-SE-013
        description: 'Defect in the stand-down of DQ-300 A (#292): stock_aeb_stand_down not called or not capping the target and the upper PID limit
          while stockAeb is set, or the opendbc 0x343 cap not applied, so the item keeps requesting the planner''s acceleration during a stock PCS
          event (FTA BE-7.13). Up to BL-006 the cause was a design gap: the item had no reaction to a stock PCS event on its longitudinal command'
        prevention_controls:
        - description: 'Lead decision DQ-300 A implemented in #292 (c045874) and opendbc e233362 (#311); new LionDriver code reviewed in the PR only,
            ruff and ty in CI; O 5 as the other new host code with targeted tests. FSR-07.04 keeps PCS priority in the PCM as the external measure
            (AOU-04R)'
          ref: assurance/07-supporting/impact/change-2026-10-19-stock-aeb-stand-down.md
        detection_controls:
        - description: 'test_stock_aeb.py (4 tests) in the CI unit_tests job (tests run 39296172878); targeted, not proven by mutation, so D 8. The
            opendbc test_carcontroller.py cases ran locally only (LionDriver CI does not run opendbc car tests). Not verified on the vehicle (the
            AOU-04R test also checks that stockAeb is reported during a PCS event)'
          test: openpilot/selfdrive/controls/tests/test_stock_aeb.py
        occurrence: 5
        detection: 8
        ap: H
        previous:
          baseline: BL-006
          occurrence: 8
          detection: 10
          ap: H
          change: 'DQ-300 A implemented (#292, opendbc e233362): zero acceleration request while stockAeb is set; the cause is now a defect in that code'
        actions:
        - SFM-ACT-020
        msr:
          mechanisms:
          - 1
          - 2
          diagnostic: stockAeb detects the PCS event from the stock camera's PRE_COLLISION frame and raises an alert; nothing checks that the
            stand-down acted
          system_response: Alert only when the stand-down is defective; the longitudinal request continues until the driver brakes (panda revokes
            on the brake press)
          effect_after_response: 'Unchanged unless the PCM gives PCS priority (AOU-04R): the item may still oppose stock braking'
          severity_after: 10
          frequency: 5
          monitoring: 8
          ap: H
          timing:
            basis: unknown
          rationale: 'M 8: the diagnostic targets this cause, but the response does not reach a safe state; the PCS case has no WP-S-04
            FTTI row for the item side (SG-07 budgets cover forwarding only)'
          actions:
          - SFM-ACT-020
      - id: SFM-036.C2
        element: SFM-SE-031
        description: The PCM does not give stock PCS braking priority over the item's ACC_CONTROL request (AOU-04R not met)
        prevention_controls:
        - description: Series-production Toyota ECU; PCS priority over 0x343 assumed (AOU-04R), not verified by LionDriver
        detection_controls:
        - description: No pre-release test targets this cause; AOU-04R needs a message review and a PCS target test (WP-C-04)
        occurrence: 3
        detection: 10
        ap: H
        actions:
        - SFM-ACT-006
        rationale: 'Internal behaviour of a Toyota ECU, outside the item (scope: interface only); characterised by the AOU-04R vehicle test
          (SFM-ACT-006)'
        msr:
          mechanisms:
          - 1
          - 3
          diagnostic: 'The item cannot see how the PCM arbitrates. BL-007: on the stockAeb flag it stops requesting acceleration (mechanism 3),
            so what the PCM arbitrates against is a zero request, not the planner''s acceleration'
          system_response: Zero acceleration request while stockAeb is set (#292, opendbc e233362)
          effect_after_response: Stock braking no longer opposed by an item acceleration request, provided stockAeb is reported during the event;
            not verified on the vehicle (AOU-04R test)
          severity_after: 10
          frequency: 3
          monitoring: 7
          ap: H
          timing:
            basis: unknown
          rationale: 'M 7 (was 10 up to BL-006): the stand-down targets the PCS event whatever the PCM does, but its timing is not compared with an
            FTTI and the stockAeb report during a real PCS event is unverified'
          actions:
          - SFM-ACT-020
    notes: >-
      Backs FTA BE-7.13 (WP-A-04 SG-07, F-17); the PCM side is UE-7.14 (AOU-04R). Cut set MCS-07.10 = {BE-7.13, UE-7.14}: at the
      baseline BE-7.13 is always true (C1), so the PCM assumption carries the goal alone. The lead decided the item stands down on a stock
      PCS event (DQ-300 A, 2026-10-18: zero acceleration request while stockAeb is set); SFM-ACT-020 carries the change; it is implemented in #292 (c045874) and opendbc e233362, both in BL-007, where C1 is
      re-rated to a defect of the stand-down (O 5 D 8) and C2's MSR row credits the zero request (M 7).

