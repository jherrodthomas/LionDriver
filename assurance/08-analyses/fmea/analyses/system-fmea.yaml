        msr:
          mechanisms:
          - 1
          - 3
          diagnostic: 'selfdrived liveness check on controlsState (10 missed periods at 100 Hz, T-14); card stops sending once carControl
            is 0.1 s old (T-13). BL-005: 50 ms after the last STEERING_LKA frame the panda clears controls_allowed (TSR-408), and
            selfdrived raises controlsMismatch within 0.5 s (TSR-621)'
          system_response: controlsMismatch IMMEDIATE_DISABLE with alert (and commIssue SOFT_DISABLE); no frame is sent after the
            stall, so the torque ends only when the EPS drops LKA, about 2 s later (T-23); there is no active zero frame (TSR-109)
          effect_after_response: Last torque command held about 0.1 s, then LKA frames stop and assist decays over about 2 s. The driver
            is now warned within about 0.66 s (in BL-007 the panda siren comes first, about 0.25 s after the last frame, DQ-404), but
            the actuation reaction is still beyond the 0.5 s FTTI
          severity_after: 10
          frequency: 6
          monitoring: 8
          ap: H
          timing:
            ftti_ref: SG-01 SoC command stall
            ftti_ms: 500
            fdti_ms: 160
            frti_ms: 2000
            basis: code_derived
          evidence:
          - description: 'Plant model F-04b, F-04b-H (panda f4803c5): SoC stall: authority revoked at 0.043 s (TSR-408) and the panda siren at 0.25 s (TSR-516(b), DQ-404, in BL-007); EPS torque below 5 % at 0.33 s if the EPS releases, 2.3 s if it holds (assumption, M-02), which is why this row stays M 8: the siren warns the driver but does not end the torque. Simulation cross-check, no rating credit (msr-plan §4.2); EPS and PCM behaviour are model assumptions'
            ref: assurance/sim/results/plant-results.md F-04b, F-04b-H (plant 6332733)
          actions:
