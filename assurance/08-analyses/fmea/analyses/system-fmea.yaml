  - id: SFM-005
    element: SFM-SE-001
    function: SFM-FN-001
    failure_mode: Loss of lateral control without driver alert
    guideword: loss
    effects:
      - {level: local, description: "Steering requests stop or are ignored while the item shows engaged"}
      - {level: next_higher, description: "Vehicle no longer follows the lane"}
      - {level: end, description: "Driver unaware of loss; lane departure", hazard: HZ-004, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: steerUnavailable (IMMEDIATE_DISABLE) and steerTempUnavailable (SOFT_DISABLE) from EPS fault signals
        ref: openpilot/selfdrive/car/car_events.py
      - description: Process liveness/frequency checks raise commIssue / processNotRunning (SOFT_DISABLE)
        ref: openpilot/selfdrive/selfdrived/selfdrived.py
      - description: 'BL-005, reference build (default): the panda revokes authority when STEERING_LKA has not arrived from the SoC for 50 ms
          (ACC_CONTROL 100 ms) while authority is granted, checked by the 100 Hz safety task (TSR-408)'
        ref: opendbc_repo/opendbc/safety/safety.h
        test: opendbc_repo/opendbc/safety/tests/test_toyota.py
      - description: 'BL-005: controlsMismatch (IMMEDIATE_DISABLE) when the panda reports controlsAllowed false while engaged, after 2 consecutive
          pandaStates samples and at most 0.5 s after the first mismatched frame (TSR-621)'
        ref: openpilot/selfdrive/selfdrived/supervision.py
        test: openpilot/selfdrive/selfdrived/tests/test_supervision.py
    causes:
      - id: SFM-005.C1
        element: SFM-SE-030
        description: EPS stops accepting requests without a fault signal on CAN
        prevention_controls:
        - description: Series-production Toyota ECU with long field exposure; assumed developed to ISO 26262 by the OEM (assumption of use, not verified by LionDriver)
        detection_controls:
        - description: No pre-release test targets this cause
        occurrence: 3
        detection: 10
        ap: H
        actions:
        - SFM-ACT-003
        rationale: 'Internal failure of a Toyota ECU, outside the item (scope: interface only). Covered by the assumption that the OEM ECU meets its own safety
          requirements (AOU) and by the in-field mechanisms listed for this failure mode; LionDriver can only characterize the interface behaviour (SFM-ACT-003)'
        msr:
          mechanisms:
          - 1
          diagnostic: 'None: steerUnavailable needs an EPS fault signal, which this cause does not produce'
          system_response: None
          effect_after_response: 'Unchanged: assist lost silently; only the driver notices'
          severity_after: 10
          frequency: 3
          monitoring: 10
          ap: H
          timing:
            basis: unknown
          actions:
          - SFM-ACT-018
      - id: SFM-005.C2
        element: SFM-SE-017
        linked_failure_mode: SWF-024
        description: pandad stops forwarding TX without the state being reported
        prevention_controls:
        - description: None specific. Whether the comma 3X ever suspends after boot while openpilot runs (offset > 0) is not established
        detection_controls:
        - description: No test targets this cause; no test exercises the age gate
        occurrence: 5
        detection: 10
        ap: H
        rationale: Rated, and actioned, in the SW FMEA (SWF-024.C1, SWF-ACT-023, SWF-ACT-026, SWF-ACT-024); this row inherits that rating
        msr:
          mechanisms:
          - 3
          - 4
          diagnostic: 'BL-005: when no STEERING_LKA frame reaches the panda for 50 ms while authority is granted, the 100 Hz safety task
            clears controls_allowed (tx_arrival_ok, safety.h; TSR-408). pandad keeps publishing pandaStates, so selfdrived sees
            controlsAllowed false on the next sample and raises controlsMismatch after 2 consecutive samples, at most 0.5 s after the
            first mismatched frame (TSR-621). At BL-004 only the EPS drop-out path existed (about 3.5 s)'
          system_response: controlsMismatch IMMEDIATE_DISABLE with a take-over alert; the EPS drops LKA once frames stop
          effect_after_response: Lateral control lost with a take-over alert within about 0.56 s of the last frame; controlled handback
          severity_after: 8
          frequency: 5
          monitoring: 6
          ap: H
          timing:
            ftti_ref: SG-02/06 loss without warning
            ftti_ms: 1000
            fdti_ms: 60
            frti_ms: 500
            basis: code_derived
          evidence:
          - description: TX arrival supervision unit-tested in the reference variant and mutation-tested in CI (safety.yaml
              mutation_reference job)
            test: opendbc_repo/opendbc/safety/tests/test_toyota.py
            ref: .github/workflows/safety.yaml
          - description: controlsMismatch sample and time bounds unit-tested (tests.yaml unit_tests); not mutation-tested
            test: openpilot/selfdrive/selfdrived/tests/test_supervision.py
          rationale: M 6, not 5. The panda half is mutation-tested; the host half that raises the alert is only unit-tested, and
            nothing is measured (SFM-ACT-012). The 0.5 s FRTI is the TSR-621 bound; two 10 Hz samples give about 0.2 s nominally
          actions:
          - SFM-ACT-012
          - SFM-ACT-018
      - id: SFM-005.C3
        element: SFM-SE-019
        description: Process crash or hang not detected by liveness checks
        prevention_controls:
        - description: Upstream openpilot code with upstream review; ruff and type checks in CI (static analysis job); unit tests are not requirements-based;
            no field-exposure evidence for this configuration, so none is credited (RT-1 §2.2)
          ref: scripts/lint/lint.sh
        - description: manager restarts and reports processes; selfdrived raises processNotRunning and commIssue from SubMaster alive/frequency checks
          ref: openpilot/selfdrive/selfdrived/selfdrived.py
        detection_controls:
        - description: No pre-release test targets this cause
        occurrence: 6
        detection: 10
        ap: H
        actions:
        - SFM-ACT-002
        msr:
          mechanisms:
          - 2
          diagnostic: 'None: by definition the hang escapes the liveness and frequency checks'
          system_response: None
          effect_after_response: 'Unchanged: assist frozen or lost without an alert'
          severity_after: 10
          frequency: 6
          monitoring: 10
          ap: H
          timing:
            basis: unknown
          actions:
          - SFM-ACT-018
    notes: "With a correct alert the effect is a controlled handback (S 8 per RT-1). Without one it is a HARA candidate."

