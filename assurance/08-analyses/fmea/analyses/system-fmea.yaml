  - id: SFM-025
    element: SFM-SE-001
    function: SFM-FN-005
    failure_mode: Terminal driver-unresponsive state does not bring the item to a safe state
    guideword: insufficient
    effects:
      - {level: local, description: "Alert level three shows \"DISENGAGE IMMEDIATELY\" but the item stays engaged"}
      - {level: next_higher, description: "Vehicle continues under automation with an unresponsive driver"}
      - {level: end, description: "No fallback if the driver is incapacitated", hazard: HZ-013, severity: 10}
    severity: 10
    safety_mechanisms:
      - description: 'Lockout after repeated non-response prevents re-engagement (1/5/15/30 min); since #372 (BL-007) the lockout timer
          runs from the driver''s takeover, not from the start of the stop'
        ref: openpilot/selfdrive/monitoring/policy.py
      - description: 'BL-007 (#372, TSR-633, DQ-365 A): selfdrived latches the minimum-risk manoeuvre from the first no-response request until
          the item disengages (minimum_risk.py, selfdriveState.minimumRiskManeuver); controlsd keeps forceDecel on while it is set, so the planner
          keeps the stop request and the Toyota controller keeps requesting standstill hold, and the terminal alert is re-raised while latched.
          Since #374 (TSR-624) the stop is announced by a countdown before it starts. Reference platform and all others alike'
        ref: openpilot/selfdrive/selfdrived/minimum_risk.py
        test: openpilot/selfdrive/selfdrived/tests/test_minimum_risk.py
    causes:
      - id: SFM-025.C1
        element: SFM-SE-014
        linked_failure_mode: SWF-062
        description: 'Defect in the minimum-risk manoeuvre of TSR-633 (#372): the latch in minimum_risk.py not set or cleared while the item is
          still engaged, controlsd not keeping forceDecel on while selfdriveState.minimumRiskManeuver is set, or the terminal alert not re-raised, so
          the car resumes or keeps driving with an unresponsive driver. Up to BL-006 the cause was by design: the terminal alerts were ET.PERMANENT
          only and the forced deceleration was recomputed every DM frame, so a dmonitoringd restart or an awareness reset dropped it'
        prevention_controls:
        - description: 'Lead decision DQ-365 A implemented as TSR-633 (#372, dacd8f7; #374, 59e22e0 for the announcement); new LionDriver code on
            upstream openpilot, reviewed in the PR only, ruff and ty in CI; O 5 as the other new host code with targeted tests (SW FMEA SWF-062.C1)'
          ref: openpilot/selfdrive/selfdrived/minimum_risk.py
        detection_controls:
        - description: 'Proven by mutation in CI after BL-007 (MR-1..MR-7, tools/ci/host_mutation.py), as SWF-062.C1; D 8 -> 4 (System FMEA rev 0.37)'
          ref: tools/ci/host_mutants.toml
        - description: 'test_minimum_risk.py (the latch), test_monitoring.py (lockout from the takeover) and a test_longitudinal maneuver that stays
            stopped under forced deceleration while the lead drives off, run by the CI unit_tests job; targeted, not proven by mutation, so D 8. The
            PCM standstill hold over time (AOU-16) and the stop time are not verified on the vehicle'
          test: openpilot/selfdrive/selfdrived/tests/test_minimum_risk.py
        occurrence: 5
        detection: 4
        ap: H
        previous:
          baseline: BL-006
          occurrence: 8
          detection: 9
          ap: H
          change: 'TSR-633 implemented (#372): the manoeuvre is latched until the driver takes over, held at standstill, alert re-raised; the cause
            is now a defect in that code'
        rationale: Rated in the SW FMEA (SWF-062.C1, O 5 D 8 at BL-007, D 4 since SW FMEA rev 1.12); this row inherits that rating
        actions:
        - SFM-ACT-005
        msr:
          mechanisms:
          - 1
          - 2
          diagnostic: 'The DM policy keeps requesting the forced deceleration while the driver stays unresponsive (noResponseForceDecel), so a
            defective latch still leaves the unlatched stop request, which a dmonitoringd restart or awareness reset can drop; nothing checks the
            latch itself'
          system_response: Forced deceleration toward standstill at A_CRUISE_MIN while the DM request holds; lockout after the takeover
          effect_after_response: 'Mostly unchanged: the car slows while the request holds but may resume after it drops; the 25 s stop from 110 km/h
            is not compared with an FTTI (WP-S-04 §3.8.4 preliminary)'
          severity_after: 10
          frequency: 5
          monitoring: 8
          ap: H
          timing:
            basis: unknown
          rationale: 'M 8: the remaining diagnostic targets the unresponsive driver, but without the latch the response does not reliably reach the
            held standstill of SG-010, and its time is not compared with a budget'
          actions:
          - SFM-ACT-005
    notes: >-
      Observation: in BL-001, events.py maps driverDistracted3 and driverUnresponsive3 only to an
      ET.PERMANENT alert; no SOFT_DISABLE/IMMEDIATE_DISABLE is attached, so reaching awareness 0 does not
      by itself disengage. This may be a deliberate design choice (avoid dropping control on an
      incapacitated driver). Unchanged at BL-004 and BL-005. Decided since (DQ-365 A, 2026-10-16): stop in the lane, hold,
      and lock out re-engagement until the driver responds (TSR-633); implementation is SFM-ACT-005.
      BL-007: implemented (#372 latch and hold, #374 announcement) and unit-tested; the events stay PERMANENT alerts, which is the
      decided behaviour (the item keeps the lane while it stops). Open: the PCM standstill hold over time (AOU-16), the measured stop
      time and deceleration, and the time to the reaction (WP-S-04 OI-11).
      HARA input: driver incapacitated while engaged. Lead decision DQ-205 (2026-10-14, option A): the unresponsive
      driver is its own hazard with an ASIL A goal (here HZ-013, SG-010; H-09 and SG-08, ASIL A, in WP-C-03 v0.4), and its
      safe state is defined together with the zero-awareness reaction.

