    severity: 10
    safety_mechanisms:
      - description: carUnrecognized -> dashcam mode (no control)
        ref: openpilot/selfdrive/selfdrived/selfdrived.py
      - description: controlsMismatch on safety model/param mismatch
        ref: openpilot/selfdrive/selfdrived/selfdrived.py
      - description: 'BL-005 (reference build by default): the panda accepts no car mode other than TOYOTA with parameter 73 (reference_lock.h,
          TSR-512/513), so a platform with another safety parameter leaves the panda out of the car mode and controlsMismatch blocks engagement'
        ref: panda/board/reference_lock.h
    causes:
      - id: SFM-032.C1
        element: SFM-SE-016
        description: Fuzzy fingerprint matches a similar platform
        prevention_controls:
        - description: Upstream opendbc Toyota port (DBC, carstate, carcontroller) with upstream review and route-based car tests; no LionDriver requirements;
            no field-exposure evidence for this configuration is credited
          ref: opendbc_repo/opendbc/car/toyota
        - description: Exact FW-version fingerprint first, fuzzy fallback; controlsMismatch if the panda safety model or parameter differ from CarParams
          ref: opendbc_repo/opendbc/car/fw_versions.py
        detection_controls:
        - description: Fingerprinting unit tests (FW and CAN fingerprint); targeted, not proven by fault injection
          test: opendbc_repo/opendbc/car/tests/test_fw_fingerprint.py
        occurrence: 5
        detection: 8
        ap: H
        actions:
        - SFM-ACT-008
        msr:
          mechanisms:
          - 2
          - 3
          diagnostic: 'BL-005: if the matched platform needs a Toyota safety parameter other than 73, the panda refuses the car mode,
            so controlsMismatch (from 10 s after start) blocks engagement. A similar platform with parameter 73 is not
            detected: controlsMismatch compares the panda with CarParams, which share the same wrong platform, and carUnrecognized does
            not fire on a fuzzy match'
          system_response: For a platform with another safety parameter, no engagement (NO_ENTRY) and an alert; otherwise none
          effect_after_response: 'Partly mitigated: the panda envelope is that of the reference parameter, but host tuning, scaling and
            DBC of a similar platform with parameter 73 apply unseen'
          severity_after: 10
          frequency: 5
          monitoring: 8
          ap: H
          timing:
            fdti_ms: 10000
            frti_ms: 10
            basis: code_derived
          rationale: 'M 8: the diagnostic covers only the platforms with another safety parameter, and the fault is present from power-up,
            so it is not compared with an FTTI. SFM-ACT-008 (refuse fuzzy matches in the reference build) is still open'
          actions:
          - SFM-ACT-008
    notes: "Also a PFMEA topic (car port selection, PFMEA scope item 6)."

