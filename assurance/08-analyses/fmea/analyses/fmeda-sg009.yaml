# yaml-language-server: $schema=../schema/fmeda.schema.json
# FMEDA for SG-009 (stock AEB availability) at BL-002 with GENERIC failure rates (no BOM, no supplier data). The metrics show where the
# architecture falls short; they are not evidence of compliance. Classification per rating-tables §6.1; DC per §6.2.
# Rev 0.3 (2026-10-15, RR-2026-010): the relay replaced by the harness box design. FMD-C-007 is now the analog switches U1/U2;
# FMD-C-010 (device SBU1 driver), FMD-C-011 (pull-down R2/R3), FMD-C-012 (box supply D1/D4) and FMD-C-013 (bus clamps D2/D3) added.
# Rates are generic for the part class.
# Rev 0.4 (2026-10-16): FMD-C-007 (U1/U2) takes the SN 29500-2 reference value for CMOS analog ICs, 2 × 25 FIT, quoted from TI
# functional-safety reports (standard not read, no stress conversion); was 2 × 5 FIT generic. The box discretes and resistors keep generic rates
# with their SN 29500 class named; no reference value was reachable. Mission profile: the harness box sits behind the camera in the same
# sun-loaded windscreen zone and takes the same profile.
# Rev 0.5 (2026-10-18, decision DQ-362 option A): the rows that stop the item's actuation (MCU hang with the relay driven, harness and
# box supply loss) also stand for assurance SG-02 and SG-06 (ASIL C, loss without warning), next to the SG-001 FMEDA. No rate,
# classification or metric changes; the rows are classified for SG-009. Per-goal notes in WP-H-03 §6.4.
# Rev 0.6 (2026-10-20): harness-box and harness components carry the wire-end IDs of the WireViz drawings (wire ends in assurance/04-hardware/wiring/wire-ends.tsv, transcribed from
# comma's v3 drawing, not measured; wiring OI-W-1) in ref_des. No rate, classification or metric changes.
# Rev 0.7 (2026-10-20, FMEDA format review): target as data (analysis.targets: SG-07 at B, WP-C-03 numbering); rate kind, handbook
# reference and wire ends are separate fields; history is data. No rate, classification or metric changes.
schema_version: 1
analysis:
  id: FMD
  type: fmeda
  title: FMEDA — SG-009 stock AEB availability (relay and forwarding path), generic failure rates
  revision: '0.9'
  status: draft
  baseline: BL-002
  rating_tables: RT-1
  scope: Random hardware faults of the panda section and harness that can keep the stock camera's PCS messages from reaching the car (LD-HARA-001 SG-009, ASIL B;
    assurance WP-C-03 SG-07, ASIL B). Reference device at BL-002
  safety_goal: SG-009
  asil_target: B
  targets:
  - goal: SG-07
    asil: B
    basis: 'WP-C-03 SG-07 (LD-HARA-001 SG-009); the SPFM shortfall is a recorded deviation, conditional on the harness box bench tests (DQ-320, WP-H-04 §5.3)'
  mission_profile: 'Passenger car, windscreen-mounted device: ambient up to +85 °C in the sun-loaded enclosure, Tj up to about +105 °C; about 500 operating h/year
    for 15 years (7,500 h). Failure rates in FIT (1e-9/h); transient (soft-error) rates included where noted. PMHF here is only λSPF + λRF; the dual-point term is
    not computed (rating-tables §6.3)'
  out_of_scope:
  - SoC and its software (QM; their faults are the first fault of a dual-point pair)
  - 'Vehicle ECUs (EPS, PCM, stock camera): external measures'
  - Faults that only stop item actuation (they do not touch the stock path)
  references:
  - assurance/04-hardware/WP-H-02-hardware-design.md
  - assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md
  - assurance/08-analyses/fmea/analyses/dfmea.yaml
  - assurance/08-analyses/fmea/rating-tables.md
  - ISO 26262-5:2018 §8-9 and Annex D; ISO 26262-11:2018 §4.6 (semiconductors)
  updated: '2026-10-27'
  history:
  - revision: '0.1'
    date: '2026-10-10'
    change: 'Stub without components'
  - revision: '0.2'
    date: '2026-10-12'
    change: 'First quantitative FMEDA at BL-002 with generic failure rates'
  - revision: '0.3'
    date: '2026-10-15'
    change: 'Relay re-based to the harness box v3 analog switches U1/U2 and its pull-down, supply and clamps (RR-2026-010)'
  - revision: '0.4'
    date: '2026-10-16'
    change: 'U1/U2 at the SN 29500-2 reference value, 2 × 25 FIT (secondary quote); box discretes keep generic rates with their SN 29500 class named'
  - revision: '0.5'
    date: '2026-10-18'
    change: 'Rows that stop actuation noted for SG-02 and SG-06 (DQ-362 A); their metric is the shared SG-01 estimate; no metric change'
  - revision: '0.6'
    date: '2026-10-20'
    change: 'Wire-end IDs of the WireViz drawings added; no rate, classification or metric change'
  - revision: '0.7'
    date: '2026-10-20'
    change: 'Format review: target as data, rate kind and wire ends as fields; no rate, classification or metric change'
  - revision: '0.8'
    date: '2026-10-27'
    change: 'FMD-033 note: harness box SPICE pilot predictions per short path (PR #510); whole mode stays single-point; no rate, classification or metric change'
  - revision: '0.9'
    date: '2026-10-27'
    change: 'Camera-side termination R7/R8 added (FMD-C-014): one open latent, short single-point; total and SPF rates change'
safety_mechanisms:
- id: FMD-SM-001
  description: Flash ECC (single-error correction in silicon; corrected reads are transparent)
  dc_basis: 'ISO 26262-5 Annex D, Table D.6 (memory): ECC, high for single-bit faults'
  implementation: STM32H7 flash ECC (RM0468); always on
- id: FMD-SM-002
  description: SRAM ECC (single-error correction in silicon); double errors flagged but not handled at BL-002
  dc_basis: 'ISO 26262-5 Annex D, Table D.6: ECC, high for single-bit faults; double errors not credited'
  implementation: STM32H7 RAM ECC (RM0468); RAMECC monitors not configured
  requirement: TSR-503
- id: FMD-SM-003
  description: Bootstub signature check of the application image at every power-up
  dc_basis: 'Annex D, Table D.6: memory signature at start-up; credited for latent permanent faults only (once per drive cycle)'
  implementation: panda/board/bootstub.c
- id: FMD-SM-005
  description: 'Clock security system on HSE loss: NMI and reset'
  dc_basis: 'Annex D, Table D.9 (clock): CSS for clock loss, high for stop; does not detect drift'
  implementation: panda/board/stm32h7/clock.h
  requirement: TSR-504
- id: FMD-SM-007
  description: Independent window watchdog (IWDG from LSI), 90 ms, fed only after safety-task and main-loop progress; reset releases the relay
  dc_basis: 'Annex D, Table D.10 (processing units): watchdog with separate time base and time window, medium; HIL not run. Credit
    provisional: the lead accepts it in place of the interim residuals once an independent reviewer checks it and the LSI tolerance
    (DQ-114); HIL fault injection deferred with the bench (DQ-049)'
  implementation: panda/board/drivers/hw_watchdog.h
  requirement: TSR-501
