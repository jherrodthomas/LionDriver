  - id: FMD-022
    mode: Intermittent contact
    distribution: 0.2
    violates_sg_directly: true
    mpf_potential: false
    dfmea_ref: DFM-011
- id: FMD-C-008
  part: Harness connector and relay-box stock path
  dfmea_element: DFM-SE-007
  failure_rate_fit: 10
  failure_rate_source: Generic estimate, order of magnitude of handbook values (SN 29500 / IEC TR 62380 class) for this part type at the mission profile below; not
    looked up for the actual part. No BOM or supplier data available (WP-H-02 UK-02)
  safety_related: true
  failure_modes:
  - id: FMD-023
    mode: Open in the stock camera path
    distribution: 0.3
