  - id: FMD-018
    mode: Other
    distribution: 0.4
    violates_sg_directly: false
    mpf_potential: false
- id: FMD-C-007
  part: Intercept relay and relay driver
  dfmea_element: DFM-SE-006
  failure_rate_fit: 15
  failure_rate_source: Generic estimate, order of magnitude of handbook values (SN 29500 / IEC TR 62380 class) for this part type at the mission profile below; not
    looked up for the actual part. No BOM or supplier data available (WP-H-02 UK-02)
  safety_related: true
  failure_modes:
  - id: FMD-019
    mode: Contacts welded in the intercept position
    distribution: 0.25
    violates_sg_directly: true
    mpf_potential: false
    dfmea_ref: DFM-010
    notes: No relay readback (TSR-506, DFM-ACT-007)
  - id: FMD-020
    mode: Driver transistor or MCU pin stuck on
    distribution: 0.15
