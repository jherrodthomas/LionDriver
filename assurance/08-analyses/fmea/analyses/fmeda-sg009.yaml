  safety_related: true
  failure_modes:
  - id: FMD-035
    mode: One resistor open (camera side left with 120 Ω in intercept)
    distribution: 0.6
    violates_sg_directly: false
    mpf_potential: true
    notes: 'Latent: violates SG-009 only with the second resistor open (or the loopback open), which leaves the camera bus unterminated in intercept: the harness box SPICE pilot predicts a recessive edge of about 10.5 µs, missing the 1.5 µs sample point, so camera frames are lost while the device forwards (spice/predictions.md T-both-open, a prediction, no credit). One open alone leaves 120 Ω and an edge of about 0.06 µs. No check in the field; VS-HW-24 (e) measures both cases. Pass-through is not affected (R7/R8 sit on the NO side). No DFMEA row yet'
  - id: FMD-036
    mode: Short (camera CAN2_H to CAN2_L in intercept)
    distribution: 0.4
    violates_sg_directly: true
    mpf_potential: false
    notes: 'Camera bus held recessive in intercept: no camera frames reach the device, so stock PCS messages are not forwarded. RX checks cover car-side messages only (as FMD-017), so no mechanism is credited. Pass-through is not affected (R7/R8 sit on the NO side). No DFMEA row yet'
