# yaml-language-server: $schema=../schema/fmea.schema.json
# PFMEA of the processes that produce the as-driven reference configuration, per RT-1 §4 (PFMEA tables).
# - Process steps from the draft release procedure (WP-P-10) and installation procedure (WP-O-01); neither is in use
#   yet (no LionDriver release, no third-party installation), so most prevention controls are documented but not
#   practised: O=7-8 (RT-1 §4.2), O=3 where a technical control is enforced (pins, LFS hashes).
# - Detection mostly human inspection with an unproven method (D=8) or an unproven script (D=7).
# - Every failure mode can reach a hazardous event or occupant injury, so S=10 (RT-1 §4.1); one cause is AP L.
# Rev 0.4 (2026-10-26): baseline BL-003 -> BL-007 (frozen: liondriver-dev 9fe3eb2, panda 3a8b7c2, opendbc 4d1a056). The whole file was
# re-checked against the build, release and host changes since BL-003 (it had not been re-rated at BL-004..BL-006); `previous` = BL-003.
# - PFM-001.C1 O 8 D 8 H -> O 5 D 5 H: the reference build is the default (BL-005), release_variant.sh and build_release.sh RELEASE=1, and the
#   CI panda reference release build job checks the flags; the cause is now a bypass by environment variable. PFM-ACT-001 open -> in_progress.
# - PFM-011.C1 O 8 D 8 H -> O 4 D 7 H: Experimental Mode off by default, the assured-settings entry gate (#287) and hold (#342), debug
#   processes left out of the reference build (DQ-131 A). SSH split out as new PFM-011.C2 (O 8 D 8 H, unchanged control). PFM-ACT-008
#   open -> in_progress.
# - Text only: PFM-007.C1 notes the start-up fault-code read (TSR-629, DQ-132 A), which checks health, not configuration; rating kept.
#   DQ-121 (uploader and athena never started) removes remote access and uploads, not an update or install step: no row changes.
# - Every other row unchanged: the release key (PFM-002), HIL bench and evidence package (PFM-004; the bench HIL tests exist but are not
#   run), installer and update channel (PFM-005, PFM-016, PFM-017), harness and mounting (PFM-006, PFM-008..010), model files (PFM-012),
#   fingerprint (PFM-013), PCS check (PFM-014), user information (PFM-015; WP-O-03 is a draft) are as at BL-003.
# Totals: 17 failure modes, 18 causes (17 H, 1 L); 11 actions (9 open, 2 in progress).
schema_version: 1
