actions:
- id: PFM-ACT-001
  kind: design_change
  description: Make RELEASE=1 LIONDRIVER_REFERENCE=1 with the LionDriver key the only release build, and add an automated release check (version contains RELEASE,
    ALLOW_DEBUG absent, reference lock present) that blocks publication (WP-P-10 §6; SW FMEA SWF-ACT-009)
  owner: Jherrod Thomas
  status: in_progress
  evidence: 'In BL-007: the reference variant is the default (SConstruct, tools/release/release_variant.sh), build_release.sh builds the panda
    with RELEASE=1, and the CI job panda reference release build asserts -DLIONDRIVER_REFERENCE on every firmware compile and no -DALLOW_DEBUG.
    Open: the LionDriver release key (PFM-ACT-002), removing the PANDA_DEBUG_BUILD and RELEASE_VARIANT=upstream bypasses from release builds or
    recording their use, and a check that blocks publication rather than a CI job'

- id: PFM-ACT-002
  kind: design_change
  description: Generate the LionDriver release key offline and define the signing procedure (D-09); remove the debug key from release builds
  owner: Jherrod Thomas
  status: open
- id: PFM-ACT-003
  kind: detection
  description: Build the HIL bench (D-04) and define the evidence package location and contents (WP-P-10 §5, OI-2) before the first vehicle-test baseline
  owner: Jherrod Thomas
  status: open
- id: PFM-ACT-004
  kind: design_change
  description: Set up the LionDriver release channel and an installer that installs only signed release tags and records the installed commit (INS-15)
  owner: Jherrod Thomas
  status: open
- id: PFM-ACT-005
  kind: prevention
  description: Turn WP-O-01 into a recorded checklist (R-DEV, R-INS) with photos and sign-off, and include harness approval list, latch check and airbag-zone routing
    diagram for the reference vehicle
  owner: Jherrod Thomas
  status: open
- id: PFM-ACT-006
  kind: detection
  description: Write a configuration-check script for INS-18 and INS-21..24 that compares ECU FW versions, model hashes, carParams and pandaStates with the release
    record and refuses engagement on mismatch (TSR-803)
  owner: Jherrod Thomas
  status: open
- id: PFM-ACT-007
  kind: prevention
  description: Define the mount position and attitude tolerance band (WP-O-01 OI-2) and check the converged calibration against it
  owner: Jherrod Thomas
  status: open
- id: PFM-ACT-008
  kind: design_change
  description: Ship the reference parameter set as release defaults (Chill Mode, B-06; debug modes off; SSH off) and check it at boot
  owner: Jherrod Thomas
  status: in_progress
  evidence: 'In BL-007: Experimental Mode off by default, every assured setting checked at each engagement on the reference platform (#287,
    test_assured_config.py), debug processes left out of the reference build (DQ-131 A, test_reference_build.py). Open: SSH (PFM-011.C2) is
    not checked, and the check is at engagement, not at boot'

- id: PFM-ACT-009
  kind: detection
  description: Provide a log-analysis tool for INS-27 that proves forwarding of stock PCS messages and blocking of intercepted ones
  owner: Jherrod Thomas
  status: open
- id: PFM-ACT-010
  kind: prevention
  description: Write the user information for the reference configuration (WP-O-03), covering Chill Mode limits and override behaviour
  owner: Jherrod Thomas
  status: open
- id: PFM-ACT-011
  kind: design_change
  description: Signed updates from a LionDriver-controlled branch, and a bench-tested rollback procedure for the device side (GAP-26, WP-S-07, WP-O-02)
  owner: Jherrod Thomas
  status: open
