failure_modes:
- id: PFM-001
  element: PFM-SE-011
  function: PFM-FN-002
  failure_mode: panda firmware released as a DEBUG build, or without LIONDRIVER_REFERENCE
  guideword: wrong_configuration
  effects:
  - level: local
    description: Release artifact built with the wrong flags
  - level: next_higher
    description: Device runs firmware that accepts any safety mode (and ALLOUTPUT in DEBUG)
  - level: end
    description: Envelope can be bypassed or misconfigured
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-005
    hazard: HZ-005
    severity: 10
  - level: end
    description: Contributes to HZ-006
    hazard: HZ-006
    severity: 10
  severity: 10
  causes:
  - id: PFM-001.C1
    description: 'The release is built with a bypass of the release defaults: PANDA_DEBUG_BUILD set (build_release.sh then builds the panda
      without RELEASE=1, with ALLOW_DEBUG) or RELEASE_VARIANT=upstream / an empty LIONDRIVER_REFERENCE, neither of which needs a recorded
      override. Up to BL-003 panda/SConscript defaulted to DEBUG and no build path set LIONDRIVER_REFERENCE; since BL-005 the root SConstruct and
      tools/release/release_variant.sh default to the reference build and build_release.sh builds the panda with RELEASE=1'
    element: PFM-SE-011
    prevention_controls:
    - description: 'Technical defaults: SConstruct sets LIONDRIVER_REFERENCE=1 unless it is set; release_variant.sh selects the reference variant
      and refuses an unknown one; build_release.sh builds RELEASE=1 unless PANDA_DEBUG_BUILD is set. Proven in CI, but a variable bypasses them
      (O 5). Signing with a LionDriver key is PFM-002'
      ref: tools/release/release_variant.sh
    detection_controls:
    - description: 'CI job panda reference release build (safety.yaml, WP-W-03 ATC-19): variant selection checks, then RELEASE=1 build and an
        assertion that every firmware compile carries -DLIONDRIVER_REFERENCE and none -DALLOW_DEBUG. Proven automated check at a later station
        (CI, not the publication step, and signed with the debug key), so D 5. At run time pandad refuses a car mode on a non-reference panda
        (TSR-619); INS-17 reads the version string (human check)'
      ref: .github/workflows/safety.yaml
    occurrence: 5
    detection: 5
    ap: H
    previous:
      baseline: BL-003
      occurrence: 8
      detection: 8
      ap: H
      change: 'Reference build the default (BL-005, #36/#41), release variant script and CI release-build check (ATC-19); re-checked at BL-007'

    actions:
    - PFM-ACT-001
    linked_failure_mode: SWF-013
