# yaml-language-server: $schema=../schema/dfa.schema.json
#
# Dependent Failure Analysis (ISO 26262-9 clause 7) of the panda/SoC decompositions in FSC rev 0.1.
# A decomposition is accepted only when every DFI affecting it is assessed sufficient or safe_by_design;
# tools/safety/fmea_lint.py derives and checks each decomposition status from its DFIs.
# 2026-10-13: fsc_revision 0.2 -> 0.3. FSC rev 0.3 only re-bases on HARA rev 0.4 (an HZ-006 back-link); no FSR or
# decomposition changed, so no DFI was re-assessed.
# 2026-10-16: rev 0.6 adds the harness-box supply (RR-2026-010 F-02, F-03): DFI-20, DFI-21; DM-02 re-based on the
# DG419LE switches; DM-23, DM-24; DOI-008. No decomposition status changes.
# 2026-10-16: rev 0.7 re-checks the insufficient DFIs (05, 09, 14, 18) against panda a55bdfc, opendbc 9a13f60 and the
# release tooling of #80. All stay insufficient. Rev 0.8 records DQ-007 C on DFI-14 and DM-10.
# Rev 0.9 takes in shared root causes reported by the SW FMEA (PR #95, #111): DFI-07 open -> insufficient
# (a mode cycle clears the panda's latched fault reactions), DM-25; DFI-05 note on the host side.
# Rev 0.11: SW FMEA references point at the merged rows SWF-054..057 (sw-fmea.yaml rev 1.0).
# Rev 0.12: opendbc pinned at 515b9a2 (jherrodthomas/opendbc#15, LionDriver 3ba8ca10): DFI-07 insufficient -> open, DM-25
# partly in the pinned code. Decomposition statuses unchanged.
# Rev 0.13: panda pinned at 0a7da85 (jherrodthomas/panda#17, LionDriver e5109376): the relay-malfunction part of DM-25 is coded;
# DM-25 required -> existing_unverified; DFI-07 stays open pending the bench checks.
# Rev 0.16 renumbers the DFIs to the WP-A-03 §4 numbers (a letter marks one part of a §4 initiator; DFI-34..36
# are new in WP-A-03). The header comments and the revision history above rev 0.16 keep the old numbers; the
# old-to-new table is in WP-A-03 §4.
# Rev 0.15 records lead decision DQ-055 A on DFI-14 and DM-10 (safety limits derived apart from the controller tuning,
# controller set lower). No assessment changed.
# Rev 0.14: DFI-07 also cites SWF-090 (sw-fmea.yaml rev 1.4), the SW FMEA row for the relay-malfunction part of DM-25.
# Rev 0.10 applies lead decision DQ-209 option A (keep comma's harness box, bench-test it) to DFI-20, DFI-21 and DOI-008.
# 2026-10-16: fsc_revision 0.3 -> 0.4. FSC rev 0.4 only adds notes on two lead decisions (DQ-053, DQ-064) to
# FSR-031 and FSR-038; no statement, ASIL, allocation or decomposition changed, so no DFI changes.
# 2026-10-20: fsc_revision 0.4 -> 0.5. FSC rev 0.5 only sets FSR-007 fhti_ms 400 (WP-S-04 v0.19 §3.7) and updates its
# implementation note; no statement, ASIL, allocation or decomposition changed, so no DFI changes.
schema_version: 1
