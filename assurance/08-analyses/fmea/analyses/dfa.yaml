# yaml-language-server: $schema=../schema/dfa.schema.json
#
# Dependent Failure Analysis (ISO 26262-9 clause 7) of the panda/SoC decompositions in FSC rev 0.1.
# A decomposition is accepted only when every DFI affecting it is assessed sufficient or safe_by_design;
# tools/safety/fmea_lint.py derives and checks each decomposition status from its DFIs.
# 2026-10-13: fsc_revision 0.2 -> 0.3. FSC rev 0.3 only re-bases on HARA rev 0.4 (an HZ-006 back-link); no FSR or
# decomposition changed, so no DFI was re-assessed.
# 2026-10-16: rev 0.6 adds the harness-box supply (RR-2026-010 F-02, F-03): DFI-20, DFI-21; DM-02 re-based on the
# DG419LE switches; DM-23, DM-24; DOI-008. No decomposition status changes.
# 2026-10-16: rev 0.7 re-checks the insufficient DFIs (05, 09, 14, 18) against panda a55bdfc, opendbc 9a13f60 and the
# release tooling of #80. All stay insufficient.
schema_version: 1
analysis:
  id: DFA
  type: dfa
  doc_id: LD-DFA-001
  title: "Dependent Failure Analysis — panda/SoC decompositions (LD-FSC-001)"
  revision: "0.7"
  status: draft
  baseline: BL-004
  fsc_revision: "0.3"
  approver: Jherrod Thomas (pending)
  scope: >-
    The 11 ASIL decompositions of LD-FSC-001 rev 0.3 (assured configuration AC-001), each splitting a requirement between the panda safety
    model (EL-07, with the harness relay EL-08) and SoC software (EL-03..EL-06), or between the SoC and the
    vehicle instrument cluster (XM-04). Common-cause and cascading failure initiators are taken from the
    BL-001 code and hardware as they exist; panda firmware behavior that could not be inspected (submodule
    not checked out) is marked unverified rather than assumed.
  team:
    - name: Jherrod Thomas
      role: Project maintainer, safety lead (reviewer/approver)
    - name: Claude (AI assistant)
      role: Drafting assistance; content requires human review
  references:
    - assurance/08-analyses/fmea/analyses/fsc.yaml
    - ISO 26262-9:2018 clause 7; ISO 26262-11:2018 clause 4.7
    - assurance/08-analyses/fmea/design/panda-config-lock-and-fw-authenticity.md (LD-DES-001)
    - assurance/04-hardware/reviews/RR-2026-010.md (harness box v3 drawing)
  updated: 2026-10-16
  history:
    - {revision: "0.1", date: 2026-10-10, author: Claude (AI-assisted draft), change: Initial draft against FSC rev 0.1}
    - {revision: "0.2", date: 2026-10-10, author: Claude (AI-assisted draft), change: "Evidence from panda 92eb565 / opendbc 229dc70 for DFI-07/08/09; DFI-08 open -> insufficient; DOI-002 closed by design LD-DES-001; DOI-007 added"}
    - {revision: "0.3", date: 2026-10-10, author: Claude (AI-assisted draft), change: "Re-based on FSC rev 0.2; no DFI changes"}
    - {revision: "0.4", date: 2026-10-10, author: Claude (AI-assisted draft), change: "SW FMEA rev 0.2 code review: DM-05 corrected (checksum on 0x1D2/0x260 only, no counters, BRAKE_MODULE timing only); DM-06 and DM-20 evidence recorded in DOI-001; statuses unchanged pending independent verification"}
    - {revision: "0.5", date: 2026-10-13, author: Claude (AI-assisted draft), change: "The seven insufficient DFIs re-checked against liondriver-dev 102224c (panda c33343b, opendbc 273f44e, after BL-004). DM-21 panda reference lock and DM-22 host reference-build check added (existing, unverified on hardware); DFI-07 insufficient -> open; DFI-05/08/09/14/18/19 stay insufficient, each rationale now names what is in the code and what is still needed; DM-20 runs in CI (DOI-001); DOI-007 progress; decomposition statuses unchanged. Then DM-12 (panda 4ac8e1c, ELM327 refused after the car mode until ignition off) and DM-11 (opendbc c393a04, assist-active LKAS_HUD refused without authority) implemented and unit-tested: DFI-08 and DFI-19 insufficient -> open"}
    - {revision: "0.6", date: 2026-10-16, author: Claude (AI-assisted draft), change: "Harness-box supply from RR-2026-010 (F-02, F-03, F-09). DM-02 re-based on the two DG419LE switches and the R2/R3 pull-down; it holds only while the box is powered. DFI-01 and DFI-03 no longer rely on DM-02 for the decompositions (fail-silence rests on DM-01 and DM-03). New DFI-20 (box supply loss, actuation decompositions, safe by design) and DFI-21 (box supply loss, warning decompositions FSR-015/025, open). DFI-08: DM-12 rests on one ignition wire (no CAN ignition on Toyota); DM-24 required. DM-23 (bench tests VS-HW-22/23) and DOI-008 added. Decomposition statuses unchanged"}
    - {revision: "0.7", date: 2026-10-16, author: Claude (AI-assisted draft), change: "The four insufficient DFIs (05, 09, 14, 18) re-checked against liondriver-dev 1033d98 (panda a55bdfc, opendbc 9a13f60, release tooling of #80). Since rev 0.5: the reference release variant builds the panda with RELEASE=1 and no ALLOW_DEBUG, checked in CI (safety.yaml panda_reference_release_build, ATC-19), so a release bootstub would no longer trust the debug key (DFI-09, DFI-18); opendbc b9f7451 grants authority on a PCM edge only with the heartbeat's engaged flag (no diverse input for DFI-05). All four stay insufficient; decomposition statuses unchanged"}

categories:
  - {id: CAT-01, name: Shared power supply, applicable: true, rationale: "Panda and SoC are on the same comma 3X board, powered from the same 12 V input. On the Toyota harness that input is the harness-box supply VIN (ignition through D1, or comma power), which also powers both intercept switches; the ignition sense hangs on the same ignition line (RR-2026-010 HB-03, HB-06)."}
  - {id: CAT-02, name: Shared clock and reset, applicable: true, rationale: "The SoC drives the panda reset (STM_RST_N) and boot-mode (STM_BOOT0) lines."}
  - {id: CAT-03, name: Shared processing or memory, applicable: false, rationale: "The panda is a separate MCU with its own RAM and flash; the SoC reaches it only through the SPI link (CAT-05) and GPIO (CAT-02)."}
  - {id: CAT-04, name: Shared information inputs, applicable: true, rationale: "Both channels read brake, cruise, speed and steering-torque signals from the same vehicle CAN messages."}
  - {id: CAT-05, name: Communication between channels, applicable: true, rationale: "The SoC sends CAN TX requests, heartbeat and control commands to the panda over SPI."}
  - {id: CAT-06, name: Configuration and mode control, applicable: true, rationale: "The SoC sets the panda safety model, safety parameter, alternative experience and diagnostic mode, and flashes its firmware."}
  - {id: CAT-07, name: Timing and execution, applicable: true, rationale: "Panda reactions depend on SoC heartbeat timing; SoC lag affects what the panda forwards."}
  - {id: CAT-08, name: "Environment (thermal, EMC/ESD, vibration)", applicable: true, rationale: "Same enclosure, board, ground and windshield mount."}
  - {id: CAT-09, name: Development — specification, applicable: true, rationale: "SoC controller limits and panda safety limits are both defined in opendbc."}
  - {id: CAT-10, name: "Development — tools, process and people", applicable: true, rationale: "Both channels come from the same upstream organization and review process."}
  - {id: CAT-11, name: Manufacturing, applicable: true, rationale: "Both channels are on one PCB from one assembly line."}
  - {id: CAT-12, name: Installation, applicable: true, rationale: "One harness connects both channels to the vehicle."}
  - {id: CAT-13, name: Service and software update, applicable: true, rationale: "One OTA release carries SoC software and panda firmware."}

decompositions:
  - fsr: FSR-001
    channels: [{fsr: FSR-002, elements: [EL-07]}, {fsr: FSR-003, elements: [EL-03]}]
    status: not_accepted
    rationale: SoC can reconfigure (DFI-07) and reflash (DFI-09) the panda; envelope specification shared (DFI-14); one update path (DFI-18).
  - fsr: FSR-004
    channels: [{fsr: FSR-005, elements: [EL-07]}, {fsr: FSR-006, elements: [EL-03]}]
    status: not_accepted
    rationale: DFI-07, DFI-09 and DFI-18.
  - fsr: FSR-009
    channels: [{fsr: FSR-010, elements: [EL-07]}, {fsr: FSR-011, elements: [EL-03, EL-04, EL-06]}]
    status: not_accepted
    rationale: The configuration the panda enforces is chosen by the SoC (DFI-07); DFI-09 and DFI-18.
  - fsr: FSR-012
    channels: [{fsr: FSR-013, elements: [EL-03, EL-04]}, {fsr: FSR-014, elements: [EL-07]}]
    status: not_assessable
    rationale: The independent lane monitor FSR-014 is not defined yet (FSC FOI-004).
  - fsr: FSR-015
    channels: [{fsr: FSR-016, elements: [EL-03, EL-04, EL-05]}, {fsr: FSR-017, elements: [EL-07, XM-04]}]
    status: not_accepted
    rationale: The cluster's lane-assist indication is driven by SoC-generated messages (DFI-19); DFI-07, DFI-09, DFI-18.
  - fsr: FSR-018
    channels: [{fsr: FSR-019, elements: [EL-07]}, {fsr: FSR-020, elements: [EL-03, EL-04]}]
    status: not_accepted
    rationale: DFI-07, DFI-09, DFI-14 and DFI-18.
  - fsr: FSR-021
    channels: [{fsr: FSR-022, elements: [EL-07]}, {fsr: FSR-023, elements: [EL-03]}]
    status: not_accepted
    rationale: DFI-07, DFI-09, DFI-14 and DFI-18.
  - fsr: FSR-025
    channels: [{fsr: FSR-026, elements: [EL-03, EL-04, EL-05]}, {fsr: FSR-027, elements: [EL-07, XM-04]}]
    status: not_accepted
    rationale: As FSR-015 (DFI-19).
  - fsr: FSR-028
    channels: [{fsr: FSR-029, elements: [EL-07]}, {fsr: FSR-030, elements: [EL-03, EL-04]}]
    status: not_accepted
    rationale: Both channels read the same brake signal (DFI-05); DFI-07, DFI-09, DFI-18.
  - fsr: FSR-031
    channels: [{fsr: FSR-032, elements: [EL-07]}, {fsr: FSR-033, elements: [EL-03, EL-04]}]
    status: not_accepted
    rationale: DFI-05 (driver torque signal), DFI-07, DFI-09, DFI-14, DFI-18.
  - fsr: FSR-034
    channels: [{fsr: FSR-035, elements: [EL-07]}, {fsr: FSR-036, elements: [EL-04]}]
    status: not_accepted
    rationale: Both channels follow the same cruise-state signal (DFI-05); DFI-07, DFI-09, DFI-18.

dfis:
  # --- CAT-01 power
  - id: DFI-01
    category: CAT-01
    kind: common_cause
    description: Loss of the device supply (12 V input, comma power, harness power pins) switches off SoC and panda together.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-015, FSR-018, FSR-021, FSR-025, FSR-028, FSR-031, FSR-034]
    effect: >-
      Both channels go silent. No item message can reach the vehicle because all item CAN transmission passes
      through the panda, so no actuation results. The device HMI is lost, but the cluster channel of FSR-015/025
      is powered by the vehicle and shows assist off once item messages stop.
    evidence: openpilot/selfdrive/pandad (all CAN TX via panda)
    measures: [DM-01, DM-02, DM-03]
    assessment: safe_by_design
    rationale: >-
      Fail-silent for actuation. Relies on Toyota ECUs ending LKA/ACC on message loss (DM-03, unverified, DOI-001).
      Rev 0.6: whether the stock camera path comes back (DM-02) does not decide the outcome for these decompositions,
      because an intercept that stays closed carries no item messages either; it decides SG-009 (FSR-037/038, not
      decomposed; FMEDA SG-009). This DFI covers loss downstream of the harness box (OBD-C cable, device input stage,
      regulators); loss of the box supply itself is DFI-20 and DFI-21.
  - id: DFI-02
    category: CAT-01
    kind: common_cause
    description: Undervoltage or brown-out leaves one or both processors running erratically instead of off.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: An erratic SoC is bounded by the panda only if the panda stays correct in the same supply event.
    measures: [DM-17]
    assessment: open
    rationale: Panda brown-out reset level and supply monitoring are not verified (DOI-001).
  # --- CAT-02 clock / reset
  - id: DFI-03
    category: CAT-02
    kind: cascading
    description: The SoC drives the panda's reset and BOOT0 lines; a faulty SoC can hold the panda in reset or in its bootloader.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-015, FSR-018, FSR-021, FSR-025, FSR-028, FSR-031, FSR-034]
    effect: A panda held in reset or bootloader transmits nothing, so the result is fail-silent, the same as DFI-01.
    evidence: openpilot/common/hardware/comma/hardware.py (reset_internal_panda, recover_internal_panda)
    measures: [DM-01, DM-02, DM-03]
    assessment: safe_by_design
    rationale: >-
      Silent output only. Same dependency on DM-03 as DFI-01. Reflashing through BOOT0 is DFI-09. Rev 0.6: the stock
      path returns only if the R2/R3 pull-down is intact (DM-02, RR-2026-010 F-03), which matters for SG-009, not
      for these decompositions.
  - id: DFI-04
    category: CAT-02
    kind: common_cause
    description: Shared clock source between SoC and panda.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: A shared clock fault would disturb both channels' timing at once.
    measures: [DM-18]
    assessment: open
    rationale: Panda clock source not verified from the schematic (DOI-001).
  # --- CAT-04 shared inputs
  - id: DFI-05
    category: CAT-04
    kind: common_cause
    description: >-
      Both channels decide brake press, cruise state and driver steering torque from the same vehicle CAN
      messages. A wrong but well-formed value (sensor fault in a Toyota ECU, signal definition error) is seen
      identically by both.
    decompositions: [FSR-028, FSR-031, FSR-034]
    effect: Brake press, cancel or driver steering not recognized by either channel; engagement state wrong in both.
    measures: [DM-05, DM-06]
    assessment: insufficient
    rationale: >-
      RX checks catch corrupted or missing messages, not wrong values. The PCM cancelling cruise from its own
      brake input (XM-03) would give a diverse path, but it is unverified (FSC FOI-006, DOI-004).
      Rev 0.5 (panda c33343b, opendbc 273f44e): the reference build adds RX checks on 0x262 and 0x1D3 and a
      cruise-main consistency check (toyota.h, LIONDRIVER_REFERENCE), still on the same messages, so the coupling
      is unchanged. Needed for sufficient: (a) brake and cancel: vehicle test that the PCM drops cruise from its
      own brake input, so controls-allowed (DM-06) follows a diverse path (DOI-004); (b) driver steering torque:
      no diverse path exists; either a second torque source (EPS-internal override, XM-02, to be characterised
      with AOU-01) or drop the claim and keep FSR-031 undecomposed.
      Rev 0.7 (opendbc 9a13f60): b9f7451 makes a PCM cruise edge grant authority only together with the heartbeat's
      engaged flag (STPA LS-06). That adds a SoC condition to engagement, not a vehicle input diverse from the shared
      brake, cruise or torque messages, so the coupling is unchanged.
  # --- CAT-05 communication
  - id: DFI-06
    category: CAT-05
    kind: cascading
    description: Malformed, flooding or out-of-sequence SPI traffic from a faulty SoC.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: Expected effect is dropped messages (silent). A parsing defect in panda firmware could corrupt its safety state.
    evidence: openpilot/selfdrive/pandad/spi.cc (sync byte, ACK/NACK, 8-bit XOR checksum)
    measures: [DM-15]
    assessment: open
    rationale: The checksum catches transmission errors, not well-formed bad commands. Firmware robustness against host input is not demonstrated (DM-15).
  # --- CAT-06 configuration / mode control
  - id: DFI-07
    category: CAT-06
    kind: cascading
    description: >-
      The SoC sets the panda's safety model, safety parameter and alternative-experience flags. A SoC fault
      (wrong fingerprint, corrupted CarParams, software defect) configures the panda with the wrong or a more
      permissive model.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-015, FSR-018, FSR-021, FSR-025, FSR-028, FSR-031, FSR-034]
    effect: The panda enforces the limits the SoC chose, so the panda channel of every decomposition depends on the SoC being right.
    evidence: >-
      openpilot/selfdrive/pandad/panda_safety.cc:68-69 sets alternative experience then the safety model;
      panda main_comms.h:223 accepts any mode at any time; opendbc toyota.h:369-383 param selects brake signal,
      longitudinal, LTA, SecOC and EPS torque factor; with ALLOW_DEBUG (LionDriver default build) opendbc
      safety.h:413-421 adds SAFETY_ALLOUTPUT (LD-DES-001 F1-F4)
    measures: [DM-04, DM-07, DM-21, DM-22]
    assessment: open
    rationale: >-
      At rev 0.4 the only check (controlsMismatch, DM-04) ran on the SoC itself and one host command selected
      ALLOUTPUT. Rev 0.5: the panda reference build (DM-21, panda board/reference_lock.h, on by default in the
      LionDriver build) accepts only SILENT, NOOUTPUT, ELM327 and TOYOTA with parameter 73; once TOYOTA is active
      only NOOUTPUT or SILENT; it refuses 0xdf (alternative experience stays 0) and the commands that change
      relay, CAN or comms state in a car mode. ALLOUTPUT is unreachable even though ALLOW_DEBUG is still
      defined. The SoC can only downgrade, the safe direction. For the assured configuration AC-001 this
      implements DR-01, DR-03 and the effect of DR-06 at compile time instead of a provisioned VLR (DM-07 stays
      required only beyond AC-001). Open, not sufficient: the gate is unit-tested in CI
      (panda/tests/reference_lock) but its effect on the board is not verified (HIL test_11_reference_lock not
      run). Needed for sufficient: run the HIL test and the DM-22 integration check on the bench.
  - id: DFI-08
    category: CAT-06
    kind: cascading
    description: The SoC can put the panda in ELM327 (diagnostic) mode, used for fingerprinting at start-up, which allows diagnostic messages to vehicle ECUs.
    decompositions: [FSR-009]
    effect: Diagnostic traffic to EPS or ADAS ECUs while driving could reset them or drop assist (loss of function, HZ-004 type), not unintended actuation.
    evidence: openpilot/selfdrive/pandad/panda_safety.cc:23-36; opendbc modes/elm327.h:6-33 (LD-DES-001 F5)
    measures: [DM-12, DM-21, DM-24]
    assessment: open
    rationale: >-
      Verified at BL-001 that the ELM327 TX hook has no ignition or motion condition. Rev 0.5: the reference lock
      (DM-21) refuses ELM327 while TOYOTA is active, but allows it from NOOUTPUT or SILENT with no ignition or
      motion condition, and it allows TOYOTA to NOOUTPUT at any time. A faulty SoC can therefore go
      TOYOTA -> NOOUTPUT -> ELM327 while driving. Then implemented (DM-12, panda 4ac8e1c): once TOYOTA has been
      accepted, ELM327 is refused until the 1 Hz tick sees the ignition off; fingerprinting before the car mode is
      unaffected. The "stationary" alternative of DR-05 is not used (no vehicle speed outside a car mode). Residual:
      before the first car mode of an ignition cycle ELM327 is still accepted while moving (fingerprinting runs
      seconds after ignition on). Open, not sufficient: unit-tested (panda/tests/reference_lock), not verified on
      the bench (HIL). Rev 0.6 (panda a55bdfc): the lock is released by the panda's ignition state, which on Toyota
      is the harness line alone (main.c:213, harness_check_ignition(); opendbc ignition.h has no Toyota CAN
      ignition). With comma power keeping the box powered, an open ignition branch or an open Q6 (RR-2026-010 HB-06,
      F-09) reads ignition off while driving and releases DM-12; a faulty SoC can then reach ELM327. DM-24 required.
  - id: DFI-09
    category: CAT-06
    kind: cascading
    description: The SoC flashes panda firmware from its own filesystem whenever the signature differs, and can enter the bootloader through BOOT0.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-015, FSR-018, FSR-021, FSR-025, FSR-028, FSR-031, FSR-034]
    effect: Whatever firmware image the SoC holds becomes the panda channel; a corrupted or wrong image defeats every decomposition.
    evidence: >-
      openpilot/selfdrive/pandad/pandad.py:20-48 (flash, development-bootloader fallback); panda bootstub.c:58-71
      (release key, plus the debug key under ALLOW_DEBUG, whose private key is in the repo); no RDP/WRP option
      bytes set; SoC drives BOOT0 (hardware.py:410) so ROM DFU can rewrite the bootstub (LD-DES-001 F6-F9)
    measures: [DM-08]
    assessment: insufficient
    rationale: >-
      A LionDriver source build ends up on a development bootstub that trusts a public key, and the ROM DFU path
      bypasses the bootstub entirely. Firmware authenticity is designed in LD-DES-001 (DR-10..DR-16); not implemented.
      Rev 0.5: unchanged in substance. The reference lock refuses softloader entry (0xd1) in a car mode, but the
      SoC can downgrade to NOOUTPUT first; pandad.py:20-48 still flashes on any signature mismatch and falls back
      to a development bootstub; the panda is not built with RELEASE=1, so the bootstub still accepts the debug
      key. The host engagement check (DM-22) detects firmware built without the reference lock, not firmware
      signed with the wrong key. Needed for sufficient: DR-10..DR-16 (release key, MIN_VERSION, WRP+RDP1 after
      the D2 bootloader check, offroad-only flashing, no development-bootstub fallback, key ID in health).
      Rev 0.7 (#80, panda a55bdfc): the reference release variant (tools/release/release_variant.sh, the default in
      build_release.sh) builds the panda with RELEASE=1, so a release bootstub omits the debug key (bootstub.c:66-71
      under ALLOW_DEBUG) and pandad's recovery path would re-flash that release bootstub. CI checks that every
      firmware compile carries -DLIONDRIVER_REFERENCE and none -DALLOW_DEBUG, but signs with the debug key; no
      release-key build has run (change record change-2026-10-13-release-variant OI-1). build_release.sh signs with
      CERT=/data/pandaextra/certs/release, the upstream path, not a LionDriver key (DR-10; key storage is DQ-086).
      Still open: ROM DFU through BOOT0 with no WRP/RDP (DR-13), flashing on any signature mismatch while onroad
      (pandad.py:30-33, DR-14), no MIN_VERSION change (DR-12), key ID not reported (DR-16). Development builds keep
      the debug key. So part of DR-10/DR-11 is configured, nothing is verified, and the bypass paths remain.
  # --- CAT-07 timing
  - id: DFI-10
    category: CAT-07
    kind: cascading
    description: SoC lag or a stuck SoC loop keeps sending stale but well-formed steering or acceleration requests with the heartbeat still reporting engaged.
    decompositions: [FSR-001, FSR-004]
    effect: >-
      The panda cannot detect staleness, but it still enforces the magnitude and rate envelope, so SG-001's
      hazard (uncontrollable steering) is prevented. A constant in-envelope request is HZ-003 (SG-002),
      outside these decompositions.
    measures: [DM-20]
    assessment: open
    rationale: >-
      Holds once the envelope is enforced as claimed; the panda safety tests that would show it are not yet run
      (DOI-001). Note: the panda heartbeat timeout is 5 s and the engaged-mismatch drop ~3 s (panda main.c:102,184),
      which matters for FSR-007 (FSC FOI-008, LD-DES-001 DR-20) but not for envelope enforcement.
  # --- CAT-08 environment
  - id: DFI-11
    category: CAT-08
    kind: common_cause
    description: High temperature in the windshield mount affects SoC and panda on the same board.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: The SoC throttles and soft-disables (overheat event), but the panda MCU has no equivalent and may fail non-silently above its rating.
    evidence: openpilot/system/hardware/hardwared.py
    measures: [DM-14]
    assessment: open
    rationale: Device thermal profile versus component ratings is not characterized.
  - id: DFI-12
    category: CAT-08
    kind: common_cause
    description: EMC transients, radiated disturbance or ESD at the harness upsetting both processors through the shared board and ground.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: Simultaneous upset of both channels.
    measures: [DM-13]
    assessment: open
    rationale: No immunity test evidence (ISO 7637-2, ISO 11452, ISO 10605) for device plus harness.
  - id: DFI-13
    category: CAT-08
    kind: common_cause
    description: Vibration or a loose harness connector interrupting power and CAN for both channels.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: Power interruption behaves as DFI-01 (silent). An intermittent CAN line is seen by both channels.
    measures: [DM-01, DM-05]
    assessment: open
    rationale: Silent for power loss; panda RX checks on intermittent CAN unverified (DOI-001).
  # --- CAT-09 specification
  - id: DFI-14
    category: CAT-09
    kind: common_cause
    description: SoC controller limits and panda safety limits are specified in the same repository by the same authors from the same vehicle characterization.
    decompositions: [FSR-001, FSR-018, FSR-021, FSR-031]
    effect: An envelope that is wrong for the vehicle is enforced identically by both channels.
    measures: [DM-10, DM-20]
    assessment: insufficient
    rationale: >-
      Cross-checks between the Python and C limits prevent mismatch, not a shared error. An envelope derived
      independently from vehicle measurements is required (FSC FOI-001). Rev 0.5: unchanged; no limit has yet
      been derived from measurements. Needed for sufficient: DM-10, the bench and vehicle characterisation of
      AOU-01/AOU-02 (WP-C-01), which is also the evidence the HARA decision RD-1 depends on.
      Rev 0.7: unchanged; opendbc 9a13f60 changes no limit and no vehicle measurement exists yet. The reference car
      will be a borrowed or rented one (DQ-039 B), so DM-10 waits on that arrangement.
  # --- CAT-10 development process
  - id: DFI-15
    category: CAT-10
    kind: common_cause
    description: Same upstream organization, reviewers and practices for both channels.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: A shared misconception about vehicle behavior or safety logic appears in both channels.
    measures: [DM-16, DM-20]
    assessment: open
    rationale: Language and toolchain diversity exists (C with MISRA versus Python/C++), but there is no independent review or process evidence for the panda safety model (FSC FOI-003).
  # --- CAT-11 manufacturing
  - id: DFI-16
    category: CAT-11
    kind: common_cause
    description: A board-level manufacturing defect affecting both processors.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: Most board defects show as supply or clock faults (DFI-01, DFI-02, DFI-04).
    measures: []
    assessment: open
    rationale: No manufacturing or end-of-line test evidence for the device is available to the project.
  # --- CAT-12 installation
  - id: DFI-17
    category: CAT-12
    kind: common_cause
    description: Wrong harness for the vehicle, or a partly seated connector.
    decompositions: [FSR-009, FSR-028, FSR-034]
    effect: Both channels see a foreign or partial bus; vehicle identity and the safety-relevant signals are wrong for both.
    measures: [DM-05, DM-19]
    assessment: open
    rationale: Panda RX checks would block controls if expected messages are absent (unverified). Installation checks belong to the PFMEA (DM-19).
  # --- CAT-13 update
  - id: DFI-18
    category: CAT-13
    kind: common_cause
    description: One OTA release replaces SoC software and panda firmware together.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-015, FSR-018, FSR-021, FSR-025, FSR-028, FSR-031, FSR-034]
    effect: A defective or malicious release changes both channels at once and defeats every decomposition.
    evidence: openpilot/system/updated; openpilot/selfdrive/pandad/pandad.py
    measures: [DM-08, DM-09]
    assessment: insufficient
    rationale: >-
      No separate release gate for the panda safety model in LionDriver. The malicious case also belongs to the
      TARA. Rev 0.5: the safety workflow (.github/workflows/safety.yaml) now runs the opendbc safety tests in the
      reference variant, MISRA and the panda host tests on every change, which is part of a gate, but panda
      firmware still ships in the same release as the SoC software with no separate approval or HIL run. Needed
      for sufficient: DM-09 (separate versioning, HIL and independent review before a panda image enters a
      release) and DR-10 signing as its enforcement point.
      Rev 0.7: the release script now selects the reference variant explicitly and CI builds the release firmware
      configuration on every panda, opendbc or release-script change (ATC-19). That fixes what a release contains,
      not who approves it: the panda image still ships in the same release as the SoC software, with no separate
      approval, HIL run or independent review (DQ-010 A: volunteer reviewer, none named yet).
  # --- CAT-04 warning channel
  - id: DFI-19
    category: CAT-04
    kind: cascading
    description: >-
      The cluster's lane-assist and ACC indications are driven by item messages generated on the SoC (HUD and
      status bits). Only the stock cruise-on indication comes from the PCM.
    decompositions: [FSR-015, FSR-025]
    effect: A SoC that shows the wrong state on the device can send the same wrong state to the cluster; the two warning channels fail together.
    measures: [DM-11]
    assessment: open
    rationale: >-
      The panda forwards HUD content without checking it against controls-allowed. FSR-017/027 need the panda to
      enforce consistent status bits (DM-11). Rev 0.5: unchanged; the reference build only rate-limits LKAS_HUD
      (0x412, TSR-518) and does not look at its content. Then implemented (DM-11, opendbc c393a04): an LKAS_HUD with
      BARRIERS != 0 is refused unless controls are allowed or were allowed within the last 1 s (the host clears the
      HUD a few frames after a disengagement). The cluster can therefore show assist for at most 1 s after authority
      is withdrawn. Open, not sufficient: unit-tested (test_toyota.py, both variants), not verified on the vehicle;
      that BARRIERS is the indication the driver reads as "assist active" is from the DBC and openpilot's
      carcontroller, to be confirmed on the reference cluster (DOI-005).
  # --- CAT-01 harness-box supply (RR-2026-010, rev 0.6)
  - id: DFI-20
    category: CAT-01
    kind: common_cause
    description: >-
      Loss of the harness-box supply VIN while the car is on: ignition branch to the box or D1 open without comma
      power, or VIN shorted (TVS D4, wiring). VIN powers both intercept switches (U1, U2) and, through OBD-C VBUS,
      the whole device.
    decompositions: [FSR-001, FSR-004, FSR-009, FSR-018, FSR-021, FSR-028, FSR-031, FSR-034]
    effect: >-
      SoC and panda lose power together, so no item message reaches the vehicle. U1/U2 are unpowered, so neither
      the intercept nor the pass-through position is guaranteed, and D2/D3 clamp CAN0 and CAN2 towards the dead
      rail (derived from the drawing). EPS and PCM then receive neither item nor stock-camera LKA/ACC messages.
    evidence: >-
      RR-2026-010 HB-02, HB-03, HB-04, F-02 (commaai/hardware harness/v3/Harness_Box.pdf); DFMEA DFM-020.C1/C2;
      openpilot/selfdrive/pandad (all CAN TX via panda)
    measures: [DM-01, DM-03, DM-23]
    assessment: safe_by_design
    rationale: >-
      For these decompositions the result is fail-silent, as DFI-01: whatever position the unpowered switches
      take, nothing generates item messages, and the EPS and PCM end LKA/ACC on message loss (DM-03, unverified,
      DOI-001). A disturbed car-side bus gives more missing messages, not wrong ones, unless the bench test shows
      otherwise (DM-23). The same loss removes the stock camera path (SG-009, FSR-037/038, not decomposed): that is
      DFMEA DFM-020, FMEDA SG-009 and WP-A-03 DFI-27, and the lead decision DQ-209.
  - id: DFI-21
    category: CAT-01
    kind: common_cause
    description: >-
      The same loss of the harness-box supply removes both channels of the driver-indication decompositions: the
      device HMI (FSR-016/026) is unpowered, and the panda channel (FSR-017/027) relies on the cluster showing the
      true assist state from the bus that the unpowered box may disturb.
    decompositions: [FSR-015, FSR-025]
    effect: >-
      No device alert. The cluster gets no item LKAS_HUD or ACC messages and, depending on the unpowered switch
      position, either no stock-camera messages or the camera's own. What it then shows (LKA or ACC unavailable,
      a camera fault, or the stock state) is not known; it is the only remaining cue that assist has ended.
    evidence: RR-2026-010 F-02; DFMEA DFM-020 (end effect "lateral assist lost without a LionDriver warning", HZ-004)
    measures: [DM-11, DM-23]
    assessment: open
    rationale: >-
      Unlike DFI-01, where the pull-down returns the stock camera and the cluster sees a clean bus, here the second
      channel depends on cluster behaviour on a possibly disturbed bus, which nobody has observed. XM-04 is not
      credited (FSC FOI-005). Needed to close: the box-unpowered bench test (DM-23, VS-HW-22) and the cluster
      reaction to it on the reference vehicle (DOI-005, DOI-008); or the lead's DQ-209 option B or C, which removes
      the cause.

measures:
  - {id: DM-01, description: "All item CAN transmission passes through the panda; an unpowered or reset panda transmits nothing.", status: existing, ref: openpilot/selfdrive/pandad, allocated_to: [EL-07]}
  - {id: DM-02, description: "Harness intercept switches (2 x DG419LE, U1 on CAN_H, U2 on CAN_L, one control line SBU1) select pass-through, the stock camera path, when the device does not drive SBU1: the R2+R3 pull-down (2 x 120 ohm in series) holds IN low. Holds for device power loss or panda reset only while the box supply VIN is present (RR-2026-010 HB-02, F-02), and only while R2 and R3 are intact, with no position feedback (F-03, F-06). From the published v3 drawing; shipped box not checked (VS-HW-02).", status: existing_unverified, ref: assurance/04-hardware/reviews/RR-2026-010.md, allocated_to: [EL-08]}
  - {id: DM-03, description: "Toyota EPS and powertrain end LKA/ACC when item messages stop (message timeout).", status: existing_unverified, allocated_to: [XM-02, XM-05]}
  - {id: DM-04, description: "SoC compares the panda's reported safety model, parameter and alternative experience with CarParams (controlsMismatch).", status: existing, ref: openpilot/selfdrive/selfdrived/selfdrived.py, allocated_to: [EL-04]}
  - {id: DM-05, description: "Panda RX checks on safety-relevant vehicle messages. At BL-001 (Toyota): checksum on PCM_CRUISE 0x1D2 and STEER_TORQUE_SENSOR 0x260 only; no counter checks; BRAKE_MODULE 0x226 timing only (SW FMEA SWF-005, SWF-006).", status: existing_unverified, ref: opendbc_repo, allocated_to: [EL-07]}
  - {id: DM-06, description: "Panda controls-allowed follows PCM cruise state, a signal path diverse from the brake switch.", status: existing_unverified, ref: opendbc_repo, allocated_to: [EL-07]}
  - {id: DM-07, description: "Panda-side configuration lock: accept only the safety model and parameter provisioned for the installed vehicle, reject changes while onroad, force alternative experience to 0 in release builds.", status: required, ref: "LD-DES-001 DR-01..DR-07", allocated_to: [EL-07]}
  - {id: DM-08, description: "Firmware authenticity: panda bootloader accepts only signed LionDriver release firmware, rejects downgrade, and flashing is allowed only offroad.", status: required, ref: "LD-DES-001 DR-10..DR-16", allocated_to: [EL-07]}
  - {id: DM-09, description: "Separate release gate for panda firmware and safety model (safety test suite, HIL, independent review), versioned independently of SoC software.", status: required, allocated_to: [process]}
  - {id: DM-10, description: "Envelope derived from vehicle measurements independently of opendbc, with both channels' limits checked against it.", status: required, allocated_to: [process]}
  - {id: DM-11, description: "Panda blocks assist-active HUD and status bits when controls are not allowed. Reference build: LKAS_HUD with BARRIERS != 0 refused unless controls are allowed or were allowed within 1 s. Unit-tested; not verified on the vehicle.", status: existing_unverified, ref: opendbc_repo/opendbc/safety/modes/toyota.h, allocated_to: [EL-07]}
  - {id: DM-12, description: "Panda accepts diagnostic (ELM327) mode only offroad. Reference build: ELM327 refused once the car mode has been accepted, until the ignition is off (LD-DES-001 DR-05 without the stationary alternative). Unit-tested; HIL not run.", status: existing_unverified, ref: panda/board/reference_lock.h, allocated_to: [EL-07]}
  - {id: DM-13, description: "EMC/ESD immunity testing of device and harness (ISO 7637-2, ISO 11452, ISO 10605).", status: required, allocated_to: [process]}
  - {id: DM-14, description: "Thermal characterization of the windshield-mounted device against panda MCU and regulator ratings.", status: required, allocated_to: [process]}
  - {id: DM-15, description: "Panda robustness against host input: protocol fuzzing and malformed-command tests.", status: required, allocated_to: [EL-07]}
  - {id: DM-16, description: "Implementation diversity: panda safety in C (MISRA, cppcheck) versus SoC software in Python/C++.", status: existing, ref: "openpilot/selfdrive; opendbc_repo", allocated_to: [EL-07, EL-03]}
  - {id: DM-17, description: "Panda brown-out reset and supply monitoring.", status: existing_unverified, allocated_to: [EL-07]}
  - {id: DM-18, description: "Panda clock independent of the SoC.", status: existing_unverified, allocated_to: [EL-07]}
  - {id: DM-19, description: "Installation checks in the release and install control plan (PFMEA).", status: required, allocated_to: [process]}
  - {id: DM-20, description: "opendbc safety test suite with coverage over the panda safety model.", status: existing_unverified, ref: opendbc_repo/opendbc/safety/tests, allocated_to: [EL-07]}
  - {id: DM-21, description: "Panda reference-build configuration lock (TSR-512/513): only SILENT, NOOUTPUT, ELM327 and TOYOTA with parameter 73 are accepted; in TOYOTA only a downgrade to NOOUTPUT or SILENT; 0xdf refused; relay, CAN and comms commands refused in a car mode; refused requests counted in the health packet. Unit-tested in CI; HIL test not run.", status: existing_unverified, ref: panda/board/reference_lock.h, allocated_to: [EL-07]}
  - {id: DM-22, description: "The SoC does not configure a car safety mode, and raises pandaNotReferenceBuild, when the panda does not report HEALTH_FLAG_REFERENCE_BUILD (TSR-514, TSR-619).", status: existing_unverified, ref: openpilot/selfdrive/selfdrived/selfdrived.py, allocated_to: [EL-04]}
  - {id: DM-23, description: "Bench tests of the harness box failure behaviour: box unpowered with camera and car powered (pass-through continuity, CAN0/CAN2 levels), pull-down open, supply stress (WP-H-06 VS-HW-22, VS-HW-23, VS-HW-24; DFMEA DFM-ACT-014).", status: required, ref: assurance/04-hardware/WP-H-06-hardware-integration-verification.md, allocated_to: [process]}
  - {id: DM-24, description: "The panda releases the ELM327 lock (DM-12) only on an ignition-off confirmed by a second source, for example no vehicle CAN traffic or zero vehicle speed for a set time, not on the harness ignition line alone.", status: required, ref: panda/board/reference_lock.h, allocated_to: [EL-07]}

open_items:
  - id: DOI-001
    text: >-
      Verify the existing_unverified measures (DM-02, DM-03, DM-05, DM-06, DM-17, DM-18, DM-20) with the panda and opendbc
      submodules checked out, the comma 3X schematic, and HIL tests. Progress (SW FMEA rev 0.2, submodules at BL-001):
      DM-05 narrower than claimed (see its description); DM-06 confirmed in code (controls_allowed follows CRUISE_ACTIVE,
      0x1D2 checksum-checked); DM-20 run locally (3173 tests pass, 390 skipped; 2705/2705 operator mutants killed) but not
      run by LionDriver CI (SWF-ACT-001). DM-02, DM-03, DM-17, DM-18 not yet examined. Rev 0.5: DM-20 now runs
      in LionDriver CI in the reference variant (.github/workflows/safety.yaml); DM-21 and DM-22 added, unit-tested,
      awaiting HIL.
    affects: [DM-02, DM-03, DM-05, DM-06, DM-17, DM-18, DM-20, DM-21, DM-22]
    status: open
  - id: DOI-002
    text: >-
      Design the panda-side configuration lock (DM-07) and firmware authenticity (DM-08). These change upstream
      panda firmware and pandad behavior, and they are the measures every panda/SoC decomposition depends on.
    affects: [DM-07, DM-08, DFI-07, DFI-09]
    status: closed
    resolution: Designed in assurance/08-analyses/fmea/design/panda-config-lock-and-fw-authenticity.md (LD-DES-001 rev 0.1). Implementation tracked in DOI-007.
  - id: DOI-003
    text: Define the separate panda safety release gate (DM-09) in the PFMEA and release control plan; hand the malicious-update case to the TARA.
    affects: [DM-09, DFI-18]
    status: open
  - id: DOI-004
    text: Verify the PCM brake/cancel path (XM-03, FSC FOI-006) as the diverse input for DFI-05.
    affects: [DFI-05]
    status: open
  - id: DOI-005
    text: >-
      Refine FSR-017 and FSR-027 in FSC rev 0.2 so the panda enforces status bits consistent with controls-allowed
      (DM-11). Progress at rev 0.5: the reference build refuses LKAS_HUD.BARRIERS without authority (opendbc
      c393a04); still to do: confirm on the reference cluster that BARRIERS is the indication the driver reads as
      lane assist active, and name the bits in FSR-017/027.
    affects: [DFI-19, DM-11, FSR-017, FSR-027]
    status: open
  - id: DOI-006
    text: Plan EMC/ESD immunity (DM-13), thermal characterization (DM-14) and host-input robustness testing (DM-15).
    affects: [DM-13, DM-14, DM-15]
    status: open

  - id: DOI-007
    text: >-
      Implement and verify LD-DES-001 (DR-01..DR-16) in LionDriver forks of panda and opendbc and in pandad/selfdrived,
      after decisions D1-D4 in LD-DES-001 section 7. DM-07, DM-08 and DM-12 stay "required" until then.
      Progress at rev 0.5: for AC-001 the reference lock (DM-21) implements DR-01, DR-03 and the effect of DR-06
      without a VLR, and refuses softloader entry in a car mode (part of DR-14); DR-05 implemented in the same gate
      (panda 4ac8e1c, see DFI-08). Not implemented: DR-10..DR-13, DR-15, DR-16.
    affects: [DM-07, DM-08, DM-12, DFI-07, DFI-08, DFI-09]
    status: open
  - id: DOI-008
    text: >-
      Harness box (RR-2026-010): run the bench tests DM-23 and record what the unpowered switches do to the stock
      path and to CAN0, and what the reference cluster shows when the box loses power while driving (DFI-21). The
      lead decides in DQ-209 whether to keep comma's box, build a LionDriver adapter, or require comma power; re-assess
      DFI-20 and DFI-21 after the answer. Implement DM-24 in the panda reference build (handed to the panda software
      work).
    affects: [DFI-08, DFI-20, DFI-21, DM-02, DM-23, DM-24]
    status: open
