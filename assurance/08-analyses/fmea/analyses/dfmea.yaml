actions:
- id: DFM-ACT-001
  kind: prevention
  description: Add a LionDriver CPU self-test at start-up and periodically (WP-H-03 finding 4). No vendor self-test library is licensed (decision DQ-069
    option B, 2026-10-19), so CPU coverage is claimed only as low and the ASIL C SPFM target is likely missed (WP-H-04 OI-6, G2)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-002
  kind: design_change
  description: Integrate the G1 layer 1 MCU measures (RAMECC handling, redundant storage, code CRC, start-up RAM test, fault escalation) from panda branch liondriver/g1-layer1
    after review and HIL evidence
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-003
  kind: detection
  description: Run the watchdog HIL test (test_10_hw_watchdog) on the bench and confirm the relay releases on reset (HWSR-502, UK-06) (D-04).
    The lead deferred the HIL bench (DQ-049, 2026-10-14), so this waits for the bench
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-004
  kind: design_change
  description: Cross-check the HSE-derived time base against LSI or HSI and react on deviation (HWSR-504a)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-005
  kind: design_change
  description: Set the BOR level in the option bytes and enable PVD with a safe-state reaction (WP-H-02 DC-07); read the option bytes of a reference device (UK-04)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-006
  kind: design_change
  description: Disable a transceiver and enter the safe state on persistent error or bus-off (HWSR-508, WP-H-02 DC-04)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-007
  kind: design_change
  description: "Add relay readback in a LionDriver harness adapter (WP-H-02 DC-03) and confirm the de-energised contact state (UK-03).
    Not implemented by decision DQ-209 option A (2026-10-16): comma's box is kept and its failure behaviour is bench-tested
    (DFM-ACT-014) and argued as residual risk; the de-energised state is covered by DFM-ACT-014"
  owner: Jherrod Thomas
  status: not_implemented
- id: DFM-ACT-008
  kind: detection
  description: Define the installation check, including a stock PCS/AEB function check and a harness latch check (WP-O-01, TSR-805)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-009
  kind: design_change
  description: Replace the 8-bit XOR with a CRC and add a sequence counter on the SoC-MCU link (GAP-10)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-010
  kind: design_change
  description: 'Implement D-09/D-10: LionDriver signing key, no debug key in release builds, WRP + RDP1, remove the development-bootstub recovery (LD-DES-001 DR-10..DR-16)'
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-011
  kind: detection
  description: Confirm the siren audio topology (UK-07) and add a start-up siren self-test (TSR-515/516)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-012
  kind: design_change
  description: React to MCU DTS out of range with the safe state (HWSR-509, DC-10); obtain the MCU temperature grade (UK-02)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-013
  kind: design_change
  description: 'Implement TSR-517: read back the item''s own TX frames from the bus and compare with the approved frame, revoking on a
    mismatch; enable RAMECC handling for the FDCAN message RAM if the H725 provides it'
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-014
  kind: detection
  description: 'Bench-test the harness box failure behaviour (RR-2026-010): box unpowered with car and camera powered; R2/R3 forced
    open with the device silent; supply at 14-16 V against the DG419LE ratings; pass-through signal integrity; clamp-diode short
    on CAN0; camera-side termination R7/R8 lifted in intercept (VS-HW-24 (e), DFM-022); confirm the shipped box matches the v3
    drawing (VS-HW-02). The decided route for the harness box (DQ-209 option A,
    2026-10-16); procedures in WP-H-06 §3.1'
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-015
  kind: detection
  description: 'Read the Vishay DG417LE/DG418LE/DG419LE datasheet (document 76432) and record the absolute maximum V+ to V-, VL and
    IN ratings, the single-supply operating range and VINH/VINL at VL = V+ = 14 V; compare with VIN including the D4 clamp level. If
    a limit is exceeded, raise it with comma.ai and with DQ-209 (RR-2026-010 F-05; blocked at 2026-10-16: vendor and datasheet hosts
    unreachable from the analysis environment)'
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-016
  kind: detection
  description: 'Time the EPS-fault warning chain on the HIL bench (WP-S-04 T-28): inject a persistent LKA_STATE fault on 0x262 while
    authority is granted and measure fault onset to audible siren against the 0.96 s design worst case and the SG-02 1 s budget
    (margin 0.04 s), with the speaker phase varied. Persistence 0.7 s since panda bf8102a (DQ-048). Waits for the HIL bench, which
    the lead deferred (DQ-049, 2026-10-14)'
  owner: Jherrod Thomas
  status: open
