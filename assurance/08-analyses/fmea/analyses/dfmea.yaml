# yaml-language-server: $schema=../schema/fmea.schema.json
# DFMEA of the safety-relevant item hardware at BL-002, per RT-1.
# - Basis: block-level analysis in assurance WP-H-02 (hardware design) and WP-H-03 (qualitative FMEDA), DFA WP-A-03, and
#   the BL-002 firmware. LionDriver has no schematic or BOM for the comma 3X (WP-H-02 UK-01, UK-02), so causes are at block
#   level and occurrence cannot use failure-rate data.
# - Occurrence: COTS device in volume field use, but no supplier reliability evidence and not known to be automotive
#   qualified: O=3 for permanent component faults, 2 where silicon ECC or a boot check limits the cause, 4-5 where the
#   cause is driven by the vehicle environment or by owner installation.
# - Detection: LionDriver has no hardware verification yet (no HIL bench, no qualification, WP-H-06/07): D=10 where no
#   test is defined, D=8-9 where a test exists but has not been run or only exercises the software reaction.
# - In-field diagnostics are listed as safety_mechanisms (they reduce S or O through the design, not D; RT-1 §3).
# Every failure mode reaches a HARA hazard, so S=10 and AP is H throughout; the value of this revision is the cause and
# action list, not the AP distribution.
# Rev 0.4 (2026-10-14, RT-2): FMEA-MSR rows (msr-plan.md M1) on all 15 in-scope causes, at BL-002. F from the FMEDA SG-001
# failure rate of the matching failure mode (rating-tables 7.2), else the DFMEA O. M from WP-S-04 timing: nothing is
# measured, so no row is better than M 7; DFM-009, DFM-011 and DFM-008 react too slowly or incompletely (M 8). MSR AP is
# provisional (rating-tables 7.4).
schema_version: 1
