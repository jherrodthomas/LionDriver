- id: DFM-022
  element: DFM-SE-006
  function: DFM-FN-005
  failure_mode: Camera bus left unterminated in intercept
  guideword: open
  effects:
  - level: local
    description: In intercept only the box terminates the camera bus (R7, and R8 through the harness P13-P15 loopback, 60 ohm). With both
      gone the recessive edge slows to about 10.5 us and misses the 1.5 us sample point (harness box SPICE pilot, a prediction)
  - level: next_higher
    description: Camera frames lost or corrupted while the device forwards them, so stock PCS messages do not reach the car
  - level: end
    description: Stock AEB unavailable
    hazard: HZ-011
    severity: 10
  severity: 10
  causes:
  - id: DFM-022.C1
    description: Termination resistor R7 open together with R8 or the P13-P15 loopback open. One open alone leaves 120 ohm and a recessive
      edge of about 0.06 us, so it is latent (FMEDA SG-009 FMD-035); pass-through is not affected (R7/R8 are on the NO side)
    element: DFM-SE-006
    prevention_controls:
