functions:
- id: DFM-FN-001
  element: DFM-SE-002
  description: Execute the safety model and hold its code, constants and state without corruption
  requirements:
  - FSR-002
  - FSR-005
  - FSR-019
- id: DFM-FN-002
  element: DFM-SE-003
  description: Provide an accurate time base for all timeouts, and reset the MCU (releasing the relay) within 0.1 s if execution stops
  requirements:
  - FSR-007
  - FSR-038
- id: DFM-FN-003
  element: DFM-SE-004
  description: Supply the MCU within its operating range, or hold it in reset
  requirements:
  - FSR-002
  - FSR-038
- id: DFM-FN-004
  element: DFM-SE-005
  description: Transmit and receive on buses 0, 1 and 2 without disturbing the vehicle bus
  requirements:
  - FSR-005
  - FSR-037
- id: DFM-FN-005
  element: DFM-SE-006
  description: Separate the camera from the car bus only while energised; restore the stock camera path whenever de-energised
  requirements:
  - FSR-008
  - FSR-037
  - FSR-038
- id: DFM-FN-006
  element: DFM-SE-007
  description: Connect the device to the vehicle buses, power and ignition, and report harness orientation correctly
  requirements:
  - FSR-010
  - FSR-038
- id: DFM-FN-007
  element: DFM-SE-008
  description: Carry commands, CAN frames and heartbeat between SoC and MCU intact; keep the MCU running the signed application
  requirements:
  - FSR-007
  - FSR-010
- id: DFM-FN-008
  element: DFM-SE-009
  description: Sound a warning when the SoC is lost while engaged, independently of the SoC audio
  requirements:
  - FSR-015
- id: DFM-FN-009
  element: DFM-SE-010
  description: Keep the device mechanically secured and within its thermal operating range
  requirements:
  - FSR-002
  - FSR-015
failure_modes:
- id: DFM-001
  element: DFM-SE-002
  function: DFM-FN-001
  failure_mode: Safety check computes a wrong result (permanent CPU or data-path fault)
  guideword: degraded
  effects:
  - level: local
    description: Torque/acceleration limit or controls_allowed evaluated wrongly
  - level: next_higher
    description: Out-of-envelope or unauthorised command passes the panda
  - level: end
    description: Uncontrollable steering or unintended acceleration
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-005
    hazard: HZ-005
    severity: 10
  - level: end
    description: Contributes to HZ-006 (deceleration limit or authority evaluated wrongly)
    hazard: HZ-006
    severity: 10
  severity: 10
  causes:
  - id: DFM-001.C1
    description: Permanent fault in the Cortex-M7 core or bus matrix; single core, no lockstep, no CPU self-test
    element: DFM-SE-002
    prevention_controls:
    - &id001
      description: COTS comma 3X design in volume field use; no supplier reliability data, schematic or BOM available to LionDriver (WP-H-02 UK-01, UK-02)
      ref: assurance/04-hardware/WP-H-02-hardware-design.md
    detection_controls: &id002
    - description: No LionDriver hardware verification or qualification test exists for this cause (WP-H-06/WP-H-07 not started; no HIL bench, D-04)
    occurrence: 3
    detection: 10
    ap: H
    actions:
    - DFM-ACT-001
    msr:
      mechanisms:
      - 1
      diagnostic: None in the MCU at BL-002. The host compares controls_allowed after about 2 s (QM); it does not check limits
      system_response: None for a wrong limit result
      effect_after_response: 'Unchanged: a wrong check result lets an over-limit or unauthorised frame through'
      severity_after: 10
      frequency: 6
      monitoring: 9
      ap: H
      timing:
        basis: unknown
      fmeda: fmeda-sg001/FMD-001
      actions:
      - DFM-ACT-001
  safety_mechanisms:
  - description: None in the MCU at BL-002. Host compares controls_allowed after about 2 s (QM, does not check limits). EPS and PCM own limits (AOU-01, AOU-05)
    ref: assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md
  notes: WP-H-03 FM-CPU-01. High diagnostic coverage is not credible without hardware redundancy.
- id: DFM-002
  element: DFM-SE-002
  function: DFM-FN-001
  failure_mode: Code or limit constants corrupted in flash during operation
  guideword: degraded
  effects:
  - level: local
    description: Wrong limit value or wrong instruction
  - level: next_higher
    description: Panda enforces wrong limits
  - level: end
    description: Steering or acceleration beyond the envelope
    hazard: HZ-002
    severity: 10
  - level: end
    description: Contributes to HZ-005
    hazard: HZ-005
    severity: 10
  severity: 10
  causes:
  - id: DFM-002.C1
    description: Multi-bit flash error or cell degradation; double-error ECC flag not handled; image signature checked at boot only
    element: DFM-SE-002
    prevention_controls:
    - *id001
    - description: Bootstub signature check at power-up (bootstub.c:47-72); flash ECC corrects single bits in silicon
      ref: panda/board/bootstub.c
    detection_controls: *id002
    occurrence: 2
    detection: 10
    ap: H
    actions:
    - DFM-ACT-002
    msr:
      mechanisms:
      - 1
      diagnostic: Bootstub signature check at power-up only; no periodic code CRC in the pinned firmware
      system_response: None during the drive
      effect_after_response: Unchanged until the next power-up
      severity_after: 10
      frequency: 4
      monitoring: 9
      ap: H
      timing:
        basis: unknown
      fmeda: fmeda-sg001/FMD-006
      actions:
      - DFM-ACT-002
  safety_mechanisms:
  - description: Boot-time signature only. Periodic code CRC exists on panda branch liondriver/g1-layer1 (TSR-MCU-09), not pinned at BL-002
    ref: assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md
  notes: WP-H-03 FM-FLS-02.
- id: DFM-003
  element: DFM-SE-002
  function: DFM-FN-001
  failure_mode: Safety state in SRAM corrupted (controls_allowed, limits, counters, stack)
  guideword: degraded
  effects:
  - level: local
    description: Wrong authority or limit decision, or crash
  - level: next_higher
    description: Unauthorised or out-of-envelope command passes
  - level: end
    description: Unintended steering or acceleration
