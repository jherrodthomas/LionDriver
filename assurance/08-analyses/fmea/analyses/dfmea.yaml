    element: DFM-SE-003
    prevention_controls:
    - description: 'IWDG (LSI), 90 ms nominal, window mode, started on every relay drive and fed only after safety-task and main-loop progress (BL-002, panda#1, #3);
        a reset floats the relay GPIO'
      ref: panda/board/drivers/hw_watchdog.h
    detection_controls:
    - description: Watchdog HIL test with injected hangs (FAULT_INJECTION build); targeted, not yet run (no HIL bench, D-04)
      test: panda/tests/hitl/test_10_hw_watchdog.py
    occurrence: 3
    detection: 8
    ap: H
    actions:
    - DFM-ACT-003
    msr:
      mechanisms:
      - 1
      diagnostic: IWDG expires about 90 ms after the last feed (T-09a). Timing fits on paper, but whether the reset releases the
        relay is unconfirmed (HWSR-502, UK-06) and the LSI tolerance leaves no shown margin (OI-7), so the response is not credited
      system_response: MCU reset; relay de-energised if the drive circuit is de-energise-to-safe; stock camera CAN restored
      effect_after_response: Stock PCS/AEB restored and assist lost, if the relay releases
      severity_after: 10
      frequency: 6
      monitoring: 7
      ap: H
      timing:
        ftti_ref: SG-07 forwarding loss
        ftti_ms: 200
        fdti_ms: 90
        frti_ms: 100
        basis: code_derived
      fmeda: fmeda-sg001/FMD-003
      actions:
      - DFM-ACT-003
  safety_mechanisms:
  - description: IWDG reset releases the relay if the drive circuit is de-energise-to-safe (HWSR-502, unconfirmed, UK-06)
    ref: panda/board/drivers/hw_watchdog.h
  notes: WP-H-03 FM-CPU-03/05. Before BL-002 there was no reset path (O was 7).
