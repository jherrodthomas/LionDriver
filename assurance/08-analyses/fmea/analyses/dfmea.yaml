    - *id001
    detection_controls: *id002
    occurrence: 3
    detection: 10
    ap: H
    actions:
    - DFM-ACT-002
    msr:
      mechanisms:
      - 1
      diagnostic: 'None at BL-002: no MPU and no redundant storage of the safety state'
      system_response: None
      effect_after_response: Unchanged
      severity_after: 10
      frequency: 3
      monitoring: 10
      ap: H
      timing:
        basis: unknown
      actions:
      - DFM-ACT-002
  safety_mechanisms:
  - description: None at BL-002. RAMECC handling, redundant storage and start-up RAM test exist on panda branch liondriver/g1-layer1 (TSR-MCU-07, -08, -10), not pinned
    ref: assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md
  notes: WP-H-03 FM-RAM-02/03, FM-CPU-07.
- id: DFM-004
  element: DFM-SE-003
  function: DFM-FN-002
  failure_mode: MCU execution stops with the relay energised
  guideword: stuck
  effects:
  - level: local
    description: Checks, TX and forwarding stop; relay holds last state
  - level: next_higher
    description: Camera path stays cut; no stock PCS messages to the car
