# yaml-language-server: $schema=../schema/fmea.schema.json
# DFMEA of the safety-relevant item hardware at BL-002, per RT-1.
# - Basis: block-level analysis in assurance WP-H-02 (hardware design) and WP-H-03 (qualitative FMEDA), DFA WP-A-03, and
#   the BL-002 firmware. LionDriver has no schematic or BOM for the comma 3X (WP-H-02 UK-01, UK-02), so causes are at block
#   level and occurrence cannot use failure-rate data.
# - Occurrence: COTS device in volume field use, but no supplier reliability evidence and not known to be automotive
#   qualified: O=3 for permanent component faults, 2 where silicon ECC or a boot check limits the cause, 4-5 where the
#   cause is driven by the vehicle environment or by owner installation.
# - Detection: LionDriver has no hardware verification yet (no HIL bench, no qualification, WP-H-06/07): D=10 where no
#   test is defined, D=8-9 where a test exists but has not been run or only exercises the software reaction.
# - In-field diagnostics are listed as safety_mechanisms (they reduce S or O through the design, not D; RT-1 §3).
# Every failure mode reaches a HARA hazard, so S=10 and AP is H throughout; the value of this revision is the cause and
# action list, not the AP distribution.
# Rev 0.4 (2026-10-14, RT-2): FMEA-MSR rows (msr-plan.md M1) on all 15 in-scope causes, at BL-002. F from the FMEDA SG-001
# failure rate of the matching failure mode (rating-tables 7.2), else the DFMEA O. M from WP-S-04 timing: nothing is
# measured, so no row is better than M 7; DFM-009, DFM-011 and DFM-008 react too slowly or incompletely (M 8). MSR AP is
# provisional (rating-tables 7.4).
# Rev 0.5 (2026-10-15, RR-2026-010): DFM-SE-006 re-based on the published harness box v3 drawing. The intercept "relay" is
# two DG419LE CMOS analog switches (U1 CAN_H, U2 CAN_L) controlled by SBU1, pulled to pass-through by R2+R3 (240 ohm) and
# powered from the box VIN (ignition via D1, or comma power), with Schottky clamps D2/D3 on both buses. DFM-010/011/013
# causes re-written for switch modes; new causes DFM-010.C3 (pull-down open) and DFM-014.C2 (Q6 short); new failure modes
# DFM-020 (box supply lost while driving) and DFM-021 (clamp diode short). Effects of DFM-020 are derived from the drawing
# and wait for the bench test (DFM-ACT-014).
# Rev 0.6 (2026-10-16, RR-2026-010 F-05): new causes DFM-010.C4 (switch overstress or latch-up from box supply transients) and
# DFM-011.C2 (5 V SBU1 drive below the logic-high threshold with VL at VIN), action DFM-ACT-015 (confirm the DG419LE ratings from
# Vishay document 76432, which could not be downloaded). MSR rows added for both: M 10 and M 8.
# MSR F re-read from FMEDA rev 0.4 (U1/U2 at the SN 29500-2 reference value): DFM-010.C1 and DFM-011.C1 F 5 -> 6 (17.5 FIT);
# DFM-010.C2 now points at the SBU1 driver row of FMEDA SG-009 (FMD-020, 2.5 FIT, F 4) instead of the switch row.
# Rev 0.7 (2026-10-16): baseline BL-005 (liondriver-dev 1033d98, panda a55bdfc, opendbc 9a13f60). The hardware is unchanged; the
# panda changes 9f60e17..a55bdfc that touch these rows were read at the pins: 0.3 s heartbeat revocation (panda#7), watchdog reset
# reported in health (panda#6), explicit IRQ priorities (panda#10), reference-build health flag (panda#12), siren on a persistent
# EPS fault and on heartbeat-loss revocation (panda#14, #15), ELM327 refused after the car mode (panda#16). The reference build is
# the default at BL-005, so the reference lock is credited. S, O, D and AP are unchanged. MSR: DFM-009.C1 M 8 -> 6 (host
# controlsMismatch within 0.5 s, TSR-621, puts the warning inside the 1 s budget). DFM-017 is re-described: the siren is now the
# panda's own warning on heartbeat loss and on a persistent EPS fault, so a shared SoC audio path (DFM-017.C1) defeats TSR-516(b).
# With that mechanism listed, DFM-017.C1/C2 enter the MSR scope: both M 10 (nothing checks the speaker path).
# DQ-209 option A (2026-10-16): comma's box is kept. DFM-ACT-007 (readback adapter) not_implemented; DFM-ACT-014 (bench tests) is the
# decided route. Ratings unchanged: the readback was an open action, never credited.
# Rev 0.8 (2026-10-17, DQ-048 option A, panda bf8102a): the EPS-fault siren persistence is 0.7 s (was 1 s), so the siren comes at
# most 0.7 s + 10 ms + 2 x 125 ms = 0.96 s after fault onset, inside the SG-02 1 s warning budget (WP-S-04 T-28, OI-8 closed; was
# 1.26 s). The margin is 0.04 s by design only: new action DFM-ACT-016 (time the chain on the HIL bench, which waits for DQ-049).
# DFM-017 mechanism text updated. S, O, D, AP and MSR ratings unchanged (DFM-017.C1/C2 M 10 is the unchecked speaker path, not timing).
# Rev 0.9 (2026-10-19, DQ-069 option B): DFM-ACT-001 re-worded: LionDriver's own CPU self-test, no vendor library licensed, low CPU
# coverage only. Ratings unchanged.
# Rev 0.10 (2026-10-19, RT-3, DQ-207 A): MSR AP from the AIAG-VDA handbook table for S 9-10 (rating-tables §7.4). Only the F 2 rows
# move: DFM-010.C3, DFM-011.C2 and DFM-019.C2 MSR AP H -> M. S, F, M and every other rating unchanged. Applied by the System FMEA
# session with the RT-3 change.
# Rev 0.11 (2026-10-26): baseline BL-005 -> BL-007 (frozen: liondriver-dev 9fe3eb2, panda 3a8b7c2, opendbc 4d1a056). The hardware is
# unchanged since BL-002. The whole file was re-checked against the panda changes a55bdfc..3a8b7c2 (BL-006 and BL-007): the relay
# malfunction latched for the ignition cycle (panda#17, BL-006; added to the DFM-011 mechanism text), the EPS-fault siren at 0.7 s and
# still sounding after a revocation (bf8102a, DQ-048, DQ-367), the siren on a TX-arrival revocation (8a69ccf, DQ-404) and on an engaged
# mismatch while cruise stays on (f4803c5, TSR-516(c)); DFM-017's mechanism lists the new triggers. None changes a hardware cause, a
# detection test or a diagnostic of a hardware fault, so S, O, D, AP and every MSR rating are unchanged. No row cites a file the opendbc
# or host changes touched. Totals unchanged: 21 failure modes, 30 causes (all AP H); 16 actions.
# Rev 0.12 (2026-10-27, ratings unchanged): DFM-010, DFM-011, DFM-014 and DFM-021 point at the harness box circuit view
#   (assurance/sim/harness_box: ngspice DC points and a Falstad link, synthetic, no credit).
# Rev 0.13 (2026-10-27, after BL-007): new DFM-022 (camera bus unterminated in intercept, R7 with R8 or the loopback open) and
#   DFM-023 (R7 or R8 short), from FMEDA SG-009 rev 0.9 FMD-C-014 (#511) and the harness box SPICE pilot (#510). O 2 / O 3, D 10
#   (VS-HW-24 (e) not run), AP H; DFM-ACT-014 covers the bench step. SG-07 tree gap recorded for the FTA owner.
schema_version: 1
analysis:
  id: DFM
  type: dfmea
  title: "DFMEA — device, integrated panda, harness, vehicle interfaces"
  revision: "0.13"
  status: draft
  baseline: BL-007
  rating_tables: RT-3
  msr: complete
  scope: "Safety-relevant hardware of AC-001 at BL-007 (hardware as at BL-002): comma 3X panda section (STM32H725, clock and watchdog, MCU supply, CAN transceivers), Toyota harness and relay box, SoC-MCU interface, siren path, enclosure and cooling. SoC, cameras and other QM hardware only where they couple into these (WP-A-03)."
  team:
    - {name: Jherrod Thomas, role: "Project maintainer, safety lead (reviewer/approver)"}
    - {name: Claude (AI assistant), role: "Drafting assistance; ratings require human review"}
  references:
    - assurance/08-analyses/fmea/fmea-plan.md
    - assurance/08-analyses/fmea/rating-tables.md
    - assurance/04-hardware/WP-H-02-hardware-design.md
    - assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md
    - assurance/08-analyses/WP-A-03-dependent-failure-analysis.md
  updated: 2026-10-16
