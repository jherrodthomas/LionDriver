  severity: 10
  causes:
  - id: DFM-004.C1
    description: Hang in an ISR or main loop, unused vector to Default_Handler, or assert_fatal loop
    element: DFM-SE-003
    prevention_controls:
    - description: 'IWDG (LSI), 90 ms nominal, window mode, started on every relay drive and fed only after safety-task and main-loop progress (BL-002, panda#1, #3);
        a reset floats the relay GPIO'
      ref: panda/board/drivers/hw_watchdog.h
    detection_controls:
    - description: Watchdog HIL test with injected hangs (FAULT_INJECTION build); targeted, not yet run (no HIL bench, D-04)
      test: panda/tests/hitl/test_10_hw_watchdog.py
    occurrence: 3
    detection: 8
    ap: H
    actions:
    - DFM-ACT-003
    msr:
      mechanisms:
      - 1
      diagnostic: 'IWDG expires about 90 ms after the last feed (T-09a); BL-005 reports a watchdog reset in health (panda#6). Timing
        fits on paper. On the box side, an undriven SBU1 is pulled to pass-through by R2+R3 (RR-2026-010 HB-02); the device-side
