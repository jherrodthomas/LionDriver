    - assurance/08-analyses/fmea/rating-tables.md
    - assurance/04-hardware/WP-H-02-hardware-design.md
    - assurance/04-hardware/WP-H-03-hardware-safety-analysis-fmeda.md
    - assurance/08-analyses/WP-A-03-dependent-failure-analysis.md
  updated: 2026-10-14
