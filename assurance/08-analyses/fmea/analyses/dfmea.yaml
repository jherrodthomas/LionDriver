actions:
- id: DFM-ACT-001
  kind: prevention
  description: Add a CPU self-test (vendor STL if available for STM32H7) at start-up and periodically, or argue the ASIL B target without CPU coverage (WP-H-03 finding
    4)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-002
  kind: design_change
  description: Integrate the G1 layer 1 MCU measures (RAMECC handling, redundant storage, code CRC, start-up RAM test, fault escalation) from panda branch liondriver/g1-layer1
    after review and HIL evidence
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-003
  kind: detection
  description: Run the watchdog HIL test (test_10_hw_watchdog) on the bench and confirm the relay releases on reset (HWSR-502, UK-06) (D-04)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-004
  kind: design_change
  description: Cross-check the HSE-derived time base against LSI or HSI and react on deviation (HWSR-504a)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-005
  kind: design_change
  description: Set the BOR level in the option bytes and enable PVD with a safe-state reaction (WP-H-02 DC-07); read the option bytes of a reference device (UK-04)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-006
  kind: design_change
  description: Disable a transceiver and enter the safe state on persistent error or bus-off (HWSR-508, WP-H-02 DC-04)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-007
  kind: design_change
  description: Add relay readback in a LionDriver harness adapter (WP-H-02 DC-03) and confirm the de-energised contact state (UK-03)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-008
  kind: detection
  description: Define the installation check, including a stock PCS/AEB function check and a harness latch check (WP-O-01, TSR-805)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-009
  kind: design_change
  description: Replace the 8-bit XOR with a CRC and add a sequence counter on the SoC-MCU link (GAP-10)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-010
  kind: design_change
  description: 'Implement D-09/D-10: LionDriver signing key, no debug key in release builds, WRP + RDP1, remove the development-bootstub recovery (LD-DES-001 DR-10..DR-16)'
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-011
  kind: detection
  description: Confirm the siren audio topology (UK-07) and add a start-up siren self-test (TSR-515/516)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-012
  kind: design_change
  description: React to MCU DTS out of range with the safe state (HWSR-509, DC-10); obtain the MCU temperature grade (UK-02)
  owner: Jherrod Thomas
  status: open
- id: DFM-ACT-013
  kind: design_change
  description: 'Implement TSR-517: read back the item''s own TX frames from the bus and compare with the approved frame, revoking on a
    mismatch; enable RAMECC handling for the FDCAN message RAM if the H725 provides it'
  owner: Jherrod Thomas
  status: open
