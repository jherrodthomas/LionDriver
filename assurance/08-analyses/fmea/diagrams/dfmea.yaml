p_diagram:
  title: "Panda safety path hardware"
  focus: "Panda safety path: MCU, clock/IWDG, supply, transceivers, intercept switch"
  functions: [DFM-FN-001, DFM-FN-002, DFM-FN-003, DFM-FN-004, DFM-FN-005]
  inputs:
    - "SoC CAN TX and heartbeat over SPI4"
    - "Vehicle bus 0 RX: 0x260, 0xAA, 0x1D2"
    - "Camera bus 2 frames (0x283 PCS)"
    - "12 V supply via harness (IF-08)"
    - "Ignition line and SBU orientation sense"
    - "25 MHz HSE and LSI clocks"
  ideal_outputs:
    - "Only in-envelope 0x2E4/0x343 on bus 0"
    - "Camera frames forwarded bus 2 to bus 0"
    - "Relay released on fault, reset, no power"
    - "MCU reset within 0.1 s of a hang"
    - "Vehicle bus never disturbed by the item"
  error_states:
    - text: "Out-of-envelope frame passes or is altered"
      failure_modes: [DFM-001, DFM-002, DFM-003, DFM-019]
    - text: "Hang with relay energised; no watchdog reset"
      failure_modes: [DFM-004, DFM-006]
    - text: "Timeouts stretched by a wrong time base"
      failure_modes: [DFM-005]
    - text: "MCU keeps running in the brown-out zone"
      failure_modes: [DFM-007]
    - text: "Vehicle bus blocked or bus 0 RX lost"
      failure_modes: [DFM-008, DFM-009]
    - text: "Relay stuck intercepting or stuck released"
      failure_modes: [DFM-010, DFM-011]
  noise_factors:
    piece_to_piece:
      - "Part grades unknown, no BOM (UK-02)"
      - "HSE crystal tolerance and load (FM-CLK-02)"
      - "LSI tolerance sets IWDG timeout"
      - "Board revision tres/cuatro (UK-09)"
    change_over_time:
      - "Switch IC stress from supply transients"
      - "Flash cell degradation, multi-bit errors"
      - "HSE crystal ageing (drift)"
      - "7,500 operating h over 15 years"
    customer_usage:
      - "Connector not fully latched at install"
      - "Harness orientation swaps SBU/CAN mapping"
      - "Wrong harness variant or poor mount"
      - "Owner self-install, no install check yet"
    external_environment:
      - "Ambient to +85 °C, Tj to about +105 °C"
      - "EMC/ESD bursts on the CAN harness"
      - "12 V dips and surges: cranking, load dump"
      - "Vibration loosens the harness connector"
    system_interaction:
      - "SoC drives STM_RST_N/BOOT0, reflashes MCU"
      - "Corrupted SPI transfer from the SoC"
      - "SoC heat in the shared enclosure"
      - "Supply and clock shared with SoC? (UK-05)"
  control_factors:
    - text: "IWDG1 window, ~90 ms (RLR 719, WINR 679)"
      ref: "assurance/04-hardware/WP-H-02-hardware-design.md §4; panda/board/drivers/hw_watchdog.h (TSR-501)"
    - text: "Relay open-drain; high or reset = released"
      ref: "assurance/03-system/WP-S-05-hsi-specification.md §6, §11.3 S-22 (TSR-506, TSR-706)"
    - text: "BOR level and PVD reaction (DC-07, open)"
      ref: "assurance/04-hardware/WP-H-02-hardware-design.md §4, §6 DC-07 (TSR-505); DFM-ACT-005"
    - text: "Bootstub signature check at power-up"
      ref: "assurance/03-system/WP-S-05-hsi-specification.md §7 (TSR-511); panda/board/bootstub.c"
    - text: "TX hook envelope + XOR before FDCAN load"
      ref: "assurance/03-system/WP-S-05-hsi-specification.md §4.3, §11.2 S-17 (TSR-108, TSR-517)"
    - text: "CSS on HSE loss: NMI, then reset"
      ref: "assurance/04-hardware/WP-H-02-hardware-design.md §3.5, §4 (TSR-504); panda/board/stm32h7/clock.h"
