p_diagram:
  title: "P-diagram: engagement and actuation authority"
  focus: "Safety-relevant software: engagement and actuation authority"
  functions: [SWF-FN-002, SWF-FN-004, SWF-FN-010, SWF-FN-012, SWF-FN-020, SWF-FN-021, SWF-FN-022, SWF-FN-031, SWF-FN-032, SWF-FN-040, SWF-FN-041, SWF-FN-045]
  inputs:
    - "Driver engagement (PCM cruise, buttons)"
    - "modelV2 path and longitudinalPlan"
    - "Vehicle CAN RX (brake, EPS torque, gas)"
    - "driverMonitoringState"
    - "CarParams safety config (TOYOTA, 73)"
  ideal_outputs:
    - "Torque and accel only within envelope"
    - "Authority only while driver-engaged"
    - "Disengage on brake, cancel or fault"
    - "Takeover alert, visual and audible"
    - "Panda running the intended safety mode"
  error_states:
    - text: "Authority kept after engagement should end"
      failure_modes: [SWF-014, SWF-020, SWF-021, SWF-031, SWF-033, SWF-036, SWF-040]
    - text: "Engaged without driver intent"
      failure_modes: [SWF-007, SWF-030, SWF-039, SWF-048, SWF-054, SWF-055]
    - text: "Wrong or permissive safety mode in panda"
      failure_modes: [SWF-013, SWF-015, SWF-022, SWF-028, SWF-034]
    - text: "Stale or corrupt command reaches the vehicle"
      failure_modes: [SWF-023, SWF-026, SWF-043, SWF-045, SWF-047]
    - text: "Torque or accel outside the envelope sent"
      failure_modes: [SWF-001, SWF-003, SWF-016, SWF-041, SWF-042, SWF-052]
    - text: "Fault without disable or takeover alert"
      failure_modes: [SWF-032, SWF-035, SWF-037, SWF-050]
  noise_factors:
    piece_to_piece:
      - "Reference build opted out (flag empty)"
      - "Safety param and CarParams per fingerprint"
      - "Learned torque params and lateral delay"
    change_over_time:
      - "Upstream openpilot/opendbc syncs"
      - "Driving model (modeld) updates"
      - "Drift of learned lateral torque params"
    customer_usage:
      - "Engage/cancel patterns, steering override"
      - "Developer toggles (LateralManeuverMode)"
      - "Driver attention per driverMonitoringState"
    external_environment:
      - "SoC CPU load and memory pressure"
      - "Thermal throttling (overheat event)"
      - "Message timing jitter on msgq sockets"
    system_interaction:
      - "modeld output quality and freshness"
      - "SPI transfer errors and retries"
      - "Panda firmware version vs reference build"
      - "Stock EPS/PCM behaviour and faults"
  control_factors:
    - text: "Heartbeat 0xf3 + engaged flag, 0.3 s revoke"
      ref: "openpilot/selfdrive/pandad/pandad.cc:328, 439; panda/board/drivers/heartbeat_monitor.h:15; panda/board/main.c:240-242"
    - text: "TX whitelist and Toyota TX checks"
      ref: "opendbc_repo/opendbc/safety/safety.h:232-241, 293; opendbc_repo/opendbc/safety/modes/toyota.h:297"
    - text: "controls_allowed gated on PCM rising edge"
      ref: "opendbc_repo/opendbc/safety/safety.h:683-711 (pcm_cruise_check), 500-520 (generic_rx_checks)"
    - text: "ControlsMismatch 2 samples, 0.5 s, grace"
      ref: "openpilot/selfdrive/selfdrived/selfdrived.py:53-56, 138, 565-574; openpilot/selfdrive/selfdrived/supervision.py:4 (TSR-621)"
    - text: "Stale-input checks (inputs_fresh, age < 1 s)"
      ref: "openpilot/selfdrive/controls/controlsd.py:34-36, 119-120; openpilot/selfdrive/pandad/pandad.cc:79; openpilot/selfdrive/car/card.py:234"
    - text: "TX arrival 50/100 ms, TX rate budget"
      ref: "opendbc_repo/opendbc/safety/modes/toyota.h:586-606 (TSR-408, TSR-518; reference build)"
    - text: "Firmware torque and accel limit checks"
      ref: "opendbc_repo/opendbc/safety/lateral.h:10-150; opendbc_repo/opendbc/safety/longitudinal.h:3-12 (SWF-FN-002/003)"
