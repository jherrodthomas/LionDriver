p_diagram:
  title: "L2 ACC + ALC on the Corolla, highway ODD"
  focus: "LD-SDA L2 ACC + ALC on the Corolla E210 · ZRE212 · US, highway ODD (ODD-H)"
  functions: [SFM-FN-001, SFM-FN-002, SFM-FN-003, SFM-FN-004, SFM-FN-005, SFM-FN-007]
  inputs:
    - "Road scene images (road/wide camera)"
    - "Radar lead tracks 0x180-0x19F"
    - "Vehicle state: 0xAA, 0x260, 0x1D2, 0x226"
    - "Driver cruise buttons, pedals, steering"
    - "Driver face images (IR camera)"
    - "Vehicle 12 V supply and ignition"
  ideal_outputs:
    - "Lane-centred steering torque in envelope"
    - "Accel -3.5..+2.0 m/s² for set speed/gap"
    - "Engage on request only; release on brake"
    - "Timely take-over alerts, DM escalation"
    - "Stock PCS/AEB kept available"
  error_states:
    - text: "Unintended, excessive or wrong-way steering"
      failure_modes: [SFM-001, SFM-002, SFM-003, SFM-029, SFM-030]
    - text: "Lane drift: weak, lost, frozen or oscillating"
      failure_modes: [SFM-004, SFM-005, SFM-006, SFM-007]
    - text: "Unintended acceleration or phantom braking"
      failure_modes: [SFM-008, SFM-009]
    - text: "Too little or too late braking for a lead"
      failure_modes: [SFM-010, SFM-011, SFM-012]
    - text: "Engages wrongly or does not yield to driver"
      failure_modes: [SFM-013, SFM-014, SFM-017, SFM-018, SFM-019, SFM-020, SFM-021]
    - text: "Inattention missed or take-over not perceived"
      failure_modes: [SFM-022, SFM-023, SFM-025, SFM-026, SFM-027]
  noise_factors:
    piece_to_piece:
      - "EPS/ECM/camera firmware by E210 year (OI-9)"
      - "Device and harness revision (OI-2)"
      - "Mount position per installation (AOU-08)"
      - "Tyres, alignment, steer ratio (AOU-09)"
    change_over_time:
      - "Mount shift after calibration (TC-19)"
      - "Online learners drift (paramsd, torqued)"
      - "Upstream update changes defaults (GAP-18)"
      - "Harness relay contact wear (DFM-010)"
    customer_usage:
      - "Hands-off, phone use, drowsy (MC-01..03)"
      - "DM defeat: cam covered, nudgers (MC-04/06)"
      - "Use outside ODD, > 120 km/h (MC-07)"
      - "Gas override taken as disengage (MC-08)"
    external_environment:
      - "Low sun, glare, rain and spray (TC-01..03)"
      - "Faded markings, exit lane splits (TC-05/31)"
      - "Cut-in, stopped car, cut-out (TC-07..09)"
      - "Tight curve, banking, crosswind (TC-14/15)"
    system_interaction:
      - "Stock camera LKA/ACC on bus if relay fails"
      - "PCM ignores cancel or bounds ACC (AOU-05)"
      - "EPS torque cap, fault or lockout (AOU-01)"
      - "SoC load, throttling, msg delays (TC-23)"
  control_factors:
    - text: "Torque 1500 raw, rate +15/-25 per frame"
      ref: "assurance/03-system/WP-S-05-hsi-specification.md §11.1 S-02; WP-S-02 TSR-101..104"
    - text: "Accel bounds -3.5..+2.0 m/s² in envelope"
      ref: "assurance/03-system/WP-S-05-hsi-specification.md §11.1 S-03; WP-S-02 TSR-201"
    - text: "Authority on PCM cruise edge + heartbeat"
      ref: "assurance/03-system/WP-S-02-technical-safety-requirements.md TSR-301; WP-S-03 §6 SM-04, SM-29"
    - text: "DM escalation 5/8/13 s, decel, lockout"
      ref: "assurance/02-concept/WP-C-08-driver-hmi-misuse-analysis.md §5.1; WP-S-02 TSR-608"
    - text: "Chill mode by default (Experimental off)"
      ref: "assurance/01-management/WP-M-07-risk-management.md D-08; WP-C-07 FM-01"
    - text: "Fail-silent fault reaction + panda siren"
      ref: "assurance/03-system/WP-S-03-technical-safety-concept-architecture.md §2 AP-2; WP-S-02 TSR-516"
