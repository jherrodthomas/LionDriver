# Variant structure of the LionDriver item (LD-ITEM-001).
# LD-ITEM-001 is withdrawn as an item definition (DQ-124 A, 2026-10-22): WP-C-01 is of record. This file stays as
# the variant data the FMEDA and the vehicle register read.
# Vehicle facts and the CARS.md member strings live in the vehicle register (docs/liondriver/vehicles/vehicles.yaml).
# assurance/08-analyses/fmea/item/vehicle-catalog.md is generated from this file and docs/CARS.md by
# tools/safety/gen_vehicle_catalog.py; do not edit the catalog by hand.
schema_version: 1
platform:
  id: PL-001
  name: LionDriver platform — all vehicles supported by BL-001
  source: docs/CARS.md
  status: not_assessed
families:
  # Members, platform siblings and vehicle facts come from the vehicle register
  # (docs/liondriver/vehicles/vehicles.yaml); gen_vehicle_catalog.load_variants() merges them in.
  - id: VF-001
    register_family: VF-001
    status: in_assessment
assured_configurations:
  - id: AC-001
    register_config: CFG-001
    family: VF-001
    baseline: BL-001
    status: in_assessment
