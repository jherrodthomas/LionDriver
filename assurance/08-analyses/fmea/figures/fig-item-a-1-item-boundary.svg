  <rect x="240" y="756" width="115" height="50" rx="8" class="ext"/>
  <text x="297" y="785" class="t sb" font-size="12" text-anchor="middle">Steering (EPS)</text>
  <line x1="428" y1="730" x2="428" y2="756" stroke="#0F172A" stroke-width="2"/>
  <rect x="371" y="756" width="115" height="50" rx="8" class="ext"/>
  <text x="428" y="785" class="t sb" font-size="12" text-anchor="middle">Powertrain</text>
  <line x1="559" y1="730" x2="559" y2="756" stroke="#0F172A" stroke-width="2"/>
  <rect x="502" y="756" width="115" height="50" rx="8" class="ext"/>
  <text x="559" y="785" class="t sb" font-size="12" text-anchor="middle">Brakes</text>
  <line x1="690" y1="730" x2="690" y2="756" stroke="#0F172A" stroke-width="2"/>
  <rect x="633" y="756" width="115" height="50" rx="8" class="ext"/>
  <text x="690" y="785" class="t sb" font-size="12" text-anchor="middle">ADAS radar</text>
  <line x1="821" y1="730" x2="821" y2="756" stroke="#0F172A" stroke-width="2"/>
  <rect x="764" y="756" width="115" height="50" rx="8" class="ext"/>
  <text x="821" y="785" class="t sb" font-size="12" text-anchor="middle">Gateway</text>
  <line x1="952" y1="730" x2="952" y2="756" stroke="#0F172A" stroke-width="2"/>
  <rect x="895" y="756" width="115" height="50" rx="8" class="ext"/>
  <text x="952" y="785" class="t sb" font-size="12" text-anchor="middle">Cluster</text>
