  <circle cx="840" cy="596" r="4.5" fill="#0F172A"/><circle cx="950" cy="596" r="4.5" fill="#0F172A"/>
  <rect x="873" y="603" width="44" height="14" rx="3" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="895" y="613.5" class="m" font-size="8.5" text-anchor="middle">relay</text>
