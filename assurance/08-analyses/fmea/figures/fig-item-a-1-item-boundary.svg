  <text x="1145" y="794" class="m xs" text-anchor="middle">vehicle electrical system</text>
  <text x="625" y="828" class="m xs" text-anchor="middle">Vehicle ECUs and buses: outside the item, analysed as interfaces only</text>

  <!-- ===== connections ===== -->
  <!-- IF-06 road environment -> road cameras -->
  <path d="M215 156 V287 H278" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#aT)"/>
