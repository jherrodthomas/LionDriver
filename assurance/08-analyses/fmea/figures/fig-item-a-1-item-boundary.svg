<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure A-1. Platform item boundary and architecture (LD-ITEM-001 §A.3)</title>
  <desc id="d">The item contains the comma 3X device (cameras, IMU, GNSS, display, speaker, SoC with openpilot software at QM including the opendbc car port and the OTA update client, and the integrated panda MCU running the opendbc safety model, linked to the SoC by SPI and GPIO reset/BOOT0) and the vehicle-specific harness with the intercept relay. Interfaces IF-01 to IF-07 connect it to the vehicle CAN buses and ECUs (steering, powertrain, brakes, ADAS radar, gateway, cluster), the stock ADAS camera through the relay, the 12 V supply, the driver through the device HMI and through the vehicle controls, the road environment and driver as sensor inputs, and the comma.ai and LionDriver servers over cellular or Wi-Fi.</desc>
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker>
    <marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A16207"/></marker>
    <style>
      .t{fill:#0F172A}.m{fill:#475569}.s{font-size:11px}.xs{font-size:10px}.b{font-weight:700}.sb{font-weight:600}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.2}
      .ext{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.2}
      .chip{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1}
      .ml{fill:#EEF2FF;stroke:#A5B4FC;stroke-width:1}
      .tag{font-size:10px;font-weight:700;letter-spacing:.04em}
    </style>
  </defs>

  <rect width="1280" height="900" fill="#FFFFFF"/>

  <!-- header -->
  <text x="40" y="44" class="t b" font-size="20">Figure A-1 · Item boundary and architecture (platform PL-001)</text>
  <text x="40" y="66" class="m" font-size="12.5">Common to every supported vehicle; harness type, bus layout and messages vary by vehicle (§A.10)</text>
  <text x="1240" y="44" class="m s" text-anchor="end">LD-ITEM-001 §A.3</text>
  <text x="1240" y="62" class="m s" text-anchor="end">function allocation §A.3 · interfaces §A.4</text>
  <line x1="40" y1="82" x2="1240" y2="82" stroke="#E2E8F0"/>

  <!-- ===== outside: road environment ===== -->
  <rect x="40" y="100" width="190" height="56" rx="8" class="ext"/>
  <text x="135" y="123" class="t sb" font-size="13" text-anchor="middle">Road environment</text>
  <text x="135" y="140" class="m xs" text-anchor="middle">other road users</text>

  <!-- ===== outside: servers ===== -->
  <rect x="1050" y="100" width="190" height="72" rx="8" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="1145" y="122" class="t sb" font-size="12.5" text-anchor="middle">comma.ai and</text>
  <text x="1145" y="138" class="t sb" font-size="12.5" text-anchor="middle">LionDriver servers</text>
  <text x="1145" y="157" class="m xs" text-anchor="middle">update source · logs</text>

  <!-- ===== outside: driver ===== -->
  <rect x="40" y="250" width="150" height="250" rx="10" class="ext"/>
  <g transform="translate(115,284)" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round">
    <circle cx="0" cy="0" r="11"/><path d="M0 11V44M-18 22H18M0 44L-14 66M0 44L14 66"/>
  </g>
  <text x="115" y="376" class="t b" font-size="14" text-anchor="middle">Driver</text>
  <text x="115" y="393" class="m xs" text-anchor="middle">supervises at all times,</text>
  <text x="115" y="406" class="m xs" text-anchor="middle">takes over (SAE L2)</text>
  <text x="115" y="423" class="m xs" text-anchor="middle">DA-01, DA-02</text>
  <text x="115" y="474" class="m xs" text-anchor="middle">pedals · wheel ·</text>
  <text x="115" y="487" class="m xs" text-anchor="middle">cruise buttons</text>

  <!-- ===== ITEM BOUNDARY ===== -->
  <rect x="240" y="190" width="770" height="460" rx="16" fill="#FFFBEB" fill-opacity=".5" stroke="#B45309" stroke-width="2" stroke-dasharray="10 5"/>
  <rect x="262" y="178" width="200" height="24" rx="12" fill="#B45309"/>
  <text x="362" y="194" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing=".08em">ITEM BOUNDARY</text>

  <!-- comma 3X -->
  <rect x="262" y="222" width="726" height="258" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="280" y="245" class="t b" font-size="13">comma 3X</text>
  <text x="350" y="245" class="m s">device: SoC, cameras, IMU, GNSS, display, speaker</text>

  <!-- sensors / HMI -->
  <rect x="280" y="262" width="150" height="50" rx="8" class="box"/>
  <text x="355" y="283" class="t sb" font-size="12" text-anchor="middle">Road cameras</text>
  <text x="355" y="299" class="m xs" text-anchor="middle">road + wide · IMU · GNSS</text>
  <rect x="280" y="330" width="150" height="50" rx="8" class="box"/>
  <text x="355" y="351" class="t sb" font-size="12" text-anchor="middle">Driver camera (IR)</text>
  <text x="355" y="367" class="m xs" text-anchor="middle">driver monitoring input</text>
