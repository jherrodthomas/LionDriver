  <text x="578" y="529" class="t b" font-size="13">Harness</text>
  <text x="578" y="546" class="m s">vehicle-specific connector:</text>
  <text x="578" y="560" class="m s">camera-intercept, gateway</text>
  <text x="578" y="574" class="m s">(J533) or other, per catalog</text>
