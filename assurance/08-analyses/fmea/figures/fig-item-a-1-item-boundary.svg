  <rect x="472" y="352" width="252" height="44" rx="6" class="chip"/>
  <text x="598" y="371" class="t sb" font-size="11.5" text-anchor="middle">Planning, control, engagement, alerts</text>
  <text x="598" y="386" class="m xs" text-anchor="middle">plannerd · controlsd · selfdrived · ui · soundd</text>
  <rect x="472" y="406" width="252" height="44" rx="6" class="chip"/>
  <text x="598" y="425" class="t sb" font-size="11.5" text-anchor="middle">opendbc car port (card)</text>
  <text x="598" y="440" class="m xs" text-anchor="middle">vehicle-specific CAN interface</text>

  <!-- panda -->
  <rect x="800" y="262" width="172" height="200" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.8"/>
  <text x="814" y="283" class="t b" font-size="12.5">Integrated panda MCU</text>
  <text x="814" y="298" class="m xs">firmware · opendbc safety</text>
  <rect x="814" y="306" width="120" height="20" rx="10" fill="#C2410C"/>
  <text x="874" y="320" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".05em">SAFETY MODEL</text>
  <text x="814" y="344" class="t xs">• TX filter, actuation limits</text>
  <text x="814" y="360" class="t xs">• RX checks: checksum,</text>
  <text x="824" y="373" class="t xs">counter, timing</text>
  <text x="814" y="389" class="t xs">• relay control and</text>
  <text x="824" y="402" class="t xs">malfunction detection</text>
  <text x="814" y="428" class="m xs">car side · camera side</text>
  <text x="814" y="441" class="m xs">(bus layout per vehicle)</text>

  <!-- SPI + GPIO -->
  <path d="M740 332 H798" fill="none" stroke="#C2410C" stroke-width="2.4" marker-start="url(#aR)" marker-end="url(#aR)"/>
  <g class="tag"><rect x="740" y="304" width="60" height="18" rx="9" fill="#C2410C"/><text x="770" y="317" fill="#fff" text-anchor="middle">SPI·GPIO</text></g>
