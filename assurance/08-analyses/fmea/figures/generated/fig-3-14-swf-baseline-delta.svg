  <text x="40" y="352" font-size="10" fill="#475569">Each row is a cause that records its rating at an earlier baseline (`previous` in the YAML). Tracks run from 1 (left, better) to 10; a single filled marker means that rating did not change. Sorted by AP gained, then by element.</text>
  <text x="40" y="367" font-size="10" fill="#475569">Causes without a `previous` record are not drawn: they are new at this baseline or were not re-rated. A lower rating here is credited in the analysis; it is not a claim that the fault was tested in the field.</text>
