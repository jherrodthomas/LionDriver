<path d="M445.0 786.0 L445.0 752.0" class="ln" stroke-width="2"/><path d="M445.0 752.0 L447.7 758.4 L442.3 758.4 Z" class="ah"/>
<rect x="24.0" y="786.0" width="842.0" height="76.0" rx="6" class="surf"/>
<text x="36.0" y="806.0" class="acc" font-size="11" font-weight="700" text-anchor="start">CONTROL FACTORS (WHAT THE DESIGN SETS)</text>
<text x="36.0" y="824.0" class="ink" font-size="11" text-anchor="start">• Submodules and models pinned by commit/oid</text>
<text x="36.0" y="838.0" class="ink" font-size="11" text-anchor="start">• CI gates: safety tests, coverage, MISRA</text>
<text x="36.0" y="852.0" class="ink" font-size="11" text-anchor="start">• Signed RC tag; release tag on same commit</text>
<text x="451.0" y="824.0" class="ink" font-size="11" text-anchor="start">• Release decision, signed release record</text>
<text x="451.0" y="838.0" class="ink" font-size="11" text-anchor="start">• Panda reference lock, build flag at boot</text>
<text x="451.0" y="852.0" class="ink" font-size="11" text-anchor="start">• Installation checklist INS-01..30</text>
</svg>
