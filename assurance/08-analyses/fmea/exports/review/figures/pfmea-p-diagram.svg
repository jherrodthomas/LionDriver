<rect class="bg" x="0" y="0" width="980" height="882" rx="8"/>
<text x="24.0" y="30.0" class="ink" font-size="15" font-weight="600" text-anchor="start">PFMEA P-diagram: as-driven AC-001</text>
<rect x="26.0" y="50.0" width="176.0" height="146.0" rx="6" class="nB"/>
<text x="36.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Piece to piece</text>
<text x="36.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Device revision: comma 3X</text>
<text x="36.0" y="102.0" class="ink" font-size="11" text-anchor="start">vs comma four</text>
<text x="36.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Harness type and harness</text>
<text x="36.0" y="130.0" class="ink" font-size="11" text-anchor="start">box revision</text>
<text x="36.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Vehicle ECU FW versions,</text>
<text x="36.0" y="158.0" class="ink" font-size="11" text-anchor="start">trim, model year</text>
<rect x="214.0" y="50.0" width="176.0" height="146.0" rx="6" class="nB"/>
<text x="224.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Change over time</text>
<text x="224.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Upstream defaults change</text>
<text x="224.0" y="102.0" class="ink" font-size="11" text-anchor="start">(f21bfc3 Exp. on)</text>
<text x="224.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Submodule or model pins</text>
<text x="224.0" y="130.0" class="ink" font-size="11" text-anchor="start">moved after verify</text>
<text x="224.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Build and CI tool</text>
<text x="224.0" y="158.0" class="ink" font-size="11" text-anchor="start">versions</text>
<text x="224.0" y="172.0" class="ink" font-size="11" text-anchor="start">• Dealer EPS/ECM updates,</text>
<text x="224.0" y="186.0" class="ink" font-size="11" text-anchor="start">windscreen swap</text>
<rect x="402.0" y="50.0" width="176.0" height="146.0" rx="6" class="nB"/>
<text x="412.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Customer usage</text>
<text x="412.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Installer skill; latch</text>
<text x="412.0" y="102.0" class="ink" font-size="11" text-anchor="start">judged by feel</text>
<text x="412.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Installer uses comma</text>
<text x="412.0" y="130.0" class="ink" font-size="11" text-anchor="start">default installer</text>
<text x="412.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Owner changes toggles</text>
<text x="412.0" y="158.0" class="ink" font-size="11" text-anchor="start">(Experimental, SSH)</text>
<rect x="590.0" y="50.0" width="176.0" height="146.0" rx="6" class="nB"/>
<text x="600.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">External environment</text>
<text x="600.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Network for update check,</text>
<text x="600.0" y="102.0" class="ink" font-size="11" text-anchor="start">AGNOS from CDN</text>
<text x="600.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Vehicle state: active</text>
<text x="600.0" y="130.0" class="ink" font-size="11" text-anchor="start">DTCs, ignition</text>
<text x="600.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Calibration road:</text>
<text x="600.0" y="158.0" class="ink" font-size="11" text-anchor="start">straight, above 15 mph</text>
<rect x="778.0" y="50.0" width="176.0" height="146.0" rx="6" class="nB"/>
<text x="788.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">System interaction</text>
<text x="788.0" y="88.0" class="ink" font-size="11" text-anchor="start">• comma installer and</text>
<text x="788.0" y="102.0" class="ink" font-size="11" text-anchor="start">updater (git, TLS)</text>
<text x="788.0" y="116.0" class="ink" font-size="11" text-anchor="start">• GitHub Actions: logs</text>
<text x="788.0" y="130.0" class="ink" font-size="11" text-anchor="start">expire, comma-gated</text>
<text x="788.0" y="144.0" class="ink" font-size="11" text-anchor="start">• CarParamsCache from</text>
<text x="788.0" y="158.0" class="ink" font-size="11" text-anchor="start">another vehicle</text>
<text x="788.0" y="172.0" class="ink" font-size="11" text-anchor="start">• pandad reflash on</text>
<text x="788.0" y="186.0" class="ink" font-size="11" text-anchor="start">signature mismatch</text>
<text x="490.0" y="216.0" class="n" font-size="11" font-weight="700" text-anchor="middle">NOISE FACTORS</text>
<rect x="24.0" y="400.0" width="230.0" height="188.0" rx="6" class="box"/>
<text x="36.0" y="420.0" class="acc" font-size="11" font-weight="700" text-anchor="start">INPUTS</text>
<text x="36.0" y="438.0" class="ink" font-size="11" text-anchor="start">• Frozen baseline, signed RC</text>
<text x="36.0" y="452.0" class="ink" font-size="11" text-anchor="start">tag</text>
<text x="36.0" y="466.0" class="ink" font-size="11" text-anchor="start">• LionDriver panda release key</text>
<text x="36.0" y="480.0" class="ink" font-size="11" text-anchor="start">• comma 3X and Toyota TSS2</text>
<text x="36.0" y="494.0" class="ink" font-size="11" text-anchor="start">harness</text>
<text x="36.0" y="508.0" class="ink" font-size="11" text-anchor="start">• Corolla E210 · ZRE212 · US</text>
<text x="36.0" y="522.0" class="ink" font-size="11" text-anchor="start">reference vehicle (CFG-001)</text>
<text x="36.0" y="536.0" class="ink" font-size="11" text-anchor="start">• Release record: hashes, FW,</text>
<text x="36.0" y="550.0" class="ink" font-size="11" text-anchor="start">parameters</text>
<text x="36.0" y="564.0" class="ink" font-size="11" text-anchor="start">• Installer with WP-O-01</text>
<text x="36.0" y="578.0" class="ink" font-size="11" text-anchor="start">checklist</text>
<rect x="300.0" y="236.0" width="290.0" height="516.0" rx="10" class="in"/>
<text x="445.0" y="441.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">Producing the as-driven</text>
<text x="445.0" y="458.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">reference configuration</text>
<text x="445.0" y="475.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">(AC-001)</text>
<text x="316.0" y="500.0" class="mut" font-size="10.5" text-anchor="start">Functions covered:</text>
<text x="316.0" y="513.0" class="mut" font-size="10.5" text-anchor="start">PFM-FN-001, PFM-FN-002, PFM-FN-003,</text>
<text x="316.0" y="526.0" class="mut" font-size="10.5" text-anchor="start">PFM-FN-004, PFM-FN-005, PFM-FN-006,</text>
<text x="316.0" y="539.0" class="mut" font-size="10.5" text-anchor="start">PFM-FN-007, PFM-FN-008, PFM-FN-009,</text>
<text x="316.0" y="552.0" class="mut" font-size="10.5" text-anchor="start">PFM-FN-010, PFM-FN-011</text>
<rect x="636.0" y="236.0" width="230.0" height="202.0" rx="6" class="lB"/>
<text x="648.0" y="256.0" class="l" font-size="11" font-weight="700" text-anchor="start">IDEAL FUNCTION (OUTPUTS)</text>
<text x="648.0" y="274.0" class="ink" font-size="11" text-anchor="start">• Signed RELEASE panda FW,</text>
<text x="648.0" y="288.0" class="ink" font-size="11" text-anchor="start">reference flag</text>
<text x="648.0" y="302.0" class="ink" font-size="11" text-anchor="start">• Installed commit equals</text>
<text x="648.0" y="316.0" class="ink" font-size="11" text-anchor="start">release tag</text>
<text x="648.0" y="330.0" class="ink" font-size="11" text-anchor="start">• Parameters at release values</text>
<text x="648.0" y="344.0" class="ink" font-size="11" text-anchor="start">(Chill)</text>
<text x="648.0" y="358.0" class="ink" font-size="11" text-anchor="start">• carParams COROLLA_TSS2,</text>
<text x="648.0" y="372.0" class="ink" font-size="11" text-anchor="start">safety param 73</text>
<text x="648.0" y="386.0" class="ink" font-size="11" text-anchor="start">• Mount in tolerance, stock</text>
<text x="648.0" y="400.0" class="ink" font-size="11" text-anchor="start">PCS preserved</text>
<text x="648.0" y="414.0" class="ink" font-size="11" text-anchor="start">• Signed record, briefed</text>
<text x="648.0" y="428.0" class="ink" font-size="11" text-anchor="start">driver</text>
<rect x="636.0" y="452.0" width="230.0" height="300.0" rx="6" class="hB"/>
<text x="648.0" y="472.0" class="h" font-size="11" font-weight="700" text-anchor="start">ERROR STATES → FAILURE MODES</text>
<text x="648.0" y="490.0" class="ink" font-size="11" text-anchor="start">• DEBUG or debug-signed panda</text>
<text x="648.0" y="504.0" class="ink" font-size="11" text-anchor="start">firmware</text>
<text x="648.0" y="518.0" class="mut mono" font-size="10.5" text-anchor="start">   PFM-001, PFM-002</text>
<text x="648.0" y="532.0" class="ink" font-size="11" text-anchor="start">• Unverified or non-release</text>
<text x="648.0" y="546.0" class="ink" font-size="11" text-anchor="start">software on device</text>
<text x="648.0" y="560.0" class="mut mono" font-size="10.5" text-anchor="start">   PFM-003, PFM-004, PFM-005,</text>
<text x="648.0" y="574.0" class="mut mono" font-size="10.5" text-anchor="start">   PFM-012, PFM-016, PFM-017</text>
<text x="648.0" y="588.0" class="ink" font-size="11" text-anchor="start">• Wrong parameters,</text>
<text x="648.0" y="602.0" class="ink" font-size="11" text-anchor="start">Experimental Mode left on</text>
<text x="648.0" y="616.0" class="mut mono" font-size="10.5" text-anchor="start">   PFM-011</text>
<text x="648.0" y="630.0" class="ink" font-size="11" text-anchor="start">• Wrong or damaged harness,</text>
<text x="648.0" y="644.0" class="ink" font-size="11" text-anchor="start">connector unlatched</text>
<text x="648.0" y="658.0" class="mut mono" font-size="10.5" text-anchor="start">   PFM-006, PFM-008, PFM-010</text>
<text x="648.0" y="672.0" class="ink" font-size="11" text-anchor="start">• Vehicle misidentified or not</text>
<text x="648.0" y="686.0" class="ink" font-size="11" text-anchor="start">reference</text>
<text x="648.0" y="700.0" class="mut mono" font-size="10.5" text-anchor="start">   PFM-007, PFM-013</text>
<text x="648.0" y="714.0" class="ink" font-size="11" text-anchor="start">• Mount off, PCS path</text>
<text x="648.0" y="728.0" class="ink" font-size="11" text-anchor="start">unchecked, no briefing</text>
<text x="648.0" y="742.0" class="mut mono" font-size="10.5" text-anchor="start">   PFM-009, PFM-014, PFM-015</text>
<path d="M254.0 494.0 L300.0 494.0" class="ln" stroke-width="2"/><path d="M300.0 494.0 L293.6 496.7 L293.6 491.3 Z" class="ah"/>
<path d="M590.0 337.0 L636.0 337.0" class="ln" stroke-width="2"/><path d="M636.0 337.0 L629.6 339.7 L629.6 334.3 Z" class="ah"/>
