<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 868" width="980" height="868" role="img">
<title>Panda safety path hardware</title>
<style>
.bg{fill:#ffffff}.ink{fill:#1f2328}.mut{fill:#59636e}.acc{fill:#0969da}.surf{fill:#f6f8fa}.box{fill:#ffffff;stroke:#d1d9e0}
.in{fill:#ddf4ff;stroke:#54aeff}.out{fill:#f6f8fa;stroke:#d1d9e0}.bd{fill:none;stroke:#0969da;stroke-dasharray:6 4}.frame{fill:none;stroke:#d1d9e0}
.hS{fill:#ffebe9}.h{fill:#cf222e}.mS{fill:#fff8c5}.m{fill:#9a6700}.lS{fill:#dafbe1}.l{fill:#1a7f37}
.hB{fill:#ffebe9;stroke:#ff8182}.lB{fill:#dafbe1;stroke:#4ac26b}.nB{fill:#fbefff;stroke:#c297ff}.n{fill:#8250df}
.ln{stroke:#59636e;fill:none}.data{stroke:#0969da;fill:none}.energy{stroke:#bc4c00;fill:none;stroke-width:2.2}
.physical{stroke:#59636e;fill:none;stroke-dasharray:5 3}.material{stroke:#1a7f37;fill:none;stroke-dasharray:1.5 3}
.ah{fill:#59636e}.lbl{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#59636e}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.ink{fill:#e6edf3}.mut{fill:#9198a1}.acc{fill:#4493f8}.surf{fill:#151b23}.box{fill:#0d1117;stroke:#3d444d}
.in{fill:#0c2d6b;stroke:#1f6feb}.out{fill:#151b23;stroke:#3d444d}.bd{stroke:#4493f8}.frame{stroke:#3d444d}
.hS{fill:#3c1618}.h{fill:#ff7b72}.mS{fill:#3a2a0c}.m{fill:#d29922}.lS{fill:#12261a}.l{fill:#3fb950}
.hB{fill:#3c1618;stroke:#da3633}.lB{fill:#12261a;stroke:#238636}.nB{fill:#271052;stroke:#8957e5}.n{fill:#ab7df8}
.ln{stroke:#9198a1}.data{stroke:#4493f8}.energy{stroke:#f0883e}.physical{stroke:#9198a1}.material{stroke:#3fb950}
.ah{fill:#9198a1}.lbl{fill:#0d1117}.lane{fill:#151b23}.laneT{fill:#9198a1}}
</style>
<rect class="bg" x="0" y="0" width="980" height="868" rx="8"/>
<text x="24.0" y="30.0" class="ink" font-size="15" font-weight="600" text-anchor="start">Panda safety path hardware</text>
<rect x="26.0" y="50.0" width="176.0" height="160.0" rx="6" class="nB"/>
<text x="36.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Piece to piece</text>
<text x="36.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Part grades unknown, no</text>
<text x="36.0" y="102.0" class="ink" font-size="11" text-anchor="start">BOM (UK-02)</text>
<text x="36.0" y="116.0" class="ink" font-size="11" text-anchor="start">• HSE crystal tolerance and</text>
<text x="36.0" y="130.0" class="ink" font-size="11" text-anchor="start">load (FM-CLK-02)</text>
<text x="36.0" y="144.0" class="ink" font-size="11" text-anchor="start">• LSI tolerance sets IWDG</text>
<text x="36.0" y="158.0" class="ink" font-size="11" text-anchor="start">timeout</text>
<text x="36.0" y="172.0" class="ink" font-size="11" text-anchor="start">• Board revision</text>
<text x="36.0" y="186.0" class="ink" font-size="11" text-anchor="start">tres/cuatro (UK-09)</text>
<rect x="214.0" y="50.0" width="176.0" height="160.0" rx="6" class="nB"/>
<text x="224.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Change over time</text>
<text x="224.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Switch IC stress from</text>
<text x="224.0" y="102.0" class="ink" font-size="11" text-anchor="start">supply transients</text>
<text x="224.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Flash cell degradation,</text>
<text x="224.0" y="130.0" class="ink" font-size="11" text-anchor="start">multi-bit errors</text>
<text x="224.0" y="144.0" class="ink" font-size="11" text-anchor="start">• HSE crystal ageing</text>
<text x="224.0" y="158.0" class="ink" font-size="11" text-anchor="start">(drift)</text>
<text x="224.0" y="172.0" class="ink" font-size="11" text-anchor="start">• 7,500 operating h over 15</text>
<text x="224.0" y="186.0" class="ink" font-size="11" text-anchor="start">years</text>
<rect x="402.0" y="50.0" width="176.0" height="160.0" rx="6" class="nB"/>
<text x="412.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Customer usage</text>
<text x="412.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Connector not fully</text>
<text x="412.0" y="102.0" class="ink" font-size="11" text-anchor="start">latched at install</text>
<text x="412.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Harness orientation swaps</text>
<text x="412.0" y="130.0" class="ink" font-size="11" text-anchor="start">SBU/CAN mapping</text>
<text x="412.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Wrong harness variant or</text>
<text x="412.0" y="158.0" class="ink" font-size="11" text-anchor="start">poor mount</text>
<text x="412.0" y="172.0" class="ink" font-size="11" text-anchor="start">• Owner self-install, no</text>
<text x="412.0" y="186.0" class="ink" font-size="11" text-anchor="start">install check yet</text>
<rect x="590.0" y="50.0" width="176.0" height="160.0" rx="6" class="nB"/>
<text x="600.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">External environment</text>
<text x="600.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Ambient to +85 °C, Tj to</text>
<text x="600.0" y="102.0" class="ink" font-size="11" text-anchor="start">about +105 °C</text>
<text x="600.0" y="116.0" class="ink" font-size="11" text-anchor="start">• EMC/ESD bursts on the CAN</text>
<text x="600.0" y="130.0" class="ink" font-size="11" text-anchor="start">harness</text>
<text x="600.0" y="144.0" class="ink" font-size="11" text-anchor="start">• 12 V dips and surges:</text>
<text x="600.0" y="158.0" class="ink" font-size="11" text-anchor="start">cranking, load dump</text>
<text x="600.0" y="172.0" class="ink" font-size="11" text-anchor="start">• Vibration loosens the</text>
<text x="600.0" y="186.0" class="ink" font-size="11" text-anchor="start">harness connector</text>
<rect x="778.0" y="50.0" width="176.0" height="160.0" rx="6" class="nB"/>
<text x="788.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">System interaction</text>
<text x="788.0" y="88.0" class="ink" font-size="11" text-anchor="start">• SoC drives</text>
<text x="788.0" y="102.0" class="ink" font-size="11" text-anchor="start">STM_RST_N/BOOT0, reflashes</text>
<text x="788.0" y="116.0" class="ink" font-size="11" text-anchor="start">MCU</text>
<text x="788.0" y="130.0" class="ink" font-size="11" text-anchor="start">• Corrupted SPI transfer</text>
<text x="788.0" y="144.0" class="ink" font-size="11" text-anchor="start">from the SoC</text>
<text x="788.0" y="158.0" class="ink" font-size="11" text-anchor="start">• SoC heat in the shared</text>
<text x="788.0" y="172.0" class="ink" font-size="11" text-anchor="start">enclosure</text>
<text x="788.0" y="186.0" class="ink" font-size="11" text-anchor="start">• Supply and clock shared</text>
<text x="788.0" y="200.0" class="ink" font-size="11" text-anchor="start">with SoC? (UK-05)</text>
<text x="490.0" y="230.0" class="n" font-size="11" font-weight="700" text-anchor="middle">NOISE FACTORS</text>
<rect x="24.0" y="400.0" width="230.0" height="188.0" rx="6" class="box"/>
<text x="36.0" y="420.0" class="acc" font-size="11" font-weight="700" text-anchor="start">INPUTS</text>
<text x="36.0" y="438.0" class="ink" font-size="11" text-anchor="start">• SoC CAN TX and heartbeat</text>
<text x="36.0" y="452.0" class="ink" font-size="11" text-anchor="start">over SPI4</text>
<text x="36.0" y="466.0" class="ink" font-size="11" text-anchor="start">• Vehicle bus 0 RX: 0x260,</text>
<text x="36.0" y="480.0" class="ink" font-size="11" text-anchor="start">0xAA, 0x1D2</text>
<text x="36.0" y="494.0" class="ink" font-size="11" text-anchor="start">• Camera bus 2 frames (0x283</text>
<text x="36.0" y="508.0" class="ink" font-size="11" text-anchor="start">PCS)</text>
<text x="36.0" y="522.0" class="ink" font-size="11" text-anchor="start">• 12 V supply via harness</text>
<text x="36.0" y="536.0" class="ink" font-size="11" text-anchor="start">(IF-08)</text>
<text x="36.0" y="550.0" class="ink" font-size="11" text-anchor="start">• Ignition line and SBU</text>
<text x="36.0" y="564.0" class="ink" font-size="11" text-anchor="start">orientation sense</text>
<text x="36.0" y="578.0" class="ink" font-size="11" text-anchor="start">• 25 MHz HSE and LSI clocks</text>
<rect x="300.0" y="250.0" width="290.0" height="488.0" rx="10" class="in"/>
<text x="445.0" y="454.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">Panda safety path: MCU,</text>
<text x="445.0" y="471.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">clock/IWDG, supply,</text>
<text x="445.0" y="488.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">transceivers, intercept…</text>
<text x="316.0" y="513.0" class="mut" font-size="10.5" text-anchor="start">Functions covered:</text>
<text x="316.0" y="526.0" class="mut" font-size="10.5" text-anchor="start">DFM-FN-001, DFM-FN-002, DFM-FN-003,</text>
<text x="316.0" y="539.0" class="mut" font-size="10.5" text-anchor="start">DFM-FN-004, DFM-FN-005</text>
<rect x="636.0" y="250.0" width="230.0" height="174.0" rx="6" class="lB"/>
<text x="648.0" y="270.0" class="l" font-size="11" font-weight="700" text-anchor="start">IDEAL FUNCTION (OUTPUTS)</text>
<text x="648.0" y="288.0" class="ink" font-size="11" text-anchor="start">• Only in-envelope 0x2E4/0x343</text>
<text x="648.0" y="302.0" class="ink" font-size="11" text-anchor="start">on bus 0</text>
<text x="648.0" y="316.0" class="ink" font-size="11" text-anchor="start">• Camera frames forwarded bus</text>
<text x="648.0" y="330.0" class="ink" font-size="11" text-anchor="start">2 to bus 0</text>
<text x="648.0" y="344.0" class="ink" font-size="11" text-anchor="start">• Relay released on fault,</text>
<text x="648.0" y="358.0" class="ink" font-size="11" text-anchor="start">reset, no power</text>
<text x="648.0" y="372.0" class="ink" font-size="11" text-anchor="start">• MCU reset within 0.1 s of a</text>
<text x="648.0" y="386.0" class="ink" font-size="11" text-anchor="start">hang</text>
<text x="648.0" y="400.0" class="ink" font-size="11" text-anchor="start">• Vehicle bus never disturbed</text>
<text x="648.0" y="414.0" class="ink" font-size="11" text-anchor="start">by the item</text>
<rect x="636.0" y="438.0" width="230.0" height="300.0" rx="6" class="hB"/>
<text x="648.0" y="458.0" class="h" font-size="11" font-weight="700" text-anchor="start">ERROR STATES → FAILURE MODES</text>
<text x="648.0" y="476.0" class="ink" font-size="11" text-anchor="start">• Out-of-envelope frame passes</text>
<text x="648.0" y="490.0" class="ink" font-size="11" text-anchor="start">or is altered</text>
<text x="648.0" y="504.0" class="mut mono" font-size="10.5" text-anchor="start">   DFM-001, DFM-002, DFM-003,</text>
<text x="648.0" y="518.0" class="mut mono" font-size="10.5" text-anchor="start">   DFM-019</text>
<text x="648.0" y="532.0" class="ink" font-size="11" text-anchor="start">• Hang with relay energised;</text>
<text x="648.0" y="546.0" class="ink" font-size="11" text-anchor="start">no watchdog reset</text>
<text x="648.0" y="560.0" class="mut mono" font-size="10.5" text-anchor="start">   DFM-004, DFM-006</text>
<text x="648.0" y="574.0" class="ink" font-size="11" text-anchor="start">• Timeouts stretched by a</text>
<text x="648.0" y="588.0" class="ink" font-size="11" text-anchor="start">wrong time base</text>
<text x="648.0" y="602.0" class="mut mono" font-size="10.5" text-anchor="start">   DFM-005</text>
<text x="648.0" y="616.0" class="ink" font-size="11" text-anchor="start">• MCU keeps running in the</text>
<text x="648.0" y="630.0" class="ink" font-size="11" text-anchor="start">brown-out zone</text>
<text x="648.0" y="644.0" class="mut mono" font-size="10.5" text-anchor="start">   DFM-007</text>
<text x="648.0" y="658.0" class="ink" font-size="11" text-anchor="start">• Vehicle bus blocked or bus 0</text>
<text x="648.0" y="672.0" class="ink" font-size="11" text-anchor="start">RX lost</text>
<text x="648.0" y="686.0" class="mut mono" font-size="10.5" text-anchor="start">   DFM-008, DFM-009</text>
<text x="648.0" y="700.0" class="ink" font-size="11" text-anchor="start">• Relay stuck intercepting or</text>
<text x="648.0" y="714.0" class="ink" font-size="11" text-anchor="start">stuck released</text>
<text x="648.0" y="728.0" class="mut mono" font-size="10.5" text-anchor="start">   DFM-010, DFM-011</text>
<path d="M254.0 494.0 L300.0 494.0" class="ln" stroke-width="2"/><path d="M300.0 494.0 L293.6 496.7 L293.6 491.3 Z" class="ah"/>
<path d="M590.0 337.0 L636.0 337.0" class="ln" stroke-width="2"/><path d="M636.0 337.0 L629.6 339.7 L629.6 334.3 Z" class="ah"/>
<path d="M590.0 588.0 L636.0 588.0" class="ln" stroke-width="2"/><path d="M636.0 588.0 L629.6 590.7 L629.6 585.3 Z" class="ah"/>
<path d="M445.0 238.0 L445.0 250.0" class="ln" stroke-width="2"/><path d="M445.0 250.0 L442.3 243.6 L447.7 243.6 Z" class="ah"/>
<path d="M445.0 772.0 L445.0 738.0" class="ln" stroke-width="2"/><path d="M445.0 738.0 L447.7 744.4 L442.3 744.4 Z" class="ah"/>
<rect x="24.0" y="772.0" width="842.0" height="76.0" rx="6" class="surf"/>
<text x="36.0" y="792.0" class="acc" font-size="11" font-weight="700" text-anchor="start">CONTROL FACTORS (WHAT THE DESIGN SETS)</text>
<text x="36.0" y="810.0" class="ink" font-size="11" text-anchor="start">• IWDG1 window, ~90 ms (RLR 719, WINR 679)</text>
<text x="36.0" y="824.0" class="ink" font-size="11" text-anchor="start">• Relay open-drain; high or reset = released</text>
<text x="36.0" y="838.0" class="ink" font-size="11" text-anchor="start">• BOR level and PVD reaction (DC-07, open)</text>
<text x="451.0" y="810.0" class="ink" font-size="11" text-anchor="start">• Bootstub signature check at power-up</text>
<text x="451.0" y="824.0" class="ink" font-size="11" text-anchor="start">• TX hook envelope + XOR before FDCAN load</text>
<text x="451.0" y="838.0" class="ink" font-size="11" text-anchor="start">• CSS on HSE loss: NMI, then reset</text>
</svg>
