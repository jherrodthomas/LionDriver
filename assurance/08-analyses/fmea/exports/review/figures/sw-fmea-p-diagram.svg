<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 952" width="980" height="952" role="img">
<title>P-diagram: engagement and actuation authority</title>
<style>
.bg{fill:#fcfcfb}.dot{fill:#e7e6e0}.ink{fill:#0b0b0b}.mut{fill:#52514e}.acc{fill:#2a78d6}.surf{fill:#f3f2ee}.box{fill:#ffffff;stroke:#e1e0d9}
.in{fill:#eef4fc;stroke:#2a78d6}.out{fill:#f3f2ee;stroke:#e1e0d9}.bd{fill:none;stroke:#2a78d6;stroke-dasharray:6 4}.frame{fill:none;stroke:#e1e0d9}
.hS{fill:#fbe9e9}.h{fill:#9e2424}.mS{fill:#fff5dc}.m{fill:#7a5600}.lS{fill:#e6f5e6}.l{fill:#0a6a0a}
.hB{fill:#fbe9e9;stroke:#d03b3b}.lB{fill:#e6f5e6;stroke:#0ca30c}.nB{fill:#f1eefc;stroke:#6250d6}.n{fill:#6250d6}
.ln{stroke:#898781;fill:none}.data{stroke:#2a78d6;fill:none}.energy{stroke:#eb6834;fill:none;stroke-width:2.2}
.physical{stroke:#898781;fill:none;stroke-dasharray:5 3}.material{stroke:#008300;fill:none;stroke-dasharray:1.5 3}
.ah{fill:#898781}.lbl{fill:#fcfcfb}.lane{fill:#f3f2ee}.laneT{fill:#52514e}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.dot{fill:#262624}.ink{fill:#f2f1ec}.mut{fill:#b5b3ab}.acc{fill:#6aa5ec}.surf{fill:#242422}.box{fill:#242422;stroke:#3a3936}
.in{fill:#1b2a3d;stroke:#4f8fe0}.out{fill:#242422;stroke:#3a3936}.bd{stroke:#6aa5ec}.frame{stroke:#3a3936}
.hS{fill:#4a1f1f}.h{fill:#ffb3b3}.mS{fill:#43361a}.m{fill:#ffd98a}.lS{fill:#1d3a1d}.l{fill:#9fe09f}
.hB{fill:#4a1f1f;stroke:#d03b3b}.lB{fill:#1d3a1d;stroke:#0ca30c}.nB{fill:#2a2347;stroke:#8f80e8}.n{fill:#b0a6f0}
.ln{stroke:#8a8880}.data{stroke:#6aa5ec}.energy{stroke:#f08a5d}.physical{stroke:#8a8880}.material{stroke:#5cc45c}
.ah{fill:#8a8880}.lbl{fill:#1a1a19}.lane{fill:#242422}.laneT{fill:#b5b3ab}}
</style>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle class="dot" cx="1.2" cy="1.2" r="1.2"/></pattern></defs>
<rect class="bg" x="0" y="0" width="980" height="952" rx="12"/>
<rect x="0" y="0" width="980" height="952" rx="12" fill="url(#dots)"/>
<text x="24.0" y="30.0" class="ink" font-size="15" font-weight="600" text-anchor="start">P-diagram: engagement and actuation authority</text>
<rect x="26.0" y="50.0" width="176.0" height="146.0" rx="10" class="nB"/>
<text x="36.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Piece to piece</text>
<text x="36.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Reference build opted out</text>
<text x="36.0" y="102.0" class="ink" font-size="11" text-anchor="start">(flag empty)</text>
<text x="36.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Safety param and</text>
<text x="36.0" y="130.0" class="ink" font-size="11" text-anchor="start">CarParams per fingerprint</text>
<text x="36.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Learned torque params and</text>
<text x="36.0" y="158.0" class="ink" font-size="11" text-anchor="start">lateral delay</text>
<rect x="214.0" y="50.0" width="176.0" height="146.0" rx="10" class="nB"/>
<text x="224.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Change over time</text>
<text x="224.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Upstream</text>
<text x="224.0" y="102.0" class="ink" font-size="11" text-anchor="start">openpilot/opendbc syncs</text>
<text x="224.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Driving model (modeld)</text>
<text x="224.0" y="130.0" class="ink" font-size="11" text-anchor="start">updates</text>
<text x="224.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Drift of learned lateral</text>
<text x="224.0" y="158.0" class="ink" font-size="11" text-anchor="start">torque params</text>
<rect x="402.0" y="50.0" width="176.0" height="146.0" rx="10" class="nB"/>
<text x="412.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">Customer usage</text>
<text x="412.0" y="88.0" class="ink" font-size="11" text-anchor="start">• Engage/cancel patterns,</text>
<text x="412.0" y="102.0" class="ink" font-size="11" text-anchor="start">steering override</text>
<text x="412.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Developer toggles</text>
<text x="412.0" y="130.0" class="ink" font-size="11" text-anchor="start">(LateralManeuverMode)</text>
<text x="412.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Driver attention per</text>
<text x="412.0" y="158.0" class="ink" font-size="11" text-anchor="start">driverMonitoringState</text>
<rect x="590.0" y="50.0" width="176.0" height="146.0" rx="10" class="nB"/>
<text x="600.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">External environment</text>
<text x="600.0" y="88.0" class="ink" font-size="11" text-anchor="start">• SoC CPU load and memory</text>
<text x="600.0" y="102.0" class="ink" font-size="11" text-anchor="start">pressure</text>
<text x="600.0" y="116.0" class="ink" font-size="11" text-anchor="start">• Thermal throttling</text>
<text x="600.0" y="130.0" class="ink" font-size="11" text-anchor="start">(overheat event)</text>
<text x="600.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Message timing jitter on</text>
<text x="600.0" y="158.0" class="ink" font-size="11" text-anchor="start">msgq sockets</text>
<rect x="778.0" y="50.0" width="176.0" height="146.0" rx="10" class="nB"/>
<text x="788.0" y="69.0" class="n" font-size="12" font-weight="700" text-anchor="start">System interaction</text>
<text x="788.0" y="88.0" class="ink" font-size="11" text-anchor="start">• modeld output quality and</text>
<text x="788.0" y="102.0" class="ink" font-size="11" text-anchor="start">freshness</text>
<text x="788.0" y="116.0" class="ink" font-size="11" text-anchor="start">• SPI transfer errors and</text>
<text x="788.0" y="130.0" class="ink" font-size="11" text-anchor="start">retries</text>
<text x="788.0" y="144.0" class="ink" font-size="11" text-anchor="start">• Panda firmware version vs</text>
<text x="788.0" y="158.0" class="ink" font-size="11" text-anchor="start">reference build</text>
<text x="788.0" y="172.0" class="ink" font-size="11" text-anchor="start">• Stock EPS/PCM behaviour</text>
<text x="788.0" y="186.0" class="ink" font-size="11" text-anchor="start">and faults</text>
<text x="490.0" y="216.0" class="n" font-size="11" font-weight="700" text-anchor="middle">NOISE FACTORS</text>
<rect x="24.0" y="442.0" width="230.0" height="160.0" rx="10" class="box"/>
<text x="36.0" y="462.0" class="acc" font-size="11" font-weight="700" text-anchor="start">INPUTS</text>
<text x="36.0" y="480.0" class="ink" font-size="11" text-anchor="start">• Driver engagement (PCM</text>
<text x="36.0" y="494.0" class="ink" font-size="11" text-anchor="start">cruise, buttons)</text>
<text x="36.0" y="508.0" class="ink" font-size="11" text-anchor="start">• modelV2 path and</text>
<text x="36.0" y="522.0" class="ink" font-size="11" text-anchor="start">longitudinalPlan</text>
<text x="36.0" y="536.0" class="ink" font-size="11" text-anchor="start">• Vehicle CAN RX (brake, EPS</text>
<text x="36.0" y="550.0" class="ink" font-size="11" text-anchor="start">torque, gas)</text>
<text x="36.0" y="564.0" class="ink" font-size="11" text-anchor="start">• driverMonitoringState</text>
<text x="36.0" y="578.0" class="ink" font-size="11" text-anchor="start">• CarParams safety config</text>
<text x="36.0" y="592.0" class="ink" font-size="11" text-anchor="start">(TOYOTA, 73)</text>
<rect x="300.0" y="236.0" width="290.0" height="572.0" rx="10" class="in"/>
<text x="445.0" y="469.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">Safety-relevant software:</text>
<text x="445.0" y="486.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">engagement and actuation</text>
<text x="445.0" y="503.0" class="ink" font-size="14" font-weight="700" text-anchor="middle">authority</text>
<text x="316.0" y="528.0" class="mut" font-size="10.5" text-anchor="start">Functions covered:</text>
<text x="316.0" y="541.0" class="mut" font-size="10.5" text-anchor="start">SWF-FN-002, SWF-FN-004, SWF-FN-010,</text>
<text x="316.0" y="554.0" class="mut" font-size="10.5" text-anchor="start">SWF-FN-012, SWF-FN-020, SWF-FN-021,</text>
<text x="316.0" y="567.0" class="mut" font-size="10.5" text-anchor="start">SWF-FN-022, SWF-FN-031, SWF-FN-032,</text>
<text x="316.0" y="580.0" class="mut" font-size="10.5" text-anchor="start">SWF-FN-040, SWF-FN-041, SWF-FN-045</text>
<rect x="636.0" y="236.0" width="230.0" height="174.0" rx="10" class="lB"/>
<text x="648.0" y="256.0" class="l" font-size="11" font-weight="700" text-anchor="start">IDEAL FUNCTION (OUTPUTS)</text>
<text x="648.0" y="274.0" class="ink" font-size="11" text-anchor="start">• Torque and accel only within</text>
<text x="648.0" y="288.0" class="ink" font-size="11" text-anchor="start">envelope</text>
<text x="648.0" y="302.0" class="ink" font-size="11" text-anchor="start">• Authority only while</text>
<text x="648.0" y="316.0" class="ink" font-size="11" text-anchor="start">driver-engaged</text>
<text x="648.0" y="330.0" class="ink" font-size="11" text-anchor="start">• Disengage on brake, cancel</text>
<text x="648.0" y="344.0" class="ink" font-size="11" text-anchor="start">or fault</text>
<text x="648.0" y="358.0" class="ink" font-size="11" text-anchor="start">• Takeover alert, visual and</text>
<text x="648.0" y="372.0" class="ink" font-size="11" text-anchor="start">audible</text>
<text x="648.0" y="386.0" class="ink" font-size="11" text-anchor="start">• Panda running the intended</text>
<text x="648.0" y="400.0" class="ink" font-size="11" text-anchor="start">safety mode</text>
<rect x="636.0" y="424.0" width="230.0" height="384.0" rx="10" class="hB"/>
<text x="648.0" y="444.0" class="h" font-size="11" font-weight="700" text-anchor="start">ERROR STATES → FAILURE MODES</text>
<text x="648.0" y="462.0" class="ink" font-size="11" text-anchor="start">• Authority kept after</text>
<text x="648.0" y="476.0" class="ink" font-size="11" text-anchor="start">engagement should end</text>
<text x="648.0" y="490.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-014, SWF-020, SWF-021,</text>
<text x="648.0" y="504.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-031, SWF-033, SWF-036,</text>
<text x="648.0" y="518.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-040</text>
<text x="648.0" y="532.0" class="ink" font-size="11" text-anchor="start">• Engaged without driver</text>
<text x="648.0" y="546.0" class="ink" font-size="11" text-anchor="start">intent</text>
<text x="648.0" y="560.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-007, SWF-030, SWF-039,</text>
<text x="648.0" y="574.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-048, SWF-054, SWF-055</text>
<text x="648.0" y="588.0" class="ink" font-size="11" text-anchor="start">• Wrong or permissive safety</text>
<text x="648.0" y="602.0" class="ink" font-size="11" text-anchor="start">mode in panda</text>
<text x="648.0" y="616.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-013, SWF-015, SWF-022,</text>
<text x="648.0" y="630.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-028, SWF-034</text>
<text x="648.0" y="644.0" class="ink" font-size="11" text-anchor="start">• Stale or corrupt command</text>
<text x="648.0" y="658.0" class="ink" font-size="11" text-anchor="start">reaches the vehicle</text>
<text x="648.0" y="672.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-023, SWF-026, SWF-043,</text>
<text x="648.0" y="686.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-045, SWF-047</text>
<text x="648.0" y="700.0" class="ink" font-size="11" text-anchor="start">• Torque or accel outside the</text>
<text x="648.0" y="714.0" class="ink" font-size="11" text-anchor="start">envelope sent</text>
<text x="648.0" y="728.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-001, SWF-003, SWF-016,</text>
<text x="648.0" y="742.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-041, SWF-042, SWF-052</text>
<text x="648.0" y="756.0" class="ink" font-size="11" text-anchor="start">• Fault without disable or</text>
<text x="648.0" y="770.0" class="ink" font-size="11" text-anchor="start">takeover alert</text>
<text x="648.0" y="784.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-032, SWF-035, SWF-037,</text>
<text x="648.0" y="798.0" class="mut mono" font-size="10.5" text-anchor="start">   SWF-050</text>
<path d="M254.0 522.0 L300.0 522.0" class="ln" stroke-width="2"/><path d="M300.0 522.0 L293.6 524.7 L293.6 519.3 Z" class="ah"/>
<path d="M590.0 323.0 L636.0 323.0" class="ln" stroke-width="2"/><path d="M636.0 323.0 L629.6 325.7 L629.6 320.3 Z" class="ah"/>
<path d="M590.0 616.0 L636.0 616.0" class="ln" stroke-width="2"/><path d="M636.0 616.0 L629.6 618.7 L629.6 613.3 Z" class="ah"/>
<path d="M445.0 224.0 L445.0 236.0" class="ln" stroke-width="2"/><path d="M445.0 236.0 L442.3 229.6 L447.7 229.6 Z" class="ah"/>
<path d="M445.0 842.0 L445.0 808.0" class="ln" stroke-width="2"/><path d="M445.0 808.0 L447.7 814.4 L442.3 814.4 Z" class="ah"/>
<rect x="24.0" y="842.0" width="842.0" height="90.0" rx="10" class="surf"/>
<text x="36.0" y="862.0" class="acc" font-size="11" font-weight="700" text-anchor="start">CONTROL FACTORS (WHAT THE DESIGN SETS)</text>
<text x="36.0" y="880.0" class="ink" font-size="11" text-anchor="start">• Heartbeat 0xf3 + engaged flag, 0.3 s revoke</text>
<text x="36.0" y="894.0" class="ink" font-size="11" text-anchor="start">• TX whitelist and Toyota TX checks</text>
<text x="36.0" y="908.0" class="ink" font-size="11" text-anchor="start">• controls_allowed gated on PCM rising edge</text>
<text x="36.0" y="922.0" class="ink" font-size="11" text-anchor="start">• ControlsMismatch 2 samples, 0.5 s, grace</text>
<text x="451.0" y="880.0" class="ink" font-size="11" text-anchor="start">• Stale-input checks (inputs_fresh, age &lt; 1 s)</text>
<text x="451.0" y="894.0" class="ink" font-size="11" text-anchor="start">• TX arrival 50/100 ms, TX rate budget</text>
<text x="451.0" y="908.0" class="ink" font-size="11" text-anchor="start">• Firmware torque and accel limit checks</text>
</svg>
