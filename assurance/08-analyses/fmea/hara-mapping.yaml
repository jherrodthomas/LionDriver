# Mapping of the second-set HARA (analyses/hara.yaml, LD-HARA-001 rev 0.3) onto WP-C-03, the HARA of record
# (docs-safety-reconciliation.md §7 OI-5, §8). The FMEA data cites second-set hazard IDs (HZ-xxx) in its effects; this file
# carries those links to WP-C-03 hazards (H-0n), hazardous events (HE-0n.m) and safety goals (SG-0n).
# Checked by tools/safety/fmea_lint.py: every second-set hazard and goal is mapped, every WP-C-03 ID exists in WP-C-03, both
# ASILs match their sources, and `agreement` matches the comparison.
#   agreement: same            - same ASIL
#              second_higher   - the second set rates higher; the cause is a reconciliation decision (`decision`)
#              wp_c03_higher   - WP-C-03 covers it inside a goal with a higher ASIL
#              no_counterpart  - WP-C-03 has no safety goal for it; the reason is a reconciliation decision
schema_version: 1
target: assurance/02-concept/WP-C-03-hara.md

