<title id="t">SG-03 fault tree, sheet 3: phone view</title>
<desc id="d">SG-03 fault tree (ASIL C), sheet 3 of 6 as an outline: G3.3 (AND); G3.3.1 (OR); BE-1.12; BE-1.13; BE-1.14; BE-1.25; BE-3.09; BE-3.10; BE-3.13.</desc>
<style>
svg { --bg:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --mute:#898781; --line:#c9c7bf; --grid:#e1e0d9; --soft:#f3f2ee;
