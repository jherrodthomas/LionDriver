<svg xmlns="http://www.w3.org/2000/svg" width="640" height="819" viewBox="0 0 640 819" role="img" aria-labelledby="t d">
<title id="t">SG-03 fault tree, sheet 3: phone view</title>
<desc id="d">SG-03 fault tree (ASIL C), sheet 3 of 6 as an outline: G3.3 (AND); G3.3.1 (OR); BE-1.12; BE-1.13; BE-1.14; BE-1.25; BE-3.09; BE-3.10; BE-3.13.</desc>
<style>
svg { --bg:#ffffff; --ink:#16202b; --ink2:#5b6876; --line:#d5dbe2; --rail:#aab3c0; --hot:#c62828; --hot-bg:#fdecec;
      --or:#2f6fb5; --and:#7a4fc4; --soft:#eef1f5; --ue:#7a5600; --ue-bg:#fff5dc; --sheet:#16202b; --sheet-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
