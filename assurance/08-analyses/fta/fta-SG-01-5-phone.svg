<circle cx="64.0" cy="222.0" r="9.5" fill="var(--basic)"/>
<text x="82" y="227.0" class="pid">BE-1.12</text>
<text x="152" y="227.0" class="t">Corrupted/replayed 0x1D2 creates false cruise rising edge with</text>
<text x="152" y="245.0" class="t">valid 8-bit checksum (no counter, GAP-01)</text>
<rect x="152.0" y="255.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="268.0" class="pc" fill="var(--ink2)">SWF-007</text>
<line x1="152" y1="283.0" x2="624" y2="283.0" class="rule"/>
<circle cx="64.0" cy="299.0" r="9.5" fill="var(--basic)"/>
<text x="82" y="304.0" class="pid">BE-1.13</text>
<text x="152" y="304.0" class="t">Panda RX path delivers stale/stuck cruise frame to both envelope</text>
<text x="152" y="322.0" class="t">and SoC (single RX path; CCF → DFI-10)</text>
<rect x="152.0" y="332.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="345.0" class="pc" fill="var(--ink2)">SWF-006</text>
<line x1="152" y1="360.0" x2="624" y2="360.0" class="rule"/>
