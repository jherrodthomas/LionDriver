<rect x="260.8" y="735.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="267.8" y="748.0" class="pc" style="fill:var(--ink2)">SFM-013</text>
<rect x="324.2" y="735.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="331.2" y="748.0" class="pc" style="fill:var(--ink2)">SWF-030</text>
<rect x="387.6" y="735.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="394.6" y="748.0" class="pc" style="fill:var(--ink2)">SWF-057</text>
