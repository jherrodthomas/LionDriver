<svg xmlns="http://www.w3.org/2000/svg" width="640" height="779" viewBox="0 0 640 779" role="img" aria-labelledby="t d">
<title id="t">SG-01 fault tree, sheet 5: phone view</title>
<desc id="d">SG-01 fault tree (ASIL C), sheet 5 of 6 as an outline: G1.2.1 (AND); G1.2.1.a (OR); BE-1.12; BE-1.13; BE-1.14; BE-1.25; BE-1.08; BE-1.09; BE-1.15.</desc>
<style>
svg { --bg:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --mute:#898781; --line:#c9c7bf; --grid:#e1e0d9; --soft:#f3f2ee;
      --or:#2a78d6; --and:#6250d6; --basic:#1baf7a; --ue:#eda100; --hot:#d03b3b; --chipink:#ffffff;
      --s1b:#fbe9e9; --s1f:#9e2424; --s2b:#fdeee6; --s2f:#9a4a25;
      --s3b:#fff5dc; --s3f:#7a5600; --s4b:#e6f5e6; --s4f:#0a6a0a; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#1a1a19; --card:#242422; --ink:#f2f1ec; --ink2:#b5b3ab; --mute:#8a8880; --line:#55534e; --grid:#3a3936;
