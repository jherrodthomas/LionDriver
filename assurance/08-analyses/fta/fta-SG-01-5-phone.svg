<text x="82" y="381.0" class="pid">BE-1.14</text>
<text x="152" y="381.0" class="t">MCU fault sets controls_allowed (BE-1.07 class)</text>
<rect x="152.0" y="391.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="404.0" class="pc" fill="var(--ink2)">DFM-003</text>
<rect x="215.4" y="391.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="222.4" y="404.0" class="pc" fill="var(--ink2)">FMD-009</text>
<line x1="152" y1="419.0" x2="624" y2="419.0" class="rule"/>
<circle cx="64.0" cy="435.0" r="9.5" fill="var(--basic)"/>
<text x="82" y="440.0" class="pid">BE-1.25</text>
<text x="152" y="440.0" class="t">Envelope software defect in the not-allowed torque check or the</text>
<text x="152" y="458.0" class="t">controls_allowed bookkeeping (lateral.h:111-114), e.g. a cruise</text>
<text x="152" y="476.0" class="t">edge refused for MAIN_ON = 0 left the engagement window open</text>
<text x="152" y="494.0" class="t">(SM-F1, SWF-089; reference build fixed at BL-006, opendbc#17)</text>
<rect x="152.0" y="504.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="517.0" class="pc" fill="var(--ink2)">SWF-002</text>
<rect x="215.4" y="504.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="222.4" y="517.0" class="pc" fill="var(--ink2)">SWF-055</text>
<rect x="278.8" y="504.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="285.8" y="517.0" class="pc" fill="var(--ink2)">SWF-089</text>
<line x1="152" y1="532.0" x2="624" y2="532.0" class="rule"/>
<circle cx="64.0" cy="548.0" r="9.5" fill="var(--basic)"/>
<text x="82" y="553.0" class="pid">BE-1.08</text>
<text x="152" y="553.0" class="t">Safety mode/param changed by SoC (0xdc, GAP-09) [FFI → FFI-CM-06;</text>
<text x="152" y="571.0" class="t">CCF → DFI-13: same SoC fault can cause G-SoC and BE-1.08]</text>
<rect x="152.0" y="581.0" width="63.6" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="159.0" y="594.0" class="pc" fill="var(--ink2)">repeated</text>
<rect x="221.6" y="581.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="228.6" y="594.0" class="pc" fill="var(--ink2)">SWF-013</text>
<rect x="285.0" y="581.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="292.0" y="594.0" class="pc" fill="var(--ink2)">SWF-022</text>
<line x1="152" y1="609.0" x2="624" y2="609.0" class="rule"/>
