<text x="16" y="34" class="h">SG-01 fault tree · sheet 5 of 6</text>
<text x="16" y="56" class="t2">ASIL C · phone view of fta-SG-01-5.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
