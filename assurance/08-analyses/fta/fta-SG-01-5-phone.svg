<path d="M127.0,123.5 L132.0,132.0 H122.0 Z" fill="var(--s2f)"/>
<text x="135.0" y="132.0" class="ps" fill="var(--s2f)">2 faults</text>
<text x="194.8" y="132.0" class="t2">6 cut sets</text>
<rect x="264.8" y="119.0" width="88.4" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="271.8" y="132.0" class="pc" fill="var(--ink2)">from sheet 3</text>
