<rect x="324.2" y="735.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="331.2" y="748.0" class="pc" fill="var(--ink2)">SWF-030</text>
<rect x="387.6" y="735.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="394.6" y="748.0" class="pc" fill="var(--ink2)">SWF-057</text>
