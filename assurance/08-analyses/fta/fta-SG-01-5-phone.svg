<text x="16" y="34" class="h">SG-01 fault tree · sheet 5 of 6</text>
<text x="16" y="56" class="t2">ASIL C · phone view of fta-SG-01-5.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="3" style="fill:var(--and);stroke:var(--ink);stroke-width:0"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">AND</text>
<text x="46" y="109.0" class="pid">G1.2.1</text>
<text x="116" y="109.0" class="t">Authority falsely granted AND SoC commands torque</text>
<rect x="116.0" y="119.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="123.0" y="132.0" class="pc" style="fill:var(--ink2)">fewest item faults 2 · 6 cut sets</text>
<rect x="340.6" y="119.0" width="88.4" height="18" rx="9" style="fill:var(--soft)"/><text x="347.6" y="132.0" class="pc" style="fill:var(--ink2)">from sheet 3</text>
<line x1="116" y1="147.0" x2="624" y2="147.0" class="rule"/>
<rect x="34.0" y="153.0" width="24" height="20" rx="3" style="fill:var(--or);stroke:var(--ink);stroke-width:0"/><text x="46.0" y="166.0" class="gl" text-anchor="middle">OR</text>
<text x="64" y="168.0" class="pid">G1.2.1.a</text>
<text x="134" y="168.0" class="t">False authority</text>
<rect x="134.0" y="178.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="191.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 6 cut sets</text>
<line x1="134" y1="206.0" x2="624" y2="206.0" class="rule"/>
<circle cx="64.0" cy="222.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="227.0" class="pid">BE-1.12</text>
<text x="152" y="227.0" class="t">Corrupted/replayed 0x1D2 creates false cruise rising edge with</text>
<text x="152" y="245.0" class="t">valid 8-bit checksum (no counter, GAP-01)</text>
<rect x="152.0" y="255.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="268.0" class="pc" style="fill:var(--ink2)">SWF-007</text>
<line x1="152" y1="283.0" x2="624" y2="283.0" class="rule"/>
<circle cx="64.0" cy="299.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="304.0" class="pid">BE-1.13</text>
<text x="152" y="304.0" class="t">Panda RX path delivers stale/stuck cruise frame to both envelope</text>
<text x="152" y="322.0" class="t">and SoC (single RX path; CCF → DFI-10)</text>
<rect x="152.0" y="332.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="345.0" class="pc" style="fill:var(--ink2)">SWF-006</text>
<line x1="152" y1="360.0" x2="624" y2="360.0" class="rule"/>
<circle cx="64.0" cy="376.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="381.0" class="pid">BE-1.14</text>
<text x="152" y="381.0" class="t">MCU fault sets controls_allowed (BE-1.07 class)</text>
<rect x="152.0" y="391.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="404.0" class="pc" style="fill:var(--ink2)">DFM-003</text>
<rect x="215.4" y="391.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="222.4" y="404.0" class="pc" style="fill:var(--ink2)">FMD-009</text>
<line x1="152" y1="419.0" x2="624" y2="419.0" class="rule"/>
<circle cx="64.0" cy="435.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="440.0" class="pid">BE-1.25</text>
<text x="152" y="440.0" class="t">Envelope software defect in the not-allowed torque check or the</text>
<text x="152" y="458.0" class="t">controls_allowed bookkeeping (lateral.h:111-114), e.g. a cruise</text>
<text x="152" y="476.0" class="t">edge refused for MAIN_ON = 0 left the engagement window open</text>
<text x="152" y="494.0" class="t">(SM-F1, SWF-089; reference build fixed at BL-006, opendbc#17)</text>
<rect x="152.0" y="504.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="517.0" class="pc" style="fill:var(--ink2)">SWF-002</text>
<rect x="215.4" y="504.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="222.4" y="517.0" class="pc" style="fill:var(--ink2)">SWF-055</text>
<rect x="278.8" y="504.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="285.8" y="517.0" class="pc" style="fill:var(--ink2)">SWF-089</text>
<line x1="152" y1="532.0" x2="624" y2="532.0" class="rule"/>
<circle cx="64.0" cy="548.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="553.0" class="pid">BE-1.08</text>
<text x="152" y="553.0" class="t">Safety mode/param changed by SoC (0xdc, GAP-09) [FFI → FFI-CM-06;</text>
<text x="152" y="571.0" class="t">CCF → DFI-13: same SoC fault can cause G-SoC and BE-1.08]</text>
<rect x="152.0" y="581.0" width="63.6" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="594.0" class="pc" style="fill:var(--ink2)">repeated</text>
<rect x="221.6" y="581.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="228.6" y="594.0" class="pc" style="fill:var(--ink2)">SWF-013</text>
<rect x="285.0" y="581.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="292.0" y="594.0" class="pc" style="fill:var(--ink2)">SWF-022</text>
<line x1="152" y1="609.0" x2="624" y2="609.0" class="rule"/>
<circle cx="64.0" cy="625.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="630.0" class="pid">BE-1.09</text>
<text x="152" y="630.0" class="t">Envelope firmware replaced via boot pins / softloader (GAP-38,</text>
<text x="152" y="648.0" class="t">GAP-24) [FFI → FFI-CM-12; CCF → DFI-13]</text>
<rect x="152.0" y="658.0" width="63.6" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="671.0" class="pc" style="fill:var(--ink2)">repeated</text>
<rect x="221.6" y="658.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="228.6" y="671.0" class="pc" style="fill:var(--ink2)">SWF-028</text>
<rect x="285.0" y="658.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="292.0" y="671.0" class="pc" style="fill:var(--ink2)">PFM-001</text>
<rect x="348.4" y="658.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="355.4" y="671.0" class="pc" style="fill:var(--ink2)">DFM-016</text>
<rect x="411.8" y="658.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="418.8" y="671.0" class="pc" style="fill:var(--ink2)">PFM-002</text>
<rect x="475.2" y="658.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="482.2" y="671.0" class="pc" style="fill:var(--ink2)">SWF-084</text>
<line x1="152" y1="686.0" x2="624" y2="686.0" class="rule"/>
<circle cx="46.0" cy="702.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="64" y="707.0" class="pid">BE-1.15</text>
<text x="134" y="707.0" class="t">SoC commands non-zero torque (normally gated by its own engagement</text>
<text x="134" y="725.0" class="t">state, which is fed by the same CAN data — CCF → DFI-10)</text>
<rect x="134.0" y="735.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="748.0" class="pc" style="fill:var(--ink2)">SFM-001</text>
