<text x="82" y="630.0" class="pid">BE-1.09</text>
<text x="152" y="630.0" class="t">Envelope firmware replaced via boot pins / softloader (GAP-38,</text>
<text x="152" y="648.0" class="t">GAP-24) [FFI → FFI-CM-12; CCF → DFI-13]</text>
<rect x="152.0" y="658.0" width="63.6" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="159.0" y="671.0" class="pc" fill="var(--ink2)">repeated</text>
<rect x="221.6" y="658.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="228.6" y="671.0" class="pc" fill="var(--ink2)">SWF-028</text>
<rect x="285.0" y="658.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="292.0" y="671.0" class="pc" fill="var(--ink2)">PFM-001</text>
<rect x="348.4" y="658.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="355.4" y="671.0" class="pc" fill="var(--ink2)">DFM-016</text>
<rect x="411.8" y="658.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="418.8" y="671.0" class="pc" fill="var(--ink2)">PFM-002</text>
<rect x="475.2" y="658.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="482.2" y="671.0" class="pc" fill="var(--ink2)">SWF-084</text>
<line x1="152" y1="686.0" x2="624" y2="686.0" class="rule"/>
<circle cx="46.0" cy="702.0" r="9.5" fill="var(--basic)"/>
<text x="64" y="707.0" class="pid">BE-1.15</text>
<text x="134" y="707.0" class="t">SoC commands non-zero torque (normally gated by its own engagement</text>
<text x="134" y="725.0" class="t">state, which is fed by the same CAN data — CCF → DFI-10)</text>
