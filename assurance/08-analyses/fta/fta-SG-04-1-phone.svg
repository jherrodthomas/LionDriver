<title id="t">SG-04 fault tree, sheet 1: phone view</title>
<desc id="d">SG-04 fault tree (ASIL B), sheet 1 of 9 as an outline: TE-04 (OR), single-point path; G4.1 (AND), single-point path; G4.2 (AND); G4.3 (AND); G4.4 (AND); G4.5 (AND), single-point path; G4.6 (AND); G4.7 (AND), single-point path; BE-4.14, single-point path; UE-4.15; G4.8 (AND); G4.9 (OR), single-point path.</desc>
