<title id="t">SG-08 fault tree, sheet 2: phone view</title>
<desc id="d">SG-08 fault tree (ASIL A), sheet 2 of 2 as an outline: G8.1 (OR), single-point path; BE-8.01, single-point path; BE-8.02, single-point path; G8.1.1 (AND); BE-8.03; G8.1.2 (OR); BE-8.04; BE-8.05; BE-8.06, single-point path.</desc>
