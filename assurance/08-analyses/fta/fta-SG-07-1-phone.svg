<text x="64" y="576.0" class="pid">G7.6</text>
<text x="134" y="576.0" class="t">Item disturbs the stock ADAS ECU by diagnostics</text>
<rect x="134.0" y="586.0" width="212.4" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="599.0" class="pc" style="fill:var(--ink2)">fewest item faults 2 · 1 cut set</text>
