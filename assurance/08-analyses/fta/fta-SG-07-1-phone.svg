<text x="152" y="880.0" class="t">missing or defective; opendbc caps 0x343 at 0 from the first</text>
<text x="152" y="898.0" class="t">frame)</text>
<rect x="152.0" y="908.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="921.0" class="pc" style="fill:var(--ink2)">SFM-036</text>
<rect x="215.4" y="908.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="222.4" y="921.0" class="pc" style="fill:var(--ink2)">SWF-093</text>
