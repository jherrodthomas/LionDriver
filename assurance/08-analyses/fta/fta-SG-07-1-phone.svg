<text x="46" y="109.0" class="pidhot">TE-07</text>
<text x="116" y="109.0" class="t">Stock PCS/AEB suppressed, delayed or altered</text>
<rect x="116.0" y="119.0" width="224.8" height="18" rx="9" style="fill:var(--soft)"/><text x="123.0" y="132.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 17 cut sets</text>
