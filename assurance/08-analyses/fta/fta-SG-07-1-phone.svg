<rect x="152.0" y="754.0" width="69.8" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="767.0" class="pc" style="fill:var(--ink2)">FFI-CM-09</text>
<rect x="227.8" y="754.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="234.8" y="767.0" class="pc" style="fill:var(--ink2)">SWF-015</text>
<line x1="152" y1="782.0" x2="624" y2="782.0" class="rule"/>
