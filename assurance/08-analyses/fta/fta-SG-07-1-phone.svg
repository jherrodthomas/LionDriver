<text x="152" y="322.0" class="t">reference build (TSR-705; 0x411 kept in other builds)</text>
<rect x="152.0" y="332.0" width="100.8" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="345.0" class="pc" style="fill:var(--ink2)">latent, design</text>
<rect x="258.8" y="332.0" width="57.4" height="18" rx="9" style="fill:var(--hot-bg)"/><text x="265.8" y="345.0" class="pc" style="fill:var(--hot)">no FMEA</text>
<line x1="152" y1="360.0" x2="624" y2="360.0" class="rule"/>
<circle cx="64.0" cy="376.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="381.0" class="pid">BE-7.08</text>
<text x="152" y="381.0" class="t">SoC sends such a frame (QM fault or compromise)</text>
<rect x="152.0" y="391.0" width="69.8" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="404.0" class="pc" style="fill:var(--ink2)">FFI-CM-05</text>
<rect x="227.8" y="391.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="234.8" y="404.0" class="pc" style="fill:var(--ink2)">SFM-035</text>
<line x1="152" y1="419.0" x2="624" y2="419.0" class="rule"/>
