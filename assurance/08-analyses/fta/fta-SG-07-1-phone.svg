<text x="82" y="635.0" class="pid">BE-7.20</text>
<text x="152" y="635.0" class="t">(diagnostic TX hook passes any ISO 15765 frame; as SG-07)</text>
<text x="152" y="651.0" class="ti">Diagnostic (ELM327 or pre-engagement) TX hook passes any ISO 15765</text>
<text x="152" y="667.0" class="ti">frame, with no service, ignition or motion condition</text>
<rect x="152.0" y="677.0" width="100.8" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="690.0" class="pc" style="fill:var(--ink2)">latent, design</text>
<rect x="258.8" y="677.0" width="107.0" height="18" rx="9" style="fill:var(--soft)"/><text x="265.8" y="690.0" class="pc" style="fill:var(--ink2)">repeated, SG-02</text>
<line x1="152" y1="705.0" x2="624" y2="705.0" class="rule"/>
<circle cx="64.0" cy="721.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="726.0" class="pid">BE-7.21</text>
<text x="152" y="726.0" class="t">SoC sends a diagnostic request that resets or opens a session on</text>
