<text x="64" y="440.0" class="pid">G7.3</text>
<text x="134" y="440.0" class="t">Intercept switches held in intercept while forwarding is not running</text>
<rect x="134.0" y="450.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="463.0" class="pc" style="fill:var(--ink2)">fewest item faults 2 · 3 cut sets</text>
<rect x="358.6" y="450.0" width="150.4" height="18" rx="9" style="fill:var(--sheet)"/><text x="365.6" y="463.0" class="pc" style="fill:var(--sheet-ink)">continued on sheet 4 ▸</text>
<rect x="515.0" y="450.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="522.0" y="463.0" class="pc" style="fill:var(--ink2)">SFM-034</text>
<line x1="134" y1="478.0" x2="624" y2="478.0" class="rule"/>
<rect x="34.0" y="484.0" width="24" height="20" rx="3" style="fill:var(--or);stroke:var(--hot);stroke-width:2"/><text x="46.0" y="497.0" class="gl" text-anchor="middle">▸</text>
<text x="64" y="499.0" class="pidhot">G7.4</text>
<text x="134" y="499.0" class="t">Stock path cut or a vehicle bus blocked in the harness or at the car</text>
<text x="134" y="517.0" class="t">side</text>
<rect x="134.0" y="527.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="540.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 5 cut sets</text>
<rect x="358.6" y="527.0" width="150.4" height="18" rx="9" style="fill:var(--sheet)"/><text x="365.6" y="540.0" class="pc" style="fill:var(--sheet-ink)">continued on sheet 3 ▸</text>
