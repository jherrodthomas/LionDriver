<svg xmlns="http://www.w3.org/2000/svg" width="640" height="376" viewBox="0 0 640 376" role="img" aria-labelledby="t d">
<title id="t">SG-03 fault tree, sheet 4: phone view</title>
<desc id="d">SG-03 fault tree (ASIL C), sheet 4 of 6 as an outline: G3.6 (AND); BE-4.17; BE-3.03; UE-3.05.</desc>
<style>
svg { --bg:#ffffff; --ink:#16202b; --ink2:#5b6876; --line:#d5dbe2; --rail:#aab3c0; --hot:#c62828; --hot-bg:#fdecec;
      --or:#2f6fb5; --and:#7a4fc4; --soft:#eef1f5; --ue:#7a5600; --ue-bg:#fff5dc; --sheet:#16202b; --sheet-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d25; --ink:#e4eaf0; --ink2:#94a2b1; --line:#2a3440; --rail:#4a5665; --hot:#ff8f86; --hot-bg:#431b19;
        --or:#7fb0ec; --and:#b9a0f0; --soft:#1f2731; --ue:#f0cf6a; --ue-bg:#3a3214; --sheet:#e4eaf0; --sheet-ink:#161d25; }
}
.bg { fill:var(--bg); } .t { font:14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.t2 { font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.ti { font:italic 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.pid { font:600 13px ui-monospace,Menlo,Consolas,monospace; fill:var(--ink); } .pidhot { font:600 13px ui-monospace,Menlo,Consolas,monospace; fill:var(--hot); }
.gl { font:700 8px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--bg); }
.pc { font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
.rule { stroke:var(--line); stroke-width:1; } .rail { stroke:var(--rail); stroke-width:1.2; fill:none; }
.railhot { stroke:var(--hot); stroke-width:2; fill:none; }
</style>
<rect class="bg" width="640" height="376"/>
<path d="M28.0,115.0 V163.0 H33.0" class="rail"/>
<path d="M28.0,115.0 V240.0 H33.0" class="rail"/>
<path d="M28.0,115.0 V317.0 H33.0" class="rail"/>
<text x="16" y="34" class="h">SG-03 fault tree · sheet 4 of 6</text>
<text x="16" y="56" class="t2">ASIL C · phone view of fta-SG-03-4.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="3" style="fill:var(--and);stroke:var(--ink);stroke-width:0"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">AND</text>
<text x="46" y="109.0" class="pid">G3.6</text>
<text x="116" y="109.0" class="t">Acceleration step within the bound</text>
<rect x="116.0" y="119.0" width="212.4" height="18" rx="9" style="fill:var(--soft)"/><text x="123.0" y="132.0" class="pc" style="fill:var(--ink2)">fewest item faults 2 · 1 cut set</text>
<rect x="334.4" y="119.0" width="88.4" height="18" rx="9" style="fill:var(--soft)"/><text x="341.4" y="132.0" class="pc" style="fill:var(--ink2)">from sheet 1</text>
<line x1="116" y1="147.0" x2="624" y2="147.0" class="rule"/>
<circle cx="46.0" cy="163.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="64" y="168.0" class="pid">BE-4.17</text>
<text x="134" y="168.0" class="t">Host sends a step: the CarController jerk limit is applied before</text>
<text x="134" y="186.0" class="t">pitch compensation and the PID (carcontroller.py:197-238)</text>
<rect x="134.0" y="196.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="209.0" class="pc" style="fill:var(--ink2)">SWF-046</text>
<rect x="197.4" y="196.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="204.4" y="209.0" class="pc" style="fill:var(--ink2)">SWF-066</text>
<line x1="134" y1="224.0" x2="624" y2="224.0" class="rule"/>
<circle cx="46.0" cy="240.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="64" y="245.0" class="pid">BE-3.03</text>
<text x="134" y="245.0" class="t">No jerk limit in envelope: step to +2.0 m/s² allowed (GAP-04,</text>
<text x="134" y="263.0" class="t">FSR-03.03 not implemented)</text>
<rect x="134.0" y="273.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="286.0" class="pc" style="fill:var(--ink2)">SWF-004</text>
<line x1="134" y1="301.0" x2="624" y2="301.0" class="rule"/>
<path d="M46.0,306.0 l11,11 l-11,11 l-11,-11 z" style="fill:var(--ue-bg);stroke:var(--ink);stroke-width:1.5"/>
<text x="64" y="322.0" class="pid">UE-3.05</text>
<text x="134" y="322.0" class="t">PCM executes request without its own bound (AOU-05R fails)</text>
<rect x="134.0" y="332.0" width="63.6" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="345.0" class="pc" style="fill:var(--ink2)">repeated</text>
<line x1="134" y1="360.0" x2="624" y2="360.0" class="rule"/>
</svg>
