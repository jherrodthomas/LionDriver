<text x="16" y="34" class="h">SG-07 fault tree · sheet 3 of 4</text>
<text x="16" y="56" class="t2">ASIL B · phone view of fta-SG-07-3.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="3" style="fill:var(--or);stroke:var(--hot);stroke-width:2"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">OR</text>
<text x="46" y="109.0" class="pidhot">G7.4</text>
<text x="116" y="109.0" class="t">Stock path cut or a vehicle bus blocked in the harness or at the car</text>
<text x="116" y="127.0" class="t">side</text>
<rect x="116.0" y="137.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="123.0" y="150.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 5 cut sets</text>
<rect x="340.6" y="137.0" width="88.4" height="18" rx="9" style="fill:var(--soft)"/><text x="347.6" y="150.0" class="pc" style="fill:var(--ink2)">from sheet 1</text>
<line x1="116" y1="165.0" x2="624" y2="165.0" class="rule"/>
