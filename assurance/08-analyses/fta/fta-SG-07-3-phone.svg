<text x="134" y="281.0" class="t">box, DQ-209 A; RR-2026-010 F-01)</text>
<rect x="134.0" y="291.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="141.0" y="304.0" class="pc" fill="var(--ink2)">DFM-013</text>
<rect x="197.4" y="291.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="204.4" y="304.0" class="pc" fill="var(--ink2)">FMD-022</text>
<rect x="260.8" y="291.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="267.8" y="304.0" class="pc" fill="var(--ink2)">FMD-023</text>
<line x1="134" y1="319.0" x2="624" y2="319.0" class="rule"/>
<circle cx="46.0" cy="335.0" r="9.5" fill="var(--basic)" stroke="var(--hot)" stroke-width="2.4"/>
<text x="64" y="340.0" class="pidhot">BE-7.17</text>
<text x="134" y="340.0" class="t">Harness box loses its supply while the car is on: U1/U2 unpowered,</text>
<text x="134" y="358.0" class="t">pass-through not guaranteed, D2/D3 clamp CAN0/CAN2 to the dead rail</text>
<text x="134" y="376.0" class="t">(derived from the v3 drawing; bench test VS-HW-22, DQ-209 A;</text>
<text x="134" y="394.0" class="t">RR-2026-010 F-02)</text>
<rect x="134.0" y="404.0" width="51.2" height="18" rx="4" fill="var(--s1b)"/><text x="141.0" y="417.0" class="pc" fill="var(--s1f)">SPF-15</text>
<rect x="191.2" y="404.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="198.2" y="417.0" class="pc" fill="var(--ink2)">DFM-020</text>
<rect x="254.6" y="404.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="261.6" y="417.0" class="pc" fill="var(--ink2)">FMD-030</text>
<rect x="318.0" y="404.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="325.0" y="417.0" class="pc" fill="var(--ink2)">FMD-031</text>
<line x1="134" y1="432.0" x2="624" y2="432.0" class="rule"/>
<circle cx="46.0" cy="448.0" r="9.5" fill="var(--basic)" stroke="var(--hot)" stroke-width="2.4"/>
<text x="64" y="453.0" class="pidhot">BE-7.18</text>
<text x="134" y="453.0" class="t">Clamp diode D2 or D3 short or leaky: loads or grounds a vehicle bus</text>
<text x="134" y="471.0" class="t">in either switch state (RR-2026-010 F-07)</text>
<rect x="134.0" y="481.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="141.0" y="494.0" class="pc" fill="var(--ink2)">DFM-021</text>
<rect x="197.4" y="481.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="204.4" y="494.0" class="pc" fill="var(--ink2)">FMD-033</text>
