<title id="t">SG-07 fault tree, sheet 2: phone view</title>
<desc id="d">SG-07 fault tree (ASIL B), sheet 2 of 4 as an outline: G7.1 (OR), single-point path; BE-7.01, single-point path; BE-7.02, single-point path; BE-7.03, single-point path; BE-7.04, single-point path; BE-7.05, single-point path; BE-7.06, single-point path.</desc>
<style>
