<svg xmlns="http://www.w3.org/2000/svg" width="640" height="587" viewBox="0 0 640 587" role="img" aria-labelledby="t d">
<title id="t">SG-02 fault tree, sheet 3: phone view</title>
<desc id="d">SG-02 fault tree (ASIL C), sheet 3 of 9 as an outline: G2.3 (AND); BE-2.03; G2.3.1 (OR); BE-2.10; BE-1.20; G-HMI; G-LATCUE.</desc>
<style>
svg { --bg:#ffffff; --ink:#16202b; --ink2:#5b6876; --line:#d5dbe2; --rail:#aab3c0; --hot:#c62828; --hot-bg:#fdecec;
      --or:#2f6fb5; --and:#7a4fc4; --soft:#eef1f5; --ue:#7a5600; --ue-bg:#fff5dc; --sheet:#16202b; --sheet-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d25; --ink:#e4eaf0; --ink2:#94a2b1; --line:#2a3440; --rail:#4a5665; --hot:#ff8f86; --hot-bg:#431b19;
