<title id="t">SG-05 fault tree, sheet 4: phone view</title>
<desc id="d">SG-05 fault tree (ASIL B), sheet 4 of 4 as an outline: G5.1.2 (OR); BE-5.03; BE-5.02; BE-5.15; BE-1.08; BE-1.09; BE-1.18; UE-5.04.</desc>
