.pc { font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
.rule { stroke:var(--line); stroke-width:1; } .rail { stroke:var(--rail); stroke-width:1.2; fill:none; }
.railhot { stroke:var(--hot); stroke-width:2; fill:none; }
