<svg xmlns="http://www.w3.org/2000/svg" width="640" height="287" viewBox="0 0 640 287" role="img" aria-labelledby="t d">
<title id="t">SG-04 fault tree, sheet 9: phone view</title>
<desc id="d">SG-04 fault tree (ASIL B), sheet 9 of 9 as an outline: G4.5 (AND), single-point path; BE-4.11, single-point path; UE-4.12.</desc>
<style>
svg { --bg:#ffffff; --ink:#16202b; --ink2:#5b6876; --line:#d5dbe2; --rail:#aab3c0; --hot:#c62828; --hot-bg:#fdecec;
      --or:#2f6fb5; --and:#7a4fc4; --soft:#eef1f5; --ue:#7a5600; --ue-bg:#fff5dc; --sheet:#16202b; --sheet-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d25; --ink:#e4eaf0; --ink2:#94a2b1; --line:#2a3440; --rail:#4a5665; --hot:#ff8f86; --hot-bg:#431b19;
        --or:#7fb0ec; --and:#b9a0f0; --soft:#1f2731; --ue:#f0cf6a; --ue-bg:#3a3214; --sheet:#e4eaf0; --sheet-ink:#161d25; }
}
.bg { fill:var(--bg); } .t { font:14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.t2 { font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.ti { font:italic 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.pid { font:600 13px ui-monospace,Menlo,Consolas,monospace; fill:var(--ink); } .pidhot { font:600 13px ui-monospace,Menlo,Consolas,monospace; fill:var(--hot); }
.gl { font:700 8px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--bg); }
.pc { font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
.rule { stroke:var(--line); stroke-width:1; } .rail { stroke:var(--rail); stroke-width:1.2; fill:none; }
.railhot { stroke:var(--hot); stroke-width:2; fill:none; }
</style>
<rect class="bg" width="640" height="287"/>
<path d="M28.0,115.0 V179.0 H33.0" class="railhot"/>
<path d="M28.0,115.0 V256.0 H33.0" class="rail"/>
<text x="16" y="34" class="h">SG-04 fault tree · sheet 9 of 9</text>
<text x="16" y="56" class="t2">ASIL B · phone view of fta-SG-04-9.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="3" style="fill:var(--and);stroke:var(--hot);stroke-width:2"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">AND</text>
<text x="46" y="109.0" class="pidhot">G4.5</text>
<text x="116" y="109.0" class="t">False FCW causes reflex braking (HE-04.5)</text>
<text x="116" y="125.0" class="ti">CCF → DFI-26: the same false lead also makes the planner brake, BE-4.06</text>
<rect x="116.0" y="135.0" width="212.4" height="18" rx="9" style="fill:var(--soft)"/><text x="123.0" y="148.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 1 cut set</text>
<rect x="334.4" y="135.0" width="88.4" height="18" rx="9" style="fill:var(--soft)"/><text x="341.4" y="148.0" class="pc" style="fill:var(--ink2)">from sheet 1</text>
<line x1="116" y1="163.0" x2="624" y2="163.0" class="rule"/>
<circle cx="46.0" cy="179.0" r="10" style="fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5"/>
<text x="64" y="184.0" class="pidhot">BE-4.11</text>
<text x="134" y="184.0" class="t">FCW raised from stale or invalid input, or from a false lead (no</text>
<text x="134" y="202.0" class="t">freshness gate, selfdrived.py:488-493)</text>
<rect x="134.0" y="212.0" width="63.6" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="225.0" class="pc" style="fill:var(--ink2)">SOTIF/QM</text>
<rect x="203.6" y="212.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="210.6" y="225.0" class="pc" style="fill:var(--ink2)">SFM-009</text>
<rect x="267.0" y="212.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="274.0" y="225.0" class="pc" style="fill:var(--ink2)">SWF-051</text>
<line x1="134" y1="240.0" x2="624" y2="240.0" class="rule"/>
<path d="M46.0,245.0 l11,11 l-11,11 l-11,-11 z" style="fill:var(--ue-bg);stroke:var(--ink);stroke-width:1.5"/>
<text x="64" y="261.0" class="pid">UE-4.12</text>
<text x="134" y="261.0" class="t">Driver brakes hard with a close follower</text>
<line x1="134" y1="271.0" x2="624" y2="271.0" class="rule"/>
</svg>
