<svg xmlns="http://www.w3.org/2000/svg" width="640" height="287" viewBox="0 0 640 287" role="img" aria-labelledby="t d">
<title id="t">SG-04 fault tree, sheet 9: phone view</title>
<desc id="d">SG-04 fault tree (ASIL B), sheet 9 of 9 as an outline: G4.5 (AND), single-point path; BE-4.11, single-point path; UE-4.12.</desc>
<style>
svg { --bg:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --mute:#898781; --line:#c9c7bf; --grid:#e1e0d9; --soft:#f3f2ee;
      --or:#2a78d6; --and:#6250d6; --basic:#1baf7a; --ue:#eda100; --hot:#d03b3b; --chipink:#ffffff;
      --s1b:#fbe9e9; --s1f:#9e2424; --s2b:#fdeee6; --s2f:#9a4a25;
      --s3b:#fff5dc; --s3f:#7a5600; --s4b:#e6f5e6; --s4f:#0a6a0a; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#1a1a19; --card:#242422; --ink:#f2f1ec; --ink2:#b5b3ab; --mute:#8a8880; --line:#55534e; --grid:#3a3936;
        --soft:#2e2d2a; --chipink:#1a1a19; --s1b:#4a1f1f; --s1f:#ffb3b3; --s2b:#4a2a1c; --s2f:#ffc6a8; --s3b:#43361a;
        --s3f:#ffd98a; --s4b:#1d3a1d; --s4f:#9fe09f; }
}
.bg { fill:var(--bg); } .t { font:14px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:var(--ink); } .t2 { font:12px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:var(--ink2); }
.ti { font:italic 12px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:var(--ink2); } .h { font:600 20px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:var(--ink); }
.pid { font:700 13px 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill:var(--ink); } .pidhot { font:700 13px 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill:var(--hot); }
.gl { font:700 8px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:#ffffff; } .pc { font:600 11px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; } .ps { font:600 11px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.rule { stroke:var(--grid); stroke-width:1; } .rail { stroke:var(--line); stroke-width:1.2; fill:none; }
.railhot { stroke:var(--hot); stroke-width:2; fill:none; }
</style>
<rect class="bg" width="640" height="287"/>
<path d="M28.0,115.0 V179.0 H33.0" class="railhot"/>
<path d="M28.0,115.0 V256.0 H33.0" class="rail"/>
<text x="16" y="34" class="h">SG-04 fault tree · sheet 9 of 9</text>
<text x="16" y="56" class="t2">ASIL B · phone view of fta-SG-04-9.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="4" fill="var(--and)" stroke="var(--hot)" stroke-width="2.4"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">AND</text>
<text x="46" y="109.0" class="pidhot">G4.5</text>
<text x="116" y="109.0" class="t">False FCW causes reflex braking (HE-04.5)</text>
<text x="116" y="125.0" class="ti">CCF → DFI-26: the same false lead also makes the planner brake, BE-4.06</text>
<rect x="116.0" y="135.0" width="66.7" height="18" rx="9" fill="var(--s1b)"/>
<circle cx="127.0" cy="144.0" r="5" fill="var(--s1f)"/><rect x="124.0" y="143.0" width="6" height="2" fill="var(--s1b)"/>
<text x="135.0" y="148.0" class="ps" fill="var(--s1f)">1 fault</text>
<text x="188.7" y="148.0" class="t2">1 cut set</text>
<rect x="252.5" y="135.0" width="88.4" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="259.5" y="148.0" class="pc" fill="var(--ink2)">from sheet 1</text>
<line x1="116" y1="163.0" x2="624" y2="163.0" class="rule"/>
<circle cx="46.0" cy="179.0" r="9.5" fill="var(--basic)" stroke="var(--hot)" stroke-width="2.4"/>
<text x="64" y="184.0" class="pidhot">BE-4.11</text>
<text x="134" y="184.0" class="t">FCW raised from stale or invalid input, or from a false lead (no</text>
<text x="134" y="202.0" class="t">freshness gate, selfdrived.py:488-493)</text>
<rect x="134.0" y="212.0" width="63.6" height="18" rx="4" fill="var(--soft)"/><text x="141.0" y="225.0" class="pc" fill="var(--ink2)">SOTIF/QM</text>
<rect x="203.6" y="212.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="210.6" y="225.0" class="pc" fill="var(--ink2)">SFM-009</text>
<rect x="267.0" y="212.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="274.0" y="225.0" class="pc" fill="var(--ink2)">SWF-051</text>
<line x1="134" y1="240.0" x2="624" y2="240.0" class="rule"/>
<path d="M46.0,245.0 l11,11 l-11,11 l-11,-11 z" fill="var(--ue)"/>
<text x="64" y="261.0" class="pid">UE-4.12</text>
<text x="134" y="261.0" class="t">Driver brakes hard with a close follower</text>
<line x1="134" y1="271.0" x2="624" y2="271.0" class="rule"/>
</svg>
