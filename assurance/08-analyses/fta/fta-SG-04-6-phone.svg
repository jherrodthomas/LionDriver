<svg xmlns="http://www.w3.org/2000/svg" width="640" height="561" viewBox="0 0 640 561" role="img" aria-labelledby="t d">
<title id="t">SG-04 fault tree, sheet 6: phone view</title>
<desc id="d">SG-04 fault tree (ASIL B), sheet 6 of 9 as an outline: G4.9 (OR), single-point path; G4.9.1 (AND); BE-4.22; BE-4.23; G4.9.2 (AND), single-point path; BE-4.24, single-point path; UE-4.25.</desc>
<style>
svg { --bg:#ffffff; --ink:#16202b; --ink2:#5b6876; --line:#d5dbe2; --rail:#aab3c0; --hot:#c62828; --hot-bg:#fdecec;
      --or:#2f6fb5; --and:#7a4fc4; --soft:#eef1f5; --ue:#7a5600; --ue-bg:#fff5dc; --sheet:#16202b; --sheet-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d25; --ink:#e4eaf0; --ink2:#94a2b1; --line:#2a3440; --rail:#4a5665; --hot:#ff8f86; --hot-bg:#431b19;
        --or:#7fb0ec; --and:#b9a0f0; --soft:#1f2731; --ue:#f0cf6a; --ue-bg:#3a3214; --sheet:#e4eaf0; --sheet-ink:#161d25; }
}
.bg { fill:var(--bg); } .t { font:14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.t2 { font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.ti { font:italic 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.pid { font:600 13px ui-monospace,Menlo,Consolas,monospace; fill:var(--ink); } .pidhot { font:600 13px ui-monospace,Menlo,Consolas,monospace; fill:var(--hot); }
.gl { font:700 8px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--bg); }
.pc { font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
.rule { stroke:var(--line); stroke-width:1; } .rail { stroke:var(--rail); stroke-width:1.2; fill:none; }
.railhot { stroke:var(--hot); stroke-width:2; fill:none; }
</style>
<rect class="bg" width="640" height="561"/>
<path d="M28.0,115.0 V163.0 H33.0" class="rail"/>
<path d="M46.0,174.0 V222.0 H51.0" class="rail"/>
<path d="M46.0,174.0 V299.0 H51.0" class="rail"/>
<path d="M28.0,115.0 V394.0 H33.0" class="railhot"/>
<path d="M46.0,405.0 V453.0 H51.0" class="railhot"/>
<path d="M46.0,405.0 V530.0 H51.0" class="rail"/>
<text x="16" y="34" class="h">SG-04 fault tree · sheet 6 of 9</text>
<text x="16" y="56" class="t2">ASIL B · phone view of fta-SG-04-6.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="3" style="fill:var(--or);stroke:var(--hot);stroke-width:2"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">OR</text>
<text x="46" y="109.0" class="pidhot">G4.9</text>
<text x="116" y="109.0" class="t">Item deceleration during accelerator override (DQ-363 A)</text>
<rect x="116.0" y="119.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="123.0" y="132.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 2 cut sets</text>
<rect x="340.6" y="119.0" width="88.4" height="18" rx="9" style="fill:var(--soft)"/><text x="347.6" y="132.0" class="pc" style="fill:var(--ink2)">from sheet 1</text>
<rect x="435.0" y="119.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="442.0" y="132.0" class="pc" style="fill:var(--ink2)">SFM-020</text>
<line x1="116" y1="147.0" x2="624" y2="147.0" class="rule"/>
<rect x="34.0" y="153.0" width="24" height="20" rx="3" style="fill:var(--and);stroke:var(--ink);stroke-width:0"/><text x="46.0" y="166.0" class="gl" text-anchor="middle">AND</text>
<text x="64" y="168.0" class="pid">G4.9.1</text>
<text x="134" y="168.0" class="t">Host and envelope checks each fail</text>
<rect x="134.0" y="178.0" width="212.4" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="191.0" class="pc" style="fill:var(--ink2)">fewest item faults 2 · 1 cut set</text>
<line x1="134" y1="206.0" x2="624" y2="206.0" class="rule"/>
<circle cx="64.0" cy="222.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="227.0" class="pid">BE-4.22</text>
<text x="152" y="227.0" class="t">Host keeps commanding deceleration while the driver presses the</text>
<text x="152" y="245.0" class="t">accelerator (gasPressed parsed wrong or override not applied)</text>
<rect x="152.0" y="255.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="268.0" class="pc" style="fill:var(--ink2)">SFM-020</text>
<line x1="152" y1="283.0" x2="624" y2="283.0" class="rule"/>
<circle cx="64.0" cy="299.0" r="10" style="fill:var(--soft);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="304.0" class="pid">BE-4.23</text>
<text x="152" y="304.0" class="t">Envelope passes a non-inactive acceleration while the accelerator</text>
<text x="152" y="322.0" class="t">is pressed (get_longitudinal_allowed or GAS_RELEASED decoding</text>
<text x="152" y="340.0" class="t">defect)</text>
<rect x="152.0" y="350.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="363.0" class="pc" style="fill:var(--ink2)">SWF-017</text>
<line x1="152" y1="378.0" x2="624" y2="378.0" class="rule"/>
<rect x="34.0" y="384.0" width="24" height="20" rx="3" style="fill:var(--and);stroke:var(--hot);stroke-width:2"/><text x="46.0" y="397.0" class="gl" text-anchor="middle">AND</text>
<text x="64" y="399.0" class="pidhot">G4.9.2</text>
<text x="134" y="399.0" class="t">One stuck gas signal defeats both checks</text>
<rect x="134.0" y="409.0" width="212.4" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="422.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 1 cut set</text>
<line x1="134" y1="437.0" x2="624" y2="437.0" class="rule"/>
<circle cx="64.0" cy="453.0" r="10" style="fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5"/>
<text x="82" y="458.0" class="pidhot">BE-4.24</text>
<text x="152" y="458.0" class="t">GAS_RELEASED stuck "released" while the driver presses: the host</text>
<text x="152" y="476.0" class="t">and the envelope both read the same 0x1D2 bit (longitudinal.h:3-5)</text>
<rect x="152.0" y="486.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="499.0" class="pc" style="fill:var(--ink2)">SWF-017</text>
<rect x="215.4" y="486.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="222.4" y="499.0" class="pc" style="fill:var(--ink2)">SFM-020</text>
<rect x="278.8" y="486.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="285.8" y="499.0" class="pc" style="fill:var(--ink2)">SWF-057</text>
<line x1="152" y1="514.0" x2="624" y2="514.0" class="rule"/>
<path d="M64.0,519.0 l11,11 l-11,11 l-11,-11 z" style="fill:var(--ue-bg);stroke:var(--ink);stroke-width:1.5"/>
<text x="82" y="535.0" class="pid">UE-4.25</text>
<text x="152" y="535.0" class="t">PCM does not give the driver's pedal priority (AOU-05R)</text>
<line x1="152" y1="545.0" x2="624" y2="545.0" class="rule"/>
</svg>
