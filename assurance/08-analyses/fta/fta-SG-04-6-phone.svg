<svg xmlns="http://www.w3.org/2000/svg" width="640" height="561" viewBox="0 0 640 561" role="img" aria-labelledby="t d">
<title id="t">SG-04 fault tree, sheet 6: phone view</title>
<desc id="d">SG-04 fault tree (ASIL B), sheet 6 of 9 as an outline: G4.9 (OR), single-point path; G4.9.1 (AND); BE-4.22; BE-4.23; G4.9.2 (AND), single-point path; BE-4.24, single-point path; UE-4.25.</desc>
<style>
svg { --bg:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --mute:#898781; --line:#c9c7bf; --grid:#e1e0d9; --soft:#f3f2ee;
      --or:#2a78d6; --and:#6250d6; --basic:#1baf7a; --ue:#eda100; --hot:#d03b3b; --chipink:#ffffff;
      --s1b:#fbe9e9; --s1f:#9e2424; --s2b:#fdeee6; --s2f:#9a4a25;
      --s3b:#fff5dc; --s3f:#7a5600; --s4b:#e6f5e6; --s4f:#0a6a0a; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#1a1a19; --card:#242422; --ink:#f2f1ec; --ink2:#b5b3ab; --mute:#8a8880; --line:#55534e; --grid:#3a3936;
        --soft:#2e2d2a; --chipink:#1a1a19; --s1b:#4a1f1f; --s1f:#ffb3b3; --s2b:#4a2a1c; --s2f:#ffc6a8; --s3b:#43361a;
        --s3f:#ffd98a; --s4b:#1d3a1d; --s4f:#9fe09f; }
}
.bg { fill:var(--bg); } .t { font:14px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:var(--ink); } .t2 { font:12px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:var(--ink2); }
.ti { font:italic 12px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:var(--ink2); } .h { font:600 20px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:var(--ink); }
.pid { font:700 13px 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill:var(--ink); } .pidhot { font:700 13px 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill:var(--hot); }
.gl { font:700 8px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill:#ffffff; } .pc { font:600 11px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; } .ps { font:600 11px Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.rule { stroke:var(--grid); stroke-width:1; } .rail { stroke:var(--line); stroke-width:1.2; fill:none; }
.railhot { stroke:var(--hot); stroke-width:2; fill:none; }
</style>
<rect class="bg" width="640" height="561"/>
<path d="M28.0,115.0 V163.0 H33.0" class="rail"/>
<path d="M46.0,174.0 V222.0 H51.0" class="rail"/>
<path d="M46.0,174.0 V299.0 H51.0" class="rail"/>
<path d="M28.0,115.0 V394.0 H33.0" class="railhot"/>
<path d="M46.0,405.0 V453.0 H51.0" class="railhot"/>
<path d="M46.0,405.0 V530.0 H51.0" class="rail"/>
<text x="16" y="34" class="h">SG-04 fault tree · sheet 6 of 9</text>
<text x="16" y="56" class="t2">ASIL B · phone view of fta-SG-04-6.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="4" fill="var(--or)" stroke="var(--hot)" stroke-width="2.4"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">OR</text>
<text x="46" y="109.0" class="pidhot">G4.9</text>
<text x="116" y="109.0" class="t">Item deceleration during accelerator override (DQ-363 A)</text>
<rect x="116.0" y="119.0" width="66.7" height="18" rx="9" fill="var(--s1b)"/>
<circle cx="127.0" cy="128.0" r="5" fill="var(--s1f)"/><rect x="124.0" y="127.0" width="6" height="2" fill="var(--s1b)"/>
<text x="135.0" y="132.0" class="ps" fill="var(--s1f)">1 fault</text>
<text x="188.7" y="132.0" class="t2">2 cut sets</text>
<rect x="258.7" y="119.0" width="88.4" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="265.7" y="132.0" class="pc" fill="var(--ink2)">from sheet 1</text>
<rect x="353.1" y="119.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="360.1" y="132.0" class="pc" fill="var(--ink2)">SFM-020</text>
<line x1="116" y1="147.0" x2="624" y2="147.0" class="rule"/>
<rect x="34.0" y="153.0" width="24" height="20" rx="4" fill="var(--and)"/><text x="46.0" y="166.0" class="gl" text-anchor="middle">AND</text>
<text x="64" y="168.0" class="pid">G4.9.1</text>
<text x="134" y="168.0" class="t">Host and envelope checks each fail</text>
<rect x="134.0" y="178.0" width="72.8" height="18" rx="9" fill="var(--s2b)"/>
<path d="M145.0,182.5 L150.0,191.0 H140.0 Z" fill="var(--s2f)"/>
<text x="153.0" y="191.0" class="ps" fill="var(--s2f)">2 faults</text>
<text x="212.8" y="191.0" class="t2">1 cut set</text>
<line x1="134" y1="206.0" x2="624" y2="206.0" class="rule"/>
<circle cx="64.0" cy="222.0" r="9.5" fill="var(--basic)"/>
<text x="82" y="227.0" class="pid">BE-4.22</text>
<text x="152" y="227.0" class="t">Host keeps commanding deceleration while the driver presses the</text>
<text x="152" y="245.0" class="t">accelerator (gasPressed parsed wrong or override not applied)</text>
<rect x="152.0" y="255.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="268.0" class="pc" fill="var(--ink2)">SFM-020</text>
<line x1="152" y1="283.0" x2="624" y2="283.0" class="rule"/>
<circle cx="64.0" cy="299.0" r="9.5" fill="var(--basic)"/>
<text x="82" y="304.0" class="pid">BE-4.23</text>
<text x="152" y="304.0" class="t">Envelope passes a non-inactive acceleration while the accelerator</text>
<text x="152" y="322.0" class="t">is pressed (get_longitudinal_allowed or GAS_RELEASED decoding</text>
<text x="152" y="340.0" class="t">defect)</text>
<rect x="152.0" y="350.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="363.0" class="pc" fill="var(--ink2)">SWF-017</text>
<line x1="152" y1="378.0" x2="624" y2="378.0" class="rule"/>
<rect x="34.0" y="384.0" width="24" height="20" rx="4" fill="var(--and)" stroke="var(--hot)" stroke-width="2.4"/><text x="46.0" y="397.0" class="gl" text-anchor="middle">AND</text>
<text x="64" y="399.0" class="pidhot">G4.9.2</text>
<text x="134" y="399.0" class="t">One stuck gas signal defeats both checks</text>
<rect x="134.0" y="409.0" width="66.7" height="18" rx="9" fill="var(--s1b)"/>
<circle cx="145.0" cy="418.0" r="5" fill="var(--s1f)"/><rect x="142.0" y="417.0" width="6" height="2" fill="var(--s1b)"/>
<text x="153.0" y="422.0" class="ps" fill="var(--s1f)">1 fault</text>
<text x="206.7" y="422.0" class="t2">1 cut set</text>
<line x1="134" y1="437.0" x2="624" y2="437.0" class="rule"/>
<circle cx="64.0" cy="453.0" r="9.5" fill="var(--basic)" stroke="var(--hot)" stroke-width="2.4"/>
<text x="82" y="458.0" class="pidhot">BE-4.24</text>
<text x="152" y="458.0" class="t">GAS_RELEASED stuck "released" while the driver presses: the host</text>
<text x="152" y="476.0" class="t">and the envelope both read the same 0x1D2 bit (longitudinal.h:3-5)</text>
<rect x="152.0" y="486.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="499.0" class="pc" fill="var(--ink2)">SWF-017</text>
<rect x="215.4" y="486.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="222.4" y="499.0" class="pc" fill="var(--ink2)">SFM-020</text>
<rect x="278.8" y="486.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="285.8" y="499.0" class="pc" fill="var(--ink2)">SWF-057</text>
<line x1="152" y1="514.0" x2="624" y2="514.0" class="rule"/>
<path d="M64.0,519.0 l11,11 l-11,11 l-11,-11 z" fill="var(--ue)"/>
<text x="82" y="535.0" class="pid">UE-4.25</text>
<text x="152" y="535.0" class="t">PCM does not give the driver's pedal priority (AOU-05R)</text>
<line x1="152" y1="545.0" x2="624" y2="545.0" class="rule"/>
</svg>
