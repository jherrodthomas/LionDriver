<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="t d">
<title id="t">SG-01 fault tree, sheet 4: phone view</title>
<desc id="d">SG-01 fault tree (ASIL C), sheet 4 of 6 as an outline: G1.1.1 (OR), single-point path; BE-1.01, single-point path; G1.1.1.a (AND); BE-1.10, single-point path.</desc>
<style>
svg { --bg:#ffffff; --ink:#16202b; --ink2:#5b6876; --line:#d5dbe2; --rail:#aab3c0; --hot:#c62828; --hot-bg:#fdecec;
      --or:#2f6fb5; --and:#7a4fc4; --soft:#eef1f5; --ue:#7a5600; --ue-bg:#fff5dc; --sheet:#16202b; --sheet-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d25; --ink:#e4eaf0; --ink2:#94a2b1; --line:#2a3440; --rail:#4a5665; --hot:#ff8f86; --hot-bg:#431b19;
        --or:#7fb0ec; --and:#b9a0f0; --soft:#1f2731; --ue:#f0cf6a; --ue-bg:#3a3214; --sheet:#e4eaf0; --sheet-ink:#161d25; }
}
.bg { fill:var(--bg); } .t { font:14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.t2 { font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.ti { font:italic 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink2); }
.h { font:600 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.pid { font:600 13px ui-monospace,Menlo,Consolas,monospace; fill:var(--ink); } .pidhot { font:600 13px ui-monospace,Menlo,Consolas,monospace; fill:var(--hot); }
.gl { font:700 8px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--bg); }
.pc { font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
.rule { stroke:var(--line); stroke-width:1; } .rail { stroke:var(--rail); stroke-width:1.2; fill:none; }
.railhot { stroke:var(--hot); stroke-width:2; fill:none; }
</style>
<rect class="bg" width="640" height="430"/>
<path d="M28.0,115.0 V163.0 H33.0" class="railhot"/>
<path d="M28.0,115.0 V258.0 H33.0" class="rail"/>
<path d="M28.0,115.0 V317.0 H33.0" class="railhot"/>
<text x="16" y="34" class="h">SG-01 fault tree · sheet 4 of 6</text>
<text x="16" y="56" class="t2">ASIL C · phone view of fta-SG-01-4.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="3" style="fill:var(--or);stroke:var(--hot);stroke-width:2"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">OR</text>
<text x="46" y="109.0" class="pidhot">G1.1.1</text>
<text x="116" y="109.0" class="t">Command above controllable bound transmitted on bus 0 (0x2E4)</text>
<rect x="116.0" y="119.0" width="224.8" height="18" rx="9" style="fill:var(--soft)"/><text x="123.0" y="132.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 22 cut sets</text>
<rect x="346.8" y="119.0" width="88.4" height="18" rx="9" style="fill:var(--soft)"/><text x="353.8" y="132.0" class="pc" style="fill:var(--ink2)">from sheet 2</text>
<line x1="116" y1="147.0" x2="624" y2="147.0" class="rule"/>
<circle cx="46.0" cy="163.0" r="10" style="fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5"/>
<text x="64" y="168.0" class="pidhot">BE-1.01</text>
<text x="134" y="168.0" class="t">Envelope torque limits set above the controllable bound (raw</text>
<text x="134" y="186.0" class="t">1500/15/25/450 not derived, GAP-04; identical in controller, CCF →</text>
<text x="134" y="204.0" class="t">DFI-08)</text>
<rect x="134.0" y="214.0" width="107.0" height="18" rx="9" style="fill:var(--hot-bg)"/><text x="141.0" y="227.0" class="pc" style="fill:var(--hot)">SPF, systematic</text>
<rect x="247.0" y="214.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="254.0" y="227.0" class="pc" style="fill:var(--ink2)">SWF-001</text>
<rect x="310.4" y="214.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="317.4" y="227.0" class="pc" style="fill:var(--ink2)">SFM-002</text>
<line x1="134" y1="242.0" x2="624" y2="242.0" class="rule"/>
<rect x="34.0" y="248.0" width="24" height="20" rx="3" style="fill:var(--or);stroke:var(--ink);stroke-width:0"/><text x="46.0" y="261.0" class="gl" text-anchor="middle">▸</text>
<text x="64" y="263.0" class="pid">G1.1.1.a</text>
<text x="134" y="263.0" class="t">SoC commands excessive torque AND envelope fails to clamp</text>
<rect x="134.0" y="273.0" width="224.8" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="286.0" class="pc" style="fill:var(--ink2)">fewest item faults 2 · 20 cut sets</text>
<rect x="364.8" y="273.0" width="150.4" height="18" rx="9" style="fill:var(--sheet)"/><text x="371.8" y="286.0" class="pc" style="fill:var(--sheet-ink)">continued on sheet 6 ▸</text>
<line x1="134" y1="301.0" x2="624" y2="301.0" class="rule"/>
<circle cx="46.0" cy="317.0" r="10" style="fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5"/>
<text x="64" y="322.0" class="pidhot">BE-1.10</text>
<text x="134" y="322.0" class="t">Frame corrupted after safety_tx_hook in a part not covered by the</text>
<text x="134" y="340.0" class="t">packet XOR: copy into FDCAN message RAM, message RAM itself, FDCAN</text>
<text x="134" y="358.0" class="t">core, transceiver (the 8-bit XOR checked before loading, fdcan.h:100,</text>
<text x="134" y="376.0" class="t">covers only the software TX queue)</text>
<rect x="134.0" y="386.0" width="100.8" height="18" rx="9" style="fill:var(--hot-bg)"/><text x="141.0" y="399.0" class="pc" style="fill:var(--hot)">SPF, random HW</text>
<rect x="240.8" y="386.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="247.8" y="399.0" class="pc" style="fill:var(--ink2)">DFM-019</text>
<rect x="304.2" y="386.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="311.2" y="399.0" class="pc" style="fill:var(--ink2)">FMD-002</text>
<rect x="367.6" y="386.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="374.6" y="399.0" class="pc" style="fill:var(--ink2)">FMD-010</text>
<rect x="431.0" y="386.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="438.0" y="399.0" class="pc" style="fill:var(--ink2)">FMD-019</text>
<line x1="134" y1="414.0" x2="624" y2="414.0" class="rule"/>
