<text x="16" y="34" class="h">SG-08 fault tree · sheet 1 of 2</text>
<text x="16" y="56" class="t2">ASIL A · phone view of fta-SG-08-1.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="3" style="fill:var(--or);stroke:var(--hot);stroke-width:2"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">OR</text>
<text x="46" y="109.0" class="pidhot">TE-08</text>
<text x="116" y="109.0" class="t">Automated control continues with an inattentive or unresponsive driver</text>
<rect x="116.0" y="119.0" width="224.8" height="18" rx="9" style="fill:var(--soft)"/><text x="123.0" y="132.0" class="pc" style="fill:var(--ink2)">fewest item faults 0 · 13 cut sets</text>
