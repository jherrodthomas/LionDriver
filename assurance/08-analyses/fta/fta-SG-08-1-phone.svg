<text x="142.0" y="461.0" class="ps" fill="var(--ink2)">UE only</text>
<text x="206.7" y="461.0" class="t2">4 cut sets</text>
<rect x="276.7" y="448.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="283.7" y="461.0" class="pc" fill="var(--ink2)">SFM-025</text>
<line x1="134" y1="476.0" x2="624" y2="476.0" class="rule"/>
<circle cx="64.0" cy="492.0" r="9.5" fill="var(--basic)" stroke="var(--hot)" stroke-width="2.4"/>
<text x="82" y="497.0" class="pidhot">BE-8.08</text>
<text x="152" y="497.0" class="t">noResponseForceDecel not set, or not turned into a stop: defect in</text>
<text x="152" y="515.0" class="t">the policy, controlsd or the planner (policy.py:454,</text>
<text x="152" y="533.0" class="t">controlsd.py:236, longitudinal_planner.py:84)</text>
<rect x="152.0" y="543.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="556.0" class="pc" fill="var(--ink2)">SWF-086</text>
