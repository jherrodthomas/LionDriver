<text x="152" y="379.0" class="ti">HMI hang, mute or masked alert; as SG-02</text>
<rect x="152.0" y="389.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="402.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 3 cut sets</text>
<rect x="376.6" y="389.0" width="76.0" height="18" rx="9" style="fill:var(--soft)"/><text x="383.6" y="402.0" class="pc" style="fill:var(--ink2)">CCF DFI-25</text>
<rect x="458.6" y="389.0" width="107.0" height="18" rx="9" style="fill:var(--soft)"/><text x="465.6" y="402.0" class="pc" style="fill:var(--ink2)">→ SG-02 sheet 9</text>
<line x1="152" y1="417.0" x2="624" y2="417.0" class="rule"/>
