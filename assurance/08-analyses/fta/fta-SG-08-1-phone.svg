<text x="64" y="227.0" class="pidhot">G8.2</text>
<text x="134" y="227.0" class="t">Take-over escalation too slow or not delivered</text>
<rect x="134.0" y="237.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="250.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 4 cut sets</text>
