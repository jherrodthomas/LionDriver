<text x="64" y="168.0" class="pidhot">G8.1</text>
<text x="134" y="168.0" class="t">Inattentive or unresponsive driver not detected while engaged</text>
<rect x="134.0" y="178.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="191.0" class="pc" style="fill:var(--ink2)">fewest item faults 1 · 5 cut sets</text>
