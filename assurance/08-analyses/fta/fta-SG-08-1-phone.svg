<rect x="152.0" y="314.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="327.0" class="pc" fill="var(--ink2)">SFM-023</text>
<rect x="215.4" y="314.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="222.4" y="327.0" class="pc" fill="var(--ink2)">SWF-061</text>
