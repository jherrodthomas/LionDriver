<rect x="376.7" y="389.0" width="107.0" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="383.7" y="402.0" class="pc" fill="var(--ink2)">→ SG-02 sheet 9</text>
<line x1="152" y1="417.0" x2="624" y2="417.0" class="rule"/>
