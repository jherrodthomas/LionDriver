<text x="152" y="286.0" class="t">Policy timers, recovery factor or exemptions misconfigured (alerts</text>
<text x="152" y="304.0" class="t">later than 5/8/13 s; no monitoring below 10 km/h)</text>
<rect x="152.0" y="314.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="327.0" class="pc" style="fill:var(--ink2)">SFM-023</text>
<rect x="215.4" y="314.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="222.4" y="327.0" class="pc" style="fill:var(--ink2)">SWF-061</text>
