<circle cx="145.0" cy="246.0" r="5" fill="var(--s1f)"/><rect x="142.0" y="245.0" width="6" height="2" fill="var(--s1b)"/>
<text x="153.0" y="250.0" class="ps" fill="var(--s1f)">1 fault</text>
<text x="206.7" y="250.0" class="t2">4 cut sets</text>
