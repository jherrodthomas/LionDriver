<text x="152" y="592.0" class="t">PCM does not execute the stop request (AOU-05R)</text>
<line x1="152" y1="602.0" x2="624" y2="602.0" class="rule"/>
<circle cx="64.0" cy="618.0" r="9.5" fill="var(--basic)" stroke="var(--hot)" stroke-width="2.4"/>
<text x="82" y="623.0" class="pidhot">BE-8.10</text>
<text x="152" y="623.0" class="t">Vehicle not kept stopped, or the item not locked out, after the</text>
<text x="152" y="641.0" class="t">stop: no standstill hold and no re-engagement or resume lockout</text>
<text x="152" y="659.0" class="t">until the driver responds (TSR-633 not met, TSR-611 partial)</text>
<rect x="152.0" y="669.0" width="100.8" height="18" rx="4" fill="none" stroke="var(--mute)" stroke-dasharray="3 2"/><text x="159.0" y="682.0" class="pc" fill="var(--ink2)">latent, design</text>
<rect x="258.8" y="669.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="265.8" y="682.0" class="pc" fill="var(--ink2)">SWF-062</text>
<rect x="322.2" y="669.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="329.2" y="682.0" class="pc" fill="var(--ink2)">SFM-025</text>
