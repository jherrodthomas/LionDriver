<text x="64" y="438.0" class="pidhot">G8.3</text>
<text x="134" y="438.0" class="t">No-response reaction does not reach the safe state</text>
<rect x="134.0" y="448.0" width="218.6" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="461.0" class="pc" style="fill:var(--ink2)">fewest item faults 0 · 4 cut sets</text>
<rect x="358.6" y="448.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="365.6" y="461.0" class="pc" style="fill:var(--ink2)">SFM-025</text>
<line x1="134" y1="476.0" x2="624" y2="476.0" class="rule"/>
<circle cx="64.0" cy="492.0" r="10" style="fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5"/>
<text x="82" y="497.0" class="pidhot">BE-8.08</text>
<text x="152" y="497.0" class="t">noResponseForceDecel not set, or not turned into a stop: defect in</text>
<text x="152" y="515.0" class="t">the policy, controlsd or the planner (policy.py:454,</text>
<text x="152" y="533.0" class="t">controlsd.py:236, longitudinal_planner.py:84)</text>
<rect x="152.0" y="543.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="159.0" y="556.0" class="pc" style="fill:var(--ink2)">SWF-086</text>
