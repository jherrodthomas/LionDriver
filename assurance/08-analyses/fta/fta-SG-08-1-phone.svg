<text x="152" y="363.0" class="t">HMI does not deliver the warning</text>
<text x="152" y="379.0" class="ti">HMI hang, mute or masked alert; as SG-02</text>
<rect x="152.0" y="389.0" width="66.7" height="18" rx="9" fill="var(--s1b)"/>
<circle cx="163.0" cy="398.0" r="5" fill="var(--s1f)"/><rect x="160.0" y="397.0" width="6" height="2" fill="var(--s1b)"/>
<text x="171.0" y="402.0" class="ps" fill="var(--s1f)">1 fault</text>
