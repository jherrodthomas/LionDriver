<text x="16" y="34" class="h">SG-06 fault tree · sheet 4 of 9</text>
<text x="16" y="56" class="t2">ASIL C · phone view of fta-SG-06-4.svg; the full sheet has the drawing.</text>
<text x="16" y="76" class="t2">Red: a single item fault reaches the top event along this path.</text>
<rect x="16.0" y="94.0" width="24" height="20" rx="4" fill="var(--and)"/><text x="28.0" y="107.0" class="gl" text-anchor="middle">AND</text>
<text x="46" y="109.0" class="pid">G6.3</text>
<text x="116" y="109.0" class="t">PCM does not execute ACC and the warning is not delivered</text>
<rect x="116.0" y="119.0" width="72.8" height="18" rx="9" fill="var(--s3b)"/>
<path d="M127.0,123.0 L132.0,128.0 L127.0,133.0 L122.0,128.0 Z" fill="var(--s3f)"/>
<text x="135.0" y="132.0" class="ps" fill="var(--s3f)">3 faults</text>
<text x="194.8" y="132.0" class="t2">12 cut sets</text>
<rect x="271.0" y="119.0" width="88.4" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="278.0" y="132.0" class="pc" fill="var(--ink2)">from sheet 1</text>
<line x1="116" y1="147.0" x2="624" y2="147.0" class="rule"/>
