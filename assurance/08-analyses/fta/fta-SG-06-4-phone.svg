<text x="134" y="168.0" class="t">PCM does not execute ACC (ACC or cruise fault); accFaulted is an</text>
<text x="134" y="186.0" class="t">immediate disable (events.py:908)</text>
<line x1="134" y1="196.0" x2="624" y2="196.0" class="rule"/>
<rect x="34.0" y="202.0" width="24" height="20" rx="4" fill="var(--or)"/><text x="46.0" y="215.0" class="gl" text-anchor="middle">OR</text>
<text x="64" y="217.0" class="pid">G6.3.1</text>
<text x="134" y="217.0" class="t">SoC warning missing or late</text>
<rect x="134.0" y="227.0" width="66.7" height="18" rx="9" fill="var(--soft)"/>
<text x="142.0" y="240.0" class="ps" fill="var(--ink2)">UE only</text>
<text x="206.7" y="240.0" class="t2">4 cut sets</text>
<line x1="134" y1="255.0" x2="624" y2="255.0" class="rule"/>
