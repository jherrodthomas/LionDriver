<text x="152" y="276.0" class="t">PCM does not signal the ACC non-execution: no accFaulted, and no</text>
<text x="152" y="294.0" class="t">check of the vehicle response against the request (SFM-011.C1;</text>
<text x="152" y="312.0" class="t">WP-A-03 OI-8)</text>
<rect x="152.0" y="322.0" width="57.4" height="18" rx="4" fill="none" stroke="var(--grid)"/><text x="159.0" y="335.0" class="pc" fill="var(--ink2)">SFM-011</text>
<line x1="152" y1="350.0" x2="624" y2="350.0" class="rule"/>
