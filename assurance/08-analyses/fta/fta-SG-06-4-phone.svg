<text x="82" y="371.0" class="pid">G-HMI</text>
<text x="152" y="371.0" class="t">HMI does not deliver the warning</text>
<rect x="152.0" y="381.0" width="66.7" height="18" rx="9" fill="var(--s1b)"/>
<circle cx="163.0" cy="390.0" r="5" fill="var(--s1f)"/><rect x="160.0" y="389.0" width="6" height="2" fill="var(--s1b)"/>
<text x="171.0" y="394.0" class="ps" fill="var(--s1f)">1 fault</text>
<text x="224.7" y="394.0" class="t2">3 cut sets</text>
<rect x="294.7" y="381.0" width="107.0" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="301.7" y="394.0" class="pc" fill="var(--ink2)">→ SG-02 sheet 9</text>
<line x1="152" y1="409.0" x2="624" y2="409.0" class="rule"/>
<path d="M46.0,415.0 l11,19 h-22 z" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linejoin="round"/>
<text x="64" y="430.0" class="pid">G-LONCUE</text>
<text x="134" y="430.0" class="t">SoC-independent cue missing or late (longitudinal loss)</text>
<rect x="134.0" y="440.0" width="72.8" height="18" rx="9" fill="var(--s2b)"/>
<path d="M145.0,444.5 L150.0,453.0 H140.0 Z" fill="var(--s2f)"/>
<text x="153.0" y="453.0" class="ps" fill="var(--s2f)">2 faults</text>
<text x="212.8" y="453.0" class="t2">3 cut sets</text>
<rect x="282.8" y="440.0" width="69.8" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="289.8" y="453.0" class="pc" fill="var(--ink2)">→ sheet 2</text>
<line x1="134" y1="468.0" x2="624" y2="468.0" class="rule"/>
</svg>
