<title id="t">SG-01 fault tree, sheet 1: phone view</title>
<desc id="d">SG-01 fault tree (ASIL C), sheet 1 of 6 as an outline: TE-01 (OR), single-point path; G1.1 (AND), single-point path; G1.2 (OR), single-point path; G1.3 (AND); G1.3.1 (OR); BE-1.19; BE-1.20; BE-1.21; G1.3.2 (AND); BE-1.22; BE-1.23; G1.4 (AND); G1.4.1 (OR); BE-4.19; BE-1.26; BE-4.21.</desc>
