<rect x="334.4" y="119.0" width="88.4" height="18" rx="9" style="fill:var(--soft)"/><text x="341.4" y="132.0" class="pc" style="fill:var(--ink2)">from sheet 1</text>
<line x1="116" y1="147.0" x2="624" y2="147.0" class="rule"/>
