<svg xmlns="http://www.w3.org/2000/svg" width="640" height="408" viewBox="0 0 640 408" role="img" aria-labelledby="t d">
<title id="t">SG-04 fault tree, sheet 7: phone view</title>
<desc id="d">SG-04 fault tree (ASIL B), sheet 7 of 9 as an outline: G4.2 (AND); BE-4.17; BE-4.05; UE-4.04.</desc>
<style>
