<text x="134" y="168.0" class="t">Host sends a step: the CarController jerk limit is applied before</text>
<text x="134" y="186.0" class="t">pitch compensation and the PID (carcontroller.py:197-238)</text>
<text x="134" y="202.0" class="ti">Host sends a step: the CarController jerk limit is applied before</text>
<text x="134" y="218.0" class="ti">pitch compensation and the PID (carcontroller.py:197-238</text>
<rect x="134.0" y="228.0" width="107.0" height="18" rx="9" style="fill:var(--soft)"/><text x="141.0" y="241.0" class="pc" style="fill:var(--ink2)">repeated, SG-03</text>
<rect x="247.0" y="228.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="254.0" y="241.0" class="pc" style="fill:var(--ink2)">SWF-046</text>
<rect x="310.4" y="228.0" width="57.4" height="18" rx="9" style="fill:var(--soft)"/><text x="317.4" y="241.0" class="pc" style="fill:var(--ink2)">SWF-066</text>
