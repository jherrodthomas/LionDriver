<title id="t">SG-02 fault tree, sheet 1: phone view</title>
<desc id="d">SG-02 fault tree (ASIL C), sheet 1 of 9 as an outline: TE-02 (OR), single-point path; G2.1 (AND); G2.2 (AND); G2.3 (AND); G2.4 (AND); G2.5 (AND); G2.6 (AND); G2.7 (AND), single-point path; BE-2.07, single-point path; UE-2.18; G2.8 (AND).</desc>
