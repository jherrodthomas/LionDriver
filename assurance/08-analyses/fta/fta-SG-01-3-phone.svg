<title id="t">SG-01 fault tree, sheet 3: phone view</title>
<desc id="d">SG-01 fault tree (ASIL C), sheet 3 of 6 as an outline: G1.2 (OR), single-point path; G1.2.1 (AND); G1.2.2 (AND); G1.2.2.a (OR); BE-1.16; BE-1.17; BE-1.15; BE-1.18, single-point path.</desc>
<style>
