<title id="t">SG-06 fault tree, sheet 1: phone view</title>
<desc id="d">SG-06 fault tree (ASIL C), sheet 1 of 9 as an outline: TE-06 (OR), single-point path; G6.1 (AND); G6.2 (AND); G6.3 (AND); G6.4 (AND); G6.5 (AND); G6.6 (AND); G6.7 (AND); G6.8 (AND), single-point path; BE-2.07, single-point path; UE-6.07; G6.9 (AND).</desc>
