<title id="t">SG-04 fault tree, sheet 3: phone view</title>
<desc id="d">SG-04 fault tree (ASIL B), sheet 3 of 9 as an outline: G4.1 (AND), single-point path; G4.1.1 (OR), single-point path; BE-4.01, single-point path; G4.1.1.a (AND); BE-4.02; G-LENV; BE-4.03, single-point path; UE-4.04.</desc>
<style>
svg { --bg:#ffffff; --ink:#16202b; --ink2:#5b6876; --line:#d5dbe2; --rail:#aab3c0; --hot:#c62828; --hot-bg:#fdecec;
      --or:#2f6fb5; --and:#7a4fc4; --soft:#eef1f5; --ue:#7a5600; --ue-bg:#fff5dc; --sheet:#16202b; --sheet-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d25; --ink:#e4eaf0; --ink2:#94a2b1; --line:#2a3440; --rail:#4a5665; --hot:#ff8f86; --hot-bg:#431b19;
