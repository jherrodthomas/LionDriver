<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1040" viewBox="0 0 640 1040" role="img" aria-labelledby="t d">
<title id="t">SG-03 fault tree, sheet 1: phone view</title>
<desc id="d">SG-03 fault tree (ASIL C), sheet 1 of 6 as an outline: TE-03 (OR), single-point path; G3.1 (AND), single-point path; G3.6 (AND); G3.2 (AND); G3.3 (AND); G3.4 (AND), single-point path; BE-3.11, single-point path; UE-3.12; G3.5 (AND); G3.7 (AND); G3.7.1 (OR); BE-4.19; BE-4.20; BE-4.21.</desc>
<style>
svg { --bg:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --mute:#898781; --line:#c9c7bf; --grid:#e1e0d9; --soft:#f3f2ee;
      --or:#2a78d6; --and:#6250d6; --basic:#1baf7a; --ue:#eda100; --hot:#d03b3b; --chipink:#ffffff;
      --s1b:#fbe9e9; --s1f:#9e2424; --s2b:#fdeee6; --s2f:#9a4a25;
