<text x="16" y="706" font-size="10" fill="#475569">qualification run must catch · TQR-nn tool qualification report (WP-P-07 §5; 07-supporting/tool-qualification) ·</text>
<text x="16" y="720" font-size="10" fill="#475569">TSR-nn technical safety requirement (WP-S-02)</text>
