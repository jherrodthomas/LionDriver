<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="875" viewBox="0 0 1280 875" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 5-1 · Problem resolution swimlane (WP-P-03)</title>
<desc>Problem resolution swimlane (WP-P-03). Lanes: Maintainer, Owner, Verifier.  triage: Check completeness, reproduce if possible, assign category and severity, decide containment (Maintainer; safety reviewer) → Labels set; owner assigned.  analysis: Root cause analysis (5-why, fault tree, log replay, process replay); identify affected baselines and configurations; check hazard log for missing hazard or TC (Owner) → Root cause and affected items recorded.  resolution: Define fix as a change (WP-P-02); for SOTIF: functional modification, ODD restriction or user information; for S-1/S-2 decide on field action (Owner) → Linked PR(s).  verification: Show the fix removes the problem (regression test that fails before and passes after, tagged with requirement ID per WP-P-06) and has no side effects (Verifier; not the fixer for S-1/S-2) → Verification evidence linked.  closed: Close with state_reason: completed or not_planned + reason (Maintainer) → Closure checklist (§6) done.</desc>
