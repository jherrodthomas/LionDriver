<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure 4-1. Trace model (WP-P-06 §4)</title>
  <desc id="d">Five lanes. FuSa: H/HS to SG to FSR to TSR; TSR to SWSR to code (C/Python) to unit test, code to SW integration test; TSR to HWSR to HW design to HW test; TSR to system test, HIL or vehicle test; FSR and TSR to AOU (assumptions on driver and vehicle ECUs). CS: TS to CSG to CSR to SWSR/HWSR or CSR(impl) to code to CS test or pen test (WP-V-06); CSG is linked both ways with SG where an attack causes a safety hazard. SOTIF: SH to TC/FI to FM (functional modification) to SYS/TSR/AIR to V&amp;V scenario (WP-V-03/04); SH shares HS rows with the HARA in one hazard log. AI: FI to AIR to model or dataset requirement to model test (WP-W-10). Problems and changes: issue #n to the requirement IDs affected (WP-P-02, WP-P-03).</desc>
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2E9E6A"/></marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker>
    <style>
      .t{fill:#0F172A}.m{fill:#475569}.s{font-size:11px}.xs{font-size:10px}.b{font-weight:700}.sb{font-weight:600}
      .box{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.2}
      .ext{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.2}
      .code{fill:#F8FAFC;stroke:#0F766E;stroke-width:1.2}
      .test{fill:#F0FDF4;stroke:#2E9E6A;stroke-width:1.2}
      .ml{fill:#EEF2FF;stroke:#A5B4FC;stroke-width:1.2}
      .lane{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1}
      .id{font-size:12px;font-weight:700;fill:#0F172A}
      .d{font-size:9.5px;fill:#475569}
      .g{fill:none;stroke:#475569;stroke-width:1.4}
      .i{fill:none;stroke:#0F766E;stroke-width:1.6}
      .v{fill:none;stroke:#2E9E6A;stroke-width:1.6}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- header -->
  <text x="40" y="44" class="t b" font-size="20">Figure 4-1 · Trace model</text>
  <text x="40" y="66" class="m" font-size="12.5">Requirement chains per domain, from source analysis to verification, with the links between domains</text>
  <text x="1240" y="44" class="m s" text-anchor="end">WP-P-06 §4</text>
  <text x="1240" y="62" class="m s" text-anchor="end">link storage: §4 table, §5</text>
  <line x1="40" y1="82" x2="1240" y2="82" stroke="#E2E8F0"/>

  <!-- lanes -->
