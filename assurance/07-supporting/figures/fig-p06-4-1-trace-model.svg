  <rect x="160" y="338" width="124" height="36" rx="7" class="ext"/>
  <text x="172" y="354" class="id">TS</text><text x="172" y="367" class="d">threat scenario (TARA)</text>
  <rect x="314" y="338" width="124" height="36" rx="7" class="box"/>
