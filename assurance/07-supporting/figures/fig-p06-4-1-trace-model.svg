  <text x="56" y="128" class="t b" font-size="13">FuSa</text>
  <text x="56" y="143" class="m xs">ISO 26262</text>
  <rect x="40" y="324" width="1200" height="66" rx="10" class="lane"/>
  <text x="56" y="352" class="t b" font-size="13">CS</text>
