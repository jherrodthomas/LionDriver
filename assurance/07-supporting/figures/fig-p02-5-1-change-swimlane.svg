<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1292" viewBox="0 0 1280 1292" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 5-1 · Change request swimlane (WP-P-02)</title>
<desc>Change request swimlane (WP-P-02). Lanes: Requester, Author, Maintainer, Reviewers. Step 1: Raise CR (issue) or open PR with CR section (Requester) → CR ID = issue or PR number. Step 2: Classify (§4) (Author; checked by reviewer) → Label. Step 3: Impact analysis (§6) for SR-A/SR-Q/SR-T (Author) → Completed checklist in PR. Step 4: Decide: accept / reject / defer (Maintainer; CCB, §7.3) → Decision comment. Step 5: Implement on a work branch; update affected work products and assurance/trace/ in the same PR (Author) → Commits. Step 6: Verify: CI green; required additional verification from impact analysis done and linked (Author; verifier) → CI run, test records. Step 7: Review and approve per §7 (Reviewers) → Approvals. Step 8: Merge (squash or merge commit; no force push) (Maintainer) → Merge commit. Step 9: Close CR; update status in WP-M-00 if a WP changed (Author) → Closed issue.</desc>
