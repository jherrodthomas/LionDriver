<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1587" viewBox="0 0 1280 1587" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 4-1 · Release swimlane (WP-P-10)</title>
<desc>Release swimlane (WP-P-10). Lanes: Release manager, Configuration manager, Verification lead, Validation lead, External assessor, Safety manager. Step 1: Create release/ld-vX.Y from liondriver-dev; announce freeze. From now only fixes enter, via PR to the release branch with CCB approval (WP-P-02 §7.3) (Release manager) → Release branch. Step 2: Freeze: all submodule pins on LionDriver fork protected branches; models pinned (LFS oids); lockfiles unchanged since freeze unless CCB-approved (Configuration manager) → Frozen baseline. Step 3: Tag ld-vX.Y.Z-rc1 (signed) (Release manager) → RC tag. Step 4: Build in a clean, recorded environment: host build, stripped release tree, panda RELEASE firmware (§6) (Release manager) → Artifacts + hashes. Step 5: Run the full verification set on the tag and archive results (§5) (Verification lead) → Evidence package. Step 6: Physical configuration audit (WP-P-01 §11) (Configuration manager; not the release manager where possible) → Audit record. Step 7: Vehicle validation per WP-V-01 on the RC (G5 only) (Validation lead) → Validation report. Step 8: Assessments / delta assessments (External assessor) → WP-K-04, WP-K-05. Step 9: Release decision meeting; sign release record (Safety manager; CS manager + maintainer) → WP-K-06. Step 10: Tag ld-vX.Y.Z on the same commit as the accepted RC; publish release notes and user information (WP-O-03); update distribution channel (WP-O-01) (Release manager) → Release.</desc>
