<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="502" viewBox="0 0 1280 502" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 5-1 · Work-product lifecycle (WP-P-04)</title>
<desc>Work-product lifecycle. States: Skeleton: Structure and clause mapping exist; content still to be written; Draft: Content written, derived from code review and engineering judgement; not yet verified; In review: Verification review open (pull request); Approved: Verification review passed and approved by the approver named in the safety plan; Baselined: Approved and frozen in a tagged configuration baseline. Rules: In review: is set when the PR is opened; Approved: only in the merge of an approved PR; Baselined: only when included in a gate or release tag. Review steps: Author submits: PR with label wp and the class from WP-P-02 §4; Verification review: PR review using the checklist for the WP type in WP-P-05; Approval: GitHub "Approve" by the approver named in the header; for ASIL-relevant WPs also the independence level required by WP-M-06; Confirmation review: Separate record (not a PR approval) for WPs listed in WP-M-06, by an independent reviewer; Merge: Only after approvals and green CI (Markdown link check, OI-2).</desc>
