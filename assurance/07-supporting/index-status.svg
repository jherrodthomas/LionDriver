<svg xmlns="http://www.w3.org/2000/svg" width="640" height="586" viewBox="0 0 640 586" role="img" aria-labelledby="t d">
<title id="t">07-supporting: work products by gate and status</title>
<desc id="d">Work products of 07-supporting from WP-M-00 §3, by the gates they are needed for: WP-P-01 Configuration management plan (incl. safety-relevant file list, baselines, submodules): G0, Draft; WP-P-02 Change management plan: G0, Draft; WP-P-03 Problem resolution management: G0, Draft; WP-P-04 Documentation management: G0, Draft; WP-P-05 Verification and review procedure: G0, Draft; WP-P-06 Requirements management and traceability procedure: G0, Draft; WP-P-07 Software tool classification and qualification: G3, Draft; WP-P-08 Qualification of software components (third-party and upstream software): G3, Draft; WP-P-09 Proven-in-use argument evaluation: G3, Draft; WP-P-10 Release management and baseline procedure: G5, Draft; WP-P-11 Integrated process model and generated process maps (all phases G0–G6 modelled): G0, Draft.</desc>
