# Cross-domain interfaces of the concept phase. Format: assurance/process/README.md §3.
# An interface is a point where one discipline's analysis depends on another's (Integrated
# Automotive Standards Handbook §3.3, "explicit domain interfaces"). Each one is anchored to text
# that already exists in the work products: an anchor `WP-x-nn:text` must occur verbatim in that
# work product, so the model cannot claim a link the documents do not make.
# ifr: the IFR item in assurance/trace/items/ifr.yaml that holds the interface's two owners, its open item and its
# agreement state (DQ-129 A). The status is read from there and not kept here: documented = both sides reference
# each other, nobody has reviewed the agreement; open = a recorded open item still has to settle it; agreed = an
# accepted review record of both owners lists the IFR item.

