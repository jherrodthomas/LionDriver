# Cross-domain interfaces of the concept phase. Format: assurance/process/README.md §3.
# An interface is a point where one discipline's analysis depends on another's (Integrated
# Automotive Standards Handbook §3.3, "explicit domain interfaces"). Each one is anchored to text
# that already exists in the work products: an anchor `WP-x-nn:text` must occur verbatim in that
# work product, so the model cannot claim a link the documents do not make.
# status: documented = both sides reference each other, not yet reviewed;
#         open = a recorded open item still has to settle it (named in open_item).

- id: IX-01
  kind: interface
  phase: G1
  between: [WP-C-03, WP-C-09]
  pattern: "Safety-Security"
  topic: "Cyber-induced effects map onto the HARA hazards; TARA safety impact is rated against those hazards and their ASILs"
  anchors: ["WP-C-03:Cyber-induced effects are analysed in the TARA", "WP-C-09:Safety impact is anchored to the HARA hazards"]
  status: documented
  open_item: null
