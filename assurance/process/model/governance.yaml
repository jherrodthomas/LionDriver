# Governance phase (gate G0). Format: assurance/process/README.md §3.
# G0 produces the plans and procedures that every later phase reads from: each lane's `plan`
# (lifecycle.yaml) is a G0 work product, and this process model (WP-P-11) itself reads WP-M-00,
# WP-M-02 and WP-M-06. The plans reference one another densely; the order below follows how they
# describe themselves: impact analysis of the inherited baseline, then the assurance strategy, the
# safety plan, the discipline plans, the supporting procedures and finally the register.
# The handbook's eight integrated work products (Ch. 13) do not cover plans, so `handbook_wp` is
# empty here; the handbook treats governance in Ch. 4.

- id: GOV-01
  kind: activity
  phase: G0
  lane: joint
  name: "Impact analysis of the openpilot-derived baseline"
  produces: [WP-M-12]
  inputs: []
  handbook_wp: []
