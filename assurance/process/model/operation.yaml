# Operation phase (gate G6). Format: assurance/process/README.md §3.
# Clause references are read from the WP-M-00 register row of each produced work product.
# WP-M-06 §9 plans no confirmation measure at G6. Operation closes the lifecycle: field findings
# are routed back into earlier work products through the WP-O-04 §6 table (feedback FB-nn).

- id: OPS-01
  kind: activity
  phase: G6
  lane: joint
  name: "Field monitoring (safety, SOTIF, AI) and crash reporting"
  produces: []
  updates: [WP-O-04]
  inputs: [WP-P-03, WP-V-04, WP-O-01, WP-O-02, WP-O-03, WP-K-06]
  handbook_wp: [WP-8]
- id: OPS-02
  kind: activity
  phase: G6
  lane: cs
  name: "Cybersecurity incident response, vulnerability management and updates"
  produces: [WP-O-05]
  inputs: [WP-P-02, WP-P-03, WP-C-09, WP-S-07, WP-W-11, WP-V-06, WP-P-10, WP-O-04]
  handbook_wp: [WP-8]

# Feedback into earlier phases (WP-O-04 §6 "Feeding the analyses"). A finding that needs a change
# re-enters through problem resolution (WP-P-03), change management (WP-P-02) and impact analysis.
- id: FB-01
  kind: feedback
  phase: G6
  source: WP-O-04
  targets: [WP-C-03, WP-A-04]
