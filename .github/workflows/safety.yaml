name: safety

# Safety-envelope verification (WP-W-06): opendbc safety unit tests under UBSan with the 100%
# line-coverage gate, MISRA C:2012 for the opendbc safety code and the panda firmware, mutation
# testing, and host tests of the LionDriver panda firmware changes. Upstream runs the first three
# only in opendbc's and panda's own CI; running them here keeps the evidence under LionDriver
# control (GAP-39). Everything runs against the pinned submodules: panda MISRA uses the pinned
# opendbc_repo, not panda's opendbc@master dependency.

on:
  push:
    branches:
      - liondriver-dev
    paths:
      - 'opendbc_repo'
      - 'panda'
      - '.github/workflows/safety.yaml'
      - 'tools/ci/build_manifest.py'
      - 'tools/ci/coverage/**'
      - 'assurance/05-software/coverage/**'
      - 'tools/release/release_variant.sh'
      - 'tools/release/build_release.sh'
      - 'tools/release/release_files.py'
  pull_request:
    paths:
      - 'opendbc_repo'
      - 'panda'
      - '.github/workflows/safety.yaml'
      - 'tools/ci/build_manifest.py'
      - 'tools/ci/coverage/**'
      - 'assurance/05-software/coverage/**'
      - 'tools/release/release_variant.sh'
      - 'tools/release/build_release.sh'
      - 'tools/release/release_files.py'
  workflow_dispatch:

concurrency:
  group: safety-${{ github.event_name == 'push' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  safety_tests:
    name: safety tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Run safety tests (UBSan, 100% line coverage)
      run: ./opendbc_repo/opendbc/safety/tests/test.sh
    - name: Run safety tests, LionDriver reference build variant (TSR-705 D-1)
      # libsafety is compiled with -DLIONDRIVER_REFERENCE, as the panda reference build compiles opendbc
      env:
        LIONDRIVER_REFERENCE: "1"
      run: ./opendbc_repo/opendbc/safety/tests/test.sh
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/safety_tests.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-safety_tests
        path: build-manifest/safety_tests.json

  misra:
    name: safety MISRA C:2012
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Run MISRA analysis
      run: ./opendbc_repo/opendbc/safety/tests/misra/test_misra.sh
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/misra.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-misra
        path: build-manifest/misra.json

  panda_misra:
    name: panda MISRA C:2012
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc and panda submodules
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Set up pinned toolchain
      # cppcheck comes from opendbc's locked environment. scons and the ARM compiler are pinned
      # to the versions in LionDriver's uv.lock. panda's own setup.sh is not used because it runs
      # `uv sync --upgrade` without a lockfile and installs opendbc from upstream master.
      # setup.sh must run from inside opendbc_repo: uv discovers the project from the working
      # directory, and from the repo root it would resolve LionDriver's own workspace instead.
      working-directory: opendbc_repo
      run: |
        source setup.sh
        uv pip install "scons==4.11.1" "comma-deps-gcc-arm-none-eabi==13.2.1.post103"
        echo "$GITHUB_WORKSPACE/opendbc_repo/.venv/bin" >> "$GITHUB_PATH"
    - name: Run panda MISRA analysis
      env:
        PYTHONPATH: ${{ github.workspace }}/opendbc_repo
      run: panda/tests/misra/test_misra.sh
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/panda_misra.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-panda_misra
        path: build-manifest/panda_misra.json

  panda_reference_release_build:
    name: panda reference release build
    # WP-W-03 ATC-19 (RR-2026-009 F-33): the release firmware must be the LionDriver reference build. Selects the
    # variant through tools/release/release_variant.sh, as build_release.sh does, then builds the panda firmware with
    # RELEASE=1 and checks that every compile carries -DLIONDRIVER_REFERENCE and none -DALLOW_DEBUG. Signed with the
    # debug key: this checks the configuration and the build, not the signed release image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc and panda submodules
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Set up pinned toolchain
      working-directory: opendbc_repo
      run: |
        source setup.sh
        uv pip install "scons==4.11.1" "comma-deps-gcc-arm-none-eabi==13.2.1.post103"
        echo "$GITHUB_WORKSPACE/opendbc_repo/.venv/bin" >> "$GITHUB_PATH"
    - name: Release variant selection
      run: |
        set -e
        bash -n tools/release/build_release.sh
        (unset RELEASE_VARIANT LIONDRIVER_REFERENCE; source tools/release/release_variant.sh; test "$LIONDRIVER_REFERENCE" = 1)
        (export LIONDRIVER_REFERENCE=; unset RELEASE_VARIANT; source tools/release/release_variant.sh; test "$LIONDRIVER_REFERENCE" = 1)
        (RELEASE_VARIANT=upstream; source tools/release/release_variant.sh 2>/dev/null; test -z "$LIONDRIVER_REFERENCE")
        # DQ-131: the reference file list ships no joystick or maneuver process; the upstream list keeps them
        debug='^openpilot/tools/(joystick/joystick_control\.py|longitudinal_maneuvers/|lateral_maneuvers/)'
        if (unset RELEASE_VARIANT; tools/release/release_files.py | tr '\0' '\n' | grep -E "$debug"); then exit 1; fi
        test "$(RELEASE_VARIANT=upstream tools/release/release_files.py | tr '\0' '\n' | grep -cE "$debug")" -gt 0
        ! (RELEASE_VARIANT=bogus; source tools/release/release_variant.sh 2>/dev/null)
    - name: Build the reference release firmware
      working-directory: panda
      env:
        PYTHONPATH: ${{ github.workspace }}/opendbc_repo
      run: |
        set -eo pipefail
        unset RELEASE_VARIANT
        source ../tools/release/release_variant.sh
        RELEASE=1 CERT="$PWD/board/crypto/certs/debug" scons -j"$(nproc)"
        # every firmware compile (arm-none-eabi-gcc) must carry the reference flag and none the debug flag
        python3 - <<'PY'
        import json
        cmds = [e.get("command") or " ".join(e["arguments"]) for e in json.load(open("compile_commands.json"))]
        fw = [c for c in cmds if "arm-none-eabi-gcc" in c]
        ref = [c for c in fw if "-DLIONDRIVER_REFERENCE" in c]
        dbg = [c for c in fw if "-DALLOW_DEBUG" in c]
        print(f"firmware compiles: {len(fw)}, with -DLIONDRIVER_REFERENCE: {len(ref)}, with -DALLOW_DEBUG: {len(dbg)}")
        assert fw and len(ref) == len(fw) and not dbg
        PY
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/panda_reference_release_build.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-panda_reference_release_build
        path: build-manifest/panda_reference_release_build.json

  panda_host_tests:
    name: panda host tests
    # Host-compiled unit tests for the LionDriver panda firmware changes (WP-W-06; RR-2026-008).
    # Each suite compiles one firmware header with the host gcc and drives it through ctypes;
    # reference_lock includes the pinned opendbc_repo headers. No device is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc and panda submodules
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Run host tests
      working-directory: panda
      run: |
        for suite in hw_watchdog heartbeat_monitor heartbeat_siren reference_lock irq_priorities eps_fault_siren engaged_mismatch; do
          echo "::group::$suite"
          python3 -m unittest discover -v -s "tests/$suite" -t .
          echo "::endgroup::"
        done
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/panda_host_tests.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-panda_host_tests
        path: build-manifest/panda_host_tests.json

  structural_coverage:
    name: safety structural coverage (branch, MC/DC)
    # Branch and MC/DC coverage of U-SAF-CORE, -LAT, -LONG and -TOY on the reference build (WP-W-06 §4, OI-3).
    # LLVM source-based MC/DC is the measurement (WP-P-07 TL-42); gcc 14 condition coverage is the independent
    # cross-check (TL-43). Fails when a unit has more uncovered branches or conditions than the committed baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Install the coverage toolchains
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q clang-18 llvm-18 libclang-rt-18-dev gcc-14
    - name: Measure with LLVM (MC/DC) and gcc 14 (condition coverage)
      run: |
        python3 tools/ci/coverage/structural_coverage.py run --tool llvm --out coverage-out
        python3 tools/ci/coverage/structural_coverage.py run --tool gcc --out coverage-out
    - name: Compare with the baseline and write the report
      run: python3 tools/ci/coverage/structural_coverage.py report coverage-out --check --md coverage-out/structural-coverage.md
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/structural_coverage.json
    - name: Upload report and manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: structural-coverage
        path: |
          coverage-out/
          build-manifest/structural_coverage.json

  mutation:
    name: safety mutation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Run mutation tests
      working-directory: opendbc_repo
      run: |
        source setup.sh
        python opendbc/safety/tests/mutation.py
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/mutation.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-mutation
        path: build-manifest/mutation.json

  mutation_reference:
    name: safety mutation tests (reference build)
    # The reference-only additions (LIONDRIVER_REFERENCE: RX supervision, EPS fault, cruise-main check, TX arrival, ...)
    # are not compiled in the standard variant, so the job above never mutates them. mutation.py compiles and tests the
    # reference variant when LIONDRIVER_REFERENCE=1, as the unit tests do
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Run mutation tests, LionDriver reference build variant
      working-directory: opendbc_repo
      env:
        LIONDRIVER_REFERENCE: "1"
      run: |
        source setup.sh
        python opendbc/safety/tests/mutation.py
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/mutation_reference.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-mutation_reference
        path: build-manifest/mutation_reference.json
