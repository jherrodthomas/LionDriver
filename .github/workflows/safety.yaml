name: safety

# Safety-envelope verification (WP-W-06): opendbc safety unit tests under UBSan with the 100%
# line-coverage gate, MISRA C:2012 for the opendbc safety code and the panda firmware, mutation
# testing, and host tests of the LionDriver panda firmware changes. Upstream runs the first three
# only in opendbc's and panda's own CI; running them here keeps the evidence under LionDriver
# control (GAP-39). Everything runs against the pinned submodules: panda MISRA uses the pinned
# opendbc_repo, not panda's opendbc@master dependency.

on:
  push:
    branches:
      - liondriver-dev
    paths:
      - 'opendbc_repo'
      - 'panda'
      - '.github/workflows/safety.yaml'
      - 'tools/ci/build_manifest.py'
  pull_request:
    paths:
      - 'opendbc_repo'
      - 'panda'
      - '.github/workflows/safety.yaml'
      - 'tools/ci/build_manifest.py'
  workflow_dispatch:

concurrency:
  group: safety-${{ github.event_name == 'push' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  safety_tests:
    name: safety tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Run safety tests (UBSan, 100% line coverage)
      run: ./opendbc_repo/opendbc/safety/tests/test.sh
    - name: Run safety tests, LionDriver reference build variant (TSR-705 D-1)
      # libsafety is compiled with -DLIONDRIVER_REFERENCE, as the panda reference build compiles opendbc
      env:
        LIONDRIVER_REFERENCE: "1"
      run: ./opendbc_repo/opendbc/safety/tests/test.sh
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/safety_tests.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-safety_tests
        path: build-manifest/safety_tests.json

  misra:
    name: safety MISRA C:2012
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Run MISRA analysis
      run: ./opendbc_repo/opendbc/safety/tests/misra/test_misra.sh
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/misra.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-misra
        path: build-manifest/misra.json

  panda_misra:
    name: panda MISRA C:2012
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc and panda submodules
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Set up pinned toolchain
      # cppcheck comes from opendbc's locked environment. scons and the ARM compiler are pinned
      # to the versions in LionDriver's uv.lock. panda's own setup.sh is not used because it runs
      # `uv sync --upgrade` without a lockfile and installs opendbc from upstream master.
      # setup.sh must run from inside opendbc_repo: uv discovers the project from the working
      # directory, and from the repo root it would resolve LionDriver's own workspace instead.
      working-directory: opendbc_repo
      run: |
        source setup.sh
        uv pip install "scons==4.11.1" "comma-deps-gcc-arm-none-eabi==13.2.1.post103"
        echo "$GITHUB_WORKSPACE/opendbc_repo/.venv/bin" >> "$GITHUB_PATH"
    - name: Run panda MISRA analysis
      env:
        PYTHONPATH: ${{ github.workspace }}/opendbc_repo
      run: panda/tests/misra/test_misra.sh
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/panda_misra.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-panda_misra
        path: build-manifest/panda_misra.json

  panda_host_tests:
    name: panda host tests
    # Host-compiled unit tests for the LionDriver panda firmware changes (WP-W-06; RR-2026-008).
    # Each suite compiles one firmware header with the host gcc and drives it through ctypes;
    # reference_lock includes the pinned opendbc_repo headers. No device is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc and panda submodules
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Run host tests
      working-directory: panda
      run: |
        for suite in hw_watchdog heartbeat_monitor heartbeat_siren reference_lock irq_priorities eps_fault_siren; do
          echo "::group::$suite"
          python3 -m unittest discover -v -s "tests/$suite" -t .
          echo "::endgroup::"
        done
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/panda_host_tests.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-panda_host_tests
        path: build-manifest/panda_host_tests.json

  mutation:
    name: safety mutation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Run mutation tests
      working-directory: opendbc_repo
      run: |
        source setup.sh
        python opendbc/safety/tests/mutation.py
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/mutation.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-mutation
        path: build-manifest/mutation.json

  mutation_reference:
    name: safety mutation tests (reference build)
    # The reference-only additions (LIONDRIVER_REFERENCE: RX supervision, EPS fault, cruise-main check, TX arrival, ...)
    # are not compiled in the standard variant, so the job above never mutates them. mutation.py compiles and tests the
    # reference variant when LIONDRIVER_REFERENCE=1, as the unit tests do
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - name: Checkout opendbc submodule
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Run mutation tests, LionDriver reference build variant
      working-directory: opendbc_repo
      env:
        LIONDRIVER_REFERENCE: "1"
      run: |
        source setup.sh
        python opendbc/safety/tests/mutation.py
    - name: Build manifest and tool versions (WP-W-01 ENV-01)
      if: always()
      run: python3 tools/ci/build_manifest.py build-manifest/mutation_reference.json
    - name: Upload build manifest
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-manifest-mutation_reference
        path: build-manifest/mutation_reference.json
