name: tests

on:
  push:
    branches:
      - master
      - liondriver-dev
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: true
        type: string

concurrency:
  group: tests-ci-run-${{ inputs.run_number }}-${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/liondriver-dev') && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: 1
  PYTHONPATH: ${{ github.workspace }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: lfs.fetchexclude
  # LionDriver: all big_* models, not only big_driving_tinygrad.pkl: the upstream LFS store lost the two big warps,
  # and only the chestnut eGPU path loads them
  GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_*_tinygrad.pkl

jobs:
  build_release:
    name: build release
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    env:
      STRIPPED_DIR: /tmp/releasepilot
      PYTHONPATH: /tmp/releasepilot
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: ./.github/actions/lfs-backfill
    - name: Getting LFS files
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: git lfs pull
    - name: Build devel
      timeout-minutes: 1
      run: TARGET_DIR=$STRIPPED_DIR tools/release/build_stripped.sh
    - run: ./tools/op.sh setup
    - name: Build openpilot and run checks
      timeout-minutes: 30
      working-directory: ${{ env.STRIPPED_DIR }}
      run: python3 openpilot/system/manager/build.py
    - name: Run tests
      timeout-minutes: 1
      working-directory: ${{ env.STRIPPED_DIR }}
      run: tools/release/check-dirty.sh
    - name: Check submodules
      if: github.repository == 'commaai/openpilot' || github.repository == 'jherrodthomas/LionDriver'
      timeout-minutes: 3
      run: tools/release/check-submodules.sh

  build_mac:
    name: build macOS
    runs-on: ${{ ((github.repository == 'commaai/openpilot') && ((github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))) && 'namespace-profile-macos-8x14' || 'macos-latest' }}
    steps:
    - uses: actions/checkout@v7
    - name: Remove Homebrew from environment
      run: |
        FILTERED=$(echo "$PATH" | tr ':' '\n' | grep -v '/opt/homebrew' | tr '\n' ':')
        echo "PATH=${FILTERED}/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" >> $GITHUB_ENV
    - uses: ./.github/actions/lfs-backfill
    - run: ./tools/op.sh setup
    - name: Building openpilot
      run: scons

  static_analysis:
    name: static analysis
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    # LionDriver: lint reads no LFS content, so it must not depend on the upstream LFS store being reachable
    env:
      OP_SKIP_LFS: 1
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Static analysis
      timeout-minutes: 1
      run: scripts/lint/lint.sh

  unit_tests:
    name: unit tests
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/lfs-backfill
    - run: ./tools/op.sh setup
    - name: Build openpilot
      run: scons
    # LionDriver: the runner below collects openpilot/ only, so the reference car's controller tests in the pinned
    # opendbc fork run here, each named in the log (change-2026-10-19-pin-e233362 OI-5)
    - name: Run opendbc Toyota car tests
      timeout-minutes: 5
      working-directory: opendbc_repo
      run: ../.venv/bin/python -m unittest discover -v -s opendbc/car/toyota/tests -t .
    - name: Run unit tests
      timeout-minutes: ${{ contains(runner.name, 'nsc') && 2 || 20 }}
      env:
        RAYLIB_BACKEND: headless
      run: tools/op.sh test
    # LionDriver SW FMEA SWF-ACT-078, -080, -081: each hand-written mutant of the host safety code must make its
    # targeted tests fail, so those tests count as proven (RT-2 detection D 4)
    - name: Host safety tests kill their mutants
      timeout-minutes: 15
      env:
        RAYLIB_BACKEND: headless
      run: .venv/bin/python tools/ci/host_mutation.py

  process_replay:
    name: process replay
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/lfs-backfill
    - run: ./tools/op.sh setup
    - name: Build openpilot
      run: scons
    - name: Run replay
      timeout-minutes: ${{ contains(runner.name, 'nsc') && 2 || 20 }}
      continue-on-error: ${{ github.ref == 'refs/heads/master' }}
      run: openpilot/selfdrive/test/process_replay/test_processes.py -j$(nproc)
    - name: Print diff
      id: print-diff
      if: always()
      run: cat openpilot/selfdrive/test/process_replay/diff.txt
    - name: Print diff report
      if: always()
      run: cat openpilot/selfdrive/test/process_replay/diff_report.txt
    - uses: actions/upload-artifact@v7
      if: always()
      continue-on-error: true
      with:
        name: process_replay_diff.txt
        path: openpilot/selfdrive/test/process_replay/diff.txt
    - name: Upload diff report
      uses: actions/upload-artifact@v7
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      with:
        name: diff_report_${{ github.event.number }}
        path: openpilot/selfdrive/test/process_replay/diff_report.txt
    - name: Checkout ci-artifacts
      if: github.repository == 'commaai/openpilot' && github.ref == 'refs/heads/master'
      uses: actions/checkout@v7
      with:
        repository: commaai/ci-artifacts
        ssh-key: ${{ secrets.CI_ARTIFACTS_DEPLOY_KEY }}
        path: ${{ github.workspace }}/ci-artifacts
    - name: Prepare refs
      if: github.repository == 'commaai/openpilot' && github.ref == 'refs/heads/master'
      working-directory: ${{ github.workspace }}/ci-artifacts
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
        git fetch origin process-replay || true
        git checkout process-replay 2>/dev/null || git checkout --orphan process-replay
        cp ${{ github.workspace }}/openpilot/selfdrive/test/process_replay/fakedata/*.zst .
        echo "${{ github.sha }}" > ref_commit
        git add .
        git commit -m "process-replay refs for ${{ github.repository }}@${{ github.sha }}" || echo "No changes to commit"
    - name: Push refs
      if: github.repository == 'commaai/openpilot' && github.ref == 'refs/heads/master'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: cd ${{ github.workspace }}/ci-artifacts && git push origin process-replay --force

  simulator_driving:
    name: simulator driving
    # LionDriver: the MetaDrive bridge drives the reference Corolla (TSS2 CAN from opendbc, panda safety code in the
    # loop, plant-driven kinematics) headless. Synthetic data (DSR-12), no evidence credit (WP-V-02 §5.3).
    # The free 4-core runners render about 6 frames/s against the 20 openpilot needs, so it runs on the lead's
    # self-hosted runner (DQ-400, option A; setup in assurance/sim/README.md §3.8). Only this repository's own
    # branches run there, never a fork's code; and only once the repository variable LIONDRIVER_SIM_RUNNER is 'true',
    # so the job is skipped, not left queued, while no runner is registered.
    if: >-
      vars.LIONDRIVER_SIM_RUNNER == 'true' &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, liondriver-sim]
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/lfs-backfill
    - run: ./tools/op.sh setup
    - name: EGL for headless rendering, and MetaDrive (commaai "minimal" branch, pinned commit, Apache-2.0)
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libportaudio2 pulseaudio libasound2-plugins
        "$HOME/.local/bin/uv" pip install --python .venv/bin/python \
          "metadrive-simulator @ git+https://github.com/commaai/metadrive.git@2716f55a9c7b928ce957a497a15c2c19840c08bc"
    - name: Cache the MetaDrive model archive (checked against its SHA-256 on use)
      uses: actions/cache@v4
      with:
        path: ~/.cache/liondriver-sim/metadrive
        key: metadrive-assets-0.4.2.3
    - name: Install the CC-BY-4.0 vehicle and pedestrian models
      run: |
        mkdir -p ~/.cache/liondriver-sim/metadrive
        zip=~/.cache/liondriver-sim/metadrive/assets.zip
        [ -f "$zip" ] || curl -sSL -o "$zip" https://github.com/metadriverse/metadrive/releases/download/MetaDrive-0.4.2.3/assets.zip
        python openpilot/tools/sim/fetch_metadrive_assets.py --zip "$zip"
    - name: Build openpilot
      run: scons
    - name: Driving test
      timeout-minutes: 20
      env:
        # MetaDrive renders offscreen through panda3d's EGL pipe on llvmpipe
        EGL_PLATFORM: surfaceless
      # soundd needs an audio output: a PulseAudio null sink, which keeps real time without a sound card
      run: |
        pulseaudio --start --exit-idle-time=-1
        pactl load-module module-null-sink sink_name=ci
        pactl set-default-sink ci
        python -m unittest -v openpilot.tools.sim.tests.test_metadrive_bridge

  create_ui_report:
    name: Create UI Report
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-backfill
      - run: ./tools/op.sh setup
      - name: Build openpilot
        run: scons
      - name: Create UI Report
        env:
          RAYLIB_BACKEND: headless
        run: |
          python3 openpilot/selfdrive/ui/tests/diff/replay.py
          python3 openpilot/selfdrive/ui/tests/diff/replay.py --big
      - name: Upload UI Report
        uses: actions/upload-artifact@v7
        with:
          name: ui-report-${{ inputs.run_number || '1' }}-${{ github.event_name == 'push' && github.ref_name || github.event.number }}
          path: openpilot/selfdrive/ui/tests/diff/report
