  sim-weather:
    name: simulation weather physics
    # Sun in the road camera (TC-01, KS-12) with pvlib's NREL SPA (tool TL-54), hydroplaning (TC-03) from the
    # published FHWA/NCHRP and NASA models, the cabin heat soak, crosswind, fog on the windshield on NOAA climate
    # normals, road crown against openpilot's roll path, wet braking, gusts through opendbc's torque limiter, and
    # tunnels and oncoming headlights through openpilot's ported auto exposure, and the sun on the device through the
    # car from a ray cast through the mesh, wet curves, hill crests and a stopped car ahead (assurance/sim/weather).
    # Design aid: synthetic data (DSR-12), no credit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Checkout the opendbc submodule (the plant's Corolla parameters, for the crosswind push)
      run: git submodule update --init --depth 1 opendbc_repo
    - name: Install the pinned packages of the weather physics
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/sim/weather/requirements.txt
    - name: Checks (NREL reference, NOAA cross-check, camera frame, unit conversion, model branches, ODD bound, cabin against McLaren 2005, crosswind against the single-track algebra, fog, wet braking, road crown, gust, tunnel, headlights, sun on the device, wet curves, crests, a stopped car)
      run: python3 assurance/sim/weather/test_weather.py
    - name: Results within 0.05 of the committed JSON, results pages current
      run: |
        python3 assurance/sim/weather/sun_glare.py --check
        python3 assurance/sim/weather/hydroplaning.py --check
        python3 assurance/sim/weather/cabin_soak.py --check
        python3 assurance/sim/weather/crosswind.py --check
        python3 assurance/sim/weather/windshield_fog.py --check
        python3 assurance/sim/weather/road_crown.py --check
        python3 assurance/sim/weather/wet_braking.py --check
        python3 assurance/sim/weather/gust.py --check
        python3 assurance/sim/weather/tunnel.py --check
        python3 assurance/sim/weather/headlights.py --check
        python3 assurance/sim/weather/device_sun.py --check
        python3 assurance/sim/weather/wet_curves.py --check
        python3 assurance/sim/weather/crest.py --check
        python3 assurance/sim/weather/stopped_car.py --check
        python3 assurance/sim/assets/tools/vehicle_geometry.py --check
        python3 assurance/sim/assets/tools/device_shading.py --check

  sim-scenarios:
    name: simulation known scenarios
    # WP-V-03 known scenarios as OpenSCENARIO/OpenDRIVE files (assurance/sim/scenarios, layer 2): the committed files
    # equal a fresh generation, and every file replays headless in the pinned esmini release as specified; the
    # top-view loops drawn from those replays are current.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install the pinned packages of the simulation track
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/sim/requirements.txt
    - name: Cache the esmini release (checked against its SHA-256 on use)
      uses: actions/cache@v4
      with:
        path: ~/.cache/liondriver-sim
        key: esmini-v3.9.0-linux
    - name: Scenario files current, replay checks pass and the replay table is current, tests
      run: |
        python3 assurance/sim/scenarios/generate.py --check
        python3 assurance/sim/scenarios/fetch_esmini.py
        python3 assurance/sim/scenarios/replay.py --check
        python3 assurance/sim/scenarios/test_scenarios.py
    - name: Top-view loops of the scenarios current (fig_sim_ks.py, Kenney sprites checked against their SHA-256), tests
      run: |
        python3 assurance/sim/figures/fig_sim_ks.py --check
        python3 assurance/sim/figures/test_fig_sim_ks.py
