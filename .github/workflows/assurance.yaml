name: assurance

# Assurance data checks: trace consistency (WP-T-01), integrated process model (WP-P-11), Living
# Safety Case records and dashboard (assurance/case), and links in the assurance tree, README and LionDriver docs.
# Read-only: the job never writes to the repository. Generated dashboard files are committed by
# contributors (generate_dashboard.py) and this job fails if they are out of date.

on:
  push:
    branches:
      - liondriver-dev
    paths:
      - 'assurance/**'
      - 'opendbc_repo'
      - 'panda'
      - 'tools/sync/**'
      - 'tools/ci/**'
      - 'tools/severity/**'
      - 'tools/field_monitoring/**'
      - 'tools/safety/**'
      - 'tools/vehicles/**'
      - 'README.md'
      - 'docs/CARS.md'
      - 'docs/liondriver/**'
      - 'docs/assets/liondriver/**'
      - '.github/workflows/assurance.yaml'
      - '.claude/skills/**'
  pull_request:
    paths:
      - 'assurance/**'
      - 'opendbc_repo'
      - 'panda'
      - 'tools/sync/**'
      - 'tools/ci/**'
      - 'tools/severity/**'
      - 'tools/field_monitoring/**'
      - 'tools/safety/**'
      - 'tools/vehicles/**'
      - 'README.md'
      - 'docs/CARS.md'
      - 'docs/liondriver/**'
      - 'docs/assets/liondriver/**'
      - '.github/workflows/assurance.yaml'
      - '.claude/skills/**'

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.event_name == 'push' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: trace and link checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 2  # the base revision HEAD^1 for check_pin_records.py
    - name: Install the pinned checker packages (jsonschema, PyYAML, openpyxl; DQ-123 A, WP-P-07 TL-55)
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/trace/requirements.txt
    - name: A moved opendbc or panda pin has a change record (WP-P-07 TL-47)
      run: python3 tools/ci/check_pin_records.py
    - name: Trace consistency
      run: python3 assurance/trace/tools/check_trace.py
    - name: Trace items against their JSON schema (WP-P-06 §5.1, DQ-123 A)
      run: python3 assurance/trace/tools/check_schema.py
    - name: Checkout the opendbc and panda submodules (test sources the verification links name)
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Test -> requirement links current with WP-W-06 §4.1 and §4.9, every linked test exists (WP-P-06 §5.3)
      run: python3 assurance/trace/tools/verification_links.py --check
    - name: State machines (WP-W-05 §5 generated from state-machines/*.yaml)
      run: python3 assurance/trace/tools/check_state_machines.py --check
    - name: Design diagrams (Stateflow-style charts, Simulink-style block diagram) current
      run: python3 assurance/05-software/diagrams/make_diagrams.py --check
    - name: Trace tool unit tests (check_state_machines, check_trace, sync_requirements; WP-P-07 TL-28, OI-9)
      run: python3 -m unittest discover -s assurance/trace/tools -p 'test_*.py' -v
    - name: Clause-check register consistent and its coverage page current (ISO 26262-3 pilot, WP-P-07 TL-59)
      run: python3 assurance/trace/tools/check_clauses.py --check
    - name: Relative links
      run: python3 assurance/trace/tools/check_links.py
    - name: Abbreviations defined on every covered page and figure (assurance/terms.md)
      run: |
        python3 assurance/trace/tools/terms.py --check
        python3 assurance/trace/tools/test_terms.py
    - name: ASPICE traceability map matches the trace data and test specifications (and its tests)
      run: |
        python3 assurance/trace/tools/trace_map.py --check
        python3 assurance/trace/tools/test_trace_map.py
        python3 assurance/trace/tools/test_vmodel.py
    - name: Decision register follows its lifecycle rules, the inbox page builds, the lifecycle figure is current (and their tests)
      run: |
        python3 assurance/01-management/decisions/check_decisions.py
        python3 assurance/01-management/decisions/test_decisions.py
        python3 assurance/01-management/decisions/fig_lifecycle.py --check
        python3 assurance/01-management/decisions/test_fig_lifecycle.py
    - name: Work-product figures match their source tables and records (and their tests)
      run: |
        python3 assurance/01-management/figures/fig_m_management.py --check
        python3 assurance/01-management/figures/test_fig_m_management.py
        python3 assurance/01-management/figures/folder_index.py --check
        python3 assurance/01-management/figures/test_folder_index.py
        python3 assurance/01-management/figures/scenekit.py --check
        python3 assurance/01-management/figures/fig_scenekit.py --check
        python3 assurance/01-management/figures/test_scenekit.py
        python3 assurance/02-concept/figures/fig_c02_odd.py --check
        python3 assurance/02-concept/figures/test_fig_c02_odd.py
        python3 assurance/02-concept/figures/fig_c02_exits.py --check
        python3 assurance/02-concept/figures/test_fig_c02_exits.py
        python3 assurance/02-concept/figures/fig_c09_scenes.py --check
        python3 assurance/02-concept/figures/test_fig_c09_scenes.py
        python3 assurance/02-concept/figures/fig_c09_boundary.py --check
        python3 assurance/02-concept/figures/test_fig_c09_boundary.py
        python3 assurance/02-concept/figures/fig_c05_four_areas.py --check
        python3 assurance/02-concept/figures/test_fig_c05_four_areas.py
        python3 assurance/02-concept/hatara/hatara_model.py --check
        python3 assurance/02-concept/hatara/hatara_figures.py --check
        python3 assurance/02-concept/hatara/test_hatara.py
        python3 assurance/02-concept/figures/fig_c10_goals.py --check
        python3 assurance/02-concept/figures/test_fig_c10_goals.py
        python3 assurance/02-concept/figures/fig_c10_concept_view.py --check
        python3 assurance/02-concept/figures/test_fig_c10_concept_view.py
        python3 assurance/02-concept/figures/fig_c11_airs.py --check
        python3 assurance/02-concept/figures/test_fig_c11_airs.py
        python3 assurance/09-production-operation/figures/fig_o05_updates.py --check
        python3 assurance/09-production-operation/figures/test_fig_o05_updates.py
        python3 assurance/02-concept/figures/fig_c01_interfaces.py --check
        python3 assurance/02-concept/figures/test_fig_c01_interfaces.py
        python3 assurance/02-concept/figures/fig_c01_modes.py --check
        python3 assurance/02-concept/figures/test_fig_c01_modes.py
        python3 assurance/02-concept/figures/fig_c01_allocation.py --check
        python3 assurance/02-concept/figures/test_fig_c01_allocation.py
        python3 assurance/03-system/figures/fig_s03_defence_in_depth.py --check
        python3 assurance/03-system/figures/test_fig_s03_defence_in_depth.py
        python3 assurance/03-system/figures/fig_s03_hierarchy.py --check
        python3 assurance/03-system/figures/test_fig_s03_hierarchy.py
        python3 assurance/03-system/figures/fig_s03_mechanisms.py --check
        python3 assurance/03-system/figures/test_fig_s03_mechanisms.py
        python3 assurance/03-system/figures/fig_s03_functional_flow.py --check
        python3 assurance/03-system/figures/test_fig_s03_functional_flow.py
        python3 assurance/03-system/figures/fig_s03_envelope_states.py --check
        python3 assurance/03-system/figures/test_fig_s03_envelope_states.py
        python3 assurance/03-system/figures/fig_s03_ffi.py --check
        python3 assurance/03-system/figures/test_fig_s03_ffi.py
        python3 assurance/03-system/figures/fig_s05_requests.py --check
        python3 assurance/03-system/figures/test_fig_s05_requests.py
        python3 assurance/03-system/figures/fig_s04_verdicts.py --check
        python3 assurance/03-system/figures/test_fig_s04_verdicts.py
        python3 assurance/03-system/figures/fig_s07_csr_status.py --check
        python3 assurance/03-system/figures/test_fig_s07_csr_status.py
        python3 assurance/03-system/figures/fig_s08_cases.py --check
        python3 assurance/03-system/figures/test_fig_s08_cases.py
        python3 assurance/03-system/figures/fig_s09_cases.py --check
        python3 assurance/03-system/figures/test_fig_s09_cases.py
        python3 assurance/03-system/figures/fig_s01_requirements.py --check
        python3 assurance/03-system/figures/test_fig_s01_requirements.py
        python3 assurance/03-system/figures/fig_s06_lifecycle.py --check
        python3 assurance/03-system/figures/test_fig_s06_lifecycle.py
        python3 assurance/03-system/figures/fig_s02_allocation.py --check
        python3 assurance/03-system/figures/test_fig_s02_allocation.py
        python3 assurance/03-system/figures/fig_s05_hsi.py --check
        python3 assurance/03-system/figures/test_fig_s05_hsi.py
        python3 assurance/03-system/figures/fig_s00_se.py --check
        python3 assurance/03-system/figures/test_fig_s00_se.py
        python3 assurance/03-system/requirements/requirements_view.py --check
        python3 assurance/03-system/requirements/test_requirements_view.py
        python3 assurance/06-validation/figures/fig_v02_validation_targets.py --check
        python3 assurance/06-validation/figures/test_fig_v02_validation_targets.py
        python3 assurance/07-supporting/figures/fig_p_process.py --check
        python3 assurance/07-supporting/figures/test_fig_p_process.py
        python3 assurance/06-validation/figures/fig_v05_fault_coverage.py --check
        python3 assurance/06-validation/figures/test_fig_v05_fault_coverage.py
        python3 assurance/sim/figures/fig_sim_readme.py --check
        python3 assurance/sim/figures/test_fig_sim_readme.py
        python3 assurance/sim/figures/fig_sim_reel.py --check
        python3 assurance/sim/figures/test_fig_sim_reel.py
        python3 assurance/sim/figures/fig_sim_guide.py --check
        python3 assurance/sim/figures/test_fig_sim_guide.py
        python3 assurance/models/figures/fig_models.py --check
        python3 assurance/models/figures/test_fig_models.py
        python3 assurance/models/figures/fig_timing_anim.py --check
        python3 assurance/models/figures/test_fig_timing_anim.py
        python3 docs/liondriver/figures/fig_driving.py --check
        python3 docs/liondriver/figures/test_fig_driving.py
        python3 docs/liondriver/figures/fig_speed.py --check
        python3 docs/liondriver/figures/test_fig_speed.py
        python3 docs/liondriver/figures/fig_perception.py --check
        python3 docs/liondriver/figures/test_fig_perception.py
    - name: Traceability figures of WP-T-01 match the data (and their tests)
      run: |
        python3 assurance/trace/tools/trace_figures.py --check
        python3 assurance/trace/tools/test_trace_figures.py
    - name: Markdown tables (every row has the header's number of cells)
      run: |
        python3 assurance/trace/tools/check_tables.py
        python3 assurance/trace/tools/test_check_tables.py
    - name: HARA model consistency (summary and WP-C-03 §2.1 counts)
      run: python3 assurance/02-concept/hara/hara_model.py --check
    - name: FSC completeness (every SG x node basic event mapped to WP-C-04 FSRs)
      run: python3 assurance/02-concept/fsc/fsc_model.py --check
    - name: HARA and FSC model unit tests (WP-P-07 TL-36, TL-37)
      run: |
        python3 -m unittest discover -s assurance/02-concept/hara -p 'test_*.py' -v
        python3 -m unittest discover -s assurance/02-concept/fsc -p 'test_*.py' -v
    - name: Build manifest and pin record unit tests (WP-P-07 TL-38, TL-47)
      run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
    - name: Integrated process model and maps (WP-P-11)
      run: python3 assurance/process/tools/process_model.py --check
    - name: Process model self-tests
      run: python3 assurance/process/tools/test_process_model.py
    - name: Concept-phase figures match the HARA, FSC and SOTIF data (and their tests)
      run: |
        python3 assurance/02-concept/hara/hara_figures.py --check
        python3 assurance/02-concept/hara/test_hara_figures.py
        python3 assurance/02-concept/fsc/fsc_figures.py --check
        python3 assurance/02-concept/fsc/test_fsc_figures.py
        python3 assurance/02-concept/fsc/fsc_routes.py --check
        python3 assurance/02-concept/fsc/test_fsc_routes.py
        python3 assurance/02-concept/sotif/sotif_figures.py --check
        python3 assurance/02-concept/sotif/test_sotif_figures.py
        python3 assurance/02-concept/sotif/test_sotif_scenes.py
        python3 assurance/02-concept/sotif/test_fm_scenes.py
        python3 assurance/02-concept/sotif/test_sotif_views.py
    - name: FMEA, FMEDA and DFA figures match the YAML analyses (and their tests)
      run: |
        python3 tools/safety/fmea_diagrams.py --check
        python3 tools/safety/test_fmea_diagrams.py
        python3 tools/safety/fmea_cards.py --check
        python3 tools/safety/test_fmea_cards.py
    - name: Timing-budget, DFI-matrix, two-channel DFA and FFI-map figures match WP-S-04, WP-A-03, dfa.yaml and WP-A-02 (and their tests)
      run: |
        python3 assurance/03-system/figures/fig_s04_timing.py --check
        python3 assurance/03-system/figures/test_fig_s04_timing.py
        python3 assurance/08-analyses/figures/fig_a03_dfi_matrix.py --check
        python3 assurance/08-analyses/figures/test_fig_a03_dfi_matrix.py
        python3 assurance/08-analyses/figures/fig_a03_two_channel.py --check
        python3 assurance/08-analyses/figures/test_fig_a03_two_channel.py
        python3 assurance/08-analyses/figures/fig_a02_interference_map.py --check
        python3 assurance/08-analyses/figures/test_fig_a02_interference_map.py
    - name: Fault tree diagrams, viewer and cut sets match WP-A-04 (and their tests)
      run: |
        python3 assurance/08-analyses/fta/fta_diagrams.py --check
        python3 assurance/08-analyses/fta/test_fta_diagrams.py
        python3 assurance/08-analyses/fta/fta_cutsets.py --check
        python3 assurance/08-analyses/fta/fta_viewer.py --check
        python3 assurance/08-analyses/fta/test_fta_viewer.py
    - name: FMEA data lint, HARA mapping onto WP-C-03, FTA-FMEA hand-off figures (and their tests)
      run: |
        python3 tools/safety/fmea_lint.py --report
        python3 -m unittest discover -s tools/safety -p 'test_fmea_lint.py'
        python3 assurance/08-analyses/figures/fta_fmea_figures.py --check
        python3 assurance/08-analyses/figures/test_fta_fmea_figures.py
        python3 tools/safety/fmea_review_xlsx.py --check
        python3 tools/safety/test_fmea_review_xlsx.py
    - name: Fault tree AND gates against the WP-A-03 claims and shared resources (and its tests)
      run: |
        python3 assurance/08-analyses/dfa/dfa_gates.py --check
        python3 assurance/08-analyses/dfa/test_dfa_gates.py
        python3 assurance/08-analyses/dfa/dfa_figures.py --check
        python3 assurance/08-analyses/dfa/test_dfa_figures.py
    - name: STPA figures match WP-A-05, stpa-map.yaml and the decision register (and their tests)
      run: |
        python3 assurance/08-analyses/figures/fig_a05_stpa.py --check
        python3 assurance/08-analyses/figures/test_fig_a05_stpa.py
        python3 assurance/08-analyses/figures/test_stpa_scenes.py
        python3 assurance/08-analyses/figures/test_stpa_ls_scenes.py
    - name: Plan view builds (Jantt rules hold, bundle matches its pin; WP-P-11 §7, WP-P-07 TL-50) (and its tests)
      run: |
        python3 assurance/process/tools/jantt_plan.py --out build/plan
        python3 assurance/process/tools/test_jantt_plan.py
    - name: Keep the plan view (open index.html from the downloaded artifact)
      uses: actions/upload-artifact@v7
      with:
        name: plan
        path: build/plan
    - name: Vehicle register page current, citing documents agree with it (and its tests)
      run: |
        python3 tools/vehicles/vehicle_register.py --check
        python3 -m unittest discover -s tools/vehicles -p 'test_*.py' -v
    - name: FMEA review pages for GitHub (Markdown + SVG) current, diagram data valid (and tests)
      run: |
        python3 tools/safety/fmea_review_md.py --check
        python3 tools/safety/test_fmea_review_md.py
        python3 tools/safety/fmeda_review_md.py --check
        python3 tools/safety/export_fmeda_xlsx.py --check
        python3 tools/safety/fmeda_views.py --check
        python3 tools/safety/test_fmeda_views.py
    - name: Workbook viewer page rebuilt for the committed workbooks (and its tests)
      run: |
        python3 tools/xlsx_viewer.py --check
        python3 tools/test_xlsx_viewer.py
    - name: Sync report tool unit tests
      run: python3 -m unittest tools.sync.test_sync_report -v
    - name: CAN gap scan unit tests
      run: python3 -m unittest tools.can_gaps.test_can_gap_scan -v
    - name: Severity ratio tool unit tests
      run: python3 -m unittest tools.severity.test_severity_ratio tools.severity.test_risk_curve -v
    - name: Field-monitoring extraction unit tests
      run: python3 -m unittest tools.field_monitoring.test_extract_events -v

  sysml:
    name: sysml model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Model matches WP-C-01, WP-S-03 and WP-W-03 (M1-M12), needs and use cases match WP-S-01 (N1-N3), behaviour matches the state-machine records and WP-S-03 §4.1 (B1-B3), timing budgets and HSI signals match WP-S-04 and WP-S-05 (H1-H3), requirements match WP-S-01, WP-S-02, WP-S-07 and the test specifications (R1-R4), architecture tables are the generated ones (T1), figures and explorer up to date, tests
      working-directory: assurance/models/sysml
      run: |
        python3 tools/gen_requirements.py --check
        python3 tools/gen_behaviour.py --check
        python3 tools/gen_timing_hsi.py --check
        python3 tools/check_model.py
        python3 tools/gen_tables.py
        python3 tools/render_views.py --check
        python3 tools/explorer.py --check
        python3 tools/test_sysml.py
    - name: SysML v2 conformance with the OMG pilot implementation (WP-P-07 TL-26)
      run: |
        # the pilot jar is built for Java 21; the runner image provides it next to the default JDK
        export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
        python3 -m pip install --quiet --user --break-system-packages zstandard
        assurance/models/sysml/tools/pilot/validate.sh "$RUNNER_TEMP/sysml-pilot"

  safety-case:
    name: living safety case
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Validate assurance case records
      run: python3 assurance/case/tools/validate.py
    - name: Validator self-tests
      run: python3 assurance/case/tools/test_case.py
    - name: Snapshot builder tests
      run: python3 assurance/case/tools/test_snapshot.py
    - name: Dashboard is in sync with the records
      run: python3 assurance/case/tools/generate_dashboard.py --check
    - name: GSN diagrams are in sync with the records, WP-K-01 and WP-K-03
      run: |
        python3 assurance/case/tools/gsn_diagrams.py --check
        python3 assurance/case/tools/test_gsn.py
    - name: README and documentation links
      run: python3 assurance/case/tools/check_pages.py

  octave-models:
    name: Octave envelope models
    # Models of envelope logic and of the panda timing loops (assurance/models/octave, WP-P-07 TL-25). Not
    # verification of the C code: the job checks that the models still follow the pinned opendbc and panda
    # constants, reproduce the WP-S-04 code-derived times, pass their own checks, and that the committed
    # timing_loop_results.csv (drawn by assurance/models/figures/fig_timing_anim.py) is current.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Checkout opendbc and panda submodules
      # panda: the timing-loop model reads the safety-task, tick, heartbeat, watchdog and siren constants
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Install GNU Octave and gnuplot
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends octave gnuplot fonts-freefont-otf ghostscript
        octave-cli --version | head -1
    - name: Run models and model checks
      run: octave-cli --no-gui assurance/models/octave/run_models.m build/octave-models
    - name: Upload plots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: octave-models
        path: build/octave-models/

  wiring:
    name: harness and bench wiring drawings
    # WireViz drawings of the E-05 harness and the hardware benches (assurance/04-hardware/wiring). The SVGs are
    # compared byte for byte only with the pinned Graphviz; make_wiring.py prints which comparison ran.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install Graphviz and the pinned WireViz packages
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends graphviz
        dot -V
        python3 -m pip install --quiet --user --break-system-packages -r assurance/04-hardware/wiring/requirements.txt
    - name: Wiring drawings, BOMs and wire-end list current, and their tests
      run: |
        python3 assurance/04-hardware/wiring/make_wiring.py --check
        python3 assurance/04-hardware/wiring/test_make_wiring.py

  box-spice:
    name: harness box ngspice pilot
    # Passive-network faults of comma's harness box v3 (assurance/04-hardware/spice, tool TL-58): predictions for the
    # VS-HW-22...24 pass criteria, no FMEDA credit. Same pinned ngspice 41 environment and cache key as sim-supply.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MICROMAMBA_URL: https://github.com/mamba-org/micromamba-releases/releases/download/2.3.2-0/micromamba-linux-64
      MICROMAMBA_SHA256: ffc3cb8d52d4d6b354bdbb979c407719c485392b74e462cbd50811aa88e58f85
      SUPPLY_ENV: ${{ github.workspace }}/../supply-env
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Cache the supply environment (keyed on the lock)
      id: supply-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.SUPPLY_ENV }}
        key: supply-env-${{ hashFiles('assurance/sim/supply/supply-linux-64.lock') }}
    - name: Create the supply environment from the explicit lock
      if: steps.supply-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o "$RUNNER_TEMP/micromamba" "$MICROMAMBA_URL"
        echo "$MICROMAMBA_SHA256  $RUNNER_TEMP/micromamba" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/micromamba"
        MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba" "$RUNNER_TEMP/micromamba" create -y -q -p "$SUPPLY_ENV" \
          --file assurance/sim/supply/supply-linux-64.lock
    - name: Box pilot predictions and netlist current, and their tests
      run: |
        "$SUPPLY_ENV/bin/python" assurance/04-hardware/spice/box_model.py --check
        "$SUPPLY_ENV/bin/python" assurance/04-hardware/spice/test_box_model.py

  fmdtools:
    name: fmdtools fault-propagation models
    # NASA fmdtools models of the fault trees (TE-02; assurance/models/fmdtools). Synthetic: no evidence credit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install the pinned fmdtools packages
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/models/fmdtools/requirements.txt
    - name: SG-02 model maps the WP-A-04 tree and reproduces the reference cut sets
      run: python3 assurance/models/fmdtools/sg02/test_sg02.py
