name: assurance

# Assurance data checks: trace consistency (WP-T-01), Living Safety Case records and dashboard
# (assurance/case), and links in the assurance tree, README and LionDriver docs.
# Read-only: the job never writes to the repository. Generated dashboard files are committed by
# contributors (generate_dashboard.py) and this job fails if they are out of date.

on:
  push:
    branches:
      - liondriver-dev
    paths:
      - 'assurance/**'
      - 'tools/sync/**'
      - 'README.md'
      - 'docs/CARS.md'
      - 'docs/liondriver/**'
      - 'docs/assets/liondriver/**'
      - '.github/workflows/assurance.yaml'
  pull_request:
    paths:
      - 'assurance/**'
      - 'tools/sync/**'
      - 'README.md'
      - 'docs/CARS.md'
      - 'docs/liondriver/**'
      - 'docs/assets/liondriver/**'
      - '.github/workflows/assurance.yaml'

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.event_name == 'push' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: trace and link checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Trace consistency
      run: python3 assurance/trace/tools/check_trace.py
    - name: Relative links
      run: python3 assurance/trace/tools/check_links.py
    - name: HARA model consistency (summary and WP-C-03 §2.1 counts)
      run: python3 assurance/02-concept/hara/hara_model.py --check
    - name: FSC completeness (every SG x node basic event mapped to WP-C-04 FSRs)
      run: python3 assurance/02-concept/fsc/fsc_model.py --check
    - name: Fault tree diagrams and cut sets match WP-A-04 (and their tests)
      run: |
        python3 assurance/08-analyses/fta/fta_diagrams.py --check
        python3 assurance/08-analyses/fta/test_fta_diagrams.py
        python3 assurance/08-analyses/fta/fta_cutsets.py --check
    - name: Sync report tool unit tests
      run: python3 -m unittest tools.sync.test_sync_report -v
    - name: CAN gap scan unit tests
      run: python3 -m unittest tools.can_gaps.test_can_gap_scan -v

  safety-case:
    name: living safety case
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Validate assurance case records
      run: python3 assurance/case/tools/validate.py
    - name: Validator self-tests
      run: python3 assurance/case/tools/test_case.py
    - name: Dashboard is in sync with the records
      run: python3 assurance/case/tools/generate_dashboard.py --check
    - name: GSN diagrams are in sync with the records, WP-K-01 and WP-K-03
      run: |
        python3 assurance/case/tools/gsn_diagrams.py --check
        python3 assurance/case/tools/test_gsn.py
    - name: README and documentation links
      run: python3 assurance/case/tools/check_pages.py
