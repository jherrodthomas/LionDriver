  fret:
    name: FRETish restatements of the panda TSRs
    # NASA FRET pilot (TE-03; assurance/models/fret). Checks grammar shape, glossary and the quoted WP-S-02 text,
    # then installs the FRET CLI at the pinned commit and checks the stored formulas against it, then installs Kind 2 and
    # Z3 and checks the realizability page and contracts (P3). No evidence credit.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install the pinned checker packages
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/models/fret/requirements.txt
    - name: FRETish requirements match WP-S-02 and their page is current (and its tests)
      run: |
        python3 assurance/models/fret/check_fretish.py --check
        python3 assurance/models/fret/test_check_fretish.py
    - uses: actions/setup-node@v4
      with:
        node-version: '22.22.0'
    - name: Install the FRET CLI at the pinned commit
      run: assurance/models/fret/install_fret.sh "$RUNNER_TEMP/fret"
    - name: Stored FRET formulas match what FRET produces for the current sentences (step P2)
      run: FRET_DIR="$RUNNER_TEMP/fret/fret-electron" python3 assurance/models/fret/fret_formalize.py --check
    - name: Install Kind 2 v2.2.0 and Z3 4.14.1 (pinned by SHA-256)
      run: |
        assurance/models/fret/install_solvers.sh "$RUNNER_TEMP/solvers"
        echo "$RUNNER_TEMP/solvers" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP/solvers/z3-4.14.1/bin" >> "$GITHUB_PATH"
    - name: Realizability page and contracts are current, and its tests (step P3)
      run: |
        FRET_DIR="$RUNNER_TEMP/fret/fret-electron" python3 assurance/models/fret/test_fret_realizability.py
        FRET_DIR="$RUNNER_TEMP/fret/fret-electron" python3 assurance/models/fret/fret_realizability.py --check

  fret-monitor:
    name: Copilot monitors from the FRETish requirements, run against the panda code
    # TE-03 step P4 (assurance/models/fret/monitor): NASA Ogma turns FRET's formulas into a Copilot monitor in C99,
    # and a harness runs the pinned panda engaged-mismatch and siren code under it, with mutants that the monitor must
    # catch. The generated monitor stays on the runner. Building Ogma and Copilot takes about 25 minutes, so the cabal
    # store is cached against install_ogma.sh. No evidence credit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Checkout the panda submodule
      run: git submodule update --init --depth 1 panda
    - name: Install the pinned checker packages
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/models/fret/requirements.txt
    - name: Cache the Ogma and Copilot build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/store
          ~/.cabal/bin
          ~/.cabal/packages
        key: ogma-${{ runner.os }}-${{ hashFiles('assurance/models/fret/install_ogma.sh') }}
    - name: Install GHC, Ogma 1.16.0 and Copilot 4.8.1 (pinned index state)
      run: assurance/models/fret/install_ogma.sh
    - name: Monitor spec and results are current (step P4)
      run: OGMA="$HOME/.cabal/bin/ogma" RUNGHC=/usr/bin/runghc python3 assurance/models/fret/monitor/run_monitor.py --check

  sim-plant:
    name: simulation plant model
    # Fault-injection plant model (assurance/sim, layer 1): the real panda safety code in a closed loop with
    # stated vehicle, EPS, PCM and driver models. Synthetic data (DSR-12), no evidence credit. The job checks that the
    # committed results and figures equal a fresh run, and runs the model's tests (CPU only). The failure search
    # (fourteen families and the edge-case catalogue, about 10 CPU-minutes) uses every core of the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Checkout opendbc and panda submodules
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Install the pinned packages of the simulation track
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/sim/requirements.txt
    - name: Plant model results and figures current, and its tests
      run: |
        python3 assurance/sim/plant/report.py --check
        python3 assurance/sim/plant/test_plant.py
        python3 assurance/sim/plant/silent_stall.py --check
        python3 assurance/sim/plant/test_silent_stall.py
        python3 assurance/sim/plant/straight_drift.py --check
        python3 assurance/sim/plant/test_straight_drift.py
        python3 assurance/sim/plant/engaged_mismatch.py --check
        python3 assurance/sim/plant/test_engaged_mismatch.py
        python3 assurance/sim/vehicle/vehicle_spec.py assurance/sim/vehicle/specs/toyota_corolla_e210_sedan.toml
        python3 assurance/sim/chrono/compare_l1.py --check
    - name: Failure search (Monte Carlo and cross-entropy over the plant model) current, and its tests
      run: |
        python3 assurance/sim/search/search.py --check
        python3 assurance/sim/search/test_search.py
    - name: ASIL C hazardous-event loop diagrams and animations (sim README §3.7) current, and their tests
      run: |
        python3 assurance/sim/figures/fig_sim_he.py --check
        python3 assurance/sim/figures/test_fig_sim_he.py
    - name: Plant FMU (FMI 2.0, pythonfmu) built and run by FMPy, same trajectory as the plant in-process
      run: python3 assurance/sim/plant/fmu/test_fmu.py
    - name: Reachability bound (exact, numpy) current, every sampled fault run inside it, and its tests
      run: |
        python3 assurance/sim/reach/reach_inputs.py --check
        python3 assurance/sim/reach/reach_compare.py --check
        python3 assurance/sim/reach/test_reach.py
    - name: Result plots as loops (sim README §3.4 and §3.6, fig_sim_plots.py) current, and their tests
      run: |
        python3 assurance/sim/figures/fig_sim_plots.py --check
        python3 assurance/sim/figures/test_fig_sim_plots.py
    - name: Hazardous-event scene list and library, and the asset fetcher against fake answers (assurance/sim/blender; no Blender, no network)
      run: |
        python3 assurance/sim/blender/test_scenes.py
        python3 assurance/sim/blender/test_fetch_assets.py

  sim-column:
    name: simulation L2 column
    # L2 steering column (assurance/sim README §3.5): OpenModelica 1.27.1 (tool TL-44) exports the column as an FMU;
    # FMPy runs it in the driver-override study with the real panda safety code. The OpenModelica environment comes
    # from an explicit conda lock (every package pinned by URL and md5) and is cached on the lock's hash.
    # Synthetic data (DSR-12), no evidence credit.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MICROMAMBA_URL: https://github.com/mamba-org/micromamba-releases/releases/download/2.3.2-0/micromamba-linux-64
      MICROMAMBA_SHA256: ffc3cb8d52d4d6b354bdbb979c407719c485392b74e462cbd50811aa88e58f85
      OMC_ENV: ${{ github.workspace }}/../omc-env
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Checkout opendbc and panda submodules
      run: git submodule update --init --depth 1 opendbc_repo panda
    - name: Install the pinned packages of the simulation track
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/sim/requirements.txt
    - name: Cache the OpenModelica environment (keyed on the lock)
      id: omc-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.OMC_ENV }}
        key: omc-env-${{ hashFiles('assurance/sim/plant/modelica/omc-linux-64.lock') }}
    - name: Create the OpenModelica environment from the explicit lock
      if: steps.omc-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o "$RUNNER_TEMP/micromamba" "$MICROMAMBA_URL"
        echo "$MICROMAMBA_SHA256  $RUNNER_TEMP/micromamba" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/micromamba"
        MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba" "$RUNNER_TEMP/micromamba" create -y -q -p "$OMC_ENV" \
          --file assurance/sim/plant/modelica/omc-linux-64.lock
    - name: Column FMU checks (analytic steady states and step response, back-to-back with the L1 EPS)
      env:
        REQUIRE_OMC: "1"
      run: OMC="$OMC_ENV/bin/omc" python3 assurance/sim/plant/modelica/test_column.py
    - name: Driver-override study current, and its --scales option (M-08) tested
      run: |
        python3 assurance/sim/plant/override.py --fmu build/sim-column/SteeringColumn.fmu --check
        python3 assurance/sim/plant/test_override.py

  sim-chrono:
    name: simulation Chrono pilot
    # Project Chrono pilot (assurance/sim README §3.9, tool TL-52): Chrono 9.0.1 (BSD-3) built from source with the
    # vehicle module and PyChrono, open-source parts only (the conda package links MKL and CUDA, which are not open
    # source). The build tools come from an explicit conda-forge lock; the build is cached on the lock and the build
    # script, so it runs (about 25 min) only when either changes. The pilot itself takes about 30 min (the vehicle spec's
    # sweep). Synthetic data (DSR-12), no evidence credit.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MICROMAMBA_URL: https://github.com/mamba-org/micromamba-releases/releases/download/2.3.2-0/micromamba-linux-64
      MICROMAMBA_SHA256: ffc3cb8d52d4d6b354bdbb979c407719c485392b74e462cbd50811aa88e58f85
      CHRONO_PREFIX: ${{ github.workspace }}/../chrono-build
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Cache the Chrono build (keyed on the build-tool lock and the build script)
      id: chrono-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.CHRONO_PREFIX }}
        key: chrono-build-${{ hashFiles('assurance/sim/chrono/chrono-build-linux-64.lock', 'assurance/sim/chrono/build_chrono.sh') }}
    - name: Build Chrono from source (tag 9.0.1, commit checked)
      if: steps.chrono-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o "$RUNNER_TEMP/micromamba" "$MICROMAMBA_URL"
        echo "$MICROMAMBA_SHA256  $RUNNER_TEMP/micromamba" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/micromamba"
        bash assurance/sim/chrono/build_chrono.sh "$RUNNER_TEMP/micromamba" "$CHRONO_PREFIX"
    - name: Chrono pilot results (generic Sedan, and the Corolla vehicle spec with its sweep) within tolerance of the committed JSON
      run: |
        LD_LIBRARY_PATH="$CHRONO_PREFIX/chrono/lib" PYTHONPATH="$CHRONO_PREFIX/chrono/share/chrono/python" \
          "$CHRONO_PREFIX/env/bin/python" assurance/sim/chrono/chrono_pilot.py --check

  sim-thermal:
    name: simulation device heat model
    # Device heat model (assurance/sim/thermal, TE-04 pilot, tool TL-53): FEniCSx 0.10.0 solves the comma device
    # behind a sun-loaded windshield; FiPy 4.0.3 is the independent cross-check. The environment comes from an explicit
    # conda-forge lock (every package by URL and md5) and is cached on the lock's hash. Design aid (DQ-413):
    # synthetic data (DSR-12), no evidence credit; every input is an estimate until step T1.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MICROMAMBA_URL: https://github.com/mamba-org/micromamba-releases/releases/download/2.3.2-0/micromamba-linux-64
      MICROMAMBA_SHA256: ffc3cb8d52d4d6b354bdbb979c407719c485392b74e462cbd50811aa88e58f85
      THERMAL_ENV: ${{ github.workspace }}/../thermal-env
      # One MPI process: keep the conda MPICH's UCX on shared memory and self. Some runners have an Azure MANA NIC whose
      # verbs device UCX probes and fails on, which aborts MPI_Init before any test runs (2026-10-21, job 119391925384).
      UCX_TLS: self,sm
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Cache the heat-model environment (keyed on the lock)
      id: thermal-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.THERMAL_ENV }}
        key: thermal-env-${{ hashFiles('assurance/sim/thermal/thermal-linux-64.lock') }}
    - name: Create the heat-model environment from the explicit lock
      if: steps.thermal-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o "$RUNNER_TEMP/micromamba" "$MICROMAMBA_URL"
        echo "$MICROMAMBA_SHA256  $RUNNER_TEMP/micromamba" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/micromamba"
        MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba" "$RUNNER_TEMP/micromamba" create -y -q -p "$THERMAL_ENV" \
          --file assurance/sim/thermal/thermal-linux-64.lock
    - name: Checks (analytic slab, lumped transient, FiPy cross-check, energy balance, mesh study, limits from the code, cabin-driven runner, MCU study, mount modes, fan dust)
      run: '"$THERMAL_ENV/bin/python" assurance/sim/thermal/test_thermal.py'
    - name: Pilot results within 0.05 K of the committed JSON, results page current
      run: '"$THERMAL_ENV/bin/python" assurance/sim/thermal/thermal_pilot.py --check'
    - name: The device on the cabin heat soak's temperatures (cabin_drive.py) within 0.05 K of the committed JSON
      run: '"$THERMAL_ENV/bin/python" assurance/sim/thermal/cabin_drive.py --check'
    - name: The safety MCU next to the SoC (mcu_heat.py, DFI-04, TSR-509) within 0.05 K of the committed JSON
      run: '"$THERMAL_ENV/bin/python" assurance/sim/thermal/mcu_heat.py --check'
    - name: The mount's vibration modes (mount_modes.py, FEniCSx and SLEPc; TC-19, KS-16) within 1 % of the committed JSON
      run: '"$THERMAL_ENV/bin/python" assurance/sim/thermal/mount_modes.py --check'
    - name: Dust in the fan (fan_dust.py, HWSR-509a) within 0.05 K of the committed JSON
      run: '"$THERMAL_ENV/bin/python" assurance/sim/thermal/fan_dust.py --check'
    - name: Figures render off-screen (Mesa software EGL; pixels are not compared)
      env:
        CONDA_PREFIX: ${{ env.THERMAL_ENV }}
      run: |
        "$THERMAL_ENV/bin/python" - <<'PY'
        import json, sys, tempfile, yaml
        from pathlib import Path
        sys.path.insert(0, "assurance/sim/thermal")
        import figures
        out = Path(tempfile.mkdtemp())
        p = yaml.safe_load(open("assurance/sim/thermal/params.yaml"))
        figures.render(p, json.load(open("assurance/sim/results/thermal-pilot.json")), out)
        figures.mcu_figure(p, json.load(open("assurance/sim/results/mcu-heat.json")), out)
        assert len(list(out.glob("*.webp"))) == 5
        PY

