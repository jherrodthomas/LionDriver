name: fmdtools full sweep

# TE-02 step P3: the full SG-02 joint-fault sweep (sets of up to 4 failure modes, a few minutes on 4 cores) checked
# against the committed p3-minimal-sets.json and p3-joint-faults.md. Pull requests check orders 1 and 2 only, in the
# fmdtools job of assurance.yaml. Synthetic (DSR-12): no evidence credit. Read-only.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: SG-02 joint faults, full sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install the pinned fmdtools packages
      run: python3 -m pip install --quiet --user --break-system-packages -r assurance/models/fmdtools/requirements.txt
    - name: SG-02 minimal sets of up to 4 modes are current
      run: python3 assurance/models/fmdtools/sg02/sweep.py joint --check
