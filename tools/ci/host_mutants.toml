# Hand-written mutants of the LionDriver host safety code, run by host_mutation.py (SW FMEA SWF-ACT-078, -080, -081).
# Each mutant is a defect an FMEA cause describes; the tests named for it must fail on it. `find` must occur exactly
# once in `file`. `fmea` names the causes whose detection rating rests on the tests killing the mutant. TOML, so that
# the openpilot environment reads it with the standard library.
schema_version = 1

# EPS-fault warning escalation (TSR-607 (b), (c); car_events.py)
[[mutants]]
id = "CE-1"
file = "openpilot/selfdrive/car/car_events.py"
find = "silent_allowed = self.steer_fault_frames <= STEER_FAULT_SILENT_FRAMES"
replace = "silent_allowed = True"
tests = ["openpilot/selfdrive/car/tests/test_steer_fault_warning.py"]
fmea = ["SWF-088.C1"]
why = "the lighter prompt stays latched for the whole fault (the BL-005 behaviour, GAP-03)"

[[mutants]]
id = "CE-2"
file = "openpilot/selfdrive/car/car_events.py"
find = "silent_allowed = self.steer_fault_frames <= STEER_FAULT_SILENT_FRAMES"
replace = "silent_allowed = self.steer_fault_frames <= STEER_FAULT_SILENT_FRAMES * 2"
tests = ["openpilot/selfdrive/car/tests/test_steer_fault_warning.py"]
fmea = ["SWF-088.C1"]
why = "the take-over request comes after 3 s instead of 1.5 s"

[[mutants]]
