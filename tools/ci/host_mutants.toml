# Hand-written mutants of the LionDriver host safety code, run by host_mutation.py (SW FMEA SWF-ACT-078, -080, -081).
# Each mutant is a defect an FMEA cause describes; the tests named for it must fail on it. `find` must occur exactly
# once in `file`. `fmea` names the causes whose detection rating rests on the tests killing the mutant. TOML, so that
# the openpilot environment reads it with the standard library.
schema_version = 1

# EPS-fault warning escalation (TSR-607 (b), (c); car_events.py)
[[mutants]]
id = "CE-1"
file = "openpilot/selfdrive/car/car_events.py"
find = "silent_allowed = self.steer_fault_frames <= STEER_FAULT_SILENT_FRAMES"
replace = "silent_allowed = True"
tests = ["openpilot/selfdrive/car/tests/test_steer_fault_warning.py"]
fmea = ["SWF-088.C1"]
why = "the lighter prompt stays latched for the whole fault (the BL-005 behaviour, GAP-03)"

[[mutants]]
id = "CE-2"
file = "openpilot/selfdrive/car/car_events.py"
find = "silent_allowed = self.steer_fault_frames <= STEER_FAULT_SILENT_FRAMES"
replace = "silent_allowed = self.steer_fault_frames <= STEER_FAULT_SILENT_FRAMES * 2"
tests = ["openpilot/selfdrive/car/tests/test_steer_fault_warning.py"]
fmea = ["SWF-088.C1"]
why = "the take-over request comes after 3 s instead of 1.5 s"

[[mutants]]
id = "CE-3"
file = "openpilot/selfdrive/car/car_events.py"
find = "        if self.steer_fault_frames > STEER_FAULT_SILENT_FRAMES:\n          events.add(EventName.steerTempUnavailableSilent)"
replace = "        if False:\n          events.add(EventName.steerTempUnavailableSilent)"
tests = ["openpilot/selfdrive/car/tests/test_steer_fault_warning.py"]
fmea = ["SWF-088.C2"]
why = "no prompt while the driver keeps steering through the fault (the BL-005 behaviour)"

# minimum-risk latch (TSR-633; minimum_risk.py)
[[mutants]]
id = "MR-1"
file = "openpilot/selfdrive/selfdrived/minimum_risk.py"
find = "    if not enabled:\n      self.active = False"
replace = "    if not enabled:\n      pass"
tests = ["openpilot/selfdrive/selfdrived/tests/test_minimum_risk.py"]
fmea = ["SWF-062.C1"]
why = "the latch is not cleared when the driver takes over, so the next engagement starts stopping"

[[mutants]]
id = "MR-2"
file = "openpilot/selfdrive/selfdrived/minimum_risk.py"
find = "    elif no_response_decel:\n      self.active = True"
replace = "    elif no_response_decel:\n      pass"
tests = ["openpilot/selfdrive/selfdrived/tests/test_minimum_risk.py"]
fmea = ["SWF-062.C1"]
why = "the latch is never set"

[[mutants]]
id = "MR-3"
file = "openpilot/selfdrive/selfdrived/minimum_risk.py"
find = "    return self.active"
replace = "    return no_response_decel and enabled"
tests = ["openpilot/selfdrive/selfdrived/tests/test_minimum_risk.py"]
fmea = ["SWF-062.C1"]
why = "the manoeuvre follows the DM request, so a dmonitoringd restart drops it (the BL-006 behaviour)"

# announcement before the no-response stop (TSR-624; events.py, policy.py)
[[mutants]]
id = "AN-1"
file = "openpilot/selfdrive/selfdrived/events.py"
find = "    if decel_in > 0:\n      text_2 = f\"{alert_text_2} - Car Stops in {math.ceil(decel_in)} s\""
replace = "    if False:\n      text_2 = f\"{alert_text_2} - Car Stops in {math.ceil(decel_in)} s\""
tests = ["openpilot/selfdrive/selfdrived/tests/test_minimum_risk.py"]
fmea = ["SWF-050.C1"]
why = "the terminal alert does not count down to the stop"

[[mutants]]
id = "AN-2"
file = "openpilot/selfdrive/monitoring/policy.py"
find = "dm.noResponseDecelIn = max(0., (self.no_response_timeout - self.cnt_since_alert_3) * DT_DMON) \\"
replace = "dm.noResponseDecelIn = max(0., self.no_response_timeout * DT_DMON) \\"
tests = ["openpilot/selfdrive/monitoring/test_monitoring.py"]
fmea = ["SWF-050.C1"]
why = "the countdown does not run down, so the stop starts while the alert still shows 5 s"

# DM countdown in elapsed time and the uncertain-output rule (SWSR-635a/b; policy.py)
[[mutants]]
id = "PO-1"
file = "openpilot/selfdrive/monitoring/policy.py"
find = "      dt = min((frame_id - self.last_frame_id) * DT_DMON, self.settings._MAX_FRAME_GAP_TIME)"
replace = "      dt = DT_DMON"
tests = ["openpilot/selfdrive/monitoring/test_monitoring.py"]
fmea = ["SWF-061.C1"]
why = "timers count evaluated frames again, so a slow DM model stretches every alert (the BL-006 behaviour)"

[[mutants]]
id = "PO-2"
file = "openpilot/selfdrive/monitoring/policy.py"
find = "    step = self.step_change * self.dt / DT_DMON"
replace = "    step = self.step_change"
tests = ["openpilot/selfdrive/monitoring/test_monitoring.py"]
fmea = ["SWF-061.C1"]
why = "awareness moves one fixed step per frame whatever the elapsed time"

[[mutants]]
id = "PO-3"
file = "openpilot/selfdrive/monitoring/policy.py"
find = "      # running when the face is lost or the model is uncertain, so the escalation does not stop at orange\n      self.step_change = DT_DMON / self.settings._VISION_POLICY_ALERT_3_TIMEOUT"
replace = "      # running when the face is lost or the model is uncertain, so the escalation does not stop at orange\n      self.step_change = 0."
tests = ["openpilot/selfdrive/monitoring/test_monitoring.py"]
fmea = ["SWF-061.C1"]
why = "past orange the countdown stops when the face is lost (the BL-006 behaviour, SWSR-635b)"

# wheel-touch distance track (TSR-634; policy.py)
[[mutants]]
id = "WT-1"
file = "openpilot/selfdrive/monitoring/policy.py"
find = "      self.wheeltouch_distance += car_speed * self.dt"
replace = "      self.wheeltouch_distance += 0."
tests = ["openpilot/selfdrive/monitoring/test_monitoring.py"]
fmea = ["SWF-061.C4"]
why = "no distance is integrated, so only the 5/15/25 s time track remains"

