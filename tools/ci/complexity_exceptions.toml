# ENV-R-07 size and complexity check of the envelope code (WP-W-01 §6 ENV-R-07, OI-5; WP-W-05 §7, OI-2;
# decision DQ-158 A). Read by check_complexity.py, which runs lizard (WP-P-07 TL-63) on `files` and fails when
# a function exceeds a limit and is not listed below, when a listed function has grown past its recorded
# figures, or when an entry is stale (the function is gone or back within the limits).
#
# NLOC is lizard's count of non-blank, non-comment lines in the function, the "logical lines" of ENV-R-07
# (WP-W-05 §7 uses the same reading). CCN is lizard's standard cyclomatic complexity: every `case` counts.
# lizard reads the source as written, so code under every #if branch (reference, debug and other builds)
# is counted: the figures are for the superset of the build variants.
#
# Every exception needs a written justification ("unless justified", ENV-R-07) or a split of the function.
# `reason = "to justify"` means no justification is recorded yet; `structure` is a factual description of
# the function taken from WP-W-05 or WP-W-01 §2 and is not a justification.
schema_version = 1
lizard_version = "1.24.1"
measured_at = "opendbc f23b4fa, panda 131320c (2026-11-02)"

[limits]
nloc = 60
ccn = 15

[scope]
# The envelope (E-03) as WP-W-01 §2 defines it: the opendbc safety logic with the safety modes of the
# reference configuration (toyota.h and defaults.h; the other brand modes are not in the item), the panda
# platform files and the bootstub; plus the panda files of the WP-W-05 §2 envelope units added since
# (heartbeat, watchdog, sirens, IRQ priorities, reference lock, timers) and engaged_mismatch.h, the LionDriver
# engaged-state cross-check added after WP-W-05's inventory pin (change-2026-10-21-panda-engaged-mismatch).
# Left out: UN-44 fault_injection.h (debug builds only) and the startup assembly. Entries may be globs.
files = [
  "opendbc_repo/opendbc/safety/safety.h",
  "opendbc_repo/opendbc/safety/lateral.h",
  "opendbc_repo/opendbc/safety/longitudinal.h",
  "opendbc_repo/opendbc/safety/helpers.h",
  "opendbc_repo/opendbc/safety/declarations.h",
  "opendbc_repo/opendbc/safety/can.h",
  "opendbc_repo/opendbc/safety/ignition.h",
  "opendbc_repo/opendbc/safety/modes/toyota.h",
  "opendbc_repo/opendbc/safety/modes/defaults.h",
  "panda/board/main.c",
  "panda/board/main_comms.h",
  "panda/board/can_comms.h",
  "panda/board/reference_lock.h",
  "panda/board/early_init.h",
  "panda/board/drivers/fdcan.h",
  "panda/board/drivers/spi.h",
  "panda/board/drivers/harness.h",
  "panda/board/drivers/simple_watchdog.h",
  "panda/board/drivers/registers.h",
  "panda/board/drivers/interrupts.h",
  "panda/board/drivers/can_common.h",
  "panda/board/drivers/timers.h",
  "panda/board/drivers/hw_watchdog.h",
  "panda/board/drivers/heartbeat_monitor.h",
  "panda/board/drivers/irq_priorities.h",
  "panda/board/drivers/eps_fault_siren.h",
  "panda/board/drivers/heartbeat_siren.h",
  "panda/board/drivers/engaged_mismatch.h",
  "panda/board/sys/*.h",
  "panda/board/stm32h7/*.h",
  "panda/board/bootstub.c",
  "panda/board/flasher.h",
  "panda/board/crypto/rsa.c",
  "panda/board/crypto/sha.c",
]

# Functions over a limit at the pins above. `nloc` and `ccn` are the figures measured then: a listed
# function may shrink but not grow past them without a new entry.

