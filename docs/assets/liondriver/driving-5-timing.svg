<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="694" viewBox="0 0 1320 694" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 5. Timing: one model cycle, and how fast a stop is caught</title>
<desc>Upper strip: in 100 ms the road camera gives two frames, the driving model runs once per frame, and controlsd, the 0x2E4 steering frame and the panda safety task run every 10 ms, so each model output steers five control steps. Lower strip, against the SG-01 FTTI of 0.5 s: the panda catches missing commands in ≤ 0.06 s (required 0.05 s) and a lost heartbeat in ≤ 0.31 s (required 0.3 s); controlsd stops steering on a stale model output after 0.5 s (required 0.1 s, accepted for now); a frozen model output is not detected.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
