<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="arch-t arch-d">
  <title id="arch-t">LionDriver platform architecture</title>
  <desc id="arch-d">Architecture diagram. Layer 1, Core Driving Platform inherited from openpilot: perception, prediction, planning, control, driver monitoring, human-machine interface. Layer 2, Safety Envelope in the panda safety firmware: limits, engagement and release checks (implemented); hardened envelope (proposed). Layer 3, Vehicle Integration in the opendbc car ports: vehicle interfaces, ECU compatibility, hardware configurations, calibration, diagnostics (implemented); vehicle operating assumptions (LionDriver draft). Layer 4, Supported Vehicle Ecosystem listed in docs/CARS.md: cars, SUVs and crossovers, minivans, pickups, commercial vans. A cross-cutting Safety and Assurance column of draft work products applies to every layer: functional safety, SOTIF, cybersecurity, AI safety, safety case, requirements traceability, verification and validation, change impact analysis.</desc>
  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1A31"/><stop offset="1" stop-color="#070D1A"/></linearGradient>
    <linearGradient id="arch-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A97A2A"/><stop offset="0.5" stop-color="#F6DC97"/><stop offset="1" stop-color="#A97A2A"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="929" rx="22" fill="url(#arch-bg)" stroke="#24345A"/>
  <rect x="40" y="0" width="920" height="3" fill="url(#arch-gold)"/>
