    <text x="156.0" y="279.9" font-size="14" font-weight="500" fill="#F4F6FA" text-anchor="middle">Control</text>
    <rect x="264" y="252" width="192" height="46" rx="9" fill="#4EA8FF" fill-opacity="0.13" stroke="#4EA8FF" stroke-opacity="0.7"/>
