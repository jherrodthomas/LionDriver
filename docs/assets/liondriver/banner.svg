<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">LionDriver</title>
  <desc id="d">LionDriver: open driving, engineered for safety. An openpilot-derived driving platform developed against ISO 26262, ISO 21448, ISO/SAE 21434, ISO/PAS 8800 and UL 4600.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1C"/>
      <stop offset="0.55" stop-color="#101A30"/>
      <stop offset="1" stop-color="#1A1426"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F29F1F"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F5B83D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#F5B83D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>

  <!-- road in perspective, converging at the horizon -->
  <g transform="translate(1000 128)">
    <path d="M-10 0 L-250 232 M10 0 L250 232" stroke="url(#road)" stroke-width="3" fill="none"/>
    <path d="M0 18 L-6 52 M-9 76 L-17 122 M-21 152 L-32 212" stroke="#F5B83D" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- shield: the safety layer -->
  <g transform="translate(1000 70)">
    <path d="M0 0 L58 20 L58 70 C58 110 32 134 0 150 C-32 134 -58 110 -58 70 L-58 20 Z"
          fill="#0E1528" stroke="url(#gold)" stroke-width="4"/>
    <path d="M-24 74 L-6 92 L28 54" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="148" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#F7F8FB" letter-spacing="-1">Lion<tspan fill="url(#gold)">Driver</tspan></text>
  <text x="76" y="198" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#C9D2E3">Open driving. Engineered for safety.</text>

  <!-- standards chips -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="600">
    <g transform="translate(76 238)">
      <rect width="118" height="34" rx="17" fill="#F5B83D" fill-opacity="0.12" stroke="#F5B83D" stroke-opacity="0.6"/>
      <text x="59" y="22" text-anchor="middle" fill="#FFD27A">ISO 26262</text>
    </g>
    <g transform="translate(206 238)">
      <rect width="118" height="34" rx="17" fill="#5CC8FF" fill-opacity="0.10" stroke="#5CC8FF" stroke-opacity="0.55"/>
      <text x="59" y="22" text-anchor="middle" fill="#9FDDFF">ISO 21448</text>
    </g>
    <g transform="translate(336 238)">
      <rect width="148" height="34" rx="17" fill="#FF7A90" fill-opacity="0.10" stroke="#FF7A90" stroke-opacity="0.55"/>
      <text x="74" y="22" text-anchor="middle" fill="#FFB0BD">ISO/SAE 21434</text>
    </g>
    <g transform="translate(496 238)">
      <rect width="136" height="34" rx="17" fill="#B48CFF" fill-opacity="0.10" stroke="#B48CFF" stroke-opacity="0.55"/>
      <text x="68" y="22" text-anchor="middle" fill="#D2BBFF">ISO/PAS 8800</text>
    </g>
    <g transform="translate(644 238)">
      <rect width="96" height="34" rx="17" fill="#6EE7B7" fill-opacity="0.10" stroke="#6EE7B7" stroke-opacity="0.55"/>
      <text x="48" y="22" text-anchor="middle" fill="#A7F3D0">UL 4600</text>
    </g>
  </g>

  <text x="76" y="314" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8391AB">An openpilot-derived driving platform with a traceable path from hazards to evidence.</text>
</svg>
