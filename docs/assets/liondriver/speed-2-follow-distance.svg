<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="512" viewBox="0 0 1320 512" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 2. How far back the MPC wants to be</title>
<desc>Left: the gap the MPC steers toward when following a lead at the same speed, T_follow × v + 6 m, for relaxed (1.75 s), standard (1.45 s) and aggressive (1.25 s), and the soft danger-zone limit. Right: approaching a stopped car, the distance the MPC plans with, v²/(2·2.5) + 1.45·v + 6, against the distance to stop at -3.5 m/s².</desc>
