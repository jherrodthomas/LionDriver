    <text x="66" y="554" font-size="15" font-weight="500" fill="#93A1BC" text-anchor="start">Safety case</text>
    <text x="300" y="528" font-size="19" font-weight="600" fill="#F4F6FA" text-anchor="start">Is the whole argument convincing?</text>
    <text x="300" y="554" font-size="15" font-weight="400" fill="#93A1BC" text-anchor="start">Claims, evidence, defeaters, field feedback</text>
  </g>
