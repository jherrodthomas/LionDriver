<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="490" viewBox="0 0 1320 490" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 5. Driver monitoring: from eyes off the road to the car slowing</title>
<desc>Two timelines from loss of attention: vision policy alerts at 5, 8, 13 s and forced deceleration 5 s after the terminal alert; wheel-touch policy at 5, 15, 25 s. The SG-08 budget is a first alert within 6 s. Below: latency not measured, DM output never invalid (TSR-609), no safe stop (TSR-633), lockout.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1320" height="490" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 5 · Driver monitoring: from eyes off the road to the car slowing</text>
<text x="40" y="66" font-size="12.5" fill="#475569">The alert timers of policy.py against the SG-08 budget of WP-S-04. Times count from the moment the driver stops watching.</text>
<text x="1280" y="44" font-size="11" fill="#475569" text-anchor="end">policy.py · WP-S-04 §3.7 · TSR-609, 633</text>
<line x1="40" y1="82" x2="1280" y2="82" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="140" font-size="12" fill="#0F172A" font-weight="700">Camera sees the face</text>
<text x="40" y="155" font-size="10" fill="#475569">vision policy</text>
<rect x="290" y="128" width="137.5" height="16" rx="0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<line x1="427.5" y1="122" x2="427.5" y2="150" stroke="#0F766E" stroke-width="2"/>
<text x="427.5" y="118" font-size="10" fill="#0F766E" font-weight="600" text-anchor="middle">alert 1 · 5 s</text>
<rect x="427.5" y="128" width="82.5" height="16" rx="0" fill="#FFF7E6" stroke="#CBD5E1" stroke-width="1"/>
<line x1="510" y1="122" x2="510" y2="150" stroke="#0F766E" stroke-width="2"/>
<text x="510" y="118" font-size="10" fill="#0F766E" font-weight="600" text-anchor="middle">alert 2 · 8 s</text>
<rect x="510" y="128" width="137.5" height="16" rx="0" fill="#FDE2E2" stroke="#CBD5E1" stroke-width="1"/>
<line x1="647.5" y1="122" x2="647.5" y2="150" stroke="#0F766E" stroke-width="2"/>
<text x="647.5" y="118" font-size="10" fill="#0F766E" font-weight="600" text-anchor="middle">alert 3 · 13 s</text>
<rect x="647.5" y="128" width="137.5" height="16" rx="0" fill="#FDE2E2" stroke="#D2553F" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="785" y1="122" x2="785" y2="150" stroke="#D2553F" stroke-width="2"/>
<text x="791" y="140" font-size="10.5" fill="#D2553F" font-weight="600">forced deceleration · 18 s</text>
<text x="40" y="210" font-size="12" fill="#0F172A" font-weight="700">Model unsure, or no camera</text>
<text x="40" y="225" font-size="10" fill="#475569">wheel-touch policy (after 10 s with std &gt; 0.3)</text>
<rect x="290" y="198" width="137.5" height="16" rx="0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<line x1="427.5" y1="192" x2="427.5" y2="220" stroke="#D97706" stroke-width="2"/>
<text x="427.5" y="188" font-size="10" fill="#D97706" font-weight="600" text-anchor="middle">alert 1 · 5 s</text>
<rect x="427.5" y="198" width="275" height="16" rx="0" fill="#FFF7E6" stroke="#CBD5E1" stroke-width="1"/>
<line x1="702.5" y1="192" x2="702.5" y2="220" stroke="#D97706" stroke-width="2"/>
<text x="702.5" y="188" font-size="10" fill="#D97706" font-weight="600" text-anchor="middle">alert 2 · 15 s</text>
<rect x="702.5" y="198" width="275" height="16" rx="0" fill="#FDE2E2" stroke="#CBD5E1" stroke-width="1"/>
<line x1="977.5" y1="192" x2="977.5" y2="220" stroke="#D97706" stroke-width="2"/>
<text x="977.5" y="188" font-size="10" fill="#D97706" font-weight="600" text-anchor="middle">alert 3 · 25 s</text>
<rect x="977.5" y="198" width="137.5" height="16" rx="0" fill="#FDE2E2" stroke="#D2553F" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="1115" y1="192" x2="1115" y2="220" stroke="#D2553F" stroke-width="2"/>
<text x="1121" y="210" font-size="10.5" fill="#D2553F" font-weight="600">forced deceleration · 30 s</text>
<line x1="455" y1="104" x2="455" y2="256" stroke="#D2553F" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="461" y="252" font-size="10.5" fill="#D2553F" font-weight="700">SG-08: first alert ≤ 6 s</text>
<text x="290" y="274" font-size="9.5" fill="#475569" text-anchor="middle">0 s</text>
<text x="427.5" y="274" font-size="9.5" fill="#475569" text-anchor="middle">5 s</text>
<text x="565" y="274" font-size="9.5" fill="#475569" text-anchor="middle">10 s</text>
<text x="702.5" y="274" font-size="9.5" fill="#475569" text-anchor="middle">15 s</text>
<text x="840" y="274" font-size="9.5" fill="#475569" text-anchor="middle">20 s</text>
<text x="977.5" y="274" font-size="9.5" fill="#475569" text-anchor="middle">25 s</text>
<text x="1115" y="274" font-size="9.5" fill="#475569" text-anchor="middle">30 s</text>
<text x="1252.5" y="274" font-size="9.5" fill="#475569" text-anchor="middle">35 s</text>
<text x="40" y="300" font-size="11" fill="#475569">At speed the wheel-touch alerts also come by distance: 150, 240 and 395 m (LionDriver, TSR-634), about the vision times at 110 km/h. No alerts below 10 km/h.</text>
<text x="40" y="330" font-size="12" fill="#0F766E" font-weight="700">WHERE IT FALLS SHORT</text>
<text x="40" y="354" font-size="11.5" fill="#0F172A" font-weight="700">Latency not measured</text>
<text x="250" y="354" font-size="10.5" fill="#475569">the first vision alert is at 5 s plus the DM frame and model latency, which is not measured; the 1 s margin to the 6 s budget is TBD (OI-11)</text>
<text x="40" y="388" font-size="11.5" fill="#0F172A" font-weight="700">DM output never invalid</text>
<text x="250" y="388" font-size="10.5" fill="#475569">driverStateV2 is always valid=True, so the TSR-609 take-over request on an invalid DM output (≤ 2 s) cannot happen</text>
<text x="40" y="422" font-size="11.5" fill="#0F172A" font-weight="700">No safe stop</text>
<text x="250" y="422" font-size="10.5" fill="#475569">after the terminal alert the item slows the car but does not disengage or reach a standstill (TSR-633, not met)</text>
<text x="40" y="456" font-size="11.5" fill="#0F172A" font-weight="700">Lockout</text>
<text x="250" y="456" font-size="10.5" fill="#475569">repeated terminal alerts lock out engagement for 1, 5, 15, 30 min</text>
</svg>
