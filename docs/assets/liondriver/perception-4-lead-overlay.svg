<rect x="112.4" y="517.2" width="195.2" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" opacity="0.95"/>
<text x="210" y="533.2" font-size="11" fill="#0F172A" font-weight="700" text-anchor="middle">leadOne: radar track</text>
<text x="210" y="548.2" font-size="10" fill="#475569" text-anchor="middle">dRel 24 m, vRel -3 m/s → opacity 0.70</text>
<line x1="434.7" y1="378.2" x2="641.2" y2="198" stroke="#0F172A" stroke-width="1"/>
<rect x="511.4" y="194" width="259.6" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" opacity="0.95"/>
<text x="641.2" y="210" font-size="11" fill="#0F172A" font-weight="700" text-anchor="middle">leadTwo: vision-only, hidden behind leadOne</text>
<text x="641.2" y="225" font-size="10" fill="#475569" text-anchor="middle">dRel 70 m, vRel +0 m/s → opacity 0.00</text>
<text x="40" y="609.2" font-size="11" fill="#475569">Chevron opacity: 1 − d/40 m inside 40 m, plus closing speed / 10 m/s; none beyond 40 m, only the yellow glow.</text>
<text x="40" y="625.2" font-size="11" fill="#475569">Same camera and calibration as Figure 4 of the driving page; chevron sizes scaled to the camera image, so approximate.</text>
<rect x="847.2" y="104" width="432.8" height="236" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.4"/>
<text x="861.2" y="128" font-size="14" fill="#C2410C" font-weight="700">What the speed planner uses</text>
<text x="861.2" y="156" font-size="12" fill="#0F172A" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">leadOne.dRel</text>
<text x="861.2" y="171" font-size="10.5" fill="#475569">distance, m</text>
<text x="861.2" y="192" font-size="12" fill="#0F172A" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">leadOne.vRel / vLead</text>
<text x="861.2" y="207" font-size="10.5" fill="#475569">closing and lead speed</text>
<text x="861.2" y="228" font-size="12" fill="#0F172A" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">leadOne.aLeadK, aLeadTau</text>
<text x="861.2" y="243" font-size="10.5" fill="#475569">lead acceleration and how fast it fades</text>
<text x="861.2" y="264" font-size="12" fill="#0F172A" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">leadOne.modelProb</text>
<text x="861.2" y="279" font-size="10.5" fill="#475569">how sure the model is (FCW needs &gt; 0.9)</text>
<text x="861.2" y="300" font-size="12" fill="#0F172A" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">leadOne.radar</text>
<text x="861.2" y="315" font-size="10.5" fill="#475569">radar track or vision-only</text>
<rect x="847.2" y="358" width="432.8" height="128" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="861.2" y="382" font-size="14" fill="#0F172A" font-weight="700">What the picture does not show</text>
<text x="861.2" y="404" font-size="11" fill="#475569">whether the chevron is a radar track or the</text>
<text x="861.2" y="420" font-size="11" fill="#475569">model's guess, or how sure either is. Both look</text>
<text x="861.2" y="436" font-size="11" fill="#475569">the same on screen; the safety analysis has to</text>
<text x="861.2" y="452" font-size="11" fill="#475569">use the logged radarState, not the UI.</text>
