<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="645" viewBox="0 0 1320 645" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 4. Leads on screen, and the numbers behind them</title>
<desc>A synthetic road-camera view of a straight highway with two cars ahead and the UI's lead chevrons: leadOne, a radar track at 24 m closing at 3 m/s, drawn opaque; leadTwo, vision-only at 70 m, beyond 40 m, drawn as a glow only. Beside it, the radarState fields the speed planner uses, and a note that the screen does not show which source a lead comes from.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1320" height="645" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 4 · Leads on screen, and the numbers behind them</text>
<text x="40" y="66" font-size="12.5" fill="#475569">The onroad UI draws each lead radard reports as a chevron; size and opacity follow its distance and closing speed.</text>
<text x="1280" y="44" font-size="11" fill="#475569" text-anchor="end">model_renderer.py · radard.py</text>
