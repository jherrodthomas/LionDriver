<path d="M788,186.0 L780,181.5 L780,190.5 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<line x1="1032" y1="186" x2="1052" y2="186" stroke="#475569" stroke-width="1.6"/>
<path d="M1058,186.0 L1050,181.5 L1050,190.5 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<text x="290" y="264" font-size="11" fill="#475569">No planner between the model and the controller: the network's action is the steering command. A lane change is a desire pulse from DesireHelper into the model, not a plan.</text>
<rect x="40" y="344" width="250" height="74" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="50" y="364" font-size="12.5" fill="#0F172A" font-weight="700">MPC (acados)</text>
<text x="50" y="382" font-size="10.5" fill="#475569">follows leads from radard</text>
<text x="50" y="397" font-size="10.5" fill="#475569">radar + vision</text>
<rect x="40" y="430" width="250" height="74" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="50" y="450" font-size="12.5" fill="#0F172A" font-weight="700">Cruise</text>
<text x="50" y="468" font-size="10.5" fill="#475569">toward set speed, a ≥ -1.2 m/s²</text>
<text x="50" y="483" font-size="10.5" fill="#475569">a ≤ 1.6…0.6 m/s² by speed</text>
<rect x="40" y="516" width="250" height="74" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="50" y="536" font-size="12.5" fill="#475569" font-weight="700">Model's own acceleration</text>
<text x="50" y="554" font-size="10.5" fill="#475569">Experimental Mode only</text>
<text x="50" y="569" font-size="10.5" fill="#475569">off by default (FM-01 a)</text>
<rect x="360" y="424" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="370" y="444" font-size="12.5" fill="#0F172A" font-weight="700">min()</text>
<text x="370" y="462" font-size="10.5" fill="#475569">lowest acceleration</text>
<text x="370" y="477" font-size="10.5" fill="#475569">wins</text>
<line x1="292" y1="381" x2="352" y2="467" stroke="#475569" stroke-width="1.6"/>
<path d="M358,467.0 L350,462.5 L350,471.5 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
