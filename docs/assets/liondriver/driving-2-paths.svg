<line x1="292" y1="553" x2="352" y2="467" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M358,467.0 L350,462.5 L350,471.5 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<rect x="560" y="424" width="200" height="86" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="570" y="444" font-size="12.5" fill="#0F172A" font-weight="700">Clip and publish</text>
<text x="570" y="462" font-size="10.5" fill="#475569">ACCEL_MIN … ACCEL_MAX</text>
<text x="570" y="477" font-size="10.5" fill="#475569">longitudinalPlan.aTarget</text>
<rect x="790" y="424" width="240" height="86" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.4"/>
<text x="800" y="444" font-size="12.5" fill="#0F172A" font-weight="700">Checks + controller</text>
<text x="800" y="462" font-size="10.5" fill="#475569">fresh and finite (TSR-602)</text>
<text x="800" y="477" font-size="10.5" fill="#475569">longcontrol, 100 Hz</text>
<rect x="1060" y="424" width="220" height="86" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.4"/>
<text x="1070" y="444" font-size="12.5" fill="#0F172A" font-weight="700">Panda + PCM</text>
<text x="1070" y="462" font-size="10.5" fill="#475569">ACC_CONTROL 0x343</text>
<text x="1070" y="477" font-size="10.5" fill="#475569">accel bounds (Figure 3)</text>
