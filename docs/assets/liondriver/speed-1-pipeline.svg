<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="576" viewBox="0 0 1320 576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 1. Speed planning, from leads to the brake</title>
<desc>Leads from radard feed the MPC; the MPC, the cruise target and, in Experimental Mode only, the model's own acceleration go into min(); the result is clipped to −3.5 … +2.0 m/s², then the controller, card (0x343 at 33 Hz), the panda envelope and the PCM. SOTIF hazards SH-03, SH-04 and SH-06 sit at the leads, SH-09 at the model's acceleration and SH-11 at the controller; FM-09, FM-01 and FM-11 at the MPC, the model's acceleration and the controller.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1320" height="576" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 1 · Speed planning, from leads to the brake</text>
<text x="40" y="66" font-size="12.5" fill="#475569">Three candidate accelerations, the lowest wins; then clips, the controller, and the panda's bounds. Chips mark the SOTIF hazards (red) and modifications (amber) at each step.</text>
<text x="1280" y="44" font-size="11" fill="#475569" text-anchor="end">WP-C-05 · WP-C-07 · long_mpc.py</text>
<line x1="40" y1="82" x2="1280" y2="82" stroke="#E2E8F0" stroke-width="1"/>
<rect x="40" y="110" width="200" height="112" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="50" y="130" font-size="12.5" fill="#0F172A" font-weight="700">Leads (radard)</text>
<text x="50" y="147" font-size="10.5" fill="#475569">stock radar track matched</text>
<text x="50" y="161.5" font-size="10.5" fill="#475569">to the model's lead, or</text>
<text x="50" y="176" font-size="10.5" fill="#475569">vision-only if prob &gt; 0.5</text>
<rect x="50" y="198" width="41" height="16" rx="8.0" fill="#D2553F" stroke="none" stroke-width="1"/>
<text x="70.5" y="209.4" font-size="9.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">SH-03</text>
<rect x="96" y="198" width="41" height="16" rx="8.0" fill="#D2553F" stroke="none" stroke-width="1"/>
<text x="116.5" y="209.4" font-size="9.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">SH-04</text>
<rect x="142" y="198" width="41" height="16" rx="8.0" fill="#D2553F" stroke="none" stroke-width="1"/>
<text x="162.5" y="209.4" font-size="9.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">SH-06</text>
<rect x="290" y="110" width="230" height="112" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="300" y="130" font-size="12.5" fill="#0F172A" font-weight="700">MPC (acados, SQP_RTI)</text>
<text x="300" y="147" font-size="10.5" fill="#475569">12 steps to 10 s, jerk input</text>
<text x="300" y="161.5" font-size="10.5" fill="#475569">keeps the follow distance</text>
<text x="300" y="176" font-size="10.5" fill="#475569">of Figure 2</text>
<rect x="300" y="198" width="41" height="16" rx="8.0" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="320.5" y="209.4" font-size="9.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">FM-09</text>
<rect x="290" y="238" width="230" height="74" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="300" y="258" font-size="12.5" fill="#0F172A" font-weight="700">Cruise target</text>
<text x="300" y="275" font-size="10.5" fill="#475569">toward set speed, -1.2 … 1.6 m/s²</text>
<text x="300" y="289.5" font-size="10.5" fill="#475569">less with speed (Figure 3)</text>
<rect x="290" y="328" width="230" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="300" y="348" font-size="12.5" fill="#475569" font-weight="700">Model's own acceleration</text>
<text x="300" y="365" font-size="10.5" fill="#475569">Experimental Mode only;</text>
<text x="300" y="379.5" font-size="10.5" fill="#475569">off by default</text>
<rect x="300" y="400" width="41" height="16" rx="8.0" fill="#D2553F" stroke="none" stroke-width="1"/>
<text x="320.5" y="411.4" font-size="9.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">SH-09</text>
<rect x="346" y="400" width="41" height="16" rx="8.0" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="366.5" y="411.4" font-size="9.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">FM-01</text>
<rect x="570" y="192" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="580" y="212" font-size="12.5" fill="#0F172A" font-weight="700">min()</text>
<text x="580" y="229" font-size="10.5" fill="#475569">lowest wins</text>
<rect x="750" y="182" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="760" y="202" font-size="12.5" fill="#0F172A" font-weight="700">Clip</text>
<text x="760" y="219" font-size="10.5" fill="#475569">-3.5 … +2 m/s²</text>
<text x="760" y="233.5" font-size="10.5" fill="#475569">longitudinalPlan, 20 Hz</text>
<rect x="980" y="110" width="300" height="112" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.4"/>
<text x="990" y="130" font-size="12.5" fill="#0F172A" font-weight="700">Controller (controlsd)</text>
<text x="990" y="147" font-size="10.5" fill="#475569">longcontrol: off / pid / stopping;</text>
<text x="990" y="161.5" font-size="10.5" fill="#475569">feedforward + integral, 100 Hz;</text>
<text x="990" y="176" font-size="10.5" fill="#475569">stock-AEB stand-down (LionDriver)</text>
<rect x="990" y="198" width="41" height="16" rx="8.0" fill="#D2553F" stroke="none" stroke-width="1"/>
<text x="1010.5" y="209.4" font-size="9.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">SH-11</text>
<rect x="1036" y="198" width="41" height="16" rx="8.0" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="1056.5" y="209.4" font-size="9.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">FM-11</text>
<rect x="980" y="246" width="300" height="76" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="990" y="266" font-size="12.5" fill="#0F172A" font-weight="700">card → 0x343 ACC_CONTROL</text>
<text x="990" y="283" font-size="10.5" fill="#475569">33 Hz; final rate ≤ 4.5 m/s³</text>
<text x="990" y="297.5" font-size="10.5" fill="#475569">(carcontroller)</text>
<rect x="980" y="342" width="300" height="76" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.4"/>
<text x="990" y="362" font-size="12.5" fill="#0F172A" font-weight="700">Panda envelope</text>
<text x="990" y="379" font-size="10.5" fill="#475569">-3.5 … +2 m/s²; revoke if no frame</text>
<text x="990" y="393.5" font-size="10.5" fill="#475569">for 100 ms; only while engaged</text>
<rect x="980" y="438" width="300" height="66" rx="8" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
<text x="990" y="458" font-size="12.5" fill="#0F172A" font-weight="700">PCM and stock PCS/AEB</text>
<text x="990" y="475" font-size="10.5" fill="#475569">own ACC envelope (AOU-05);</text>
<text x="990" y="489.5" font-size="10.5" fill="#475569">AEB kept (AOU-04)</text>
