<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="644" viewBox="0 0 1320 644" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 1. Camera to CAN: the driving pipeline</title>
<desc>The LionDriver driving pipeline from cameras through the driving model, controls, car interface and the panda safety envelope to the EPS and PCM, with lead tracking, the speed planner, settings, state and driver monitoring below. Chips name the WP-C-07 functional modifications that change each process: cam: none; modeld: FM-02, FM-09; monitor: FM-08, FM-09; controlsd: FM-03, FM-04, FM-06, FM-09; card: FM-07, FM-10, FM-11; panda: FM-10; car: none; radard: none; plannerd: FM-01, FM-09; params: FM-01, FM-06; selfdrived: FM-02, FM-03, FM-04, FM-07; dm: FM-05, FM-06.</desc>
