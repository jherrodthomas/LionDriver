<text x="40" y="572" font-size="11.5" fill="#475569">Steering has no separate path planner: the model's desiredCurvature goes straight to controlsd. Speed goes through plannerd's MPC. Every limit on what reaches the car is enforced again in the panda.</text>
<text x="40" y="590" font-size="11.5" fill="#475569">A box's chips are the WP-C-07 modifications whose Affected code names one of its files. The dashed box is the new monitor FM-09 proposes (and FM-08's ODD monitor); it does not exist yet.</text>
