<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 1 · Camera to CAN: the driving pipeline</text>
<text x="40" y="66" font-size="12.5" fill="#475569">Every process talks over openpilot's own publish-subscribe messaging (cereal on msgq), not ROS. Chips mark where each WP-C-07 modification lands.</text>
