<text x="40" y="66" font-size="12.5" fill="#475569">A lead at 25 m/s braking at 3 m/s² now: the MPC lets that braking fade, at a rate radard sets (tau).</text>
<text x="1280" y="44" font-size="11" fill="#475569" text-anchor="end">long_mpc.py extrapolate_lead · radard.py</text>
