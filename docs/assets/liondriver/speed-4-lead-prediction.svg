<text x="536.4" y="291" font-size="10.5" fill="#475569" font-weight="600">constant braking</text>
<text x="980" y="112" font-size="12" fill="#0F172A" font-weight="700">The formula</text>
<text x="980" y="128" font-size="10.5" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">a(t) = a₀ · exp(−tau · t² / 2)</text>
<text x="980" y="150" font-size="10.5" fill="#475569">speed and position summed over the steps</text>
<text x="980" y="172" font-size="12" fill="#0F172A" font-weight="700">The steps</text>
<text x="980" y="188" font-size="10.5" fill="#475569">13 points at 10·(i/12)² s</text>
<text x="980" y="210" font-size="12" fill="#0F172A" font-weight="700">Radar track</text>
<text x="980" y="226" font-size="10.5" fill="#475569">tau = 1.5 while |a| &lt; 0.5 m/s²;</text>
<text x="980" y="248" font-size="10.5" fill="#475569">braking harder, tau falls toward 0 (0.45 s filter):</text>
<text x="980" y="270" font-size="10.5" fill="#475569">the longer it brakes, the longer it is assumed to</text>
<text x="980" y="292" font-size="12" fill="#0F172A" font-weight="700">Vision-only</text>
<text x="980" y="308" font-size="10.5" fill="#475569">tau fixed at 0.3</text>
<text x="980" y="330" font-size="12" fill="#0F172A" font-weight="700">No lead</text>
<text x="980" y="346" font-size="10.5" fill="#475569">a phantom lead 50 m ahead, 10 m/s faster</text>
<text x="40" y="486" font-size="11" fill="#475569">Just after a radar lead starts braking, the MPC expects most of it to fade; each new plan, 20 times a second, sees the new measurement and a smaller tau.</text>
</svg>
