<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="504" viewBox="0 0 1320 504" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 4. What the MPC assumes the lead will do</title>
<desc>Predicted speed of a lead at 25 m/s braking at 3 m/s², over the MPC's 13 time steps to 10 s: with tau 1.5 (radar, braking just seen) most of the braking fades; with the vision-only tau 0.3 less fades; after 1 s of radar braking tau is about 0.18 and the prediction approaches constant braking, also shown.</desc>
