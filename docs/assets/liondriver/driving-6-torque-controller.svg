<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="556" viewBox="0 0 1320 556" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 6. From curvature to torque: the steering controller</title>
<desc>The torque controller: desired curvature times speed squared is buffered; the setpoint is the request from the learned actuator delay ago; the measurement is the vehicle model's curvature from the steering angle times speed squared; the error goes to a PID with speed-scheduled Kp (250 to 0.8) and Ki 0.15; the feedforward is the future request less roll and offset plus friction; the sum is converted to torque per car and clipped.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1320" height="556" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 6 · From curvature to torque: the steering controller</text>
<text x="40" y="66" font-size="12.5" fill="#475569">latcontrol_torque.py, 100 times a second. It works in lateral acceleration and converts to torque only at the end.</text>
<text x="1280" y="44" font-size="11" fill="#475569" text-anchor="end">latcontrol_torque.py · LatControlTorque.update</text>
<line x1="40" y1="82" x2="1280" y2="82" stroke="#E2E8F0" stroke-width="1"/>
<rect x="40" y="112" width="210" height="78" rx="8" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
<text x="50" y="131" font-size="12" fill="#0F172A" font-weight="700">Desired curvature</text>
<text x="50" y="147" font-size="10.5" fill="#475569">action.desiredCurvature</text>
<text x="50" y="161" font-size="10.5" fill="#475569">from the driving model</text>
<rect x="300" y="112" width="250" height="78" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="310" y="131" font-size="12" fill="#0F172A" font-weight="700">Request buffer</text>
<text x="310" y="147" font-size="10.5" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">κ × v² = lateral accel</text>
<text x="310" y="161" font-size="10.5" fill="#475569">last 1 s kept, 100 Hz</text>
<rect x="600" y="112" width="290" height="78" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="610" y="131" font-size="12" fill="#0F172A" font-weight="700">Setpoint</text>
<text x="610" y="147" font-size="10.5" fill="#475569">the request from lat_delay ago</text>
<text x="610" y="161" font-size="10.5" fill="#475569">(learned actuator delay)</text>
<rect x="40" y="250" width="210" height="78" rx="8" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
<text x="50" y="269" font-size="12" fill="#0F172A" font-weight="700">Steering angle</text>
<text x="50" y="285" font-size="10.5" fill="#475569">carState.steeringAngleDeg</text>
<text x="50" y="299" font-size="10.5" fill="#475569">and roll, from the car</text>
<rect x="300" y="250" width="250" height="78" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="310" y="269" font-size="12" fill="#0F172A" font-weight="700">Measurement</text>
<text x="310" y="285" font-size="10.5" fill="#475569">vehicle model curvature</text>
<text x="310" y="299" font-size="10.5" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">× v² = lateral accel now</text>
<rect x="600" y="250" width="290" height="78" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="610" y="269" font-size="12" fill="#0F172A" font-weight="700">Error = setpoint − measurement</text>
<text x="610" y="285" font-size="10.5" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">in m/s², not in torque</text>
<rect x="300" y="392" width="590" height="92" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="310" y="411" font-size="12" fill="#0F172A" font-weight="700">Feedforward</text>
<text x="310" y="427" font-size="10.5" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">future request − roll · g − latAccelOffset</text>
<text x="310" y="441" font-size="10.5" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">+ friction(error + 0.3 · jerk), jerk filtered at 1.2 Hz, 0.19 s ahead</text>
<text x="310" y="455" font-size="10.5" fill="#475569">(latAccelFactor, latAccelOffset, friction learned per car)</text>
<rect x="940" y="210" width="340" height="128" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="950" y="229" font-size="12" fill="#0F172A" font-weight="700">PID in lateral acceleration</text>
<text x="950" y="245" font-size="10.5" fill="#475569">Kp by speed: 250 at 1 m/s … 0.8 at 30 m/s</text>
<text x="950" y="259" font-size="10.5" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">Ki = 0.15</text>
<text x="950" y="273" font-size="10.5" fill="#475569">integrator frozen when the panda limits the</text>
<text x="950" y="287" font-size="10.5" fill="#475569">torque, the driver steers, or v &lt; 5 m/s</text>
<text x="950" y="301" font-size="10.5" fill="#475569" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">output = PID + feedforward</text>
<rect x="940" y="398" width="340" height="80" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.4"/>
<text x="950" y="417" font-size="12" fill="#0F172A" font-weight="700">To torque</text>
<text x="950" y="433" font-size="10.5" fill="#475569">torque_from_lateral_accel (per car)</text>
<text x="950" y="447" font-size="10.5" fill="#475569">→ clip → STEERING_LKA 0x2E4</text>
<line x1="252" y1="151" x2="298" y2="151" stroke="#475569" stroke-width="1.5"/>
<path d="M298.0,151.0 L290.6,154.1 L290.6,147.9 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<line x1="552" y1="151" x2="598" y2="151" stroke="#475569" stroke-width="1.5"/>
<path d="M598.0,151.0 L590.6,154.1 L590.6,147.9 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<line x1="252" y1="289" x2="298" y2="289" stroke="#475569" stroke-width="1.5"/>
<path d="M298.0,289.0 L290.6,292.1 L290.6,285.9 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<line x1="552" y1="289" x2="598" y2="289" stroke="#475569" stroke-width="1.5"/>
<path d="M598.0,289.0 L590.6,292.1 L590.6,285.9 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<line x1="745" y1="192" x2="745" y2="248" stroke="#475569" stroke-width="1.5"/>
<path d="M745.0,248.0 L741.9,240.6 L748.1,240.6 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<line x1="892" y1="289" x2="938" y2="289" stroke="#475569" stroke-width="1.5"/>
<path d="M938.0,289.0 L930.6,292.1 L930.6,285.9 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<path d="M300,176 L276,176 L276,438 L292,438" stroke="#475569" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
<line x1="290" y1="438" x2="298" y2="438" stroke="#475569" stroke-width="1.5"/>
<path d="M298.0,438.0 L290.6,441.1 L290.6,434.9 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<text x="270" y="384" font-size="9.5" fill="#0F172A" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">future request</text>
<path d="M892,422 L916,422 L916,320 L930,320" stroke="#475569" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
<line x1="928" y1="320" x2="938" y2="320" stroke="#475569" stroke-width="1.5"/>
<path d="M938.0,320.0 L930.6,323.1 L930.6,316.9 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<line x1="1110" y1="340" x2="1110" y2="396" stroke="#475569" stroke-width="1.5"/>
<path d="M1110.0,396.0 L1106.9,388.6 L1113.1,388.6 Z" stroke="#475569" stroke-width="1" fill="#475569" stroke-linejoin="round"/>
<text x="40" y="512" font-size="11.5" fill="#475569">There is no path search in steering: the learned model chooses the curvature, and this controller only tracks it. The panda then limits the torque (Figure 3).</text>
<rect x="40" y="528" width="14" height="12" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.2"/>
<text x="60" y="538" font-size="11" fill="#475569">input</text>
<rect x="99.2" y="528" width="14" height="12" rx="3" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
<text x="119.2" y="538" font-size="11" fill="#475569">computation</text>
<rect x="194.2" y="528" width="14" height="12" rx="3" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.2"/>
<text x="214.2" y="538" font-size="11" fill="#475569">to the car</text>
</svg>
