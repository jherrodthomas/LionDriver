<text x="40" y="44" font-size="20" fill="#0F172A" font-weight="700">Figure 1 · Perception: what the two models see and what they output</text>
<text x="40" y="66" font-size="12.5" fill="#475569">Cameras, the driving model (AI-1) and the driver-monitoring model (AI-3), each output and who uses it. Chips are the WP-C-11 AI requirements on that output.</text>
<text x="1280" y="44" font-size="11" fill="#475569" text-anchor="end">WP-C-11 §2.1, §2.4, §6</text>
