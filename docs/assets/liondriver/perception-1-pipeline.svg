<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="644" viewBox="0 0 1320 644" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Figure 1. Perception: what the two models see and what they output</title>
<desc>Road cameras feed the driving model AI-1 and the cabin camera feeds the driver-monitoring model AI-3. AI-1's outputs: the steering action (direct lateral command), leads (longitudinal via the MPC), the model's own acceleration (Experimental only), meta including hardBrakePredicted (warning), plan, lane lines and road edges (indirect) and camera odometry (indirect). AI-3 outputs driverStateV2 (alerts, force-decel, lockout). Each carries chips for its WP-C-11 AI requirements, coloured by status: AIR-01 grey; AIR-18 red; AIR-03 grey; AIR-04 grey; AIR-05 grey; AIR-11 grey; AIR-29 amber; AIR-06 grey; AIR-13 grey; AIR-07 grey; AIR-08 grey; AIR-15 red.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#CBD5E1" stroke-width="2"/></pattern></defs>
