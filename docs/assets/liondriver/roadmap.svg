    <linearGradient id="road-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1A31"/><stop offset="1" stop-color="#070D1A"/></linearGradient>
    <linearGradient id="road-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A97A2A"/><stop offset="0.5" stop-color="#F6DC97"/><stop offset="1" stop-color="#A97A2A"/></linearGradient>
  </defs>
