<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="road-t road-d">
  <title id="road-t">LionDriver roadmap</title>
  <desc id="road-d">Roadmap. Phase 01, Foundation (Active): Project governance, Safety management plan, Upstream baseline review, Assurance data model, Traceability infrastructure. Phase 02, Safety Engineering (Active): Hazard analysis, Functional safety concept, SOTIF analysis, Cybersecurity analysis, AI safety assessment, Architecture analysis. Phase 03, Implementation and Verification (Planned): Safety mechanisms, Automated verification, Regression testing, Simulation, Fault injection, Evidence generation. Phase 04, Expanded Assurance (Planned): More evaluated vehicles, Independent review, Safety-case maturity, Continuous assurance, Community contributions.</desc>
