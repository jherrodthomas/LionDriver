<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="t d">
  <title id="t">LionDriver safety lifecycle (V-model)</title>
  <desc id="d">Left arm, top to bottom: item definition, HARA and safety goals, functional safety concept, technical safety concept, hardware and software safety requirements. Bottom: implementation. Right arm, bottom to top: unit verification with equivalence and mutation testing, hardware and software integration, item integration and testing, safety validation, safety case and assessment. Each right-arm stage verifies or validates the left-arm stage opposite it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1C"/>
      <stop offset="1" stop-color="#121B31"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8391AB"/>
    </marker>
    <style>
      .h { font: 700 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F7F8FB; }
      .c { font: 600 11.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .t { font: 700 24px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F7F8FB; }
      .s { font: 500 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #C9D2E3; }
      .tr { font: 600 11px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8391AB; letter-spacing: 1px; }
      .L { fill: #F5B83D; fill-opacity: 0.08; stroke: #F5B83D; stroke-opacity: 0.6; }
      .R { fill: #6EE7B7; fill-opacity: 0.07; stroke: #6EE7B7; stroke-opacity: 0.55; }
      .I { fill: #5CC8FF; fill-opacity: 0.08; stroke: #5CC8FF; stroke-opacity: 0.6; }
    </style>
  </defs>
  <rect width="1280" height="660" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" class="t">Safety lifecycle</text>
  <text x="40" y="78" class="s">Every requirement on the left is verified or validated by the stage across from it on the right.</text>

  <!-- traceability lines (drawn first, under the boxes) -->
  <g stroke="#8391AB" stroke-opacity="0.55" stroke-dasharray="4 6" stroke-width="1.5">
    <path d="M290 146 H990"/><path d="M360 226 H920"/><path d="M430 306 H850"/><path d="M500 386 H780"/><path d="M570 466 H710"/>
  </g>
  <g class="tr" text-anchor="middle">
    <text x="640" y="140">ARGUED IN</text><text x="640" y="220">VALIDATED BY</text><text x="640" y="300">VERIFIED BY</text><text x="640" y="380">VERIFIED BY</text><text x="640" y="460">VERIFIED BY</text>
  </g>

  <!-- left arm -->
  <g>
    <rect x="40" y="118" width="250" height="56" rx="12" class="L"/>
    <text x="56" y="142" class="h">Item definition</text><text x="56" y="162" class="c" fill="#FFD27A">ISO 26262-3 §5</text>
    <rect x="110" y="198" width="250" height="56" rx="12" class="L"/>
    <text x="126" y="222" class="h">HARA · safety goals</text><text x="126" y="242" class="c" fill="#FFD27A">26262-3 §6 · 21448 §6</text>
    <rect x="180" y="278" width="250" height="56" rx="12" class="L"/>
    <text x="196" y="302" class="h">Functional safety concept</text><text x="196" y="322" class="c" fill="#FFD27A">ISO 26262-3 §7</text>
    <rect x="250" y="358" width="250" height="56" rx="12" class="L"/>
    <text x="266" y="382" class="h">Technical safety concept</text><text x="266" y="402" class="c" fill="#FFD27A">ISO 26262-4 §6</text>
    <rect x="320" y="438" width="250" height="56" rx="12" class="L"/>
    <text x="336" y="462" class="h">HW / SW safety reqs</text><text x="336" y="482" class="c" fill="#FFD27A">26262-5 §6 · 26262-6 §6</text>
  </g>

  <!-- implementation -->
  <rect x="515" y="534" width="250" height="56" rx="12" class="I"/>
  <text x="531" y="558" class="h">Implementation</text><text x="531" y="578" class="c" fill="#9FDDFF">openpilot · panda · opendbc</text>

  <!-- right arm -->
  <g>
    <rect x="710" y="438" width="250" height="56" rx="12" class="R"/>
    <text x="726" y="462" class="h">Unit · equivalence · mutation</text><text x="726" y="482" class="c" fill="#A7F3D0">ISO 26262-6 §9</text>
    <rect x="780" y="358" width="250" height="56" rx="12" class="R"/>
    <text x="796" y="382" class="h">HW / SW integration · HIL</text><text x="796" y="402" class="c" fill="#A7F3D0">26262-6 §10 · 26262-5 §10</text>
    <rect x="850" y="278" width="250" height="56" rx="12" class="R"/>
    <text x="866" y="302" class="h">Item integration and test</text><text x="866" y="322" class="c" fill="#A7F3D0">ISO 26262-4 §7</text>
    <rect x="920" y="198" width="250" height="56" rx="12" class="R"/>
    <text x="936" y="222" class="h">Safety validation</text><text x="936" y="242" class="c" fill="#A7F3D0">26262-4 §8 · 21448 §9–11</text>
    <rect x="990" y="118" width="250" height="56" rx="12" class="R"/>
    <text x="1006" y="142" class="h">Safety case · assessment</text><text x="1006" y="162" class="c" fill="#A7F3D0">26262-2 §6 · UL 4600</text>
  </g>

  <!-- flow arrows along the V -->
  <g stroke="#8391AB" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M165 174 V194"/><path d="M235 254 V274"/><path d="M305 334 V354"/><path d="M375 414 V434"/>
    <path d="M445 494 V562 H511"/>
    <path d="M765 562 H835 V498"/>
    <path d="M905 438 V418"/><path d="M975 358 V338"/><path d="M1045 278 V258"/><path d="M1115 198 V178"/>
  </g>

  <!-- status markers -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">
    <rect x="216" y="128" width="64" height="20" rx="10" fill="#F5B83D"/><text x="248" y="142" text-anchor="middle" fill="#1A1306">ACTIVE</text>
    <rect x="286" y="208" width="64" height="20" rx="10" fill="#F5B83D"/><text x="318" y="222" text-anchor="middle" fill="#1A1306">ACTIVE</text>
    <rect x="874" y="468" width="76" height="20" rx="10" fill="#6EE7B7"/><text x="912" y="482" text-anchor="middle" fill="#052E1F">EVIDENCE</text>
  </g>

  <!-- legend -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#C9D2E3">
    <rect x="40" y="610" width="14" height="14" rx="3" class="L"/><text x="62" y="622">Requirements and design</text>
    <rect x="250" y="610" width="14" height="14" rx="3" class="R"/><text x="272" y="622">Verification and validation</text>
    <rect x="474" y="610" width="34" height="14" rx="7" fill="#F5B83D"/><text x="516" y="622">In progress</text>
    <rect x="622" y="610" width="34" height="14" rx="7" fill="#6EE7B7"/><text x="664" y="622">First evidence exists (Toyota safety mode)</text>
  </g>
</svg>
