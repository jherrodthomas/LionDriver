    - SWF-ACT-002
- id: SWF-004
  element: SWF-SE-007
  function: SWF-FN-003
  failure_mode: Step change of deceleration request to the minimum is passed
  guideword: early
  effects:
  - level: local
    description: Request jumps from 0 to -3.5 m/s² in one frame
  - level: next_higher
    description: Hard braking without onset
  - level: end
    description: Unexpected hard braking; rear-end collision by following traffic
    hazard: HZ-006
    severity: 10
  severity: 10
  causes:
  - id: SWF-004.C1
    description: longitudinal_accel_checks checks the range only; no rate or jerk limit on acceleration requests
    element: SWF-SE-007
    prevention_controls:
    - description: Range check only (longitudinal.h:8-12); FSC FSR-021 asks for a jerk envelope
      ref: opendbc_repo/opendbc/safety/longitudinal.h
    detection_controls:
    - description: No test targets this cause
