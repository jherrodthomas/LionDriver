# yaml-language-server: $schema=../schema/fmea.schema.json
# Ratings per RT-1. Implementation-defect causes in the opendbc safety core: O=5 (MISRA, 100% line coverage, review, no
# documented requirements), D=6 (tests killed 2705/2705 operator mutants at BL-001 in this workspace, but the suite is not run
# by LionDriver CI and mutation does not cover constants or panda board code). Design gaps found in this review: O=8, D=9.
schema_version: 1
analysis:
  id: SWF
  type: sw_fmea
  title: "SW FMEA — safety-relevant software elements"
  revision: "0.2"
  status: draft
  baseline: BL-001
  rating_tables: RT-1
  scope: "P1 element: panda safety model (opendbc safety core, Toyota mode, panda firmware integration) for AC-001 at BL-001 (panda 92eb565, opendbc 229dc70). Other P1 elements (selfdrived, controlsd, pandad) follow."
  team:
    - {name: Jherrod Thomas, role: "Project maintainer, safety lead (reviewer/approver)"}
    - {name: Claude (AI assistant), role: "Drafting assistance; ratings require human review"}
  references:
    - docs/safety/fmea-plan.md
    - docs/safety/rating-tables.md
    - docs/safety/analyses/fsc.yaml
    - docs/safety/design/panda-config-lock-and-fw-authenticity.md
  updated: 2026-10-10
structure:
- id: SWF-SE-001
  name: Panda safety model (opendbc safety + panda firmware integration)
  kind: sw_element
  parent: null
  paths:
  - opendbc_repo/opendbc/safety
  - panda/board
  description: FSC element EL-07 software; System FMEA SFM-SE-003
- id: SWF-SE-002
  name: RX validation and RX timing checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: rx_msg_safety_check, is_msg_valid, safety_tick (safety.h:112-228, 321-344)
- id: SWF-SE-003
  name: TX whitelist and dispatch
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: safety_tx_hook, tx_msg_safety_check (safety.h:230-253)
- id: SWF-SE-004
  name: Forwarding hook
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: safety_fwd_hook, get_fwd_bus (safety.h:255-289)
- id: SWF-SE-005
  name: Controls-allowed logic
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: generic_rx_checks, pcm_cruise_check (safety.h:350-370, 518-527)
- id: SWF-SE-006
  name: Steering torque checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/lateral.h
  description: steer_torque_cmd_checks, dist_to_meas_check, rt_torque_rate_limit_check (lateral.h:10-150)
- id: SWF-SE-007
  name: Longitudinal checks
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/longitudinal.h
  description: get_longitudinal_allowed, longitudinal_accel_checks (longitudinal.h:3-12)
- id: SWF-SE-008
  name: Toyota safety mode
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/modes/toyota.h
  description: toyota_rx_hook, toyota_tx_hook, toyota_init, TX/RX check tables (toyota.h)
- id: SWF-SE-009
  name: Relay malfunction detection
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: stock_ecu_check, relay_malfunction (safety.h:346, 372-385)
- id: SWF-SE-010
  name: Safety mode registry and initialization
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - opendbc_repo/opendbc/safety/safety.h
  description: set_safety_hooks (safety.h:391-484)
- id: SWF-SE-011
  name: 'Panda main loop: safety mode and heartbeat'
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/main.c
  description: set_safety_mode, tick_handler heartbeat and mismatch logic (main.c:31-76, 101-230)
- id: SWF-SE-012
  name: Panda host command handler
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/main_comms.h
  description: 0xdc set safety mode, 0xdf alternative experience, 0xd1 bootloader, 0xf3 heartbeat (main_comms.h)
- id: SWF-SE-013
  name: Panda CAN send path
  kind: sw_unit
  parent: SWF-SE-001
  paths:
  - panda/board/drivers/can_common.h
  - panda/board/can_comms.h
  description: can_send with skip_tx_hook (can_common.h:161-176); host TX entry (can_comms.h:97,118)
functions:
- id: SWF-FN-001
  element: SWF-SE-003
  description: Transmit only whitelisted messages, each passed through the mode-specific check
  requirements:
  - FSR-002
  - FSR-019
  - FSR-022
- id: SWF-FN-002
  element: SWF-SE-006
  description: Block steering requests outside torque magnitude, rate and measured-torque-error limits, and any torque while controls are not allowed
  requirements:
  - FSR-002
  - FSR-005
  - FSR-032
- id: SWF-FN-003
  element: SWF-SE-007
  description: Block acceleration outside the range, and any non-inactive acceleration while controls are not allowed or the accelerator is pressed
  requirements:
  - FSR-019
  - FSR-022
  - FSR-024
- id: SWF-FN-004
  element: SWF-SE-005
  description: Allow controls on rising edge of PCM cruise; withdraw on cruise off, brake press, invalid or lagging safety messages
  requirements:
  - FSR-005
  - FSR-029
  - FSR-035
- id: SWF-FN-005
  element: SWF-SE-002
  description: Validate safety-relevant RX messages (checksum, counter, quality flag, timing)
  requirements:
  - FSR-005
  - FSR-029
- id: SWF-FN-006
  element: SWF-SE-008
  description: 'Decode Toyota vehicle state: EPS torque, cruise state, brake, accelerator, wheel speeds'
  requirements:
  - FSR-002
  - FSR-029
- id: SWF-FN-007
  element: SWF-SE-004
  description: Block stock-camera messages the item replaces; forward all others, including stock pre-collision messages
  requirements:
  - FSR-037
  - FSR-038
- id: SWF-FN-008
  element: SWF-SE-009
  description: Detect a relay malfunction and block all item transmission
  requirements:
  - FSR-008
- id: SWF-FN-009
  element: SWF-SE-010
  description: Install only the safety model and parameter intended for the vehicle
  requirements:
  - FSR-010
- id: SWF-FN-010
  element: SWF-SE-011
  description: Withdraw controls when the host heartbeat is lost or reports not engaged
  requirements:
  - FSR-007
- id: SWF-FN-011
  element: SWF-SE-012
  description: Accept host configuration commands only when they cannot widen what is transmitted
  requirements:
  - FSR-010
- id: SWF-FN-012
  element: SWF-SE-013
  description: Route every host transmission through the safety check
  requirements:
  - FSR-002
failure_modes:
- id: SWF-001
  element: SWF-SE-006
  function: SWF-FN-002
  failure_mode: Steering request above the torque or torque-rate limit for the vehicle is passed
  guideword: value_high
  effects:
  - level: local
    description: Out-of-envelope torque request reaches the EPS
  - level: next_higher
    description: Lateral deviation faster than the driver can correct
  - level: end
    description: Uncontrollable steering intervention
    hazard: HZ-002
    severity: 10
  severity: 10
  causes:
  - id: SWF-001.C1
    description: Panda torque limits (max 1500, rate up 15 / down 25, error 350) are the same constants as the SoC controller's and are not derived from a vehicle
      envelope
    element: SWF-SE-008
    prevention_controls:
    - description: Limits copied from upstream vehicle tuning; no independent envelope (FSC FOI-001, DFA DFI-14)
      ref: opendbc_repo/opendbc/safety/modes/toyota.h:172-177; opendbc_repo/opendbc/car/toyota/values.py:20-50
    detection_controls:
    - description: No test targets this cause
    occurrence: 6
    detection: 9
    ap: H
    actions:
    - SWF-ACT-003
  - id: SWF-001.C2
    description: Implementation defect in steer_torque_cmd_checks or dist_to_meas_check
    element: SWF-SE-006
    prevention_controls: &id001
    - description: MISRA C:2012 checks on the safety code
      ref: opendbc_repo/opendbc/safety/tests/misra
    - description: 100% line coverage enforced by the safety test runner
      ref: opendbc_repo/opendbc/safety/tests/test.sh
    - description: Upstream code review; no documented safety requirements for the safety model (tests derived from implementation)
    detection_controls: &id002
    - description: 'opendbc safety test suite (3173 pass, 390 skipped at BL-001 in this workspace). Mutation run at BL-001 in this workspace: 2705 operator mutants
        across opendbc/safety (incl. modes/toyota.h, lateral.h, longitudinal.h, safety.h), 2705 killed, 0 survived. Mutation covers operators only, not constants
        or deleted statements, and not panda board code. Not run by LionDriver CI'
      test: opendbc_repo/opendbc/safety/tests/test_toyota.py
      ref: opendbc_repo/opendbc/safety/tests/mutation.py; opendbc .github/workflows/tests.yml:39-56
    occurrence: 5
    detection: 6
    ap: H
    actions:
    - SWF-ACT-001
    - SWF-ACT-002
  - id: SWF-001.C3
    description: Wrong EPS torque factor in the host-supplied safety parameter scales measured torque, widening the measured-torque-error check
    element: SWF-SE-012
    prevention_controls:
    - description: Safety parameter accepted from the host without check (toyota.h:383; main_comms.h:223)
      ref: panda/board/main_comms.h
    detection_controls:
    - description: No test targets this cause
    occurrence: 8
    detection: 9
    ap: H
    actions:
    - SWF-ACT-004
- id: SWF-002
  element: SWF-SE-006
  function: SWF-FN-002
  failure_mode: Steering torque passed while controls are not allowed
  guideword: commission
  effects:
  - level: local
    description: Torque request reaches the EPS outside an engagement
  - level: next_higher
    description: Unexpected steering input
  - level: end
    description: Unintended steering while not engaged
    hazard: HZ-001
    severity: 10
  severity: 10
  causes:
  - id: SWF-002.C1
    description: Defect in the not-allowed torque check (lateral.h:111-114) or in controls_allowed bookkeeping
    element: SWF-SE-006
    prevention_controls: *id001
    detection_controls: *id002
    occurrence: 5
    detection: 6
    ap: H
    actions:
    - SWF-ACT-001
    - SWF-ACT-002
  notes: Depends on controls_allowed being correct; see SWF-007..SWF-009.
- id: SWF-003
  element: SWF-SE-007
  function: SWF-FN-003
  failure_mode: Acceleration request outside the intended envelope is passed
  guideword: value_high
  effects:
  - level: local
    description: Acceleration request beyond the item design reaches the powertrain
  - level: next_higher
    description: Vehicle accelerates or brakes harder than designed
  - level: end
    description: Unintended acceleration or excessive deceleration
    hazard: HZ-005
    severity: 10
  - level: end
    description: Contributes to HZ-006
    hazard: HZ-006
    severity: 10
  severity: 10
  causes:
  - id: SWF-003.C1
    description: Panda allows +2.0 m/s² while the SoC design limit for VF-001 is +1.5 m/s²; the panda bound is looser than the item design
    element: SWF-SE-008
    prevention_controls:
    - description: Panda limit taken from the platform maximum, not the vehicle envelope
      ref: opendbc_repo/opendbc/safety/modes/toyota.h:207-210
    detection_controls:
    - description: No test targets this cause
    occurrence: 6
    detection: 9
    ap: H
    actions:
