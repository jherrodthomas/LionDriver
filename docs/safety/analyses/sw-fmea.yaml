- id: SWF-ACT-001
  kind: detection
  description: Run the opendbc safety suite and the mutation tests as a blocking gate in LionDriver CI for every change and submodule bump
  owner: Jherrod Thomas
  status: open
  revised:
    severity: 10
    occurrence: 5
    detection: 3
    ap: H
- id: SWF-ACT-002
  kind: prevention
  description: Write technical safety requirements for the panda safety model (TSC) and requirements-based tests traced to them
  owner: Jherrod Thomas
  status: open
  revised:
    severity: 10
    occurrence: 3
    detection: 3
    ap: L
- id: SWF-ACT-003
  kind: design_change
  description: Derive steering and acceleration envelopes from vehicle measurements (FSC FOI-001, DFA DM-10) and set panda limits from them, independently of the
    SoC limits
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-004
  kind: design_change
  description: Implement the panda configuration lock (LD-DES-001 DR-01..DR-07, DR-05 for ELM327)
  owner: Jherrod Thomas
  status: decision_pending
- id: SWF-ACT-005
  kind: design_change
  description: Add an acceleration-rate (jerk) check to the panda longitudinal checks, or justify the absence with characterized powertrain rate limits (OI-002)
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-006
  kind: detection
  description: Verify on the vehicle that the PCM cancels cruise on brake (FSC FOI-006) so PCM_CRUISE can be credited as the diverse brake path; add a safety test
    for brake-without-cruise-cancel
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-007
  kind: design_change
  description: Derive RX-lag and heartbeat timeouts from the FTTI and check them at 8 Hz or faster while controls are allowed (LD-DES-001 DR-20)
  owner: Jherrod Thomas
  status: open
- id: SWF-ACT-008
  kind: detection
  description: Add a unit or static check that every host TX path calls can_send with skip_tx_hook=false
  owner: Jherrod Thomas
  status: open
