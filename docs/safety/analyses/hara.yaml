# yaml-language-server: $schema=../schema/hara.schema.json
#
# Hazard analysis and risk assessment (ISO 26262-3 clause 6).
# ASIL per ISO 26262-3 Table 4, checked by tools/safety/fmea_lint.py.
# Hazards are derived from the System FMEA end effects (sfm_refs); the FMEA effects link back via `hazard`.
schema_version: 1
analysis:
  id: HARA
  type: hara
  title: "HARA — LionDriver L2 ACC/ALC on 2020 Toyota Corolla LE (US)"
  doc_id: LD-HARA-001
  revision: "0.3"
  status: draft
  approver: Jherrod Thomas (pending)
  baseline: BL-001
  scope: >-
    The item is defined in LD-ITEM-001 (docs/safety/item-definition.md). This HARA covers assured configuration
    AC-001: variant family VF-001 (Toyota Corolla E210), 2020 Corolla LE sedan, US market, comma 3X, baseline
    BL-001. Extension to other VF-001 members or other vehicles requires a variant impact analysis
    (LD-ITEM-001 section A.10, IOI-002, IOI-004).
  method: >-
    Operational situations x hazards -> hazardous events, each rated S/E/C without credit for the
    item's own safety mechanisms; ASIL from ISO 26262-3 Table 4; one or more safety goals per hazard.
  team:
    - name: Jherrod Thomas
      role: Project maintainer, safety lead (reviewer/approver)
    - name: Claude (AI assistant)
      role: Drafting assistance; ratings require human review and confirmation review
  references:
    - docs/safety/item-definition.md
    - docs/safety/analyses/system-fmea.yaml
    - docs/safety/fmea-plan.md
    - docs/SAFETY.md
    - ISO 26262-3:2018 clause 6 and Annex B
  updated: 2026-10-10
  history:
    - {revision: "0.1", date: 2026-10-09, author: Claude (AI-assisted draft), change: Initial draft from System FMEA rev 0.2 end effects}
    - {revision: "0.2", date: 2026-10-10, author: Claude (AI-assisted draft), change: "Closed OI-009..OI-011 from pre-check: guide-word matrix, situation coverage, weather/night situations, HE-019"}
    - {revision: "0.3", date: 2026-10-10, author: Claude (AI-assisted draft), change: "Scope references item definition LD-ITEM-001; HARA applies to assured configuration AC-001"}

assumptions:
  - id: HA-001
    text: >-
      SAE Level 2. The driver is responsible for supervising and is expected to intervene. Controllability
      is rated for a typical driver including foreseeable inattention; the item's driver monitoring is not credited.
  - id: HA-002
    text: >-
      The item's own safety mechanisms (panda/opendbc safety model limits, excessive actuation check,
      driver monitoring, event reactions) are not credited (ISO 26262-3 6.4.2).
  - id: HA-003
    text: >-
      Actuation authority is bounded only by the vehicle's own ECUs (EPS acceptance of steering requests,
      powertrain/brake acceptance of acceleration requests). These external bounds are not yet characterized
      and are therefore not credited (OI-001, OI-002).
  - id: HA-004
    text: >-
      Vehicle and configuration per BL-001 (TSS2, openpilot longitudinal). Used on US public roads of all
      types; the item enforces no ODD restriction beyond what the vehicle and BL-001 software impose.
  - id: HA-005
    text: >-
      Exposure is estimated from typical US passenger-car use and is rounded up where data is lacking.
      No fleet data is used (OI-006).
  - id: HA-006
    text: >-
      Hazards arise from E/E malfunctions of the item. The same vehicle-level hazards caused by performance
      limitations without a fault are handled in the SOTIF analysis.

operational_situations:
  - id: OS-001
    description: Highway driving with traffic in adjacent lanes, item engaged
    road: highway
    speed: 80-130 km/h
    item_state: engaged
    exposure: E4
    exposure_rationale: Highway driving exceeds 10% of operating time for typical use; L2 use concentrates on highways.
  - id: OS-002
    description: Two-lane undivided road with oncoming traffic, item engaged
    road: rural
    speed: 50-100 km/h
    item_state: engaged
    exposure: E4
    exposure_rationale: No ODD restriction excludes undivided roads; rated E4 conservatively (OI-006).
  - id: OS-003
    description: Urban or suburban road with pedestrians, cyclists and parked vehicles, item engaged
    road: urban
    speed: 0-60 km/h
    item_state: engaged
    exposure: E4
    exposure_rationale: Urban driving exceeds 10% of operating time.
  - id: OS-004
    description: Stop-and-go traffic close behind a lead vehicle, item engaged
    road: any
    speed: 0-40 km/h
    item_state: engaged
    exposure: E3
    exposure_rationale: Congested traffic is 1-10% of operating time for typical use.
  - id: OS-005
    description: Curve requiring lateral acceleration above 1 m/s², item engaged
    road: any
    speed: 50-120 km/h
    item_state: engaged
    exposure: E4
    exposure_rationale: Curves occur on most trips; rated E4 conservatively (OI-006).
  - id: OS-006
    description: Manual driving at highway speed with adjacent traffic, item not engaged
    road: highway
    speed: 80-130 km/h
    item_state: not_engaged
    exposure: E4
    exposure_rationale: The item is powered whenever the vehicle is on; manual highway driving exceeds 10% of operating time.
  - id: OS-007
    description: Driver incapacitated (medical event) while item engaged
    road: any
    speed: 0-130 km/h
    item_state: engaged
    exposure: E1
    exposure_rationale: Driver incapacitation while driving is very rare.
  - id: OS-008
    description: Highway, item engaged, following vehicle within 2 s headway
    road: highway
    speed: 80-130 km/h
    item_state: engaged
    exposure: E4
    exposure_rationale: Short headways from following traffic are common in normal highway traffic (OI-006).
  - id: OS-009
    description: Driver must steer evasively around an obstacle, item engaged
    road: any
    speed: 50-130 km/h
    item_state: engaged
    exposure: E2
    exposure_rationale: Evasive maneuvers are rare (less than 1% of operating time, a few times per year).
  - id: OS-010
    description: Stopped or hard-braking lead vehicle requiring emergency braking
    road: any
    speed: 30-130 km/h
    item_state: any
    exposure: E2
    exposure_rationale: Emergency-braking situations occur a few times per year.
  - id: OS-011
    description: Highway, item engaged, approaching a slower lead that requires moderate deceleration
    road: highway
    speed: 60-130 km/h
    item_state: engaged
    exposure: E4
    exposure_rationale: Closing on slower traffic is routine in highway driving.
  - id: OS-012
    description: Driver brakes to slow or stop in normal traffic, item engaged
    road: any
    speed: 0-130 km/h
    item_state: engaged
    exposure: E4
    exposure_rationale: Driver braking is the normal way to end or adjust an engagement.
  - id: OS-013
    description: Wet road surface
    road: any
    speed: 0-130 km/h
    item_state: any
    exposure: E3
    exposure_rationale: Wet pavement is roughly 1-10% of operating time for typical US use (OI-006).
  - id: OS-014
    description: Snow- or ice-covered road
    road: any
    speed: 0-100 km/h
    item_state: any
    exposure: E2
    exposure_rationale: Below 1% of operating time averaged over US use; higher in snow-belt regions (sensitivity on HE-019, OI-006).
  - id: OS-015
    description: Night driving with headlights
    road: any
    speed: 0-130 km/h
    item_state: any
    exposure: E4
    exposure_rationale: More than 10% of driving takes place at night.

