safety_goals:
  - id: SG-001
    statement: Avoid steering intervention that the driver cannot counteract or that produces a lateral deviation the driver cannot correct.
    hazards: [HZ-001, HZ-002]
    asil: D
    safe_state: No steering request to the EPS (lateral control off) with driver warning.
    ftti_ms: null
    notes: >-
      Driven by HE-002. The comma 3X SoC is not developed to ISO 26262; the FSC will need an ASIL
      decomposition (e.g. an independent panda safety model) or a reduced rating via OI-001 (OI-008).
  - id: SG-002
    statement: Avoid lateral control steering the vehicle out of its lane while engaged.
    hazards: [HZ-003]
    asil: C
    safe_state: Lateral control off with driver warning.
    ftti_ms: null
  - id: SG-003
    statement: Avoid loss of lateral control, or misinformation about the automation state, without timely driver warning.
    hazards: [HZ-004, HZ-012]
    asil: B
    safe_state: Lateral and longitudinal control off with audible and visual takeover warning.
    ftti_ms: null
  - id: SG-004
    statement: Avoid unintended acceleration.
    hazards: [HZ-005]
    asil: C
    safe_state: No positive acceleration request (longitudinal control off) with driver warning.
    ftti_ms: null
  - id: SG-005
    statement: Avoid unintended or excessive deceleration.
    hazards: [HZ-006]
    asil: B
    safe_state: Deceleration request limited to comfort levels or longitudinal control off with driver warning.
    ftti_ms: null
    notes: Driven by HE-009 and HE-019 (snow/ice). Regional snow exposure could raise this goal to ASIL C (OI-006).
  - id: SG-006
    statement: Avoid insufficient deceleration for a lead vehicle while engaged.
    hazards: [HZ-007]
    asil: B
    safe_state: Longitudinal control off with takeover warning.
    ftti_ms: null
  - id: SG-007
    statement: Release automated control when the driver brakes or cancels, and do not resist driver steering.
    hazards: [HZ-008, HZ-009]
    asil: B
    safe_state: All actuation requests withdrawn.
    ftti_ms: null
  - id: SG-008
    statement: Avoid unintended engagement.
    hazards: [HZ-010]
    asil: B
    safe_state: Item remains disengaged.
    ftti_ms: null
  - id: SG-009
    statement: Do not degrade the availability of stock AEB/FCW.
    hazards: [HZ-011]
    asil: B
    safe_state: Stock ADAS camera messages pass through unmodified (relay closed to stock).
    ftti_ms: null
    notes: Rating depends on OI-003.
  - id: SG-010
    statement: Avoid continued automated control with an unresponsive driver.
    hazards: [HZ-013]
    asil: A
    safe_state: To be decided (OI-005) — options are disengage with warning, or a controlled stop in lane.
    ftti_ms: null

open_items:
  - id: OI-001
    status: open
    text: Characterize the Toyota EPS response to LKA torque requests (maximum accepted torque and rate, fault behavior). Determines whether the EPS can be credited as an external measure.
    affects: [HE-001, HE-002, HE-003, SG-001]
  - id: OI-002
    status: open
    text: Characterize powertrain and brake acceptance of acceleration requests (range, rate, override behavior).
    affects: [HE-007, HE-008, HE-009, SG-004, SG-005]
