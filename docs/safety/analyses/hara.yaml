hazardous_events:
  - id: HE-001
    hazard: HZ-001
    situation: OS-006
    consequence: Vehicle steered into adjacent traffic or off the road during manual highway driving
    severity: S3
    severity_rationale: Side or run-off-road collision at 80-130 km/h; life-threatening injuries likely.
    exposure_override: null
    controllability: C2
    controllability_rationale: >-
      Driver is actively steering with hands on the wheel and can counter the torque, but is surprised and
      the torque is bounded only by the EPS (HA-003). Normally controllable.
    asil: C
    sensitivity: If OI-001 shows the EPS bounds LKA torque low enough to be overpowered easily, C1 -> ASIL B.
  - id: HE-002
    hazard: HZ-002
    situation: OS-001
    consequence: Rapid lateral deviation into adjacent traffic or off the road at highway speed
    severity: S3
    severity_rationale: Collision with adjacent vehicle or roadside at highway speed.
    exposure_override: null
    controllability: C3
    controllability_rationale: >-
      An L2 driver may be hands-off or hands-light (HA-001). Without the item's limits (HA-002), deviation can
      exceed 1 m before a typical reaction completes (SAFETY.md: 1 m within 0.9 s is the controllability boundary).
    asil: D
    sensitivity: If OI-001 shows the EPS itself bounds torque/rate, C2 -> ASIL C.
  - id: HE-003
    hazard: HZ-002
    situation: OS-003
    consequence: Vehicle steered into a pedestrian, cyclist or parked vehicle at urban speed
    severity: S3
    severity_rationale: Vulnerable road user struck at up to 60 km/h.
    exposure_override: null
    controllability: C2
    controllability_rationale: Lower speed gives the driver more time and distance to correct.
    asil: C
  - id: HE-004
    hazard: HZ-003
    situation: OS-002
    consequence: Vehicle drifts into the oncoming lane on an undivided road
    severity: S3
    severity_rationale: Frontal collision with combined speeds above 100 km/h.
    exposure_override: null
    controllability: C2
    controllability_rationale: >-
      Deviation at normal intervention magnitude develops over seconds; most drivers correct it, but foreseeable
      inattention (HA-001) prevents C1.
    asil: C
  - id: HE-005
    hazard: HZ-003
    situation: OS-005
    consequence: Vehicle leaves the lane in a curve; run-off-road or collision
    severity: S3
    severity_rationale: Run-off-road or collision at 50-120 km/h.
    exposure_override: null
    controllability: C2
    controllability_rationale: As HE-004; the curve shortens the available reaction distance.
    asil: C
  - id: HE-006
    hazard: HZ-004
    situation: OS-005
    consequence: Vehicle runs wide in a curve after lateral control is lost without warning
    severity: S3
    severity_rationale: Run-off-road or collision at 50-120 km/h.
    exposure_override: null
    controllability: C1
    controllability_rationale: >-
      Loss of assist torque is passive: the vehicle continues on its current curvature and departs gradually.
      The change is felt at the wheel and seen; simply controllable for a supervising driver.
    asil: B
    sensitivity: If inattentive hands-off use is shown to be typical (OI-006), C2 -> ASIL C.
  - id: HE-007
    hazard: HZ-005
    situation: OS-004
    consequence: Low-speed rear-end collision with the lead vehicle in stop-and-go traffic
    severity: S2
    severity_rationale: Delta-v up to about 30 km/h; severe injuries possible, survival probable.
    exposure_override: null
    controllability: C2
    controllability_rationale: Driver can brake; short gap leaves little time.
    asil: A
  - id: HE-008
    hazard: HZ-005
    situation: OS-011
    consequence: Vehicle accelerates toward a slower lead at highway speed
    severity: S3
    severity_rationale: High-speed rear-end collision.
    exposure_override: null
    controllability: C2
    controllability_rationale: Driver can brake (brake overrides acceleration in the vehicle); acceleration is noticeable.
    asil: C
    sensitivity: If OI-002 shows the powertrain limits requested acceleration to low values, C1 -> ASIL B.
  - id: HE-009
    hazard: HZ-006
    situation: OS-008
    consequence: Hard braking at highway speed causes a rear-end collision by the following vehicle
    severity: S2
    severity_rationale: Rear impact with moderate delta-v; occupants protected by rear structure and seats.
    exposure_override: null
    controllability: C2
    controllability_rationale: Following driver must react; own driver can press the accelerator to override.
    asil: B
    sensitivity: If OI-002 shows the vehicle limits requested deceleration well below emergency levels, C1 -> ASIL A.
  - id: HE-010
    hazard: HZ-007
    situation: OS-011
    consequence: Vehicle closes on a slower lead without adequate braking
    severity: S3
    severity_rationale: High-speed rear-end collision if the driver does not intervene.
    exposure_override: null
    controllability: C1
    controllability_rationale: Closing on a visible lead is gradual; a supervising driver brakes as in manual driving.
    asil: B
  - id: HE-011
    hazard: HZ-007
    situation: OS-010
    consequence: Item does not brake enough for a stopped or hard-braking lead
    severity: S3
    severity_rationale: Rear-end collision at up to highway speed.
    exposure_override: null
    controllability: C2
    controllability_rationale: Driver must recognize that the item is not braking and brake hard; time is short.
    asil: A
  - id: HE-012
    hazard: HZ-008
    situation: OS-012
    consequence: Item keeps requesting acceleration or steering while the driver brakes
    severity: S2
    severity_rationale: Longer stopping distance; collision at reduced speed.
    exposure_override: null
    controllability: C1
    controllability_rationale: Service brakes still act; driver can brake harder or use the cancel button.
    asil: A
  - id: HE-013
    hazard: HZ-008
    situation: OS-010
    consequence: Emergency braking by the driver is weakened by continued acceleration request
    severity: S3
    severity_rationale: Collision at higher speed than with full driver braking.
    exposure_override: null
    controllability: C2
    controllability_rationale: Brakes dominate engine torque, but the stopping distance in an emergency increases.
    asil: A
  - id: HE-014
    hazard: HZ-009
    situation: OS-009
    consequence: Driver's evasive steering is resisted; obstacle hit or maneuver fails
    severity: S3
    severity_rationale: Collision with the obstacle at 50-130 km/h.
    exposure_override: null
    controllability: C3
    controllability_rationale: Evasive maneuvers need full, fast steering input; any resisting torque lowers the success rate below 90%.
    asil: B
  - id: HE-015
    hazard: HZ-010
    situation: OS-006
    consequence: Item engages unexpectedly during manual highway driving and changes speed or steering
    severity: S3
    severity_rationale: Unexpected speed change or steering at highway speed can lead to collision.
    exposure_override: null
    controllability: C1
    controllability_rationale: Nominal engaged behavior is lane keeping and set-speed following; the driver overrides with brake or steering.
    asil: B
  - id: HE-016
    hazard: HZ-011
    situation: OS-010
    consequence: Stock AEB does not act in a situation where the driver brakes too late
    severity: S3
    severity_rationale: Rear-end collision at speed.
    exposure_override:
      exposure: E2
      rationale: Only the subset of emergency-braking situations where the driver is late; kept at E2 conservatively.
    controllability: C3
    controllability_rationale: By definition these are situations the driver did not control; AEB is the remaining barrier.
    asil: B
    sensitivity: Depends entirely on OI-003. If stock AEB is unaffected by the installation, HZ-011 has no hazardous event.
  - id: HE-017
    hazard: HZ-012
    situation: OS-005
    consequence: Driver believes the item is steering (or is not warned of handback) in a curve; vehicle runs wide
    severity: S3
    severity_rationale: Run-off-road or collision at 50-120 km/h.
    exposure_override: null
    controllability: C1
    controllability_rationale: Same vehicle behavior as HE-006; the departure is gradual and visible.
    asil: B
  - id: HE-018
    hazard: HZ-013
    situation: OS-007
    consequence: Vehicle continues under automation with no capable driver until it meets a situation outside its capability
    severity: S3
    severity_rationale: Eventual uncontrolled collision or road departure.
    exposure_override: null
    controllability: C3
    controllability_rationale: No driver is available to control.
    asil: A
  - id: HE-019
    hazard: HZ-006
    situation: OS-014
    consequence: Unexpected hard braking on snow or ice destabilizes the vehicle or causes a rear-end collision
    severity: S3
    severity_rationale: Loss of stability at speed on low friction can lead to a spin into other traffic.
    exposure_override: null
    controllability: C3
    controllability_rationale: Low friction leaves little margin to recover from unexpected hard braking; following drivers are also on low friction.
    asil: B
    sensitivity: Where snow/ice exceeds 1% of operating time (snow-belt use), E3 -> ASIL C, which would raise SG-005 to C (OI-006).

