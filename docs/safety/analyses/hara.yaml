    sfm_refs: [SFM-010, SFM-011, SFM-012]
  - id: HZ-008
    description: Automated control not released when the driver brakes or cancels
    guidewords: [M01, M02, M04, M06, M08, M11, M12]
    functions: [SFM-FN-003, SFM-FN-004]
    sfm_refs: [SFM-017, SFM-019]
  - id: HZ-009
    description: Item resists driver steering input
    guidewords: [M01, M02, M06, M08, M09, M11, M12, M13, M14]
    functions: [SFM-FN-004]
    sfm_refs: [SFM-018]
  - id: HZ-010
    description: Unintended engagement
    guidewords: [M03, M07, M12]
    functions: [SFM-FN-003]
    sfm_refs: [SFM-013]
  - id: HZ-011
    description: Stock AEB/FCW unavailable or degraded while the item is installed
    guidewords: [M01, M02, M04, M06, M08, M09, M11, M13]
    functions: [SFM-FN-008]
    sfm_refs: [SFM-033, SFM-034]
  - id: HZ-012
    description: Driver misinformed about automation state (missing or late handback warning, wrong displayed state, stock cruise active unknowingly)
    guidewords: [M01, M02, M04, M06, M08, M09, M10, M11, M12, M13]
    functions: [SFM-FN-003, SFM-FN-004, SFM-FN-006]
    sfm_refs: [SFM-021, SFM-026, SFM-027, SFM-028]
  - id: HZ-013
    description: Automated control continues with an inattentive or unresponsive driver
    guidewords: [M01, M02, M04, M06, M08, M09, M11, M12, M14]
    functions: [SFM-FN-005]
    sfm_refs: [SFM-022, SFM-023, SFM-025]

# Function x guide word matrix (closes OI-009). Hazard functions/guidewords above are derived from it; the linter checks both agree.
guideword_analysis:
  - {function: SFM-FN-001, guideword: M01, classification: SC, hazards: [HZ-004], rationale: "Engaged but no steering from the start; driver expects assist and the vehicle departs the lane."}
  - {function: SFM-FN-001, guideword: M02, classification: SC, hazards: [HZ-004], rationale: "Steering assist stops mid-drive without warning (SFM-005)."}
  - {function: SFM-FN-001, guideword: M03, classification: SC, hazards: [HZ-001], rationale: "Steering torque while not engaged (SFM-001)."}
  - {function: SFM-FN-001, guideword: M04, classification: SC, hazards: [HZ-003], rationale: "Torque request frozen at last value; vehicle leaves the lane (SFM-006)."}
  - {function: SFM-FN-001, guideword: M05, classification: SC, hazards: [HZ-002], rationale: "Torque or torque rate above what was commanded (SFM-002)."}
  - {function: SFM-FN-001, guideword: M06, classification: SC, hazards: [HZ-004], rationale: "Assist below what the road geometry requires; drift to lane edge (SFM-004)."}
  - {function: SFM-FN-001, guideword: M07, classification: SC, hazards: [HZ-003], rationale: "Premature lane change or curve entry; deviation at normal magnitude toward an occupied lane or the road edge."}
  - {function: SFM-FN-001, guideword: M08, classification: SC, hazards: [HZ-004], rationale: "Correction applied after the vehicle is already drifting; equivalent to reduced lateral control."}
  - {function: SFM-FN-001, guideword: M09, classification: SC, hazards: [HZ-004], subsumed_by: M06, rationale: "Torque pulses shorter than commanded give the same response as partial assist."}
  - {function: SFM-FN-001, guideword: M10, classification: SC, hazards: [HZ-003], rationale: "Torque persists after curve exit; vehicle steers toward the opposite boundary."}
  - {function: SFM-FN-001, guideword: M11, classification: SC, hazards: [HZ-004], subsumed_by: M08, rationale: "Latency beyond specification produces the same late correction as M08."}
  - {function: SFM-FN-001, guideword: M12, classification: SC, hazards: [HZ-003], rationale: "Steering opposite to the required correction (SFM-003)."}
  - {function: SFM-FN-001, guideword: M13, classification: SC, hazards: [HZ-002], rationale: "Oscillating torque; without crediting item limits (HA-002) the amplitude is bounded only by the EPS, so it is treated as excessive intervention."}
  - {function: SFM-FN-001, guideword: M14, classification: SC, hazards: [HZ-003], rationale: "Asymmetric left/right response pulls the vehicle toward one boundary."}
  - {function: SFM-FN-002, guideword: M01, classification: SC, hazards: [HZ-007], rationale: "Engaged but no braking for a lead from the start."}
  - {function: SFM-FN-002, guideword: M02, classification: SC, hazards: [HZ-007], rationale: "Longitudinal control stops while engaged without warning (SFM-011)."}
  - {function: SFM-FN-002, guideword: M03, classification: SC, hazards: [HZ-005, HZ-006], rationale: "Acceleration or braking not commanded by the planner (SFM-008, SFM-009)."}
  - {function: SFM-FN-002, guideword: M04, classification: SC, hazards: [HZ-005, HZ-006, HZ-007], rationale: "Request frozen: positive value is unintended acceleration, negative is unintended braking, zero is no braking for a lead."}
  - {function: SFM-FN-002, guideword: M05, classification: SC, hazards: [HZ-005, HZ-006], rationale: "Acceleration or deceleration magnitude above command."}
  - {function: SFM-FN-002, guideword: M06, classification: SC, hazards: [HZ-007], rationale: "Deceleration below what the lead requires (SFM-010)."}
  - {function: SFM-FN-002, guideword: M07, classification: SC, hazards: [HZ-005, HZ-006], rationale: "Resume from standstill before the lead moves (acceleration), or braking before it is needed (deceleration)."}
  - {function: SFM-FN-002, guideword: M08, classification: SC, hazards: [HZ-007], rationale: "Late reaction to lead braking (SFM-012)."}
  - {function: SFM-FN-002, guideword: M09, classification: SC, hazards: [HZ-007, HZ-005], rationale: "Braking released too early, including standstill hold releasing so the vehicle creeps into the lead."}
  - {function: SFM-FN-002, guideword: M10, classification: SC, hazards: [HZ-005, HZ-006], rationale: "Acceleration or braking continues after it is no longer needed."}
  - {function: SFM-FN-002, guideword: M11, classification: SC, hazards: [HZ-007], subsumed_by: M08, rationale: "Latency beyond specification produces the same late braking as M08."}
  - {function: SFM-FN-002, guideword: M12, classification: SC, hazards: [HZ-005, HZ-006], rationale: "Acceleration when deceleration is required, or the reverse."}
  - {function: SFM-FN-002, guideword: M13, classification: SC, hazards: [HZ-006, HZ-005], rationale: "Surging or jerky requests; braking surges risk rear-end collisions by following traffic."}
  - {function: SFM-FN-002, guideword: M14, classification: NA, rationale: "The item requests a single longitudinal acceleration; per-wheel distribution is done by the vehicle brake system outside the item."}
  - {function: SFM-FN-003, guideword: M01, classification: NSC, rationale: "Item never engages: unavailability with no engagement indication; the driver keeps driving manually."}
  - {function: SFM-FN-003, guideword: M02, classification: SC, hazards: [HZ-008, HZ-002, HZ-005], rationale: "State machine stops evaluating events while engaged: driver brake and fault reactions are no longer processed (SFM-014)."}
  - {function: SFM-FN-003, guideword: M03, classification: SC, hazards: [HZ-010], rationale: "Engagement without a driver request (SFM-013)."}
  - {function: SFM-FN-003, guideword: M04, classification: SC, hazards: [HZ-008], rationale: "State stuck in engaged: driver cannot end the engagement."}
  - {function: SFM-FN-003, guideword: M05, classification: NA, rationale: "Engagement is a discrete state; magnitude does not apply."}
  - {function: SFM-FN-003, guideword: M06, classification: SC, hazards: [HZ-012], rationale: "Partial engagement (e.g. lateral active, longitudinal not) without matching indication."}
  - {function: SFM-FN-003, guideword: M07, classification: SC, hazards: [HZ-010, HZ-003], rationale: "Engagement before entry conditions are met (e.g. calibration incomplete); lateral control runs on invalid inputs."}
  - {function: SFM-FN-003, guideword: M08, classification: SC, hazards: [HZ-002, HZ-005], rationale: "Disengagement later than the fault requires; faulty actuation continues (SFM-016)."}
  - {function: SFM-FN-003, guideword: M09, classification: SC, hazards: [HZ-004], rationale: "Engagement ends earlier than intended; hazardous only without warning (SFM-015)."}
  - {function: SFM-FN-003, guideword: M10, classification: SC, hazards: [HZ-002, HZ-005], subsumed_by: M08, rationale: "Remaining engaged too long gives the same response as late disengagement."}
  - {function: SFM-FN-003, guideword: M11, classification: SC, hazards: [HZ-002, HZ-005], subsumed_by: M08, rationale: "Latency in fault reaction gives the same response as M08."}
  - {function: SFM-FN-003, guideword: M12, classification: SC, hazards: [HZ-010, HZ-008], rationale: "Engages on a cancel request or disengages on an engage request."}
  - {function: SFM-FN-003, guideword: M13, classification: SC, hazards: [HZ-012, HZ-004], rationale: "Rapid engage/disengage toggling confuses the driver and interrupts lateral control."}
  - {function: SFM-FN-003, guideword: M14, classification: NA, rationale: "Engagement is a discrete state; an uneven profile does not apply."}
  - {function: SFM-FN-004, guideword: M01, classification: SC, hazards: [HZ-008, HZ-009], rationale: "Brake/cancel does not release and steering input is not yielded to (SFM-017, SFM-018, SFM-019)."}
  - {function: SFM-FN-004, guideword: M02, classification: SC, hazards: [HZ-008, HZ-009], subsumed_by: M01, rationale: "Override handling that stops during a drive gives the same response as M01."}
  - {function: SFM-FN-004, guideword: M03, classification: SC, hazards: [HZ-004], rationale: "Override detected without driver input; lateral control pauses, hazardous when not indicated."}
  - {function: SFM-FN-004, guideword: M04, classification: SC, hazards: [HZ-004, HZ-012], rationale: "Override stuck active: lateral control stays paused while the driver may believe it is active."}
  - {function: SFM-FN-004, guideword: M05, classification: SC, hazards: [HZ-004], subsumed_by: M03, rationale: "Over-sensitive override detection gives the same response as M03."}
  - {function: SFM-FN-004, guideword: M06, classification: SC, hazards: [HZ-008, HZ-009], rationale: "Partial release: e.g. longitudinal released on brake but lateral torque continues, or steering torque reduced but not removed."}
  - {function: SFM-FN-004, guideword: M07, classification: SC, hazards: [HZ-004], subsumed_by: M03, rationale: "Override detected before the driver intends gives the same response as M03."}
  - {function: SFM-FN-004, guideword: M08, classification: SC, hazards: [HZ-008, HZ-009], rationale: "Release or yield delayed after the driver acts."}
  - {function: SFM-FN-004, guideword: M09, classification: SC, hazards: [HZ-009], rationale: "Override ends while the driver is still steering; the item resumes against the driver."}
  - {function: SFM-FN-004, guideword: M10, classification: SC, hazards: [HZ-004], rationale: "Override held after the driver lets go; lateral control does not resume and the driver may not notice."}
  - {function: SFM-FN-004, guideword: M11, classification: SC, hazards: [HZ-008, HZ-009], subsumed_by: M08, rationale: "Latency gives the same response as M08."}
  - {function: SFM-FN-004, guideword: M12, classification: SC, hazards: [HZ-009, HZ-008], rationale: "Item increases actuation when the driver intervenes."}
  - {function: SFM-FN-004, guideword: M13, classification: SC, hazards: [HZ-009], rationale: "Override flickering switches torque on and off while the driver steers."}
  - {function: SFM-FN-004, guideword: M14, classification: SC, hazards: [HZ-009], rationale: "Asymmetric override threshold; the item resists steering in one direction."}
  - {function: SFM-FN-005, guideword: M01, classification: SC, hazards: [HZ-013], rationale: "Inattentive or unresponsive driver not detected (SFM-022)."}
  - {function: SFM-FN-005, guideword: M02, classification: SC, hazards: [HZ-013], subsumed_by: M01, rationale: "Monitoring that stops during a drive gives the same response as M01."}
  - {function: SFM-FN-005, guideword: M03, classification: NSC, rationale: "False distraction alerts: nuisance and possible lockout; the item becomes more conservative (SFM-024, S 4)."}
  - {function: SFM-FN-005, guideword: M04, classification: SC, hazards: [HZ-013], subsumed_by: M01, rationale: "Awareness frozen at attentive gives the same response as M01."}
  - {function: SFM-FN-005, guideword: M05, classification: NSC, subsumed_by: M03, rationale: "Over-sensitive monitoring gives the same response as M03."}
  - {function: SFM-FN-005, guideword: M06, classification: SC, hazards: [HZ-013], rationale: "Only some distraction types detected (e.g. phone use missed)."}
  - {function: SFM-FN-005, guideword: M07, classification: NSC, subsumed_by: M03, rationale: "Alert before the distraction threshold gives the same response as M03."}
  - {function: SFM-FN-005, guideword: M08, classification: SC, hazards: [HZ-013], rationale: "Escalation slower than designed (SFM-023)."}
  - {function: SFM-FN-005, guideword: M09, classification: SC, hazards: [HZ-013], rationale: "Alert ends before the driver can respond, so escalation is not noticed."}
  - {function: SFM-FN-005, guideword: M10, classification: NSC, rationale: "Alert persists after the driver is attentive: nuisance only."}
  - {function: SFM-FN-005, guideword: M11, classification: SC, hazards: [HZ-013], subsumed_by: M08, rationale: "Latency gives the same response as M08."}
  - {function: SFM-FN-005, guideword: M12, classification: SC, hazards: [HZ-013], subsumed_by: M01, rationale: "Attentive and distracted swapped; the hazardous half is the same as M01, the other half is M03."}
  - {function: SFM-FN-005, guideword: M13, classification: NSC, rationale: "Flickering alerts: nuisance and reduced trust; escalation still proceeds."}
  - {function: SFM-FN-005, guideword: M14, classification: SC, hazards: [HZ-013], rationale: "Detection performance uneven across drivers, eyewear or lighting; overlaps SOTIF / ISO PAS 8800."}
  - {function: SFM-FN-006, guideword: M01, classification: SC, hazards: [HZ-012], rationale: "Takeover or disengagement alert not presented (SFM-026)."}
  - {function: SFM-FN-006, guideword: M02, classification: SC, hazards: [HZ-012], subsumed_by: M01, rationale: "Alerting that stops during a drive gives the same response as M01."}
  - {function: SFM-FN-006, guideword: M03, classification: NSC, rationale: "Unneeded takeover alert prompts the driver to take control, which is the safe action; nuisance (S 4)."}
  - {function: SFM-FN-006, guideword: M04, classification: SC, hazards: [HZ-012], rationale: "Display frozen on a stale state, e.g. still showing engaged."}
  - {function: SFM-FN-006, guideword: M05, classification: NSC, rationale: "Alert louder or more prominent than needed: startle and annoyance only."}
  - {function: SFM-FN-006, guideword: M06, classification: SC, hazards: [HZ-012], rationale: "Only one channel presented (e.g. visual without audible); a driver looking at the road misses it."}
  - {function: SFM-FN-006, guideword: M07, classification: NSC, rationale: "Alert earlier than needed gives the driver more time."}
  - {function: SFM-FN-006, guideword: M08, classification: SC, hazards: [HZ-012], rationale: "Alert presented late (SFM-027)."}
  - {function: SFM-FN-006, guideword: M09, classification: SC, hazards: [HZ-012], rationale: "Alert too brief to be noticed."}
  - {function: SFM-FN-006, guideword: M10, classification: SC, hazards: [HZ-012], subsumed_by: M04, rationale: "Alert persisting after the state changed gives the same response as a stale display."}
  - {function: SFM-FN-006, guideword: M11, classification: SC, hazards: [HZ-012], subsumed_by: M08, rationale: "Latency gives the same response as M08."}
