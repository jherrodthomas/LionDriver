  - {function: SFM-FN-007, guideword: M11, classification: SC, hazards: [HZ-002, HZ-005, HZ-006], subsumed_by: M08, rationale: "Latency gives the same response as M08."}
  - {function: SFM-FN-007, guideword: M12, classification: SC, hazards: [HZ-002, HZ-005, HZ-006], rationale: "Sign error: limit applied in the wrong direction, out-of-limit requests pass in the other."}
