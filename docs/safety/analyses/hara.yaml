  - id: HZ-005
    description: Unintended acceleration
    guidewords: [M03, M01, M02, M04, M05, M06, M07, M08, M09, M10, M11, M12, M13]
    functions: [SFM-FN-002, SFM-FN-003, SFM-FN-007]
    sfm_refs: [SFM-008, SFM-014, SFM-016, SFM-029, SFM-030, SFM-032]
  - id: HZ-006
    description: Unintended or excessive deceleration
    guidewords: [M03, M01, M02, M04, M05, M06, M07, M08, M09, M10, M11, M12, M13]
    functions: [SFM-FN-002, SFM-FN-007, SFM-FN-008]
    sfm_refs: [SFM-009, SFM-014, SFM-020, SFM-029, SFM-030, SFM-032, SFM-034]
  - id: HZ-007
    description: Insufficient or late deceleration for a lead vehicle while engaged
    guidewords: [M06, M01, M02, M03, M04, M05, M08, M09, M10, M11]
