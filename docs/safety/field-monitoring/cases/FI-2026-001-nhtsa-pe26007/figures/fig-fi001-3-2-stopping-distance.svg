<title>Figure 3-2 · The distance openpilot needs to stop</title>
<desc>Stopping distance from confirmation, at the openpilot cap and at full braking: 72 km/h: 67 m against 35 m; 90 km/h: 102 m against 52 m; 108 km/h: 144 m against 71 m; 126 km/h: 193 m against 94 m.</desc>
